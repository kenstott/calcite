  source: owner observations 2026-10-08
  tests: []

- id: SNOW-046
  module: servicenow
  status: accepted
  group: harness
  category: Invalid field names
  priority: MUST
  type: behavioral
  description: >
    The harness records what the instance does with a query on a field that does not exist
