# ===================================== catalog =================================================

- id: SNOW-010
  module: servicenow
  status: in-progress
  group: catalog
  category: Discovery
  priority: MUST
  type: structural
  description: >
    Tables and columns come from the instance's own metadata (sys_db_object, sys_dictionary,
    sys_glide_object), with inherited columns resolved. No table list is hard-coded, and columns
    are never guessed from sample rows.
    [SUPERSEDED by SNOW-010, 2026-10-12 -- the operand now names the registered tables, the only
    ones exposed. Kept here for history; do not implement against it.]
    An optional include list narrows the tables exposed.
    [END SUPERSEDED BLOCK]
    (Amended 2026-10-12, listing and registration:) An instance has thousands of tables, grouped
    into themes, and a steward must be able to tell them apart. The schema always holds two
    listing tables. _servicenow_tables(name, label, theme) lists every table the instance has,
    however many, from one keyset-paged read of sys_db_object; its theme is the name of the
    package that delivers the table (the sys_package reference's display value), "(no package)"
    for a table no package delivers, and "(unnamed package <sys_id>)" for a package whose name is
    empty, one group per package. It reads no column metadata. _servicenow_columns(table_name,
    column_name, data_type, ordinal_position) gives the columns of the one table a query names
    with table_name = '<table>', read from that table's and its ancestors' sys_dictionary rows
    only, and refuses a query that names no table. A table's column metadata is read only when
    that table is selected for registration or queried. The tables operand names the registered
    tables, which alone become SQL tables; without it the schema holds only the two listing
    tables, because a host such as the pgwire server reads the columns of every SQL table when
    it starts.
  source: "owner decisions 2026-10-07 and 2026-10-12 (theme = sys_package, name + label, columns resolved only on selection, operand = registered tables); branch feat/servicenow-adapter (CatalogTest, ServiceNowSqlTest)"
  tests: []

- id: SNOW-011
  module: servicenow
  status: accepted
  group: catalog
  category: Schema layout
  priority: SHOULD
  type: structural
  description: >
    One SQL schema per application scope remains possible. Whether tables are grouped that way is
    decided after a live instance has shown how many tables each scope holds and whether the
    scopes are natural subdivisions.
    (Amended 2026-10-12, counted on dev453859:) Scopes are not natural subdivisions: of the 6,554
    tables the integration user can read, 82% are in the Global scope, incident, change_request
    and sys_user among them.
    Tables stay in one SQL schema and are grouped by package as their theme (SNOW-010).
  source: "owner decisions 2026-10-07 (count tables per scope before deciding) and 2026-10-12 (theme = package); count of sys_db_object by sys_scope on dev453859, 2026-10-12"
  tests: []

- id: SNOW-012
  module: servicenow
  status: in-progress
  group: catalog
  category: Reference fields
  priority: MUST
  type: structural
  description: >
    A reference field is two columns: one holding the referenced record's sys_id and one holding
    its display value.
  source: "owner decision 2026-10-07 (both); branch feat/servicenow-adapter (<field> and <field>__display; ServiceNowSqlTest, ValueConverterTest)"
  tests: []

- id: SNOW-013
  module: servicenow
  status: in-progress
  group: catalog
  category: Nulls
  priority: MUST
  type: structural
  description: >
    An empty value from ServiceNow is SQL NULL for every column type, strings included; the
    adapter never returns the empty string. Every column is declared nullable, sys_id included.
  source: owner decision 2026-10-08; branch feat/servicenow-adapter (ValueConverterTest)
  tests: []

- id: SNOW-014
  module: servicenow
  status: in-progress
  group: catalog
  category: Type mapping
  priority: MUST
  type: constraint
  description: >
    A field whose type the adapter cannot map is an error naming the table, field and type, on the
    table it belongs to; it is not coerced to text. Leaving such columns out is an explicit
    configuration choice.
  source: branch feat/servicenow-adapter (CatalogTest, ValueConverterTest; excludeColumnTypes)
  tests: []

# ===================================== read ====================================================

- id: SNOW-020
  module: servicenow
  status: in-progress
  group: read
  category: Paging
  priority: MUST
  type: constraint
  description: >
    A scan reads pages until one comes back empty. A page that does not advance past the previous
    page's last key, a response that is HTML with status 200, and truncated JSON are each an
    error; none ends the scan quietly or repeats rows.
  source: branch feat/servicenow-adapter (TableApiClientTest)
  tests: []

- id: SNOW-021
  module: servicenow
  status: in-progress
  group: read
  category: Rate limiting
  priority: MUST
  type: constraint
  description: >
    A rate-limit response (429) is retried only as its Retry-After allows and within a bounded
    number of retries and a bounded total wait; beyond that it is an error carrying the server's
    message.
  source: branch feat/servicenow-adapter (TableApiClientTest)
  tests: []

- id: SNOW-022
  module: servicenow
  status: in-progress
  group: read
  category: LIMIT and ORDER BY
  priority: MUST
  type: constraint
  description: >
    LIMIT and ORDER BY are not sent to ServiceNow. A limit stops the page fetches early and is
    applied after every filter, pushed or not, so it never cuts off rows that a filter still to be
    evaluated would have removed.
  source: "owner decision 2026-10-07 (a limit is pushed only when every filter was pushed and verified); branch feat/servicenow-adapter (ServiceNowSqlTest)"
  tests: []

- id: SNOW-023
  module: servicenow
  status: in-progress
  group: read
  category: Projection
  priority: SHOULD
  type: behavioral
  description: >
    Only the columns a query selects are requested from ServiceNow, and a reference field's
    display value is requested only when its display column is selected.
  source: branch feat/servicenow-adapter (ServiceNowSqlTest)
  tests: []

# ===================================== pushdown ================================================

- id: SNOW-030
  module: servicenow
  status: in-progress
  group: pushdown
  category: Verified only
  priority: MUST
  type: constraint
  description: >
    A filter is sent to ServiceNow only when every capability entry it needs (operator, column
    type, and position inside an AND or an OR group) has been verified by the differential harness
    on a live instance. Otherwise the whole filter is evaluated by Calcite. An unverified entry is
    never pushed silently. Trusting named entries without a record is an explicit configuration
    choice that is logged.
  source: "owner decision 2026-10-07 (probe predicate semantics, push only what is proven); branch feat/servicenow-adapter (EncodedQueryTranslatorTest)"
  tests: []

- id: SNOW-031
  module: servicenow
  status: in-progress
  group: pushdown
  category: Field names
  priority: MUST
  type: constraint
  description: >
    A field name is checked against the discovered metadata before a term naming it is pushed.
    The adapter never relies on ServiceNow to reject an unknown field, because ServiceNow can drop
    the term and return unfiltered rows.
  source: owner statement 2026-10-08; branch feat/servicenow-adapter (EncodedQueryTranslatorTest)
  tests: []

- id: SNOW-032
  module: servicenow
  status: in-progress
  group: pushdown
  category: Null tests
  priority: MUST
  type: behavioral
  description: >
    IS NULL is pushed as ServiceNow's ISEMPTY and IS NOT NULL as ISNOTEMPTY. A literal empty
    string in a predicate (= '', <> '', IN ('', ...)) is never pushed as an empty test: under SQL
    no row equals '' once empties are NULL, so it must not match the empty rows.
  source: owner decision 2026-10-08; branch feat/servicenow-adapter (EncodedQueryTranslatorTest)
  tests: []

- id: SNOW-033
  module: servicenow
  status: in-progress
  group: pushdown
  category: Negation
  priority: MUST
  type: behavioral
  description: >
    A negated operator (<>, NOT IN, NOT LIKE) is pushed only in a form whose result matches SQL
    three-valued logic, where a NULL row satisfies neither the comparison nor its negation: if
    ServiceNow's form includes empty rows, it is pushed with an added not-empty term or not at all.
  source: "owner decision 2026-10-08; branch feat/servicenow-adapter (NE_NOT_EMPTY and NOT_IN_NOT_EMPTY entries; EncodedQueryTranslatorTest; NOT LIKE is never pushed)"
  tests: []

- id: SNOW-034
  module: servicenow
  status: in-progress
  group: pushdown
  category: Record scope
  priority: MUST
  type: constraint
  description: >
    A verification record is used only for the instance it was made on, and can be written only by
    a harness run against a live instance, never by a run against the local stub.
  source: branch feat/servicenow-adapter (PushdownHarnessTest)
  tests: []

# ===================================== harness =================================================

- id: SNOW-040
  module: servicenow
  status: in-progress
  group: harness
  category: Differential test
  priority: MUST
  type: infrastructure
  description: >
    A harness decides each capability entry by running the same predicate twice over the same
    table, once pushed to ServiceNow and once fetched unfiltered and evaluated by Calcite with SQL
    three-valued logic and empties as NULL, and comparing the two sets of record ids. Equal sets
    verify the entry; unequal sets record the differing rows and leave it unpushed.
  source: "owner instruction 2026-10-08; branch feat/servicenow-adapter (PushdownHarness, PushdownCases; offline plumbing in PushdownHarnessTest; PushdownHarnessLiveTest has not been run)"
  tests: []

