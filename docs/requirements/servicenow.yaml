  source: owner observations 2026-10-08
  tests: []

- id: SNOW-048
  module: servicenow
  status: accepted
  group: harness
  category: Live seeding
  priority: MUST
  type: constraint
  description: >
    The rows the live harness needs are written by the harness itself with direct REST calls,
