# AskAmerica — requirements ledger. Schema: README.md.
#
# Unit of work = a capability of AskAmerica as it is distributed: the engine
# (askamerica-engine) and the pg-wire server bundle it installs and starts (pgwire-govdata,
# built by .github/workflows/pgwire-adapters-release.yml). The source is the owner's decisions.
#
#   accepted = an owner decision with no implementation, or one not yet proven by a test.

# ===================================== platforms ===============================================

- id: ASKAM-001
  module: askamerica
  status: accepted
  group: platforms
  category: NixOS
  priority: MUST
  type: infrastructure
  description: >
    AskAmerica is supported on NixOS: its engine and its pg-wire server install and start on a
    NixOS host and serve as they do on other Linux hosts, with what the host must provide
    stated. The host provides nix-ld with the libraries the bundle's runtimes link against, and
    a PATH carrying bash, coreutils and tar for the process that starts the server; that list
    is published as a ready-made NixOS configuration snippet. The bundle brings its own Java
    and Python runtimes and needs neither a JDK nor JAVA_HOME from the host. Nothing is written
    into the install tree while the server runs: run-time files go to a state directory that
    can be set per server process by environment. On a NixOS host without nix-ld the server is
    not started; the engine fails before the spawn and prints the snippet. A release is not
    published unless a NixOS guest configured with only that snippet unpacks the linux-x86_64
    bundle, starts the server and answers a query.
  source: >
    owner decisions 2026-10-09. State on main at 06ae0654b0, read from the code: installs go
    under the user's home and change nothing on the host (PgwireGovDataInstaller,
    EngineInstaller); the launcher is a bash script with an env shebang
    (pgwire-adapters-release.yml, "Stage adapter model + launcher"); the query-engine JVM is
    started with no JVM path, so the host's JAVA_HOME is used although the bundle carries a JRE
    (calcite_backend.py _start_jvm); jars.classpath is rewritten in the bundle at every start
    and the catalog cache is written beside model.json (catalog_populate.py
    catalog_cache_path); the port probe runs lsof (PgwireGovDataConnector.portListenerPid); no
    certificate bundle is configured for the Python side; the engine's native installer for
    Linux is a .deb only; only linux-x86_64 is published for Linux. Whether lsof and the
    certificate bundle are removed from the host's list or added to it is settled in the
    implementation and then stated here.
  tests: []

# ===================================== catalog seed ============================================

- id: ASKAM-002
  module: askamerica
  status: accepted
  group: catalog seed
  category: Official seed
  priority: MUST
  type: constraint
  description: >
    At run time AskAmerica never builds its catalog by discovery: not on a first start, not
    when the installed catalog is missing, and not when it differs from the model. The seed
    packaged in the jar is the official one. On start the jar's seed is put in place, and doing
    so again when nothing changed is a no-op; an installed catalog that differs from the jar's
    seed is replaced by it, never repaired or rebuilt. Whether two seeds differ, and whether a
    seed covers the model, is measured by schema only: the schemas, their tables, and the
    columns and types the seed declares. Recorded row counts, statistics, timestamps, version
    strings and file bytes do not make a seed different. A jar that carries no seed, or a seed
    that does not declare a schema or table of the model, is an error that names what is
    missing and stops the start; there is no fallback to building one. Statistics in the seed
    may be out of date; that is accepted and is never a reason to build, recount or refresh at
    run time. A newer official seed reaches an install only with a newer jar. Building a seed
    stays possible and belongs to the release path (govdata/scripts/build-seed.sh), which is
    how the official seed is made. The standalone pg-wire server puts its own jar's seed in
    place on every start, into its state directory, without its caller naming a catalog.
    Each server process has its own copy of the catalog, because DuckDB locks a catalog file
    against other processes even when it is opened read-only; the copies are an artifact of
    that lock, every one comes from the jar's seed, and none is built, merged or reconciled
    with another: "different" is always measured against the jar, never between copies. The
    pg-wire server's own catalog cache (the pickle file shipped beside the model) is under
    the same rule: the shipped one is official, is judged by schema and never by the model
    file's bytes, is never rebuilt by a live walk at run time, and a missing one or one that
    does not cover the model is an error by name; building it is a release step.
  source: >
    owner rulings 2026-10-09. State on main at 6e664777a4, read from the code:
    GovDataSeedInstaller.ensureSeeded is called only from GovDataDriver.connect, so the
    pg-wire bundle, whose model names GovDataSchemaFactory directly with database_filename
    ${GOVDATA_DUCKDB_CATALOG:govdata-catalog.duckdb}, never installs a seed and, with that
    variable unset, creates an empty catalog and discovers every schema
    (DuckDBJdbcSchemaFactory "Creating new DuckDB database"); a jar without a seed and a
    failed extraction both fall through to discovery by design ("pure accelerator"); the
    installed catalog is compared with the jar's seed by a SHA-256 of the seed zip's bytes
    kept in .duckdb/govdata.duckdb.version, not by schema; a catalog file newer than the jar
    is left in place; ?rebuildCatalog=true deletes the catalog so it is rebuilt by discovery;
    the pickle cache is named by a SHA-256 of model.json's bytes and rebuilt by a live walk
    when absent or unreadable (catalog_populate.py populate_state_cached); a second process
    that meets the catalog's lock already gets a numbered copy taken from the jar's seed
    (DuckDBJdbcSchemaFactory isCatalogLockConflict, seedCatalogCopy*). That a read-only open
    is locked too is the owner's statement; the code does not say so in a comment found by
    search.
  tests: []
