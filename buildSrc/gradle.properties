org.gradle.parallel=true
kotlin.code.style=official

# Plugins
com.github.autostyle.version=3.0
com.github.vlsi.vlsi-release-plugins.version=1.90

# buildSrc resolves its own plugins (com.github.autostyle) before the root build's properties apply, so the
# repository retry/backoff and timeouts are repeated here (same values as the root gradle.properties)
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
