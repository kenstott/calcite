name: Windows file tests

# Runs only the file adapter's tests on Windows, so a Windows fix can be checked without the
# whole CI build. Starts on a push to the branch the Windows work is on, or by hand.

on:
  push:
    branches: ['fix/file-windows']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-file-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-file:
    name: 'Windows file tests (JDK 11)'
    runs-on: windows-latest
    steps:
      - name: 'Install winutils'
        # Hadoop's local file system needs winutils.exe and hadoop.dll on Windows. Apache publishes no
        # binaries; these are the 3.4.0 build from kontext-tech/winutils, pinned to one commit.
        shell: pwsh
        run: |
          $bin = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hadoop\bin"
          foreach ($file in "winutils.exe", "hadoop.dll") {
            Invoke-WebRequest -OutFile "$bin\$file" -Uri "https://raw.githubusercontent.com/kontext-tech/winutils/ff8e529a72bde2ec95b06ab76e797bdcbade9685/hadoop-3.4.0-win10-x64/bin/$file"
          }
          "HADOOP_HOME=$env:RUNNER_TEMP\hadoop" >> $env:GITHUB_ENV
          # hadoop.dll is found through the library path, which Windows takes from PATH
          "$bin" >> $env:GITHUB_PATH
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: windows-file-jdk11
          remote-build-cache-proxy-enabled: false
          arguments: --no-parallel --no-daemon :file:test
