# pgwire-<adapter> releases — airgapped per-OS bundles that expose a single Calcite adapter
# (file / sharepoint / splunk / cloudops / govdata) over the PostgreSQL wire protocol. Each is the generic
# pgwire-calcite server (shared) bundled with that adapter's runtime jars + its model.json + a
# launcher that starts the calcite backend against that model. Mirrors pgwire-calcite-release.yml.
name: pgwire-adapters release
# Surfaces the target version in `gh run list`'s displayTitle/name (default title for a
# workflow_dispatch run carries no input values at all) -- askamerica-engine.yml's "Ensure
# pgwire-govdata bundle" step greps this to tell an in-flight run for THIS version apart from
# one left over from a different release, a real bug found live (2026-09-18): three releases
# cut in quick succession (0.94.1/0.94.2/0.94.3) each saw a stale in-flight run for an OLDER
# version and skipped dispatching its own, so the asset it was actually waiting on never got
# built and the installer jobs hung the full 45 minutes before failing.
run-name: "pgwire-adapters release ${{ inputs.version || 'auto' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version (e.g. 0.28.0)"
        required: true
  release:
    types: [created]

# The attach step updates the engine-v<version> release; on workflow_dispatch the default
# GITHUB_TOKEN is read-only, so grant it explicitly. id-token/attestations: these tarballs are
# fetched and RUN directly on end-user machines at runtime (provisa's runtime_deps/
# pgwire_bundles.py), with previously nothing stronger than a SHA-256 checksum verifying them —
# actions/attest-build-provenance needs both to mint a Sigstore attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PY_VERSION: "3.12"

jobs:
  # Per-adapter: build the adapter module jar + its full runtime classpath, plus the shared
  # pgwire UDF + Java launcher jars. Built once per adapter and shared across OS variants.
  jars:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - { name: file,       module: file }
          - { name: sharepoint, module: sharepoint-list }
          - { name: splunk,     module: splunk }
          - { name: cloudops,   module: cloud-ops }
          - { name: govdata,    module: govdata }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build adapter jars + resolve runtime classpath
        run: |
          ./gradlew :${{ matrix.adapter.module }}:jar :core:jar :linq4j:jar \
            --no-daemon --console=plain -q
          ./gradlew :${{ matrix.adapter.module }}:pgwPrintCp \
            --init-script pgwire-calcite/scripts/print-calcite-classpath.gradle \
            --no-daemon --console=plain -q
          ./gradlew pgwArrowCp \
            --init-script pgwire-calcite/scripts/print-calcite-classpath.gradle \
            --no-daemon --console=plain -q
          mkdir -p out/jars
          # every real .jar on the adapter's runtime classpath
          for j in $(tr ':' '\n' < /tmp/pgw-file-cp.txt | grep '\.jar$'); do cp -n "$j" out/jars/ || true; done
          # the pgwire server's own Arrow bridge jars — every adapter bundle needs them, whether or
          # not the adapter pulls Arrow transitively (only parquet-backed `file` happens to)
          for j in $(tr ':' '\n' < /tmp/pgw-arrow-cp.txt | grep '\.jar$'); do cp -n "$j" out/jars/ || true; done
          # `unzip -l a.jar b.jar ...` lists only a.jar and treats the rest as member patterns,
          # so the check has to visit each jar on its own.
          for c in org.apache.arrow.memory.RootAllocator com.google.flatbuffers.Table org.duckdb.DuckDBDriver; do
            found=0
            for j in out/jars/*.jar; do
              unzip -l "$j" 2>/dev/null | grep -q "$(echo $c | tr . /).class" && { found=1; break; }
            done
            [ "$found" = 1 ] || { echo "bundle is missing $c"; exit 1; }
          done
          # the adapter module's own output is a classes dir on the cp -> use its built jar
          cp -n ${{ matrix.adapter.module }}/build/libs/*.jar out/jars/ 2>/dev/null || true
          # The two `cp -n` loops above merge jars from two INDEPENDENTLY resolved Gradle
          # classpaths (this adapter's own runtimeClasspath, plus the shared Arrow one) --
          # `cp -n` dedupes only by exact filename, so if either classpath resolved a shared
          # artifact (e.g. jackson-core) to a different version, both versions land here and
          # coexist on the classpath with no guarantee the JVM links compatible versions of
          # related jars. Observed live 2026-09-16: jackson-dataformat-yaml calling a
          # jackson-core method only present in the newer of two jackson-core jars that had
          # both been bundled -- a NoSuchMethodError that crashed pgwire-govdata on every
          # startup. Keep exactly the highest version of each artifact.
          python3 pgwire-calcite/scripts/dedupe_jars.py out/jars
          echo "bundled $(ls out/jars | wc -l) jars for ${{ matrix.adapter.name }}"
      - name: Build vector/compat UDF jar + Java launcher (shared)
        working-directory: pgwire-calcite
        run: |
          bash packaging/build-udf.sh
          bash packaging/build-launcher.sh
      - run: |
          cp pgwire-calcite/vendor/jars/*.jar out/jars/
          # vendor/jars is a third, independent jar source (see the dedupe_jars.py call in
          # the `jars` job above for why this matters) -- rerun the same pass now that it's
          # merged in too.
          python3 pgwire-calcite/scripts/dedupe_jars.py out/jars
          cp pgwire-calcite/packaging/pgwire-launcher.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-jars-${{ matrix.adapter.name }}
          path: out

  bundle:
    needs: jars
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - { name: file,       module: file }
          - { name: sharepoint, module: sharepoint-list }
          - { name: splunk,     module: splunk }
          - { name: cloudops,   module: cloud-ops }
          - { name: govdata,    module: govdata }
        os:
          - { runner: ubuntu-latest, variant: linux-x86_64 }
          - { runner: macos-14,      variant: macos-arm64 }
          - { runner: windows-latest, variant: windows-x86_64 }
    runs-on: ${{ matrix.os.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: adapter-jars-${{ matrix.adapter.name }}
          path: bundle    # -> bundle/jars/*.jar and bundle/pgwire-launcher.jar

      - name: Stage standalone CPython + install the shared pgwire server (airgap-ready venv)
        working-directory: pgwire-calcite
        run: |
          # Install the interpreter INTO the bundle (not the runner's global
          # uv-managed location) so the shipped tarball is self-contained: a
          # `uv python install` outside the bundle leaves cpython/bin/python an
          # absolute symlink to the runner's own path, which does not exist on
          # any other machine.
          uv python install --install-dir ../bundle/python "${PY_VERSION}"
          find ../bundle/python -maxdepth 1 -type l -delete   # drop uv's version-alias symlink (points outside the bundle; unused at runtime)
          rm -rf ../bundle/python/.lock ../bundle/python/.temp ../bundle/python/.gitignore
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # python-build-standalone on Windows ships python.exe at the distribution root
            # (no bin/ and no python3.12-named binary), and a Windows venv has no symlink to
            # rewrite: Scripts/python.exe is a compiled launcher stub, not a link, and it
            # reads pyvenv.cfg's `home` line at EVERY invocation to find the real interpreter
            # to exec. `uv venv` writes `home` as THIS RUNNER's absolute path -- confirmed
            # live this breaks every single launch on an actual Windows install ("No Python
            # at '<CI runner path>'"). See "Make Windows venv relocatable" below, which
            # replaces it with a placeholder the generated .bat resolves at each launch.
            PYBIN="$(find ../bundle/python -maxdepth 3 -type f -name python.exe | head -1)"
          else
            PYBIN="$(find ../bundle/python -maxdepth 3 -type f -name "python${PY_VERSION}")"
          fi
          test -n "$PYBIN" || { echo "bundled interpreter not found under ../bundle/python"; find ../bundle/python -maxdepth 3 | head -40; exit 1; }
          uv venv --python "$PYBIN" ../bundle/cpython
          # --no-editable: vendor/buenavista is declared `editable = true` in
          # [tool.uv.sources] (pyproject.toml) for local dev; ship a real install
          # (an editable install points at this checkout's absolute path, which
          # will not exist on the machine the bundle is extracted on).
          # EMBED() (embedder.py) needs fastembed (onnxruntime, no torch) -- only the
          # govdata variant has any use for it, so only its bundle pays the size cost.
          EXTRAS=".[oidc]"
          if [[ "${{ matrix.adapter.name }}" == "govdata" ]]; then
            EXTRAS=".[oidc,embed]"
          fi
          uv pip install --python ../bundle/cpython --no-editable ./vendor/buenavista "$EXTRAS"
          # `uv venv` makes cpython/bin/python an ABSOLUTE symlink to $PYBIN.
          # Rewrite it relative so the whole bundle (cpython/ + python/ together)
          # is relocatable to any absolute path. pyvenv.cfg's `home` line stays
          # build-machine-absolute but is harmless: CPython 3.11+'s getpath
          # derives sys.prefix/home from bin/python's own realpath, not from a
          # stale pyvenv.cfg home (verified locally by moving a built bundle to
          # an unrelated path and importing buenavista/pgwire_calcite from it).
          [[ "$RUNNER_OS" == "Windows" ]] || python3 - "$PYBIN" ../bundle/cpython/bin <<'PY'
          import os, sys
          target = os.path.realpath(sys.argv[1])
          venv_bin = sys.argv[2]
          link = os.path.join(venv_bin, "python")
          rel = os.path.relpath(target, os.path.realpath(venv_bin))
          os.remove(link)
          os.symlink(rel, link)
          print(f"bin/python -> {rel}")
          PY

      - name: Pre-download EMBED() model into the bundle (govdata only)
        if: matrix.adapter.name == 'govdata'
        working-directory: pgwire-calcite
        run: |
          # Downloaded HERE (network available in CI) so the shipped bundle needs no
          # network at all -- embedder.py's local_files_only=True refuses to touch the
          # network at runtime, using only what's in this directory. Same model
          # askamerica-engine's embed.py/vss-local.py already use (384-d, mean-pooled,
          # L2-normalized) -- see embedder.py's module doc for why the vectors are not
          # guaranteed to numerically match that pipeline's, only fastembed's own.
          PYBIN=../bundle/cpython/bin/python
          [[ "$RUNNER_OS" == "Windows" ]] && PYBIN=../bundle/cpython/Scripts/python.exe
          "$PYBIN" -c "
          from fastembed import TextEmbedding
          TextEmbedding(model_name='snowflake/snowflake-arctic-embed-xs', cache_dir='../bundle/model/embedder')
          print('embedder model cached')
          "
          du -sh ../bundle/model/embedder

      - name: Make Windows venv relocatable
        if: runner.os == 'Windows'
        working-directory: pgwire-calcite
        run: |
          # Must run AFTER every CI-side use of cpython/Scripts/python.exe (the embed
          # pre-download step above included) -- this runner's own path in `home` is still
          # correct up to this point. Swap in a placeholder now; the generated .bat (see
          # "Stage adapter launcher (Windows)" below) resolves it to the real install path,
          # via %HERE%, on every launch -- the Windows equivalent of the relative symlink
          # POSIX bundles get from the step above.
          sed -i 's|^home = .*$|home = __PGWIRE_PYTHON_HOME__|' ../bundle/cpython/pyvenv.cfg
          cat ../bundle/cpython/pyvenv.cfg

      - name: Minimal bundled JRE (jlink)
        run: |
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.sql,java.naming,java.management,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress=2 --output bundle/jre

      - name: Stage adapter model + launcher
        run: |
          mkdir -p bundle/model bundle/bin
          cp "pgwire-${{ matrix.adapter.name }}/model.json" bundle/model/model.json
          # Pre-built catalog cache (populate_state_cached in pgwire_calcite/catalog_populate.py):
          # skips the live JDBC/Iceberg walk of every table on first connect, which otherwise
          # costs minutes on a schema this size and made every fresh install's first query time
          # out client-side (confirmed live, 2026-09-18). Its filename is keyed by model.json's
          # own content hash, so shipping it alongside model.json here is the only wiring
          # needed -- the runtime path computation independently lands on the same name. Only
          # present for adapters that have generated one; not every adapter's schema is large
          # enough to need it.
          shopt -s nullglob
          for cache_file in "pgwire-${{ matrix.adapter.name }}"/catalog-cache-*.pkl; do
            cp "$cache_file" "bundle/model/$(basename "$cache_file")"
          done
          shopt -u nullglob
          # Adapter-specific entry: starts the calcite backend against this adapter's model.
          # --database defaults the reported catalog name to the adapter's topic (e.g. govdata)
          # instead of the generic "postgres". Extra args (e.g. --port, --auth, --database) are
          # appended after and win. (${{ matrix.adapter.name }} is substituted by the runner
          # even inside the quoted heredoc; $HERE/$@ stay literal for the generated script.)
          #
          # Windows gets its OWN launcher, not this bash script run through some shell nobody
          # can assume is on PATH: a stock Windows machine has no bash at all. Confirmed live
          # this was ALWAYS broken there, independent of anything else -- this exact heredoc
          # was generated identically for windows-x86_64 too, an unusable artifact PgwireGov
          # DataConnector could never actually run. See the "Windows launcher" step below.
          if [[ "$RUNNER_OS" != "Windows" ]]; then
          cat > "bundle/bin/pgwire-${{ matrix.adapter.name }}" <<'SH'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          ls "$HERE"/jars/*.jar | paste -sd: - > "$HERE/jars.classpath"
          export PGWIRE_CALCITE_CLASSPATH_FILE="$HERE/jars.classpath"
          # embedder.py's is_available() checks this directory's existence -- harmless when
          # absent (every adapter but govdata; embedder.py is only ever imported once EMBED()
          # actually appears in a query, per its own is_available() gate).
          export EMBED_MODEL_CACHE_DIR="$HERE/model/embedder"
          exec "$HERE/jre/bin/java" \
            "-Dpgwire.python=$HERE/cpython/bin/python" \
            -jar "$HERE/pgwire-launcher.jar" \
            --backend calcite --model "$HERE/model/model.json" \
            --database ${{ matrix.adapter.name }} "$@"
          SH
          chmod +x "bundle/bin/pgwire-${{ matrix.adapter.name }}"
          fi

      - name: Stage adapter launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\bin | Out-Null
          # Single-quoted PowerShell here-string: 100% literal, no PowerShell variable
          # expansion at all -- required because the BATCH content itself is full of
          # %HERE%/%%f/!CP! syntax that must reach the file untouched. The adapter name
          # is substituted afterward with a plain string replace, not interpolation.
          $bat = @'
          @echo off
          setlocal enabledelayedexpansion
          for %%i in ("%~dp0..") do set "HERE=%%~fi"
          set "CP="
          for %%f in ("%HERE%\jars\*.jar") do set "CP=!CP!%%f;"
          > "%HERE%\jars.classpath" echo !CP!
          set "PGWIRE_CALCITE_CLASSPATH_FILE=%HERE%\jars.classpath"
          set "EMBED_MODEL_CACHE_DIR=%HERE%\model\embedder"
          rem The venv's launcher stub (cpython\Scripts\python.exe) reads pyvenv.cfg's `home`
          rem line at every invocation to find the real interpreter to exec. It was built on
          rem a CI runner and ships with a placeholder there (see "Make Windows venv
          rem relocatable" in the release workflow) -- resolve it to THIS install's actual
          rem path before every launch, since that varies per machine.
          for /d %%d in ("%HERE%\python\cpython-*") do set "PYHOME=%%~fd"
          if defined PYHOME powershell -NoProfile -Command "(Get-Content -Raw '%HERE%\cpython\pyvenv.cfg') -replace [regex]::Escape('__PGWIRE_PYTHON_HOME__'), '%PYHOME%' | Set-Content -NoNewline '%HERE%\cpython\pyvenv.cfg'"
          "%HERE%\jre\bin\java.exe" "-Dpgwire.python=%HERE%\cpython\Scripts\python.exe" -jar "%HERE%\pgwire-launcher.jar" --backend calcite --model "%HERE%\model\model.json" --database __ADAPTER__ %*
          '@
          $bat = $bat.Replace("__ADAPTER__", "${{ matrix.adapter.name }}")
          Set-Content -Path "bundle\bin\pgwire-${{ matrix.adapter.name }}.bat" -Value $bat -Encoding ASCII -NoNewline
          Get-Content "bundle\bin\pgwire-${{ matrix.adapter.name }}.bat"

      - name: Pack tarball + sha256
        run: |
          VER="${{ github.event.inputs.version || github.ref_name }}"
          VER="${VER#engine-v}"
          name="pgwire-${{ matrix.adapter.name }}-${VER}-${{ matrix.os.variant }}"
          echo "BUNDLE_NAME=$name" >> "$GITHUB_ENV"
          mv bundle "$name"
          tar -czf "${name}.tar.gz" "$name"
          # `command -v sha256sum` is checked only for its exit status -- redirected to
          # /dev/null so its own stdout (the binary's path, e.g. "/usr/bin/sha256sum") does
          # not leak into the pipe ahead of the real hash line on any runner where
          # sha256sum exists. Without the redirect, awk '{print $1}' emits BOTH lines'
          # first field -- "/usr/bin/sha256sum" then the real hash -- producing a two-line
          # .sha256 file whose first line is not a hash at all. Confirmed live: this exact
          # bug made every pgwire-govdata download fail PgwireGovDataInstaller's integrity
          # check (comparing against the literal string "/usr/bin/sha256sum"), on every
          # platform whose runner has sha256sum (not macOS, which falls through to shasum).
          (command -v sha256sum >/dev/null 2>&1 && sha256sum "${name}.tar.gz" || shasum -a 256 "${name}.tar.gz") \
            | awk '{print $1}' > "${name}.tar.gz.sha256"
          echo "built ${name}.tar.gz ($(cat ${name}.tar.gz.sha256))"

      # This tarball is fetched and RUN directly on end-user machines at runtime (provisa's
      # runtime_deps/pgwire_bundles.py), never installed via a package manager with its own
      # integrity chain — until now the sha256 above was the only check, and it protects
      # against corruption, not tampering (an attacker who can replace the release asset can
      # just as easily replace its sha256 file alongside it). grype/syft scan the extracted
      # bundle DIRECTORY (before the tar above), not the tarball, since neither tool unpacks
      # arbitrary archive formats — they catalog jars found on a filesystem path.
      - name: Install grype + syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          # /usr/local/bin is on PATH by default on Linux/macOS runners but NOT inherited by a
          # later Git-Bash step on windows-latest, so `syft`/`grype` resolved fine here yet came
          # back "command not found" in the very next step. Verified live (2026-09-21): every
          # Windows bundle job (file, sharepoint-list, splunk, cloud-ops, govdata) failed at
          # "Generate SBOM (CycloneDX)" with exit code 127 for exactly this reason.
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Generate SBOM (CycloneDX)
        run: syft "$BUNDLE_NAME" -o cyclonedx-json="${BUNDLE_NAME}.sbom.cdx.json"

      # A direct grype scan of the directory, not grype's own `sbom:` source against the
      # CycloneDX file just generated: grype's `sbom:` reader is documented against Syft's OWN
      # JSON schema, not confirmed to also parse CycloneDX — scanning the directory natively
      # avoids depending on an unverified format handoff between the two tools.
      - name: CVE scan (gates the release — fails on any Critical finding)
        # High/Medium/Low findings stay visible in the uploaded report but don't block: 201
        # CVEs across pgwire-file's 266-jar runtime classpath were found live, 2026-09-21 —
        # fixing the 6 Criticals (redisson, netty-handler, bcprov-jdk18on) is this pass's scope;
        # the rest is its own separate remediation effort across this fork's dependency tree.
        run: |
          grype "dir:${BUNDLE_NAME}" -c .grype.yaml \
            -o json --file "${BUNDLE_NAME}.cve-report.json" --fail-on critical

      - name: Sign tarball (Sigstore attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ env.BUNDLE_NAME }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.adapter.name }}-${{ matrix.os.variant }}
          path: |
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.tar.gz
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.tar.gz.sha256
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.sbom.cdx.json
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.cve-report.json

      - name: Attach to release
        # On a release event use its tag; on workflow_dispatch (used because a release created
        # by GITHUB_TOKEN emits no release event) target engine-v<version>. Plain upload with
        # --clobber: softprops/action-gh-release tries to *update* the release object as well,
        # which a dispatched run's token is not allowed to do.
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || format('engine-v{0}', github.event.inputs.version) }}"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.tar.gz \
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.tar.gz.sha256 \
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.sbom.cdx.json \
            pgwire-${{ matrix.adapter.name }}-*-${{ matrix.os.variant }}.cve-report.json

  # Proves a just-built bundle actually runs on a clean machine: no repo checkout
  # venv, no setup-java/setup-uv, nothing but the tarball itself + a psql client.
  # This is what would have caught the airgapped-bundle relocation defect (an
  # absolute cpython/bin/python symlink + an editable buenavista install) --
  # `bundle` only ever ran on the SAME runner/checkout that built the bundle.
  # Any failing step here fails the workflow run.
  smoke:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os:
          - { runner: ubuntu-latest, variant: linux-x86_64 }
          - { runner: macos-14,      variant: macos-arm64 }
    runs-on: ${{ matrix.os.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle-file-${{ matrix.os.variant }}
          path: dl

      - name: Install psql client
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          elif command -v brew >/dev/null 2>&1; then
            brew install libpq
            echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          else
            echo "no supported package manager to install psql" >&2
            exit 1
          fi

      - name: Extract with Python's safe tarfile filter (proves relocatability)
        run: |
          set -euo pipefail
          tar_path="$(ls dl/pgwire-file-*-${{ matrix.os.variant }}.tar.gz)"
          mkdir -p smoke
          python3 -c "
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as tf:
              tf.extractall(sys.argv[2], filter='data')
          " "$tar_path" smoke
          bundle_dir="$(find smoke -maxdepth 1 -mindepth 1 -type d -name 'pgwire-file-*')"
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"

      - name: Fixture directory (one CSV) for the file adapter's model.json
        run: |
          set -euo pipefail
          # model.json's FileSchemaFactory "directory" operand is "data",
          # resolved relative to the model file -> seed it there.
          mkdir -p "$BUNDLE_DIR/model/data"
          printf 'id,name\n1,alice\n2,bob\n' > "$BUNDLE_DIR/model/data/people.csv"

      - name: Start pgwire-file and wait for the port
        run: |
          set -euo pipefail
          "$BUNDLE_DIR/bin/pgwire-file" --port 5455 --auth trust > smoke-server.log 2>&1 &
          echo $! > smoke-server.pid
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/5455) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "port 5455 is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "pgwire-file never opened port 5455" >&2
          cat smoke-server.log >&2
          exit 1

      - name: psql SELECT 1
        run: |
          set -euo pipefail
          psql "host=127.0.0.1 port=5455 user=tester dbname=postgres" -c "SELECT 1;"

      - name: Stop pgwire-file
        if: always()
        run: |
          set -euo pipefail
          if [ -f smoke-server.pid ]; then
            kill "$(cat smoke-server.pid)" 2>/dev/null || true
          fi

      - name: Server log
        if: always()
        run: cat smoke-server.log || true
