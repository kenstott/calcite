# pgwire-<adapter> releases: airgapped per-OS packs that expose a single Calcite adapter
# (file / sharepoint / splunk / salesforce / servicenow / cloudops / govdata) over the PostgreSQL
# wire protocol, and the one pgwire-calcite runtime per platform they share. The runtime (CPython
# with the server, the JRE, the jars every adapter holds) is built in this run by
# pgwire-calcite-release.yml; each pack holds its adapter's other jars, its model.json and a
# launcher that starts the runtime it names (layout: pgwire-calcite/src/pgwire_calcite/packs.py).
name: pgwire-adapters release
# Surfaces the target version in `gh run list`'s displayTitle/name (default title for a
# workflow_dispatch run carries no input values at all) -- askamerica-engine.yml's "Ensure
# pgwire-govdata bundle" step greps this to tell an in-flight run for THIS version apart from
# one left over from a different release, a real bug found live (2026-09-18): three releases
# cut in quick succession (0.94.1/0.94.2/0.94.3) each saw a stale in-flight run for an OLDER
# version and skipped dispatching its own, so the asset it was actually waiting on never got
# built and the installer jobs hung the full 45 minutes before failing.
# A run that does not publish must NOT carry the version in its title: that step would take it
# for the publishing run of that version and wait for assets it never attaches.
run-name: "${{ (github.event_name == 'release' || inputs.publish == true) && format('pgwire-adapters release {0}', inputs.version || 'auto') || format('pgwire-adapters check, not published ({0})', github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version (e.g. 0.28.0)"
        required: true
      publish:
        description: "sign, attest and attach the bundles to engine-v<version> (false: build and smoke-test only)"
        type: boolean
        default: false
      scope:
        description: "which bundles to build"
        type: choice
        default: all
        options:
          - all
          - linux-file-govdata
          - windows-file
          - linux-aarch64
  release:
    types: [created]

# One run per release at a time (queued, never cancelled). Two runs for one release (a manual
# dispatch beside the automatic one, engine-v0.110.0; a tag pushed twice, engine-v0.110.1) uploaded
# the same assets with --clobber concurrently, and each lost an upload to the other's delete
# (HTTP 404). Queued, the second run re-uploads after the first instead of racing it; cancelling
# could kill a half-finished upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || format('engine-v{0}', inputs.version) }}
  cancel-in-progress: false

# The attach step updates the engine-v<version> release; on workflow_dispatch the default
# GITHUB_TOKEN is read-only, so grant it explicitly. id-token/attestations: these tarballs are
# fetched and RUN directly on end-user machines at runtime (provisa's runtime_deps/
# pgwire_bundles.py), with previously nothing stronger than a SHA-256 checksum verifying them —
# actions/attest-build-provenance needs both to mint a Sigstore attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PY_VERSION: "3.12"
  # The one switch for everything that publishes: signing with the project key, the Sigstore
  # attestation, and attaching to the release. A release event publishes; a run started by
  # hand publishes only when asked to. Every publishing step tests this value, and the
  # publish job refuses to run without it.
  PUBLISH: ${{ github.event_name == 'release' || inputs.publish == true }}

jobs:
  # Which adapters and platforms this run builds. "linux-file-govdata" is the branch check:
  # the file bundle (which the smoke job runs) and the govdata bundle, for linux-x86_64 only.
  # "linux-aarch64" is every adapter for Linux arm64 only, and its Maven Central bundles.
  plan:
    runs-on: ubuntu-latest
    outputs:
      adapters: ${{ steps.plan.outputs.adapters }}
      os: ${{ steps.plan.outputs.os }}
      smoke_os: ${{ steps.plan.outputs.smoke_os }}
      smoke_windows: ${{ steps.plan.outputs.smoke_windows }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pgwire-calcite/packaging
      - id: plan
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          scope = os.environ["SCOPE"]
          # The adapters and their launcher flags, from the one table build-bundle.sh also reads.
          # govdata's "--auth askamerica-key": every connection signs in with its AskAmerica API
          # key as the password (owner rule 2026-10-10, ASKAM-010). On by default, baked into
          # the launcher, so nothing can start an open govdata server by omission. The caller's
          # arguments follow these, so only an explicit `--auth none` argument turns it off - a
          # test's choice; no environment variable does.
          adapters = json.load(open("pgwire-calcite/packaging/adapters.json"))
          # Every supported platform (REQ-294): the one table release-assets-complete.sh and
          # central-bundles.sh also read. Linux arm64 builds on GitHub's arm64 runner.
          platforms = [
              {"runner": p["runner"], "variant": p["variant"]}
              for p in json.load(open("pgwire-calcite/packaging/platforms.json"))
          ]
          if scope == "linux-file-govdata":
              adapters = [a for a in adapters if a["name"] in ("file", "govdata")]
              platforms = [p for p in platforms if p["variant"] == "linux-x86_64"]
          elif scope == "windows-file":
              # The smallest run that starts a Windows server: one jar set, one bundle.
              adapters = [a for a in adapters if a["name"] == "file"]
              platforms = [p for p in platforms if p["variant"] == "windows-x86_64"]
          elif scope == "linux-aarch64":
              platforms = [p for p in platforms if p["variant"] == "linux-aarch64"]
          elif scope != "all":
              raise SystemExit(f"unknown scope: {scope}")
          # The smoke job runs the file bundle on the Unix runners; smoke-windows runs it on
          # Windows, whose launcher is a .bat and shares nothing with the Unix one.
          smoke = [p for p in platforms if p["variant"] != "windows-x86_64"]
          windows = any(p["variant"] == "windows-x86_64" for p in platforms)
          print("smoke_windows=" + ("true" if windows else "false"))
          print("adapters=" + json.dumps(adapters))
          print("version=" + os.environ["VERSION"].removeprefix("engine-v"))
          print("os=" + json.dumps(platforms))
          print("smoke_os=" + json.dumps(smoke))
          PY

  # The runtime this release's packs require: built in this run by pgwire-calcite-release.yml,
  # which also builds every adapter's jar set (adapter-jars-<name>) and the runtime's jars (the
  # jars every adapter holds, runtime-jars). Attached by the publish-runtime job below, after
  # the smoke jobs pass.
  runtime:
    needs: plan
    uses: ./.github/workflows/pgwire-calcite-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      publish: ${{ github.event_name == 'release' || inputs.publish == true }}
      scope: ${{ inputs.scope || 'all' }}
    secrets: inherit

  # govdata's catalog cache, walked live by this release's own engine and jars, for the govdata
  # pack (populate_state_cached in catalog_populate.py: without it every fresh install walks
  # hundreds of tables live before its first answer). The cache is keyed by model.json AND the
  # engine release (catalog_populate.cache_key): the catalog's column types come from the engine
  # too, and a cache an earlier engine walked for the same model.json served govdata's year
  # partitions as VARCHAR while 0.119.4's engine sent them as INTEGER (DuckDB: "Invalid unicode").
  # So none is committed and no one regenerates one by hand; each release builds its own, and a
  # walk with a gap, or a cache lacking a table a schema YAML declares, fails the release.
  # The job runs on every run and does nothing when this run builds no govdata pack: a skipped
  # job would skip the packs and everything after them.
  catalog-cache:
    needs: [plan, runtime]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GOVDATA: ${{ contains(needs.plan.outputs.adapters, '"govdata"') }}
    steps:
      - uses: actions/checkout@v4
        if: env.GOVDATA == 'true'
      - uses: actions/setup-java@v4
        if: env.GOVDATA == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        if: env.GOVDATA == 'true'
      - uses: actions/download-artifact@v4
        if: env.GOVDATA == 'true'
        with:
          name: adapter-jars-govdata
          path: adapter
      - uses: actions/download-artifact@v4
        if: env.GOVDATA == 'true'
        with:
          name: runtime-jars
          path: runtime-jars
      - name: The govdata pack's jars, as the pack step lays them out
        if: env.GOVDATA == 'true'
        run: python3 pgwire-calcite/packaging/runtime_packs.py pack-jars runtime-jars/jars adapter/jars pack-jars
      - name: Walk the govdata catalog live and write its cache
        if: env.GOVDATA == 'true'
        working-directory: pgwire-calcite
        env:
          # The warehouse credentials askamerica-engine.yml's live JDBC smoke test reads. Read only.
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_OVERRIDE: ${{ secrets.AWS_ENDPOINT_OVERRIDE }}
          AWS_REGION:            auto
          GOVDATA_PARQUET_DIR:   ${{ secrets.GOVDATA_PARQUET_DIR }}
          # The classpath a govdata pack's server gets from its runtime (packs.classpath_dirs):
          # the runtime's jars, then the pack's.
          PGWIRE_CALCITE_CLASSPATH_DIRS: ${{ github.workspace }}/runtime-jars/jars:${{ github.workspace }}/pack-jars
          PGWIRE_CALCITE_STATE_DIR: ${{ github.workspace }}/catalog-cache
          # An absolute catalog, as the AskAmerica engine gives every server it spawns
          # (PgwireGovDataConnector): the jar's seed is installed at this path and every schema
          # opens it, so the walk reads the views the seed holds. Left relative, each schema
          # resolves it under its own directory, opens an empty catalog beside the seed, and
          # re-creates every view over the warehouse: from a runner eight timed out, and the 35
          # views on them were left out of the cache.
          GOVDATA_DUCKDB_CATALOG: ${{ github.workspace }}/catalog-walk/.duckdb/govdata.duckdb
        run: |
          set -euo pipefail
          # Keyed as this release's runtime keys it (its installed pgwire_calcite is stamped with
          # the same release by pgwire-calcite-release.yml).
          echo "$VERSION" > src/pgwire_calcite/ENGINE_VERSION
          uv run --python "${PY_VERSION}" python scripts/build_catalog_cache.py ../pgwire-govdata/model.json
      - name: Check the cache against the schema YAMLs
        if: env.GOVDATA == 'true'
        run: |
          set -euo pipefail
          # A declared table missing from the cache fails the release unless
          # unmaterialized-tables.txt lists it with its evidence. PyYAML comes from uv.
          PYTHONPATH=pgwire-calcite/src uv run --no-project --with pyyaml python pgwire-calcite/scripts/check_catalog_cache_coverage.py \
            catalog-cache/catalog-cache-*.pkl pgwire-govdata/unmaterialized-tables.txt govdata/src/main/resources/*/*-schema.yaml
      - uses: actions/upload-artifact@v4
        if: env.GOVDATA == 'true'
        with:
          name: catalog-cache-govdata
          path: catalog-cache/catalog-cache-*.pkl
          if-no-files-found: error

  # One pack per adapter and platform: the adapter's jars the runtime does not hold, its model,
  # the Python packages only it uses (govdata's EMBED() embedder) and its launcher, which finds
  # the newest runtime on its runtime line under runtimes/ beside it. No JRE, CPython or common
  # jar: those are the runtime's.
  pack:
    needs: [plan, runtime, catalog-cache]
    strategy:
      fail-fast: false
      matrix:
        # flags: server arguments the pack's launcher passes. Only an adapter whose tables are
        # modifiable gets --allow-writes; the rest serve read-only.
        adapter: ${{ fromJSON(needs.plan.outputs.adapters) }}
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PK: root/packs/${{ matrix.adapter.name }}/${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Import GPG key
        if: env.PUBLISH == 'true'
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
      - uses: actions/download-artifact@v4
        with:
          name: adapter-jars-${{ matrix.adapter.name }}
          path: adapter
      - uses: actions/download-artifact@v4
        with:
          name: runtime-jars
          path: runtime-jars
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.os.variant }}
          path: dl

      - name: The adapter's own jars
        run: python3 pgwire-calcite/packaging/runtime_packs.py pack-jars runtime-jars/jars adapter/jars "$PK/jars"

      - name: Python packages only this adapter uses (govdata's EMBED() embedder)
        if: matrix.adapter.name == 'govdata'
        run: |
          set -euo pipefail
          # The runtime's interpreter installs them, so they match its ABI, pinned to the runtime's
          # versions of what it already has; the pack keeps only what the runtime lacks.
          python3 -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" \
            "$(ls dl/pgwire-calcite-runtime-*.tar.gz)" runtime
          RT="runtime/runtimes/$VERSION"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The runtime ships a placeholder `home`; this copy is only run here, on this runner.
            PYHOME="$(cd "$(ls -d "$RT"/python/cpython-*)" && pwd -W)"
            sed -i "s|__PGWIRE_PYTHON_HOME__|$PYHOME|" "$RT/cpython/pyvenv.cfg"
            RUNTIME_PYTHON="$RT/cpython/Scripts/python.exe"
          else
            RUNTIME_PYTHON="$RT/cpython/bin/python"
          fi
          # The embed extra's requirements, from the one place they are declared
          reqs=()
          while IFS= read -r line; do reqs+=("$line"); done < <(
            python3 -c "import tomllib; print('\n'.join(tomllib.load(open('pgwire-calcite/pyproject.toml','rb'))['project']['optional-dependencies']['embed']))")
          python3 pgwire-calcite/packaging/runtime_packs.py pack-extras "$RUNTIME_PYTHON" "$PK" "${reqs[@]}"
          # The EMBED() model, downloaded here so the pack needs no network at run time
          # (embedder.py's local_files_only=True). Same model askamerica-engine's embed.py uses.
          PYTHONPATH="$PK/site-packages" "$RUNTIME_PYTHON" -c "
          from fastembed import TextEmbedding
          TextEmbedding(model_name='snowflake/snowflake-arctic-embed-xs', cache_dir='$PK/model/embedder')
          print('embedder model cached')
          "
          du -sh "$PK/site-packages" "$PK/model/embedder"

      - uses: actions/download-artifact@v4
        if: matrix.adapter.name == 'govdata'
        with:
          name: catalog-cache-govdata
          path: catalog-cache
      - name: Model, catalog cache, manifest + launcher
        run: |
          set -euo pipefail
          mkdir -p "$PK/model"
          cp "pgwire-${{ matrix.adapter.name }}/model.json" "$PK/model/model.json"
          # govdata's catalog cache, walked by the catalog-cache job with this release's engine
          # (populate_state_cached in catalog_populate.py): it skips the live walk of every table
          # on first connect. Its name is keyed by model.json and the engine release, the key this
          # release's runtime computes when it runs the pack; one under any other name would never
          # be loaded, so the build fails without it. catalog_cache_key needs only the standard
          # library, so the runner's python3 computes it.
          if [ "${{ matrix.adapter.name }}" = "govdata" ]; then
            key="$(PYTHONPATH=pgwire-calcite/src python3 -c 'import sys; from pgwire_calcite.catalog_cache_key import cache_key; print(cache_key(sys.argv[1], sys.argv[2]))' \
              pgwire-govdata/model.json "$VERSION")"
            expected="catalog-cache/catalog-cache-${key}.pkl"
            test -f "$expected" || { echo "::error::no catalog cache $expected for this model.json and engine $VERSION: $(ls catalog-cache)"; exit 1; }
            cp "$expected" "$PK/model/$(basename "$expected")"
          fi
          # --database names the reported catalog after the adapter. govdata's
          # "--auth askamerica-key" (ASKAM-010) is baked in, so nothing starts an open govdata
          # server by omission; the caller's arguments follow and win.
          python3 pgwire-calcite/packaging/runtime_packs.py pack "$PK" "${{ matrix.adapter.name }}" "$VERSION" \
            "${{ matrix.os.variant }}" runtime-jars/jars --database "${{ matrix.adapter.name }}" ${{ matrix.adapter.flags }}

      - name: Pack tarball + sha256
        run: |
          set -euo pipefail
          name="pgwire-${{ matrix.adapter.name }}-pack-${VERSION}-${{ matrix.os.variant }}"
          echo "PACK_NAME=$name" >> "$GITHUB_ENV"
          # Windows' tar cannot create symlinks without a privilege most users lack, and the
          # embedder model cache (Hugging Face layout) is made of them (0.115.0): -h stores each
          # link as the file it points at.
          deref=""
          if [ "${{ matrix.os.variant }}" = "windows-x86_64" ]; then deref="-h"; fi
          tar -czf "${name}.tar.gz" $deref -C root packs
          # `command -v` only for its status, so its own output cannot reach the hash file
          (command -v sha256sum >/dev/null 2>&1 && sha256sum "${name}.tar.gz" || shasum -a 256 "${name}.tar.gz") \
            | awk '{print $1}' > "${name}.tar.gz.sha256"
          echo "built ${name}.tar.gz ($(cat ${name}.tar.gz.sha256))"

      - name: GPG-sign tarball
        if: env.PUBLISH == 'true'
        env:
          GPG_KEY_ID:     ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PASSPHRASE" ]; then
            gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEY_ID" --armor --detach-sign "${PACK_NAME}.tar.gz"
          else
            gpg --batch --yes --local-user "$GPG_KEY_ID" --armor --detach-sign "${PACK_NAME}.tar.gz"
          fi

      # The pack is fetched and run on end-user machines (Provisa's runtime_deps/pgwire_bundles.py):
      # syft/grype scan the staged pack directory (they catalog jars on a filesystem path).
      - name: Install grype + syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          # not inherited by a later Git-Bash step on windows-latest otherwise (2026-09-21)
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Generate SBOM (CycloneDX)
        run: syft "dir:$PK" -o cyclonedx-json="${PACK_NAME}.sbom.cdx.json"

      - name: CVE scan (gates the release, fails on any Critical finding)
        run: |
          grype "dir:$PK" -c .grype.yaml \
            -o json --file "${PACK_NAME}.cve-report.json" --fail-on critical

      - name: Sign tarball (Sigstore attestation)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ env.PACK_NAME }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.adapter.name }}-${{ matrix.os.variant }}
          path: |
            pgwire-${{ matrix.adapter.name }}-pack-*-${{ matrix.os.variant }}.tar.gz
            pgwire-${{ matrix.adapter.name }}-pack-*-${{ matrix.os.variant }}.tar.gz.asc
            pgwire-${{ matrix.adapter.name }}-pack-*-${{ matrix.os.variant }}.tar.gz.sha256
            pgwire-${{ matrix.adapter.name }}-pack-*-${{ matrix.os.variant }}.sbom.cdx.json
            pgwire-${{ matrix.adapter.name }}-pack-*-${{ matrix.os.variant }}.cve-report.json

  # Proves a just-built bundle actually runs on a clean machine: no repo checkout
  # venv, no setup-java/setup-uv, nothing but the tarball itself + a psql client.
  # This is what would have caught the airgapped-bundle relocation defect (an
  # absolute cpython/bin/python symlink + an editable buenavista install) --
  # `bundle` only ever ran on the SAME runner/checkout that built the bundle.
  # Any failing step here fails the workflow run.
  smoke:
    needs: [plan, runtime, pack]
    # A run that builds no Unix bundle has nothing for this job (an empty matrix is an error).
    if: needs.plan.outputs.smoke_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.smoke_os) }}
    runs-on: ${{ matrix.os.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack-file-${{ matrix.os.variant }}
          path: dl
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.os.variant }}
          path: dl

      - name: Install psql client
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          elif command -v brew >/dev/null 2>&1; then
            brew install libpq
            echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          else
            echo "no supported package manager to install psql" >&2
            exit 1
          fi

      - name: A pack with no runtime on its line is refused at start, naming the line
        run: |
          set -euo pipefail
          mkdir -p alone
          python3 -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" \
            "$(ls dl/pgwire-file-pack-*-${{ matrix.os.variant }}.tar.gz)" alone
          line=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['runtime_line'])" \
            "alone/packs/file/$VERSION/pack.json")
          if "alone/packs/file/$VERSION/bin/pgwire-file" --port 5454 > alone.out 2>&1; then
            echo "the pack started without its runtime" >&2; exit 1
          fi
          grep -F "requires a pgwire-calcite runtime on line $line, and none is installed" alone.out \
            || { echo "the refusal does not name the runtime line:" >&2; cat alone.out >&2; exit 1; }

      - name: Extract the runtime and the pack into one root with Python's safe tarfile filter (proves relocatability)
        run: |
          set -euo pipefail
          mkdir -p smoke
          for tar_path in dl/pgwire-calcite-runtime-*-${{ matrix.os.variant }}.tar.gz dl/pgwire-file-pack-*-${{ matrix.os.variant }}.tar.gz; do
            python3 -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" "$tar_path" smoke
          done
          echo "RUNTIME_DIR=smoke/runtimes/$VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=smoke/packs/file/$VERSION" >> "$GITHUB_ENV"

      - name: Fixture directory (one CSV) for the file adapter's model.json
        run: |
          set -euo pipefail
          # model.json's FileSchemaFactory "directory" operand is "data",
          # resolved relative to the model file -> seed it there.
          mkdir -p "$BUNDLE_DIR/model/data"
          printf 'id,name\n1,alice\n2,bob\n' > "$BUNDLE_DIR/model/data/people.csv"

      - name: Start pgwire-file and wait for the port
        run: |
          set -euo pipefail
          # The runtime and everything the pack ships but its model are made read-only, and the
          # host offers no Java: the server must start from the runtime's JRE and write no
          # classpath file. model/ stays writable: the file adapter keeps its data directory and
          # its cache beside its model (model/data, model/.aperio).
          chmod -R a-w "$RUNTIME_DIR"
          for part in "$BUNDLE_DIR"/*; do
            [ "$(basename "$part")" = "model" ] || chmod -R a-w "$part"
          done
          chmod a-w "$BUNDLE_DIR"
          export PGWIRE_CALCITE_STATE_DIR="$PWD/smoke-state"
          env -u JAVA_HOME "$BUNDLE_DIR/bin/pgwire-file" --port 5455 --auth trust > smoke-server.log 2>&1 &
          echo $! > smoke-server.pid
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/5455) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "port 5455 is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "pgwire-file never opened port 5455" >&2
          cat smoke-server.log >&2
          exit 1

      - name: psql SELECT 1
        run: |
          set -euo pipefail
          psql "host=127.0.0.1 port=5455 user=tester dbname=postgres" -c "SELECT 1;"

      - name: Query the fixture table, from the shared runtime, with no classpath file written
        run: |
          set -euo pipefail
          rows="$(psql "host=127.0.0.1 port=5455 user=tester dbname=postgres" -At -c "SELECT count(*) FROM people;")"
          test "$rows" = "2" || { echo "expected 2 rows in people, got '$rows'" >&2; exit 1; }
          grep -F "JVM library: $(cd "$RUNTIME_DIR" && pwd)/jre/" smoke-server.log \
            || { echo "the Calcite JVM did not start from the runtime's JRE" >&2; exit 1; }
          test ! -e "$BUNDLE_DIR/jars.classpath" && test ! -e "$RUNTIME_DIR/jars.classpath" \
            || { echo "jars.classpath was written into the install tree" >&2; exit 1; }

      # Key sign-in (ASKAM-010) on the bundle as built: the server, its launcher and the
      # Python and Java it carries. The file bundle is used because it starts without a store;
      # sign-in is the same server code under one launcher argument, which the govdata bundle
      # has baked in. The key service is a stand-in on loopback and the keys are made up.
      - name: Key sign-in on the built bundle, against a stand-in key service
        run: |
          set -euo pipefail
          kill "$(cat smoke-server.pid)" 2>/dev/null || true
          cat > key-service.py <<'PY'
          import http.server, json, sys
          GOOD = {"ask_smoke_key_alpha_0123456789", "ask_smoke_key_bravo_9876543210"}
          SPENT = "ask_smoke_key_spent_5555555555"
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def _send(self, status, body):
                  data = json.dumps(body).encode()
                  self.send_response(status); self.send_header("Content-Length", str(len(data)))
                  self.end_headers(); self.wfile.write(data)
              def do_GET(self):
                  key = self.headers.get("X-API-Key")
                  if key in GOOD: self._send(200, {"remaining_bytes": 1000})
                  elif key == SPENT: self._send(200, {"remaining_bytes": 0})
                  else: self._send(401, {"error": "refused"})
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", "0")))
                  with open("usage.log", "a") as f: f.write((self.headers.get("X-API-Key") or "") + "\n")
                  self._send(200, {})
          http.server.ThreadingHTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          python3 key-service.py 5490 & echo $! > key-service.pid
          : > usage.log
          export ASKAMERICA_API_URL="http://127.0.0.1:5490"
          # The key of whoever starts the server is never anyone's metering identity.
          export ASKAMERICA_API_KEY="ask_smoke_key_of_the_starter"
          env -u JAVA_HOME "$BUNDLE_DIR/bin/pgwire-file" --port 5456 --auth askamerica-key > signin-server.log 2>&1 &
          echo $! > smoke-server.pid
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/5456) 2>/dev/null; then exec 3>&- 3<&-; break; fi
            sleep 0.5
          done
          conn="host=127.0.0.1 port=5456 user=askamerica dbname=postgres"
          attempt() { PGPASSWORD="$1" psql -w -v VERBOSITY=verbose "$conn" -At -c "$2" > attempt.out 2>&1; }

          if PGPASSWORD= psql -w "$conn" -At -c "SELECT 1" > attempt.out 2>&1; then
            echo "a connection with no key was admitted" >&2; exit 1
          fi
          if attempt "ask_smoke_key_wrong_0000000000" "SELECT 1"; then
            echo "a connection with a refused key was admitted" >&2; exit 1
          fi
          # psql prints a refused connection's message, not its SQLSTATE (28P01, which the
          # server's own tests check on the wire).
          grep -q "password authentication failed" attempt.out || { echo "a refused key was not refused as a failed sign-in:" >&2; cat attempt.out >&2; exit 1; }

          attempt "ask_smoke_key_alpha_0123456789" "SELECT count(*) FROM people" || { cat attempt.out >&2; exit 1; }
          test "$(cat attempt.out)" = "2" || { echo "a good key did not get its rows" >&2; cat attempt.out >&2; exit 1; }
          attempt "ask_smoke_key_bravo_9876543210" "SELECT count(*) FROM people" || { cat attempt.out >&2; exit 1; }
          attempt "ask_smoke_key_bravo_9876543210" "SELECT count(*) FROM people" || { cat attempt.out >&2; exit 1; }

          if attempt "ask_smoke_key_spent_5555555555" "SELECT count(*) FROM people"; then
            echo "a key out of quota ran a statement" >&2; exit 1
          fi
          grep -q "53400" attempt.out || { echo "an out-of-quota statement was not answered with 53400:" >&2; cat attempt.out >&2; exit 1; }

          for _ in $(seq 1 20); do [ "$(wc -l < usage.log)" -ge 3 ] && break; sleep 0.5; done
          echo "usage reported under: $(sort usage.log | uniq -c | sed 's/ask_smoke_key_\([a-z]*\)_.*/key \1/' | tr '\n' ';')"
          test "$(grep -c alpha usage.log)" = "1" || { echo "usage under the first key: expected 1" >&2; exit 1; }
          test "$(grep -c bravo usage.log)" = "2" || { echo "usage under the second key: expected 2" >&2; exit 1; }
          ! grep -q "of_the_starter" usage.log || { echo "usage was reported under the starter's key" >&2; exit 1; }

          kill "$(cat key-service.pid)"
          sleep 1
          if attempt "ask_smoke_key_charlie_1111111111" "SELECT 1"; then
            echo "a key was admitted with the key service down" >&2; exit 1
          fi
          grep -q "key service could not be reached" attempt.out || { echo "sign-in with the key service down was not refused by name:" >&2; cat attempt.out >&2; exit 1; }

          # No key, and no beginning of one, in anything the server wrote or psql was told.
          ! grep -q "ask_smoke_key_" attempt.out || { echo "a key appears in a refusal" >&2; exit 1; }
          ! grep -q "ask_smoke_key_" signin-server.log || { echo "a key appears in the server's log" >&2; exit 1; }
          echo "key sign-in: refused without a key and with a refused key, admitted and metered per key, fails closed"

      - name: Stop pgwire-file
        if: always()
        run: |
          set -euo pipefail
          if [ -f smoke-server.pid ]; then
            kill "$(cat smoke-server.pid)" 2>/dev/null || true
          fi

      - name: Server log
        if: always()
        run: cat smoke-server.log || true

  # The only job that attaches anything to a release. It runs after the smoke job, so a bundle
  # that does not start is never published, and only when this run publishes (see PUBLISH).
  # The Windows bundle, started. Its launcher is generated separately from the Unix one (a .bat
  # run through cmd.exe), and until this job nothing in a release build ran it: the Windows
  # server of 0.109.2 and earlier could not start at all (its classpath was cut at cmd.exe's
  # 8,191 characters, issue 497) and every release build was green.
  smoke-windows:
    needs: [plan, runtime, pack]
    if: needs.plan.outputs.smoke_windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack-file-windows-x86_64
          path: dl
      - uses: actions/download-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: dl

      - name: A pack with no runtime on its line is refused at start, naming the line
        run: |
          $tar = (Get-ChildItem dl -Filter 'pgwire-file-pack-*-windows-x86_64.tar.gz' | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force alone | Out-Null
          python -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" $tar alone
          if ($LASTEXITCODE -ne 0) { throw "could not extract $tar" }
          $line = (Get-Content "alone\packs\file\$env:VERSION\pack.json" -Raw | ConvertFrom-Json).runtime_line
          $out = & cmd /c "alone\packs\file\$env:VERSION\bin\pgwire-file.bat --port 5454 2>&1"
          if ($LASTEXITCODE -eq 0) { throw "the pack started without its runtime" }
          if ("$out" -notmatch [regex]::Escape("requires a pgwire-calcite runtime on line $line, and none is installed")) { throw "the refusal does not name the runtime line: $out" }
          $global:LASTEXITCODE = 0

      - name: Extract the runtime and the pack into one root with Python's safe tarfile filter (proves relocatability)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          foreach ($pattern in 'pgwire-calcite-runtime-*-windows-x86_64.tar.gz', 'pgwire-file-pack-*-windows-x86_64.tar.gz') {
            $tar = (Get-ChildItem dl -Filter $pattern | Select-Object -First 1).FullName
            python -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" $tar smoke
            if ($LASTEXITCODE -ne 0) { throw "could not extract $tar" }
          }
          $root = (Resolve-Path smoke).Path
          "ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUNTIME_DIR=$root\runtimes\$env:VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLE_DIR=$root\packs\file\$env:VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fixture directory (one CSV) for the file adapter's model.json
        run: |
          New-Item -ItemType Directory -Force "$env:BUNDLE_DIR\model\data" | Out-Null
          Set-Content -Path "$env:BUNDLE_DIR\model\data\people.csv" -Value "id,name`n1,alice`n2,bob" -Encoding ascii

      # One step: a Windows runner ends the processes a step started when the step ends, so a
      # server started in one step is gone by the next.
      - name: Start pgwire-file and query the fixture table, from the bundled runtime, with the whole classpath
        run: |
          # The host offers no Java: the server must start from the runtime it carries.
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          $env:PGWIRE_CALCITE_STATE_DIR = "$PWD\smoke-state"
          # Started directly, with its output redirected by PowerShell: a `cmd /c` line holding
          # two quoted paths loses its outer quotes and starts nothing.
          Start-Process -FilePath "$env:BUNDLE_DIR\bin\pgwire-file.bat" -ArgumentList '--port', '5455', '--auth', 'trust' -RedirectStandardOutput smoke-server.out -RedirectStandardError smoke-server.log -WindowStyle Hidden
          $up = $false
          foreach ($i in 1..120) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 5455); $c.Close(); $up = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) { throw "pgwire-file never opened port 5455" }
          Write-Host "port 5455 is up"

          $psql = if ($env:PGBIN) { Join-Path $env:PGBIN 'psql.exe' } else { 'psql.exe' }
          Write-Host "psql: $((Get-Command $psql).Source)"
          $rows = & $psql "host=127.0.0.1 port=5455 user=tester dbname=postgres" -At -c "SELECT count(*) FROM people;"
          if ($LASTEXITCODE -ne 0 -or "$rows".Trim() -ne '2') { throw "expected 2 rows in people, got '$rows' (psql exit $LASTEXITCODE)" }
          $log = "$(Get-Content smoke-server.log -Raw)$(Get-Content smoke-server.out -Raw)"
          $jars = @(Get-ChildItem "$env:RUNTIME_DIR\jars" -Filter *.jar).Count + @(Get-ChildItem "$env:BUNDLE_DIR\jars" -Filter *.jar).Count
          if ($log -notmatch 'JVM started with (\d+) classpath entries') { throw "the server did not say how many classpath entries its JVM started with" }
          $entries = [int]$Matches[1]
          Write-Host "the runtime and the pack hold $jars jars; the JVM started with $entries classpath entries"
          if ($entries -lt $jars) { throw "the JVM was given $entries of the runtime's and pack's $jars jars" }
          if ($log -notmatch ('JVM library: ' + [regex]::Escape("$env:RUNTIME_DIR\jre\"))) { throw "the Calcite JVM did not start from the runtime's JRE" }
          if ((Test-Path "$env:BUNDLE_DIR\jars.classpath") -or (Test-Path "$env:RUNTIME_DIR\jars.classpath")) { throw "jars.classpath was written into the install tree" }

          # Key sign-in (ASKAM-010) on the Windows bundle, as the Unix smoke job does it: the
          # file bundle started with the launcher argument the govdata bundle has baked in,
          # against a stand-in key service on loopback, with made-up keys. Same step as above:
          # the runner ends a step's processes when the step ends.
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($env:ROOT_DIR) } | Stop-Process -Force -ErrorAction SilentlyContinue
          @'
          import http.server, json, sys
          GOOD = {"ask_smoke_key_alpha_0123456789", "ask_smoke_key_bravo_9876543210"}
          SPENT = "ask_smoke_key_spent_5555555555"
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def _send(self, status, body):
                  data = json.dumps(body).encode()
                  self.send_response(status); self.send_header("Content-Length", str(len(data)))
                  self.end_headers(); self.wfile.write(data)
              def do_GET(self):
                  key = self.headers.get("X-API-Key")
                  if key in GOOD: self._send(200, {"remaining_bytes": 1000})
                  elif key == SPENT: self._send(200, {"remaining_bytes": 0})
                  else: self._send(401, {"error": "refused"})
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", "0")))
                  with open("usage.log", "a") as f: f.write((self.headers.get("X-API-Key") or "") + "\n")
                  self._send(200, {})
          http.server.ThreadingHTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          '@ -replace '(?m)^          ', '' | Set-Content -Path key-service.py -Encoding ascii
          Set-Content -Path usage.log -Value $null
          $keyService = Start-Process python -ArgumentList 'key-service.py', '5490' -PassThru -WindowStyle Hidden
          $env:ASKAMERICA_API_URL = 'http://127.0.0.1:5490'
          # The key of whoever starts the server is never anyone's metering identity.
          $env:ASKAMERICA_API_KEY = 'ask_smoke_key_of_the_starter'
          Start-Process -FilePath "$env:BUNDLE_DIR\bin\pgwire-file.bat" -ArgumentList '--port', '5456', '--auth', 'askamerica-key' -RedirectStandardOutput signin-server.out -RedirectStandardError signin-server.log -WindowStyle Hidden
          $up = $false
          foreach ($i in 1..120) {
            if (Select-String -Path signin-server.log, signin-server.out -Pattern 'listening on 127.0.0.1:5456' -Quiet -ErrorAction SilentlyContinue) { $up = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $up) { Get-Content signin-server.out, signin-server.log -ErrorAction SilentlyContinue; throw "pgwire-file with key sign-in never listened on 5456" }
          $conn = "host=127.0.0.1 port=5456 user=askamerica dbname=postgres"
          function Attempt($key, $sql) {
            $env:PGPASSWORD = $key
            $script:attemptOut = (& $psql -w -v VERBOSITY=verbose $conn -At -c $sql 2>&1 | Out-String)
            return $LASTEXITCODE -eq 0
          }
          if (Attempt '' 'SELECT 1') { throw "a connection with no key was admitted" }
          if (Attempt 'ask_smoke_key_wrong_0000000000' 'SELECT 1') { throw "a connection with a refused key was admitted" }
          if ($attemptOut -notmatch 'password authentication failed') { throw "a refused key was not refused as a failed sign-in: $attemptOut" }
          if (-not (Attempt 'ask_smoke_key_alpha_0123456789' 'SELECT count(*) FROM people')) { throw "a good key was refused: $attemptOut" }
          if ($attemptOut.Trim() -ne '2') { throw "a good key did not get its rows: $attemptOut" }
          if (-not (Attempt 'ask_smoke_key_bravo_9876543210' 'SELECT count(*) FROM people')) { throw "the second good key was refused: $attemptOut" }
          if (-not (Attempt 'ask_smoke_key_bravo_9876543210' 'SELECT count(*) FROM people')) { throw "the second good key was refused: $attemptOut" }
          if (Attempt 'ask_smoke_key_spent_5555555555' 'SELECT count(*) FROM people') { throw "a key out of quota ran a statement" }
          if ($attemptOut -notmatch '53400') { throw "an out-of-quota statement was not answered with 53400: $attemptOut" }
          foreach ($i in 1..20) { if (@(Get-Content usage.log).Count -ge 3) { break }; Start-Sleep -Milliseconds 500 }
          $usage = @(Get-Content usage.log)
          $alpha = @($usage | Where-Object { $_ -match 'alpha' }).Count
          $bravo = @($usage | Where-Object { $_ -match 'bravo' }).Count
          Write-Host "usage reported under: key alpha $alpha; key bravo $bravo"
          if ($alpha -ne 1) { throw "usage under the first key: expected 1, got $alpha" }
          if ($bravo -ne 2) { throw "usage under the second key: expected 2, got $bravo" }
          if ($usage | Where-Object { $_ -match 'of_the_starter' }) { throw "usage was reported under the starter's key" }
          Stop-Process -Id $keyService.Id -Force
          Start-Sleep -Seconds 1
          if (Attempt 'ask_smoke_key_charlie_1111111111' 'SELECT 1') { throw "a key was admitted with the key service down" }
          if ($attemptOut -notmatch 'key service could not be reached') { throw "sign-in with the key service down was not refused by name: $attemptOut" }
          # No key, and no beginning of one, in anything the server wrote or psql was told.
          if ($attemptOut -match 'ask_smoke_key_') { throw "a key appears in a refusal" }
          $signinLog = "$(Get-Content signin-server.log -Raw)$(Get-Content signin-server.out -Raw)"
          if ($signinLog -match 'ask_smoke_key_') { throw "a key appears in the server's log" }
          $env:PGPASSWORD = $null
          # The last psql above was a refusal, as required; its exit code is not the step's.
          $global:LASTEXITCODE = 0
          Write-Host "key sign-in: refused without a key and with a refused key, admitted and metered per key, fails closed"

      - name: Stop pgwire-file
        if: always()
        run: |
          Get-Process | Where-Object { $_.Path -and $env:ROOT_DIR -and $_.Path.StartsWith($env:ROOT_DIR) } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Server log
        if: always()
        run: |
          Get-Content smoke-server.out -ErrorAction SilentlyContinue
          Get-Content smoke-server.log -ErrorAction SilentlyContinue

  # The Maven Central bundles of this release (REQ-294: the pgwire runtime and packs reach installs
  # through Maven Central; the engine release builds, signs and publishes them for every supported
  # platform). Per platform: io.simpleishard:pgwire-calcite-runtime-<variant> and one artifact per
  # adapter pack, io.simpleishard:pgwire-<adapter>-<variant>, each the release tarball unchanged.
  # Every run lays them out; a publishing run signs them with the project key and attaches each
  # zip, with its sha256, to engine-v<version>. Nothing here uploads to Maven Central: "Promote to
  # Maven Central" (promote-maven-central.yml) is the separate, manual step, and
  # central-bundles.sh names these.
  maven-bundles:
    needs: [plan, runtime, pack, smoke, smoke-windows]
    # A smoke job is skipped in a run that builds no bundle for it; that must not skip this.
    if: >-
      always() && needs.runtime.result == 'success' && needs.pack.result == 'success'
      && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
      && (needs.smoke-windows.result == 'success' || needs.smoke-windows.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One platform per job: its runtime and every pack.
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Make room for the platform's bundles
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*-${{ matrix.os.variant }}
          merge-multiple: true
          path: tarballs
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.os.variant }}
          path: tarballs

      - name: Lay out the runtime and the packs as Central bundles
        run: |
          set -euo pipefail
          VER="${{ needs.plan.outputs.version }}"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          python3 .github/scripts/pgwire_maven_bundles.py tarballs bundles "$VER"
          rm -rf tarballs

      # pipefail: a key that fails to decode stops here, not as an empty import gpg reports as fine.
      - name: Import GPG key
        if: env.PUBLISH == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

      - name: Sign, checksum and zip each Central bundle
        env:
          GPG_KEY_ID:     ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p central
          for dir in bundles/*/; do
            artifact="$(basename "$dir")"
            while IFS= read -r -d '' f; do
              if [ "$PUBLISH" = "true" ]; then
                if [ -n "$GPG_PASSPHRASE" ]; then
                  gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                    --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
                else
                  gpg --batch --yes --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
                fi
                test -f "$f.asc" || { echo "$f was not signed" >&2; exit 1; }
              fi
              md5sum "$f" | cut -d' ' -f1 > "$f.md5"
              sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
            done < <(find "$dir" -type f ! -name '*.sha256' -print0)
            zip_name="${artifact}-${VERSION}-central-bundle.zip"
            # Stored, not deflated: the tarballs inside are already compressed.
            ( cd "$dir" && zip -qr0 "../../central/${zip_name}" io )
            ( cd central && sha256sum "$zip_name" > "${zip_name}.sha256" )
          done
          ls -l central

      - name: Report the bundle sizes for the promote
        run: |
          cat bundles/sizes.json
          {
            echo "### Central bundle sizes, ${{ matrix.os.variant }} (bytes)"
            [ "$PUBLISH" = "true" ] || echo "Not signed: this run does not publish."
            echo '```json'; cat bundles/sizes.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pgwire-central-bundles-${{ matrix.os.variant }}
          path: |
            central/*.zip
            central/*.zip.sha256
            bundles/sizes.json
          retention-days: 7

      - name: Attach to release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || format('engine-v{0}', github.event.inputs.version) }}"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            central/*-central-bundle.zip central/*-central-bundle.zip.sha256

  # The only jobs that attach the runtime and packs to a release. They run after the smoke jobs,
  # so a pack that does not start is never published, and only when this run publishes.
  publish:
    needs: [plan, runtime, pack, smoke, smoke-windows]
    # A smoke job is skipped in a run that builds no bundle for it; that must not skip this.
    if: >-
      always() && needs.runtime.result == 'success' && needs.pack.result == 'success'
      && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
      && (needs.smoke-windows.result == 'success' || needs.smoke-windows.result == 'skipped')
      && (github.event_name == 'release' || inputs.publish == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One pack per job: a govdata pack (its embedder model and packages) is the largest.
        adapter: ${{ fromJSON(needs.plan.outputs.adapters) }}
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - name: Refuse to publish from a run that was not asked to
        run: |
          test "$PUBLISH" = "true" || { echo "PUBLISH is '$PUBLISH'; this job must not run" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: pack-${{ matrix.adapter.name }}-${{ matrix.os.variant }}
          path: dist

      - name: Attach to release
        # Plain upload with --clobber: softprops/action-gh-release tries to *update* the release
        # object as well, which a dispatched run's token is not allowed to do.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="engine-v${{ needs.plan.outputs.version }}"
          ls -la dist
          # Every published tarball carries its signature: an unsigned one here means a
          # signing step was skipped in a run that publishes.
          for tarball in dist/pgwire-*.tar.gz; do
            test -f "${tarball}.asc" || { echo "${tarball} has no signature" >&2; exit 1; }
          done
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber dist/pgwire-*

  publish-runtime:
    needs: [plan, runtime, pack, smoke, smoke-windows]
    if: >-
      always() && needs.runtime.result == 'success' && needs.pack.result == 'success'
      && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
      && (needs.smoke-windows.result == 'success' || needs.smoke-windows.result == 'skipped')
      && (github.event_name == 'release' || inputs.publish == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - name: Refuse to publish from a run that was not asked to
        run: |
          test "$PUBLISH" = "true" || { echo "PUBLISH is '$PUBLISH'; this job must not run" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.os.variant }}
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="engine-v${{ needs.plan.outputs.version }}"
          ls -la dist
          for tarball in dist/pgwire-*.tar.gz; do
            test -f "${tarball}.asc" || { echo "${tarball} has no signature" >&2; exit 1; }
          done
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber dist/pgwire-*
