  linux-jdk11-oldest-guava-tz:
    if: github.event.action != 'labeled'
    name: 'Linux (JDK 11, oldest Guava, America/New_York Timezone)'
    runs-on: ubuntu-latest
    env:
      TZ: 'America/New_York' # flips between −05:00 and −04:00
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.jdk }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ env.GUAVA_MIN }} build

  linux-jdk11-latest-guava-tz:
    if: github.event.action != 'labeled'
    name: 'Linux (JDK 11, latest Guava, America/New_York Timezone)'
    runs-on: ubuntu-latest
    env:
      TZ: 'America/New_York' # flips between −05:00 and −04:00
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.jdk }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ env.GUAVA_MAX }} tasks build

  linux-jdk11-tz:
    if: github.event.action != 'labeled'
    name: 'Linux (JDK 11, Pacific/Chatham Timezone)'
    runs-on: ubuntu-latest
    env:
      TZ: 'Pacific/Chatham' # flips between +12:45 and +13:45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.jdk }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon build

  linux-jdk17:  # LTS JDK version, don't remove until EOL
    if: github.event.action != 'labeled'
    name: 'Linux (JDK 17)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 17'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.jdk }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ env.GUAVA }} build

  linux-jdk121:  # LTS JDK version, don't remove until EOL
    if: github.event.action != 'labeled'
    name: 'Linux (JDK 21)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 21'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.jdk }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ env.GUAVA }} build

  mac:
    if: github.event.action != 'labeled'
    name: 'macOS (JDK 21)'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 21'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk21
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon build javadoc
      - name: 'sqlline and sqllsh'
        run: |
          ./sqlline -e '!quit'
          echo
          echo Sqlline example/csv
          ./example/csv/sqlline --verbose -u jdbc:calcite:model=example/csv/src/test/resources/model.json -n admin -p admin -f example/csv/src/test/resources/smoke_test.sql
          echo
          echo sqlsh
          ./sqlsh -o headers "select count(*) commits, author from (select substring(author, 1, position(' <' in author)-1) author from git_commits) group by author order by count(*) desc, author limit 20"

  errorprone-guava-latest:
    if: github.event.action != 'labeled'
    name: 'ErrorProne (JDK 11, latest Guava)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: errprone
          remote-build-cache-proxy-enabled: false
          # ErrorProne checks for Beta APIs, so use the latest supported Guava version
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ env.GUAVA_MAX }} -PenableErrorprone classes

  linux-checkerframework:
    name: 'CheckerFramework (JDK 11)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - name: 'Run CheckerFramework'
        uses: burrunan/gradle-cache-action@v1
        with:
          job-id: checkerframework-jdk11
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -PenableCheckerframework :linq4j:classes :core:classes :server:classes

  linux-checkerframework-oldest-guava:
    name: 'CheckerFramework (JDK 11, oldest Guava)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - name: 'Run CheckerFramework'
        uses: burrunan/gradle-cache-action@v1
        with:
          job-id: checkerframework-jdk11
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Pguava.version=${{ env.GUAVA_MIN }} -PenableCheckerframework :linq4j:classes :core:classes :server:classes

  linux-slow:
    # Run slow tests when the commit is on main or it is requested explicitly by adding an
    # appropriate label in the PR
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'slow-tests-needed')
    name: 'Linux (JDK 11) Slow Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk11
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon testSlow

  linux-druid:
    if: github.event.action != 'labeled'
    name: 'Druid Tests'
    runs-on: ubuntu-latest
    steps:
    - name: 'Set up JDK 17'
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'zulu'
    - name: 'Checkout Druid dataset'
      uses: actions/checkout@v5
      with:
        repository: zabetak/calcite-druid-dataset
        fetch-depth: 1
        path: druid-dataset
    - name: 'Start Druid containers'
      working-directory: ./druid-dataset
      run: |
        chmod -R 777 storage
        docker compose up -d
    - name: 'Wait Druid nodes to startup'
      run: |
        until docker logs coordinator | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs router | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs historical | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs middlemanager | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
        until docker logs broker | grep "Successfully started lifecycle \[module\]"; do sleep 1s; done
    - name: 'Index Foodmart/Wikipedia datasets'
      working-directory: ./druid-dataset
      run: ./index.sh 30s
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        path: calcite
    - uses: burrunan/gradle-cache-action@v1
      name: 'Run Druid tests'
      timeout-minutes: 10
      with:
        build-root-directory: ./calcite
        job-id: Druid8
        remote-build-cache-proxy-enabled: false
        arguments: --scan --no-parallel --no-daemon :druid:test -Dcalcite.test.druid=true

  linux-splunk:
    if: github.event.action != 'labeled'
    name: 'Splunk Tests'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: 'Set up JDK 17'
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'zulu'
    # Starting this image accepts Splunk's licence and general terms; it runs under the
    # trial licence a new installation has. The password exists for this job only.
    - name: 'Start Splunk'
      run: |
        password="Ci-$(openssl rand -hex 16)"
        echo "::add-mask::$password"
        docker run -d --name splunk -p 127.0.0.1:8089:8089 \
          -e SPLUNK_START_ARGS=--accept-license \
          -e SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com \
          -e SPLUNK_PASSWORD="$password" \
          splunk/splunk:10.4.4
        {
          echo "splunk.url=https://127.0.0.1:8089"
          echo "splunk.username=admin"
          echo "splunk.password=$password"
          echo "splunk.ssl.insecure=true"
        } > splunk/local-properties.settings
    - name: 'Wait for the Splunk management port'
      run: |
        password="$(sed -n 's/^splunk.password=//p' splunk/local-properties.settings)"
        for attempt in $(seq 1 90); do
          status="$(curl -sk -o /dev/null -w '%{http_code}' -u "admin:$password" \
            https://127.0.0.1:8089/services/server/info || true)"
          if [ "$status" = "200" ]; then
            echo "Splunk answered after $attempt attempts"
            exit 0
          fi
          sleep 5
        done
        docker logs --tail 50 splunk
        echo "Splunk did not answer on 8089 within 450 seconds (last status $status)"
        exit 1
    # The tests tagged splunk-data need the CIM data models and indexed events, which a new
    # container does not have; see splunk/build.gradle.kts
    - uses: burrunan/gradle-cache-action@v1
      name: 'Run Splunk tests'
      timeout-minutes: 20
      with:
        job-id: Splunk17
        remote-build-cache-proxy-enabled: false
        arguments: --scan --no-parallel --no-daemon :splunk:test -PincludeTags=integration -PexcludeTags=splunk-data
