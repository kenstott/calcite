# The default workflow for GitHub Actions that is used for continuous
# integration. A configuration file that is used to control when, where,
# and how different CI jobs are executed.
# For more information on how to modify this file check the following link:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions

name: CI

on:
  push:
    paths-ignore:
      - 'site/**'
    branches:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'site/**'
    # '**' also matches a base branch with a slash in its name, so a pull request stacked on
    # another pull request's branch is checked too
    branches:
      - '**'

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

# Throw OutOfMemoryError in case less than 35% is free after full GC
# This avoids never-ending GC trashing if memory gets too low in case of a memory leak
env:
  _JAVA_OPTIONS: '-XX:GCTimeLimit=90 -XX:GCHeapFreeLimit=35'
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  GUAVA_MIN: '21.0' # oldest supported Guava version
  GUAVA_MAX: '33.4.8-jre' # latest supported Guava version
  GUAVA: '21.0' # most jobs test against oldest Guava version

jobs:
  windows-jdk11:
    if: github.event.action != 'labeled'
    name: 'Windows (JDK 11)'
    runs-on: windows-latest
    steps:
    - name: 'Install winutils'
      # Hadoop's local file system needs winutils.exe and hadoop.dll on Windows. Apache publishes no
      # binaries; these are the 3.4.0 build from kontext-tech/winutils, pinned to one commit.
      shell: pwsh
      run: |
        $bin = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hadoop\bin"
        foreach ($file in "winutils.exe", "hadoop.dll") {
          Invoke-WebRequest -OutFile "$bin\$file" -Uri "https://raw.githubusercontent.com/kontext-tech/winutils/ff8e529a72bde2ec95b06ab76e797bdcbade9685/hadoop-3.4.0-win10-x64/bin/$file"
        }
        "HADOOP_HOME=$env:RUNNER_TEMP\hadoop" >> $env:GITHUB_ENV
        # hadoop.dll is found through the library path, which Windows takes from PATH
        "$bin" >> $env:GITHUB_PATH
    - uses: actions/checkout@v5
      with:
        fetch-depth: 50
    - name: 'Set up JDK 11'
      uses: actions/setup-java@v5
      with:
        # The Trino modules compile with a JDK 25 toolchain, which the Windows image does not
        # carry; the last version listed is the one the build runs on.
        java-version: |
          25
          11
        distribution: 'zulu'
    - uses: burrunan/gradle-cache-action@v1
      name: Test
      with:
        job-id: jdk${{ matrix.jdk }}
        remote-build-cache-proxy-enabled: false
        arguments: --scan --no-parallel --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 build javadoc
    - name: 'sqlline and sqllsh'
      shell: cmd
      run: |
        call sqlline.bat -e '!quit'
        echo.
        echo Sqlline example/csv
        call example/csv/sqlline.bat --verbose -u jdbc:calcite:model=example/csv/src/test/resources/model.json -n admin -p admin -f example/csv/src/test/resources/smoke_test.sql
        echo.
        echo sqlsh
        call sqlsh.bat -o headers "select count(*) commits, author from (select substring(author, 1, position(' <' in author)-1) author from git_commits) group by author order by count(*) desc, author limit 20"

  windows-jdk17:
    if: github.event.action != 'labeled'
    name: 'Windows (JDK 17)'
    runs-on: windows-latest
    steps:
      - name: 'Install winutils'
        # Hadoop's local file system needs winutils.exe and hadoop.dll on Windows. Apache publishes no
        # binaries; these are the 3.4.0 build from kontext-tech/winutils, pinned to one commit.
        shell: pwsh
        run: |
          $bin = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hadoop\bin"
          foreach ($file in "winutils.exe", "hadoop.dll") {
            Invoke-WebRequest -OutFile "$bin\$file" -Uri "https://raw.githubusercontent.com/kontext-tech/winutils/ff8e529a72bde2ec95b06ab76e797bdcbade9685/hadoop-3.4.0-win10-x64/bin/$file"
          }
          "HADOOP_HOME=$env:RUNNER_TEMP\hadoop" >> $env:GITHUB_ENV
          # hadoop.dll is found through the library path, which Windows takes from PATH
          "$bin" >> $env:GITHUB_PATH
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: 'Set up JDK 17'
        uses: actions/setup-java@v5
        with:
          # The Trino modules compile with a JDK 25 toolchain, which the Windows image does not
          # carry; the last version listed is the one the build runs on.
          java-version: |
            25
            17
          distribution: 'zulu'
      - uses: burrunan/gradle-cache-action@v1
        name: Test
        with:
          job-id: jdk${{ matrix.jdk }}
          remote-build-cache-proxy-enabled: false
          arguments: --scan --no-parallel --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 build
      - name: 'sqlline and sqllsh'
        shell: cmd
        run: |
