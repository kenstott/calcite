name: AskAmerica Engine

on:
  push:
    tags:
      - 'engine-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

# One run per release at a time (queued, never cancelled). Two runs for one release (a manual
# dispatch beside the automatic one, engine-v0.110.0; a tag pushed twice, engine-v0.110.1) uploaded
# the same assets with --clobber concurrently, and each lost an upload to the other's delete
# (HTTP 404). Queued, the second run re-uploads after the first instead of racing it; cancelling
# could kill a half-finished upload.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version && format('engine-v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

# actions: write is needed by the bundles job, which dispatches the separate
# "pgwire-adapters release" workflow (its `release: types:
# [created]` trigger does not fire reliably — confirmed live, every prior run this
# project has ever had was a manual workflow_dispatch) when this version's bundle isn't
# already published.
permissions:
  contents: write
  actions: write

jobs:
  # ── GovData ETL JAR (used by run-all-dq.sh on ingest servers) ────────────
  govdata-jar:
    name: Build govdata shadow JAR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build govdata shadow JAR
        run: ./gradlew :govdata:shadowJar --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename to stable asset name
        run: |
          JAR=$(find govdata/build/libs -name "sih-govdata-*.jar" -o -name "calcite-govdata-*-all.jar" | head -1)
          echo "JAR: $JAR ($(du -sh "$JAR" | cut -f1))"
          cp "$JAR" govdata/build/libs/sih-govdata.jar

      - name: Upload govdata JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: govdata-jar
          path: govdata/build/libs/sih-govdata.jar
          retention-days: 30

  # ── Trino connector plugins (calcite, sharepoint, splunk) ──────────────────
  trino-plugins:
    name: Build Trino connector plugins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 25 for the connector toolchain (Trino SPI) + Java 21 to run Gradle.
      # Last-listed becomes the default JAVA_HOME (21), which runs Gradle.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            25
            21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build plugin packages
        run: |
          ./gradlew \
            :trino-calcite:trinoPlugin \
            :trino-sharepoint:trinoPlugin \
            :trino-splunk:trinoPlugin \
            :trino-salesforce:trinoPlugin \
            :trino-servicenow:trinoPlugin \
            :trino-file:trinoPlugin \
            :trino-cloudops:trinoPlugin \
            -Porg.gradle.java.installations.paths="${JAVA_HOME_25_X64},${JAVA_HOME_21_X64}" \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect plugin archives (stable names)
        run: |
          mkdir -p trino-assets
          for m in trino-calcite trino-sharepoint trino-splunk trino-salesforce trino-servicenow trino-file trino-cloudops; do
            src=$(ls ${m}/build/distributions/${m}-plugin-*.zip | head -1)
            cp "$src" "trino-assets/${m}-plugin.zip"
          done
          ls -lh trino-assets/

      - name: Upload Trino plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trino-plugins
          path: trino-assets/*.zip
          retention-days: 30

  # ── JAR build (ubuntu only — same JAR works on all platforms via JPype) ────
  jar:
    name: Build shadow JAR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # -PreleaseVersion is what stamps AskAmerica-Engine-Version into the jar manifest.
      # Without it the published asset carries no engine version, EngineInstaller cannot
      # tell whether a cached jar is current, and every install is pinned to whatever jar
      # it downloaded first.
      - name: Build shadow JAR
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          ./gradlew :askamerica-engine:shadowJar --no-daemon -PreleaseVersion="$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report JAR size
        run: |
          JAR=$(find askamerica-engine/build/libs -name "askamerica-engine*.jar" | head -1)
          echo "JAR: $JAR"
          echo "JAR size: $(du -sh "$JAR" | cut -f1)"
          # Rename to a stable name for the release asset
          cp "$JAR" askamerica-engine/build/libs/askamerica-engine.jar

      - name: Slimming guards (distribution.md)
        # Lock in the read-only slimming so a transitive dep can't silently reintroduce
        # bloat. Fail the build rather than ship a regressed asset.
        run: |
          JAR=askamerica-engine/build/libs/askamerica-engine.jar
          fail=0
          entries=$(unzip -l "$JAR" | awk '{print $4}')
          # Tier-2a: AWS SDK v1 codegen JSON must be stripped (flat models/*.json only).
          n=$(echo "$entries" | grep -cE '^models/.*-(intermediate|model)\.json$' || true)
          [ "$n" -eq 0 ] || { echo "FAIL: $n AWS codegen JSON entries under models/"; fail=1; }
          # Tier-1: orphaned ML resources must be stripped.
          for pat in 'models/all-MiniLM' 'native/lib/'; do
            c=$(echo "$entries" | grep -cE "^${pat}" || true)
            [ "$c" -eq 0 ] || { echo "FAIL: orphan '$pat' present ($c)"; fail=1; }
          done
          # ASKAM-007: no embedder in the engine jar; semantic search is served by the data server.
          c=$(echo "$entries" | grep -cE '^ai/onnxruntime/|^models/snowflake-arctic-embed-xs/|\.onnx$' || true)
          [ "$c" -eq 0 ] || { echo "FAIL: $c embedder entries (ONNX Runtime or a model) in the engine jar"; fail=1; }
          # Tier-3: Arrow Gandiva must be stripped (reached only via reflective .arrow path).
          for pat in 'gandiva_jni/' 'org/apache/arrow/gandiva/'; do
            c=$(echo "$entries" | grep -cE "^${pat}" || true)
            [ "$c" -eq 0 ] || { echo "FAIL: gandiva '$pat' present ($c)"; fail=1; }
          done
          # ASKAM-008/009: a thin engine. Nothing that opens the store is in the jar: no govdata
          # beyond the three shared classes (plus the two JDK-only file helpers VariableResolver and PeriodFormat), no file adapter, hadoop, iceberg, aws, parquet, arrow.
          c=$(echo "$entries" | grep -E '^org/apache/hadoop/|^org/apache/iceberg/|^software/amazon/|^com/amazonaws/|^org/apache/parquet/|^org/apache/arrow/|^org/apache/calcite/adapter/driver/|^org/apache/calcite/adapter/file/|^org/apache/calcite/adapter/govdata/.*\.class$' \
              | grep -cvE '^org/apache/calcite/adapter/govdata/(R2CredentialProvider|GovDataCatalog|YamlUtils)(\$[^/]*)?\.class$|^org/apache/calcite/adapter/file/etl/((VariableResolver|PeriodFormat)[^/]*\.class)?$|^org/apache/calcite/adapter/file/$' || true)
          [ "$c" -eq 0 ] || { echo "FAIL: $c entries of the data stack in the engine jar"; fail=1; }
          # The catalog the tools describe: the schema YAMLs must be in the jar.
          y=$(echo "$entries" | grep -cE -- '-schema\.yaml$' || true)
          [ "$y" -ge 20 ] || { echo "FAIL: only $y schema YAMLs in the jar; search_catalog would be empty"; fail=1; }
          # Logging binding: slf4j-reload4j and log4j-slf4j-impl both ship
          # org/slf4j/impl/StaticLoggerBinder.class, so which backend SLF4J 1.7 binds to is decided
          # by jar merge order. Bound to reload4j — which nothing in this jar configures — every
          # govdata and file log statement is discarded, and a cold start that spends minutes
          # rebuilding Iceberg views presents as a hung MCP server with an empty log. Assert the
          # binding rather than trusting the ordering.
          # Assert the merged StaticLoggerBinder is log4j2's copy by the factory it names. Checking
          # for the absence of reload4j's classes is not enough: they arrive embedded in a
          # dependency and survive both a module exclude and a shadow dependency exclude, so the
          # only reliable signal is which factory the surviving binder actually points at.
          if ! unzip -p "$JAR" org/slf4j/impl/StaticLoggerBinder.class \
               | grep -qa 'org/apache/logging/slf4j/Log4jLoggerFactory'; then
            echo "FAIL: SLF4J StaticLoggerBinder does not bind to log4j2 — adapter logs would be"
            echo "      discarded and a slow cold start would present as a hung server."
            fail=1
          fi
          n=$(echo "$entries" | grep -cE '^org/apache/logging/slf4j/Log4jLoggerFactory\.class$' || true)
          [ "$n" -eq 1 ] || { echo "FAIL: log4j2 SLF4J binding missing from jar"; fail=1; }
          # log4j2.xml must not point an appender at stdout — that is the MCP JSON-RPC channel.
          if unzip -p "$JAR" log4j2.xml | grep -q 'target="SYSTEM_OUT"'; then
            echo "FAIL: log4j2.xml Console appender targets SYSTEM_OUT (corrupts MCP stdio)"
            fail=1
          fi
          # Size ceiling — catches a bloat regression (436 MB at 0.109.1; about 336 MB once
          # ONNX Runtime and the embedding model were taken out, ASKAM-007).
          sz=$(stat -c%s "$JAR"); ceil=$((400*1024*1024))
          echo "JAR size: $((sz/1024/1024)) MB (ceiling $((ceil/1024/1024)) MB)"
          [ "$sz" -le "$ceil" ] || { echo "FAIL: jar exceeds size ceiling"; fail=1; }
          [ "$fail" -eq 0 ] && echo "All slimming guards passed." || exit 1

      - name: Stage unshaded jar-set (smoke)
        # distribution.md wheel path: prove the unshaded runtime jar-set builds in CI.
        # Not yet uploaded — the <100 MB wheel partition is the tracked follow-up.
        run: |
          ./gradlew :askamerica-engine:stageEngineRuntime --no-daemon
          DIR=askamerica-engine/build/engine-runtime
          echo "jar-set: $(ls "$DIR"/*.jar | wc -l) jars, $(du -sh "$DIR" | cut -f1)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: askamerica-engine-jar
          path: askamerica-engine/build/libs/askamerica-engine.jar
          retention-days: 30

      # One engine jar per OS: the shadow jar minus the other platforms' native libraries (OpenBLAS,
      # DuckDB), about half the download. The launcher fetches its own (EngineInstaller.platformAsset);
      # the universal askamerica-engine.jar above stays for the pip client and the site's JAR link.
      - name: Build per-OS engine jars
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          ./gradlew :askamerica-engine:platformJars --no-daemon -PreleaseVersion="$VERSION"
          fail=0
          check() {  # variant, its bytedeco platform, its duckdb native suffix
            jar="askamerica-engine/build/platform-jars/askamerica-engine-$1.jar"
            [ -f "$jar" ] || { echo "FAIL: $jar was not built"; fail=1; return; }
            entries=$(unzip -Z1 "$jar")
            for p in linux-x86_64 macosx-x86_64 macosx-arm64 windows-x86_64; do
              c=$(echo "$entries" | grep -cE "^org/bytedeco/[a-z]+/$p/" || true)
              if [ "$p" = "$2" ]; then
                [ "$c" -gt 0 ] || { echo "FAIL: $1 has none of its own $p natives"; fail=1; }
              else
                [ "$c" -eq 0 ] || { echo "FAIL: $1 carries $c $p native entries"; fail=1; }
              fi
            done
            for d in linux_amd64 linux_arm64 osx_universal windows_amd64; do
              c=$(echo "$entries" | grep -cE "^libduckdb_java\.so_$d$" || true)
              if [ "$d" = "$3" ]; then
                [ "$c" -eq 1 ] || { echo "FAIL: $1 lacks its DuckDB native $d"; fail=1; }
              else
                [ "$c" -eq 0 ] || { echo "FAIL: $1 carries the DuckDB native $d"; fail=1; }
              fi
            done
            # The launcher compares this stamp with the release to decide whether to update.
            unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' \
              | grep -qx "AskAmerica-Engine-Version: $VERSION" \
              || { echo "FAIL: $1 manifest lacks AskAmerica-Engine-Version: $VERSION"; fail=1; }
            sz=$(stat -Lc%s "$jar")
            echo "$1: $((sz/1024/1024)) MB (ceiling 170 MB)"
            [ "$sz" -le $((170*1024*1024)) ] || { echo "FAIL: $1 exceeds its size ceiling"; fail=1; }
          }
          check windows-x86_64 windows-x86_64 windows_amd64
          check macos-arm64 macosx-arm64 osx_universal
          check linux-x86_64 linux-x86_64 linux_amd64
          [ "$fail" -eq 0 ] && echo "Per-OS jar guards passed." || exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-OS engine jars
        uses: actions/upload-artifact@v4
        with:
          name: askamerica-engine-platform-jars
          path: askamerica-engine/build/platform-jars/askamerica-engine-*.jar
          retention-days: 30

  # ── Browser extension (source lives in kenstott/askamerica) ────────────────
  browser-extension:
    name: Package browser extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout askamerica Python/extension repo
        uses: actions/checkout@v4
        with:
          repository: kenstott/askamerica
          token: ${{ secrets.ASKAMERICA_REPO_PAT }}
          path: askamerica-python

      - name: Zip extension
        run: |
          cd askamerica-python/extension
          zip -r ../../askamerica-extension.zip . -x '*.DS_Store'
          cd ../..
          unzip -l askamerica-extension.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: askamerica-extension
          path: askamerica-extension.zip
          retention-days: 30

  # ── JDBC driver test suite ───────────────────────────────────────────────
  test:
    name: JDBC driver tests
    runs-on: ubuntu-latest
    needs: jar
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install jpype1
        run: pip install jpype1

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-jar
          path: askamerica-engine/build/libs/

      - name: Run JDBC driver tests
        # Non-fatal: this is a live-data smoke test against the govdata S3 warehouse. When ref
        # tables are unavailable (e.g. after a data purge) it must not block the release — the
        # driver jar and installers are independent of live data. Failures are still logged.
        continue-on-error: true
        run: python3 govdata/scripts/test_govdata_python.py askamerica-engine/build/libs/askamerica-engine.jar
        env:
          AWS_ACCESS_KEY_ID:       ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:   ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_OVERRIDE:   ${{ secrets.AWS_ENDPOINT_OVERRIDE }}
          AWS_REGION:              auto
          GOVDATA_PARQUET_DIR:     ${{ secrets.GOVDATA_PARQUET_DIR }}

  # ── Data-server bundles ───────────────────────────────────────────────────
  # The release must not go public before the pgwire-govdata bundle of every platform is attached,
  # and the workflow that builds them (pgwire-adapters release) has to be started: its
  # `release: created` trigger does not fire reliably. This job starts it when no run for this
  # version is in flight, waits for the three tarballs, and checks each against its published
  # sha256. One light Linux runner holds the wait; the installers do not wait at all.
  # BUNDLE_MAX_WAIT_MINUTES and BUNDLE_POLL_SECONDS exist so the logic can be tested quickly.
  bundles:
    name: Data-server bundles
    runs-on: ubuntu-latest
    needs: [jar]
    timeout-minutes: 340
    steps:
      - name: Start the bundle build if none is running, then wait for the three bundles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_MAX_WAIT_MINUTES: "300"
          BUNDLE_POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          TAG="engine-v${VERSION}"
          ASSETS=("pgwire-govdata-${VERSION}-windows-x86_64.tar.gz" \
                  "pgwire-govdata-${VERSION}-macos-arm64.tar.gz" \
                  "pgwire-govdata-${VERSION}-linux-x86_64.tar.gz")

          # Assets not on the release yet. A failed lookup counts as "all missing", so a
          # transient error keeps the wait going and never reads as "published".
          missing() {
            local names
            names=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null) || names=""
            for a in "${ASSETS[@]}"; do grep -qx "$a" <<<"$names" || echo "$a"; done
          }

          if [ -n "$(missing)" ]; then
            echo "Not yet on $TAG: $(missing | tr '\n' ' ')"
            # Dispatch once, not once per leg: skip when a run for THIS version is in flight,
            # filtered by displayTitle (see pgwire-adapters-release.yml's run-name). A leftover run
            # of a different version produces assets tagged for that version, never for $TAG
            # (three releases in quick succession each hung 45 minutes on one, 2026-09-18).
            IN_FLIGHT=$(gh run list --repo "$REPO" --workflow "pgwire-adapters release" \
              --json status,displayTitle \
              --jq "[.[] | select((.status==\"in_progress\" or .status==\"queued\") and (.displayTitle | contains(\"$VERSION\")))] | length")
            if [ "${IN_FLIGHT:-0}" = "0" ]; then
              echo "Dispatching pgwire-adapters release for $VERSION"
              gh workflow run "pgwire-adapters release" --repo "$REPO" -f version="$VERSION" -f publish=true
            else
              echo "A pgwire-adapters release run for $VERSION is already in flight; waiting on it."
            fi
            deadline=$(( $(date +%s) + BUNDLE_MAX_WAIT_MINUTES * 60 ))
            last=""
            while [ -n "$(missing)" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::still missing on $TAG after ${BUNDLE_MAX_WAIT_MINUTES} minutes: $(missing | tr '\n' ' ')"
                exit 1
              fi
              now="$(missing | tr '\n' ' ')"
              [ "$now" = "$last" ] || { echo "$(date -u +%H:%M) waiting for: $now"; last="$now"; }
              sleep "$BUNDLE_POLL_SECONDS"
            done
          fi
          echo "All three bundles are on $TAG; verifying their sha256."

          # An authenticated gh download, not the public URL: the release is still a draft, and a
          # draft's public asset URL answers "NotFound" (engine-v0.100.1). Retried: transient HTTP/2
          # stream errors against the release CDN have aborted this before.
          for ASSET in "${ASSETS[@]}"; do
            WORKDIR=$(mktemp -d)
            ok=0
            for attempt in 1 2 3 4; do
              if gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --pattern "${ASSET}.sha256" \
                   --dir "$WORKDIR" --clobber; then ok=1; break; fi
              echo "gh release download of $ASSET, attempt $attempt failed; retrying"
              sleep $((attempt * 5))
            done
            [ "$ok" = "1" ] || { echo "::error::could not download $ASSET from $TAG"; exit 1; }
            EXPECTED=$(tr -d '[:space:]' < "$WORKDIR/${ASSET}.sha256" | cut -c1-64)
            ACTUAL=$(sha256sum "$WORKDIR/$ASSET" | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::$ASSET sha256 mismatch: expected $EXPECTED got $ACTUAL"
              exit 1
            fi
            echo "$ASSET matches its published sha256."
            rm -rf "$WORKDIR"
          done

  # ── Native installers (per-platform, bundled JRE) ─────────────────────────
  installer:
    name: Build installer — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [jar, test]
    strategy:
      # One platform's installer failure (e.g. macOS notarization when Apple certs are absent)
      # must not cancel the others or block the release.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: "*.pkg"
          - os: ubuntu-latest
            artifact_glob: "*.deb"
          - os: windows-latest
            artifact_glob: "*.msi"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-jar
          path: askamerica-engine/build/libs/

      # The installer is small and has a step to download its assets: it does NOT carry the
      # pgwire-govdata bundle (about a gigabyte); the installed engine downloads the bundle of its
      # own version on first use and verifies its sha256 (PgwireGovDataInstaller). From 0.91.0 to
      # 0.109.1 the .msi and the .deb did carry it and were about 920 MB and 1,220 MB; the
      # "Installer stays small" step below fails the build if that returns.
      #
      # That the bundles are published is waited for in the `bundles` job, not here: this job
      # used to wait up to 45 minutes on a Windows and an Ubuntu runner and failed whenever
      # GitHub's runner queue held the bundle build back longer (engine-v0.112.0 and v0.112.1 each
      # had both installers rerun by hand).

      - name: Import Apple signing certificate (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "No Apple signing certificate configured — skipping import"
            exit 0
          fi
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/signing.p12
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security import /tmp/signing.p12 \
            -k build.keychain \
            -P "$APPLE_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -T /usr/bin/xcrun
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain
          rm /tmp/signing.p12
          SIGN_ID=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "ASKAMERICA_SIGN_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
          echo "ASKAMERICA_SIGN_KEYCHAIN=$HOME/Library/Keychains/build.keychain-db" >> "$GITHUB_ENV"
          echo "Signing identity: $SIGN_ID"

      - name: Unlock keychain before jpackage (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -f "$HOME/Library/Keychains/build.keychain-db" ]; then
            security unlock-keychain -p "" build.keychain
            security set-keychain-settings -t 7200 build.keychain
          fi

      # jpackage builds the Windows MSI with WiX 3 (candle.exe/light.exe). Newer
      # windows-latest images ship WiX 4 (no candle.exe), so candle exits 104.
      # Put WiX 3.14 binaries first on PATH so jpackage finds the tools it expects.
      - name: Install WiX Toolset 3.14 (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wix.zip"
          Expand-Archive "$env:RUNNER_TEMP\wix.zip" -DestinationPath "$env:RUNNER_TEMP\wix314" -Force
          if (-not (Test-Path "$env:RUNNER_TEMP\wix314\candle.exe")) { throw "candle.exe missing after WiX extract" }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\wix314"

      - name: Build jpackage installer
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          ./gradlew :askamerica-engine:jpackage --no-daemon -PreleaseVersion="$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASKAMERICA_SIGN_IDENTITY: ${{ env.ASKAMERICA_SIGN_IDENTITY }}
          ASKAMERICA_SIGN_KEYCHAIN: ${{ env.ASKAMERICA_SIGN_KEYCHAIN }}

      # On a Windows failure only, dump jpackage's generated WiX sources (main.wxs +
      # the ui.wxf that defines JpUI). Kept as a safety net: if a JDK bump changes
      # jpackage's main.wxs, our --resource-dir override goes stale — this makes
      # re-syncing it trivial. No output on success, so build logs stay clean.
      - name: Dump generated WiX sources (Windows, on failure)
        if: failure() && matrix.os == 'windows-latest'
        shell: bash
        run: |
          T=askamerica-engine/build/jpackage-temp
          echo "=== files under jpackage temp ==="; find "$T" -type f 2>/dev/null | head -80
          for f in $(find "$T" \( -name '*.wxs' -o -name '*.wxi' -o -name '*.wxl' -o -name '*.wxf' \) 2>/dev/null); do
            echo "===== FILE: $f ====="; cat -n "$f"
          done

      - name: Create PKG from app-image (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          ASKAMERICA_SIGN_KEYCHAIN: ${{ env.ASKAMERICA_SIGN_KEYCHAIN }}
        run: |
          # No pipefail: `find | head -1` can SIGPIPE find and would fail the step.
          set -eu
          APP=$(find askamerica-engine/build/jpackage -name "*.app" -maxdepth 1 | head -1)
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          PKG="askamerica-engine/build/jpackage/AskAmerica-MCP-${VERSION}.pkg"

          # The component pkg is an intermediate — build it OUTSIDE build/jpackage so
          # neither the *.pkg upload glob nor the release job's recursive `find` can
          # mistake it for the shippable installer.
          COMPONENT_DIR="askamerica-engine/build/pkg-component"
          COMPONENT="$COMPONENT_DIR/AskAmerica-MCP-component.pkg"
          rm -rf "$COMPONENT_DIR" && mkdir -p "$COMPONENT_DIR"

          # pkgbuild rejects --component-plist unless the payload is given as --root,
          # so stage the signed .app at the root of its own tree. ditto (not cp) keeps
          # the code signature's extended attributes intact.
          PKG_ROOT="askamerica-engine/build/pkg-root"
          rm -rf "$PKG_ROOT" && mkdir -p "$PKG_ROOT"
          ditto "$APP" "$PKG_ROOT/$(basename "$APP")"

          # --component-plist sets BundleIsRelocatable=false. Without it macOS
          # Installer Spotlight-searches for the bundle id and installs over any copy
          # it finds — e.g. a local `./gradlew jpackage` output — instead of
          # /Applications, while still reporting success.
          pkgbuild \
            --root "$PKG_ROOT" \
            --install-location /Applications \
            --scripts askamerica-engine/src/packaging/mac \
            --component-plist askamerica-engine/src/packaging/mac-pkg/component.plist \
            --version "$VERSION" \
            "$COMPONENT"
          echo "Created component: $COMPONENT"

          # Assert the artifact, not the intent: a <relocate> block in PackageInfo means
          # relocation is still live (e.g. RootRelativeBundlePath no longer matches the
          # bundle name, so pkgbuild ignored the plist). Fail the build, don't ship it.
          rm -rf /tmp/pkgcheck
          pkgutil --expand "$COMPONENT" /tmp/pkgcheck
          if grep -q '<relocate>' /tmp/pkgcheck/PackageInfo; then
            echo "::error::Component pkg is still relocatable — component.plist did not apply."
            grep -A3 '<relocate>' /tmp/pkgcheck/PackageInfo
            exit 1
          fi
          echo "Verified: bundle is non-relocatable (installs to /Applications)"

          # productbuild wraps the component to add the conclusion pane. pkgbuild output
          # has no UI beyond a progress bar, so a user whose wizard fails to auto-launch
          # gets "installed successfully" and no instructions.
          DIST=/tmp/distribution.xml
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__COMPONENT_PKG__|$(basename "$COMPONENT")|g" \
              askamerica-engine/src/packaging/mac-pkg/distribution.xml > "$DIST"
          productbuild \
            --distribution "$DIST" \
            --package-path "$COMPONENT_DIR" \
            --resources askamerica-engine/src/packaging/mac-pkg/resources \
            "$PKG"
          rm -rf "$COMPONENT_DIR" "$PKG_ROOT"
          echo "Created: $PKG"
          KEYCHAIN="${ASKAMERICA_SIGN_KEYCHAIN:-}"
          INSTALLER_ID=""
          if [ -n "$KEYCHAIN" ]; then
            INSTALLER_ID=$(security find-identity -v "$KEYCHAIN" 2>/dev/null \
              | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          if [ -z "$INSTALLER_ID" ]; then
            INSTALLER_ID=$(security find-identity -v 2>/dev/null \
              | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          if [ -n "$INSTALLER_ID" ]; then
            echo "Signing PKG with: $INSTALLER_ID"
            productsign --sign "$INSTALLER_ID" "$PKG" "${PKG%.pkg}-signed.pkg"
            mv "${PKG%.pkg}-signed.pkg" "$PKG"
          else
            echo "No Developer ID Installer cert — PKG will be unsigned"
          fi

      - name: Notarize and staple PKG (macOS only)
        if: matrix.os == 'macos-latest'
        # Non-fatal: notarization requires a Developer ID Installer cert + valid app-specific
        # password. Signed/notarized installers are not a release requirement — an unsigned PKG
        # still installs (right-click → Open, or `xattr -dr com.apple.quarantine`). Do not block
        # the release on it. To enable real notarization, provide the Developer ID Installer cert
        # in APPLE_CERT_P12_BASE64 and a valid APPLE_NOTARYTOOL_PASSWORD/TEAM_ID.
        continue-on-error: true
        env:
          APPLE_NOTARYTOOL_APPLE_ID: ${{ secrets.APPLE_NOTARYTOOL_APPLE_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
          APPLE_NOTARYTOOL_TEAM_ID: ${{ secrets.APPLE_NOTARYTOOL_TEAM_ID }}
        run: |
          if [ -z "$APPLE_NOTARYTOOL_APPLE_ID" ]; then
            echo "No notarization credentials configured — skipping"
            exit 0
          fi
          PKG=$(find askamerica-engine/build/jpackage -name "*.pkg" | head -1)
          echo "Notarizing $PKG"
          SUBMIT_JSON=$(xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_NOTARYTOOL_APPLE_ID" \
            --password "$APPLE_NOTARYTOOL_PASSWORD" \
            --team-id "$APPLE_NOTARYTOOL_TEAM_ID" \
            --wait --output-format json)
          echo "$SUBMIT_JSON"
          SUBMIT_ID=$(echo "$SUBMIT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          STATUS=$(echo "$SUBMIT_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization rejected (status: $STATUS) — fetching rejection log"
            xcrun notarytool log "$SUBMIT_ID" \
              --apple-id "$APPLE_NOTARYTOOL_APPLE_ID" \
              --password "$APPLE_NOTARYTOOL_PASSWORD" \
              --team-id "$APPLE_NOTARYTOOL_TEAM_ID"
            # Non-fatal per the comment above, but the log printed here is what a
            # "could not verify... free of malware" report on the shipped PKG needs.
            exit 1
          fi
          xcrun stapler staple "$PKG"
          echo "Notarization and stapling complete"

      # The rule: the installer is small and has a step to download its assets. Before the
      # pgwire-govdata bundle was put into them (0.91.0), the installers were 54 MB (.msi),
      # 37 MB (.deb) and 33 MB (.pkg). 100 MB leaves room to grow and is a tenth of what an
      # installer carrying the bundle weighs, so a build that bundles it again fails here.
      - name: Installer stays small
        shell: bash
        env:
          LIMIT_MB: "100"
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' installer; do
            found=1
            bytes=$(wc -c < "$installer" | tr -d '[:space:]')
            mb=$(( (bytes + 1048575) / 1048576 ))
            echo "$installer: ${mb} MB (limit ${LIMIT_MB} MB)"
            if [ "$mb" -gt "$LIMIT_MB" ]; then
              echo "::error::$installer is ${mb} MB; an installer must stay under ${LIMIT_MB} MB and download its assets instead of carrying them"
              exit 1
            fi
          done < <(find askamerica-engine/build/jpackage -maxdepth 1 -type f -name '${{ matrix.artifact_glob }}' -print0)
          if [ "$found" != "1" ]; then
            echo "::error::no installer matching ${{ matrix.artifact_glob }} under askamerica-engine/build/jpackage"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: askamerica-engine-${{ matrix.os }}
          path: askamerica-engine/build/jpackage/${{ matrix.artifact_glob }}
          retention-days: 30

  # ── Maven Central bundle (built and signed here; uploaded only by promote-maven-central.yml) ──
  # Central's free tier caps monthly publishing, so a tag no longer uploads to Central. This job
  # builds the signed bundle and hands it to the release job, which attaches it to the release;
  # the "Promote to Maven Central" workflow uploads it from there when the maintainer chooses.
  publish:
    name: Build Maven Central bundle
    runs-on: ubuntu-latest
    needs: [jar, test]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-jar
          path: askamerica-engine/build/libs/

      - name: Generate POM
        run: |
          ./gradlew :askamerica-engine:generatePomFileForAskamericaEnginePublication \
            --no-daemon \
            -PreleaseVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Maven Central bundle
        env:
          GPG_KEY_ID:       ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE:   ${{ secrets.GPG_PASSPHRASE }}
          VERSION:          ${{ steps.version.outputs.version }}
          GROUP_ID:         ai.askamerica
          ARTIFACT_ID:      askamerica-engine
        run: |
          GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
          BUNDLE_DIR="bundle/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}"
          mkdir -p "$BUNDLE_DIR"

          JAR="askamerica-engine/build/libs/askamerica-engine.jar"
          POM=$(find askamerica-engine/build/publications -name "*.xml" | head -1)

          # JAR
          cp "$JAR" "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.jar"
          # POM
          cp "$POM" "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.pom"

          # Minimal sources and javadoc JARs (required by Central)
          echo "Sources: ${ARTIFACT_ID} ${VERSION}" > /tmp/placeholder.txt
          jar cf "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-sources.jar" -C /tmp placeholder.txt
          jar cf "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-javadoc.jar" -C /tmp placeholder.txt

          # SBOM (CycloneDX), same tool/format as the pgwire-adapters release bundles
          # (pgwire-adapters-release.yml) -- published as a classified artifact
          # (<artifact>-<version>-cyclonedx.json) alongside the jar, checksummed and
          # signed the same way, so the Maven Central coordinates carry an SBOM too.
          syft "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.jar" \
            -o cyclonedx-json="${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-cyclonedx.json"

          # GPG sign all five artifacts
          for f in \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.jar" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.pom" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-sources.jar" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-javadoc.jar" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-cyclonedx.json"
          do
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
            else
              gpg --batch --yes --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
            fi
            md5sum  "$f" | awk '{print $1}' > "${f}.md5"
            sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
          done

          # Create bundle ZIP
          (cd bundle && zip -r "../askamerica-engine-bundle.zip" .)
          echo "Bundle: $(du -sh askamerica-engine-bundle.zip | cut -f1)"

      - name: Name the bundle for the release, with its sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p central
          BUNDLE="askamerica-engine-${VERSION}-central-bundle.zip"
          mv askamerica-engine-bundle.zip "central/${BUNDLE}"
          (cd central && sha256sum "${BUNDLE}" > "${BUNDLE}.sha256")
          ls -l central

      - name: Upload Central bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: askamerica-engine-central-bundle
          path: central/
          retention-days: 30

  # ── Publish to GitHub Packages (every tag; Maven Central only through promote-maven-central.yml) ──
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [jar, test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-jar
          path: askamerica-engine/build/libs/

      - name: Determine version
        id: ghver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Delete existing version from GitHub Packages (if any)
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
          VERSION: ${{ steps.ghver.outputs.version }}
        run: |
          VERSION_ID=$(gh api "/user/packages/maven/ai.askamerica.askamerica-engine/versions" \
            --jq ".[] | select(.name == \"$VERSION\") | .id" 2>/dev/null || true)
          if [ -n "$VERSION_ID" ]; then
            echo "Deleting existing version $VERSION (ID: $VERSION_ID)"
            gh api -X DELETE "/user/packages/maven/ai.askamerica.askamerica-engine/versions/$VERSION_ID"
          else
            echo "No existing version $VERSION in GitHub Packages"
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          OUTPUT=$(./gradlew :askamerica-engine:publishAllPublicationsToGitHubPackagesRepository \
            --no-daemon \
            -PreleaseVersion=${{ steps.ghver.outputs.version }} 2>&1) && echo "$OUTPUT" && exit 0
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "status code 409"; then
            echo "409 Conflict: artifact already exists in GitHub Packages — treating as success"
            exit 0
          fi
          exit 1

  # ── Publish Python package to PyPI ────────────────────────────────────────
  publish-python:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    needs: [jar, test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write

    steps:
      - name: Checkout askamerica Python repo
        uses: actions/checkout@v4
        with:
          repository: kenstott/askamerica
          token: ${{ secrets.ASKAMERICA_REPO_PAT }}
          path: askamerica-python

      - name: Determine version
        id: pyver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#engine-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump versions in Python package
        working-directory: askamerica-python/python
        env:
          VERSION: ${{ steps.pyver.outputs.version }}
        run: |
          python3 - <<'EOF'
          import re, os, pathlib
          v = os.environ["VERSION"]

          # pyproject.toml
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'^version = ".*"', f'version = "{v}"', p.read_text(), flags=re.MULTILINE))

          # __init__.py
          p = pathlib.Path("askamerica/__init__.py")
          p.write_text(re.sub(r'^__version__ = ".*"', f'__version__ = "{v}"', p.read_text(), flags=re.MULTILINE))

          print(f"Bumped all version strings to {v}")
          EOF

      - name: Commit and push version bump
        working-directory: askamerica-python/python
        env:
          VERSION: ${{ steps.pyver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml askamerica/__init__.py
          # Idempotent: a re-run of an already-released version has nothing to bump.
          if git diff --cached --quiet; then
            echo "Version already at ${VERSION}; nothing to commit."
          else
            git commit -m "chore(release): bump to ${VERSION} — tracks engine-v${VERSION}"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python package
        working-directory: askamerica-python/python
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: askamerica-python/python/dist/

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [jar, govdata-jar, trino-plugins, browser-extension, installer, bundles, publish, publish-python]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write   # needed to dispatch the pgwire release workflows below

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-jar
          path: release-assets/

      - name: Download govdata JAR
        uses: actions/download-artifact@v4
        with:
          name: govdata-jar
          path: release-assets/

      - name: Download per-OS engine jars
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-platform-jars
          path: release-assets/

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: askamerica-engine-*-latest
          path: release-assets/
          merge-multiple: true

      - name: Download Trino connector plugins
        uses: actions/download-artifact@v4
        with:
          name: trino-plugins
          path: release-assets/

      - name: Download browser extension
        uses: actions/download-artifact@v4
        with:
          name: askamerica-extension
          path: release-assets/

      # The signed bundle that "Promote to Maven Central" uploads, and its sha256.
      - name: Download Central bundle
        uses: actions/download-artifact@v4
        with:
          name: askamerica-engine-central-bundle
          path: release-assets/

      # Central carried ai.askamerica:askamerica-engine; the same jar is the release asset
      # askamerica-engine.jar, and its sha256 lets a consumer verify the unauthenticated download.
      - name: Checksum the engine jar
        run: (cd release-assets && sha256sum askamerica-engine.jar > askamerica-engine.jar.sha256)

      # softprops/action-gh-release's own "fetch existing release by tag" API call fails here
      # with "Resource not accessible by integration" even though the job's GITHUB_TOKEN
      # Permissions log confirms contents:write is actually granted (verified live,
      # 2026-09-21/22, three separate attempts including a full fresh workflow_dispatch) --
      # the release already exists (release-please creates it atomically with the tag), so
      # this only needs to set its title/notes and upload files, not create or "find" it.
      # `gh release edit`/`gh release upload` do exactly that over the same GITHUB_TOKEN and
      # are the proven-working path: the pgwire-adapters-release.yml and
      # pgwire-calcite-release.yml jobs already attach dozens of assets to this same release
      # via `gh release upload` without hitting this error.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # The heredoc body below is indented to match this script's own indentation (so it
          # reads cleanly here); strip that literal 12-space prefix before it becomes release
          # notes, or GitHub's markdown renderer treats every line as an indented code block.
          cat <<'RELEASE_BODY' | sed 's|^            ||' > /tmp/release-notes.md
            ## AskAmerica Query Engine

            Query all 15 US government datasets from Python, Node, Go, or any JDBC client.

            ---

            ### Python (JPype — recommended)

            ```bash
            pip install 'askamerica[engine]'
            askamerica install-engine        # downloads askamerica-engine.jar
            askamerica login                 # get your free API key
            ```

            ```python
            import askamerica as aa
            df = aa.query("SELECT cik, company_name FROM sec.filing_metadata FETCH FIRST 5 ROWS ONLY")
            ```

            ### Claude Desktop (MCP)

            ```bash
            pip install 'askamerica[mcp]'
            askamerica install-engine
            askamerica mcp-config            # prints Claude Desktop config snippet
            ```

            ### Raw JAR (JDBC / any language)

            Download `askamerica-engine.jar` below and load it on your classpath.
            JDBC URL: `jdbc:govdata:source=sec,geo,econ,census,...`

            ### Native Installers (bundled JRE — no Java required)

            | Platform | File |
            |----------|------|
            | macOS    | `AskAmerica-MCP-*.pkg` |
            | Linux    | `askamerica-mcp_*.deb` |
            | Windows  | `AskAmerica MCP-*.msi` |

            **macOS:** Double-click the `.pkg` (installs to `/Applications`). The installer opens the setup wizard — paste your API key, click **Configure Claude Desktop**, then quit and reopen Claude Desktop. If the wizard doesn't appear, open **AskAmerica MCP** from Applications yourself. First launch caches the engine in `~/.askamerica/engine` (~450 MB, one time). Signing/notarization is best-effort in CI; if Gatekeeper blocks an unsigned build, right-click → Open.
            **Linux:** `sudo dpkg -i askamerica-mcp_*.deb`, then run `askamerica-mcp` to configure.
            **Windows:** Double-click the `.msi`, then open AskAmerica MCP from the Start Menu to configure.

            ### Trino connectors

            Plugin-directory archives — unzip into your Trino server's `plugin/` directory.

            | File | Connector | JDBC source |
            |------|-----------|-------------|
            | `trino-calcite-plugin.zip` | `calcite` | any Calcite model (`jdbc:calcite:`) |
            | `trino-sharepoint-plugin.zip` | `sharepoint` | SharePoint Lists (`jdbc:sharepoint:`) |
            | `trino-splunk-plugin.zip` | `splunk` | Splunk (`jdbc:splunk:`) |
            | `trino-salesforce-plugin.zip` | `salesforce` | Salesforce sObjects (`jdbc:salesforce:`) |
            | `trino-servicenow-plugin.zip` | `servicenow` | ServiceNow tables (`jdbc:servicenow:`) |
            | `trino-file-plugin.zip` | `file` | files / S3 globs (file adapter) |
            | `trino-cloudops-plugin.zip` | `cloudops` | Azure/AWS/GCP inventory (`jdbc:cloudops:`) |

            ### Browser extension

            `askamerica-extension.zip` — unzip and load unpacked via `chrome://extensions` (Developer mode). Reads previously published AskAmerica validation claims for the page you're on and hands off "Validate with AskAmerica" to your own Claude Desktop/claude.ai session; makes no model API calls itself. Requires the AskAmerica MCP engine running locally to see live claims.
          RELEASE_BODY
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --title "AskAmerica Engine ${TAG}" --notes-file /tmp/release-notes.md
          shopt -s globstar
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber release-assets/**/*
          # NOT published here. The release stays a draft, and so is not releases/latest,
          # until every download it must have is attached: see the publish-release job. Published
          # before its jar was attached, every installed launcher saw a newer version,
          # downloaded releases/latest/download/askamerica-engine.jar, got 404, and could not
          # start (engine-v0.100.1, 2026-09-30); published before its server bundles, an engine
          # at that version found no data server to install.

      # The pgwire-calcite installers attach on a release event, but a release created above by
      # GITHUB_TOKEN does not emit one. Dispatch that workflow explicitly now that the release
      # object exists so its per-OS tarballs attach to this engine-v<version> release.
      - name: Dispatch pgwire-calcite release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BARE="${{ github.ref_name }}"
          BARE="${BARE#engine-v}"
          gh workflow run "pgwire-calcite release" --repo "${{ github.repository }}" --ref main --field version="${BARE}"
          gh workflow run "pgwire-adapters release" --repo "${{ github.repository }}" --ref main --field version="${BARE}" --field publish=true
          echo "Dispatched pgwire-calcite + pgwire-adapters releases for version ${BARE}"

  # The one place a release becomes public. Owner rule 2026-10-10: only a successful build
  # flips the release; otherwise it stays a draft. The server bundles are attached by the two
  # workflows dispatched above, which this workflow cannot wait on by run, so this waits on the
  # result itself: the release's own asset list, complete by name. If a build fails the wait
  # runs out, the release stays a draft and the previous release stays "latest"; re-running
  # the failed jobs and then this one completes it.
  publish-release:
    name: Publish the release when it is complete
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait for every download to be attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          deadline=$(( $(date +%s) + 270 * 60 ))
          until .github/scripts/release-assets-complete.sh "${{ github.repository }}" "$TAG" > assets.txt; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              cat assets.txt
              {
                echo "### $TAG was NOT published"
                echo "It is still a draft; the previous release is still \"latest\". Missing:"
                echo '```'
                grep '^missing' assets.txt || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$TAG is incomplete after 270 minutes and stays a draft"
              exit 1
            fi
            tail -1 assets.txt
            sleep 120
          done
          cat assets.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          echo "### $TAG published as the latest release, complete" >> "$GITHUB_STEP_SUMMARY"
