# pgwire-calcite CI — runs the test suite (JVM + Calcite classpath + UDFs).
# Part of the BSL-1.1 pgwire-calcite subtree (see pgwire-calcite/LICENSE, NOTICE).
name: pgwire-calcite CI

on:
  # Beyond the server itself: the suite's drift check (tests/unit/test_variant_drift.py)
  # reads every pgwire-<adapter>/ directory, the adapters' release workflow and the
  # AskAmerica connector that launches pgwire-govdata, so a change to any of them runs it.
  push:
    paths:
      - "pgwire-*/**"
      - ".github/workflows/pgwire-calcite-ci.yml"
      - ".github/workflows/pgwire-adapters-release.yml"
      - "askamerica-engine/src/main/java/org/apache/calcite/adapter/askamerica/PgwireGovDataConnector.java"
  pull_request:
    paths:
      - "pgwire-*/**"
      - ".github/workflows/pgwire-adapters-release.yml"
      - "askamerica-engine/src/main/java/org/apache/calcite/adapter/askamerica/PgwireGovDataConnector.java"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Calcite file-adapter runtime classpath
        run: |
          # What the release bundles (pgwire-calcite-release.yml): the file adapter's runtime
          # classpath, the adapter's own jar (runtimeClasspath holds only its dependencies), and
          # the server's Arrow bridge + the DuckDB JDBC driver (compileOnly in file/).
          ./gradlew :file:jar :file:pgwPrintCp pgwArrowCp \
            --init-script pgwire-calcite/scripts/print-calcite-classpath.gradle \
            --no-daemon --console=plain -q
          { cat /tmp/pgw-file-cp.txt; echo; cat /tmp/pgw-arrow-cp.txt; echo; ls "$PWD"/file/build/libs/*.jar; } \
            | tr ':' '\n' | grep -v '^$' | paste -sd: - > pgwire-calcite/calcite-classpath.txt
          echo "classpath entries: $(tr ':' '\n' < pgwire-calcite/calcite-classpath.txt | wc -l)"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build vector/compat UDF jar
        working-directory: pgwire-calcite
        run: bash packaging/build-udf.sh

      - name: Create venv and install (with OIDC extra)
        working-directory: pgwire-calcite
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ./vendor/buenavista -e ".[oidc,dev]"

      - name: Run tests
        working-directory: pgwire-calcite
        run: .venv/bin/python -m pytest tests/unit -q -rs --junit-xml=pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pgwire-calcite/pytest.xml
