# pgwire-calcite CI — runs the test suite (JVM + Calcite classpath + UDFs).
# Part of the BSL-1.1 pgwire-calcite subtree (see pgwire-calcite/LICENSE, NOTICE).
name: pgwire-calcite CI

on:
  push:
    paths:
      - "pgwire-calcite/**"
      - ".github/workflows/pgwire-calcite-ci.yml"
  pull_request:
    paths:
      - "pgwire-calcite/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A Plugin Portal not-found answer fails gradle at once and is not retried (#1350).
      - name: Warm Gradle plugins
        uses: ./.github/actions/warm-gradle-plugins

      - name: Build Calcite file-adapter runtime classpath
        run: |
          # What the release bundles (pgwire-calcite-release.yml): the file adapter's runtime
          # classpath, the adapter's own jar (runtimeClasspath holds only its dependencies), and
          # the server's Arrow bridge + the DuckDB JDBC driver (compileOnly in file/).
          ./gradlew :file:jar :file:pgwPrintCp pgwArrowCp \
            --init-script pgwire-calcite/scripts/print-calcite-classpath.gradle \
            --no-daemon --console=plain -q
          { cat /tmp/pgw-file-cp.txt; echo; cat /tmp/pgw-arrow-cp.txt; echo; ls "$PWD"/file/build/libs/*.jar; } \
            | tr ':' '\n' | grep -v '^$' | paste -sd: - > pgwire-calcite/calcite-classpath.txt
          echo "classpath entries: $(tr ':' '\n' < pgwire-calcite/calcite-classpath.txt | wc -l)"

      - name: Build the JDBC-adapter pack classpath (runtime/pack live test)
        run: |
          # A second adapter for tests/unit/test_runtime_packs_live.py: Calcite's JDBC adapter (in
          # core) over HSQLDB's SCOTT database, with the server's Arrow bridge like every adapter.
          # pgwPrintCp writes /tmp/pgw-file-cp.txt for whichever module runs it, so core's copy is
          # read right after its own run.
          ./gradlew :core:jar :core:pgwPrintCp \
            --init-script pgwire-calcite/scripts/print-calcite-classpath.gradle \
            --no-daemon --console=plain -q
          cp /tmp/pgw-file-cp.txt /tmp/pgw-core-cp.txt
          ./gradlew pgwJdbcPackCp \
            --init-script pgwire-calcite/scripts/print-calcite-classpath.gradle \
            --no-daemon --console=plain -q
          { cat /tmp/pgw-core-cp.txt; echo; cat /tmp/pgw-arrow-cp.txt; echo; cat /tmp/pgw-jdbc-cp.txt; echo; \
            ls "$PWD"/core/build/libs/calcite-core-*.jar | grep -v -E -- '-(tests|sources|javadoc)\.jar$'; } \
            | tr ':' '\n' | grep -v '^$' | paste -sd: - > pgwire-calcite/jdbc-pack-classpath.txt
          echo "jdbc pack classpath entries: $(tr ':' '\n' < pgwire-calcite/jdbc-pack-classpath.txt | wc -l)"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build vector/compat UDF jar
        working-directory: pgwire-calcite
        run: bash packaging/build-udf.sh

      - name: Create venv and install (with OIDC extra)
        working-directory: pgwire-calcite
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ./vendor/buenavista -e ".[oidc,dev]"

      - name: Run tests
        working-directory: pgwire-calcite
        run: .venv/bin/python -m pytest tests/unit -q -rs --junit-xml=pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pgwire-calcite/pytest.xml
