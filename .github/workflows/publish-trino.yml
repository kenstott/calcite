# Publish the Trino connectors on an engine-v<version> release.
#
#   * Maven artifacts (io.simpleishard:trino-*)      -> GitHub Packages, and the jar + its sha256
#                                                       as GitHub-release assets
#   * Signed Maven Central bundles                    -> GitHub-release assets; uploaded to Central
#                                                       only by promote-maven-central.yml
#   * Deployable Trino plugin zips (trino-*-plugin)   -> attached as GitHub-release assets
#
# The Maven jar is what JVM consumers depend on; the plugin zip is the directory-of-jars an
# operator unzips into <trino>/plugin/<name>/. trino-calcite-base is a shared library (jar only,
# no plugin zip). A tag never uploads to Central (its free tier caps monthly publishing).
name: publish-trino

on:
  push:
    tags:
      - 'engine-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "release version (e.g. 0.27.0)"
        required: true

jobs:
  # ── Maven artifacts: GitHub Packages + release assets (Central bundle for promotion) ──
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaches the jar and the Central bundle to the engine-v release
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: trino-calcite-base, pub: TrinoCalciteBase, artifact: trino-calcite-base }
          - { module: trino-calcite,      pub: TrinoCalcite,      artifact: trino-calcite }
          - { module: trino-cloudops,     pub: TrinoCloudops,     artifact: trino-cloudops }
          - { module: trino-file,         pub: TrinoFile,         artifact: trino-file }
          - { module: trino-salesforce,   pub: TrinoSalesforce,   artifact: trino-salesforce }
          - { module: trino-servicenow,   pub: TrinoServicenow,   artifact: trino-servicenow }
          - { module: trino-sharepoint,   pub: TrinoSharepoint,   artifact: trino-sharepoint }
          - { module: trino-splunk,       pub: TrinoSplunk,       artifact: trino-splunk }
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on JDK 21 (the whole Calcite build compiles cleanly there, as the other
      # publish workflows prove); JDK 25 is installed too so Gradle's toolchain detection can
      # compile the Trino modules (languageVersion 25). JAVA_HOME is the last listed -> 21.
      - name: Set up JDKs (25 for the Trino toolchain, 21 for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#engine-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.artifact }} version: ${VERSION}"

      - name: Build shadow JAR
        run: ./gradlew :${{ matrix.module }}:shadowJar --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signing already exists below (GPG, Maven Central's actual requirement — unlike PyPI,
      # Central never dropped GPG). SBOM + CVE gate the publish, same as this repo's
      # pgwire-adapters-release.yml and provisa's own release pipeline: syft/grype scan the
      # shaded jar's binary contents directly rather than needing a Gradle CycloneDX plugin
      # wired into each module's build.gradle.kts.
      - name: Locate shadow JAR
        id: jar
        run: |
          JAR=$(find "${{ matrix.module }}/build/libs" -name "${{ matrix.artifact }}-*.jar" \
            | grep -v sources | grep -v javadoc | head -1)
          test -n "$JAR" || { echo "shadow jar not found for ${{ matrix.artifact }}"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Install grype + syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX)
        run: syft "${{ steps.jar.outputs.path }}" -o cyclonedx-json="${{ matrix.artifact }}-sbom.cdx.json"

      - name: CVE scan (gates publish — fails on any Critical finding)
        # High/Medium/Low findings stay visible in the uploaded report but don't block: a full
        # sweep of this fork's transitive dependency tree (201 CVEs found live against the
        # pgwire-file bundle, 2026-09-21 — see pgwire-adapters-release.yml's own CVE step) is
        # its own separate remediation effort, out of scope for wiring up the gate itself.
        run: |
          grype "${{ steps.jar.outputs.path }}" -c .grype.yaml \
            -o json --file "${{ matrix.artifact }}-cve-report.json" --fail-on critical

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-sbom-and-scan
          path: |
            ${{ matrix.artifact }}-sbom.cdx.json
            ${{ matrix.artifact }}-cve-report.json
          retention-days: 90

      - name: Publish to GitHub Packages
        run: |
          OUTPUT=$(./gradlew :${{ matrix.module }}:publish${{ matrix.pub }}PublicationToGitHubPackagesRepository \
            --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }} 2>&1) && echo "$OUTPUT" && exit 0
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "status code 409"; then
            echo "409 Conflict: artifact already exists in GitHub Packages — treating as success"
            exit 0
          fi
          exit 1
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Generate POM
        run: |
          ./gradlew :${{ matrix.module }}:generatePomFileFor${{ matrix.pub }}Publication \
            --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Maven Central bundle
        env:
          GPG_KEY_ID:     ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION:        ${{ steps.version.outputs.version }}
          GROUP_ID:       io.simpleishard
          ARTIFACT_ID:    ${{ matrix.artifact }}
          MODULE:         ${{ matrix.module }}
          PUB:            ${{ matrix.pub }}
        run: |
          GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
          BUNDLE_DIR="bundle/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}"
          mkdir -p "$BUNDLE_DIR"

          # shadowJar sets archiveBaseName = artifactId (classifier ""), so the fat jar is <artifact>-<ver>.jar
          # (distinct from the thin calcite-<module>-<ver>.jar the root convention would produce).
          JAR=$(find "${MODULE}/build/libs" -name "${ARTIFACT_ID}-*.jar" | grep -v sources | grep -v javadoc | head -1)
          # Gradle writes the POM under build/publications/<publicationName>/ where the name is the
          # lowercase-first publication id (e.g. "trinoCalcite"), not the capitalized task form in ${PUB}.
          POM=$(find "${MODULE}/build/publications" -name "pom-default.xml" | head -1)

          if [ -z "$JAR" ] || [ -z "$POM" ]; then
            echo "ERROR: could not locate jar ($JAR) or pom ($POM) for ${MODULE}"
            exit 1
          fi

          cp "$JAR" "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.jar"
          cp "$POM" "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.pom"

          # Minimal sources and javadoc JARs (required by Central; content is not validated)
          echo "Sources: ${ARTIFACT_ID} ${VERSION}" > /tmp/placeholder.txt
          jar cf "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-sources.jar" -C /tmp placeholder.txt
          jar cf "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-javadoc.jar" -C /tmp placeholder.txt

          # Reuse the CycloneDX SBOM already generated above (for the CVE gate) as a
          # classified Maven Central artifact too, same as askamerica-engine.yml and
          # publish-govdata.yml.
          cp "${ARTIFACT_ID}-sbom.cdx.json" "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-cyclonedx.json"

          for f in \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.jar" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}.pom" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-sources.jar" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-javadoc.jar" \
            "${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-cyclonedx.json"
          do
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
            else
              gpg --batch --yes --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
            fi
            md5sum  "$f" | awk '{print $1}' > "${f}.md5"
            sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
          done

          (cd bundle && zip -r "../${ARTIFACT_ID}-bundle.zip" .)
          echo "Bundle: $(du -sh ${ARTIFACT_ID}-bundle.zip | cut -f1)"

      - name: Attach the jar and the Central bundle to the release
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          VERSION:     ${{ steps.version.outputs.version }}
        run: |
          mkdir -p central
          JAR="${ARTIFACT_ID}-${VERSION}.jar"
          BUNDLE="${ARTIFACT_ID}-${VERSION}-central-bundle.zip"
          cp "bundle/io/simpleishard/${ARTIFACT_ID}/${VERSION}/${JAR}" "central/${JAR}"
          cp "${ARTIFACT_ID}-bundle.zip" "central/${BUNDLE}"
          (cd central && sha256sum "${JAR}" > "${JAR}.sha256" && sha256sum "${BUNDLE}" > "${BUNDLE}.sha256")
          gh release upload "engine-v${VERSION}" --repo "${{ github.repository }}" --clobber \
            "central/${JAR}" "central/${JAR}.sha256" "central/${BUNDLE}" "central/${BUNDLE}.sha256"

  # Note: the deployable Trino plugin zips are built and attached to the engine-v release by the
  # AskAmerica Engine workflow (its trino-plugins + release jobs); this workflow attaches only each
  # module's jar and Central bundle.
