name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed by GITHUB_TOKEN does not trigger push events in other workflows, so the
      # release CI is dispatched explicitly rather than relying on the tag trigger.
      - name: Dispatch release workflows
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please now emits the canonical tag itself (engine-v<version>), so take it as
          # given and derive the bare version from it. This previously stripped a leading "v" off
          # a v<version> tag and re-prefixed it; doing that to an already-prefixed tag would build
          # engine-vengine-v<version>.
          ENGINE_TAG="${{ steps.release.outputs.tag_name }}"
          BARE="${ENGINE_TAG#engine-v}"
          gh workflow run "AskAmerica Engine" \
            --repo "${{ github.repository }}" \
            --ref "refs/tags/${ENGINE_TAG}" \
            --field version="${BARE}"
          gh workflow run "Publish GovData Driver" \
            --repo "${{ github.repository }}" \
            --ref "refs/tags/${ENGINE_TAG}"
          gh workflow run "publish-trino" \
            --repo "${{ github.repository }}" \
            --ref "refs/tags/${ENGINE_TAG}" \
            --field version="${BARE}"
          echo "Dispatched release workflows on ${ENGINE_TAG}"
