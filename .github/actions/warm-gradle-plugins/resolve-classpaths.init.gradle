// Registers warmClasspaths on the root project: it resolves the compile and runtime classpaths of every
// project so that their artifacts are downloaded into the Gradle cache in one step that CI can retry.
gradle.rootProject {
    tasks.register('warmClasspaths') {
        doLast {
            def wanted = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
            rootProject.allprojects.each { p ->
                p.configurations.matching { it.name in wanted && it.canBeResolved }.each { c ->
                    c.incoming.artifacts.artifactFiles.files
                }
            }
        }
    }
}
