  # --- FOREIGN DIRECT INVESTMENT (BEA MNE dataset) ---
  # Two request profiles over the same BEA "MNE" dataset, sharing one output
  # schema (FdiDataTransformer) and one tall shape:
  #   * fdi_direct_investment (DI)   - SeriesID=all, default ownership
  #   * fdi_activities        (AMNE) - SeriesID=all, OwnershipLevel=0,
  #                                     NonbankAffiliatesOnly=0
  # Each is iterated over direction (inward/outward) x classification
  # (Country/Industry) x year. See views fdi_data (tall union) and
  # fdi_by_country (wide pivot).
  - name: fdi_direct_investment
    # BEA advances quarterly GDP-family estimates (advance -> second -> third,
    # about a month apart) and can restate multiple prior years in its annual/comprehensive NIPA
    # and regional revisions. The lookback reopens the 6 most recently published years, which
    # covers the reach of a typical annual revision; a comprehensive revision reaching back
    # further than that still requires a full reprocess.
    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=fdi_direct_investment/direction=*/classification=*/year=*/fdi_direct_investment.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2025
      distinctYears: 18
      contiguous: true
      rowCount: 66103
      checkedAt: "2026-09-05T14:44:19Z"
    partitions:
      style: hive
      columnDefinitions: &fdi_partition_columns
        - name: type
          type: VARCHAR
        - name: direction
          type: VARCHAR
        - name: classification
          type: VARCHAR
        - name: year
          type: INTEGER
    comment: >
      BEA Direct Investment (DI) statistics from the Multinational Enterprises
      (MNE) dataset. Balance-of-payments direct investment: position (stock),
      income, financial transactions, equity, debt instruments, and reinvested
      earnings. Inward (foreign investment in the U.S.) and outward (U.S.
      investment abroad), by partner country or by industry. Tall layout: one
      row per statistic (series_id) x area/industry (row_code) x year.
    columns: &fdi_columns
      - name: series_id
        type: string
        source: series_id
        nullable: true
        comment: >
          BEA MNE series identifier. The MNE dataset is a long-format cube: one row per
          (series_id, row_code, column_code, time_period), and each row carries its own label in
          series_name, so read series_name rather than memorizing codes — there is no separate
          series reference table. Ingestion requests SeriesID=all, so the loaded domain is whatever
          BEA publishes for the requested direction and classification; enumerate it with
          SELECT DISTINCT series_id, series_name. Common values: 30 = U.S. direct investment
          position abroad, 22 = foreign direct investment position in the U.S.,
          27 = direct investment income. ALWAYS filter on series_id before aggregating —
          positions (stocks), income, and financial flows share this column and are not additive.
          Scale comes from table_scale, not from the raw data_value.
      - name: series_name
        type: string
        source: series_name
        nullable: true
        comment: Human-readable statistic name
      - name: row_code
        type: string
        source: row_code
        nullable: true
        comment: Country or industry code (matches the classification partition)
      - name: row_label
        type: string
        source: row_label
        nullable: true
        comment: Country or industry name
      - name: column_code
