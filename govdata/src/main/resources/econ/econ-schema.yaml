  # ---------------------------------------------------------------------------
  # INTERNATIONAL TRADE — Census intltrade HS-6 monthly (moved from census schema;
  # consolidated with the BEA trade/FDI tables so all trade data lives in econ).
  # ---------------------------------------------------------------------------
  - name: trade_exports
    # No freshness probe: this table streams (StreamingResponseTransformer), and a hash
    # probe would require a full body download to hash — defeating streaming. Past
    # (year, month) partitions are skipped by completion markers; the open month re-streams.
    pattern: "type=trade/direction=exports/year=*/month=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2013
      maxYear: 2025
      distinctYears: 13
      contiguous: true
      rowCount: 49424173
      checkedAt: "2026-09-05T14:44:26Z"
    partitions:
      style: hive
      columns:
        - name: type
          type: string
        - name: direction
          type: string
        - name: year
          type: integer
        - name: month
          type: string
    comment: >
      Monthly U.S. goods exports by HS-6 commodity and destination country
      (Census International Trade timeseries, exports/hs endpoint). Tall layout:
      Census returns individual-country rows interleaved with its own built-in
      world-total and trade-bloc/continental aggregate rows in the same response, with
      no discriminator of its own — filter geo_level = 'country' before summing
      value_usd, or the total silently multiplies by every bloc/continent a country
      also belongs to (plus the world total). No quantity column: Census's QTY_1_MO/
      UNIT_QY1 fields are unpopulated (always "0"/"-") at COMM_LVL=HS6, confirmed live
      across all 364,588 rows of a full month — quantity is only standardized at the
      HS10 grain, which this table doesn't fetch. trade_by_state's QTY_1_MO IS
      populated (state-level statehs endpoint reports it differently); use that table
      for quantity.

    dimensions:
      type:
        - trade
      direction:
        - exports
      # Period dimension: dynamic yearRange (never hardcoded). The publish year is
      # iterated start->current; effective_year = publish - dataLag is the data year
      # written to the partition. The intltrade HS timeseries begins in 2013, so the
      # data floor is 2013 (publish 2014 with dataLag 1); minYear hard-floors it even
      # if GOVDATA_START_YEAR is set lower for other schemas.
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2014}"
        end: "${GOVDATA_END_YEAR:current}"
        minYear: 2014
        dataLag: 1
        descending: true
      # Full monthly cadence: one fetch per (year, month) = one overwrite partition,
      # so the fetch unit equals the partition granularity (required for correct
      # replace-partition refresh).
      month:
        type: list
        values: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12']

    columns:
      - name: country_code
        type: string
        nullable: true
        expression: 'src."CTY_CODE"'
        comment: Destination country code
      - name: country_name
        type: string
        nullable: true
        expression: 'src."CTY_NAME"'
        comment: Destination country name
      - name: geo_level
        type: string
