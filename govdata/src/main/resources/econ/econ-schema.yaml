    # Materialization configuration
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=metro_industry/frequency=*/year=*/"
      partition:
        columns: [type, frequency, year]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/econ"
        catalogType: hadoop
        targetFileSizeBytes: 134217728  # 128MB target for optimal read performance
