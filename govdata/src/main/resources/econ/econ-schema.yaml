  # --- REGIONAL INCOME (API-BASED - DEPRECATED) ---
  # NOTE: This table uses per-API-call approach which is slow and memory-intensive.
  # Consider using state_personal_income (SAINC bulk), state_gdp (SAGDP bulk), etc. instead.
  - name: regional_income
    # BEA advances quarterly GDP-family estimates (advance -> second -> third,
    # about a month apart) and can restate multiple prior years in its annual/comprehensive NIPA
    # and regional revisions. The lookback reopens the 8 most recently published years, which
    # covers the reach of a typical annual revision; a comprehensive revision reaching back
    # further than that still requires a full reprocess.
    lookbackPeriods: 8
    freshness:
      type: hash
    pattern: "type=*/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2025
      distinctYears: 18
      contiguous: true
      rowCount: 25765729
      checkedAt: "2026-09-05T14:44:17Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER
    comment: >
      State, county, MSA, and other sub-national (micropolitan, port, metro division, CSA)
      personal income, GDP, consumption, wages, arts & culture, and outdoor recreation statistics
      — all 63 BEA Regional Economic Accounts tables. The only source of county/MSA-level BEA
      income and GDP in this schema; slower per-API-call ingestion than the state-only
      bulk-download tables (state_personal_income, state_gdp, state_quarterly_income,
      state_quarterly_gdp, state_consumption), which cover the same state-level topics faster.

