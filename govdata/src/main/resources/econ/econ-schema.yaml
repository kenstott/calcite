  # --- FOOD CPI ---
  - name: food_cpi
    pattern: "type=food_cpi/frequency=*/year=*/food_cpi.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1935
      maxYear: 2026
      distinctYears: 92
      contiguous: true
      rowCount: 7793
      checkedAt: "2026-09-05T14:44:02Z"
    partitions: *standard_partitions
    # BLS republishes cu.data.11.USFoodBeverage on every monthly CPI release. A HEAD probe of
    # Last-Modified re-triggers ingest when the file changes, matching the BEA bulk-download
    # tables (state_gdp, state_personal_income) rather than a month cache-buster dimension.
    freshness:
      type: last_modified
    comment: >
      Monthly CPI-U Food at Home (SAF11 + its 6 subcomponents: cereals/bakery, meats/poultry/
      fish/eggs, dairy, fruits/vegetables, nonalcoholic beverages, other) and Food Away From Home
      (SEFV), U.S. city average only (area 0000), not seasonally adjusted (base 1982-84=100).
      NATIONAL ONLY — confirmed against BLS's cu.series catalog, which also publishes SAF11 (but
      not its subcomponents or SEFV) for the 4 Census regions, several size classes, and ~23
      individual metro areas; those live in BLS's region-grouped bulk files (cu.data.3-10, not
      cu.data.11.USFoodBeverage) and are not loaded here. For all-items regional/metro CPI see
      regional_cpi/metro_cpi.

    dimensions:
      type:
        - food_cpi
      frequency: *monthly_frequency

    # BLS CU-program bulk flat-file columns (TSV): series_id, year, period, value, footnote_codes.
    columns:
      - name: series
        type: string
        nullable: true
        comment: >
          BLS CPI series identifier. This table is long-format: one row per (series, period), so
          ALWAYS filter on series. The 8 series loaded are: CUUR0000SAF11 (Food at home),
          CUUR0000SAF111 (Cereals and bakery products), CUUR0000SAF112 (Meats, poultry, fish, and
          eggs), CUUR0000SAF113 (Dairy and related products), CUUR0000SAF114 (Fruits and
          vegetables), CUUR0000SAF115 (Nonalcoholic beverages), CUUR0000SAF116 (Other food at
          home), CUUR0000SEFV (Food away from home). All are index levels, not rates — compute
          inflation as a period-over-period change.
        source: series_id
      - name: year
        type: integer
        nullable: true
        comment: Data year
        source: year
      - name: period
        type: string
        nullable: true
        comment: BLS period identifier (M01-M12 for monthly)
        source: period
      - name: periodName
        type: string
        nullable: true
        comment: Human-readable period name derived from period
        expression: "CASE period WHEN 'M01' THEN 'January' WHEN 'M02' THEN 'February' WHEN 'M03' THEN 'March' WHEN 'M04' THEN 'April' WHEN 'M05' THEN 'May' WHEN 'M06' THEN 'June' WHEN 'M07' THEN 'July' WHEN 'M08' THEN 'August' WHEN 'M09' THEN 'September' WHEN 'M10' THEN 'October' WHEN 'M11' THEN 'November' WHEN 'M12' THEN 'December' ELSE period END"
      - name: value
        type: double
        nullable: true
        comment: Price index value (base period = 100)
        source: value
      - name: footnotes
        type: string
        nullable: true
        comment: BLS footnote codes for the data point
        source: footnote_codes

    # Bulk flat-file source — one file covers the full 1967-present history for all US Food and
    # Beverage item series in a single ~6.6MB download, versus per-series/per-year API calls.
    source:
      type: http
      url: "https://download.bls.gov/pub/time.series/cu/cu.data.11.USFoodBeverage"
      method: GET
      headers:
        # download.bls.gov 403s fake-browser User-Agents; requires a self-identifying UA
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      response:
        format: tsv
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true
      # National U.S. city average (area 0000) only, NSA (CUUR), Food at home + 6 subcomponents +
      # Food away from home. Excludes size-class (N000/S000) rows and deeper item sub-splits
      # (e.g. SAF1121 Beef and veal) that the bulk file also carries.
      rowFilter:
        column: series_id
        pattern: '^CUUR0000(SAF11[1-6]?|SEFV)$'

    # Materialization configuration
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=food_cpi/frequency=*/year=*/"
      partition:
        columns: [type, frequency, year]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/econ"
        catalogType: hadoop
        targetFileSizeBytes: 134217728
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # --- REGIONAL FOOD CPI ---
  - name: regional_food_cpi
    # BLS revises the prior 1-2 months on every monthly release and restates the
    # prior calendar year in its annual February benchmark revision (same cadence as
    # employment_statistics). The lookback reopens the 2 most recently published years so
    # the period-completion gate doesn't freeze them; the hash check skips the write when unrevised.
    # CPI-U unadjusted (CUUR) index levels are FINAL WHEN RELEASED and are never revised -- the
    # 5-year restatement applies only to seasonally adjusted (CUSR) series, whose seasonal factors
    # are recomputed each February. https://www.bls.gov/cpi/technical-notes/
    # The lookback here is for ACCRUAL, not revision: one combo covers a whole year, and the
    # period-completion gate would otherwise freeze the current year mid-stream and lock out
    # December, which BLS does not publish until mid-January of the following year.
    lookbackPeriods: 2
    freshness:
      type: hash
    pattern: "type=regional_food_cpi/frequency=*/year=*/regional_food_cpi.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2026
      distinctYears: 17
      contiguous: true
      rowCount: 796
      checkedAt: "2026-09-05T14:44:02Z"
    partitions: *standard_partitions
    comment: >
      Monthly CPI-U Food at Home (SAF11) index level (not seasonally adjusted, base 1982-84=100)
      for the 4 U.S. Census regions (Northeast, Midwest, South, West). Sibling to regional_cpi
      (all items) — same 4 region area codes, item SAF11 instead of SA0. Food at Home
      subcomponents and Food Away From Home are not published sub-nationally by BLS (confirmed
      against cu.series — only the top-level SAF11 aggregate has region/metro rows); for those,
      see food_cpi (national only). For metro-area food CPI, see metro_food_cpi.
    columns:
      - name: date
        type: date
        nullable: true
        comment: >
          Observation date, first day of the month, derived from the BLS year and period fields
          (period M01-M12). BlsResponseTransformer emits year and period rather than a date.
        expression: "year || '-' || LPAD(CAST(CAST(SUBSTRING(period, 2, 2) AS INTEGER) AS VARCHAR), 2, '0') || '-01'"
      - name: series
        type: string
        nullable: true
        comment: >
          BLS series identifier. This table is long-format: one row per (series, period), so ALWAYS
          filter on series. The 4 series loaded are CPI-U Food at Home, not seasonally adjusted, for
          the four Census regions: CUUR0100SAF11 Northeast, CUUR0200SAF11 Midwest, CUUR0300SAF11
          South, CUUR0400SAF11 West. Series ID format is CUUR{area}SAF11, so the embedded 4
          characters are the Census region code. BlsResponseTransformer emits only series, year,
          period, periodName, value, latest and footnotes — the area_code and area_name columns are
          not populated by the current ingest. Index levels (1982-84=100), not rates.
      - name: area_code
        type: string
        nullable: true
        comment: >
          Census region code, derived from series positions 5-8 (CUUR{area}SAF11):
          0100 Northeast, 0200 Midwest, 0300 South, 0400 West.
        expression: "SUBSTRING(series, 5, 4)"
      - name: area_name
        type: string
        nullable: true
        comment: >
          Census region name for the area code, matching econ_reference.bls_geographies.geo_name
          and the censusRegions map in /bls/bls-constants.yaml.
        expression: "CASE SUBSTRING(series, 5, 4) WHEN '0100' THEN 'Northeast' WHEN '0200' THEN 'Midwest' WHEN '0300' THEN 'South' WHEN '0400' THEN 'West' ELSE NULL END"
      - name: value
        type: double
        nullable: true
        comment: >
          CPI Food at Home index level for the region (base period 1982-84 = 100), not a rate.
          Compute period-over-period inflation as a change over this index.
    dimensions:
      type:
        - regional_food_cpi
      frequency: *monthly_frequency
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2020}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 0
        releaseMonth: 2  # BLS monthly data complete by mid-January

    # API Configuration
    download:
      enabled: true
      method: POST
      baseUrl: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      authentication:
        type: json_body
        paramName: registrationkey
        envVar: BLS_API_KEY

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      enabled: true
      url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      method: POST
      headers:
        Content-Type: "application/json"
      body:
        seriesid:  # Regional Food at Home CPI series - 4 Census regions
          - "CUUR0100SAF11"   # Northeast - Food at home
          - "CUUR0200SAF11"   # Midwest - Food at home
          - "CUUR0300SAF11"   # South - Food at home
          - "CUUR0400SAF11"   # West - Food at home
        startyear: "{year}"
        endyear: "{year}"
        registrationkey: "{env:BLS_API_KEY}"
      response:
        format: json
        errorPath: "message"  # BLS API returns errors in message array
      rateLimit:
        requestsPerSecond: 0.9
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    # Custom hooks for BLS response handling
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.econ.BlsResponseTransformer"

    # Materialization configuration
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=regional_food_cpi/frequency=*/year=*/"
      partition:
        columns: [type, frequency, year]
      options:
