# ============================================================================
# BULK DOWNLOADS
# ============================================================================
# Large data files shared across multiple tables to optimize download
# ============================================================================

bulkDownloads:

  # Quarterly Comprehensive Employment and Wages (QCEW) bulk data
  # File sizes: Annual ~80MB, Quarterly ~323MB
  # Shared by: state_wages, county_wages, county_qcew, metro_wages
  qcew_annual_bulk:
    cachePattern: "type=qcew_bulk/year={year}/{frequency}_singlefile.zip"
    url: "https://data.bls.gov/cew/data/files/{year}/csv/{year}_{frequency}_singlefile.zip"
    dimensions:
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2020}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 1      # QCEW annual data is released with ~1 year lag
        releaseMonth: 9  # Released in September (with Q1 data of following year)
      frequency:
        - annual
    comment: >
      QCEW bulk CSV download shared by state_wages, county_wages, county_qcew, and metro_wages tables. Annual file ~80MB, quarterly file ~323MB. Contains all counties, states, and metros for a given year.

  # BEA Regional Economic Data bulk downloads
  # Downloads all data for a table family in a single ZIP file
  # Much more efficient than per-year/per-geo API calls (~16MB vs 12,000+ API calls)
  # NOTE: Only state-level data has bulk downloads. County/MSA (CAINC, CAGDP) must use API.

  bea_sainc_bulk:
    cachePattern: "type=bea_bulk/dataset=SAINC/SAINC.zip"
    url: "https://apps.bea.gov/regional/zip/SAINC.zip"
    dimensions:
      year: *year_range_default
    comment: >
      BEA State Annual Personal Income (SAINC) bulk download ~16.4MB.
      Contains all SAINC tables (SAINC1-SAINC91) for all states, all years from 1929-present.
      Wide format CSV with years as columns - requires wideToNarrow transformation.

  bea_sagdp_bulk:
    cachePattern: "type=bea_bulk/dataset=SAGDP/SAGDP.zip"
    url: "https://apps.bea.gov/regional/zip/SAGDP.zip"
    dimensions:
      year: *year_range_default
    comment: >
      BEA State Annual GDP (SAGDP) bulk download ~9.5MB.
      Contains all SAGDP tables for all states, all years.
      Wide format CSV with years as columns.

  bea_sqinc_bulk:
    cachePattern: "type=bea_bulk/dataset=SQINC/SQINC.zip"
    url: "https://apps.bea.gov/regional/zip/SQINC.zip"
    dimensions:
      year: *year_range_default
    comment: >
      BEA State Quarterly Personal Income (SQINC) bulk download ~16.7MB.
      Contains all SQINC tables for all states.
      Wide format CSV with years as columns.

  bea_sqgdp_bulk:
    cachePattern: "type=bea_bulk/dataset=SQGDP/SQGDP.zip"
    url: "https://apps.bea.gov/regional/zip/SQGDP.zip"
    dimensions:
      year: *year_range_default
    comment: >
      BEA State Quarterly GDP (SQGDP) bulk download ~3.2MB.
      Contains all SQGDP tables for all states.
      Wide format CSV with years as columns.

  bea_sapce_bulk:
    cachePattern: "type=bea_bulk/dataset=SAPCE/SAPCE.zip"
    url: "https://apps.bea.gov/regional/zip/SAPCE.zip"
    dimensions:
      year: *year_range_default
    comment: >
      BEA State Personal Consumption Expenditures (SAPCE) bulk download ~3.7MB.
      Contains all SAPCE tables for all states.
      Wide format CSV with years as columns.

# ============================================================================
# PARTITIONED TABLES
# ============================================================================
# Economic data organized by type, frequency, and year
# Standard partitioning: type=<category>/frequency=<M|Q|A>/year=<YYYY>
# ============================================================================

partitionedTables:

  # --- EMPLOYMENT STATISTICS ---
  - name: employment_statistics
    # Freshness gate: BLS revises the prior 1-2 months on every monthly release and restates the
    # prior calendar year in its annual February benchmark revision. The period-completion gate
    # marks each year 'complete' the first time it succeeds and never re-checks it, so the lookback
    # reopens the 6 most recently published years every run; the hash check then skips the write
    # (no new snapshot) unless BLS actually revised the data.
    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=employment_statistics/frequency=*/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2026
      distinctYears: 18
      contiguous: true
      rowCount: 1709
      checkedAt: "2026-09-05T14:44:01Z"
    partitions: *standard_partitions
    comment: >
      U.S. employment and unemployment statistics from BLS including national unemployment rate, labor force participation, job openings, and employment by sector. Also includes CPS unemployment rate, labor force participation rate, and employment-population ratio broken out by educational attainment for ages 25 and over (seasonally adjusted), and CPS labor force/employment/unemployment level and unemployment rate broken out by veteran status (total veterans, nonveterans, Gulf War-era II veterans; not seasonally adjusted). Updated monthly with seasonal adjustments.

    # Dimension definitions for iteration
    dimensions:
      type:
        - employment_statistics  # Static table type
      frequency: *monthly_frequency  # Reference YAML anchor
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2020}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 0
        releaseMonth: 2  # BLS monthly data complete by mid-January

    # Columns match BLS API response fields
    columns:
      - name: series
        type: string
        nullable: true
        comment: >
          BLS series identifier. This table is long-format: one row per (series, period),
          so ALWAYS filter on series — mixing series in an aggregate mixes incompatible units
          (percent, thousands of persons, weeks, hours). The 35 series loaded are:
          LNS14000000 unemployment rate, 16+ (percent);
          LNS11300000 labor force participation rate, 16+ (percent);
          LNS12300000 employment-population ratio, 16+ (percent);
          LNS13327709 U-6 total labor underutilization rate (percent);
          LNS11000000 civilian labor force level (thousands);
          LNS12000000 employment level, CPS (thousands);
          LNS13000000 unemployment level (thousands);
          LNS12032194 employed part time for economic reasons (thousands);
          LNS13008636 unemployed 27 weeks and over (thousands);
          LNS13025703 unemployed 27 weeks and over as percent of unemployed (percent);
          LNS13008275 average weeks unemployed; LNS13008276 median weeks unemployed;
          LNS14000003 unemployment rate, White; LNS14000006 Black or African American;
          LNS14000009 Hispanic or Latino; LNS14032183 Asian;
          LNS14000025 men 20+; LNS14000026 women 20+; LNS14000012 ages 16-19 (all percent);
          unemployment rate by educational attainment, 25+ —
          LNS14027659 less than a high school diploma, LNS14027660 high school graduates no college,
          LNS14027689 some college or associate degree, LNS14027662 bachelor's degree and higher;
          labor force participation rate by educational attainment, 25+ —
          LNS11327659, LNS11327660, LNS11327689, LNS11327662 (same four education groups, in order);
          employment-population ratio by educational attainment, 25+ —
          LNS12327659, LNS12327660, LNS12327689, LNS12327662 (same four education groups, in order);
          CES0000000001 total nonfarm employment (thousands);
          CES0500000001 total private employment (thousands);
          CES0500000002 average weekly hours, all employees, total private;
          CES0500000007 average weekly hours, production and nonsupervisory employees, total private;
          CPS labor force level / employment level / unemployment level (thousands) / unemployment
          rate (percent) by veteran status, 18+, not seasonally adjusted (BLS publishes no seasonally
          adjusted veteran breakout) —
          LNU01049526/LNU02049526/LNU03049526/LNU04049526 total veterans,
          LNU01049601/LNU02049601/LNU03049601/LNU04049601 nonveterans,
          LNU01066408/LNU02066408/LNU03066408/LNU04066408 Gulf War-era II veterans.
          All LNS (CPS) series are seasonally adjusted; the LNU veteran-status series are not.
          Use SELECT DISTINCT series to see what a given partition actually contains.
      - name: year
        type: integer
        nullable: true
        comment: Data year from BLS API
      - name: period
        type: string
        nullable: true
        comment: BLS period identifier (M01-M12 for monthly, Q01-Q04 for quarterly)
      - name: periodName
        type: string
        nullable: true
        comment: Human-readable period name (e.g., 'January', 'February')
      - name: value
        type: double
        nullable: true
        comment: Employment statistic value (e.g., unemployment rate as percentage)
      - name: latest
        type: boolean
        nullable: true
        comment: Whether this is the latest data point in the series
      - name: footnotes
        type: string
        nullable: true
        comment: Any footnotes or qualifiers for the data point

    # API Configuration
    # NOTE: this `download:` block (including seriesList below) is legacy/unused by the
    # active file.etl HttpSource pipeline — confirmed live 25 Aug 2026: editing seriesList
    # here has zero effect on the actual BLS request. The real, executed request body is
    # `source.body.seriesid` further below (a separately inlined list — "variables don't
    # support lists" per its own comment). Add/remove series there, not here.
    download:
      enabled: true
      method: POST
      baseUrl: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      authentication:
        type: json_body
        paramName: registrationkey
        envVar: BLS_API_KEY  # Set BLS API key in environment
      requestBody:
        seriesid:
          type: iteration
          source: seriesList
        startyear: {year}
        endyear: {year}
        registrationkey:
          type: auth
      seriesList:  # BLS series codes to fetch
        - "LNS14000000"
        - "CES0000000001"
        - "LNS11300000"
        # CPS unemployment rate by educational attainment, 25 years and over (seasonally adjusted)
        - "LNS14027659"
        - "LNS14027660"
        - "LNS14027689"
        - "LNS14027662"
        # CPS labor force participation rate by educational attainment, 25 years and over
        - "LNS11327659"
        - "LNS11327660"
        - "LNS11327689"
        - "LNS11327662"
        # CPS employment-population ratio by educational attainment, 25 years and over
        - "LNS12327659"
        - "LNS12327660"
        - "LNS12327689"
        - "LNS12327662"
        # CPS headline levels and alternative measures of labor underutilization
        - "LNS12300000"
        - "LNS13327709"
        - "LNS11000000"
        - "LNS12000000"
        - "LNS13000000"
        - "LNS12032194"
        - "LNS13008636"
        - "LNS13025703"
        - "LNS13008275"
        - "LNS13008276"
        # CPS unemployment rate by race/ethnicity, sex, and age
        - "LNS14000003"
        - "LNS14000006"
        - "LNS14000009"
        - "LNS14032183"
        - "LNS14000025"
        - "LNS14000026"
        - "LNS14000012"
        # CES total private employment and average weekly hours
        - "CES0500000001"
        - "CES0500000002"
        - "CES0500000007"
      rateLimit:  # BLS API limits (registered v2 key): 500 daily queries, 50 series per query
        minIntervalMs: 1100  # Wait time between requests
        maxRetries: 3
      response:
        format: json
        dataPath: "Results.series"

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      method: POST
      headers:
        Content-Type: "application/json"
      body:
        seriesid:  # BLS series codes - inlined for HttpSource (variables don't support lists)
          - "LNS14000000"   # Unemployment rate
          - "CES0000000001" # Total nonfarm employment
          - "LNS11300000"   # Labor force participation rate
          # Unemployment rate by educational attainment, 25 years and over (seasonally adjusted)
          - "LNS14027659"   # Unemployment rate - less than a high school diploma
          - "LNS14027660"   # Unemployment rate - high school graduates, no college
          - "LNS14027689"   # Unemployment rate - some college or associate degree
          - "LNS14027662"   # Unemployment rate - bachelor's degree and higher
          # Labor force participation rate by educational attainment, 25 years and over
          - "LNS11327659"   # LFPR - less than a high school diploma
          - "LNS11327660"   # LFPR - high school graduates, no college
          - "LNS11327689"   # LFPR - some college or associate degree
          - "LNS11327662"   # LFPR - bachelor's degree and higher
          # Employment-population ratio by educational attainment, 25 years and over
          - "LNS12327659"   # Emp-pop ratio - less than a high school diploma
          - "LNS12327660"   # Emp-pop ratio - high school graduates, no college
          - "LNS12327689"   # Emp-pop ratio - some college or associate degree
          - "LNS12327662"   # Emp-pop ratio - bachelor's degree and higher
