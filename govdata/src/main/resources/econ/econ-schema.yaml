  # --- STATE WAGES ---
  - name: state_wages
    pattern: "type=state_wages/frequency=*/year=*/state_wages.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2025
      distinctYears: 18
      contiguous: true
      rowCount: 2494068
      checkedAt: "2026-09-05T14:44:03Z"
    # QCEW data year Y stays preliminary until it is finalized alongside the following year's Q1
    # release (~Sept Y+1), and BLS rewrites the annual singlefile in between. Reopening the 2 most
    # recently published years picks up that preliminary-to-final rewrite; BLS does not edit the
    # file again afterwards. https://www.bls.gov/cew/revisions/
    lookbackPeriods: 2
    # BLS serves both ETag and Last-Modified on this static per-year zip (confirmed via HEAD);
    # ETag is the more precise signal. Lets a historical/daily re-run skip a year whose upstream
    # file hasn't changed instead of unconditionally re-downloading and re-writing every year in
    # the configured range on every invocation — see EtlPipeline's per-unit freshness gate.
    freshness:
      type: etag
    partitions: *standard_partitions
    comment: >
      Annual establishment counts, employment levels, total wages, and average weekly wage for
      all 51 U.S. jurisdictions (50 states + DC), from BLS QCEW (Quarterly Census of Employment
      and Wages, released with ~1-year lag). Broken out by NAICS industry (industry_code) AND
      ownership sector (own_code), so this is the catalog's source for sector- or
      industry-specific pay by state (e.g. teacher pay, public-sector pay, healthcare-sector
      pay). Worked example — public K-12 teacher-sector pay: industry_code='611' (educational
      services), own_code='3' (local government), agglvl_code='55'; use own_code='2' for state
      government (public universities), '5' for private. This is industry x ownership average pay,
      NOT occupation-level (SOC), so an industry figure covers every worker in the sector
      (teachers plus aides/administrators/support), not the occupation alone. For the metro-area
      version, see metro_wages (27 metros, which also carries average annual pay).

    # Dimension definitions for iteration
    dimensions:
      type:
        - state_wages  # Static table type
      frequency:
        - annual
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:1990}"  # QCEW data only available from 1990
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 1       # QCEW annual data is released with ~1 year lag
        releaseMonth: 9  # Released in September (with Q1 data of following year)

    # Source columns from QCEW CSV (matching actual file structure)
    columns:
      - name: area_fips
        type: string
        nullable: true
        comment: State FIPS code with 000 suffix (e.g., 01000 for Alabama)
      - name: own_code
        type: string
        nullable: true
        comment: >
          Ownership sector: 0=total (all ownerships), 1=federal government, 2=state government,
          3=local government, 5=private. Public K-12 schools are 3 (local government); public
          universities are mostly 2 (state government).
      - name: industry_code
        type: string
        nullable: true
        comment: >
          NAICS industry code; '10'=total, all industries. Select a sector for
          industry-specific pay — e.g. '611'=educational services (schools), '622'=hospitals,
          '722'=food services & drinking places. Pair with the matching agglvl_code.
      - name: agglvl_code
        type: string
        nullable: true
        comment: >
          QCEW aggregation level. '55'=statewide, by 3-digit NAICS subsector, by ownership
          sector — the grain at which industry-specific pay (e.g. educational services, NAICS
          611) resolves to one row per state per ownership; coarser codes roll up to sector or
          total-all-industries. Any industry-specific query must pin agglvl_code together with
          industry_code and own_code.
      - name: annual_avg_estabs
        type: int
        nullable: true
        comment: Average annual establishment count
      - name: annual_avg_emplvl
        type: int
        nullable: true
