  # --- JOLTS REGIONAL ---
  - name: jolts_regional
    # JOLTS revises the prior 1-2 months on every monthly release and restates the
    # prior calendar year in its annual benchmark update (same cadence as employment_statistics).
    # The lookback reopens the 6 most recently published years; the hash check skips the
    # write when the source file is unrevised for that year.
    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=jolts_regional/frequency=*/year=*/jolts_regional.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2026
      distinctYears: 18
      contiguous: true
      rowCount: 275400
      checkedAt: "2026-09-05T14:44:06Z"
    partitions: *standard_partitions
    sourcePaths:
      ftpFiles:
        - cachePath: "type=jolts_ftp/jt.series"
          url: "https://download.bls.gov/pub/time.series/jt/jt.series"
          comment: JOLTS series definitions
        - cachePath: "type=jolts_ftp/jt.data.2.JobOpenings"
          url: "https://download.bls.gov/pub/time.series/jt/jt.data.2.JobOpenings"
          comment: Job openings data
        - cachePath: "type=jolts_ftp/jt.data.3.Hires"
          url: "https://download.bls.gov/pub/time.series/jt/jt.data.3.Hires"
          comment: Hires data
        - cachePath: "type=jolts_ftp/jt.data.4.TotalSeparations"
          url: "https://download.bls.gov/pub/time.series/jt/jt.data.4.TotalSeparations"
          comment: Total separations data
        - cachePath: "type=jolts_ftp/jt.data.5.Quits"
          url: "https://download.bls.gov/pub/time.series/jt/jt.data.5.Quits"
          comment: Quits data
        - cachePath: "type=jolts_ftp/jt.data.6.LayoffsDischarges"
          url: "https://download.bls.gov/pub/time.series/jt/jt.data.6.LayoffsDischarges"
          comment: Layoffs and discharges data
    comment: >
      Monthly JOLTS (Job Openings and Labor Turnover Survey) job openings, hires, total
      separations, quits, and layoffs/discharges — rates and levels — for the U.S. national total
      plus the 4 Census regions (Northeast, Midwest, South, West). For national industry-level
      detail see jolts_industry; for state-level detail see jolts_state.

    # Dimension definitions for iteration
    dimensions:
      type:
        - jolts_regional  # Static table type
      frequency: *monthly_frequency  # Monthly JOLTS releases
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2001}"  # JOLTS data only available from December 2000
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"

    columns:
      # BLS TSV columns: series_id, year, period, value, footnote_codes
      # Series ID format: JTS{industry:4-9}{region:10-11}{area:12-16}{sizeclass:17-18}{element:19-20}{ratelevel:21}
      # e.g. JTS000000NE00000000JOR = job openings rate, Northeast, total nonfarm
      - name: date
        type: date
        nullable: true
        comment: Observation date (ISO 8601 format)
        # Construct date from year + period (e.g., 2020 + M01 -> 2020-01-01)
        expression: "year || '-' || LPAD(CAST(CAST(SUBSTRING(period, 2, 2) AS INTEGER) AS VARCHAR), 2, '0') || '-01'"
      - name: series
        type: string
        nullable: true
        comment: >
          BLS JOLTS series identifier, 21 characters:
          JTS + industry(6, positions 4-9) + state or region(2, positions 10-11) +
          area(5, positions 12-16) + size class(2, positions 17-18) +
          data element(2, positions 19-20) + rate/level(1, position 21).
          Data element codes: JO job openings, HI hires, TS total separations, QU quits,
          LD layoffs and discharges, OS other separations, UO unemployed persons per job opening,
          R1/R2 survey response rates. Rate/level: L = level in thousands, R = rate
          (percent of employment; job openings rate uses employment plus openings as the base).
          Decode industry with econ_reference.jolts_industries and the data element with
          econ_reference.jolts_dataelements. This table is long-format: one row per
          (series, period), so ALWAYS filter on series (or the decoded code columns) —
          never aggregate across data elements or across L and R together.
          Rows here are the national and 4-region slice: series matching
          ^JTS000000(00|NE|MW|SO|WE) — industry is always 000000 (total nonfarm) and
          positions 10-11 hold 00 for the U.S. or NE/MW/SO/WE for the Census region.
        source: series_id
      - name: region_code
        type: string
        nullable: true
        comment: Census region code (00=US, NE/MW/SO/WE for regions)
        # Region is at series_id positions 10-11, e.g. JTS000000{NE}0000000HIR — NOT 4-5
        # (positions 4-9 are the industry field, always 000000 here, which made every row '00').
        expression: "SUBSTRING(series_id, 10, 2)"
      - name: region_name
        type: string
        nullable: true
        comment: Census region name
        # Friendly name for the known geographies; JOLTS also publishes state-level series, so
        # for any other code at positions 10-11 (state FIPS like 01/02/...56) capture the raw
        # code AS-IS — never NULL or a fabricated 'Unknown'. This retains every series and needs
        # no exhaustive name list; region_code holds the raw value either way.
        expression: "CASE SUBSTRING(series_id, 10, 2) WHEN '00' THEN 'United States' WHEN 'NE' THEN 'Northeast' WHEN 'MW' THEN 'Midwest' WHEN 'SO' THEN 'South' WHEN 'WE' THEN 'West' ELSE SUBSTRING(series_id, 10, 2) END"
      - name: metric_type
        type: string
        nullable: true
        comment: JOLTS metric (hires, separations, openings, quits, layoffs)
        # Extract data element code from series_id (last 3 chars like JOR, HIR, etc.)
        expression: "CASE RIGHT(series_id, 3) WHEN 'JOR' THEN 'JobOpenings' WHEN 'HIR' THEN 'Hires' WHEN 'TSR' THEN 'TotalSeparations' WHEN 'QUR' THEN 'Quits' WHEN 'LDR' THEN 'LayoffsDischarges' ELSE RIGHT(series_id, 3) END"
      - name: value
        type: double
        nullable: true
        comment: JOLTS metric value (levels in thousands, rates as percentage)
        source: value

    # Dimension definitions for iteration
    dimensions:
      type:
        - jolts_regional
      frequency:
        - monthly
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2020}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
      metric:
        - "2.JobOpenings"
        - "3.Hires"
        - "4.TotalSeparations"
        - "5.Quits"
        - "6.LayoffsDischarges"

    # HTTP Source configuration for EtlPipeline (FTP files)
    source:
      type: http
      url: "https://download.bls.gov/pub/time.series/jt/jt.data.{metric}"
      method: GET
      headers:
        # download.bls.gov 403s fake-browser User-Agents; requires a self-identifying UA
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      response:
        format: tsv
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true
      # Filter to regional data only: industry=000000 (positions 4-9) AND a region/national code
      # at positions 10-11 (00=national, NE/MW/SO/WE=Census regions). Series ID layout:
      # JTS{industry:4-9}{geo:10-11}{area:12-16}{sizeclass:17-18}{element+rate:19-21}.
      # Excludes the state-FIPS rows (01-56) — those are captured by jolts_state.
      rowFilter:
        column: series_id
        pattern: "^JTS000000(00|NE|MW|SO|WE).*$"

    # Materialization configuration
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=jolts_regional/frequency=*/year=*/"
      partition:
        columns: [type, frequency, year, metric]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/econ"
        catalogType: hadoop
        batchPartitionColumns: [year, metric]
        incrementalKeys: [year, metric]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5
        compactionSmallFileSizeBytes: 1048576  # 1MB
        targetFileSizeBytes: 134217728

