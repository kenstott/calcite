  # --- LABOR PRODUCTIVITY ---
  - name: labor_productivity
    # BLS revises recent quarters of the Major Sector Productivity series and
    # restates the prior calendar year in its annual benchmark update. The lookback
    # reopens the 6 most recently published years; the hash check skips the write when
    # unrevised (year-grain only -- does not separately re-check quarter-level revision).
    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=labor_productivity/frequency=*/year=*/labor_productivity.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2026
      distinctYears: 18
      contiguous: true
      rowCount: 419
      checkedAt: "2026-09-05T14:44:09Z"
    partitions: *standard_partitions
    comment: >
      BLS Major Sector Productivity and Costs (PR survey) labor productivity index — output per
      hour of all persons, chained index (2017=100), seasonally adjusted, quarterly — for 6
      major-sector series: business, nonfarm business, manufacturing, manufacturing durable
      goods, manufacturing nondurable goods, and nonfinancial corporations. National grain only;
      BLS does not publish this series by state. api.bls.gov itself carries business/nonfarm
      business/nonfinancial corporations back to 1947 and manufacturing (plus its durable/
      nondurable subsectors) back to 1987 (not a uniform start) — but this table's own
      observedCoverage below is the source of truth for what's actually loaded here, uniformly,
      across all 6 series; check it rather than assuming it matches BLS's full range. Only the
      productivity (output-per-hour) index is loaded — BLS's companion unit-labor-cost and
      compensation series from the same PR survey (measure codes 06, 11, etc.) are not included.
      Long-format: one row per (series, period) — ALWAYS filter on series.
    columns:
      - name: date
        type: date
        nullable: true
        comment: >
          Observation date, first day of the quarter, derived from the BLS year and period fields
          (period Q01-Q04). BlsResponseTransformer emits year and period rather than a date.
        expression: "year || '-' || LPAD(CAST(((CAST(SUBSTRING(period, 2, 2) AS INTEGER) - 1) * 3 + 1) AS VARCHAR), 2, '0') || '-01'"
      - name: series
        type: string
        nullable: true
        comment: >
          BLS PR series identifier. This table is long-format: one row per (series, period), so
          ALWAYS filter on series. The 6 series loaded are all output-per-hour index (measure 09,
          duration 3 = index level, 2017=100): PRS85006093 nonfarm business; PRS84006093 business;
          PRS30006093 manufacturing; PRS31006093 manufacturing, durable goods; PRS32006093
          manufacturing, nondurable goods; PRS88003093 nonfinancial corporations.
      - name: value
        type: double
        nullable: true
        comment: Labor productivity index value (output per hour of all persons, 2017=100)

    # Dimension definitions for iteration
    dimensions:
      type:
        - labor_productivity
      frequency: *quarterly_frequency
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2020}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"

    # HTTP Source configuration for EtlPipeline
    source:
