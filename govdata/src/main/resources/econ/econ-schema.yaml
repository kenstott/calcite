  # --- REGIONAL EMPLOYMENT ---
  - name: regional_employment
    # BLS revises the prior 1-2 months on every monthly release and restates the
    # prior calendar year in its annual February benchmark revision (same cadence as
    # employment_statistics). The lookback reopens the 6 most recently published years so
    # the period-completion gate doesn't freeze them; the hash check skips the write when unrevised.
    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=regional_employment/year=*/regional_employment.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2026
      distinctYears: 18
      contiguous: true
      rowCount: 43044
      checkedAt: "2026-09-05T14:44:09Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER
        - name: state_fips
          type: VARCHAR
    comment: >
      Monthly state-level unemployment rate, unemployment level, employment level, and civilian
      labor force level (persons) for all 51 U.S. jurisdictions, from BLS Local Area Unemployment
      Statistics (LAUS). This is labor force size, not the labor force participation rate (see
      employment_statistics for the national participation rate).

    # Dimension definitions for iteration
    dimensions:
      type:
        - regional_employment
      year:
        type: yearRange
        # 2010, not the 2020 default used elsewhere in this file: BLS LAUS actually returns
        # full series history regardless of this dimension, and the live warehouse carries
        # regional_employment data back to 2010 (confirmed via the Iceberg table's own
        # manifests) — so a runtime with no GOVDATA_START_YEAR set (e.g. a shipped MCP
        # server, which never runs ETL and has no reason to have this ETL-time variable
        # exported) previously declared a coverage window ten years narrower than what was
        # actually loaded, until the async observed-window probe caught up.
        start: "{env:GOVDATA_START_YEAR:2010}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 0
        releaseMonth: 2  # BLS monthly data complete by mid-January

    columns:
      - name: series
        type: string
        nullable: true
        comment: >
          BLS Local Area Unemployment Statistics (LAUS) series identifier, format
          LASST{state FIPS(2)}{area(10)}{measure(2)} — e.g. LASST010000000000003 is the Alabama
          statewide unemployment rate. The trailing measure code selects the statistic:
          03 unemployment rate (percent), 04 unemployment level, 05 employment level,
          06 civilian labor force level (levels in persons). 204 series are loaded =
          51 jurisdictions x those 4 measures; the full list is in
          /bls/regional-employment-series.json. This table is long-format: one row per
          (series, period) and it mixes a percent with three person counts, so ALWAYS filter
          on series or the derived measure column before aggregating.
      - name: year
        type: integer
        nullable: true
        comment: Observation year
      - name: period
        type: string
        nullable: true
        comment: BLS period identifier (M01-M12 for monthly)
      - name: value
        type: double
        nullable: true
        comment: Employment statistic value
      - name: state_fips
        type: string
        nullable: true
        expression: "SUBSTRING(src.series, 6, 2)"
        comment: 2-digit state FIPS code derived from series ID (LASST{fips}...)
      - name: measure
        type: string
        nullable: true
        expression: "CASE SUBSTRING(series, LENGTH(series), 1) WHEN '3' THEN 'unemployment_rate' WHEN '4' THEN 'unemployment' WHEN '5' THEN 'employment' WHEN '6' THEN 'labor_force' ELSE 'unknown' END"
        comment: Employment measure type derived from series ID

    # API Configuration
    # Full series list (204 total: 51 states x 4 measures) available in /bls/regional-employment-series.json
    download:
      enabled: true
      method: POST
      baseUrl: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      authentication:
        type: json_body
        paramName: registrationkey
        envVar: BLS_API_KEY  # Set API key in environment

    # HTTP Source configuration for EtlPipeline
    # Uses batching to split 204 series into requests of 50 (BLS API limit)
    source:
      type: http
      enabled: true
      url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      method: POST
      headers:
        Content-Type: "application/json"
      body:
        seriesid: []  # Placeholder - replaced by batching
        startyear: "{year}"
        endyear: "{year}"
        registrationkey: "{env:BLS_API_KEY}"
      batching:
        field: seriesid
        source: "/bls/regional-employment-series.json"
        path: "seriesIds"
        size: 50  # BLS API limit
        delayMs: 1100  # Rate limit between batches
      response:
        format: json
        # NOTE: dataPath removed - BlsResponseTransformer handles extraction and flattening
        errorPath: "message"  # BLS API returns errors in message array
      rateLimit:
        requestsPerSecond: 0.9
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    # Custom hooks for BLS response handling
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.econ.BlsResponseTransformer"

    # Materialization configuration
    #
    # partition.columns deliberately does NOT include state_fips, even though it is a real
    # column and BLS API responses are fetched per-state. state_fips is computed via the
    # `expression` on that column above (SUBSTRING of series), not present in the raw fetched
    # row — the writer buffers and flushes batches (see iceberg.batchPartitionColumns) before
    # that expression is ever evaluated, and a single BLS batch request covers 50 series
    # spanning multiple states, so no single write batch is state_fips-homogeneous. Declaring
    # it as an Iceberg partition column here produced a table where every file's Iceberg
    # partition-value metadata was bogus (state_fips is not actually used to split files —
    # every year's rows for all 51 states land in one file, confirmed via
    # `iceberg_scan(...) WHERE year = 2022` returning the full 2448-row year while `WHERE
    # state_fips = '37'` returned 0 against the same live table), which made DuckDB's Iceberg
    # partition pruning silently discard every row for ANY state_fips predicate — a correct
    # column value that can never be found by filtering on it. Contrast econ_schema's
    # national_accounts/gdp_statistics, which partition on an expression-derived `frequency`
    # column safely, because frequency IS a fetch dimension (one value per request) so every
    # write batch is frequency-homogeneous even though the column itself is computed.
    #
    # This YAML change only prevents a FUTURE re-materialization from recreating the bug. The
    # existing s3://govdata-parquet-v1/econ/regional_employment Iceberg table already carries
    # the bad partition metadata on disk and needs an explicit reset/re-materialization (e.g.
    # via the data-fix tooling) to actually pick up a 2-column [type, year] partition spec and
    # start answering state_fips predicates correctly.
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=regional_employment/year=*/"
      partition:
        columns: [type, year]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
        emptyResultTtlMillis: 86400000  # Retry after 24 hours if no data
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/econ"
        catalogType: hadoop
        targetFileSizeBytes: 134217728  # 128MB target for optimal read performance
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

