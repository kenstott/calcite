  # --- REGIONAL PRICE PARITIES ---
  - name: regional_price_parities
    # BEA advances quarterly GDP-family estimates (advance -> second -> third,
    # about a month apart) and can restate multiple prior years in its annual/comprehensive NIPA
    # and regional revisions. The lookback reopens the 8 most recently published years, matching
    # regional_income: both come from the same BEA regional program and are restated on the same
    # cycle. Without it the period-completion gate marks each year complete on first success and
    # the hash check can never re-fire.
    lookbackPeriods: 8
    freshness:
      type: hash
    pattern: "type=regional_price_parities/year=*/tablename=*/regional_price_parities.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2024
      distinctYears: 17
      contiguous: true
      rowCount: 37315
      checkedAt: "2026-09-05T14:44:13Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER
        - name: tablename
          type: VARCHAR
    comment: >
      BEA Regional Price Parities (RPP): the standard federal cost-of-living / price-level index
      by state (search terms: cost of living, COLA, price parity, RPP) — by state and Metropolitan
      Statistical Area (MSA) relative to the national average (100.000), annual since 2008. This is
      the table to divide nominal wages/income by (index/100) to get real, cost-of-living-adjusted
      dollars comparable across states.
      Verified live against apps.bea.gov/api/data (dataset Regional, tables SARPP/MARPP):
      coverage 2008-2024 at verification time. tablename selects the geography: SARPP = state
      (includes a GeoFips=00000 "United States" national baseline row, always rpp_index=100.000,
      plus all 50 states + DC); MARPP = Metropolitan Statistical Areas only (no non-metro/rural,
      micropolitan, or port-area coverage — BEA's port-level PARPP table is not loaded here).
      line_code selects the price component: 1=All items, 2=Goods, 3=Services: Rents,
      4=Services: Utilities, 5=Services: Other. An rpp_index of e.g. 88.901 means costs are
      11.1% below the national average for that component/geography/year. (BEA's Regional
      dataset also lists SARPP/MARPP among the 63 tables regional_income iterates, but that
      table's line_code resolver only has reference data for SAINC/SQINC/CAINC/SAGDP/SQGDP/CAGDP
      series, so regional_income never actually fetches RPP rows — this table is the source of
      that data.)
    columns:
      - name: geo_fips
        type: string
        source: GeoFips
        nullable: true
        comment: 5-digit FIPS (state) or CBSA (MSA) code; '00000' = United States national baseline
      - name: geo_name
        type: string
        source: GeoName
        nullable: true
        comment: State name (tablename=SARPP) or MSA name (tablename=MARPP)
      - name: year
        type: int
        nullable: true
        expression: "CAST(TimePeriod AS INTEGER)"
        comment: Year of the RPP observation
      - name: line_code
        type: string
        nullable: true
        comment: >
          BEA RPP line code — dimension-iterated per fetch, not present in the raw API row itself:
          1=All items, 2=Goods, 3=Services: Rents, 4=Services: Utilities, 5=Services: Other.
      - name: rpp_index
        type: double
        nullable: true
        expression: "CASE WHEN DataValue IN ('(NA)', '(D)', '(NM)', '---') THEN NULL ELSE CAST(REPLACE(DataValue, ',', '') AS DOUBLE) END"
        comment: >
          Regional Price Parity index; 100.000 = national average cost of living for that
          component (e.g. 88.901 means costs 11.1% below the national average)
      - name: units
        type: string
        source: CL_UNIT
        nullable: true
        comment: Always 'Index' (BEA CL_UNIT field)

    # HTTP Source configuration for EtlPipeline
    # LineCode is single-valued per BEA API (MultipleAcceptedFlag=0, verified live), so it is an
    # iterated dimension rather than a comma-joined parameter. GeoFips differs by geography
    # (STATE for SARPP, MSA for MARPP); urlRules selects the MSA variant when tablename=MARPP.
    source:
      type: http
      url: "https://apps.bea.gov/api/data?UserID={env:BEA_API_KEY}&method=GetData&DataSetName=Regional&TableName={tablename}&LineCode={line_code}&GeoFips=STATE&Year={effective_year}&ResultFormat=JSON"
      method: GET
      urlRules:
        - url: "https://apps.bea.gov/api/data?UserID={env:BEA_API_KEY}&method=GetData&DataSetName=Regional&TableName={tablename}&LineCode={line_code}&GeoFips=MSA&Year={effective_year}&ResultFormat=JSON"
          variableMatch:
            tablename: MARPP
      response:
        format: json
        # Note: dataPath removed because responseTransformer already extracts the data
        errorPath: "BEAAPI.Results.Error"
      rateLimit:
        requestsPerSecond: 1.5
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    # Custom hooks for BEA response handling (generic — same transformer as gdp_statistics/regional_income)
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.econ.BeaResponseTransformer"

    # Dimension definitions for ETL iteration
    dimensions:
      type:
        - regional_price_parities
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2010}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        minYear: 2008  # RPP data floor, verified live via BEA GetData Year=ALL
        dataLag: 1
      tablename:
        - SARPP   # State-level RPP
        - MARPP   # MSA-level RPP
      line_code:
        - "1"   # All items
        - "2"   # Goods
        - "3"   # Services: Rents
        - "4"   # Services: Utilities
        - "5"   # Services: Other

    # Materialization configuration
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=regional_price_parities/year=*/tablename=*/"
      partition:
        columns: [type, year, tablename]
        valueSource:
          year: effective_year
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/econ"
        catalogType: hadoop
        targetFileSizeBytes: 134217728  # 128MB target for optimal read performance
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # --- STATE PERSONAL INCOME (BULK DOWNLOAD) ---
  # Efficient bulk download approach replacing 12,000+ API calls with single ~16MB download
  - name: state_personal_income
    pattern: "type=*/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1929
      maxYear: 2025
      distinctYears: 97
      contiguous: true
      rowCount: 2139212
      checkedAt: "2026-09-05T14:44:14Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER
    comment: >
      State-level personal income and its components — total personal income, population, per
      capita income, wages and salaries, transfer receipts, and more — from all 12 active BEA
      SAINC tables, for all 50 states + DC. BEA publishes this series annually back to 1929
      through the present; this table's own observedCoverage below is the source of truth for
      what's actually loaded — check it rather than assuming it matches BEA's full range. For
      county/MSA-level income (and all other BEA regional topics: GDP, consumption, wages by
      industry), see regional_income.

    # Simplified dimensions - no per-API-call iteration needed
    dimensions:
      type:
        - state_personal_income  # Static table type

    columns:
      - name: geo_fips
        type: string
        nullable: true
        comment: FIPS code for the geographic area (e.g., '01000' for Alabama)
      - name: geo_name
        type: string
        nullable: true
        comment: Name of the geographic area (state name)
      - name: region
        type: string
        nullable: true
        comment: Census region
      - name: table_name
        type: string
        nullable: true
        comment: BEA table identifier (e.g., SAINC1, SAINC30)
      - name: line_code
        type: string
        nullable: true
        comment: >
          BEA line code — the row identifier within a BEA regional table. A line_code is only
          unique within a table, so ALWAYS filter or join on (table_name, line_code): the same
          line_code means different things in different BEA tables. Each row already carries the
          line's own label in the description column and its unit in the unit column; for the full
          catalog, join (table_name, line_code) to econ_reference.regional_linecodes
          (tablename, key). This table is long-format — one row per
          (geo_fips, table_name, line_code, year) — so never sum value across line codes: they mix
          dollars, index numbers, and counts, and many lines are subtotals of other lines.
      - name: industry_classification
        type: string
        nullable: true
        comment: Industry classification code
      - name: description
        type: string
        nullable: true
        comment: Description of the metric
      - name: unit
        type: string
        nullable: true
        comment: Unit of measurement
      - name: year
        type: integer
        nullable: true
        comment: Year (unpivoted from column headers)
      - name: data_value
        type: double
        nullable: true
        comment: Value for this year (unpivoted from wide format)


    # API Configuration - references bulk download
    download:
      bulkDownload: bea_sainc_bulk

    # Freshness: BEA republishes the static SAINC.zip on annual benchmark revisions.
    # A single HEAD probe of Last-Modified re-triggers ingest when the vintage changes;
    # without it, complete year-partitions stay frozen and miss BEA revisions.
    freshness:
      type: last_modified

    # HTTP Source configuration for bulk download
    source:
      type: http
      url: "https://apps.bea.gov/regional/zip/SAINC.zip"
      method: GET
      extractPattern: "*__ALL_AREAS_*.csv"  # Extract the ALL_AREAS CSV from ZIP
      response:
        format: csv
      # Wide-to-narrow transformation: years as columns -> Year + DataValue rows
      wideToNarrow:
        keyColumns: [GeoFIPS, GeoName, Region, TableName, LineCode, IndustryClassification, Description, Unit]
        valueColumnPattern: "^\\d{4}$"  # Match 4-digit year columns (1929-2024)
        keyColumnName: year
        valueColumnName: data_value
        skipValues: ["(NA)", "(D)", "(L)", "(NM)", ""]  # BEA notation for missing/suppressed data
        columnMapping:
          GeoFIPS: geo_fips
          GeoName: geo_name
          Region: region
          TableName: table_name
          LineCode: line_code
          IndustryClassification: industry_classification
          Description: description
          Unit: unit
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    # Materialization configuration
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=*/year=*/"
      partition:
        columns: [type, year]
      options:
        compression: snappy
        batchSize: 100000
        stagingMode: local
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/econ"
        catalogType: hadoop
        targetFileSizeBytes: 134217728
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

