    partitions: *standard_partitions
    comment: >
      National monthly CPI-U (all items and core, less food and energy) plus PPI final demand
      finished goods — 3 index series (base period 1982-84=100), national level only, not rates.
      For sub-national CPI breakdowns see regional_cpi (4 Census regions) and metro_cpi (20 metro areas).
    # Columns match BLS API response fields (series > data array)
