      enabled: true
      url: "https://api.bls.gov/publicAPI/v2/timeseries/data/"
      method: POST
      headers:
        Content-Type: "application/json"
      body:
        seriesid:  # BLS PR Major Sector Productivity, output per hour index (measure 09, duration 3)
          - "PRS85006093"   # Nonfarm business
          - "PRS84006093"   # Business
          - "PRS30006093"   # Manufacturing
          - "PRS31006093"   # Manufacturing, durable goods
          - "PRS32006093"   # Manufacturing, nondurable goods
          - "PRS88003093"   # Nonfinancial corporations
        startyear: "{year}"
        endyear: "{year}"
        registrationkey: "{env:BLS_API_KEY}"
      response:
        format: json
        # NOTE: dataPath removed - BlsResponseTransformer handles extraction and flattening
        errorPath: "message"  # BLS API returns errors in message array
      rateLimit:
        requestsPerSecond: 0.9
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    # Custom hooks for BLS response handling
    hooks:
