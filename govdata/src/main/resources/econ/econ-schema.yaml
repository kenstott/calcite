  - name: gdp_statistics
    # BEA advances quarterly GDP-family estimates (advance -> second -> third,
    # about a month apart) and can restate multiple prior years in its annual/comprehensive NIPA
    # and regional revisions. The lookback reopens the 6 most recently published years, which
    # covers the reach of a typical annual revision; a comprehensive revision reaching back
    # further than that still requires a full reprocess.
    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=gdp_statistics/frequency=*/year=*/gdp_statistics.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2025
      distinctYears: 18
      contiguous: true
      rowCount: 2250
      checkedAt: "2026-09-05T14:44:20Z"
    partitions: *standard_partitions
    comment: >
      National GDP growth rates, nominal and real GDP levels, and other line items from BEA NIPA
      table T10101, annual and quarterly. Sources the same T10101 table that's also included in
      the broader national_accounts table (which covers 8 additional NIPA sections); for
      industry-level GDP breakdowns see industry_gdp.
    columns:
      # Map BEA API field names to our column names
      - name: year
        type: int
        nullable: true
        expression: "CAST(SUBSTRING(TimePeriod, 1, 4) AS INTEGER)"
        comment: Year of the GDP observation (extracted from TimePeriod)
      - name: quarter
        type: int
        nullable: true
        expression: "CASE WHEN TimePeriod LIKE '%Q%' THEN CAST(SUBSTRING(TimePeriod, 6, 1) AS INTEGER) ELSE NULL END"
        comment: Quarter number (1-4) for quarterly data, null for annual data
      - name: metric
        type: string
        source: LineDescription
        nullable: true
        comment: GDP metric name (e.g., 'Nominal GDP', 'Real GDP', 'Personal Consumption')
      - name: value
        type: double
        nullable: true
        expression: "CAST(REPLACE(src.DataValue, ',', '') AS DOUBLE)"
        comment: GDP value in millions of dollars (BEA returns comma-formatted numbers)
      - name: percent_change
        type: double
        nullable: true
        expression: "NULL"
        comment: Percent change from previous period (not available in raw NIPA data)
      - name: seasonally_adjusted
        type: boolean
        nullable: true
        expression: "CASE WHEN NoteRef IS NOT NULL AND NoteRef LIKE '%SA%' THEN TRUE ELSE FALSE END"
        comment: Whether the data is seasonally adjusted

    # HTTP Source configuration for EtlPipeline
