          type: integer
    comment: >
      UN Comtrade bilateral merchandise trade: reported value and quantity per
      reporter country x partner country x HS-6 commodity x flow x year. Tall.
      reporter_code and partner_code are ISO alpha-3 (FK to ref.countries);
      partner_code='WLD' and other non-country codes are world/aggregate roll-ups
