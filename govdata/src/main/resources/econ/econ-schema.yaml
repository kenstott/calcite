    freshness:
      type: hash
    pattern: "type=wage_growth/frequency=*/year=*/wage_growth.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2026
      distinctYears: 18
      contiguous: true
      rowCount: 633
      checkedAt: "2026-09-05T14:44:08Z"
    partitions: *standard_partitions
    comment: >
      Monthly average hourly earnings (all employees, and production/nonsupervisory employees
      separately) and average weekly earnings, nominal dollars, for total private employees
      nationally — from BLS Current Employment Statistics (CES). Not inflation-adjusted; deflate
      with inflation_metrics for real wage growth.
    columns:
      - name: date
        type: date
        nullable: true
        comment: >
          Observation date, first day of the month, derived from the BLS year and period fields
          (period M01-M12). BlsResponseTransformer emits year and period rather than a date.
        expression: "year || '-' || LPAD(CAST(CAST(SUBSTRING(period, 2, 2) AS INTEGER) AS VARCHAR), 2, '0') || '-01'"
      - name: series
        type: string
        nullable: true
        comment: >
          BLS CES series identifier. This table is long-format: one row per (series, period), and it
          mixes hourly with weekly earnings, so ALWAYS filter on series. The 3 series loaded are:
          CES0500000003 average hourly earnings, all employees, total private (dollars per hour);
          CES0500000008 average hourly earnings, production and nonsupervisory employees,
          total private (dollars per hour);
          CES0500000011 average weekly earnings, all employees, total private (dollars per week).
          Nominal dollars — deflate with inflation_metrics for real wage growth.
      - name: value
        type: double
        nullable: true
        comment: Earnings value (hourly or weekly depending on series)

