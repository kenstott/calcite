  # --- METRO INDUSTRY ---
  - name: metro_industry
    # BLS revises the prior 1-2 months on every monthly release and restates the
    # prior calendar year in its annual February benchmark revision (same cadence as
    # employment_statistics). The lookback reopens the 3 most recently published years so
    # the period-completion gate doesn't freeze them; the hash check skips the write when unrevised.
    lookbackPeriods: 3
    freshness:
      type: hash
    pattern: "type=metro_industry/frequency=*/year=*/metro_industry.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1949
      maxYear: 2026
      distinctYears: 78
      contiguous: true
      rowCount: 4725318
      checkedAt: "2026-09-05T14:44:04Z"
    partitions: *standard_partitions
    comment: >
      Monthly employment by industry (22 NAICS supersectors: manufacturing, retail, healthcare,
      financial activities, government, and others) for 27 major U.S. metropolitan areas (NYC,
      LA, Chicago, Houston, and others), from BLS SM series (not seasonally adjusted, all-employees
      series). For the state-level version of the same series, see state_industry (53 jurisdictions).

    # Dimension definitions for iteration
    dimensions:
      type:
        - metro_industry
      frequency: *monthly_frequency
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2020}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"

    # BLS SM-program flat-file columns (TSV): series_id, year, period, value, footnote_codes.
    # Series ID layout: SM + seasonal(1) + state(2) + area(5) + supersector(2) + industry(6) + datatype(2).
    columns:
      - name: series
        type: string
        nullable: true
        comment: >
          BLS State and Metro Area Employment (SM) series identifier, 20 characters:
          SMU or SMS + state FIPS(2) + area(5) + supersector(2) + industry(6) + data type(2).
          SMU = not seasonally adjusted, SMS = seasonally adjusted. Data type 01 = all employees
          in thousands, 02 = average weekly hours, 03 = average hourly earnings,
          11 = average weekly earnings. Decode the supersector with
          econ_reference.naics_sectors. This table is long-format: one row per (series, period),
          so ALWAYS filter on series or the decoded code columns.
          Rows here are the metro all-employees slice: series matching
          ^SMU\d{2}(CBSA)\d{2}00000001 for the 27 published metro CBSA codes at positions 6-10,
          industry 000000 (supersector totals), data type 01, not seasonally adjusted — 27 metros
          x 22 supersectors; e.g. SMU36935610000000001 is the New York metro, total nonfarm,
          all employees. Join the embedded CBSA code to econ_reference.bls_geographies
          (cbsa_code) for metro names. Statewide rows live in state_industry.
        source: series_id
      - name: year
        type: integer
        nullable: true
        comment: Data year
        source: year
      - name: period
        type: string
        nullable: true
        comment: BLS period identifier (M01-M12 monthly, M13 annual average)
        source: period
      - name: periodName
        type: string
        nullable: true
        comment: Human-readable period name derived from period
        expression: "CASE period WHEN 'M01' THEN 'January' WHEN 'M02' THEN 'February' WHEN 'M03' THEN 'March' WHEN 'M04' THEN 'April' WHEN 'M05' THEN 'May' WHEN 'M06' THEN 'June' WHEN 'M07' THEN 'July' WHEN 'M08' THEN 'August' WHEN 'M09' THEN 'September' WHEN 'M10' THEN 'October' WHEN 'M11' THEN 'November' WHEN 'M12' THEN 'December' WHEN 'M13' THEN 'Annual' ELSE period END"
      - name: value
        type: double
        nullable: true
        comment: Employment in thousands
        source: value
      - name: footnotes
        type: string
        nullable: true
        comment: BLS footnote codes for the data point
        source: footnote_codes

    # Bulk flat-file source — replaces api.bls.gov (registered keys cap at ~500 requests/day; a full
    # multi-year backfill of state_industry + metro_industry alone exceeds that and truncates older
    # years). Same sm.data.1.AllData TSV as state_industry; this rowFilter selects the 27 published
    # metropolitan areas instead of the statewide rollup. No key, no daily limit (as the jolts_* tables).
    source:
      type: http
      url: "https://download.bls.gov/pub/time.series/sm/sm.data.1.AllData"
      method: GET
      headers:
        # download.bls.gov 403s fake-browser User-Agents; requires a self-identifying UA
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      response:
        format: tsv
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true
      # 27 major metros x 22 supersectors: SMU (unadjusted), area at series_id positions 6-10 (the
