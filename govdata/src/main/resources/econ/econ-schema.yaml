    primaryKey:
      - geo_fips
      - table_name
      - line_code
      - year
    foreignKeys:
      - columns:
          - table_name
          - line_code
        targetSchema: "${ECON_REFERENCE_SCHEMA_NAME:econ_reference}"
        targetTable: regional_linecodes
        targetColumns:
          - tablename
          - LineCode
        comment: Links BEA quarterly income data to line code descriptions
      - columns:
          - geo_fips
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: states
        targetColumns:
          - state_fips
        comment: Links quarterly income to geographic and demographic data (when geo_fips is state-level)

  quarterly_gdp:
    primaryKey:
      - geo_fips
      - table_name
      - line_code
      - year
    foreignKeys:
      - columns:
          - table_name
          - line_code
        targetSchema: "${ECON_REFERENCE_SCHEMA_NAME:econ_reference}"
        targetTable: regional_linecodes
        targetColumns:
          - tablename
          - LineCode
        comment: Links BEA quarterly GDP data to line code descriptions
      - columns:
          - geo_fips
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: states
        targetColumns:
          - state_fips
        comment: Links quarterly GDP to geographic and demographic data (when geo_fips is state-level)

  state_consumption:
    primaryKey:
      - geo_fips
      - table_name
      - line_code
      - year
    foreignKeys:
      - columns:
          - table_name
          - line_code
        targetSchema: "${ECON_REFERENCE_SCHEMA_NAME:econ_reference}"
        targetTable: regional_linecodes
        targetColumns:
          - tablename
          - LineCode
        comment: Links BEA consumption data to line code descriptions
      - columns:
          - geo_fips
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: states
        targetColumns:
          - state_fips
        comment: Links state consumption to geographic and demographic data (when geo_fips is state-level)

  trade_statistics:
    primaryKey:
      - type
      - frequency
      - year

  ita_data:
    primaryKey:
      - type
      - frequency
      - year

  industry_gdp:
    primaryKey:
