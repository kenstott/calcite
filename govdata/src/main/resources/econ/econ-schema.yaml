    lookbackPeriods: 6
    freshness:
      type: hash
    pattern: "type=industry_gdp/frequency=*/year=*/industry=*/industry_gdp.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2025
      distinctYears: 18
      contiguous: true
      rowCount: 57804
      checkedAt: "2026-09-05T14:44:23Z"
    dimensions:
      type:
        - industry_gdp
      frequency:
        - "A"  # Annual
        - "Q"  # Quarterly
      # BEA GDPbyIndustry summary level. Previously only 31G/52/53/54/GSLG were loaded, which
      # forced any question outside those five to be answered with a wrong-scale proxy or left
      # the warehouse entirely -- a 2026-08-17 analysis had to stand in all-Manufacturing (31G)
      # for both pharmaceuticals and semiconductors, tying two independent observations to one
      # identical number, and go to BLS/USDA for agriculture, mining and information.
      industry:
        - "11"     # Agriculture, forestry, fishing, and hunting
        - "21"     # Mining, quarrying, and oil and gas extraction
        - "22"     # Utilities
        - "23"     # Construction
        - "31G"    # Manufacturing
        - "42"     # Wholesale trade
        - "44RT"   # Retail trade
        - "48TW"   # Transportation and warehousing
        - "51"     # Information
        - "52"     # Finance and insurance
        - "53"     # Real estate and rental and leasing
        - "54"     # Professional, scientific, and technical services
        - "55"     # Management of companies and enterprises
        - "56"     # Administrative and waste management services
        - "61"     # Educational services
        - "62"     # Health care and social assistance
        - "71"     # Arts, entertainment, and recreation
        - "72"     # Accommodation and food services
        - "81"     # Other services, except government
        - "GFG"    # Federal general government
        - "GFE"    # Federal government enterprises
        - "GSLG"   # State and local general government
      year:
        type: yearRange
        start: "{env:GOVDATA_START_YEAR:2000}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        # BEA GDP-by-industry publishes the current year in arrears (tracker frontier = 2025;
        # 2026 not yet released). Request param Year already uses {effective_year}, so a 1-year
        # lag caps the request at the latest published vintage instead of fetching an empty 2026.
        dataLag: 1
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: frequency
          type: VARCHAR
        - name: year
          type: INTEGER
        - name: industry
          type: VARCHAR
    comment: >
      GDP by industry from the BEA GDPbyIndustry dataset, national, annual and quarterly, across
      the 22 BEA summary industry groups (11 agriculture through 81 other services, plus GFG/GFE/
      GSLG government). TableID=ALL is requested, so all 39 BEA tables land here and table_id
      selects the measure: 1 value added in millions of dollars, 5 value added as a percent of
      GDP, 6 components of value added, 7 those components as a percent of value added, 8 and 11
      chain-type quantity and price indexes, 10 real value added. Units are a property of
      table_id, not of the row — the units column is always null because GDPbyIndustry returns no
      per-row unit.

      On the component tables (6 and 7) industry_description carries the COMPONENT name rather
      than the industry name: 'Gross operating surplus', 'Compensation of employees', 'Taxes on
      production and imports less subsidies', plus one row named for the industry that totals to
      100 percent (table 7) or to total value added (table 6). Gross operating surplus is BEA's
      profit measure, so table 7 gives an industry profit margin directly — filter
      industry_description = 'Gross operating surplus' and read value as percent of value added.
      Use industry_code to pick the industry on those tables, not industry_description.
    columns:
