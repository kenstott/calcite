      - name: series
        type: string
        nullable: true
        comment: >
          BLS series identifier, format CUUR{area}SA0 — the embedded 4 characters are the BLS CPI
          area code. Filter on series: BlsResponseTransformer emits only series, year, period,
          periodName, value, latest and footnotes, so the area_code and area_name columns are not
