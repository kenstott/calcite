  # NPS UNITS — National Park Service unit boundaries (static reference)
  # ---------------------------------------------------------------------------
  - name: nps_units
    pattern: "type=nps_units/*.parquet"
    partitions: *static_partitions
    comment: >
      National Park Service unit boundaries — parks, monuments, recreation areas,
      seashores, parkways, and all other NPS-designated units. ~430 units. Reference
      and dimension table; FK target for nps_visitation.unit_code. Joins to geo.states
      and geo.counties for gateway-community economic impact analysis. Updated annually
      in April following annual report administrative updates.

    dimensions:
      type:
        - nps_units

    columns:
      - name: unit_code
        type: string
        nullable: false
        comment: NPS 4-letter unit code (e.g., 'YOSE', 'GRCA')
      - name: unit_name
        type: string
        nullable: true
        comment: Full unit name
      - name: unit_type
        type: string
        nullable: true
        comment: National Parks / Monuments / Recreation Areas / Seashores / etc.
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-character state abbreviation (e.g., 'CA', 'WY')
      - name: region
        type: string
        nullable: true
        comment: NPS region (e.g., 'Pacific West', 'Northeast')
      - name: gross_acres
        type: double
        nullable: true
        comment: >
          Approximate unit area in acres, derived from the ArcGIS Shape__Area attribute
          (always returned in the layer's Web Mercator storage SR regardless of outSR) with
          a cos(lat)^2 correction for Mercator's latitude-dependent area inflation, using the
          geometry's mean vertex latitude as the representative point.

    # NPS unit boundaries change rarely; the service returns a stable Last-Modified, so probe it
    # and skip re-ingest of this (non-period) table when the boundary set is unchanged.
    freshness:
      type: last_modified
    source:
      type: http
      url: "https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/NPS_Land_Resources_Division_Boundary_and_Tract_Data_Service/FeatureServer/2/query?where=1%3D1&outFields=UNIT_CODE%2CUNIT_NAME%2CUNIT_TYPE%2CSTATE%2CREGION%2CShape__Area&f=json&resultRecordCount=1000"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.lands.NpsUnitBoundaryTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=nps_units/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/lands"
        tableName: nps_units
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        # Must stay >= 2. At 1 a partition holding a single sub-10MB file (the steady state for
        # these small reference tables) satisfies the threshold on every run, so compaction
        # rewrites it under a fresh compacted_<uuid> name indefinitely — new snapshot each pass,
        # superseded file orphaned for the retention window, and a new filename that defeats the
        # R2 sync's size+modtime skip so the same rows re-upload every time.
        compactionMinFiles: 5
        compactionTargetFileSizeBytes: 67108864
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # NPS VISITATION — NPS IRMA monthly visitation statistics
  # ---------------------------------------------------------------------------
  - name: nps_visitation
    # NPS visitation is preliminary until the calendar year is finalized in Q1 of the
    # following year, so the current AND prior year can both still change; 2 reopens exactly
    # that. https://www.nps.gov/subjects/socialscience/statistics-faq.htm
    lookbackPeriods: 2
    freshness:
      type: hash
    pattern: "type=nps_visitation/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      National Park Service monthly visitation statistics from the IRMA Statistics
      API. One row per unit_code × visit_year × visit_month (no annual summary
      rows), with recreation_visits and non_recreation_visits as the two visit-count
      metrics. Joins to nps_units via unit_code. See lands_nps_gateway_impact and
      lands_nps_gateway_employment for pre-built annual aggregations per unit; note
      nps_units carries no county_fips, so county-level employment correlation is
      not directly supported.

    dimensions:
      type:
        - nps_visitation
      year: *nps_visit_year_range

    columns:
      - name: unit_code
        type: string
        nullable: false
        comment: FK to nps_units (NPS 4-letter code)
      - name: visit_year
        type: integer
        nullable: false
        comment: Visit year (partition key)
      - name: visit_month
        type: integer
        nullable: false
        comment: Month (1–12); all rows are monthly (no annual summary rows)
      - name: recreation_visits
        type: integer
        nullable: true
        comment: Recreational visitor count
      - name: non_recreation_visits
        type: integer
        nullable: true
        comment: Non-recreational visits (commuters, government, etc.)

    source:
      type: http
      url: "https://irmaservices.nps.gov/Stats/v1/visitation?startMonth=1&startYear={year}&endMonth=12&endYear={year}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.lands.NpsIrmaTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=nps_visitation/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/lands"
        tableName: nps_visitation
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]

  # ---------------------------------------------------------------------------
  # BLM FIELD OFFICES — BLM administrative unit boundaries (static reference)
  # ---------------------------------------------------------------------------
  - name: blm_field_offices
    pattern: "type=blm_field_offices/*.parquet"
    partitions: *static_partitions
    comment: >
      Bureau of Land Management administrative unit boundaries — field offices and
      district offices that manage federal subsurface mineral rights, grazing
      allotments, and surface use permits. ~150 field offices. Primarily useful as
      a geographic reference for joining extractive industry activity to SEC filings
      and FEC oil/gas sector donor geography. Updated annually in June.

    dimensions:
      type:
        - blm_field_offices
      year: *lands_year_range

    columns:
      - name: office_code
        type: string
        nullable: false
        comment: BLM administrative unit code (e.g., 'UTMO')
      - name: office_name
        type: string
        nullable: true
        comment: Office name (e.g., 'Moab Field Office')
      - name: office_type
        type: string
        nullable: true
        comment: Field Office / District Office / State Office
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-character state abbreviation (e.g., 'UT', 'WY')

    source:
      type: http
      url: "https://gis.blm.gov/arcgis/rest/services/admin_boundaries/BLM_Natl_AdminUnit_Generalized/FeatureServer/0/query?where=1%3D1&outFields=ADM_UNIT_CD%2CADMU_NAME%2CBLM_ORG_TYPE%2CADMIN_ST&f=json&resultRecordCount=500"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.lands.BlmFieldOfficeTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=blm_field_offices/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/lands"
        tableName: blm_field_offices
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        # Must stay >= 2. At 1 a partition holding a single sub-10MB file (the steady state for
        # these small reference tables) satisfies the threshold on every run, so compaction
        # rewrites it under a fresh compacted_<uuid> name indefinitely — new snapshot each pass,
        # superseded file orphaned for the retention window, and a new filename that defeats the
        # R2 sync's size+modtime skip so the same rows re-upload every time.
        compactionMinFiles: 5
        compactionTargetFileSizeBytes: 67108864
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # ONRR REVENUES — ONRR federal/tribal mineral royalties (bulk annual CSV)
  # ---------------------------------------------------------------------------
  - name: onrr_revenues
    pattern: "type=onrr_revenues/*.parquet"
    partitions: *static_partitions
    comment: >
      Office of Natural Resources Revenue (ONRR) royalty payments for oil, gas, coal,
      and other minerals extracted from federal and tribal lands, full history from
      FY 2004 in a single bulk download. Row grain is every descriptive column together
      (fiscal_year, land_class, land_category, state_name, county_name, county_fips,
      offshore_region, revenue_type, mineral_lease_type, commodity, product) — revenue
      is the only measure. county_fips alone does not identify a row: ONRR carries
      multiple distinct rows sharing one FIPS (e.g. "Kenai (Pre)" vs "Kenai (Post)"
      county_name), and offshore rows (null state_name/county_name/county_fips) are
      distinguished by offshore_region instead. Primary financial link between
      BLM-managed subsurface rights and SEC 10-K disclosures for E&P and mining
      companies. Source: revenuedata.onrr.gov (domain moved from revenuedata.doi.gov
      in 2024).

    dimensions:
      type:
        - onrr_revenues

    columns:
      - name: fiscal_year
        source: "Fiscal Year"
        type: integer
        nullable: false
        comment: Fiscal year of revenue collection (FY 2004–present)
      - name: land_class
        source: "Land Class"
        type: string
        nullable: true
        comment: Federal / Native American / Federal Offshore
      - name: land_category
        source: "Land Category"
        type: string
        nullable: true
        comment: Onshore / Offshore / Gulf of Mexico / Pacific
      - name: state_name
        source: "State"
        type: string
        nullable: true
        comment: State name (e.g., 'Wyoming'); null for offshore rows
      - name: county_name
        source: "County"
        type: string
        nullable: true
        comment: County name; null for offshore/tribal rows
      - <<: *county_fips_column
        source: "FIPS Code"
        comment: 5-digit FIPS (null for offshore/tribal)
      - name: offshore_region
        source: "Offshore Region"
        type: string
        nullable: true
        comment: Offshore region name (Gulf of Mexico, Pacific, etc.); null for onshore
      - name: revenue_type
        source: "Revenue Type"
        type: string
        nullable: true
        comment: Royalties / Bonus / Rents / Other Revenues
      - name: mineral_lease_type
        source: "Mineral Lease Type"
        type: string
        nullable: true
        comment: Oil & Gas / Coal / Geothermal / Hardrock / etc.
      - name: commodity
        type: string
        nullable: true
        comment: Oil / Gas / Coal / Geothermal / Renewables / Other
      - name: product
        type: string
        nullable: true
        comment: Specific product (e.g., 'Crude Oil', 'Coalbed Methane')
      - name: revenue
        type: double
        nullable: true
        comment: Revenue collected (USD)

    # ONRR republishes the full fiscal-year revenue CSV on data updates. Probe Last-Modified and
    # skip re-ingest of this (non-period) table when the file is unchanged since the last commit.
    freshness:
      type: last_modified
    source:
      type: http
      url: "https://revenuedata.onrr.gov/downloads/fiscal_year_revenue.csv"
      method: GET
      response:
        format: csv
        hasHeader: true
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=onrr_revenues/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/lands"
        tableName: onrr_revenues
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3

  # ---------------------------------------------------------------------------
  # PILT COUNTY PAYMENTS — DOI Payments in Lieu of Taxes (per-state, per-year HTML)
  # ---------------------------------------------------------------------------
  - name: pilt_county_payments
    # Freshness gate: pilt.doi.gov has no Last-Modified/ETag on the per-state HTML page, so
    # this hashes the response body post-fetch to skip the materialize/commit when unchanged.
    freshness:
      type: hash
    pattern: "type=pilt_county_payments/year=*/state=*/*.parquet"
    partitions: *state_partitions
    comment: >
      DOI Payments in Lieu of Taxes (PILT) — federal payments to local governments for
      tax-exempt federal land within their boundaries, one row per (fiscal_year,
      state_code, area_name). Counterpart to onrr_revenues (federal mineral-revenue
      sharing): PILT compensates for the property-tax base federal land removes,
      independent of resource extraction. area_type is derived from the source
      label's own COUNTY/PARISH/BOROUGH/TOWN/... wording (null when the label
      carries none, e.g. DC/Guam/the Virgin Islands, each a single territory-wide
      row) rather than assumed from the state, since some states mix area types
      (Vermont's table has both towns and county-level subtotal rows). No bulk
      export exists; one fetch per (fiscal_yr, state_code) returns that state's
      full county list. Source: pilt.doi.gov/counties.cfm.

    dimensions:
      type:
        - pilt_county_payments
      year: *pilt_year_range
      state_code: *pilt_states

    columns:
      - name: fiscal_year
        type: integer
        nullable: false
        comment: Federal fiscal year of the payment (FY1999-present; PK component)
      - name: state_code
        type: string
        nullable: false
        comment: USPS state/territory code fetched (PK component)
      - name: area_name
        type: string
        nullable: false
        comment: County/parish/borough/town/territory label as published (PK component)
      - name: area_type
        type: string
        nullable: true
        comment: COUNTY/PARISH/BOROUGH/TOWN/CITY/... parsed from area_name; null when unrecognized
      - name: payment_dollars
        type: bigint
        nullable: true
        comment: PILT payment for the area (USD)
      - name: total_acres
        type: bigint
        nullable: true
        comment: Total federal acres in the area used to compute the payment

    source:
      type: http
      url: "https://pilt.doi.gov/counties.cfm?fiscal_yr={year}&state_code={state_code}"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.lands.PiltCountyPaymentsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=pilt_county_payments/year=*/state=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/lands"
        tableName: pilt_county_payments
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # VA FACILITIES - Veterans Health Administration facility roster (HIFLD)
  # ---------------------------------------------------------------------------
  - name: va_facilities
    # VA's own facility-locator API (api.va.gov) requires a key with no
    # self-service registration path; this is the keyless alternative. HIFLD
    # (Homeland Infrastructure Foundation-Level Data) republishes the VHA
    # facility roster as a public ArcGIS FeatureServer, confirmed live 25 Aug
    # 2026 (1,046 features, real Last-Modified/ETag headers). NOTE: the
    # FeatureServer is hosted under an individual ArcGIS account, not an
    # official HIFLD/VA org account — a common re-mirror pattern for public-
    # domain federal data on ArcGIS Hub, but less durable than a first-party
    # source; re-verify this URL if the layer ever 404s.
    freshness:
      type: last_modified
    pattern: "type=va_facilities/*.parquet"
    partitions: *static_partitions
    comment: >
      Veterans Health Administration facility roster — VA medical centers
      (VAMC), community-based outpatient clinics (CBOC), Vet Centers (VCTR),
      VA nursing homes (VANH), and residential rehabilitation treatment
      programs (RRTP), geocoded. One row per facility (1,046 confirmed live).
      Answers "nearest VA facility to a given location" directly via
      latitude/longitude — the corpus previously had no way to do this,
      only a rurality proxy via census.acs_veterans joined to
      health.ahrf_physician_supply's RUCC. Joins to geo.counties via
      county_fips and geo.states via state_abbr. Source: HIFLD Veterans
      Health Administration Medical Facilities ArcGIS FeatureServer.

    dimensions:
      type:
        - va_facilities

    columns:
      - name: station_number
        type: string
        nullable: false
        comment: VA station number (PK)
      - name: facility_name
        type: string
        nullable: true
        comment: Facility name
      - name: street_address
        type: string
        nullable: true
        comment: Street address (line 1)
      - name: street_address2
        type: string
        nullable: true
        comment: Street address line 2 (suite/building), when present
      - name: city
        type: string
        nullable: true
        comment: City
      - <<: *state_fips_column
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-character USPS state abbreviation (FK to geo.state_ref.state_abbr)
      - name: zip
        type: string
        nullable: true
        comment: ZIP code
      - name: county_name
        type: string
        nullable: true
        comment: County name, as published by HIFLD
      - <<: *county_fips_column
      - name: latitude
        type: double
        nullable: true
        comment: Facility latitude
      - name: longitude
        type: double
        nullable: true
        comment: Facility longitude
      - name: facility_type
        type: string
        nullable: true
        comment: >
          HIFLD's primary-service classification (PRIM_SVC): VAMC (medical
          center), CBOC (community-based outpatient clinic), VCTR (Vet
          Center), VANH (VA nursing home), RRTP (residential rehabilitation
          treatment program), or IOC (independent/other outpatient clinic —
          HIFLD's own category; does not always align with the source's
          per-type Y/N flags, e.g. a facility marked RRTP=YES can still carry
          PRIM_SVC=IOC as its primary classification). Use this column, not a
          derived flag, to classify a facility.
      - name: naics_code
        type: string
        nullable: true
        comment: NAICS industry code
      - name: naics_description
        type: string
        nullable: true
        comment: NAICS industry description
      - name: visn
        type: string
        nullable: true
        comment: Veterans Integrated Service Network number
      - name: congressional_district
        type: string
        nullable: true
        comment: 115th Congress congressional district code (e.g. 'CD115_AZ_0404')
      - name: phone
        type: string
        nullable: true
        comment: Facility phone number

    source:
      type: http
      url: "https://services2.arcgis.com/PYn6bWCjT6bhw1z3/arcgis/rest/services/HIFLD_Veterans_Health_Administration_Medical_Facilities/FeatureServer/0/query?where=1%3D1&outFields=NAME,ADDRESS,ADDRESS2,CITY,STATE,ZIP,COUNTY,FIPS,LATITUDE,LONGITUDE,NAICSCODE,NAICSDESCR,VISN,STA_NO,PHONE,CD115,PRIM_SVC&returnGeometry=false&f=json&resultRecordCount=2000"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.lands.VaFacilitiesTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=va_facilities/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/lands"
        tableName: va_facilities
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        # Must stay >= 2 -- see the nps_units comment above on why a small
        # reference table pins this below the default.
        compactionMinFiles: 5
        overwritePartitions: true

