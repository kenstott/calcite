  timber_sales:
    primaryKey: [facts_id]
    foreignKeys:
      - columns: [forest_code]
        targetTable: national_forests
        targetColumns: [forest_id]
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  forest_inventory:
    primaryKey: [state_fips, inventory_year, forest_type_group, ownership_class]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]

  forest_metrics:
    primaryKey: [state_fips, inventory_year, forest_type_group, ownership_class]
