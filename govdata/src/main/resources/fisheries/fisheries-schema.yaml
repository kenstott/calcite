        nullable: false
        comment: In-River (natural spawning areas) or Hatchery
      - name: state_abbr
        type: string
        nullable: false
        comment: Always CA; join to geo.state_ref
      - name: count_year
        type: integer
        nullable: false
        comment: End year of the monitoring period (return year)
      - name: escapement
        type: bigint
        nullable: false
        comment: Estimated adult Chinook returning (escapement) for the run, origin and year, Sacramento River system
      - name: is_preliminary
        type: boolean
        nullable: false
        comment: true when CDFW marks the year's estimate as preliminary (not final)
      - name: rolling_3yr_geomean
        type: bigint
        nullable: true
        comment: 3-year rolling geometric mean of escapement as SacPAS computes it (this and the two previous years); null when SacPAS leaves it blank because an estimate is missing

    source:
      type: http
      url: "https://www.cbr.washington.edu/sacramento/data/php/rpt/grandtab_graph.php?outputFormat=csv&species=Chinook:{run}&type={origin}&locType=location&location=SacPAS%20Sacramento%20River%20System:All:All&rolling=1"
