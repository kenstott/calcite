      checkedAt: "2026-10-17T14:00:00Z"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
        - name: project
          type: VARCHAR
    comment: >
      Annual adult fish passage counts at Columbia basin dams and fishways (Columbia Basin
      Research DART, from USACE and public utility district counts): Chinook, Jack Chinook,
      Steelhead, Wild Steelhead, Sockeye, Coho, Jack Coho, Chum, Pink, plus Shad, Lamprey
      and Bull Trout, one row per project x year x species. 17 projects on the Columbia,
      Snake, Yakima, Wenatchee and Willamette rivers; Bonneville back to 1938. This is the
      closest keyless run-size signal for WA and OR salmon (Bonneville is the first dam up the
      Columbia, so its Chinook/Steelhead/Sockeye counts approximate the total Columbia
      return); it is a passage count at a dam, not a per-stock escapement estimate. Adults
      counted at Lower Granite and the other Snake dams are headed to Idaho spawning grounds
      but the dams are in Washington, so state_abbrs gives the dam's location, and
      spans_states = true marks Columbia dams on the WA/OR border (BON, TDA, JDA, MCN): do not
      add those to a by-state sum. Counts are not additive across dams in the same river
      (the same fish is counted at each). Hatchery fish are included except where the species
      column says Wild.

