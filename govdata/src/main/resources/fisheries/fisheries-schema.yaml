  # ---------------------------------------------------------------------------
  # STOCK_SMART_ASSESSMENTS — NOAA Stock SMART assessment reference points by stock
  # ---------------------------------------------------------------------------
  - name: stock_smart_assessments
    timeColumn: assessment_year  # observation time; this table has no column named 'year'
    freshness:
      type: hash
    pattern: "type=stock_smart_assessments/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1993
      maxYear: 2026
      distinctYears: 28
      contiguous: false
      years: [1993, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
      rowCount: 3542
      checkedAt: "2026-10-17T14:00:00Z"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
    comment: >
      NOAA Fisheries Stock SMART assessment summaries for federally managed stocks: one row
      per stock assessment (about 3,500 assessments of ~430 stocks, assessment years 2005 to
      the latest), carrying the assessment's fishing mortality and biomass against the MSY
      reference points. f_fmsy_ratio above 1 means the assessed fishing rate exceeded Fmsy;
      b_bmsy_ratio below 1 means biomass was below Bmsy. A stock has several rows, one per
      assessment_year, so for current condition take each stock_id's latest assessment_year
      (or latest assessment_id); do not average across assessments. f_fmsy_ratio and
      b_bmsy_ratio are null where the assessment did not report an MSY proxy (many index-based
      and data-limited stocks), and f_unit / b_unit say what estimated_f and estimated_b are
      measured in (they are not comparable across stocks). is_fssi marks the Fish Stock
      Sustainability Index stocks. This is NOT the official Status of Stocks determination:
      NOAA publishes the overfished and overfishing flags only in PDF report tables, and they
      use per-stock thresholds (MSST, MFMT) that this table does not carry, so those flags are
      not here and must not be inferred from the ratios. Joins to noaa_commercial_landings on
      tsn (ITIS taxonomic serial number; null for some complexes) or scientific_name. Stocks
      span waters, not states: stock_area names the area (e.g. 'Gulf of Maine / Georges
      Bank') and jurisdiction the managing council or commission, so there is no state_abbr
      and a by-state rollup would double count; use region_name from the landings table to
      relate areas.

    dimensions:
      type:
        - stock_smart_assessments

    columns:
      - name: stock_id
        type: long
        nullable: false
        comment: Stock SMART stock identifier
      - name: stock_name
        type: string
        nullable: false
        comment: Stock name with its area, e.g. 'Acadian redfish - Gulf of Maine / Georges Bank'
      - name: jurisdiction
        type: string
        nullable: true
        comment: Managing council or commission (e.g. NEFMC, PFMC, ASMFC, Atlantic HMS)
      - name: fmp
        type: string
        nullable: true
        comment: Fishery management plan the stock falls under
      - name: science_center
        type: string
        nullable: true
        comment: NOAA Fisheries Science Center that assesses the stock (may list several, '/'-separated)
      - name: regional_ecosystem
        type: string
        nullable: true
        comment: NOAA regional ecosystem of the stock (may list several, '/'-separated)
      - name: is_fssi
        type: boolean
        nullable: false
        comment: true when the stock is part of the Fish Stock Sustainability Index
      - name: tsn
        type: long
        nullable: true
        comment: ITIS taxonomic serial number of the species; null for multi-species complexes. Joins to noaa_commercial_landings.tsn
      - name: scientific_name
        type: string
        nullable: true
        comment: Scientific name; null or a genus/group for complexes
      - name: common_name
        type: string
        nullable: true
        comment: Common name of the species or complex
      - name: stock_area
        type: string
        nullable: true
        comment: Geographic area of the stock (e.g. 'Gulf of Maine / Georges Bank', 'Bering Sea / Aleutian Islands')
      - name: assessment_id
        type: long
        nullable: false
        comment: Stock SMART assessment identifier; unique per row
      - name: assessment_year
        type: integer
        nullable: false
        comment: Year the assessment was completed
      - name: assessment_month
        type: integer
        nullable: true
        comment: Month the assessment was completed (1-12)
      - name: last_data_year
        type: integer
        nullable: true
        comment: Last year of data used in the assessment
      - name: update_type
        type: string
        nullable: true
        comment: Assessment type (e.g. Benchmark, Full Update, Operational); null where the source leaves it blank
      - name: review_result
        type: string
        nullable: true
        comment: Peer review outcome (e.g. Full acceptance)
      - name: assessment_model
        type: string
        nullable: true
        comment: Stock assessment model used (e.g. BAM, SS3, ASAP)
      - name: f_year
        type: integer
        nullable: true
        comment: Year the estimated fishing mortality refers to
      - name: estimated_f
        type: double
        nullable: true
        comment: Estimated fishing mortality in f_unit
      - name: f_unit
        type: string
        nullable: true
        comment: What estimated_f measures (e.g. Average F, Fully-selected F, Apical F, Exploitation rate)
      - name: fmsy
        type: double
        nullable: true
        comment: Fishing mortality reference point at maximum sustainable yield, in f_unit
      - name: f_fmsy_ratio
        type: double
        nullable: true
        comment: Estimated F divided by Fmsy; above 1 means the fishing rate exceeded the MSY level
      - name: b_year
        type: integer
        nullable: true
        comment: Year the estimated biomass refers to
      - name: estimated_b
        type: double
        nullable: true
        comment: Estimated stock biomass (or abundance) in b_unit
      - name: b_unit
        type: string
        nullable: true
        comment: What estimated_b measures and its unit (e.g. Metric Tons, Billion Eggs)
      - name: bmsy
        type: double
        nullable: true
        comment: Biomass reference point at maximum sustainable yield, in b_unit
      - name: b_bmsy_ratio
        type: double
        nullable: true
        comment: Estimated B divided by Bmsy; below 1 means biomass was under the MSY level
      - name: msy
        type: double
        nullable: true
        comment: Maximum sustainable yield estimate, in msy_unit
      - name: msy_unit
        type: string
        nullable: true
        comment: Unit of msy; null where the source leaves it blank

    source:
      type: http
      # The searchEntities call is only the stock list; FisheriesStockSmartTransformer takes the
      # ids from it and downloads the Assessment Summary xlsx from data-export-servlet itself.
      # The jsonParam is URL-encoded inline: its literal braces would otherwise be read as
      # {variable} placeholders.
      url: "https://apps-st.fisheries.noaa.gov/stocksmart/sis_servlet?jsonParam=%7B%22method%22%3A%22searchEntities%22%2C%22entName%22%3A%22%25%22%2C%22scId%22%3A%22%25%22%2C%22jurId%22%3A%22%25%22%2C%22fmpId%22%3A%22%25%22%2C%22ecoId%22%3A%22%25%22%7D"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 503, 504]
        maxRetries: 5
      # The transformer needs the live stock-list envelope, not a replay of post-transform rows.
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.fisheries.FisheriesStockSmartTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=stock_smart_assessments/"
      partition:
        columns: [type]
      iceberg:
        <<: *iceberg_common
        tableName: stock_smart_assessments
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # WDFW_SALMONID_ESCAPEMENT — Washington stock-level spawner / escapement series
  # ---------------------------------------------------------------------------
  - name: wdfw_salmonid_escapement
    freshness:
      type: hash
    pattern: "type=wdfw_salmonid_escapement/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
    comment: >
      Washington Department of Fish and Wildlife Salmonid Population Indicators (SPI, the
      SCoRE / State of Our Salmon data): annual adult spawner and escapement estimates for
      wild and hatchery salmon, steelhead, bull trout and cutthroat stocks across Washington
      (Puget Sound, coast, Columbia basin), one row per stock x data series x year x data_type,
      1938 to the latest completed return year. Species are Chinook, Coho, Chum, Pink,
      Sockeye, Steelhead, Bull Trout and Cutthroat. abundance_qty is a count of fish (or redds
      where data_type is 'Spawner Redds'); data_type says what is counted (Spawner Fish,
      Escapement Fish, Spawner Redds, or the SPI codes NOSAEJ natural-origin spawners, HOSAEJ
      hatchery-origin spawners, TSAEJ total spawners; IJ variants include jacks, EJ exclude
      them), production_type is Natural / Hatchery / Composite and calculation_type is
      Expanded / Unexpanded. A stock can appear under several data_types and series, so filter
      to one data_type (and production_type) before summing or comparing years; do not add
      across data_types. The state is always WA (state_abbr); this is the stock-level
      counterpart to dart_adult_counts (dam passage) and adfg_fish_counts (Alaska). Years
      with no estimate are absent, not zero (zero-fish estimates are kept). The source itself
      repeats 13 stock x series x year x data_type keys with slightly different values.

    dimensions:
      type:
        - wdfw_salmonid_escapement

    columns:
      - name: stock_number
        type: bigint
        nullable: false
        comment: WDFW SPI stock identifier (e.g. 3273 Discovery Bay Coho)
      - name: population_name
        type: string
        nullable: false
        comment: Stock name including species, e.g. 'Skagit River Summer/Fall Chinook'
      - name: sub_population_name
        type: string
        nullable: true
        comment: Sub-population within the stock where the series is split; null when the stock is not subdivided
      - name: data_series_num
        type: bigint
        nullable: false
        comment: Series number within the stock; a stock may carry several series (methods or eras)
      - name: species
        type: string
        nullable: false
        comment: Chinook, Coho, Chum, Pink, Sockeye, Steelhead, Bull Trout or Cutthroat
      - name: year
        type: bigint
        nullable: false
        comment: Return / spawning year of the estimate
      - name: abundance_qty
        type: double
        nullable: false
        comment: Estimated count of fish (redds when data_type is 'Spawner Redds'); zero is a real estimate
      - name: data_type
        type: string
        nullable: false
        comment: What is counted - Spawner Fish, Escapement Fish, Spawner Redds, or SPI codes such as NOSAEJ, HOSAEJ, TSAEJ, NOSAIJ, HOSAIJ, TSAIJ, NOBroodStockRemoved
      - name: production_type
        type: string
        nullable: false
        comment: Natural, Hatchery, Composite, Unknown or NA - origin of the fish counted
      - name: calculation_type
        type: string
        nullable: false
        comment: Expanded (extrapolated from index surveys to the whole stock), Unexpanded, Unknown or NA
      - name: escapement_methodology
        type: string
        nullable: false
        comment: How the count was made, e.g. Trap Count, Total Natural Spawners, or the SPI data_type code
      - name: report_types
        type: string
        nullable: true
        comment: WDFW report the series feeds - SCoRE or 'SOS, SCoRE' (State of Our Salmon); null where WDFW lists no report (about 11% of rows)
      - name: last_update
        type: string
        nullable: true
        comment: Timestamp WDFW last updated the row (ISO 8601, no zone)
      - name: state_abbr
        type: string
        nullable: false
        comment: Always WA; joins to geo.state_ref

    source:
      type: http
      url: "https://data.wa.gov/resource/fgyz-n3uk.json?$select=stock_number,population_name,sub_population_name,data_series_num,species,year,abundance_qty,data_type,production_type,calculation_type,escapement_methodology,report_types,last_update&$order=stock_number,data_series_num,year,data_type&$limit=100000"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 503, 504]
        maxRetries: 5
      # The transformer drops estimate-less series rows, so a raw-cache replay of the
      # post-transform rows would not parse.
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.fisheries.FisheriesWdfwEscapementTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=wdfw_salmonid_escapement/"
      partition:
        columns: [type]
      iceberg:
        <<: *iceberg_common
        tableName: wdfw_salmonid_escapement
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # NOAA_FEUS_ECONOMIC_IMPACTS — jobs, sales, income, value added by state and sector
  # ---------------------------------------------------------------------------
  - name: noaa_feus_economic_impacts
    timeColumn: data_year  # observation year; this table has no column named 'year'
    freshness:
      type: hash
    pattern: "type=noaa_feus_economic_impacts/feus_file=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2020
      maxYear: 2021
      distinctYears: 2
      contiguous: true
      rowCount: 1652
      checkedAt: "2026-10-17T14:00:00Z"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
        - name: feus_file
          type: VARCHAR
    comment: >
      NOAA Fisheries Economics of the United States (FEUS): the economic footprint of fishing
      by state, one row per geography x sector x impact measure (x imports basis for the
      commercial industry). industry is commercial (the seafood industry: commercial
      harvesters, seafood processors and dealers, seafood wholesalers and distributors, retail
      and importers) or recreational (marine recreational fishing expenditures: for-hire,
      private boat and shore trips, plus durable-goods expenditures). impact_type is jobs
      (unit jobs), or sales, income or value_added (unit thousand_usd, thousands of dollars),
      all modelled economic impacts including multiplier effects rather than direct landings
      revenue: use noaa_commercial_landings for pounds and dollars landed. Commercial rows
      come in two bases, imports_basis with_imports (counts the importer sector and the
      activity it supports) and without_imports; the two must not be added together, and a
      recreational row has no imports_basis. row_level separates the components from the
      rollups so nothing is double counted: for a state, the component rows (sectors, or for
      recreational the three trip modes) sum to the total row (sector 'Total Impacts'
      commercial, 'Total State Economic Impacts' recreational) within rounding. Recreational
      durable-goods spending is published only for the United States, where the national total
      ('Total United States Economic Impacts') equals the trip modes plus durable_expenditures;
      state durable_expenditures values are confidential (null) and a state total excludes
      them. Sum the components or read the total, not both. Geography is 23
      coastal states plus the United States (geo_level national, state_abbr null); recreational
      reports East and West Florida separately and commercial reports Florida as a whole.
      noaa_region is the NOAA region of the state (null for the national rows and commercial
      Florida). impact_value is null where NOAA withholds a confidential value (about 22% of
      recreational rows, chiefly state durable expenditures). data_year is the
      year NOAA states for that geography (2021, except 2020 for commercial Florida); this is the latest-year
      snapshot published in the data tool, not a time series. Inland states and non-coastal
      territories are not covered. Join to geo.state_ref via state_abbr.

    dimensions:
      type:
        - noaa_feus_economic_impacts
      feus_file: *feus_files

    columns:
      - name: industry
        type: string
        nullable: false
        comment: commercial (seafood industry) or recreational (marine recreational fishing); never mix their jobs or dollars into one total, they overlap in the economy
      - name: geography
        type: string
        nullable: false
        comment: Geography as NOAA names it - a state, East Florida or West Florida (recreational only), or United States
      - name: geo_level
        type: string
        nullable: false
        comment: state or national
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-letter state code; East and West Florida are both FL; null for the national rows; joins to geo.state_ref
      - name: noaa_region
        type: string
        nullable: true
        comment: NOAA region of the state (North Pacific, Pacific, Western Pacific, Gulf of America, South Atlantic, Mid-Atlantic, New England); null for national rows and commercial Florida, which spans two regions
      - name: data_year
        type: integer
        nullable: false
        comment: Year of the estimates for this geography as stated in NOAA's table title (2021; 2020 for commercial Florida)
      - name: sector
        type: string
        nullable: false
        comment: Commercial - Commercial Harvesters, Seafood Processors & Dealers, Seafood Wholesalers & Distributors, Retail, Importers, Total Impacts; recreational - For-Hire, Private Boat, Shore, Total Durable Expenditures, Total State Economic Impacts, Total United States Economic Impacts
      - name: row_level
        type: string
        nullable: false
        comment: component (a sector or trip mode), total (the rollup of the components) or durable_expenditures (recreational equipment spending, published nationally only, part of the national total); add components or read the total, not both
      - name: impact_type
        type: string
        nullable: false
        comment: jobs, sales, income or value_added
      - name: unit
        type: string
        nullable: false
        comment: jobs for impact_type jobs, thousand_usd (thousands of dollars) for the other three
      - name: imports_basis
        type: string
        nullable: true
        comment: with_imports or without_imports for commercial rows (do not add the two); null for recreational rows
      - name: impact_value
        type: double
        nullable: true
        comment: Impact in jobs or thousands of dollars per unit; null where NOAA withholds a confidential value

    source:
      type: http
      url: "https://www.st.nmfs.noaa.gov/data-and-tools/FEUS/datatablesStrings_{feus_file}_03_27_25.js"
      method: GET
      response:
        format: TEXT   # the body is JavaScript, not JSON; FisheriesFeusImpactsTransformer emits the JSON rows
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 503, 504]
        maxRetries: 5
      # The response is JavaScript, not JSON, and FisheriesFeusImpactsTransformer reshapes it, so
      # a raw-cache replay of the post-transform rows would not parse.
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.fisheries.FisheriesFeusImpactsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=noaa_feus_economic_impacts/feus_file=*/"
      partition:
        columns: [type, feus_file]
      iceberg:
        <<: *iceberg_common
        tableName: noaa_feus_economic_impacts
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # RMIS_RELEASES — hatchery and wild salmon/steelhead release groups (RMIS)
  # ---------------------------------------------------------------------------
  - name: rmis_releases
    timeColumn: release_year  # observation time: the year the fish were released (1952-2026; 31 of 192,408 rows null); brood_year is the cohort spawn year, a median of one year earlier
    freshness:
      type: hash
    pattern: "type=rmis_releases/agency=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1952
      maxYear: 2026
      distinctYears: 75
      contiguous: true
      rowCount: 192408
      checkedAt: "2026-10-17T14:00:00Z"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
        - name: agency
          type: VARCHAR
    comment: >
      Hatchery and wild salmon, steelhead and trout release groups recorded in the Regional Mark
      Information System (RMIS, Regional Mark Processing Center / PSMFC, PSC format v5.0), one
      row per coded-wire-tag release group (tagged) or untagged release group, brood years 1950
      onward, about 190,000 records from 17 reporting agencies (WDFW, CDFO, ADFG, ODFW, NWIFC,
      USFWS, CDFW, IDFG, NMFS and tribes) across Alaska, British Columbia, Washington, Idaho,
      Oregon and California. Gives how many fish were released (total_released, cwt_tagged_count,
      non-CWT mark counts), species, brood year and release dates, release stage, rearing type,
      broodstock origin, average weight and length, and the release / hatchery / stock location
      codes (join to rmis_locations for site name, basin, region and coordinates). Use it to set
      hatchery stocking against the adult returns in dart_adult_counts, adfg_fish_counts,
      cdfw_grandtab_escapement and wdfw_salmonid_escapement. Counts are as submitted by each
      agency: tagged groups carry both tagged and untagged-fish counts, so total_released is the
      group size, not the CWT count alone. Canadian (CDFO, state_abbr BC) releases are included.
      Mark counts are null when the agency did not report them. RMPC refreshes the files as
      agencies submit validated data.

    dimensions:
      type:
        - rmis_releases
      agency: *rmis_agencies

    columns:
      - name: record_type
        type: string
        nullable: false
        comment: "tagged (coded-wire-tag release group, T record) or untagged (release group with marks only, N record)"
      - name: reporting_agency
        type: string
        nullable: false
        comment: "Agency that submitted the record to RMIS (WDFW, CDFO, ADFG, ODFW, NWIFC, USFWS, CDFW, IDFG, NMFS, tribes)"
      - name: release_agency
        type: string
        nullable: false
        comment: "Agency that made the release"
      - name: tag_code_or_release_id
        type: string
        nullable: false
        comment: "CWT tag code for tagged records, or the agency release identifier for untagged records"
      - name: species_code
        type: string
        nullable: false
        comment: "PSC species code 1-9"
      - name: species
        type: string
        nullable: false
        comment: "Chinook, Coho, Steelhead, Sockeye, Chum, Pink, Masu, Cutthroat or Atlantic Salmon"
      - name: run_code
        type: string
        nullable: true
        comment: "PSC run code as submitted (numeric code, see PSC format v5.0 run table); null when the agency left it blank"
      - name: brood_year
        type: integer
        nullable: true
        comment: "Brood year of the release group"
      - name: first_release_date
        type: date
        nullable: true
        comment: "First release date"
      - name: last_release_date
        type: date
        nullable: true
        comment: "Last release date"
      - name: release_year
        type: integer
        nullable: true
        comment: "Calendar year of last_release_date"
      - name: release_location_code
        type: string
        nullable: true
        comment: "RMIS release location code; join to rmis_locations.location_code for site name, basin and region"
      - name: hatchery_location_code
        type: string
        nullable: true
        comment: "RMIS location code of the rearing hatchery; join to rmis_locations.location_code"
      - name: stock_location_code
        type: string
        nullable: true
        comment: "RMIS location code of the stock of origin"
      - name: state_abbr
        type: string
        nullable: true
        comment: "State/province of the release location from the first character of its code: AK, BC, WA, ID, OR, CA, or HS for high-seas locations (BC is Canada and HS is not a state; neither joins to geo.state_ref); null when no release location. Join to geo.state_ref for US states"
      - name: release_stage_code
        type: string
        nullable: true
        comment: "PSC release stage letter as submitted"
      - name: release_stage
        type: string
        nullable: true
        comment: "Zygote, Emergent fry, Fed fry, Fingerling, Advanced fingerling, Yearling, Pre-smolt, Smolt, Adult or Multiple"
      - name: rearing_type
        type: string
        nullable: true
        comment: "Hatchery, Wild, Mixed or Unknown rearing method"
      - name: broodstock_origin_type
        type: string
        nullable: true
        comment: "PSC broodstock origin letter (H hatchery, W wild, M mixed, N natural, C captive, O other, U unknown)"
      - name: release_strategy
        type: string
        nullable: true
        comment: "FR forced, VO volitional, MX mixed, NP net pen, BG barge; null when not reported"
      - name: avg_weight_g
        type: double
        nullable: true
        comment: "Average weight at release in grams"
      - name: avg_length_mm
        type: double
        nullable: true
        comment: "Average fork length at release in millimeters"
      - name: cwt_1st_mark
        type: string
        nullable: true
        comment: "Mark code applied to the coded-wire-tagged fish (for example an adipose clip)"
      - name: cwt_tagged_count
        type: bigint
        nullable: true
        comment: "Number of fish released with a coded-wire tag (both CWT mark groups); null when not reported"
      - name: non_cwt_1st_mark
        type: string
        nullable: true
        comment: "Mark code of the first group of released fish without a CWT"
      - name: non_cwt_1st_mark_count
        type: bigint
        nullable: true
        comment: "Fish released without a CWT in the first mark group"
      - name: non_cwt_2nd_mark_count
        type: bigint
        nullable: true
        comment: "Fish released without a CWT in the second mark group (commonly the unmarked fish)"
      - name: total_released
        type: bigint
        nullable: true
        comment: "Sum of the reported CWT and non-CWT counts for the release group; null when none is reported"

    source:
      type: http
      url: "https://www.rmpc.org/pub/data/RL050_{agency}_FULLSET.csv"
      method: GET
      response:
        format: csv
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 503, 504]
        maxRetries: 5
      # The transformer reshapes the PSC-format CSV; a raw-cache replay would hand it the
      # post-transform rows instead.
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.fisheries.FisheriesRmisTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=rmis_releases/agency=*/"
      partition:
        columns: [type, agency]
      iceberg:
        <<: *iceberg_common
        tableName: rmis_releases
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

