  # ---------------------------------------------------------------------------
  # CDFW_GRANDTAB_ESCAPEMENT — California Central Valley Chinook escapement by run and origin
  # ---------------------------------------------------------------------------
  - name: cdfw_grandtab_escapement
    timeColumn: count_year  # observation time; this table has no column named 'year'
    freshness:
      type: hash
    pattern: "type=cdfw_grandtab_escapement/run=*/origin=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1952
      maxYear: 2025
      distinctYears: 74
      contiguous: true
      rowCount: 467
      checkedAt: "2026-10-17T14:00:00Z"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
        - name: run
          type: VARCHAR
        - name: origin
          type: VARCHAR
    comment: >
      California Department of Fish and Wildlife GrandTab adult Chinook salmon escapement for
      the Central Valley (Sacramento River system), served by SacPAS (Columbia Basin Research):
      annual escapement, i.e. adult fish that returned from the ocean to spawning areas or
      hatcheries, for the four runs (Winter, Spring, Fall, Late-Fall) split by origin
      (In-River natural spawning vs Hatchery), one row per run x origin x year with an estimate, 1952 onward (years with no estimate are absent, not zero).
      state_abbr is always CA. This is the California run-size series for Chinook; add
      In-River and Hatchery for a run total, and sum the four runs for the Central Valley total
      (the SacPAS 'All' selections are those sums and are not stored again). Values for the
      latest years are preliminary (is_preliminary = true) and are revised. Sacramento system
      only: San Joaquin tributaries and per-stream breakdowns are not in this table, and the
      Klamath and Smith basins are not covered by GrandTab. Estimates mix methods (carcass
      mark-recapture, video weirs, redd expansion, hatchery counts), so year-to-year jumps can
      partly reflect method changes.

    dimensions:
      type:
        - cdfw_grandtab_escapement
      run: *grandtab_runs
      origin: *grandtab_origins

