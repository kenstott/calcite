  # ---------------------------------------------------------------------------
  # ESA_SALMONID_LISTINGS — ESA status of salmon / steelhead ESUs and DPSs
  # ---------------------------------------------------------------------------
  - name: esa_salmonid_listings
    freshness:
      type: hash
    pattern: "type=esa_salmonid_listings/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
    comment: >
      Endangered Species Act status of every Pacific salmon, steelhead and Atlantic salmon
      listing entity from the U.S. Fish and Wildlife Service ECOS species report (NOAA
      Fisheries is the lead agency for these): one row per Evolutionarily Significant Unit
      (salmon) or Distinct Population Segment (steelhead, Atlantic salmon), covering Chinook,
      coho, chum, sockeye, pink, steelhead and Atlantic salmon. esa_status gives the
      designation (Threatened, Endangered, Experimental Population, Non-Essential, Under
      Review, Resolved Taxon, Status Undefined, Not Listed), status_category the listed / not
      listed / petitioned bucket, and listing_date, ECOS's listing date as published (blank for
      three of the four experimental populations, present on a few Resolved Taxon rows). Use it to read
      population trends against recovery status, e.g. which states have listed salmon:
      state_abbrs is the comma-separated states each ESU/DPS spans (ECOS has no state column,
      so this is derived from the ESU name; null where ECOS gives no geography). A snapshot of
      current status, not a history of listing changes. Pink salmon and landlocked sockeye
      (kokanee) have no listed units. Join to geo.state_ref by splitting state_abbrs.

    dimensions:
      type:
        - esa_salmonid_listings

    columns:
      - name: common_name
        type: string
        nullable: false
        comment: Common name in one canonical spelling per species - Chinook salmon, Coho salmon, Chum salmon, Sockeye salmon, Pink salmon, Steelhead (Rainbow Trout) or Atlantic salmon
      - name: scientific_name
        type: string
        nullable: false
        comment: Scientific name as ECOS records it, e.g. Oncorhynchus (=Salmo) tshawytscha
      - name: species_group
        type: string
        nullable: false
        comment: Normalised species - chinook, coho, chum, sockeye, pink, steelhead or atlantic; matches salmon_species in noaa_commercial_landings except steelhead
      - name: population_name
        type: string
        nullable: true
        comment: ESU or DPS name, e.g. Snake River spring/summer-run ESU, Puget Sound DPS; null where ECOS gives none
      - name: esa_status
        type: string
        nullable: false
        comment: ECOS ESA listing status, stored exactly as - Threatened, Endangered, 'Experimental Population, Non-Essential' (with the comma), Under Review, Resolved Taxon, Status Undefined or Not Listed
      - name: status_category
        type: string
        nullable: true
        comment: Listing status category - Listed, Not Listed or Petitioned for Listing, Under Review; rows whose esa_status is Not Listed carry Not Listed even where ECOS leaves the category blank
      - name: cfr_citation
        type: string
        nullable: true
        comment: 50 CFR section that lists the unit (223.102 threatened, 224.101 endangered); null where the entity name carries none
      - name: listing_date
        type: string
        nullable: true
        comment: Listing date exactly as ECOS publishes it (yyyy-MM-dd); null where ECOS has none, which includes three of the four experimental populations, while the Middle Columbia River steelhead experimental population and two Atlantic salmon Resolved Taxon rows carry a date
      - name: lead_agency
        type: string
        nullable: false
        comment: Federal agency responsible - NMFS, FWS or FWS and NMFS
      - name: state_abbrs
        type: string
        nullable: true
        comment: Comma-separated 2-letter states the ESU/DPS spans (e.g. 'ID,OR,WA' for Snake River units); derived from the ESU name; null where ECOS gives no geography

    source:
      type: http
      url: "https://ecos.fws.gov/ecp/pullreports/catalog/species/report/species/export?format=json&columns=%2Fspecies%40cn%2Csn%2Cstatus%2Cstatus_category%2Cdesc%2Clisting_date%2Cagency&filter=%2Fspecies%40sn%20like%20%27Oncorhynchus%25%27%20or%20%2Fspecies%40sn%20like%20%27Salmo%20salar%25%27&sort=%2Fspecies%40cn%20asc"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 503, 504]
        maxRetries: 5
      # FisheriesEsaListingsTransformer expects the ECOS envelope, so a raw-cache replay of the
      # post-transform rows would not parse.
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.fisheries.FisheriesEsaListingsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=esa_salmonid_listings/"
      partition:
