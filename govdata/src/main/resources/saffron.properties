# Calcite configuration read from the classpath (CalciteSystemProperty). A -D system property of
# the same name overrides it.
#
# Calcite types strings and literals as ISO-8859-1 unless told otherwise, and then refuses any
# literal outside it (curly quotes, em dashes, CJK). The warehouse text is Unicode.
calcite.default.charset=UTF-8
calcite.default.nationalcharset=UTF-8
calcite.default.collation.name=UTF-8$en_US
