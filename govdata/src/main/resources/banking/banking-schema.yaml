        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  cra_small_business_lending:
    # No natural single-column primary key — CRA aggregates carry rows at four
    # nested grains distinguished only by report_level and blanks in the geo
    # keys. The finest grain is (activity_year, state_fips, county_code,
    # census_tract, income_group_total) with report_level NULL; totals repeat
    # the same (year, state, county) with census_tract or income_group_total
    # blanked and report_level filled in — so a single-column PK is inappropriate.
    foreignKeys:
