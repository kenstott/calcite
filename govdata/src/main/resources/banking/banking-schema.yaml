  # ---------------------------------------------------------------------------
  # NCUA_BRANCH_LOCATIONS — federally-insured credit union branches (NCUA 5300 Call Report)
  # ---------------------------------------------------------------------------
  # The credit-union counterpart to `locations` (FDIC branches). NCUA publishes no REST
  # API for this — each quarter's "5300 Call Report Quarterly Data" bulk zip is fetched
  # whole and NcuaBranchLocationsTransformer streams just its "Credit Union Branch
  # Information.txt" member (comma-delimited, RFC4180-quoted). Quarterly since 2017-03
  # (2016-12 and earlier 404 under this URL pattern); skipOn:[404] covers any single
  # missing quarter without failing the whole fetch.
  - name: ncua_branch_locations
    # Freshness gate: NCUA serves a real Last-Modified header on each quarterly zip
    # (confirmed live). Use last_modified, not hash — a StreamingResponseTransformer
    # never materializes a raw response body to hash, so hash freshness can't gate here
    # and every run (including the historical sub-pass this daily+historical DQ split
    # always runs alongside daily) would re-fetch and re-write every cycle.
    freshness:
      type: last_modified
    pattern: "type=ncua_branch_locations/cycle=*/*.parquet"
    partitions: *cycle_partitions
    comment: >
      NCUA-insured credit union branch/office locations, one row per office per
      quarterly cycle — main-office flag, address, and ATM/drive-thru flags. Together
      with banking.locations (FDIC bank branches), a UNION ALL on (state_abbr,
      county_name) with a literal institution_type discriminant answers any
      bank-vs-credit-union comparison natively. Source: ncua.gov quarterly 5300 Call
      Report bulk zip, "Credit Union Branch Information.txt" member.

    dimensions:
      type:
        - ncua_branch_locations
      cycle:
        type: list
        values: ["2017-03", "2017-06", "2017-09", "2017-12", "2018-03", "2018-06",
                 "2018-09", "2018-12", "2019-03", "2019-06", "2019-09", "2019-12",
                 "2020-03", "2020-06", "2020-09", "2020-12", "2021-03", "2021-06",
                 "2021-09", "2021-12", "2022-03", "2022-06", "2022-09", "2022-12",
                 "2023-03", "2023-06", "2023-09", "2023-12", "2024-03", "2024-06",
                 "2024-09", "2024-12", "2025-03", "2025-06", "2025-09", "2025-12",
                 "2026-03"]

    columns:
      - name: cycle
        type: string
        nullable: false
        comment: "Report cycle, YYYY-MM (calendar quarter-end; partition column)"
      - name: cu_number
        type: long
        nullable: true
        comment: NCUA credit union charter number (join key across NCUA tables)
      - name: site_id
        type: long
        nullable: true
        comment: NCUA branch/site identifier
      - name: cu_name
        type: string
        nullable: true
        comment: Credit union name
      - name: site_name
        type: string
        nullable: true
        comment: Branch/site name
      - name: site_type_name
        type: string
        nullable: true
        comment: "Site type (e.g. Corporate Office, Branch)"
      - name: is_main_office
        type: boolean
        nullable: true
        comment: Whether this site is the credit union's main/corporate office
      - name: address
        type: string
        nullable: true
        comment: Street address
      - name: city
        type: string
        nullable: true
        comment: City
      - <<: *state_abbr_column
      - name: zip
        type: string
        nullable: true
        comment: ZIP code
      - name: county_name
        type: string
        nullable: true
        comment: County name (as reported by NCUA, not FIPS-coded)
      - name: country
        type: string
        nullable: true
        comment: Country
      - name: phone
        type: string
        nullable: true
        comment: Phone number
      - name: has_atm
        type: boolean
        nullable: true
        comment: Whether this site has an ATM
      - name: has_drive_thru
        type: boolean
        nullable: true
        comment: Whether this site has a drive-thru

    source:
      type: http
      url: "https://ncua.gov/files/publications/analysis/call-report-data-{cycle}.zip"
      method: GET
      response:
        format: json  # ignored: NcuaBranchLocationsTransformer streams the zip itself
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
        # A handful of early quarters under this naming convention 404 (NCUA's bulk-zip
        # URL pattern only reliably resolves from 2017-03 forward); skip rather than fail.
        skipOn: [404]
      # No rawCache: block — a StreamingResponseTransformer opens its own connection and
      # HttpSource returns before its rawCache path ever runs, so it would be a no-op here.

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.banking.NcuaBranchLocationsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=ncua_branch_locations/cycle=*/"
      partition:
        columns: [type, cycle]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/banking"
        tableName: ncua_branch_locations
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        batchPartitionColumns: [cycle]
        incrementalKeys: [cycle]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # CRA SMALL BUSINESS LENDING — FFIEC CRA Aggregate flat file A1-1
  # (Small Business Loans by County -- Originations)
  # ---------------------------------------------------------------------------
  - name: cra_small_business_lending
    pattern: "type=cra_small_business_lending/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Community Reinvestment Act aggregate small-business lending, from FFIEC's
      2024 Aggregate flat file table A1-1 ("Small Business Loans by County --
      Originations"). One record per (activity_year, state, county, msa_md,
      census_tract, income_group_total, report_level) reporting the number and
      dollar volume of small-business loans originated in that geography-and-
      income cell across all reporting institutions, broken out by loan-size
      bucket (<$100k, $100k-$250k, $250k-$1M) and separately for loans made to
      small businesses with gross annual revenues under $1M. Grain is set by
      report_level: NULL rows are the tract-x-income-group subtotals, '100'
      rows are the county-x-income-group totals, '200' rows are the county
      totals across all income groups, and '210' rows are the MSA/MD totals.
      Loan amounts arrive in thousands of USD from the source and are carried
      through unchanged. Joins to geo.counties via county_fips. Source:
      ffiec.gov/sites/default/files/data/cra/flat-files/{yy}exp_aggr.zip
      (one ZIP per activity year, extracting the cra{year}_Aggr_A11.dat
      fixed-width member; 145-char record layout parsed directly by
      CraSmallBusinessLendingTransformer — see that class for why this table
      cannot use the shared file/etl HTTP+FIXED_WIDTH path).

    dimensions:
      type:
        - cra_small_business_lending
      year: *cra_year_range

    # Column names/types here match CraSmallBusinessLendingTransformer's output map
    # keys directly (no `expression: 'src."..."'` indirection) — a
    # StreamingResponseTransformer's rows are the final row shape, same as
    # ncua_branch_locations above.
    columns:
      - name: activity_year
        type: integer
        nullable: true
        comment: CRA reporting (activity) year
      - name: state_fips
        type: string
        nullable: true
        comment: >
          2-digit state FIPS code with leading zero, or blank for totals across
          all states
      - name: county_code
        type: string
        nullable: true
        comment: >
          3-digit within-state county FIPS code (concat state_fips + this to
          get the 5-digit county_fips), or blank for totals across all counties
      - name: county_fips
        type: string
        nullable: true
        comment: >
          5-digit state+county FIPS derived from state_fips || county_code (FK
          to geo.counties.county_fips); NULL on total rows that span all
          counties in a state or MSA
      - name: msa_md
        type: string
        nullable: true
        comment: >
          5-digit MSA/MD code as defined by OMB (right-justified with leading
          zeros), or 'NA' for tracts outside any MSA/MD
      - name: census_tract
        type: string
        nullable: true
        comment: >
          Census tract number as reported by the Census Bureau (e.g. '0301.01'),
          or blank for rows that are totals across all tracts in the county or
          MSA/MD
      - name: split_county
        type: string
        nullable: true
        comment: >
          'Y' if this row's tract is split by an MSA/MD boundary, 'N' if not,
          blank on total rows
      - name: population_classification
        type: string
        nullable: true
        comment: >
          'S' for counties with <500,000 population, 'L' for >=500,000, blank
          on total rows
      - name: income_group_total
        type: string
        nullable: true
        comment: >
          Median-family-income bucket of the tract, kept as string because the
          field mixes fine-grained deciles (values '1'-'15', with '1' meaning
          <10% of MFI and '14' meaning MFI unknown) with coarse tiers ('101'
          Low, '102' Moderate, '103' Middle, '104' Upper, '105' Income Not
          Known, '106' Tract Not Known); blank on total rows
      - name: report_level
        type: string
        nullable: true
        comment: >
          Grain marker: '100' = income-group total within a county, '200' =
          county total across all income groups, '210' = MSA/MD total, blank =
          tract-x-income-group subtotal (the finest grain, one row per (state,
          county, census_tract, income_group_total))
      - name: loans_lt_100k_count
        type: long
        nullable: true
        comment: Number of small-business loans originated with amount at origination < $100,000
      - name: loans_lt_100k_amount
        type: long
        nullable: true
        comment: Total dollar amount of small-business loans originated with amount at origination < $100,000 (USD thousands)
      - name: loans_100k_to_250k_count
        type: long
        nullable: true
        comment: Number of small-business loans originated with amount at origination >= $100,000 and < $250,000
      - name: loans_100k_to_250k_amount
        type: long
        nullable: true
        comment: Total dollar amount of small-business loans originated with amount at origination >= $100,000 and < $250,000 (USD thousands)
      - name: loans_250k_to_1m_count
        type: long
        nullable: true
        comment: Number of small-business loans originated with amount at origination >= $250,000 and < $1,000,000
      - name: loans_250k_to_1m_amount
        type: long
        nullable: true
        comment: Total dollar amount of small-business loans originated with amount at origination >= $250,000 and < $1,000,000 (USD thousands)
      - name: loans_to_small_biz_lt_1m_rev_count
        type: long
        nullable: true
        comment: Number of loans originated to small businesses with gross annual revenues < $1,000,000 (subset of the above counts by loan size)
      - name: loans_to_small_biz_lt_1m_rev_amount
        type: long
        nullable: true
        comment: Total dollar amount of loans originated to small businesses with gross annual revenues < $1,000,000 (USD thousands; subset of the amount-by-loan-size columns above)

    source:
      type: http
      # Two-digit year in the URL — 96exp_aggr.zip through 24exp_aggr.zip.
      # {year_short} is the file-adapter's built-in 2-digit rendering of the
      # combination's year (effective_year when dataLag is set, else year).
      # This host's Cloudflare gate fingerprints the TLS/HTTP client itself
      # (confirmed live: java.net.HttpURLConnection gets a 403 challenge page
      # regardless of headers; java.net.http.HttpClient over HTTP/2 does not),
      # so the actual fetch is done by CraSmallBusinessLendingTransformer
      # (below), which reads these headers via RequestContext rather than
      # HttpSource applying them — see that class's doc for the full story.
      url: "https://www.ffiec.gov/sites/default/files/data/cra/flat-files/{year_short}exp_aggr.zip"
      method: GET
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
        Accept: "*/*"
        Accept-Language: "en-US,en;q=0.9"
      # No rawCache: block — like ncua_branch_locations above, a
      # StreamingResponseTransformer opens its own connection and HttpSource
      # returns before its rawCache path ever runs, so it would be a no-op here.

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.banking.CraSmallBusinessLendingTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=cra_small_business_lending/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/banking"
        tableName: cra_small_business_lending
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:

  institutions:
    primaryKey: [cert]

  locations:
    primaryKey: [uninum]
    foreignKeys:
      - columns: [cert]
        targetSchema: banking
        targetTable: institutions
        targetColumns: [cert]
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

