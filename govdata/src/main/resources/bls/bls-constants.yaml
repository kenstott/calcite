# BLS (Bureau of Labor Statistics) data downloader constants
# All configuration values for series IDs, area codes, rate limits, and metadata mappings

# Rate limiting configuration - BLS API enforces strict rate limits
rateLimits:
  minRequestIntervalMs: 1100  # 1.1 second interval provides safe margin above BLS 1-second minimum
  maxRetries: 3
  retryDelayMs: 2000

# API batching limits - BLS API constraints on request size
batching:
  maxSeriesPerRequest: 50  # BLS API limit: 50 series per call
  maxYearsPerRequest: 20   # BLS API limit: 20 years per call

