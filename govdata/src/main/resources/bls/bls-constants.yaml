# Common BLS series IDs for economic indicators
seriesIds:
  employment:
    unemploymentRate: LNS14000000
    employmentLevel: CES0000000001
    laborForceParticipation: LNS11300000
    # CPS by educational attainment, 25 years and over (seasonally adjusted)
    unemploymentRateLessThanHighSchool: LNS14027659
    unemploymentRateHighSchoolNoCollege: LNS14027660
    unemploymentRateSomeCollege: LNS14027689
    unemploymentRateBachelorsOrHigher: LNS14027662
    laborForceParticipationLessThanHighSchool: LNS11327659
    laborForceParticipationHighSchoolNoCollege: LNS11327660
    laborForceParticipationSomeCollege: LNS11327689
    laborForceParticipationBachelorsOrHigher: LNS11327662
    employmentPopulationRatioLessThanHighSchool: LNS12327659
    employmentPopulationRatioHighSchoolNoCollege: LNS12327660
    employmentPopulationRatioSomeCollege: LNS12327689
    employmentPopulationRatioBachelorsOrHigher: LNS12327662
    # CPS headline levels and alternative measures of labor underutilization
    employmentPopulationRatio: LNS12300000
    unemploymentRateU6: LNS13327709
    laborForceLevel: LNS11000000
    employmentLevelCps: LNS12000000
    unemploymentLevel: LNS13000000
    partTimeForEconomicReasons: LNS12032194
    longTermUnemployedLevel: LNS13008636
    longTermUnemployedShare: LNS13025703
    averageWeeksUnemployed: LNS13008275
    medianWeeksUnemployed: LNS13008276
    # CPS unemployment rate by race/ethnicity, sex, and age
    unemploymentRateWhite: LNS14000003
    unemploymentRateBlack: LNS14000006
    unemploymentRateHispanic: LNS14000009
    unemploymentRateAsian: LNS14032183
    unemploymentRateMen20Plus: LNS14000025
    unemploymentRateWomen20Plus: LNS14000026
    unemploymentRateTeenagers: LNS14000012
    # CES total private employment and average weekly hours
    privateEmploymentLevel: CES0500000001
    avgWeeklyHours: CES0500000002
    avgWeeklyHoursProduction: CES0500000007
  inflation:
    cpiAllUrban: CUUR0000SA0
    cpiCore: CUUR0000SA0L1E
    ppiFinalDemand: WPUFD4
  wages:
    avgHourlyEarnings: CES0500000003
    employmentCostIndex: CIU1010000000000A

