  - name: cdc_wonder_multiple_cause_of_death
    # Freshness gate: CDC WONDER has no version/last-modified endpoint; hash the
    # response body and skip the materialize/commit when unchanged.
    freshness:
      type: hash
    comment: >
      National deaths by year and MCD (Multiple Cause of Death) Drug/Alcohol Induced Cause
      category, 1999-2020, from CDC WONDER database D77. Counts a death if the cause appears
      anywhere among its up to 20 listed multiple causes, not only as the underlying cause —
      the standard epidemiological definition for drug overdose mortality surveillance, and
      the reason this table (unlike cdc_wonder_cause_of_death, which is underlying-cause-only)
      actually answers an opioid/drug-involvement question. National-only for the same CDC
      WONDER API location-grouping restriction documented on cdc_wonder_natality.
    columns:
      - name: year
        comment: "Data year"
        type: VARCHAR
        nullable: true
      - name: cause
        comment: "MCD Drug/Alcohol Induced Cause category, e.g. 'Drug poisonings (overdose) Unintentional (X40-X44)' — the ICD-10 code range is embedded in the label text, not a separate column"
        type: VARCHAR
        nullable: true
      - name: deaths
        comment: "Death count where this cause appears anywhere among the death's up to 20 listed multiple causes (not just the underlying cause) — the standard epidemiological definition for drug overdose mortality. National total (CDC WONDER's API rejects sub-national location grouping for National Vital Statistics System data — this table is national-only by design, not an omission)"
        type: VARCHAR
        nullable: true
      - name: population
        comment: "National population denominator for the crude rate"
        type: VARCHAR
        nullable: true
      - name: crude_rate
        comment: "Deaths per 100,000 population, national"
        type: VARCHAR
        nullable: true
      - name: type
        comment: "Constant record-type discriminator cdc_wonder_multiple_cause_of_death"
        type: VARCHAR
        nullable: false
