  - name: cdc_county_overdose_deaths
    # Freshness gate: CDC Socrata JSON query API has no meaningful Last-Modified, so
    # this hashes the response body post-fetch to skip the materialize/commit when
    # unchanged (fails open on a missing prior token).
    freshness:
      type: hash
    comment: >
      Provisional 12-month-ending drug overdose death counts by county of residence, from CDC's
      Vital Statistics Rapid Release (VSRR) program. Currently updated (not a frozen historical
      archive). County-level drug overdose mortality is NOT obtainable from CDC WONDER — its API
      rejects location grouping for National Vital Statistics System mortality data even though
      the interactive web UI offers it (confirmed live) — so this Socrata feed is the only public
      source for this grain. Counts of 1-9 are suppressed for privacy (see footnote).
    columns:
      - name: data_as_of
        comment: "Date this provisional data snapshot was generated"
        type: VARCHAR
        nullable: true
      - name: year
        comment: "12-month-ending period's year"
        type: VARCHAR
        nullable: true
      - name: month
        comment: "12-month-ending period's month (numeric)"
        type: VARCHAR
        nullable: true
      - name: st_abbrev
        comment: "State postal abbreviation"
        type: VARCHAR
        nullable: true
      - name: state_name
        comment: "State name"
        type: VARCHAR
        nullable: true
      - name: countyname
        comment: "County name (decedent's county of residence)"
        type: VARCHAR
        nullable: true
      - name: fips
        comment: "Combined state+county FIPS code"
        type: VARCHAR
        nullable: true
      - name: statefips
        comment: "State FIPS code"
        type: VARCHAR
        nullable: true
      - name: countyfips
        comment: "County FIPS code"
        type: VARCHAR
        nullable: true
      - name: provisional_drug_overdose
        comment: "Provisional 12-month-ending drug overdose death count for this county"
        type: VARCHAR
        nullable: true
      - name: footnote
        comment: "Suppression/reliability footnote (e.g. counts under 10 are suppressed for privacy)"
        type: VARCHAR
        nullable: true
      - name: percentage_of_records_pending
        comment: "Percent of this period's death records still pending investigation/certification — provisional counts rise as pending records finalize"
        type: VARCHAR
