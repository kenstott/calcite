  - name: cms_open_payments
    # Freshness gate: CMS bulk zip on a date-stamped but stable-per-cycle static path.
    # A Last-Modified probe skips the re-download and re-materialize on unchanged runs
    # (fails open).
    freshness:
      type: last_modified
    releaseWindow:
      months: [6, 7]        # CMS Open Payments (Sunshine Act) annual release June–July
    # DQ sample cap (per program year): in DQ mode (GOVDATA_DQ=true) materialize at most this
    # many rows per fetch-unit, so DQ samples every year (2018+) — fast, but still crossing the
    # old/new format seam — instead of streaming ~100M rows. Safe here: the source is CSV_STREAM
    # (no raw cache to truncate). Ignored outside DQ mode (prod loads the full history).
    dqRowLimit: 25000
    comment: >
      CMS Open Payments (Sunshine Act) payments from pharmaceutical/device manufacturers
      to physicians. Bulk CSV downloads from download.cms.gov, one file per program year
      (CY2018+) and payment_type (general/research/ownership), partitioned by both.
    columns:
      - name: program_year
        comment: "Calendar year the payment/transfer of value was reported"
        type: VARCHAR
        nullable: true
      - name: change_type
        comment: "Record status vs prior publication (new/changed/unchanged)"
        type: VARCHAR
        nullable: true
      - name: physician_profile_id
        comment: "CMS-assigned unique ID for the covered recipient"
        type: VARCHAR
        nullable: true
      - name: physician_first_name
        comment: "Covered recipient first name"
        type: VARCHAR
        nullable: true
      - name: physician_last_name
        comment: "Covered recipient last name"
        type: VARCHAR
        nullable: true
      - name: physician_specialty
        comment: "Covered recipient primary medical specialty (e.g. Internal Medicine)"
        type: VARCHAR
        nullable: true
      - name: physician_state
        comment: "Covered recipient state"
        type: VARCHAR
        nullable: true
      - name: physician_country
        comment: "Covered recipient country"
        type: VARCHAR
        nullable: true
      - name: paying_entity_name
        comment: "Applicable manufacturer or GPO making the payment"
        type: VARCHAR
        nullable: true
      - name: total_amount
        comment: "Total payment/transfer-of-value amount in US dollars"
        type: VARCHAR
        nullable: true
      - name: payment_date
        comment: "Date of the payment or transfer of value"
        type: VARCHAR
        nullable: true
      - name: number_of_payments
        comment: "Number of payments included in the total amount"
        type: VARCHAR
        nullable: true
      - name: nature_of_payment
        comment: "Nature of the payment or transfer of value (e.g. Consulting Fee)"
        type: VARCHAR
        nullable: true
      - name: product_name
        comment: "Name of associated drug, biological, device, or medical supply"
        type: VARCHAR
        nullable: true
      - name: product_category
        comment: "Whether the product is a drug, biological, device, or medical supply"
        type: VARCHAR
        nullable: true
      - name: payment_type
        type: VARCHAR
        nullable: false
        comment: 'general, research, or ownership'

    source:
      type: http
      # CMS bulk CSV downloads — direct from download.cms.gov, streamed in batches.
      # {effective_year} (= publish year - dataLag) is the program/data year — one file per
      # year (PGYR2018..PGYR2024) so the year dimension drives the URL instead of being inert.
      # The publication/reload segment (P{pubdate}_{reldate}) is assigned by CMS at release time,
      # is NOT derivable from the year, and is SHARED across all program years (CMS republishes
      # every year together). Refresh the literal below when CMS republishes (~annually) — the
      # current segment is the distribution.downloadURL path from the catalog API:
      #   https://openpaymentsdata.cms.gov/api/1/metastore/schemas/dataset/items
      url: "https://download.cms.gov/openpayments/PGYR{effective_year}_P01232026_01102026/OP_DTL_GNRL_PGYR{effective_year}_P01232026_01102026.csv"
      method: GET
      response:
        format: csv
        hasHeader: true
        pagination:
          type: CSV_STREAM
          pageSize: 5000
      urlRules:
        - url: "https://download.cms.gov/openpayments/PGYR{effective_year}_P01232026_01102026/OP_DTL_RSRCH_PGYR{effective_year}_P01232026_01102026.csv"
          variableMatch:
            payment_type: research
        - url: "https://download.cms.gov/openpayments/PGYR{effective_year}_P01232026_01102026/OP_DTL_OWNRSHP_PGYR{effective_year}_P01232026_01102026.csv"
          variableMatch:
            payment_type: ownership
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.CmsOpenPaymentsResponseTransformer"

    dimensions:
      payment_type:
        - general
        - research
        - ownership
      year:
        type: yearRange
        # Computed global demarcation (default 2010, same as every schema). The literal
        # 2019 floor is a feed-began bound (allowed): Open Payments did not exist before
        # publish year 2019 (program year CY2018, published the following June/July =
        # data year + 1), so minYear clamps the range up to 2019. In daily mode
        # GOVDATA_START_YEAR = current year → the range is the current publish year forward
        # (empty/skipped before the July release). {effective_year} (= year - dataLag) is
        # the program year used in the URL and mapped to the `year` partition on write.
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2019
        dataLag: 1
        releaseMonth: 7

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "payment_type=*/year=*/"
      partition:
        columns: [payment_type, year]
        valueSource:
          year: effective_year
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  - name: rxnorm_drugs
    # Freshness: rxnav has no version endpoint; hash the downloaded body (single
    # ~37k-concept page) and skip the Iceberg commit when byte-identical to the last
    # successful run (replaces the monthly GOVDATA_CURRENT_MONTH cache-buster).
    freshness:
      type: hash
    comment: >
      RxNorm drug concepts from the NLM bulk allconcepts endpoint.
      Covers ingredient (IN), brand name (BN), and clinical drug (SCD) term types.
      Single-page call (~37k concepts). rxcui joins to fda_ndc_products.rxcui.
    columns:
      - name: rxcui
        type: VARCHAR
        nullable: true
        comment: 'RxNorm concept unique identifier — PK; FK target of fda_ndc_products.rxcui'
      - name: name
        comment: "RxNorm concept name/string"
        type: VARCHAR
        nullable: true
      - name: tty
        type: VARCHAR
        nullable: true
        comment: 'term type: IN, BN, SCD'
      - name: type
        comment: "Constant record-type discriminator rxnorm_drugs"
        type: VARCHAR
        nullable: false

    source:
      type: http
      url: "https://rxnav.nlm.nih.gov/REST/allconcepts.json?tty=IN+BN+SCD"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.RxNormDrugsResponseTransformer"

    dimensions:
      type:
        - rxnorm_drugs

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # INTERNATIONAL / UN FEED — WHO Global Health Observatory
  # ==========================================================================
  # Country-level health indicators keyed to ref.countries (ISO alpha-3), the
  # international analog of the U.S. openFDA tables. See docs/data-plans/health.md.
  # Streamed by org.apache.calcite.adapter.govdata.health.WhoGhoTransformer.
  # Indicator ids PENDING LIVE VERIFICATION against the GHO indicator catalog.
  - name: who_gho_indicators
    # Freshness gate: WHO GHO OData API has no meaningful Last-Modified, so this hashes
    # the response body post-fetch to skip the materialize/commit when unchanged (fails
    # open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=who_gho/indicator=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: indicator
          type: VARCHAR
    comment: >
      WHO Global Health Observatory indicators: value per country x indicator x
      dimension x year. Tall — the international analog of the U.S. openFDA/clinical
      tables. country_code is ISO alpha-3 (FK to ref.countries); WHO REGION /
      income-group rows are flagged is_aggregate. Fan out one GHO OData indicator
      per request; year is emitted per row and the partition is replaced wholesale
      on re-run (overwritePartitions).
    dimensions:
      type:
        - who_gho
      indicator:
        type: json_catalog
        source: "/who/who-gho-indicators.json"
        path: "indicators[*].code"
    columns:
      - name: indicator_code
        type: string
        nullable: true
        comment: GHO indicator id (the fan-out key)
      - name: indicator_name
        type: string
        nullable: true
        comment: Indicator label (from the bundled catalog)
      - name: country_code
        type: string
        nullable: true
        comment: Country ISO alpha-3 (GHO SpatialDim; FK to ref.countries.iso_alpha3)
      - name: spatial_type
        type: string
        nullable: true
        comment: GHO SpatialDimType (COUNTRY / REGION / WORLDBANKINCOMEGROUP)
      - name: sex
        type: string
        nullable: true
        comment: Sex dimension (BTSX / MLE / FMLE) when the indicator is sex-disaggregated
      - name: dimension
        type: string
        nullable: true
        comment: Other GHO Dim1 value (age group, cause, ...) when present
      - name: value_numeric
        type: double
        nullable: true
        comment: Numeric value (GHO NumericValue; null when only a display string exists)
      - name: value_display
        type: string
        nullable: true
        comment: Display value string (e.g. "72.6 [70.1-75.0]")
      - name: unit
        type: string
        nullable: true
        comment: Unit when GHO supplies one (usually null for this endpoint)
      - name: year
        type: integer
        nullable: false
        comment: Data year (from GHO TimeDim)
      - name: is_aggregate
        type: boolean
        nullable: true
        comment: True when spatial_type != COUNTRY (region/income-group roll-up)
    source:
      type: http
      url: "https://ghoapi.azureedge.net/api/{indicator}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.WhoGhoTransformer"
    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=who_gho/indicator=*/"
      partition:
        columns: [type, indicator]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        targetFileSizeBytes: 134217728
        batchPartitionColumns: [indicator]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

# ============================================================================
# Views
# ============================================================================

views:

  # --- CDC WONDER underlying cause of death, unified across vintages --------
  # D76 (1999-2020) and D158 (2018-2024) overlap for 2018-2020; this view picks D158
  # for 2018+ (the more current vintage) and D76 only for years D158 doesn't cover, so
  # summing across the view never double-counts the overlap years.
  - name: cdc_wonder_cause_of_death_1999_2024
    comment: >
      National deaths by year and ICD-10 sub-chapter, 1999-2024 — cdc_wonder_cause_of_death
      (D76, 1999-2020) unioned with cdc_wonder_cause_of_death_2018_2024 (D158, 2018-2024),
      preferring D158 for the 2018-2020 years both cover so the combined series never
      double-counts.
    sql: >
      SELECT year, icd_subchapter, icd_subchapter_code, deaths, population, crude_rate
      FROM cdc_wonder_cause_of_death
      WHERE CAST(year AS INTEGER) < 2018
      UNION ALL
      SELECT year, icd_subchapter, icd_subchapter_code, deaths, population, crude_rate
      FROM cdc_wonder_cause_of_death_2018_2024

  # --- CDC WONDER multiple cause of death, unified across vintages ----------
  # D77 (1999-2020) and D157 (2018-2024) overlap for 2018-2020; this view picks D157
  # for 2018+ (the more current vintage) and D77 only for years D157 doesn't cover, so
  # summing across the view never double-counts the overlap years.
  - name: cdc_wonder_multiple_cause_of_death_1999_2024
    comment: >
      National deaths by year and MCD Drug/Alcohol Induced Cause category, 1999-2024 —
      cdc_wonder_multiple_cause_of_death (D77, 1999-2020) unioned with
      cdc_wonder_multiple_cause_of_death_2018_2024 (D157, 2018-2024), preferring D157 for the
      2018-2020 years both cover so the combined series never double-counts. This is the
      multiple-cause series (a cause counts if listed anywhere among a death's up to 20 causes)
      — the standard basis for drug overdose mortality trend analysis.
    sql: >
      SELECT year, cause, deaths, population, crude_rate
      FROM cdc_wonder_multiple_cause_of_death
      WHERE CAST(year AS INTEGER) < 2018
      UNION ALL
      SELECT year, cause, deaths, population, crude_rate
      FROM cdc_wonder_multiple_cause_of_death_2018_2024

  # --- International / UN feed view -----------------------------------------
  # Reads who_gho_indicators; resolves once that table is populated.
  - name: who_health_snapshot
    comment: >
      Headline WHO GHO indicators pivoted wide: one row per country x year with life
      expectancy, healthy life expectancy, under-5 mortality, and UHC service coverage
      (country rows, both-sexes). International complement to the U.S. openFDA tables;
      join to ref.countries for names/regions.
    sql: >
      SELECT
        country_code,
        year,
        MAX(CASE WHEN indicator_code = 'WHOSIS_000001' THEN value_numeric END) AS life_expectancy,
        MAX(CASE WHEN indicator_code = 'WHOSIS_000002' THEN value_numeric END) AS healthy_life_expectancy,
        MAX(CASE WHEN indicator_code = 'MDG_0000000001' THEN value_numeric END) AS under5_mortality_rate,
        MAX(CASE WHEN indicator_code = 'UHC_INDEX_REPORTED' THEN value_numeric END) AS uhc_service_index
      FROM who_gho_indicators
      WHERE is_aggregate = FALSE
        AND (sex = 'BTSX' OR sex IS NULL)
      GROUP BY country_code, year

  - name: drug_profile
    comment: >
      Complete drug profile: NDC product joined to FDA approval record and RxNorm concept.
      Left joins preserve NDC products that lack an approval record or rxcui mapping.
    sql: >
      SELECT
        n.product_ndc,
        n.generic_name,
        n.brand_name,
        n.labeler_name,
        n.dosage_form,
        n.route,
        n.product_type,
        n.application_number,
        n.rxcui,
        r.name      AS rxnorm_name,
        r.tty       AS rxnorm_tty,
        a.sponsor_name,
        a.marketing_status,
        a.latest_submission_date
      FROM fda_ndc_products n
      LEFT JOIN fda_drug_approvals a ON n.application_number = a.application_number
      LEFT JOIN rxnorm_drugs r       ON n.rxcui = r.rxcui

  - name: trial_full
    comment: >
      Denormalised clinical trial view: one row per trial with conditions and
      interventions aggregated into semicolon-delimited strings.
    sql: >
      SELECT
        t.nct_id,
        t.brief_title,
        t.overall_status,
        t.study_type,
        t.phase,
        t.enrollment_count,
        t.lead_sponsor,
        t.funder_type,
        t.start_date,
        t.primary_completion_date,
        t.completion_date,
        t.first_submit_date,
        t.last_update_date,
        t.brief_summary,
        STRING_AGG(DISTINCT c.condition_name,  '; ') AS conditions,
        STRING_AGG(DISTINCT i.intervention_name, '; ') AS interventions
      FROM clinical_trials t
      LEFT JOIN clinical_trial_conditions   c ON t.nct_id = c.nct_id
      LEFT JOIN clinical_trial_interventions i ON t.nct_id = i.nct_id
      GROUP BY
        t.nct_id, t.brief_title, t.overall_status, t.study_type, t.phase,
        t.enrollment_count, t.lead_sponsor, t.funder_type, t.start_date,
        t.primary_completion_date, t.completion_date, t.first_submit_date,
        t.last_update_date, t.brief_summary

  - name: medicaid_drug_spend
    comment: >
      Medicaid drug utilization enriched with NDC product details and RxNorm name, at
      the same (state, year, quarter, ndc, utilization_type) grain as
      medicaid_drug_utilization — no aggregation. Enables spend analysis by brand,
      generic, labeler, and rxcui. For annual state+drug totals see drug_spend_trends;
      for state+year totals across all drugs see medicaid_spend_by_state_geo.
    sql: >
      SELECT
        m.state,
        m.year,
        m.quarter,
        m.ndc,
        m.utilization_type,
        m.product_name             AS medicaid_product_name,
        n.brand_name,
        n.generic_name,
        n.labeler_name,
        n.dosage_form,
        r.name                     AS rxnorm_name,
        r.tty                      AS rxnorm_tty,
        m.units_reimbursed,
        m.number_of_prescriptions,
        m.total_amount_reimbursed,
        m.medicaid_amount_reimbursed,
        m.non_medicaid_amount_reimbursed,
        m.suppression_used
      FROM medicaid_drug_utilization m
      LEFT JOIN fda_ndc_products n ON m.product_ndc9 = n.product_ndc9
      LEFT JOIN rxnorm_drugs r     ON n.rxcui = r.rxcui

  - name: public_health_indicators
    comment: >
      State-year summary combining CDC mortality totals (total_deaths,
      avg_age_adjusted_rate, distinct_causes) with BRFSS risk-factor averages
      (brfss_question_count, avg_risk_factor_pct) via FULL OUTER JOIN — rows where
      BRFSS has data but mortality does not appear with NULL death columns and vice
      versa. For a mortality-driven version with state geography see
      health_social_equity; for unaggregated per-cause/per-question detail see
      mortality_brfss_by_state.
    sql: >
      SELECT
        COALESCE(m.year,  b.year)  AS year,
        COALESCE(m.state, b.state) AS state,
        SUM(TRY_CAST(m.deaths AS BIGINT))       AS total_deaths,
        AVG(TRY_CAST(m.age_adjusted_rate AS DOUBLE)) AS avg_age_adjusted_rate,
        COUNT(DISTINCT m.cause_name)             AS distinct_causes,
        COUNT(DISTINCT b.question)               AS brfss_question_count,
        AVG(TRY_CAST(b.pct AS DOUBLE))           AS avg_risk_factor_pct
      FROM cdc_mortality m
      FULL OUTER JOIN cdc_brfss b
        ON m.state = b.state AND m.year = b.year
      WHERE (m.source_type = 'annual' OR m.source_type IS NULL)
      GROUP BY COALESCE(m.year, b.year), COALESCE(m.state, b.state)

  - name: hospital_quality_by_state
    comment: >
      State-level hospital quality summary: counts, average ratings, and quality tier
      breakdown, aggregated from all cms_hospital_quality facility rows in the state.
      For facility-level detail with county geography see hospital_with_geography;
      for a county-level aggregate see hospital_county_summary.
    sql: >
      SELECT
        state,
        COUNT(*)                                                       AS hospital_count,
        COUNT(CASE WHEN overall_rating NOT IN ('Not Available', '')
                   THEN 1 END)                                         AS rated_count,
        AVG(TRY_CAST(overall_rating AS DOUBLE))                        AS avg_overall_rating,
        COUNT(CASE WHEN TRY_CAST(overall_rating AS INTEGER) >= 4
                   THEN 1 END)                                         AS high_quality_count,
        COUNT(CASE WHEN hospital_type = 'Acute Care Hospitals'
                   THEN 1 END)                                         AS acute_care_count,
        COUNT(CASE WHEN emergency_services = 'Yes' THEN 1 END)         AS with_emergency_services,
        COUNT(CASE WHEN birthing_friendly = 'Yes'  THEN 1 END)         AS birthing_friendly_count
      FROM cms_hospital_quality
      GROUP BY state

  - name: hospital_with_geography
    comment: >
      Hospital quality records enriched with county FIPS, county name, and
      rural-urban classification via the dominant-county ZIP crosswalk. One row per
      facility (same grain as cms_hospital_quality) — see hospital_quality_by_state
      for a state-level aggregate and hospital_county_summary for a county-level
      aggregate.
    sql: >
      SELECT
        h.facility_id,
        h.facility_name,
        h.address,
        h.city,
        h.state,
        h.zip_code,
        h.county,
        h.hospital_type,
        h.hospital_ownership,
        h.emergency_services,
        h.overall_rating,
        h.mort_measures_better,
        h.mort_measures_worse,
        h.safety_measures_better,
        h.safety_measures_worse,
        h.readm_measures_better,
        h.readm_measures_worse,
        h.patient_exp_rating,
        h.birthing_friendly,
        xw.county_fips,
        c.county_name  AS geo_county_name,
        ruc.rucc_code,
        ruc.rucc_description,
        ruc.metro_nonmetro
      FROM cms_hospital_quality h
      LEFT JOIN (
        SELECT zip, county_fips,
               ROW_NUMBER() OVER (PARTITION BY zip ORDER BY res_ratio DESC) AS rn
        FROM "geo"."zip_county_crosswalk"
      ) xw ON h.zip_code = xw.zip AND xw.rn = 1
      LEFT JOIN "geo"."counties"               c   ON xw.county_fips = c.county_fips
      LEFT JOIN "geo"."rural_urban_continuum"  ruc ON xw.county_fips = ruc.county_fips

  - name: medicaid_spend_by_state_geo
    comment: >
      Medicaid spend aggregated by state and year across all drugs, enriched with
      state name and FIPS for choropleth-ready geographic analysis. For a per-drug
      breakout see drug_spend_trends, and for unaggregated per-quarter rows see
      medicaid_drug_spend.
    sql: >
      SELECT
        s.state_fips,
        s.state_name,
        m.state,
        m.year,
        SUM(TRY_CAST(m.total_amount_reimbursed    AS DOUBLE)) AS total_spend,
        SUM(TRY_CAST(m.medicaid_amount_reimbursed AS DOUBLE)) AS medicaid_spend,
        SUM(TRY_CAST(m.number_of_prescriptions    AS BIGINT)) AS total_prescriptions,
        COUNT(DISTINCT m.ndc)                                  AS distinct_drugs
      FROM medicaid_drug_utilization m
      LEFT JOIN "geo"."states" s ON m.state = s.state_abbr
      GROUP BY s.state_fips, s.state_name, m.state, m.year

  - name: mortality_brfss_by_state
    comment: >
      CDC annual mortality joined to BRFSS risk factors, both enriched with state
      geography. One row per state/year/cause/question combination (LEFT JOIN, so
      every mortality cause row is paired with every matching BRFSS question row) —
      filter on cause_name and question to avoid cross-product explosion. For
      pre-aggregated state/year totals see public_health_indicators (full outer join,
      retains BRFSS-only rows) or health_social_equity (mortality-driven, with
      geography).
    sql: >
      SELECT
        gs.state_fips,
        gs.state_name,
        m.state,
        m.year,
        m.cause_name,
        m.full_cause_name,
        m.deaths,
        m.age_adjusted_rate,
        b.question,
        b.category,
        b.topic,
        b.response,
        b.pct          AS risk_factor_pct,
        b.sample_size,
        b.break_out,
        b.break_out_category
      FROM cdc_mortality m
      LEFT JOIN cdc_brfss b
        ON m.state = b.state AND m.year = b.year
      LEFT JOIN "geo"."states" gs ON m.state = gs.state_abbr
      WHERE m.source_type = 'annual'

  - name: drug_manufacturer_span
    comment: >
      Connects drug manufacturers across FDA approval, NDC catalog, and Medicaid spend.
      One row per labeler+application. Enables manufacturer market-size and reach analysis.
    sql: >
      SELECT
        n.labeler_name,
        n.application_number,
        a.sponsor_name,
        COUNT(DISTINCT n.product_ndc)                              AS distinct_products,
        COUNT(DISTINCT m.state)                                    AS states_dispensed,
        SUM(TRY_CAST(m.total_amount_reimbursed AS DOUBLE))         AS total_medicaid_spend,
        SUM(TRY_CAST(m.number_of_prescriptions AS BIGINT))         AS total_prescriptions
      FROM fda_ndc_products n
      LEFT JOIN fda_drug_approvals        a ON n.application_number = a.application_number
      LEFT JOIN medicaid_drug_utilization m ON n.product_ndc9 = m.product_ndc9
      GROUP BY n.labeler_name, n.application_number, a.sponsor_name

  - name: rxnorm_medicaid_bridge
    comment: >
      Connects RxNorm clinical concepts to Medicaid spending via NDC codes.
      One row per rxcui — enables clinical terminology to spending analysis.
    sql: >
      SELECT
        r.rxcui,
        r.name                                                     AS rxnorm_name,
        r.tty                                                      AS rxnorm_tty,
        COUNT(DISTINCT n.product_ndc)                              AS distinct_ndcs,
        COUNT(DISTINCT m.state)                                    AS states_with_spending,
        SUM(TRY_CAST(m.total_amount_reimbursed AS DOUBLE))         AS total_medicaid_spend,
        SUM(TRY_CAST(m.number_of_prescriptions AS BIGINT))         AS total_prescriptions
      FROM rxnorm_drugs r
      LEFT JOIN fda_ndc_products          n ON r.rxcui = n.rxcui
      LEFT JOIN medicaid_drug_utilization m ON n.product_ndc9 = m.product_ndc9
      GROUP BY r.rxcui, r.name, r.tty

  - name: hospital_county_summary
    comment: >
      Aggregates CMS hospital quality metrics to county level via ZIP-county crosswalk.
      One row per county — enables county-level healthcare access and quality analysis.
      See hospital_with_geography for the underlying facility-level rows with county
      geography, and hospital_quality_by_state for a state-level aggregate.
    sql: >
      SELECT
        c.county_fips,
        c.county_name,
        c.state_fips,
        gs.state_abbr,
        COUNT(h.facility_id)                                                       AS facility_count,
        AVG(TRY_CAST(h.overall_rating AS DOUBLE))                                  AS avg_rating,
        COUNT(CASE WHEN TRY_CAST(h.overall_rating AS INTEGER) >= 4 THEN 1 END)     AS high_quality_count,
        COUNT(CASE WHEN h.emergency_services = 'Yes' THEN 1 END)                   AS with_emergency,
        AVG(TRY_CAST(h.mort_measures_better AS DOUBLE))                            AS avg_mortality_better,
        AVG(TRY_CAST(h.readm_measures_better AS DOUBLE))                           AS avg_readmission_better
      FROM cms_hospital_quality h
      LEFT JOIN "geo"."zip_county_crosswalk" zc ON h.zip_code = zc.zip
      LEFT JOIN "geo"."counties"              c  ON zc.county_fips = c.county_fips
      LEFT JOIN "geo"."states"               gs  ON c.state_fips = gs.state_fips
      GROUP BY c.county_fips, c.county_name, c.state_fips, gs.state_abbr

  - name: drug_spend_trends
    comment: >
      Annual Medicaid drug spend aggregated from quarterly utilization data, enriched
      with NDC product details. One row per state+year+ndc — enables year-over-year
      spend trend analysis by brand, generic, and labeler. For unaggregated per-quarter
      rows see medicaid_drug_spend; for state+year totals across all drugs see
      medicaid_spend_by_state_geo.
    sql: >
      SELECT
        m.state,
        m.year,
        m.ndc,
        n.brand_name,
        n.generic_name,
        n.labeler_name,
        SUM(TRY_CAST(m.total_amount_reimbursed    AS DOUBLE)) AS annual_spend,
        SUM(TRY_CAST(m.medicaid_amount_reimbursed AS DOUBLE)) AS medicaid_spend,
        SUM(TRY_CAST(m.number_of_prescriptions    AS BIGINT)) AS annual_prescriptions,
        COUNT(DISTINCT m.quarter)                              AS quarters_reported
      FROM medicaid_drug_utilization m
      LEFT JOIN fda_ndc_products n ON m.product_ndc9 = n.product_ndc9
      GROUP BY m.state, m.year, m.ndc, n.brand_name, n.generic_name, n.labeler_name

  - name: health_social_equity
    comment: >
      State-year health equity view: CDC annual mortality (deaths summed across all
      causes — cause_name is not broken out in this view) layered with BRFSS
      behavioral risk-factor prevalence, enriched with state name/FIPS geography. One
      row per state+year (LEFT JOIN from mortality, so BRFSS-only state-years are
      dropped). For a per-cause, per-question breakdown see mortality_brfss_by_state;
      for a version that also retains BRFSS-only rows see public_health_indicators.
    sql: >
      SELECT
        m.state                                          AS state_abbr,
        m.year,
        gs.state_name,
        gs.state_fips,
        SUM(TRY_CAST(m.deaths AS BIGINT))                AS total_deaths,
        AVG(TRY_CAST(m.age_adjusted_rate AS DOUBLE))     AS avg_mortality_rate,
        COUNT(DISTINCT b.question)                       AS brfss_questions_tracked,
        AVG(TRY_CAST(b.pct AS DOUBLE))                   AS avg_risk_factor_pct
      FROM cdc_mortality m
      LEFT JOIN "geo"."states" gs ON m.state = gs.state_abbr
      LEFT JOIN cdc_brfss b       ON m.state = b.state AND m.year = b.year
      WHERE m.source_type = 'annual'
      GROUP BY m.state, m.year, gs.state_name, gs.state_fips

  - name: weather_health_correlation
    comment: >
      Links annual CDC mortality to NOAA CDO monthly climate summaries by state and year.
      Temperature and precipitation are pivoted from long to wide via conditional aggregation.
      One row per state+year — enables climate-health correlation analysis.
    sql: >
      SELECT
        m.state                                                                          AS state_abbr,
        m.year,
        gs.state_name,
        gs.state_fips,
        SUM(TRY_CAST(m.deaths AS BIGINT))                                                AS total_deaths,
        AVG(TRY_CAST(m.age_adjusted_rate AS DOUBLE))                                     AS avg_mortality_rate,
        AVG(CASE WHEN w.datatype = 'TAVG' THEN TRY_CAST(w.value AS DOUBLE) END)          AS avg_temp_c,
        MIN(CASE WHEN w.datatype = 'TMIN' THEN TRY_CAST(w.value AS DOUBLE) END)          AS min_monthly_temp_c,
        MAX(CASE WHEN w.datatype = 'TMAX' THEN TRY_CAST(w.value AS DOUBLE) END)          AS max_monthly_temp_c,
        SUM(CASE WHEN w.datatype = 'PRCP' THEN TRY_CAST(w.value AS DOUBLE) END)          AS total_precip_mm
      FROM cdc_mortality m
      LEFT JOIN "geo"."states" gs ON m.state = gs.state_abbr
      LEFT JOIN "weather"."cdo_monthly_summaries" w
        ON gs.state_fips = w.state_fips AND m.year = w.year
      WHERE m.source_type = 'annual'
      GROUP BY m.state, m.year, gs.state_name, gs.state_fips

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:

  # WHO GHO international health indicators (int'l feed). Tall grain: one row per
  # indicator x country x spatial type x sex x dimension x year.
  who_gho_indicators:
    primaryKey: [type, year, indicator_code, country_code, spatial_type, sex, dimension]
    foreignKeys:
      - columns: [country_code]
        targetSchema: "${REF_SCHEMA_NAME:ref}"
        targetTable: countries
        targetColumns: [iso_alpha3]
        comment: >
          Country (ISO alpha-3, WHO SpatialDim) links to ref.countries. Metadata only;
          WHO REGION / income-group rows (is_aggregate=true) do not resolve.

  fda_ndc_products:
    primaryKey: [type, product_ndc]
    unique:
      # product_ndc9 is a lossless normalization of the PK product_ndc (labeler[5]+
      # product[4]), so it is 1:1 with product_ndc and therefore unique. Declared here
      # so it is a valid FK target for medicaid_drug_utilization.product_ndc9 (the
      # 11-digit package ndc and hyphenated product_ndc never join directly).
      - [product_ndc9]
    foreignKeys:
      - columns: [application_number]
        targetTable: fda_drug_approvals
        targetColumns: [application_number]
        comment: Links NDC product to its FDA approval application
      - columns: [rxcui]
        targetTable: rxnorm_drugs
        targetColumns: [rxcui]
        comment: Links NDC product to RxNorm concept for clinical terminology

  fda_drug_approvals:
    primaryKey: [type, application_number]

  fda_drug_recalls:
    # recall_number is the unique enforcement-action id (non-null); event_id groups
    # many recall_number rows under one recall event and is nullable — not a key.
    primaryKey: [type, recall_number]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links recall voluntary firm state to geographic data

  fda_adverse_events:
    primaryKey: [type, safety_report_id]

  fda_device_recalls:
    primaryKey: [type, cfres_id]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links recalling firm state to geographic data

  clinical_trials:
    primaryKey: [type, nct_id]

  clinical_trial_conditions:
    primaryKey: [type, nct_id, condition_name]
    foreignKeys:
      - columns: [nct_id]
        targetTable: clinical_trials
        targetColumns: [nct_id]
        comment: Links condition row to parent trial record

  clinical_trial_interventions:
    primaryKey: [type, nct_id, intervention_name]
    foreignKeys:
      - columns: [nct_id]
        targetTable: clinical_trials
        targetColumns: [nct_id]
        comment: Links intervention row to parent trial record

  cdc_covid_vaccinations:
    primaryKey: [type, date, demographic_category]

  cms_hospital_quality:
    primaryKey: [type, facility_id]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links hospital state to geographic data for regional quality analysis
      - columns: [zip_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: zcta_ref
        targetColumns: [zcta]
        comment: 5-digit hospital ZIP to the conformed ZCTA dimension

  cdc_mortality:
    # week_ending_date distinguishes the weekly rows (cause_name is the constant
    # "COVID-19" there); null for annual rows, where (year, state, cause_name) is unique.
    primaryKey: [source_type, year, state, cause_name, week_ending_date]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links mortality data to geographic state for spatial health analysis

  cdc_brfss:
    # break_out (the subgroup value, e.g. "18-24") is required for uniqueness: one row
    # per subgroup value within a break_out_category for the same question/response.
    primaryKey: [type, year, state, question, break_out_category, break_out, response]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links BRFSS survey data to geographic state for behavioral health mapping

  medicaid_drug_utilization:
    # utilization_type (FFSU vs MCOU) yields two rows per (state, ndc, year, quarter).
    primaryKey: [type, state, ndc, year, quarter, utilization_type]
    foreignKeys:
      - columns: [product_ndc9]
        targetTable: fda_ndc_products
        targetColumns: [product_ndc9]
        comment: >
          Links Medicaid drug spend to the FDA NDC product catalog via the normalized
          9-digit product NDC (Medicaid's 11-digit package ndc and openFDA's hyphenated
          product_ndc are different representations and do not join directly).
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links state drug utilization to geographic data for Medicaid spending maps

  cms_open_payments:
    primaryKey: [payment_type, program_year, physician_profile_id, paying_entity_name, nature_of_payment]
    foreignKeys:
      - columns: [physician_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links physician practice state to geographic data

  cms_pos_facilities:
    primaryKey: [provider_number]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links facility state to geographic data
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Links facility county to geographic data (null when FIPS_CNTY_CD is unpopulated)

  ahrf_physician_supply:
    primaryKey: [county_fips]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links county state to geographic data
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Links AHRF county row to geographic data

  rxnorm_drugs:
    primaryKey: [type, rxcui]
