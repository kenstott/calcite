  - name: cdc_wonder_vaers
    # Freshness gate: CDC WONDER has no version/last-modified endpoint; hash the
    # response body and skip the materialize/commit when unchanged.
    freshness:
      type: hash
    comment: >
      Vaccine Adverse Event Reporting System (VAERS) report counts by year reported and
      state/territory, from CDC WONDER database D8. CAUTION: VAERS is a raw, unverified
      self-reporting system — reports can be filed by anyone (patients, providers,
      manufacturers) with minimal validation, a report being present does NOT establish that
      the vaccine caused the reported event, and the data includes known data-entry errors
      (e.g. a small number of reports dated before VAERS existed in 1990). Use for signal
      detection / reporting-volume trends only, never as evidence of causation. Public access
      to full VAERS detail was expanded May 2025; older third-party WONDER "saved queries" for
      this database predate that change and are no longer valid — this table's fields were
      rebuilt against the current form.
    columns:
      - name: year
        comment: "Year the report was received by VAERS (not necessarily the year of vaccination)"
        type: VARCHAR
        nullable: true
      - name: state
        comment: "State/territory of the vaccinated person"
        type: VARCHAR
        nullable: true
      - name: events
        comment: "Count of VAERS reports (raw report counts, not verified adverse events — see table comment)"
        type: VARCHAR
        nullable: true
      - name: pct_of_total
        comment: "This row's reports as a percent of the grand total across the full result set (not just this state or year) — a WONDER-computed convenience field, not independently meaningful per row"
