  # ==========================================================================
  # CMS PROVIDER OF SERVICES FILE — data.cms.gov data.json discovery (snapshot, current quarter)
  # ==========================================================================
  - name: cms_pos_facilities
    # Freshness gate: CMS data.json catalog is a dynamic index response with no
    # meaningful Last-Modified, so this hashes the response body post-fetch to skip the
    # materialize/commit when unchanged (fails open on a missing prior token).
    freshness:
      type: hash
    releaseWindow:
      months: [1, 4, 7, 10] # CMS POS republishes quarterly
    pattern: "type=cms_pos_facilities"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
    comment: >
      CMS Provider of Services File (POS) — identity, location, and bed-count fields
      for every certified hospital and non-hospital facility, one row per
      provider_number (CMS Certification Number, unique). The current-quarter
      snapshot only (whole file replaced each release, per CMS's own accrualPeriodicity
      of R/P3M — no history retained upstream to backfill). provider_category_code
      is CMS's PRVDR_CTGRY_CD: 01=hospital, 06=psychiatric/behavioral residential
      treatment, 12=clinic, 19=community mental health center, 21=other
      (verified live against the 2026-Q2 file's actual category population; CMS's
      own layout PDF, linked from the data.json dataset's describedBy field, has the
      authoritative full code list). bed_count is the facility's total certified
      beds; the curated sub-type columns (icf_iid/medicaid_nf/medicare_snf/hospice/
      rehab/psych_unit/rehab_unit) break that total down by care type — most are
      null/0 for non-bed facility categories (clinics, mental health centers).
      county_fips is derived by concatenating FIPS_STATE_CD + FIPS_CNTY_CD (only
      when both are present at their expected 2-digit/3-digit widths). Source:
      data.cms.gov/data.json, dataset "Provider of Services File - Quality
      Improvement and Evaluation System".

    columns:
      - name: provider_number
        type: string
        nullable: false
        comment: CMS Certification Number (CCN) — PK
      - name: provider_category_code
        type: string
        nullable: true
        comment: PRVDR_CTGRY_CD (01=hospital, 06=psych/behavioral residential, 12=clinic, 19=community mental health, 21=other)
      - name: provider_subtype_code
        type: string
        nullable: true
        comment: PRVDR_CTGRY_SBTYP_CD, refines provider_category_code
      - name: facility_name
        type: string
        nullable: true
        comment: FAC_NAME
      - name: city
        type: string
        nullable: true
        comment: CITY_NAME
      - name: state
        type: string
        nullable: true
        comment: STATE_CD (2-letter USPS; FK to geo.state_ref)
      - name: zip_code
        type: string
        nullable: true
        comment: ZIP_CD
      - name: state_fips
        type: string
        nullable: true
        comment: FIPS_STATE_CD (2-digit; FK to geo.state_ref)
      - name: county_fips
        type: string
        nullable: true
        comment: Derived 5-digit county FIPS (FIPS_STATE_CD + FIPS_CNTY_CD; FK to geo.counties)
      - name: ownership_code
        type: string
        nullable: true
        comment: GNRL_CNTL_TYPE_CD (general control/ownership type)
      - name: certification_date
        type: string
        nullable: true
        comment: CRTFCTN_DT (YYYYMMDD)
      - name: bed_count
        type: long
        nullable: true
        comment: BED_CNT — total certified beds
      - name: certified_bed_count
        type: long
        nullable: true
        comment: CRTFD_BED_CNT
      - name: icf_iid_bed_count
        type: long
        nullable: true
        comment: ICFIID_BED_CNT — intermediate care facility for intellectual disabilities
      - name: medicaid_nf_bed_count
        type: long
        nullable: true
        comment: MDCD_NF_BED_CNT — Medicaid-certified nursing facility beds
      - name: medicare_snf_bed_count
        type: long
        nullable: true
        comment: MDCR_SNF_BED_CNT — Medicare-certified skilled nursing facility beds
      - name: medicare_medicaid_snf_bed_count
        type: long
        nullable: true
        comment: MDCR_MDCD_SNF_BED_CNT — dually-certified SNF beds
      - name: hospice_bed_count
        type: long
        nullable: true
        comment: HOSPC_BED_CNT
      - name: rehab_bed_count
        type: long
        nullable: true
        comment: REHAB_BED_CNT
      - name: psych_unit_bed_count
        type: long
        nullable: true
        comment: PSYCH_UNIT_BED_CNT — psychiatric unit within a non-psychiatric hospital
      - name: rehab_unit_bed_count
        type: long
        nullable: true
        comment: REHAB_UNIT_BED_CNT — rehab unit within a non-rehab hospital
      - name: type
        type: string
        nullable: false
        comment: 'Always "cms_pos_facilities"'

    source:
      type: http
      # Discovery source: CMS's site-wide DCAT catalog. CmsPosTransformer finds the
      # "Provider of Services File - Quality Improvement and Evaluation System"
      # dataset's newest CSV distribution (the downloadURL carries an opaque
      # per-release UUID with no year-templatable pattern) and downloads it directly.
      url: "https://data.cms.gov/data.json"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.CmsPosTransformer"

    dimensions:
      type:
        - cms_pos_facilities

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # HRSA AREA HEALTH RESOURCES FILE — county-level physician supply (annual snapshot)
  # ==========================================================================
  - name: ahrf_physician_supply
    # Freshness gate: HRSA landing/download page. A Last-Modified probe skips the
    # re-download and re-materialize on unchanged runs (fails open — a null token just
    # re-fetches).
    freshness:
      type: last_modified
    releaseWindow:
      months: [8, 9, 10, 11, 12] # HRSA AHRF annual release; tech doc dated Aug, files last-modified Dec
    pattern: "type=ahrf_physician_supply"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
    comment: >
      HRSA Area Health Resources File (AHRF), county-level release — one row per U.S.
      county (fips_st_cnty; 3,235 counties/county-equivalents in the 2024-2025 release,
      including territories). AHRF ships raw physician/population COUNTS only — no
      per-100k rate column exists upstream — so primary_care_physicians_per_100k and
      total_active_physicians_per_100k are computed here from the matched count and
      population columns. primary_care_physicians is HRSA's "Phys, Primary Care, Patient
      Care" measure: non-federal MD+DO physicians in patient care, excluding hospital
      residents and physicians aged 75+, sourced from the AMA Physician Masterfile.
      total_active_physicians is all non-federal active MDs plus DOs (all specialties,
      not primary-care-filtered). AHRF is a wide file — each variable is a family of
      year-suffixed columns (e.g. phys_nf_prim_care_pc_exc_rsdt_23,
      phys_nf_prim_care_pc_exc_rsdt_22, ...) rather than one row per year, and each
      annual release adds a newest-year column while keeping older ones.
      AhrfPhysicianSupplyTransformer scans the header at load time for the
      highest-numbered suffix present and records which data year it picked in
      physician_data_year / population_data_year — so a stale suffix never silently
      ships; the years advance automatically as HRSA adds columns in future releases.
      rural_urban_code is the USDA ERS Rural-Urban Continuum Code (1-9; lower = more
      urban), useful for physician-shortage/rural-access analysis alongside the supply
      counts. Source: data.hrsa.gov/data/download, "Area Health Resources Files" county
      CSV distribution.

    columns:
      - name: county_fips
        type: string
        nullable: false
        comment: 5-digit county FIPS (fips_st_cnty) — PK
      - name: state_fips
        type: string
        nullable: true
        comment: fips_st (2-digit; FK to geo.state_ref)
      - name: state_abbr
        type: string
        nullable: true
        comment: st_name_abbrev (2-letter USPS; FK to geo.state_ref)
      - name: state_name
        type: string
        nullable: true
        comment: st_name
      - name: county_name
        type: string
        nullable: true
        comment: cnty_name
      - name: rural_urban_code
        type: string
        nullable: true
        comment: >
          rural_urban_contnm_YY — USDA ERS Rural-Urban Continuum Code (1-9; lower codes
          are more urban/metro), most-recent year available in this release
      - name: population_estimate
        type: long
        nullable: true
        comment: popn_est_YY — Census county population estimate, most-recent year available
      - name: population_data_year
        type: integer
        nullable: true
        comment: The YY this release's population_estimate reflects (e.g. 2024)
      - name: primary_care_physicians
        type: long
        nullable: true
        comment: >
          phys_nf_prim_care_pc_exc_rsdt_YY — non-federal MD+DO primary care physicians in
          patient care, excluding hospital residents and physicians aged 75+ (AMA
          Physician Masterfile), most-recent year available
      - name: physician_data_year
        type: integer
        nullable: true
        comment: The YY this release's primary_care_physicians / total_active_physicians reflect (e.g. 2023)
      - name: primary_care_physicians_per_100k
        type: double
        nullable: true
        comment: Computed — primary_care_physicians / population_estimate * 100000
      - name: total_active_physicians
        type: long
        nullable: true
        comment: >
          Computed sum of md_nf_activ_YY + do_nf_activ_YY (total non-federal active MDs
          and DOs, all specialties — not primary-care-filtered) for physician_data_year
      - name: total_active_physicians_per_100k
        type: double
        nullable: true
        comment: Computed — total_active_physicians / population_estimate * 100000
      - name: type
        type: string
        nullable: false
        comment: 'Always "ahrf_physician_supply"'

    source:
      type: http
      # Discovery source: HRSA's AHRF download-listing page. AhrfPhysicianSupplyTransformer
      # scans it for the newest county-level CSV zip link (the filename embeds a two-year
      # release range with an inconsistent separator across releases — space, underscore,
      # or none — so no single {year}-templatable URL pattern exists) and downloads it
      # directly.
      url: "https://data.hrsa.gov/data/download"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.AhrfPhysicianSupplyTransformer"

    dimensions:
      type:
        - ahrf_physician_supply

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # MEDICAID DRUG UTILIZATION — Socrata SODA API, ~2.5M records/year
  # Default dataset: 2023 data (d890d3a9-6b00-43fd-8b31-fcba4c8e2909)
  # ==========================================================================
  - name: medicaid_drug_utilization
    # Freshness gate: Medicaid datastore query API has no meaningful Last-Modified, so
    # this hashes the response body post-fetch to skip the materialize/commit when
    # unchanged (fails open on a missing prior token).
    freshness:
      type: hash
    releaseWindow:
      months: [3, 6, 9, 12] # Quarterly data published ~3 months after quarter end
    # DQ sample cap: the DKAN datastore returns the whole ~5.3M-row annual dataset; in DQ mode
    # (GOVDATA_DQ=true) materialize at most this many rows, so DQ writes a bounded sample instead
    # of 5.3M Iceberg rows. Cache-safe: the full ~2GB body is written to the raw cache during
    # fetch (before the iterator) and stays complete for prod; the cap only bounds the read +
    # materialize. Ignored outside DQ mode (prod loads everything).
    dqRowLimit: 25000
    pattern: "type=medicaid_drug_utilization"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR

    comment: >
      Medicaid drug utilization and reimbursement by state, drug (NDC), year/quarter,
      and utilization_type (FFSU fee-for-service vs. MCOU managed care). Composite PK:
      (state, ndc, year, quarter, utilization_type). Default dataset is 2023 data.

    columns:
      - name: state
        type: string
        nullable: false
        comment: State abbreviation — composite PK
      - name: ndc
        type: string
        nullable: false
        comment: National Drug Code (11-digit package NDC) — composite PK
      - name: product_ndc9
        type: string
        nullable: true
        comment: >
          Normalized 9-digit product NDC (package segment dropped, zero-padded to
          labeler[5]+product[4]) derived from ndc. FK/join key to
          fda_ndc_products.product_ndc9.
      - name: year
        type: string
        nullable: false
        comment: Calendar year — composite PK
      - name: quarter
        type: string
        nullable: false
        comment: Q1, Q2, Q3, Q4 — composite PK
      - name: utilization_type
        comment: "Record type: FFSU (fee-for-service) or MCOU (managed care)"
        type: string
        nullable: true
      - name: product_name
        comment: "FDA product name (first ~10 characters as listed with FDA)"
        type: string
        nullable: true
      - name: labeler_code
        comment: "First NDC segment identifying the manufacturer/labeler"
        type: string
        nullable: true
      - name: units_reimbursed
        comment: "Units of the NDC reimbursed (FFS) or dispensed (MCO) in the period"
        type: string
        nullable: true
      - name: number_of_prescriptions
        comment: "Outpatient Rx claims reimbursed (FFS) or dispensed (MCO)"
        type: string
        nullable: true
      - name: total_amount_reimbursed
        type: string
        nullable: true
        comment: Total reimbursement in dollars
      - name: medicaid_amount_reimbursed
        type: string
        nullable: true
        comment: Medicaid portion of reimbursement
      - name: non_medicaid_amount_reimbursed
        type: string
        nullable: true
        comment: Non-Medicaid portion (other payers)
      - name: suppression_used
        type: string
        nullable: true
        comment: 'true if data suppressed due to low counts'

    source:
      type: http
      # Annual dataset; one UUID per year, all 4 quarters included.
      # Catalog: GET https://data.medicaid.gov/api/1/metastore/schemas/dataset/items?limit=100&filter[theme]=State+Drug+Utilization
      # 2023=d890d3a9  2024=61729e5a-7aa8-448c-8903-ba3e0cd0ea3c  2025=158a1baa-5506-400a-8ec3-97756f0b0536
      url: "https://data.medicaid.gov/api/1/datastore/query/${MEDICAID_DRUG_UTIL_DATASET_ID:d890d3a9-6b00-43fd-8b31-fcba4c8e2909}/0"
      method: GET
      parameters:
        "limit": "8000"
      response:
        format: json
        pagination:
          type: OFFSET
          pageSize: 8000
          limitParam: "limit"
          offsetParam: "offset"
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
        retryOn: [429, 503]
      rawCache:
        enabled: true
      incremental:
        sinceYear: "${GOVDATA_START_YEAR:}"
        sinceQuarter: "${MEDICAID_SINCE_QUARTER:}"
        untilYear: "${GOVDATA_END_YEAR:}"
        # DKAN ignores $where; conditions[] syntax needed for server-side filtering (not yet supported).
        # Without server-side filtering, all 5.3M records are fetched from the annual dataset.
        filterParam: "$where"
        yearField: "year"
        quarterField: "quarter"

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.MedicaidDrugUtilizationResponseTransformer"

    dimensions:
      type:
        - medicaid_drug_utilization
      year: *health_year_range

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

# ============================================================================
# Health Schema — Phase 3: CDC Mortality, CDC BRFSS, CMS Open Payments, RxNorm
# ============================================================================

  - name: cdc_mortality
    # Freshness gate: CDC Socrata JSON query API has no meaningful Last-Modified, so
    # this hashes the response body post-fetch to skip the materialize/commit when
    # unchanged (fails open on a missing prior token).
    freshness:
      type: hash
    releaseWindow:
      dow: [1]              # CDC publishes weekly updates Fridays; Monday catches them
    comment: >
      CDC/NCHS mortality statistics at the state level (annual data also includes a
      United States total row). Unions annual (bi63-dtpu: NCHS leading/113-cause
      deaths and age-adjusted rate per 100,000, 2000 US standard population, 1999-2017)
      and weekly provisional data (source_type=weekly) from two Socrata vintages of the
      same "AH Weekly Death Counts by State and Select Causes" series: 3yf8-kanr
      (2018-2019, no COVID columns) and muzy-jte6 (2020-2023, adds COVID-19 columns).
      Weekly rows surface the all-cause weekly total for 2018-2019 and the COVID-19
      underlying-cause count for 2020-2023; source_type distinguishes annual from
      weekly, and age_adjusted_rate is populated for annual rows only.
    columns:
      - name: year
        comment: "Data year of deaths; MMWR year for weekly rows"
        type: VARCHAR
        nullable: true
      - name: week_ending_date
        comment: "Week-ending date; weekly rows only, null for annual"
        type: VARCHAR
        nullable: true
      - name: state
        comment: "State/jurisdiction; annual includes a United States total row"
        type: VARCHAR
        nullable: true
      - name: cause_name
        comment: "Cause-of-death name; NCHS leading cause (annual) or COVID-19 (weekly)"
        type: VARCHAR
        nullable: true
      - name: full_cause_name
        comment: "Detailed cause name (NCHS 113-cause for annual; COVID-19 detail for weekly)"
        type: VARCHAR
        nullable: true
      - name: deaths
        comment: "Number of deaths for the cause/period (COVID-19 deaths for weekly rows)"
        type: VARCHAR
        nullable: true
      - name: age_adjusted_rate
        comment: "Age-adjusted deaths per 100,000 (2000 US std pop); annual only"
        type: VARCHAR
        nullable: true
      - name: source_type
        type: VARCHAR
        nullable: false
        comment: 'annual or weekly'

    source:
      type: http
      url: "https://data.cdc.gov/resource/bi63-dtpu.json"
      method: GET
      parameters:
        "$limit": "1000"
      response:
        format: json
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$limit"
          offsetParam: "$offset"
      urlRules:
        - url: "https://data.cdc.gov/resource/3yf8-kanr.json"
          variableMatch:
            source_type: weekly_precovid
        - url: "https://data.cdc.gov/resource/muzy-jte6.json"
          variableMatch:
            source_type: weekly_covid
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.CdcMortalityResponseTransformer"

    dimensions:
      # bi63-dtpu (annual), 3yf8-kanr (weekly, 2018-2019), and muzy-jte6 (weekly,
      # 2020-2023) are all frozen historical Socrata extracts that each return their
      # *entire* history in one unfiltered call — not rolling feeds, and Socrata's
      # $where isn't scoped per urlRule in this framework. A yearRange dimension here
      # previously iterated 2010-2023 (14 values) and re-issued the same full,
      # unscoped fetch for every one, appending 14 identical copies of the dataset
      # into the same source_type partition buffer (14x/5.8x row duplication,
      # confirmed live against production — see the remediation ledger). Fetching is
      # now driven by source_type alone, one value per URL, so each of the three
      # sources is fetched exactly once per run regardless of year:
      # weekly_precovid and weekly_covid route (via urlRules variableMatch, no year
      # condition needed) to the two weekly vintages; annual falls through to the
      # table's base url. CdcMortalityResponseTransformer still writes the output
      # source_type column as "annual"/"weekly" — this 3-way split only controls
      # fetch routing, not the materialized schema.
      # Trade-off: this table no longer has a `dimensions.year` node, so
      # GovDataCatalog#putCoverage emits no coverage window for it (the "no year
      # dimension" case, its own documented honest-omission behavior) — previously
      # inaccurate anyway (declared 2010-2023 vs. real 1999-2017 annual / 2018-2023
      # weekly).
      source_type:
        - annual
        - weekly_precovid
        - weekly_covid

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [source_type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  - name: cdc_brfss
    # Freshness gate: CDC Socrata JSON query API has no meaningful Last-Modified, so
    # this hashes the response body post-fetch to skip the materialize/commit when
    # unchanged (fails open on a missing prior token).
    freshness:
      type: hash
    releaseWindow:
      months: [5, 6, 7, 8]  # CDC publishes annual BRFSS survey data May–August
    dqRowLimit: 25000   # DQ sample cap (GOVDATA_DQ mode); cache-safe (capped sample cached under cap=N, isolated from the full prod cache)
    comment: >
      CDC Behavioral Risk Factor Surveillance System prevalence data (Socrata dttw-5yxu).
      State-level health behavior estimates by year, question, and demographic breakout.
    columns:
      - name: year
        comment: "Survey year"
        type: VARCHAR
        nullable: true
      - name: state
        type: VARCHAR
        nullable: true
        comment: 'state abbreviation from locationabbr'
      - name: question
        comment: "Survey question text"
        type: VARCHAR
        nullable: true
      - name: category
        comment: "BRFSS class grouping the topic (source class, e.g. Health Status)"
        type: VARCHAR
        nullable: true
      - name: topic
        comment: "Topic within the class"
        type: VARCHAR
        nullable: true
      - name: response
        comment: "Response/answer option to the question"
        type: VARCHAR
        nullable: true
      - name: pct
        type: VARCHAR
        nullable: true
        comment: 'prevalence percentage (data_value)'
      - name: sample_size
        comment: "Number of survey respondents behind the estimate"
        type: VARCHAR
        nullable: true
      - name: break_out
        comment: "Demographic subgroup value (e.g. 18-24)"
        type: VARCHAR
        nullable: true
      - name: break_out_category
        comment: "Demographic dimension of the breakout (e.g. Age Group)"
        type: VARCHAR
        nullable: true
      - name: type
        comment: "Constant record-type discriminator cdc_brfss"
        type: VARCHAR
        nullable: false

    source:
      type: http
      url: "https://data.cdc.gov/resource/dttw-5yxu.json"
      method: GET
      parameters:
        "$limit": "1000"
      response:
        format: json
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$limit"
          offsetParam: "$offset"
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
        retryOn: [429, 503]
      rawCache:
        enabled: true
      incremental:
        sinceYear: "{effective_year}"
        untilYear: "{effective_year}"
        filterParam: "$where"
        yearField: "year"
        quoteValues: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.CdcBrfssResponseTransformer"

    dimensions:
      type:
        - cdc_brfss
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2010}"
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        # BRFSS publishes ~2 years in arrears (probed 2026: latest vintage = 2024).
        dataLag: 2

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  - name: cdc_wonder_cancer_incidence
    # Freshness gate: CDC WONDER has no version/last-modified endpoint; hash the
    # response body and skip the materialize/commit when unchanged.
    freshness:
      type: hash
    comment: >
      United States Cancer Statistics (USCS) invasive + in situ cancer incidence by state
      and year, 1999-2022, from CDC WONDER database D205. State-level grouping is confirmed
      to work through the WONDER XML API (unlike mortality/natality, USCS is not a National
      Vital Statistics System database and is not subject to that API's location-grouping
      restriction). No cancer data exists elsewhere in govdata.
    columns:
      - name: year
        comment: "Data year of diagnosis, 1999-2022"
        type: VARCHAR
        nullable: true
      - name: state
        comment: "State of residence at diagnosis"
        type: VARCHAR
        nullable: true
      - name: state_fips
        comment: "State FIPS code"
        type: VARCHAR
        nullable: true
      - name: cases
        comment: "Invasive + in situ cancer incidence case count, all sites combined"
        type: VARCHAR
        nullable: true
      - name: type
        comment: "Constant record-type discriminator cdc_wonder_cancer_incidence"
        type: VARCHAR
        nullable: false
    source:
      type: http
      url: "https://wonder.cdc.gov/controller/datarequest/D205"
      method: POST
      bodyFormat: FORM_URLENCODED
      headers:
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      body:
        accept_datause_restrictions: "true"
        request_xml: |
          <?xml version='1.0' encoding='utf-8'?>
          <request-parameters>
          <parameter><name>accept_datause_restrictions</name><value>true</value></parameter>
          <parameter><name>B_1</name><value>D205.V1</value></parameter>
          <parameter><name>B_2</name><value>D205.V2</value></parameter>
          <parameter><name>B_3</name><value>*None*</value></parameter>
          <parameter><name>B_4</name><value>*None*</value></parameter>
          <parameter><name>B_5</name><value>*None*</value></parameter>
          <parameter><name>M_1</name><value>D205.M1</value></parameter>
          <parameter><name>M_2</name><value>D205.M2</value></parameter>
          <parameter><name>O_PR</name><value>false</value></parameter>
          <parameter><name>O_V11_fmode</name><value>freg</value></parameter>
          <parameter><name>O_cancer</name><value>D205.V8</value></parameter>
          <parameter><name>O_javascript</name><value>off</value></parameter>
          <parameter><name>O_location</name><value>D205.V2</value></parameter>
          <parameter><name>O_precision</name><value>1</value></parameter>
          <parameter><name>O_rate_per</name><value>100000</value></parameter>
          <parameter><name>O_show_totals</name><value>true</value></parameter>
          <parameter><name>O_stdpop</name><value>201</value></parameter>
          <parameter><name>O_timeout</name><value>600</value></parameter>
          <parameter><name>V_D205.V1</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V10</name><value>0</value></parameter>
          <parameter><name>V_D205.V12</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V2</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V3</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V4</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V5</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V6</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V7</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V8</name><value>*All*</value></parameter>
          <parameter><name>V_D205.V9</name><value>*All*</value></parameter>
          <parameter><name>action-Send</name><value>Send</value></parameter>
          <parameter><name>dataset_code</name><value>D205</value></parameter>
          <parameter><name>dataset_id</name><value>D205</value></parameter>
          <parameter><name>dataset_label</name><value>United States and Puerto Rico Cancer Statistics, 1999-2022 Incidence</value></parameter>
          <parameter><name>dataset_vintage_latest</name><value>Cancer Incidence</value></parameter>
          <parameter><name>finder-stage-D205.V11</name><value>codeset</value></parameter>
          <parameter><name>saved_id</name><value></value></parameter>
          <parameter><name>stage</name><value>request</value></parameter>
          </request-parameters>
      response:
        format: xml
      rateLimit:
        # CDC WONDER enforces a strict 15-second minimum between automated XML API
        # requests (returns HTTP 429 otherwise) — far stricter than most sources.
        # requestsPerSecond is parsed as a Java int (HttpSourceConfig.RateLimitConfig),
        # so it cannot express "less than 1 request/sec" — a fractional value here would
        # silently truncate to 0 rather than throttling at all. retryBackoffMs is the
        # actual lever: long enough that even the first retry clears WONDER's 15s floor.
        requestsPerSecond: 1
        maxRetries: 5
        retryBackoffMs: 16000
        retryOn: [429, 500, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.health.CdcWonderCancerIncidenceResponseTransformer"

    dimensions:
      type:
        - cdc_wonder_cancer_incidence

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  - name: cdc_wonder_std_morbidity
    # Freshness gate: CDC WONDER has no version/last-modified endpoint; hash the
    # response body and skip the materialize/commit when unchanged.
    freshness:
      type: hash
    comment: >
      Sexually Transmitted Disease Morbidity (reported case counts) by state, year, and
      disease, 1984-2014, from CDC WONDER database D127. CDC WONDER stopped updating this
      database after 2014 — it is a historical archive, not a live surveillance feed; current
      STI surveillance is published outside WONDER (e.g. NCHHSTP AtlasPlus). No STI data
      exists elsewhere in govdata.
    columns:
      - name: year
        comment: "Data year, 1984-2014 (CDC WONDER's STD Morbidity database was not updated past 2014; current STI surveillance lives outside WONDER, e.g. NCHHSTP AtlasPlus)"
        type: VARCHAR
        nullable: true
      - name: state
        comment: "Reporting state/jurisdiction"
        type: VARCHAR
        nullable: true
      - name: state_fips
        comment: "State FIPS code"
        type: VARCHAR
        nullable: true
      - name: disease
        comment: "Disease category name — a rollup hierarchy (e.g. Total Syphilis is the parent of Primary and Secondary Syphilis), not a flat list; see disease_hierarchy_level"
        type: VARCHAR
        nullable: true
      - name: disease_hierarchy_level
        comment: "Depth of this disease row in the rollup hierarchy (1=top-level disease e.g. Gonorrhea/Total Syphilis; 2/3=descendants e.g. Primary and Secondary Syphilis, Primary Syphilis). Filter to one level before summing cases — parent and child rows overlap and double-count if summed together."
        type: VARCHAR
        nullable: true
      - name: cases
        comment: "Reported case count"
        type: VARCHAR
        nullable: true
      - name: population
        comment: "Population denominator used for the rate"
        type: VARCHAR
        nullable: true
      - name: rate_per_100k
        comment: "Cases per 100,000 population"
        type: VARCHAR
        nullable: true
      - name: type
        comment: "Constant record-type discriminator cdc_wonder_std_morbidity"
        type: VARCHAR
        nullable: false
    source:
      type: http
      url: "https://wonder.cdc.gov/controller/datarequest/D127"
      method: POST
      bodyFormat: FORM_URLENCODED
      headers:
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      body:
        accept_datause_restrictions: "true"
        request_xml: |
          <?xml version='1.0' encoding='utf-8'?>
          <request-parameters>
          <parameter><name>accept_datause_restrictions</name><value>true</value></parameter>
          <parameter><name>B_1</name><value>D127.V1</value></parameter>
          <parameter><name>B_2</name><value>D127.V2</value></parameter>
          <parameter><name>B_3</name><value>D127.V3</value></parameter>
          <parameter><name>B_4</name><value>*None*</value></parameter>
          <parameter><name>B_5</name><value>*None*</value></parameter>
          <parameter><name>F_D127.V5</name><value>*All*</value></parameter>
          <parameter><name>F_D127.V6</name><value>*All*</value></parameter>
          <parameter><name>F_D127.V7</name><value>*All*</value></parameter>
          <parameter><name>M_1</name><value>D127.M1</value></parameter>
          <parameter><name>M_2</name><value>D127.M2</value></parameter>
          <parameter><name>M_2</name><value>D127.M2</value></parameter>
          <parameter><name>M_3</name><value>D127.M3</value></parameter>
          <parameter><name>M_3</name><value>D127.M3</value></parameter>
          <parameter><name>O_V5_fmode</name><value>freg</value></parameter>
          <parameter><name>O_V6_fmode</name><value>freg</value></parameter>
          <parameter><name>O_V7_fmode</name><value>freg</value></parameter>
          <parameter><name>O_javascript</name><value>off</value></parameter>
          <parameter><name>O_location</name><value>D127.V2</value></parameter>
          <parameter><name>O_precision</name><value>2</value></parameter>
          <parameter><name>O_rate_per</name><value>100000</value></parameter>
          <parameter><name>O_show_totals</name><value>true</value></parameter>
          <parameter><name>O_timeout</name><value>600</value></parameter>
