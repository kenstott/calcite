          <parameter><name>V_D77.V6</name><value>00</value></parameter>
          <parameter><name>V_D77.V7</name><value>*All*</value></parameter>
          <parameter><name>V_D77.V8</name><value>*All*</value></parameter>
          <parameter><name>action-Send</name><value>Send</value></parameter>
          <parameter><name>dataset_code</name><value>D77</value></parameter>
          <parameter><name>dataset_id</name><value>D77</value></parameter>
          <parameter><name>dataset_label</name><value>Multiple Cause of Death, 1999-2020</value></parameter>
          <parameter><name>dataset_vintage</name><value>2020</value></parameter>
