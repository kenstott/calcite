  # ---------------------------------------------------------------------------
  # NFIP MULTIPLE LOSS PROPERTIES — FEMA NfipMultipleLossProperties (v1)
  # ---------------------------------------------------------------------------
  - name: nfip_multiple_loss_properties
    # Latest-snapshot table (no year axis): FEMA republishes this file periodically
    # (~annually, accrualPeriodicity R/P1Y) as a full replace, not an incremental series;
    # the hash probe skips the write when the file is unchanged since the last successful
    # run. dataset_type: snapshot makes a run that writes zero rows fail loudly instead of
    # silently marking an empty table complete.
    dataset_type: snapshot
    freshness:
      type: hash
    pattern: "type=nfip_multiple_loss_properties/*.parquet"
    partitions: *static_partitions
    comment: >
      FEMA's own property-level NFIP repetitive-loss aggregation — one row per structure
      that has ever met a Repetitive Loss (RL) or Severe Repetitive Loss (SRL) threshold
      (~240k rows), with total_losses (paid-claim count since 1978) and
      most_recent_date_of_loss per property. Ingested as the authoritative answer to "how
      concentrated are flood claims in properties that flood repeatedly": nfip_claims has
      no property/building identifier, and lat/lon (rounded to 1 decimal) or census_tract
      are both far too coarse to derive a per-property repeat-claim count from claims
      alone (many distinct properties share one rounded coordinate or tract). This table
      is FEMA's own property-level rollup, not a proxy. nfip_rl/nfip_srl are the
      insurance-claims-based categories; fma_rl/fma_srl are the separate Flood Mitigation
      Assistance grant-eligibility categories (see column comments for the exact
      thresholds) — a property can qualify under either, both, or neither pair.
      mitigated_indicator/insured_indicator reflect current status as of as_of_date, so a
      property already bought out or demolished can still appear (per FEMA's own dataset
      description). census_block_group is not carried here: FEMA's own file renders it in
      lossy scientific notation (e.g. "2.2055E+11" for a 12-digit code), destroying the
      digits after the leading county FIPS — county_fips (from fipsCountyCode, full
      precision) is the reliable location join instead. Distinct from nfip_claims
      (realized paid losses, one row per claim, not per property) and nfip_policies
      (policy-term coverage/premium transactions). Joins to geo.counties via county_fips.
      Source: fema.gov/api/open/v1/NfipMultipleLossProperties.

    dimensions:
      type:
        - nfip_multiple_loss_properties

    columns:
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-char state abbreviation
      - name: county_name
        type: string
        nullable: true
        comment: County name, as published by FEMA (e.g. "LAFAYETTE PARISH")
      - name: zip_code
        type: string
        nullable: true
        comment: Reported ZIP code
      - name: reported_city
        type: string
        nullable: true
        comment: Reported city name
      - name: community_id_number
        type: string
        nullable: true
        comment: NFIP community identifier (ties to community/CID boundary data)
      - name: community_name
        type: string
        nullable: true
        comment: NFIP community name
      - name: flood_zone
        type: string
        nullable: true
        comment: FEMA rated flood zone (AE, VE, X, etc.)
      - name: latitude
        type: double
        nullable: true
        comment: Approximate latitude (to 1 decimal per FEMA privacy rules)
      - name: longitude
        type: double
        nullable: true
        comment: Approximate longitude
      - name: occupancy_type
        type: integer
        nullable: true
        comment: Occupancy type code (1=single family, etc.)
      - name: original_construction_date
        type: date
        nullable: true
        comment: Original date of the building's construction
      - name: original_nb_date
        type: date
        nullable: true
        comment: Date of the property's original (first) NFIP flood policy
      - name: post_firm_construction_indicator
        type: boolean
        nullable: true
        comment: >
          True if construction began after the community's Flood Insurance Rate Map (FIRM)
          took effect (or after 1974-12-31, whichever governs insurance rating)
      - name: primary_residence_indicator
        type: boolean
        nullable: true
        comment: True if the structure is a primary residence
      - name: nfip_rl
        type: boolean
        nullable: true
        comment: >
          NFIP insurance-claims Repetitive Loss: 2+ paid claims (building + contents)
          each over $1,000, within any 10-year period
      - name: nfip_srl
        type: boolean
        nullable: true
        comment: >
          NFIP insurance-claims Severe Repetitive Loss: 4+ paid claims each over $5,000
          with cumulative payments over $20,000, or 2+ building-only claims with
          cumulative payments exceeding the building's market value; claims must span
          10 years
      - name: fma_rl
        type: boolean
        nullable: true
        comment: >
          Flood Mitigation Assistance grant-eligibility Repetitive Loss: 2 flood damage
          events each costing on average 25%+ of the structure's value to repair
      - name: fma_srl
        type: boolean
        nullable: true
        comment: >
          Flood Mitigation Assistance grant-eligibility Severe Repetitive Loss: same
          claim-count/dollar thresholds as nfip_srl, evaluated for FMA grant eligibility
      - name: mitigated_indicator
        type: boolean
        nullable: true
        comment: True if the property is currently mitigated (elevated, bought out, etc.) as of as_of_date
      - name: insured_indicator
        type: boolean
        nullable: true
        comment: True if the property currently carries an NFIP policy as of as_of_date
      - name: total_losses
        type: integer
        nullable: true
        comment: >
          Total paid NFIP claims over $1,000 since 1978 for this structure — FEMA's own
          caveat: may be inflated by incorrectly linked structures
      - name: most_recent_date_of_loss
        type: date
        nullable: true
        comment: Most recent date of loss for a closed NFIP claim on this structure
      - name: as_of_date
        type: date
        nullable: true
        comment: Effective date of this snapshot, as published by FEMA
      - name: id
        type: string
        nullable: false
        comment: OpenFEMA row UUID (PK)

    source:
      type: http
      url: "https://www.fema.gov/api/open/v1/NfipMultipleLossProperties"
      method: GET
      parameters:
        $orderby: "id"
        $inlinecount: "allpages"
      response:
        format: json
        dataPath: "NfipMultipleLossProperties"
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$top"
          offsetParam: "$skip"
          countPath: "metadata.count"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaNfipMultipleLossPropertiesTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=nfip_multiple_loss_properties/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: nfip_multiple_loss_properties
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # IHP HOUSING ASSISTANCE — FEMA OpenFEMA HousingAssistanceOwners / Renters (v2)
  # ---------------------------------------------------------------------------
  - name: ihp_housing_assistance_owners
    # Latest-snapshot table (no year axis): OpenFEMA republishes the full dataset as a
    # replace, and the rows carry only a disaster number (the declaration date is in
    # disaster_declarations). The hash probe skips the write when nothing changed;
    # dataset_type: snapshot makes a run that writes zero rows fail loudly.
    dataset_type: snapshot
    freshness:
      type: hash
    pattern: "type=ihp_housing_assistance_owners/*.parquet"
    partitions: *static_partitions
    comment: >
      FEMA Individuals and Households Program (IHP) housing assistance to HOMEOWNERS, one
      row per disaster number x county x city x ZIP (about 160,000 rows): valid
      registrations, FEMA inspections and the inspected damage in dollars and in bands,
      and the assistance approved (repair/replacement, rental, other needs). total_damage
      and the inspected_damage bands are FEMA's own measure of how much housing was
      damaged, which a declaration alone cannot tell (a few homes or thousands). Joins to
      disaster_declarations on disaster_number and to geo.counties on county_fips.
      county_fips is taken from the declaration of the same disaster number and county
      name in disaster_declarations' source (DisasterDeclarationsSummaries designated
      areas), which is how FEMA spells the area; it is null for tribal areas (FEMA gives
      them no county) and for area names no declaration lists, and those rows still carry
      the ZIP code to join geo.zip_county_crosswalk. The county is as the applicant reported
      it (the system infers it from the address and the applicant may override it).
      Aggregate to county with GROUP BY disaster_number, county_fips; the view
      disasters_ihp_housing_by_county does that for owners and renters together. Declared
      disasters from DR-1439 (November 2002) on; only registrations in Individual Assistance
      declared counties appear, so a county that was not IA-declared has no row. Source:
      fema.gov/api/open/v2/HousingAssistanceOwners.

    dqRowLimit: 200000

    dimensions:
      type:
        - ihp_housing_assistance_owners

    columns:
      - name: disaster_number
        type: integer
        nullable: true
        comment: 'FEMA disaster number (FK to disaster_declarations.disaster_number)'
      - name: state_abbr
        type: string
        nullable: true
        comment: '2-letter USPS state abbreviation of the state where the disaster was declared (FK to geo.state_ref)'
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: county_name
        type: string
        nullable: true
        comment: 'County as FEMA spells it, with its type in parentheses (for example Aransas (County), Orleans (Parish), San Juan (Municipio))'
      - name: city
        type: string
        nullable: true
        comment: 'City of the registrant address'
      - name: zip_code
        type: string
        nullable: true
        comment: '5-digit ZIP code of the registrant address (FK to geo.zcta_ref)'
      - name: valid_registrations
        type: integer
        nullable: true
        comment: >-
          Valid FEMA registrations by owners in this disaster, county and ZIP (a valid
          registration is in an Individual Assistance declared county and inside the
          registration period)
      - name: average_inspected_damage
        type: double
        nullable: true
        comment: 'Average FEMA-inspected damage (USD) of the owners in this row who had a completed inspection'
      - name: total_inspected
        type: integer
        nullable: true
        comment: 'Owners in this row who received a FEMA inspection'
      - name: total_damage
        type: double
        nullable: true
        comment: 'Total damage recorded at the latest inspection (USD): FEMA Verified Loss on the home plus personal property; transportation damage not included'
      - name: inspected_no_damage
        type: integer
        nullable: true
        comment: 'Inspected owners with no damage recorded'
      - name: inspected_damage_1_to_10000
        type: integer
        nullable: true
        comment: 'Inspected owners with FEMA-inspected damage between $1 and $10,000'
      - name: inspected_damage_10001_to_20000
        type: integer
        nullable: true
        comment: 'Inspected owners with FEMA-inspected damage between $10,001 and $20,000'
      - name: inspected_damage_20001_to_30000
        type: integer
        nullable: true
        comment: 'Inspected owners with FEMA-inspected damage between $20,001 and $30,000'
      - name: inspected_damage_over_30000
        type: integer
        nullable: true
        comment: 'Inspected owners with FEMA-inspected damage over $30,000'
      - name: approved_for_assistance
        type: integer
        nullable: true
        comment: 'Applicants approved for IHP assistance'
      - name: total_approved_ihp_amount
        type: double
        nullable: true
        comment: 'Total IHP assistance approved (USD), housing assistance plus other needs'
      - name: repair_replace_amount
        type: double
        nullable: true
        comment: 'Repair and replacement assistance approved (USD)'
      - name: rental_amount
        type: double
        nullable: true
        comment: 'Rental assistance approved (USD)'
      - name: other_needs_amount
        type: double
        nullable: true
        comment: 'Other Needs Assistance approved (USD): personal property, transportation, medical, dental, funeral, tools, moving and storage'
      - name: approved_1_to_10000
        type: integer
        nullable: true
        comment: 'Registrations granted between $1 and $10,000'
      - name: approved_10001_to_25000
        type: integer
        nullable: true
        comment: 'Registrations granted between $10,001 and $25,000'
      - name: approved_25001_to_max
        type: integer
        nullable: true
        comment: 'Registrations granted between $25,001 and the maximum grant'
      - name: total_max_grants
        type: integer
        nullable: true
        comment: 'Registrations granted the maximum IHP grant'
      - name: id
        type: string
        nullable: false
        comment: OpenFEMA row UUID (PK)

    source:
      type: http
      url: "https://www.fema.gov/api/open/v2/HousingAssistanceOwners"
      method: GET
      parameters:
        $orderby: "id"
        $inlinecount: "allpages"
      response:
        format: json
        dataPath: "HousingAssistanceOwners"
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$top"
          offsetParam: "$skip"
          countPath: "metadata.count"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
        # One run pages 148,000-161,000 rows (about 160 requests) and OpenFEMA answers 503
        # (its "technical difficulties" page) for 20-60 seconds at a time; the default 1 s
        # backoff exhausts all retries inside one outage (observed 2026-10-16).
        retryBackoffMs: 15000
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaHousingAssistanceOwnersTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=ihp_housing_assistance_owners/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: ihp_housing_assistance_owners
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        overwritePartitions: true

