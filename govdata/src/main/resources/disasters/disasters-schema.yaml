      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: fema_nri_earthquake_by_county
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        overwritePartitions: true

# ============================================================================
# CONSTRAINTS
# ============================================================================
# PKs are the OpenFEMA row identifiers (id / hash) which are globally unique,
# and source-native ids for NOAA/WFIGS. FKs point to the geo dimension tables
# (states/counties). disaster_number is intentionally NOT a declared FK to
# disaster_declarations: it is not unique there (one disaster has many
# county/program rows), so it is a join key, not a referential parent.
# ============================================================================

constraints:

  disaster_declarations:
    primaryKey: [id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  public_assistance_projects:
    primaryKey: [hash]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  hazard_mitigation_projects:
    primaryKey: [project_identifier]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  nfip_claims:
    primaryKey: [id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [reported_zip_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: zcta_ref
        targetColumns: [zcta]
        comment: 5-digit reported ZIP to the conformed ZCTA dimension

  nfip_policies:
    primaryKey: [id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]
      - columns: [reported_zip_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: zcta_ref
        targetColumns: [zcta]
        comment: 5-digit reported ZIP to the conformed ZCTA dimension

  storm_events:
    primaryKey: [event_id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  wildfire_perimeters:
    primaryKey: [incident_id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  fema_nri_earthquake_by_county:
    primaryKey: [county_fips]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  wildfire_risk_by_county:
    primaryKey: [county_fips]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: disasters_declarations_by_state_year
    comment: >
      Annual disaster-declaration counts by state, incident_type, and year —
      disaster_count plus counts of declarations with IA (Individual
      Assistance, sourced from ih_program_declared - see disaster_declarations'
      own column comment, D-285: the source field behind ia_program_declared
      itself is dead at FEMA) and PA (Public Assistance) programs declared.
      Aggregates the county-program rows in disaster_declarations to distinct
      disasters per state/year/incident_type. Ready to join sec.filing_metadata
      on state for risk-disclosure research.
    sql: >
      SELECT
        d.year,
        d.state_fips,
        d.incident_type,
        COUNT(DISTINCT d.disaster_number)  AS disaster_count,
        SUM(CASE WHEN d.ih_program_declared THEN 1 ELSE 0 END) AS ia_declarations,
        SUM(CASE WHEN d.pa_program_declared THEN 1 ELSE 0 END) AS pa_declarations
      FROM disaster_declarations d
      GROUP BY d.year, d.state_fips, d.incident_type

  - name: disasters_pa_obligated_by_county
    comment: >
      Public Assistance federal obligations aggregated by county, incident_type,
      and declaration year — project_count, total_project_amount, and
      total_federal_obligated (USD). Joins to geo.counties for mapping; a
      natural next join is to econ employment data for disaster-affected
      labor-market analysis.
    sql: >
      SELECT
        p.year,
        p.state_fips,
        p.county_fips,
        p.incident_type,
        COUNT(*)                          AS project_count,
        SUM(p.project_amount)             AS total_project_amount,
        SUM(p.federal_share_obligated)    AS total_federal_obligated
      FROM public_assistance_projects p
      GROUP BY p.year, p.state_fips, p.county_fips, p.incident_type

  - name: disasters_nfip_claims_by_county
    comment: >
      Paid NFIP flood claims aggregated by county and year of loss —
      claim_count, total_paid_building, total_paid_contents, and total_paid
      (USD). Key measure of insured flood loss; joins to disaster_declarations
      and wildfire_perimeters by county for post-event exposure analysis.
    sql: >
      SELECT
        c.year,
        c.state_fips,
        c.county_fips,
        COUNT(*)                          AS claim_count,
        SUM(c.amount_paid_building)       AS total_paid_building,
        SUM(c.amount_paid_contents)       AS total_paid_contents,
        SUM(c.amount_paid_building + c.amount_paid_contents) AS total_paid
      FROM nfip_claims c
      GROUP BY c.year, c.state_fips, c.county_fips

  - name: disasters_storm_impact_by_county
    comment: >
      Storm-event human and economic impact aggregated by county and year —
      event_count, total_deaths, total_injuries, total_property_damage, and
      total_crop_damage (USD). Joins to disaster_declarations by county to
      link storm episodes to FEMA declarations, and to econ employment data
      for economic-impact research.
    sql: >
      SELECT
        s.year,
        s.state_fips,
        s.county_fips,
        COUNT(*)                          AS event_count,
        SUM(s.deaths_direct + s.deaths_indirect)     AS total_deaths,
        SUM(s.injuries_direct + s.injuries_indirect) AS total_injuries,
        SUM(s.damage_property)            AS total_property_damage,
        SUM(s.damage_crops)               AS total_crop_damage
      FROM storm_events s
      GROUP BY s.year, s.state_fips, s.county_fips
