  # ---------------------------------------------------------------------------
  # STORM EVENTS — NOAA NCEI Storm Events bulk CSV.gz (streaming, per year)
  # ---------------------------------------------------------------------------
  - name: storm_events
    pattern: "type=storm_events/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2004
      maxYear: 2026
      distinctYears: 23
      contiguous: true
      rowCount: 1427137
      checkedAt: "2026-10-15T11:34:06Z"
    partitions: *standard_partitions
    comment: >
      NOAA NCEI Storm Events Database — one row per storm event detail record
      (tornadoes, floods, hurricanes, hail, winter storms, wildfires, etc.)
      with event magnitude, direct/indirect deaths and injuries, and
      property/crop damage (damage_property, damage_crops; converted from
      K/M/B notation to USD). Partitioned by year, streamed from the per-year
      NCEI gzip CSV. Joins to geo.counties and to disaster_declarations by
      county+date overlap.

      state_fips/county_fips (D-284): NOAA's own STATE_FIPS uses 4 non-standard codes for
      Puerto Rico/Virgin Islands/Guam/American Samoa (99/96/98/97) instead of their real
      Census FIPS (72/78/66/60) — remapped so these join geo.state_ref like every other state.
      Confirmed live this also recovers county_fips for Puerto Rico and the Virgin Islands
      specifically (their CZ_FIPS values are real Census municipio/district codes once paired
      with the corrected state code — 7,905/7,905 and 60/60 county-type rows now join
      geo.counties). Guam and American Samoa's CZ_FIPS values are NOT real Census codes even
      after the state remap (e.g. Guam's storm_events rows use "002"/"003"/"006", but
      geo.counties only carries a single unified "66010"; American Samoa uses "002"/"003"
      against geo.counties' real five-district "010"-"050") — NOAA evidently numbers these two
      territories' zones on its own internal scheme with no Census county-equivalent mapping.
      Puerto Rico has a smaller, closed variant of the same problem: 6 codes
      (72002/72004/72006/72008/72010/72012, 331 rows total across 2004-2008 only) are NWS
      PR public-zone codes NCEI stamped as CZ_TYPE='C' rather than 'Z' — interleaved with real
      odd-numbered municipio FIPS (72001, 72003, ...) in the same 2004-2008 window before NCEI
      switched to real-FIPS-only from 2009 onward. Because a zone spans multiple municipios
      there is no 1:1 remap that could recover a real municipio code from a zone code, so
      StormEventsStreamingTransformer explicitly nulls county_fips for these 6 values instead
      of emitting an unresolvable FIPS.
      A second, unrelated residual: for a small number of county-type rows in the 50 states
      (confirmed live: 72 in Alaska across this table's full history, 49 in Georgia isolated to
      Jan-2025-published rows, 1 in Louisiana), CZ_FIPS itself doesn't match any real county
      FIPS at all — e.g. Georgia's early-2025 batch pairs real county names like "WALKER" with
      CZ_FIPS values ("2", "4", "6"...) that belong to no actual Georgia county. Confirmed this
      is wrong in NOAA's own published file, not an artifact of this ingest. Neither residual has
      a crosswalk that recovers the correct FIPS from what NOAA actually published; a LEFT JOIN
      to geo.counties silently drops these rows, expect the gap rather than treating it as a
      join bug.

    dimensions:
      type:
        - storm_events
      year: *storm_year_range

    columns:
      - name: event_id
        type: string
        nullable: false
        comment: NCEI event id (PK)
      - name: episode_id
        type: string
        nullable: true
        comment: Episode id (groups related events)
      - name: begin_date
        type: date
        nullable: true
        comment: Event begin date
      - name: end_date
        type: date
        nullable: true
        comment: Event end date
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: state_name
        type: string
        nullable: true
        comment: State name (as published by NCEI)
      - name: event_type
        type: string
        nullable: true
        comment: Tornado / Flash Flood / Hurricane / Blizzard / etc.
      - name: cz_type
        type: string
        nullable: true
        comment: C (county), Z (NWS zone), M (marine)
      - name: magnitude
        type: double
        nullable: true
        comment: Event magnitude (wind speed, hail size; type-dependent)
      - name: magnitude_type
        type: string
        nullable: true
        comment: EG/ES/MS/MG magnitude type
      - name: injuries_direct
        type: integer
        nullable: true
        comment: Direct injuries
      - name: injuries_indirect
        type: integer
        nullable: true
        comment: Indirect injuries
      - name: deaths_direct
        type: integer
        nullable: true
        comment: Direct fatalities
      - name: deaths_indirect
        type: integer
        nullable: true
        comment: Indirect fatalities
      - name: damage_property
        type: double
        nullable: true
        comment: Property damage USD (converted from K/M/B notation)
      - name: damage_crops
        type: double
        nullable: true
        comment: Crop damage USD (converted from K/M/B notation)
      - name: begin_lat
        type: double
        nullable: true
        comment: Event begin latitude
      - name: begin_lon
        type: double
        nullable: true
        comment: Event begin longitude

    source:
      type: http
      url: "https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.StormEventsStreamingTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=storm_events/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: storm_events
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # WILDFIRE PERIMETERS — NIFC WFIGS ArcGIS (streaming: resultOffset + geometry)
  # ---------------------------------------------------------------------------
  - name: wildfire_perimeters
    timeColumn: fire_year  # observation time; this table has no column named 'year'
    pattern: "type=wildfire_perimeters/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2016
      maxYear: 2026
      distinctYears: 10
      contiguous: false
      years: [2016, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
      rowCount: 42671
      checkedAt: "2026-10-17T14:00:00Z"
    partitions: *static_partitions
    comment: >
      NIFC WFIGS Interagency wildfire perimeters — one row per fire perimeter
      (~39k features) with a simplified WGS84 perimeter polygon (geometry_wkt),
      gis_acres/incident_size_acres/final_acres burned area, fire_cause (Human / Natural /
      Undetermined), and point-of-origin land ownership (landowner_kind:
      Federal / Private / Other; landowner_category: USFS, BLM, NPS, BIA,
      State, Tribal, City, County, etc.) and jurisdictional_agency — enabling
      federal-vs-nonfederal burn comparisons directly from this table. Snapshot
      table with no year partition (refreshed via overwritePartitions);
      fire_year is derived from the fire discovery date. Coverage follows the
      WFIGS layer, which is complete only from fire_year 2020 (about 4k-8k
      perimeters a year); 2016-2019 hold a handful of features in total, so
      this is not a national multi-decade history. Use gis_acres, not
      final_acres, for burned-area totals: final_acres is set only on certified
      final perimeters (under 20% of rows in any year). Joins to geo.counties
      via county_fips (from point-of-origin FIPS) and to nfip_claims for
      post-fire flood exposure. Source:
      WFIGS_Interagency_Perimeters/FeatureServer/0.

    dimensions:
      type:
        - wildfire_perimeters

    columns:
      - name: incident_id
        type: string
        nullable: false
        comment: WFIGS IRWIN id (PK)
      - name: incident_name
        type: string
        nullable: true
        comment: Fire incident name
      - name: unique_fire_identifier
        type: string
        nullable: true
        comment: NIFC unique fire identifier (year-unit-localnumber)
      - name: fire_year
        type: integer
        nullable: true
        comment: Year derived from fire discovery date
      - name: discovery_date
        type: date
        nullable: true
        comment: Fire discovery datetime (date part)
      - name: containment_date
        type: date
        nullable: true
        comment: Containment datetime (date part; null if active)
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: poo_state
        type: string
        nullable: true
        comment: Point-of-origin state (2-char abbreviation)
      - name: landowner_kind
        type: string
        nullable: true
        comment: >
          Point-of-origin land ownership, top-level (Federal / Private / Other),
          from WFIGS attr_POOLandownerKind — the field a federal-vs-nonfederal
          wildfire comparison should filter/group on.
      - name: landowner_category
        type: string
        nullable: true
        comment: >
          Point-of-origin land ownership, agency-level detail (USFS, BLM, NPS,
          BIA, State, Private, Tribal, City, County, DOD, BOR, DOE, USFWS, etc.),
          from WFIGS attr_POOLandownerCategory.
      - name: jurisdictional_agency
        type: string
        nullable: true
        comment: >
          Agency with fire-management jurisdiction at point of origin (may
          differ from landowner_category under cooperative protection
          agreements), from WFIGS attr_POOJurisdictionalAgency.
      - name: fire_cause
        type: string
        nullable: true
        comment: Human / Natural / Undetermined
      - name: incident_type_category
        type: string
        nullable: true
        comment: WF (wildfire), RX (prescribed), etc.
      - name: gis_acres
        type: double
        nullable: true
        comment: >
          GIS-calculated perimeter area in acres — the populated burned-area
          measure (about 70-99% of rows for fire_year 2020 onward); null where
          the source has no polygon area (about 31% of fire_year 2020
          wildfires); use incident_size_acres where gis_acres is null. Includes
          prescribed burns (incident_type_category RX); filter to WF for
          wildfire totals.
      - name: incident_size_acres
        type: double
        nullable: true
        comment: >
          Incident size in acres as reported on the incident record
          (attr_IncidentSize) — populated on about 99% of wildfire (WF) rows,
          including those with no polygon area, so it is the complete-coverage
          burned-area measure. It is the reported incident size, not a
          geometry-derived area, so it can differ from gis_acres.
          COALESCE(gis_acres, incident_size_acres) fills the gaps.
      - name: final_acres
        type: double
        nullable: true
        comment: >
          Final fire size in acres, set by WFIGS only on certified final
          perimeters — null on most rows (under 20% populated in every fire_year), so
          SUM(final_acres) understates burned area by orders of magnitude; use
          gis_acres for totals.
      - name: centroid_lat
        type: double
        nullable: true
        comment: Perimeter centroid latitude (WGS84)
      - name: centroid_lon
        type: double
        nullable: true
        comment: Perimeter centroid longitude (WGS84)
      - <<: *geometry_wkt_column

    source:
      type: http
      url: "https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Interagency_Perimeters/FeatureServer/0/query"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
