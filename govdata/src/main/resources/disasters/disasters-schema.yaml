      per disaster number x county (about 11,000 rows over the 634 disasters from DR-1439,
      November 2002, on), from OpenFEMA IndividualsAndHouseholdsProgramValidRegistrations v2
      (26.2 million registration-level rows). Per row: registrations and their split by
      owner/renter, primary residence, reported home damage, destroyed, flood damage and
      FEMA inspection; eligibility and award counts for IHP, Housing Assistance, Other Needs
      Assistance, SBA, Transitional Sheltering; homeowner and flood insurance; the
      self-reported gross income bands and household size; and the dollars awarded, FEMA
      verified loss and unmet need. Adds to ihp_housing_assistance_owners/_renters (which
      are disaster x county x city x ZIP, keyed on FEMA's area name): income bands,
      insurance, household size, awards by type, destroyed and unmet need exist only here;
      the county is the damaged dwelling's own county, so a tribal area's registrations are
      assigned to the counties they sit in (the owners/renters tables leave those with a
      null county); and the registrations are not limited to the rows the housing-assistance
      tables publish. Joins to disaster_declarations on disaster_number and to geo.counties
      on county_fips. county_fips is the registration's own fips; about 3 percent of the
      registrations (whole counties of some disasters) carry none and take the code from
      the declaration of the same disaster number, state and area name (counted in
      fips_from_declaration_registrations); those a declaration does not resolve to one
      county have a null county_fips and one row per state and area name (80 rows, 1.0
      percent of registrations). Nearly all of those are FEMA's catch-all disaster numbers
      6001, 6405, 6501, 6502 and 9801-9808 (about 264,000 registrations, 1.0 percent, among
      them 199,864 in Camden County GA under DR-6502): they have no declaration, so they
      join to nothing in disaster_declarations and carry dates that do not match a disaster.
      Only registrations in Individual Assistance declared counties appear. Amounts are sums over registrations and are 0, never null,
      when nothing was awarded. Source: the OpenFEMA bulk Parquet file of the dataset
      (fema.gov/about/reports-and-data/openfema/v2/
      IndividualsAndHouseholdsProgramValidRegistrationsV2.parquet), aggregated with DuckDB.

