# ============================================================================
# U.S. Disasters Schema (DISASTERS)
# ============================================================================
# Data Sources:
#   - FEMA OpenFEMA API (disaster declarations, public assistance, hazard
#     mitigation, NFIP flood insurance policies and claims) — free, no key
#   - NOAA NCEI Storm Events bulk CSV (per-year .csv.gz)
#   - NIFC WFIGS Interagency Perimeters ArcGIS FeatureServer (wildfire polygons)
#
# Design principles (see govdata-schema-authoring):
#   - One ETL table = one raw source. No multi-source transformers.
#   - FEMA tables page via the engine-native OFFSET paginator ($top/$skip);
#     each year is a separate windowed fetch so the partition `year` is supplied
#     by the `year` dimension (no derived-year column, no engine changes).
#   - storm_events and wildfire_perimeters use StreamingResponseTransformer:
#     a single huge response (NOAA .csv.gz; 38k WFIGS polygons over the ArcGIS
#     transfer cap) is streamed row-by-row to bound heap at O(chunk).
#   - Geometry is converted from Esri rings to WKT via JTS (EsriGeometryConverter);
#     geometry_wkt is a plain VARCHAR (project convention).
#   - Cross-schema joins to geo (states/counties), sec, econ, fec, lands.
# ============================================================================

schemaName: "${SCHEMA_NAME:disasters}"
dataLagYears: 0
materializeDirectory: "${GOVDATA_PARQUET_DIR}"

comment: >
  U.S. discrete emergency-event data: FEMA disaster declarations, Public
  Assistance and Hazard Mitigation grant projects, NFIP flood-insurance
  policies and paid claims, NOAA storm events, and NIFC WFIGS wildfire
  perimeters. Each row is a bounded incident with a date, geographic footprint,
  and measurable damage — distinct from the continuous meteorological
  measurements in the weather schema. Enables disaster-risk analysis joined to
  SEC filings (state-of-incorporation exposure), econ employment, lands national
  forests (burned NF acreage), and FEC contributions.

# ============================================================================
# COLUMN TEMPLATES
# ============================================================================

column_templates:

  state_fips_column: &state_fips_column
    name: state_fips
    type: string
    nullable: true
    comment: 2-digit state FIPS code (FK to geo.states)

  county_fips_column: &county_fips_column
    name: county_fips
    type: string
    nullable: true
    comment: 5-digit county FIPS code (FK to geo.counties)

  disaster_number_column: &disaster_number_column
    name: disaster_number
    type: integer
    nullable: true
    comment: FEMA disaster number (e.g., 4611); join key across FEMA tables

  geometry_wkt_column: &geometry_wkt_column
    name: geometry_wkt
    type: string
    nullable: true
    comment: Simplified WGS84 perimeter polygon as WKT (display/spatial join)

  partition_type: &partition_type
    name: type
    type: VARCHAR

  partition_year: &partition_year
    name: year
    type: INTEGER

  standard_partitions: &standard_partitions
    style: hive
    columnDefinitions:
      - *partition_type
      - *partition_year

  static_partitions: &static_partitions
    style: hive
    columnDefinitions:
      - *partition_type

# ============================================================================
# DIMENSION VALUES
# ============================================================================

dimension_values:

  # FEMA declarations / PA / HMGP / NFIP claims — annual windows, no publish lag.
  disasters_year_range: &disasters_year_range
    type: yearRange
    start: "${GOVDATA_START_YEAR:2010}"
    end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
    dataLag: 0

  # NOAA finalizes prior years ~3 months after year-end; current year is
  # provisional and refreshed. dataLag 0 (current-year file exists and is useful).
  # Floor is 2004, not the global GOVDATA_START_YEAR default: NOAA's own bulk
  # Storm Events CSV archive (ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/)
  # publishes per-year files back to 1950, with reliable county-level
  # attribution across all event types from the early 1990s onward and
  # certainly complete by 2004.
  storm_year_range: &storm_year_range
    type: yearRange
    start: "${GOVDATA_START_YEAR:2004}"
    end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
    dataLag: 0

# ============================================================================
# PARTITIONED TABLES
# ============================================================================

partitionedTables:

  # ---------------------------------------------------------------------------
  # DISASTER DECLARATIONS — FEMA OpenFEMA DisasterDeclarationsSummaries (v2)
  # ---------------------------------------------------------------------------
  - name: disaster_declarations
    pattern: "type=disaster_declarations/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2026
      distinctYears: 17
      contiguous: true
      rowCount: 32853
      checkedAt: "2026-09-11T00:02:08Z"
    partitions: *standard_partitions
    comment: >
      Canonical FEMA disaster-declaration record. One row per
      disaster-declaration-county-program-area combination. Partitioned by
      fiscal year declared (fyDeclared). Joins to geo.counties via county_fips
      and to sec.filing_metadata by state for risk-disclosure research. Refreshed
      daily (declarations issued continuously within 24h of signature).
      Source: fema.gov/api/open/v2/DisasterDeclarationsSummaries.

    dimensions:
      type:
        - disaster_declarations
      year: *disasters_year_range

    columns:
      - <<: *disaster_number_column
        nullable: false
      - name: fema_declaration_string
        type: string
        nullable: true
        comment: Composite declaration id (e.g., 'EM-3610-PR')
      - name: declaration_type
        type: string
        nullable: true
        comment: DR (major), EM (emergency), FM (fire mgmt), FS (fire suppression)
      - name: declaration_title
        type: string
        nullable: true
        comment: Declaration title (e.g., 'TROPICAL STORM ERNESTO')
      - name: declaration_date
        type: date
        nullable: true
        comment: Date of presidential declaration
      - name: incident_type
        type: string
        nullable: true
        comment: Hurricane / Flood / Tornado / Wildfire / Severe Storm / etc.
      - name: incident_begin_date
        type: date
        nullable: true
        comment: Start of incident period
      - name: incident_end_date
        type: date
        nullable: true
        comment: End of incident period (null if ongoing)
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: designated_area
        type: string
        nullable: true
        comment: Human-readable designated area (e.g., 'Adjuntas (Municipio)')
      - name: region
        type: integer
        nullable: true
        comment: FEMA region number (1-10)
      - name: ih_program_declared
        type: boolean
        nullable: true
        comment: >
          Individuals and Households Program declared — use this column for "was individual
          assistance activated," not ia_program_declared (D-285). FEMA's modern program name
          for the same concept individual filers know as "Individual Assistance"; confirmed
          live it varies genuinely with real disasters (e.g. true for Hurricane Harvey
          DR-4332-TX, which also carries a real lastIAFilingDate).
      - name: ia_program_declared
        type: boolean
        nullable: true
        comment: >
          Source field iaProgramDeclared is FALSE for every row FEMA's API currently returns
          (confirmed live across hundreds of declarations spanning 2012-2026, including
          disasters unambiguously IA-activated in reality, e.g. Hurricane Harvey) — the field
          reads as dead/unpopulated at the source itself, not an ingest bug (D-285). Use
          ih_program_declared for a real individual-assistance signal; this column is kept
          only because it's still present in the raw feed, not because it carries information.
      - name: pa_program_declared
        type: boolean
        nullable: true
        comment: Public Assistance declared
      - name: hm_program_declared
        type: boolean
        nullable: true
        comment: Hazard Mitigation declared
      - name: tribal_request
        type: boolean
        nullable: true
        comment: Whether the declaration was a tribal request
      - name: id
        type: string
        nullable: false
        comment: OpenFEMA row UUID (PK)

    source:
      type: http
      url: "https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries"
      method: GET
      parameters:
        $filter: "fyDeclared eq {year}"
        $orderby: "id"
        $inlinecount: "allpages"
      response:
        format: json
        dataPath: "DisasterDeclarationsSummaries"
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$top"
          offsetParam: "$skip"
          countPath: "metadata.count"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaDisasterDeclarationsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=disaster_declarations/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: disaster_declarations
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # PUBLIC ASSISTANCE PROJECTS — FEMA PublicAssistanceFundedProjectsDetails (v2)
  # ---------------------------------------------------------------------------
  - name: public_assistance_projects
    pattern: "type=public_assistance_projects/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2026
      distinctYears: 17
      contiguous: true
      rowCount: 404509
      checkedAt: "2026-09-11T00:02:09Z"
    partitions: *standard_partitions
    comment: >
      FEMA Public Assistance grants to state/local governments and nonprofits
      for disaster recovery — approved project_amount, federal_share_obligated,
      and total_obligated (USD) per funded project worksheet. Largest
      dollar-value FEMA dataset; one row per project worksheet, partitioned by
      declaration year. Joins to disaster_declarations by disaster_number
      (many-to-one; not a declared FK) and to geo.counties via county_fips.
      Source: fema.gov/api/open/v2/PublicAssistanceFundedProjectsDetails.

    dimensions:
      type:
        - public_assistance_projects
      year: *disasters_year_range

    columns:
      - <<: *disaster_number_column
      - name: pw_number
        type: integer
        nullable: true
        comment: Project worksheet number
      - name: application_title
        type: string
        nullable: true
        comment: Project title
      - name: applicant_id
        type: string
        nullable: true
        comment: FEMA applicant id
      - name: declaration_date
        type: date
        nullable: true
        comment: Date of declaration (drives the year partition)
      - name: incident_type
        type: string
        nullable: true
        comment: Incident type (Hurricane, Flood, etc.)
      - name: damage_category_code
        type: string
        nullable: true
        comment: FEMA damage category code (A-G)
      - name: damage_category
        type: string
        nullable: true
        comment: Damage category description
      - name: project_status
        type: string
        nullable: true
        comment: Active / Closed / etc.
      - name: project_size
        type: string
        nullable: true
        comment: Large or Small
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: county_name
        type: string
        nullable: true
        comment: County/parish name
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-char state abbreviation
      - name: project_amount
        type: double
        nullable: true
        comment: Approved project cost (USD)
      - name: federal_share_obligated
        type: double
        nullable: true
        comment: Federal obligation to date (USD)
      - name: total_obligated
        type: double
        nullable: true
        comment: Total obligated incl. non-federal share (USD)
      - name: hash
        type: string
        nullable: false
        comment: OpenFEMA row hash (PK)

    source:
      type: http
      url: "https://www.fema.gov/api/open/v2/PublicAssistanceFundedProjectsDetails"
      method: GET
      parameters:
        $filter: "declarationDate ge '{year}-01-01T00:00:00.000z' and declarationDate le '{year}-12-31T23:59:59.999z'"
        $orderby: "hash"
        $inlinecount: "allpages"
      response:
        format: json
        dataPath: "PublicAssistanceFundedProjectsDetails"
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$top"
          offsetParam: "$skip"
          countPath: "metadata.count"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaPublicAssistanceTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=public_assistance_projects/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: public_assistance_projects
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # HAZARD MITIGATION PROJECTS — FEMA HazardMitigationAssistanceProjects (v4)
  # ---------------------------------------------------------------------------
  - name: hazard_mitigation_projects
    pattern: "type=hazard_mitigation_projects/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2025
      distinctYears: 16
      contiguous: true
      rowCount: 30853
      checkedAt: "2026-09-11T00:02:10Z"
    partitions: *standard_partitions
    comment: >
      FEMA Hazard Mitigation Assistance projects (program_area: HMGP, BRIC,
      FMA, PDM, LPDM) — pre- and post-disaster resilience investment with
      project_amount, federal_share_obligated, and cost_share_percentage per
      project. One row per project, partitioned by program fiscal year
      (programFy). Joins to geo.counties via county_fips and to
      disaster_declarations by disaster_number (nullable for non-disaster
      BRIC/FMA programs). Source (API v4):
      fema.gov/api/open/v4/HazardMitigationAssistanceProjects.

    dimensions:
      type:
        - hazard_mitigation_projects
      year: *disasters_year_range

    columns:
      - name: project_identifier
        type: string
        nullable: false
        comment: HMA project identifier (PK; e.g., 'DR-1980-0019-F')
      - name: program_area
        type: string
        nullable: true
        comment: HMGP / BRIC / FMA / PDM / LPDM
      - <<: *disaster_number_column
      - name: region
        type: integer
        nullable: true
        comment: FEMA region number
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: state_name
        type: string
        nullable: true
        comment: State name
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: project_type
        type: string
        nullable: true
        comment: Mitigation project type description
      - name: status
        type: string
        nullable: true
        comment: Project status (Approved / Closed / etc.)
      - name: recipient
        type: string
        nullable: true
        comment: Grant recipient (state/tribe)
      - name: subrecipient
        type: string
        nullable: true
        comment: Subrecipient (local government/entity)
      - name: date_approved
        type: date
        nullable: true
        comment: Date approved
      - name: date_closed
        type: date
        nullable: true
        comment: Date closed (null if open)
      - name: project_amount
        type: double
        nullable: true
        comment: Total project cost (USD)
      - name: federal_share_obligated
        type: double
        nullable: true
        comment: Federal share obligated (USD)
      - name: cost_share_percentage
        type: double
        nullable: true
        comment: Federal cost-share fraction (e.g., 0.75)

    source:
      type: http
      url: "https://www.fema.gov/api/open/v4/HazardMitigationAssistanceProjects"
      method: GET
      parameters:
        $filter: "programFy eq {year}"
        $orderby: "id"
        $inlinecount: "allpages"
      response:
        format: json
        dataPath: "HazardMitigationAssistanceProjects"
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$top"
          offsetParam: "$skip"
          countPath: "metadata.count"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaHazardMitigationTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=hazard_mitigation_projects/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: hazard_mitigation_projects
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # NFIP CLAIMS — FEMA FimaNfipClaims (v2)
  # ---------------------------------------------------------------------------
  - name: nfip_claims
    pattern: "type=nfip_claims/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2026
      distinctYears: 17
      contiguous: true
      rowCount: 1009346
      checkedAt: "2026-09-11T00:02:12Z"
    partitions: *standard_partitions
    comment: >
      Paid NFIP flood-insurance claims — amount_paid_building,
      amount_paid_contents, and amount_paid_icc per claim, plus
      total_building_coverage/total_contents_coverage for exposure context.
      One row per claim, partitioned by year of loss. Distinct from
      nfip_policies (policy-term coverage/premium transactions, not realized
      losses). Joins to geo.counties via county_fips and to
      disaster_declarations / wildfire_perimeters by county+date overlap.
      Source: fema.gov/api/open/v2/FimaNfipClaims.

      DEPRECATION WARNING (confirmed live 2026-09-11, D-283): OpenFEMA has deprecated this
      exact endpoint - its own API response metadata states the dataset is frozen (no further
      updates) since 2026-06-01 and will stop being served entirely after 2026-10-15, in favor
      of a renamed v3 dataset ("nfip-redacted-claims-v3", FIMA prefix dropped). Migrating this
      table's source URL/schema to the v3 dataset before that date is a separate, tracked
      follow-up - incremental updates will silently stop working once the old endpoint is
      pulled, though history already materialized here is unaffected.

    dimensions:
      type:
        - nfip_claims
      # Own floor, not *disasters_year_range (D-283): NFIP's own program history predates
      # most of this schema's siblings that share that anchor by decades. Confirmed live
      # against fema.gov/api/open/v2/FimaNfipClaims: real claim rows exist back to 1978
      # (the earliest yearOfLoss the API returns at all), not just the 2010 default. Do not
      # widen the shared anchor itself for this - disaster_declarations/hazard_mitigation/
      # public_assistance's real program-start floors were not verified here and are likely
      # different (later) than NFIP's.
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:1978}"
        minYear: 1978
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 0

    columns:
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-char state abbreviation
      - name: date_of_loss
        type: date
        nullable: true
        comment: Date of flood loss
      - name: flood_zone
        type: string
        nullable: true
        comment: FEMA rated flood zone (AE, VE, X, etc.)
      - name: cause_of_damage
        type: string
        nullable: true
        comment: Cause-of-damage code
      - name: occupancy_type
        type: integer
        nullable: true
        comment: Occupancy type code (1=single family, etc.)
      - name: policy_count
        type: integer
        nullable: true
        comment: Number of policies represented by this claim record
      - name: amount_paid_building
        type: double
        nullable: true
        comment: Amount paid on building claim (USD)
      - name: amount_paid_contents
        type: double
        nullable: true
        comment: Amount paid on contents claim (USD)
      - name: amount_paid_icc
        type: double
        nullable: true
        comment: Amount paid on Increased Cost of Compliance claim (USD)
      - name: total_building_coverage
        type: double
        nullable: true
        comment: Total building insurance coverage (USD)
      - name: total_contents_coverage
        type: double
        nullable: true
        comment: Total contents insurance coverage (USD)
      - name: census_tract
        type: string
        nullable: true
        comment: 11-digit census tract FIPS
      - name: reported_zip_code
        type: string
        nullable: true
        comment: Reported ZIP code
      - name: latitude
        type: double
        nullable: true
        comment: Approximate latitude (to 1 decimal per FEMA privacy rules)
      - name: longitude
        type: double
        nullable: true
        comment: Approximate longitude
      - name: id
        type: string
        nullable: false
        comment: OpenFEMA row UUID (PK)

    source:
      type: http
      url: "https://www.fema.gov/api/open/v2/FimaNfipClaims"
      method: GET
      parameters:
        $filter: "yearOfLoss eq {year}"
        $orderby: "id"
        $inlinecount: "allpages"
      response:
        format: json
        dataPath: "FimaNfipClaims"
        pagination:
          type: OFFSET
          pageSize: 1000
          limitParam: "$top"
          offsetParam: "$skip"
          countPath: "metadata.count"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 500, 503]
        maxRetries: 4
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaNfipClaimsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=nfip_claims/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: nfip_claims
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # NFIP POLICIES — FEMA FimaNfipPolicies (v2) — LARGE (~74M rows)
  # ---------------------------------------------------------------------------
  - name: nfip_policies
    pattern: "type=nfip_policies/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2014
      maxYear: 2026
      distinctYears: 12
      contiguous: false
      years: [2014, 2015, 2016, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
      rowCount: 1245000
      checkedAt: "2026-09-11T00:02:13Z"
    partitions: *standard_partitions
    dqRowLimit: 50000
    comment: >
      NFIP flood-insurance policy transactions — policy_cost,
      total_insurance_premium, total_building_coverage, and
      total_contents_coverage per policy term. One row per policy term. VERY
      LARGE (~74M rows all-history; several million per year). Partitioned by
      policy effective year. dqRowLimit caps DQ sampling; prod loads everything.
      Distinct from nfip_claims (realized paid losses, not premium/coverage).
      Joins to geo.counties via county_fips and census_tract. Source:
      fema.gov/api/open/v2/FimaNfipPolicies.

    dimensions:
      type:
        - nfip_policies
