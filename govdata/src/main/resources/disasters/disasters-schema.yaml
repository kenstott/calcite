# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: disasters_declarations_by_state_year
    # year passes through disaster_declarations.year, stored as text: served as INTEGER (GOV-075).
    columnDefinitions:
      - {name: year, type: INTEGER, storedDigits: 4}
    comment: >
      Annual disaster-declaration counts by state, incident_type, and year —
      disaster_count plus counts of declarations with IA (Individual
      Assistance, sourced from ih_program_declared - see disaster_declarations'
      own column comment, D-285: the source field behind ia_program_declared
      itself is dead at FEMA) and PA (Public Assistance) programs declared.
      Aggregates the county-program rows in disaster_declarations to distinct
      disasters per state/year/incident_type. Ready to join sec.filing_metadata
      on state for risk-disclosure research.
    sql: >
      SELECT
        d.year,
        d.state_fips,
        d.incident_type,
        COUNT(DISTINCT d.disaster_number)  AS disaster_count,
        SUM(CASE WHEN d.ih_program_declared THEN 1 ELSE 0 END) AS ia_declarations,
        SUM(CASE WHEN d.pa_program_declared THEN 1 ELSE 0 END) AS pa_declarations
      FROM disaster_declarations d
      GROUP BY d.year, d.state_fips, d.incident_type

  - name: disasters_pa_obligated_by_county
    # year passes through public_assistance_projects.year, stored as text: served as INTEGER (GOV-075).
    columnDefinitions:
      - {name: year, type: INTEGER, storedDigits: 4}
    comment: >
      Public Assistance federal obligations aggregated by county, incident_type,
      and declaration year — project_count, total_project_amount, and
      total_federal_obligated (USD). Joins to geo.counties for mapping; a
      natural next join is to econ employment data for disaster-affected
      labor-market analysis.
    sql: >
      SELECT
        p.year,
        p.state_fips,
        p.county_fips,
        p.incident_type,
        COUNT(*)                          AS project_count,
        SUM(p.project_amount)             AS total_project_amount,
        SUM(p.federal_share_obligated)    AS total_federal_obligated
      FROM public_assistance_projects p
      GROUP BY p.year, p.state_fips, p.county_fips, p.incident_type

  - name: disasters_nfip_claims_by_county
    # year passes through nfip_claims.year, stored as text: served as INTEGER (GOV-075).
    columnDefinitions:
      - {name: year, type: INTEGER, storedDigits: 4}
    comment: >
      Paid NFIP flood claims aggregated by county and year of loss —
      claim_count, total_paid_building, total_paid_contents, and total_paid
      (USD). Key measure of insured flood loss; joins to disaster_declarations
      and wildfire_perimeters by county for post-event exposure analysis.
    sql: >
      SELECT
        c.year,
        c.state_fips,
        c.county_fips,
        COUNT(*)                          AS claim_count,
        SUM(c.amount_paid_building)       AS total_paid_building,
        SUM(c.amount_paid_contents)       AS total_paid_contents,
        SUM(c.amount_paid_building + c.amount_paid_contents) AS total_paid
      FROM nfip_claims c
      GROUP BY c.year, c.state_fips, c.county_fips

  - name: disasters_storm_impact_by_county
    # year passes through storm_events.year, stored as text: served as INTEGER (GOV-075).
    columnDefinitions:
      - {name: year, type: INTEGER, storedDigits: 4}
    comment: >
      Storm-event human and economic impact aggregated by county and year —
      event_count, total_deaths, total_injuries, total_property_damage, and
      total_crop_damage (USD). Joins to disaster_declarations by county to
      link storm episodes to FEMA declarations, and to econ employment data
      for economic-impact research.
    sql: >
      SELECT
        s.year,
        s.state_fips,
        s.county_fips,
        COUNT(*)                          AS event_count,
        SUM(s.deaths_direct + s.deaths_indirect)     AS total_deaths,
        SUM(s.injuries_direct + s.injuries_indirect) AS total_injuries,
        SUM(s.damage_property)            AS total_property_damage,
        SUM(s.damage_crops)               AS total_crop_damage
      FROM storm_events s
      GROUP BY s.year, s.state_fips, s.county_fips

  - name: disasters_ihp_housing_by_county
    comment: >
      FEMA Individuals and Households Program housing assistance rolled up to county and
      disaster, owners and renters together: valid_registrations, inspected homes
      (owners_inspected, renters_inspected), owners_total_damage (USD, FEMA-inspected, owners
      only because renters have no dollar damage), owners_major_damage_over_30000 (owners
      whose inspected damage exceeded $30,000, the closest count to destroyed or
      uninhabitable homes), approved_for_assistance and total_approved_ihp_amount (USD). The
      county-level measure of how much housing a disaster damaged. Rows with a null
      county_fips (tribal areas, area names no declaration lists) are left out here; they
      stay in ihp_housing_assistance_owners and _renters with their ZIP codes. Join to
      disaster_declarations on disaster_number for the date and incident type, and to
      census.pep_components_of_change on county_fips and year for domestic migration.
    sql: >
      SELECT
        u.disaster_number,
        u.state_fips,
        u.county_fips,
        SUM(u.valid_registrations)         AS valid_registrations,
        SUM(u.owners_inspected)            AS owners_inspected,
        SUM(u.renters_inspected)           AS renters_inspected,
        SUM(u.owners_total_damage)         AS owners_total_damage,
        SUM(u.owners_major_damage_over_30000) AS owners_major_damage_over_30000,
        SUM(u.approved_for_assistance)     AS approved_for_assistance,
        SUM(u.total_approved_ihp_amount)   AS total_approved_ihp_amount
      FROM (
        SELECT disaster_number, state_fips, county_fips, valid_registrations,
               total_inspected AS owners_inspected, 0 AS renters_inspected,
               total_damage AS owners_total_damage,
               inspected_damage_over_30000 AS owners_major_damage_over_30000,
               approved_for_assistance, total_approved_ihp_amount
        FROM ihp_housing_assistance_owners
        WHERE county_fips IS NOT NULL
        UNION ALL
        SELECT disaster_number, state_fips, county_fips, valid_registrations,
               0 AS owners_inspected, total_inspected AS renters_inspected,
               0 AS owners_total_damage, 0 AS owners_major_damage_over_30000,
               approved_for_assistance, total_approved_ihp_amount
        FROM ihp_housing_assistance_renters
        WHERE county_fips IS NOT NULL
      ) u
      GROUP BY u.disaster_number, u.state_fips, u.county_fips
