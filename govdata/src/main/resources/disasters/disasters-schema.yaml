        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        overwritePartitions: true

  - name: wildfire_risk_by_county
    # USFS Wildfire Risk to Communities (WRC) publishes one county-summary workbook per
    # release (~annually), not a continuous series — a freshness-gated snapshot re-fetched
    # and overwritten whenever USFS updates the file, matching the energy.ev_charging_stations
    # pattern rather than wildfire_perimeters' incident-level shape.
    freshness:
      type: hash
    pattern: "type=wildfire_risk_by_county/*.parquet"
    partitions: *static_partitions
    comment: >
      USFS Wildfire Risk to Communities (WRC) county-level summary — one row per county,
      from the workbook's own "Counties" sheet (3,144 rows, one per US county/equivalent).
      Forward-looking hazard/exposure measures, not after-the-fact burn perimeters (see
      wildfire_perimeters for those). Metrics are building-fraction-based
      (buildings_fraction_minimal/indirect/direct_exposure), not raw Census housing-unit
      counts — the closest federal equivalent to a "housing-unit risk" statistic, but a
      building-count proxy rather than a literal housing-unit statistic. burn_probability_*
      and risk_*_rank are state/national percentile ranks (0-1), not raw probabilities.
      Complements disasters.wildfire_perimeters (which records only fires that already
      happened) with a genuinely forward-looking hazard measure. Joins to geo.counties via
      county_fips. Source: wildfirerisk.org (official USFS product, mandated by the 2018
      Consolidated Appropriations Act; hosted off the .fs.usda.gov domain, same acceptable
      pattern already used for housing.hud_subsidized_housing).

    dimensions:
      type:
        - wildfire_risk_by_county

    columns:
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-letter USPS state abbreviation
      - name: county_name
        type: string
        nullable: true
        comment: County name with state suffix, e.g. "Autauga County, AL"
      - name: total_buildings
        type: long
        nullable: true
        comment: Total building count in the county (WRC's own building inventory)
      - name: buildings_fraction_minimal_exposure
        type: double
        nullable: true
        comment: Fraction (0-1) of county buildings in the Minimal wildfire Exposure zone
      - name: buildings_fraction_indirect_exposure
        type: double
        nullable: true
        comment: >
          Fraction (0-1) of county buildings in the Indirect wildfire Exposure zone
          (exposed to ember cast / radiant heat from a nearby fire, not direct flame contact)
      - name: buildings_fraction_direct_exposure
        type: double
        nullable: true
        comment: Fraction (0-1) of county buildings in the Direct wildfire Exposure zone
      - name: burn_probability_state_rank
        type: double
        nullable: true
        comment: Annual burn probability, percentile rank (0-1) within the county's state
      - name: burn_probability_national_rank
        type: double
        nullable: true
        comment: Annual burn probability, percentile rank (0-1) nationally
      - name: risk_state_rank
        type: double
        nullable: true
        comment: Risk to structures (burn probability x exposure x building value), percentile rank (0-1) within state
      - name: risk_national_rank
        type: double
        nullable: true
        comment: Risk to structures, percentile rank (0-1) nationally

    # WRC's download URL embeds its publish date and changes on each annual release
    # (confirmed live 5 Sep 2026: wrc_download_20260415.xlsx, prior release was
    # wrc_download_202505.xlsx). No query-string discovery endpoint this codebase's
    # urlResolver mechanism can use directly (wildfirerisk.org's own
    # wp-json/wp/v2/media?search=wrc_download&per_page=1&orderby=date&order=desc returns a
    # JSON ARRAY, not the single-object shape urlResolver expects) — re-verify this URL via
    # that endpoint's source_url field if it ever 404s, same caveat class as the CFTC COT
    # Socrata resource ID and lands.va_facilities' ArcGIS FeatureServer.
    source:
      type: http
      url: "https://wildfirerisk.org/wp-content/uploads/2026/04/wrc_download_20260415.xlsx"
      method: GET
      headers:
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      response:
        format: TEXT   # WildfireRiskByCountyTransformer re-downloads the XLSX and emits JSON rows
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.WildfireRiskByCountyTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=wildfire_risk_by_county/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: wildfire_risk_by_county
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        overwritePartitions: true

  - name: fema_nri_earthquake_by_county
    # Latest-snapshot table (no year axis): FEMA republishes the NRI layer periodically, not as
    # a continuous series, and the hash probe skips the write when the layer is unchanged since
    # the last successful run. dataset_type: snapshot makes a run that writes zero rows fail
    # loudly instead of silently marking an empty table complete.
    dataset_type: snapshot
    freshness:
      type: hash
    pattern: "type=fema_nri_earthquake_by_county/*.parquet"
    partitions: *static_partitions
    comment: >
      FEMA National Risk Index (NRI) county-level earthquake hazard, exposure, and
      expected-annual-loss data — one row per county (3,142 rows). Verified live 2026-09-11:
      San Francisco County CA earthquake_risk_rating "Relatively High" (San Andreas exposure);
      Story County IA "Very Low" (mid-continent). Also carries the NRI's overall
      all-hazard composite (risk_score/risk_rating/risk_national_pctl/risk_state_pctl,
      eal_score/eal_rating) for context, plus population/building_value/agriculture_value/
      area for normalizing the earthquake measures. The source layer carries 17 other
      hazard blocks (wildfire, hurricane, flood, tornado, etc.) on the same 367-field
      schema — not ingested here; a follow-on sourcing item, not a gap in this table.
      Hosted on FEMA's own ArcGIS Online tenant (services.arcgis.com/XG15cJAlne2vxtgt),
      not the .fema.gov domain itself — same accepted "agency-hosted ArcGIS mirror"
      pattern as housing.opportunity_zones; re-verify the item id if this 404s (the
      canonical hazards.fema.gov/nri URLs only redirect to a landing page, not this data).
      Joins to geo.counties via county_fips.

    dimensions:
      type:
        - fema_nri_earthquake_by_county

    columns:
      - <<: *state_fips_column
      - <<: *county_fips_column
      - name: state_name
        type: string
        nullable: true
        comment: Full state name, as published by FEMA NRI
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-letter USPS state abbreviation
      - name: county_name
        type: string
        nullable: true
        comment: County name (no state suffix)
      - name: population
        type: int
        nullable: true
        comment: County population (FEMA NRI's own 2016 vintage population figure)
      - name: building_value_usd
        type: double
        nullable: true
        comment: Total building value in the county (USD), FEMA NRI's own building inventory
      - name: agriculture_value_usd
        type: double
        nullable: true
        comment: Total agricultural value in the county (USD)
      - name: area_sq_mi
        type: double
        nullable: true
        comment: County land area in square miles
      - name: risk_score
        type: double
        nullable: true
        comment: NRI overall all-hazard composite risk score (not earthquake-specific)
      - name: risk_rating
        type: string
        nullable: true
        comment: NRI overall all-hazard composite risk rating (e.g. "Relatively High")
      - name: risk_national_pctl
        type: double
        nullable: true
        comment: NRI overall composite risk, national percentile (0-100)
      - name: risk_state_pctl
        type: double
        nullable: true
        comment: NRI overall composite risk, percentile within the county's own state (0-100)
      - name: eal_score
        type: double
        nullable: true
        comment: NRI overall all-hazard composite expected-annual-loss score
      - name: eal_rating
        type: string
        nullable: true
        comment: NRI overall all-hazard composite expected-annual-loss rating
      - name: earthquake_events
        type: double
        nullable: true
        comment: Historic earthquake event count used in NRI's earthquake model; null when FEMA has none on record for the county
      - name: earthquake_annualized_frequency
        type: double
        nullable: true
        comment: Annualized frequency of a damaging earthquake for the county
      - name: earthquake_exposure_building_value
        type: double
        nullable: true
        comment: Building value (USD) exposed to earthquake hazard
      - name: earthquake_exposure_population
        type: double
        nullable: true
        comment: Population exposed to earthquake hazard
      - name: earthquake_exposure_population_equivalence
        type: double
        nullable: true
        comment: Population converted to a USD-equivalent exposure value (FEMA NRI methodology)
      - name: earthquake_exposure_total
        type: double
        nullable: true
        comment: Total exposure (USD) — building value plus population equivalence
      - name: earthquake_historic_loss_ratio_buildings
        type: double
        nullable: true
        comment: Historic earthquake loss ratio for buildings
      - name: earthquake_historic_loss_ratio_population
        type: double
        nullable: true
        comment: Historic earthquake loss ratio for population
      - name: earthquake_historic_loss_ratio_rating
        type: string
        nullable: true
        comment: Historic earthquake loss ratio, overall rating
      - name: earthquake_eal_building_value
        type: double
        nullable: true
        comment: Expected annual loss (USD) to buildings from earthquake
      - name: earthquake_eal_population
        type: double
        nullable: true
        comment: Expected annual loss (population-equivalent units) from earthquake
      - name: earthquake_eal_population_equivalence
        type: double
        nullable: true
        comment: Expected annual population loss converted to a USD-equivalent value
      - name: earthquake_eal_total
        type: double
        nullable: true
        comment: Total expected annual loss (USD) from earthquake
      - name: earthquake_eal_score
        type: double
        nullable: true
        comment: Earthquake expected-annual-loss score
      - name: earthquake_eal_rating
        type: string
        nullable: true
        comment: Earthquake expected-annual-loss rating (e.g. "Very Low", "Relatively High")
      - name: earthquake_risk_score
        type: double
        nullable: true
        comment: Earthquake-specific hazard-type risk index score
      - name: earthquake_risk_rating
        type: string
        nullable: true
        comment: >
          Earthquake-specific hazard-type risk index rating — the primary column for
          "which counties have high earthquake risk" questions (ops#191's original ask)

    # NRI_Counties_Prod_v1181_view FeatureServer layer (FEMA's own ArcGIS Online tenant).
    # outFields is scoped to the overall composite + full ERQK_* (earthquake) block — see
    # the table comment for why the other 17 hazard blocks on this layer aren't selected.
    # FemaNriEarthquakeByCountyTransformer pages with &resultOffset (ArcGIS caps a page at
    # resultRecordCount) until exceededTransferLimit is false.
    source:
      type: http
      url: "https://services.arcgis.com/XG15cJAlne2vxtgt/ArcGIS/rest/services/NRI_Counties_Prod_v1181_view/FeatureServer/0/query?where=1%3D1&outFields=STATE,STATEABBRV,COUNTY,STCOFIPS,POPULATION,BUILDVALUE,AGRIVALUE,AREA,RISK_SCORE,RISK_RATNG,RISK_NPCTL,RISK_SPCTL,EAL_SCORE,EAL_RATNG,ERQK_EVNTS,ERQK_AFREQ,ERQK_EXPB,ERQK_EXPP,ERQK_EXPPE,ERQK_EXPT,ERQK_HLRB,ERQK_HLRP,ERQK_HLRR,ERQK_EALB,ERQK_EALP,ERQK_EALPE,ERQK_EALT,ERQK_EALS,ERQK_EALR,ERQK_RISKS,ERQK_RISKR&returnGeometry=false&f=json&resultRecordCount=2000"
      method: GET
      headers:
        User-Agent: "calcite-govdata (+mailto:kennethstott@gmail.com)"
      response:
        format: TEXT   # FemaNriEarthquakeByCountyTransformer streams the paginated FeatureServer JSON itself
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.disasters.FemaNriEarthquakeByCountyTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=fema_nri_earthquake_by_county/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/disasters"
        tableName: fema_nri_earthquake_by_county
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        overwritePartitions: true

# ============================================================================
# CONSTRAINTS
# ============================================================================
# PKs are the OpenFEMA row identifiers (id / hash) which are globally unique,
# and source-native ids for NOAA/WFIGS. FKs point to the geo dimension tables
# (states/counties). disaster_number is intentionally NOT a declared FK to
# disaster_declarations: it is not unique there (one disaster has many
# county/program rows), so it is a join key, not a referential parent.
# ============================================================================

constraints:

  disaster_declarations:
    primaryKey: [id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  public_assistance_projects:
    primaryKey: [hash]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  hazard_mitigation_projects:
    primaryKey: [project_identifier]
