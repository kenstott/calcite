      Predictions are astronomical only (no weather), so water_level_m from coops_high_low
      minus the matching prediction isolates storm surge and other non-tidal anomaly; see the
      coops_daily_surge view. Heights are meters above MLLW (current tidal epoch), time in UTC.
      Source: api.tidesandcurrents.noaa.gov Data API, keyless, public domain, 365 days per call
      so the ETL pulls one station-year per call. Join coops_stations on station_id for state
      and coordinates. Currents predictions are not included.

    dimensions:
