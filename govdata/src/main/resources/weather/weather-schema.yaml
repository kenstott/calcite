# ============================================================================
# PARTITIONED TABLES
# ============================================================================

partitionedTables:

  # ---------------------------------------------------------------------------
  # NWS STATIONS - Weather station metadata (no auth)
  # ---------------------------------------------------------------------------
  - name: nws_stations
    freshness:
      type: hash
    pattern: "type=nws_station/state_abbr=*/*.parquet"
    partitions: *nws_partitions
    comment: >
      NWS weather station metadata from weather.gov. Includes station ID, name,
      coordinates, elevation, timezone, and zone IDs. One row per station.
      Cross-references geo.state_ref via state_abbr. No authentication required.

    dimensions:
      type:
        - nws_station
      state_abbr: *all_state_abbrs

    columns:
      - name: station_id
        type: string
        nullable: false
        comment: "NWS station ID (e.g., 'KORD')"
      - name: station_name
        type: string
        nullable: true
        comment: Station name
      - <<: *state_abbr_column
      - name: latitude
        type: double
        nullable: true
        comment: Station latitude
      - name: longitude
        type: double
        nullable: true
        comment: Station longitude
      - name: elevation_m
        type: double
        nullable: true
        comment: Elevation in meters
      - name: timezone
        type: string
        nullable: true
        comment: IANA timezone (e.g., 'America/Chicago')
      - name: forecast_zone
        type: string
        nullable: true
        comment: NWS forecast zone ID
      - name: county_zone
        type: string
        nullable: true
        comment: NWS county zone ID

    source:
      type: http
      url: "https://api.weather.gov/stations?state={state_abbr}&limit=500"
      method: GET
      response:
        format: json
      headers:
        User-Agent: "(calcite-govdata, kennethstott@gmail.com)"
        Accept: "application/geo+json"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.NwsStationTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=nws_station/state_abbr=*/"
      partition:
        columns: [type, state_abbr]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: nws_stations
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # NWS ALERTS - Active severe weather alerts (no auth)
  # ---------------------------------------------------------------------------
  - name: nws_alerts
    freshness:
      type: hash
    pattern: "type=nws_alert/state_abbr=*/*.parquet"
    partitions: *nws_partitions
    comment: >
      NWS active weather alerts from weather.gov. Includes alert type, severity,
      certainty, urgency, and temporal bounds. Snapshot of current alerts per state.
      Cross-references geo.state_ref via state_abbr. No authentication required.

    dimensions:
      type:
        - nws_alert
      state_abbr: *all_state_abbrs

    columns:
      - name: alert_id
        type: string
        nullable: false
        comment: NWS alert identifier
      - <<: *state_abbr_column
      - name: event
        type: string
        nullable: true
        comment: "Event type (e.g., 'Tornado Warning')"
      - name: severity
        type: string
        nullable: true
        comment: "Extreme, Severe, Moderate, Minor, Unknown"
      - name: certainty
        type: string
        nullable: true
        comment: "Observed, Likely, Possible, Unlikely"
      - name: urgency
        type: string
        nullable: true
        comment: "Immediate, Expected, Future, Past"
      - name: headline
        type: string
        nullable: true
        comment: Alert headline
      - name: description
        type: string
        nullable: true
        comment: Full description
      - name: onset
        type: string
        nullable: true
        comment: ISO datetime of onset
      - name: expires
        type: string
        nullable: true
        comment: ISO datetime of expiration
      - name: sender_name
        type: string
        nullable: true
        comment: Issuing office
      - name: affected_zones
        type: string
        nullable: true
        comment: Comma-separated zone IDs

    source:
      type: http
      url: "https://api.weather.gov/alerts?area={state_abbr}&status=actual&limit=500"
      method: GET
      response:
        format: json
      headers:
        User-Agent: "(calcite-govdata, kennethstott@gmail.com)"
        Accept: "application/geo+json"
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.NwsAlertTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=nws_alert/state_abbr=*/"
      partition:
        columns: [type, state_abbr]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: nws_alerts
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # CDO STATIONS - Climate observation station metadata (requires NOAA_CDO_TOKEN)
  # ---------------------------------------------------------------------------
  - name: cdo_stations
    freshness:
      type: hash
    pattern: "type=cdo_station/state_fips=*/*.parquet"
    partitions: *cdo_station_partitions
    comment: >
      NOAA CDO weather station metadata (GHCND and COOP network stations).
      Includes CDO station ID, name, coordinates, elevation, data coverage
      date range (min_date/max_date), and coverage fraction (datacoverage).
      One row per station. Cross-references geo.state_ref via state_fips.
      Requires NOAA_CDO_TOKEN environment variable. Unlike
      ghcnd_stations_with_county (no auth required), this table carries no
      county_fips — use ghcnd_stations_with_county for county-level station
      joins.

    dimensions:
      type:
        - cdo_station
      state_fips: *all_state_fips

    columns:
      - name: station_id
        type: string
        nullable: false
        comment: "CDO station ID (e.g., 'GHCND:USW00094846', 'COOP:110050')"
      - name: station_name
        type: string
        nullable: true
        comment: Station name
      - <<: *state_fips_column
      - name: latitude
        type: double
        nullable: true
        comment: Station latitude
      - name: longitude
        type: double
        nullable: true
        comment: Station longitude
      - name: elevation
        type: double
        nullable: true
        comment: Elevation (nullable)
      - name: min_date
        type: string
        nullable: true
        comment: Earliest data available (ISO date)
      - name: max_date
        type: string
        nullable: true
        comment: Most recent data available (ISO date)
      - name: datacoverage
        type: double
        nullable: true
        comment: Coverage fraction 0-1

    source:
      type: http
      url: "https://www.ncdc.noaa.gov/cdo-web/api/v2/stations?locationid=FIPS:{state_fips}"
      method: GET
      response:
        format: json
        pagination:
          type: OFFSET
          limitParam: limit
          offsetParam: offset
          startOffset: 1
          pageSize: 1000
          countPath: metadata.resultset.count
      headers:
        token: "{env:NOAA_CDO_TOKEN}"
      rateLimit:
        requestsPerSecond: 5.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.CdoStationTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=cdo_station/state_fips=*/"
      partition:
        columns: [type, state_fips]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: cdo_stations
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        overwritePartitions: true
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # CDO MONTHLY SUMMARIES (GSOM) - Monthly climate data (requires NOAA_CDO_TOKEN)
  # ---------------------------------------------------------------------------
  - name: cdo_monthly_summaries
    pattern: "type=cdo_monthly/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2025
      distinctYears: 17
      contiguous: true
      rowCount: 10034290
      checkedAt: "2026-10-24T16:16:49Z"
    partitions: *standard_partitions
    comment: >
      NOAA CDO Global Summary of the Month (GSOM) data. Includes temperature
      (TAVG, TMAX, TMIN), precipitation (PRCP), snowfall (SNOW), and other
      monthly climate metrics per station. One row per station+month+datatype.
      Monthly companion to cdo_annual_summaries (GSOY, same station network
      at annual grain). Cross-references geo.state_ref via state_fips and
      cdo_stations via station_id. Requires NOAA_CDO_TOKEN environment
      variable.

    # DQ sample cap (GOVDATA_DQ mode): CDO GSOM returns one row per station×month×datatype, paged
    # 1000/request per year×state. Each combo is its own fetch-unit, so the cap samples every combo
    # and stops pagination early. Cache-safe — paginated pages are cached on full drain, so a capped
    # run leaves the prod cache untouched.
    dqRowLimit: 5000

    dimensions:
      type:
        - cdo_monthly
      year: *weather_year_range
      state_fips: *all_state_fips

    columns:
      - <<: *state_fips_column
      - name: station_id
        type: string
        nullable: true
        comment: CDO station ID
      - <<: *year_column
      - name: month
        type: integer
        nullable: true
        comment: Month (1-12)
      - name: datatype
        type: string
        nullable: true
        comment: "Measurement type (TAVG, TMAX, TMIN, PRCP, SNOW, etc.)"
      - name: value
        type: double
        nullable: true
        comment: Value in standard units
      - name: attributes
        type: string
        nullable: true
        comment: Quality flags
      - name: date
        type: string
        nullable: true
        comment: ISO date of measurement period

    source:
      type: http
      url: "https://www.ncdc.noaa.gov/cdo-web/api/v2/data?datasetid=GSOM&locationid=FIPS:{state_fips}&startdate={effective_year}-01-01&enddate={effective_year}-12-31"
      method: GET
      response:
        format: json
        pagination:
          type: OFFSET
          limitParam: limit
          offsetParam: offset
          startOffset: 1
          pageSize: 1000
          countPath: metadata.resultset.count
      headers:
        token: "{env:NOAA_CDO_TOKEN}"
      rateLimit:
        requestsPerSecond: 5.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.CdoDataTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=cdo_monthly/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: cdo_monthly_summaries
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5
        batchPartitionColumns: [year]
        incrementalKeys: [year]

  # ---------------------------------------------------------------------------
  # CDO ANNUAL SUMMARIES (GSOY) - Annual climate data (requires NOAA_CDO_TOKEN)
  # ---------------------------------------------------------------------------
  - name: cdo_annual_summaries
    pattern: "type=cdo_annual/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2009
      maxYear: 2025
      distinctYears: 17
      contiguous: true
      rowCount: 981370
      checkedAt: "2026-10-24T16:16:54Z"
    partitions: *standard_partitions
    comment: >
      NOAA CDO Global Summary of the Year (GSOY) data — annual temperature,
      precipitation, and other climate metrics (see the datatype column for
      the specific element code of each row) per station. One row per
      station+datatype+year. Annual companion to cdo_monthly_summaries
      (GSOM, same station network at monthly grain — use that table for
      TAVG/TMAX/TMIN/PRCP/SNOW by month). Cross-references geo.state_ref via
      state_fips and cdo_stations via station_id. Requires NOAA_CDO_TOKEN
      environment variable.

    dimensions:
      type:
        - cdo_annual
      year: *weather_year_range
      state_fips: *all_state_fips

    columns:
      - <<: *state_fips_column
      - name: station_id
        type: string
        nullable: true
        comment: CDO station ID
      - <<: *year_column
      - name: datatype
        type: string
        nullable: true
