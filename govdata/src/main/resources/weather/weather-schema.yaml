      ASOS stations that prediction-market daily-high-temperature contracts settle on:
      KLAX, KMIA, KAUS, KATL, KSFO, KSEA, KHOU, KLGA, KNYC (Central Park), KMDW, KORD,
      KDEN, KBKF, KDFW, KDAL. Source is the Iowa Environmental Mesonet ASOS archive
      (https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py), a university-hosted
      mirror of NWS/FAA ASOS and MADIS METAR feeds, not an agency endpoint; re-verify
      if it starts failing. report_type separates three feeds: 'routine' (hourly
      METAR, ~minute :53), 'special' (SPECI, issued when conditions change), and '5min'
      (MADIS high-frequency METAR, every 5 minutes, available from about 2016). Years
      before a feed existed return no rows for it. observation_time_utc is UTC.
      Temperatures are kept as reported: air_temp_f / air_temp_c are IEM's parse of the
      METAR body (whole degrees; null on 5min rows), temp_c_tgroup is the exact
      tenths-of-a-degree Celsius from the METAR remarks T-group (present on most rows,
      including 5min), and metar is the full raw report text. A 5-minute and a routine report can
      share one minute, so (station_id, observation_time_utc, report_type) is not unique;
      add metar for a unique key. -61 C in temp_c_tgroup (METAR 'M61/M61') is the ASOS
      sensor-missing marker, kept as reported; filter it when taking daily maxima/minima.
      air_temp_f/air_temp_c occasionally disagree with the raw report, so prefer
      temp_c_tgroup when precision matters. The daily maximum over
      observation_time_utc rows differs from the official NWS daily climate-report
      maximum (ghcnd_daily tmax_c); this table is the record needed to reproduce the
      highest-observation-of-the-day measure. Use observation_date (UTC day) to group,
      not local day. No auth needed.

    dimensions:
      type:
        - asos_observations
      year: *ghcnd_year_range
      station:
        type: list
        values: ["LAX", "MIA", "AUS", "ATL", "SFO", "SEA", "HOU", "LGA", "NYC", "MDW", "ORD", "DEN", "BKF", "DFW", "DAL"]
      report_type:
        type: list
        values: ["1", "3", "4"]

    columns:
      - name: station_id
        type: string
        nullable: false
        comment: "4-letter ICAO station identifier (e.g., 'KMIA')"
      - name: observation_time_utc
        type: string
        nullable: false
        comment: "Observation time in UTC, 'YYYY-MM-DD HH:MM'"
      - name: observation_date
        type: string
        nullable: false
        comment: "UTC calendar date of the observation (YYYY-MM-DD)"
      - <<: *year_column
      - name: report_type
        type: string
        nullable: false
        comment: "Feed: 'routine' (hourly METAR), 'special' (SPECI), or '5min' (MADIS 5-minute METAR)"
      - name: air_temp_f
        type: double
        nullable: true
        comment: "Air temperature in whole degrees F as parsed from the METAR body; null on 5min rows"
      - name: air_temp_c
        type: double
        nullable: true
        comment: "Air temperature in degrees C as parsed by IEM from the METAR body; null on 5min rows"
      - name: temp_c_tgroup
        type: double
        nullable: true
        comment: "Air temperature in degrees C to tenths, from the METAR remarks T-group; null when the report has no T-group"
      - name: metar
        type: string
        nullable: true
        comment: "Full raw METAR report text"

    source:
      type: http
      url: "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?station={station}&data=tmpf&data=tmpc&data=metar&sts={year}-01-01T00:00Z&ets={year}-12-31T23:59:59Z&format=onlycomma&latlon=no&missing=empty&trace=T&direct=no&report_type={report_type}"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.AsosObservationTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=asos_observations/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: asos_observations
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5
        incrementalKeys: [year]
        overwritePartitions: true

  - name: coops_stations
    freshness:
      type: hash
    pattern: "type=coops_station/*.parquet"
    partitions: *type_only_partitions
    comment: >
      NOAA CO-OPS tide gauges that report water level and tides: 238 tidal stations (NWLON
      and others) on US coasts, territories and a few foreign/Pacific sites, from the CO-OPS
      Metadata API (api.tidesandcurrents.noaa.gov/mdapi, keyless, public domain). One row per
      station with name, state, coordinates, tide type (semidiurnal, mixed, diurnal) and
      time zone. state is as CO-OPS publishes it; state_abbr and state_fips are populated
      only for the 50 states, DC, PR, VI and American Samoa (null for Guam, Midway, Wake,
      Kwajalein and Bermuda). Great Lakes stations are excluded. Joins geo.state_ref via
      state_abbr or state_fips; coops_station_datums, coops_high_low and
      coops_tide_predictions join on station_id.

    dimensions:
      type:
        - coops_station

    columns:
      - name: station_id
        type: string
        nullable: false
        comment: "CO-OPS station id (7 digits, e.g., '8518750' The Battery, NY)"
      - name: station_name
        type: string
        nullable: false
        comment: Station name
      - name: state
        type: string
        nullable: true
        comment: "State as published by CO-OPS: 2-letter code for states and most territories, otherwise a country or area name"
      - name: state_abbr
        type: string
        nullable: true
        comment: "2-letter abbreviation (50 states, DC, PR, VI, AS); null where CO-OPS gives no US state"
      - name: state_fips
        type: string
        nullable: true
        comment: "2-digit state FIPS code; null where state_abbr is null"
      - name: latitude
        type: double
        nullable: false
        comment: Station latitude (decimal degrees)
      - name: longitude
        type: double
        nullable: false
        comment: Station longitude (decimal degrees, negative west)
      - name: affiliations
        type: string
        nullable: true
        comment: "Network affiliations (e.g., 'NWLON', 'NWLON,PORTS')"
      - name: tide_type
        type: string
        nullable: true
        comment: "Tide regime as published: Semidiurnal, Mixed, Mixed Diurnal or Diurnal"
      - name: timezone
        type: string
        nullable: true
        comment: "Local time zone abbreviation (e.g., 'EST')"
      - name: timezone_offset_hours
        type: integer
        nullable: false
        comment: "Standard-time offset from UTC in hours"
      - name: observes_dst
        type: boolean
        nullable: false
        comment: "Whether local time observes daylight saving"
      - name: storm_surge_forecast
        type: boolean
        nullable: false
        comment: "Whether CO-OPS publishes a storm surge forecast for the station"

    source:
      type: http
      url: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=waterlevels"
      method: GET
      response:
        format: json
      # api.tidesandcurrents.noaa.gov answers bursts with a gateway 403 {"message":"Forbidden"}
      # (seen at ~4 req/s across two ETL threads); it clears on its own, so 403 is retried.
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [403, 429, 503]
        maxRetries: 5
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.CoopsTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=coops_station/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: coops_stations
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  - name: coops_station_datums
    freshness:
      type: hash
    pattern: "type=coops_station_datums/station_id=*/*.parquet"
    partitions: *coops_datum_partitions
    comment: >
      Tidal datum elevations per CO-OPS tide gauge, in meters above station datum (STND),
      from the Metadata API datums.json. One row per station. Water levels in coops_high_low
      and coops_tide_predictions are meters above MLLW, so mllw_m converts them to station
      datum and navd88_m (when published) ties them to NAVD88. Columns hold the current
      published epoch (epoch, e.g. '1983-2001'): MHHW, MHW, MTL, MSL, MLW, MLLW, NAVD88, plus
      LAT/HAT where published. A datum a station does not publish is null.

    dimensions:
      type:
        - coops_station_datums
      station_id: *coops_station_ids

    columns:
      - name: station_id
        type: string
        nullable: false
        comment: "CO-OPS station id (joins coops_stations.station_id)"
      - name: epoch
        type: string
        nullable: true
        comment: "National Tidal Datum Epoch the datums are computed over (e.g., '1983-2001')"
      - name: orthometric_datum
        type: string
        nullable: true
        comment: "Orthometric datum the station is tied to (e.g., 'NAVD88')"
      - name: datums_accepted
        type: string
        nullable: true
        comment: "Date the current datums were accepted (as published, e.g., 'Nov 19 2012')"
      - name: stnd_m
        type: double
        nullable: true
        comment: "Station datum elevation, meters (reference 0)"
      - name: mhhw_m
        type: double
        nullable: true
        comment: "Mean Higher-High Water, meters above station datum"
      - name: mhw_m
        type: double
        nullable: true
        comment: "Mean High Water, meters above station datum"
      - name: mtl_m
        type: double
        nullable: true
        comment: "Mean Tide Level, meters above station datum"
      - name: msl_m
        type: double
        nullable: true
        comment: "Mean Sea Level, meters above station datum"
      - name: mlw_m
        type: double
        nullable: true
        comment: "Mean Low Water, meters above station datum"
      - name: mllw_m
        type: double
        nullable: true
        comment: "Mean Lower-Low Water, meters above station datum (the reference for coops_high_low and coops_tide_predictions)"
      - name: navd88_m
        type: double
        nullable: true
        comment: "North American Vertical Datum 1988, meters above station datum; null when not tied"
      - name: lat_m
        type: double
        nullable: true
        comment: "Lowest Astronomical Tide, meters above station datum; null when not published"
      - name: hat_m
        type: double
        nullable: true
        comment: "Highest Astronomical Tide, meters above station datum; null when not published"

    source:
      type: http
      url: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/{station_id}/datums.json?units=metric"
      method: GET
      response:
        format: json
      # api.tidesandcurrents.noaa.gov answers bursts with a gateway 403 {"message":"Forbidden"}
      # (seen at ~4 req/s across two ETL threads); it clears on its own, so 403 is retried.
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [403, 429, 503]
        maxRetries: 5
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.CoopsTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=coops_station_datums/station_id=*/"
      partition:
        columns: [type, station_id]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: coops_station_datums
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  - name: coops_high_low
    pattern: "type=coops_high_low/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2026
      maxYear: 2026
      distinctYears: 1
      contiguous: true
      rowCount: 210913
      checkedAt: "2026-10-24T16:18:01Z"
    partitions: *standard_partitions
    comment: >
      Observed high and low water events (tide extremes) from NOAA CO-OPS NWLON tide gauges,
      one row per event per station: roughly 2 to 4 per station per day (H/L semidiurnal,
      HH/LL on mixed tides). Source is the CO-OPS Data API (product=high_low,
      api.tidesandcurrents.noaa.gov, keyless, public domain; requests are limited to 365 days,
      so the ETL pulls one station-year per call). Heights are meters above MLLW (current tidal
      epoch) in UTC time, as verified (preliminary for recent months). Stations
      inactive in a year return no rows. Pair with coops_tide_predictions: observed minus
      predicted extreme is the storm-surge / anomaly signal, precomputed in the
      coops_daily_surge view. Join coops_stations on station_id for state_fips, latitude and
      longitude, and to geo.state_ref; coastal flooding in the disasters schema joins on state.
      Great Lakes stations are excluded (no tides); currents are not included.

    dimensions:
      type:
        - coops_high_low
      year: *ghcnd_year_range
      station_id: *coops_station_ids

    columns:
      - name: station_id
        type: string
        nullable: false
        comment: "CO-OPS station id (joins coops_stations.station_id)"
      - name: event_time_utc
        type: string
        nullable: false
        comment: "Time of the high or low water event in UTC, 'YYYY-MM-DD HH:MM'"
      - name: event_date
        type: string
        nullable: false
        comment: "UTC calendar date of the event (YYYY-MM-DD)"
      - <<: *year_column
      - name: water_level_m
        type: double
        nullable: true
        comment: "Observed water level of the high/low event in meters above MLLW (Mean Lower-Low Water, the station's current tidal epoch). Comparable across stations only via coops_station_datums"
      - name: event_type
        type: string
        nullable: false
        comment: "H = high water, L = low water, HH = higher high water, LL = lower low water (HH/LL appear on mixed and diurnal tide stations)"
      - name: quality_flags
        type: string
        nullable: true
        comment: "CO-OPS data flags 'inferred,exceedsMax/Min,rateOfChange,limits' as 0/1 (e.g. '0,0')"

    source:
      type: http
      url: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=high_low&station={station_id}&begin_date={year}0101&end_date={year}1231&datum=MLLW&time_zone=gmt&units=metric&format=json&application=calcite-govdata"
      method: GET
      response:
        format: json
      # api.tidesandcurrents.noaa.gov answers bursts with a gateway 403 {"message":"Forbidden"}
      # (seen at ~4 req/s across two ETL threads); it clears on its own, so 403 is retried.
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [403, 429, 503]
        maxRetries: 5
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.weather.CoopsTransformer"

    materialize:
      format: iceberg
      options:
        stagingMode: local
      output:
        pattern: "type=coops_high_low/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/weather"
        tableName: coops_high_low
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5
        incrementalKeys: [year]
        overwritePartitions: true

  - name: coops_tide_predictions
    pattern: "type=coops_tide_predictions/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2026
      maxYear: 2026
      distinctYears: 1
      contiguous: true
      rowCount: 297151
      checkedAt: "2026-10-24T16:18:02Z"
    partitions: *standard_partitions
    comment: >
      Predicted high and low tide times and heights from NOAA CO-OPS harmonic prediction
