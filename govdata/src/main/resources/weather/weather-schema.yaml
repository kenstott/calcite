# ============================================================================
# VIEWS
# ============================================================================

tables:

  # ---------------------------------------------------------------------------
  # WEATHER DAILY BY COUNTY - Pre-aggregated county-level daily weather
  # ---------------------------------------------------------------------------
  - name: weather_daily_by_county
    type: view
    sql: >
      SELECT
        s.county_fips,
        d.date,
        CAST(SUBSTRING(d.date, 1, 4) AS INTEGER) AS year,
        AVG(d.tmax_c) AS tmax_c,
        AVG(d.tmin_c) AS tmin_c,
        AVG(d.tavg_c) AS tavg_c,
        AVG(d.prcp_mm) AS prcp_mm,
        AVG(d.snow_mm) AS snow_mm,
        COUNT(DISTINCT d.station_id) AS station_count
      FROM weather.ghcnd_daily d
      JOIN weather.ghcnd_stations_with_county s
        ON d.station_id = s.station_id
      WHERE s.county_fips IS NOT NULL
      GROUP BY s.county_fips, d.date
    comment: >
      Pre-aggregated county-level daily weather derived from ghcnd_daily joined to
      ghcnd_stations_with_county. One row per county per day. Simple mean of all
      reporting stations in the county. Primary join anchor for cross-schema research:
      join on county_fips + date to correlate with SEC filings, BLS wages, FEC
      contributions, census demographics, and health data.

  # ---------------------------------------------------------------------------
  # COOPS DAILY SURGE - Observed vs predicted daily extremes per tide gauge
  # ---------------------------------------------------------------------------
  - name: coops_daily_surge
    type: view
    sql: >
      SELECT
        o.station_id,
        o.event_date,
        o.year,
        o.observed_high_m,
        p.predicted_high_m,
        o.observed_high_m - p.predicted_high_m AS high_anomaly_m,
        o.observed_low_m,
        p.predicted_low_m,
        o.observed_low_m - p.predicted_low_m AS low_anomaly_m
      FROM (
        SELECT station_id, event_date, year,
               MAX(water_level_m) AS observed_high_m,
               MIN(water_level_m) AS observed_low_m
        FROM weather.coops_high_low
        GROUP BY station_id, event_date, year
      ) o
      JOIN (
        SELECT station_id, event_date,
               MAX(water_level_m) AS predicted_high_m,
               MIN(water_level_m) AS predicted_low_m
        FROM weather.coops_tide_predictions
        GROUP BY station_id, event_date
      ) p
        ON o.station_id = p.station_id AND o.event_date = p.event_date
    comment: >
      Daily storm-surge / anomaly signal per NOAA CO-OPS tide gauge: the highest and lowest
      observed water level of the UTC day (coops_high_low) beside the highest and lowest
      predicted tide (coops_tide_predictions), and their difference in meters. Predictions are
      astronomical only, so a persistently positive high_anomaly_m marks storm surge,
      sea-level anomaly or river-flood setup at that gauge; values near 0 are normal. Both
      measures are meters above MLLW. One row per station per UTC day present in both
      tables. Join coops_stations on station_id for state_fips and coordinates.

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:
  coops_stations:
    primaryKey: [station_id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]

  coops_station_datums:
    primaryKey: [station_id]
    foreignKeys:
      - columns: [station_id]
        targetTable: coops_stations
        targetColumns: [station_id]

  coops_high_low:
    primaryKey: [station_id, event_time_utc, event_type]
    foreignKeys:
      - columns: [station_id]
        targetTable: coops_stations
        targetColumns: [station_id]

  coops_tide_predictions:
    primaryKey: [station_id, event_time_utc, event_type]
    foreignKeys:
      - columns: [station_id]
        targetTable: coops_stations
        targetColumns: [station_id]

  nws_stations:
    primaryKey: [station_id]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  nws_alerts:
    primaryKey: [alert_id, state_abbr]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  cdo_stations:
    primaryKey: [station_id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]

  cdo_monthly_summaries:
    primaryKey: [station_id, datatype, year, month]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [station_id]
        targetTable: cdo_stations
        targetColumns: [station_id]

  cdo_annual_summaries:
    primaryKey: [station_id, datatype, year]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [station_id]
        targetTable: cdo_stations
        targetColumns: [station_id]

  ghcnd_stations_with_county:
    primaryKey: [station_id]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: geo
