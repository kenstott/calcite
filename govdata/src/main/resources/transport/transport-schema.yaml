    comment: >
      PHMSA gas transmission & gathering operators' annual report (Form PHMSA F
      7100.2-1), Part A-D fields, one row per (report_year, operator, commodity) — the
      per-mile normalization denominator for phmsa_gas_transmission_incidents (join on
      operator_id + report_year). Same data.transportation.gov bulk-file route as
      phmsa_hazardous_liquid_mileage (catalog resource aemm-7pyq, the same
      multi-commodity "href" pointer; this fetches the Gas Transmission & Gathering file
      attachment). The source ZIP splits each year's annual report into ~12-14 "Part"
      CSVs (Part A-D, F-G, H, I, ... T); only the Part A-D file is ingested here, since
      it alone carries total_miles (Part D) and the HCA mileage summary (Part B) — the
      fields this warehouse needs. Confirmed identical column layout (154 cols) across
      2017-2024. Unlike the gas distribution and hazardous-liquid annual reports, this
      form has no Part E installation-decade mileage breakdown at all (confirmed: no
      PARTE-prefixed columns anywhere in the 2024 zip), so miles_installed_* columns are
      not carried here. total_miles (PARTDTOTALMILES) is the sum of separately-reported
      transmission-only and gathering-only mileage (PARTDTTOTAL + PARTDGTOTAL,
      confirmed live), both also captured here since the two pipeline types differ
      operationally and are usually analyzed separately. Confirmed live: comma-only
      padding lines exist here too (1-16 per year, fewer than the other annual reports
      but the same defect), requiring the same OPERATOR_ID rowFilter. An operator can
      file more than one commodity row per year (Natural Gas, Landfill Gas, Hydrogen
      Gas, and assorted "Other Gas-*" industrial gases), so report_number is the unique
      key, not operator_id + report_year. Only 2017-2024 is loaded; 2010-2016 exist only
      as whole-workbook XLSX files with a differently-shaped layout, same caveat as
      phmsa_hazardous_liquid_mileage, not ingested here.

    dimensions:
      type:
        - phmsa_gas_transmission_mileage

    columns:
      - name: report_year
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."REPORT_YEAR" AS INTEGER)'
      - name: report_number
        type: string
        nullable: false
