    freshness:
      type: last_modified
    pattern: "type=pavement_roughness/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      FHWA Highway Statistics table HM-64 — functional-system road mileage by measured
      pavement roughness (International Roughness Index bucket), broken out by area type
      (rural/urban) and road class (interstate, other freeways & expressways, other
      principal arterial, minor arterial — the last reported for rural only). FHWA
      publishes HM-64 only as a merged multi-header, multi-block Excel workbook (4 sheets,
      one or more 10-column road-class blocks per sheet), so a ResponseTransformer parses
      the fixed HM-64 layout and derives state_fips. Joins to geo.states via state_fips.
      Source: fhwa.dot.gov/policyinformation/statistics/{year}/xls/hm64.xlsx.

    dimensions:
      type:
        - pavement_roughness
      year:
        - "2023"
        - "2024"

    columns:
      - <<: *state_fips_column
        nullable: false
      - name: state_name
        type: string
        nullable: true
        comment: State name (footnote markers stripped)
      - name: area_type
        type: string
        nullable: false
        comment: "'rural' or 'urban'"
      - name: road_class
        type: string
        nullable: false
        comment: "interstate, other_freeways_expressways, other_principal_arterial, or minor_arterial (rural only)"
      - name: miles_not_reported
        type: double
        nullable: true
        comment: Miles with no measured roughness on record
      - name: miles_iri_under_60
        type: double
        nullable: true
        comment: Miles with IRI < 60 inches/mile
      - name: miles_iri_60_94
        type: double
        nullable: true
        comment: Miles with IRI 60-94 inches/mile
      - name: miles_iri_95_119
        type: double
        nullable: true
        comment: Miles with IRI 95-119 inches/mile
      - name: miles_iri_120_144
        type: double
        nullable: true
        comment: Miles with IRI 120-144 inches/mile
      - name: miles_iri_145_170
        type: double
        nullable: true
        comment: Miles with IRI 145-170 inches/mile
      - name: miles_iri_171_194
        type: double
        nullable: true
        comment: Miles with IRI 171-194 inches/mile
      - name: miles_iri_195_220
        type: double
        nullable: true
        comment: Miles with IRI 195-220 inches/mile
      - name: miles_iri_over_220
        type: double
        nullable: true
        comment: Miles with IRI > 220 inches/mile
      - name: miles_total_reported
        type: double
        nullable: true
        comment: Total miles with measured roughness on record

    source:
      type: http
      url: "https://www.fhwa.dot.gov/policyinformation/statistics/{year}/xls/hm64.xlsx"
      method: GET
      # Transformer re-downloads the URL as raw bytes and parses with POI; the
      # text body handed in is ignored (binary XLSX corrupts under UTF-8 decode).
      parallel: 1
      response:
        format: text
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.transport.FhwaPavementRoughnessTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=pavement_roughness/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: pavement_roughness
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # USACE WATERWAY LOCKS — ArcGIS Hub CSV export (snapshot)
  # ---------------------------------------------------------------------------
  - name: usace_locks
    # Freshness gate: ArcGIS Hub CSV export has no meaningful Last-Modified for a live
    # dataset query, so this hashes the response body post-fetch (fails open on a missing
    # prior token), matching this schema's own airports table.
    freshness:
      type: hash
    pattern: "type=usace_locks/*.parquet"
    partitions: *static_partitions
    comment: >
      US Army Corps of Engineers navigation lock inventory (Lock Performance Monitoring
      System master list) — one row per lock chamber, 234 locks nationally, with the year
      each opened as the age field. No per-lock condition or deferred-maintenance figure is
      published anywhere (NID's own CONDITION_ASSESSMENT field reads "Not Available" for
      every USACE navigation dam checked) — only age is sourced here, not condition or
      backlog. Hosted on ArcGIS Hub under an individual account rather than an official
      USACE/HIFLD org account; re-verify the URL if it ever 404s, same caveat class as this
      warehouse's other individually-hosted ArcGIS mirrors (housing.opportunity_zones,
      lands.va_facilities). Joins to geo.states via state_abbr.
      Source: opendata.arcgis.com dataset 78ef8693f30b40b980737c561ce6b103_0.

    dimensions:
      type:
        - usace_locks

    columns:
      - name: lock_id
        type: string
        nullable: false
        expression: 'src."NDCCODE"'
        comment: USACE National Datum/Drainage Code — stable natural key, PK
      - name: name
        type: string
        nullable: true
        expression: 'src."PMSNAME"'
      - name: river
        type: string
        nullable: true
        expression: 'src."RIVER"'
      - name: state_abbr
        type: string
        nullable: true
        expression: 'src."STATE"'
        comment: 2-letter USPS state code (FK component to geo.states)
      - name: division
        type: string
        nullable: true
        expression: 'src."DIVISION"'
        comment: USACE division code (e.g. LRD, SWD)
      - name: district
        type: string
        nullable: true
        expression: 'src."DISTRICT"'
        comment: USACE district code (e.g. LRL, SWL)
      - name: year_open
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."YEAROPEN" AS INTEGER)'
        comment: Year the lock opened — the age field this table exists to carry
      - name: length_ft
        type: double
        nullable: true
        expression: 'TRY_CAST(src."LENGTH" AS DOUBLE)'
        comment: Usable chamber length (feet)
      - name: width_ft
        type: double
        nullable: true
        expression: 'TRY_CAST(src."WIDTH" AS DOUBLE)'
        comment: Usable chamber width (feet)
      - name: lift_ft
        type: double
        nullable: true
        expression: 'TRY_CAST(src."LIFT" AS DOUBLE)'
        comment: Normal lift (feet)
      - name: latitude
        type: double
        nullable: true
        expression: 'TRY_CAST(src."Y" AS DOUBLE)'
      - name: longitude
        type: double
        nullable: true
        expression: 'TRY_CAST(src."X" AS DOUBLE)'

    source:
      type: http
      url: "https://opendata.arcgis.com/api/v3/datasets/78ef8693f30b40b980737c561ce6b103_0/downloads/data?format=csv&spatialRefId=4326"
      method: GET
      response:
        format: csv
        hasHeader: true
        delimiter: ","
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=usace_locks/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: usace_locks
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # FMCSA MOTOR CARRIER CENSUS — DOT Socrata az4n-8mr2 bulk CSV (snapshot)
  # ---------------------------------------------------------------------------
  - name: fmcsa_carriers
    # Freshness gate: Socrata dataset ETag. Must be at the table level, not nested under
    # source: — EtlPipelineConfig.fromMap only reads freshness: from the table's own map,
    # so a copy nested under source: is silently never parsed.
    freshness:
      type: etag
    pattern: "type=fmcsa_carriers/*.parquet"
    partitions: *static_partitions
    comment: >
      FMCSA Company Census File — one row per USDOT-registered motor carrier
      (~4.47M rows), carrying registration, fleet size (drivers, CDL drivers,
      power/truck/bus units), operation type, hazmat authorization, and (for
      carriers that received a compliance review) the assigned safety rating
      and a per-carrier recordable_crash_rate. Event-level crash/inspection/
      out-of-service records are NOT on this file (only ~54K carriers are ever
      rated); they publish as separate per-event SMS datasets (SMS Input -
      Crash 4wxs-vbns / aayw-vxb3, SMS Input - Inspection rbkj-cgst) and would
      be their own raw tables + a rollup view, per the one-source-per-table
      rule. Bulk CSV export of DOT Socrata dataset az4n-8mr2 — the whole set is
      downloaded in one unpaginated request and the partition overwritten each
      run, so this is a snapshot. Source:
      data.transportation.gov/api/views/az4n-8mr2/rows.csv?accessType=DOWNLOAD.
    dqRowLimit: 200000

    dimensions:
      type:
        - fmcsa_carriers

    columns:
      - name: dot_number
        type: string
        nullable: false
        expression: 'src."DOT_NUMBER"'
        comment: USDOT number — PK
      - name: carrier_name
        type: string
        nullable: true
        expression: 'src."LEGAL_NAME"'
        comment: Legal carrier name (fuzzy-join to sec.filing_metadata)
      - name: dba_name
        type: string
        nullable: true
        expression: 'src."DBA_NAME"'
        comment: Doing-business-as name (often blank)
      - name: phy_city
        type: string
        nullable: true
        expression: 'src."PHY_CITY"'
        comment: Principal place of business — city
      - name: state_abbr
        type: string
        nullable: true
        expression: 'src."PHY_STATE"'
        comment: Principal office state (USPS abbr; FK component to geo.state_ref)
      - name: phy_zip
        type: string
        nullable: true
        expression: 'src."PHY_ZIP"'
        comment: Principal place of business — ZIP
      - name: business_org
        type: string
        nullable: true
        expression: 'src."BUSINESS_ORG_DESC"'
        comment: Business organization (CORPORATION / LLC / SOLE PROPRIETOR / ...)
      - name: classdef
        type: string
        nullable: true
        expression: 'src."CLASSDEF"'
        comment: Carrier classification (semicolon multi-value, e.g. PRIVATE PROPERTY;AUTHORIZED FOR HIRE)
      - name: operation_type
        type: string
        nullable: true
        expression: 'src."CARRIER_OPERATION"'
        comment: Operation classification (A=Interstate, B=Intrastate Hazmat, C=Intrastate Non-Hazmat)
      - name: safety_rating
        type: string
        nullable: true
        expression: 'src."SAFETY_RATING"'
        comment: Safety rating (S=Satisfactory, C=Conditional, U=Unsatisfactory; blank unless a compliance review occurred)
      - name: safety_rating_date
        type: date
        nullable: true
        expression: 'TRY_CAST(try_strptime(NULLIF(src."SAFETY_RATING_DATE",''''), ''%Y%m%d'') AS DATE)'
        comment: Date of the most recent safety rating
      - name: review_date
        type: date
        nullable: true
        expression: 'TRY_CAST(try_strptime(NULLIF(src."REVIEW_DATE",''''), ''%Y%m%d'') AS DATE)'
        comment: Date of the most recent compliance review
      - name: total_drivers
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."TOTAL_DRIVERS" AS INTEGER)'
        comment: Number of drivers
      - name: total_cdl
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."TOTAL_CDL" AS INTEGER)'
        comment: Number of CDL drivers
      - name: power_units
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."POWER_UNITS" AS INTEGER)'
        comment: Power units (trucks and tractors)
      - name: truck_units
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."TRUCK_UNITS" AS INTEGER)'
        comment: Truck units
      - name: bus_units
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."BUS_UNITS" AS INTEGER)'
        comment: Bus units
      - name: hazmat_flag
        type: string
        nullable: true
        expression: 'src."HM_Ind"'
        comment: Authorized to transport hazardous materials (Y/N)
      - name: recordable_crash_rate
        type: double
        nullable: true
        expression: 'TRY_CAST(src."RECORDABLE_CRASH_RATE" AS DOUBLE)'
        comment: FMCSA recordable crash rate (per the carrier census, when computed)
      - name: mcs150_mileage
        type: long
        nullable: true
        expression: 'TRY_CAST(src."MCS150_MILEAGE" AS BIGINT)'
        comment: Annual vehicle miles traveled reported on the MCS-150
      - name: mcs150_mileage_year
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."MCS150_MILEAGE_YEAR" AS INTEGER)'
        comment: Year of the reported MCS-150 mileage
      - name: status_code
        type: string
        nullable: true
        expression: 'src."STATUS_CODE"'
        comment: Carrier record status code (A=Active, I=Inactive, ...)

    source:
      type: http
      # Socrata bulk CSV export = the whole dataset in one unpaginated request
      # (preferred over $limit/$offset paging of 4.47M rows). Headers are the
      # UPPERCASE source field names (note HM_Ind is mixed-case).
      url: "https://data.transportation.gov/api/views/az4n-8mr2/rows.csv?accessType=DOWNLOAD"
      method: GET
      response:
        format: csv
        hasHeader: true
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=fmcsa_carriers/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: fmcsa_carriers
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        incrementalTtlDays: 7
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # FAA AIRCRAFT REGISTRY — ReleasableAircraft.zip, one faithful table per file
  # ---------------------------------------------------------------------------
  # The zip holds MASTER.txt (registered aircraft), ACFTREF.txt (aircraft
  # reference), ENGINE.txt (engine reference), plus DEALER/RESERVED/DEREG. Each
  # file is a comma-delimited, space-padded, header-bearing text file (verified
  # 0 ragged rows — no embedded commas), so each lands as a faithful clean-CSV
  # passthrough table (all columns, no Java), sharing one cached zip via
  # extractPattern. The friendly denormalized join + code decoding is the
  # faa_aircraft_registry VIEW (SQL, never Java). The prior single projected
  # table dropped engine detail, Mode-S/ICAO hex, addresses, and dates.
  # ---------------------------------------------------------------------------
  - name: faa_aircraft_master
    # Freshness gate: FAA registry bulk zip, periodic full snapshot on a fixed static
    # path. A Last-Modified probe skips the re-download and re-materialize on unchanged
    # runs (fails open).
    freshness:
      type: last_modified
    pattern: "type=faa_aircraft_master/*.parquet"
    partitions: *static_partitions
    comment: >
      FAA MASTER.txt — one row per registered aircraft (~314K), keyed by
      N-number. Faithful recreation of the master file: registration, address,
      airworthiness/certificate dates, Mode-S transponder codes, fractional
      ownership, kit build, and the reference/engine join codes. Snapshot.
      Source: registry.faa.gov/database/ReleasableAircraft.zip (MASTER.txt).
    dqRowLimit: 100000

    dimensions:
      type:
        - faa_aircraft_master

    columns:
      - name: n_number
        type: string
        nullable: false
        expression: '''N'' || trim(src."N-NUMBER")'
        comment: FAA N-number / tail number, canonical N-prefixed form (e.g. N100) — PK; join target for airline_ontime.tail_number and ntsb_aviation_accidents.aircraft_n_number
      - name: serial_number
        type: string
        nullable: true
        expression: 'trim(src."SERIAL NUMBER")'
        comment: Manufacturer serial number
      - name: mfr_mdl_code
        type: string
        nullable: true
        expression: 'trim(src."MFR MDL CODE")'
        comment: 7-char Aircraft Mfr/Model/Series code (FK to faa_aircraft_reference.code)
      - name: eng_mfr_mdl
        type: string
        nullable: true
        expression: 'trim(src."ENG MFR MDL")'
        comment: 5-char engine Mfr/Model code (FK to faa_engine_reference.code)
      - name: year_mfr
        type: integer
        nullable: true
        expression: 'TRY_CAST(NULLIF(trim(src."YEAR MFR"),'''') AS INTEGER)'
        comment: Year of manufacture
      - name: type_registrant
        type: string
        nullable: true
        expression: 'trim(src."TYPE REGISTRANT")'
        comment: Registrant type code (1=Individual, 3=Corporation, 5=Government, 7=LLC, ...)
      - name: registrant_name
        type: string
        nullable: true
        expression: 'trim(src."NAME")'
        comment: Registered owner name
      - name: street
        type: string
        nullable: true
        expression: 'trim(src."STREET")'
        comment: Registrant street address
      - name: street2
        type: string
        nullable: true
        expression: 'trim(src."STREET2")'
        comment: Registrant street address line 2
      - name: city
        type: string
        nullable: true
        expression: 'trim(src."CITY")'
        comment: Registrant city
      - name: state_abbr
        type: string
        nullable: true
        expression: 'trim(src."STATE")'
        comment: Registrant state (USPS abbr; FK to geo.state_ref)
      - name: zip_code
        type: string
        nullable: true
        expression: 'trim(src."ZIP CODE")'
        comment: Registrant ZIP code
      - name: region
        type: string
        nullable: true
        expression: 'trim(src."REGION")'
        comment: FAA region code (internal, not census)
      - name: county_code
        type: string
        nullable: true
        expression: 'trim(src."COUNTY")'
        comment: County code (3-digit FIPS county within state, US records)
      - name: country
        type: string
        nullable: true
        expression: 'trim(src."COUNTRY")'
        comment: Country code (US = domestic)
      - name: last_action_date
        type: date
        nullable: true
        expression: 'TRY_CAST(try_strptime(NULLIF(trim(src."LAST ACTION DATE"),''''), ''%Y%m%d'') AS DATE)'
        comment: Date of last registration action
      - name: cert_issue_date
        type: date
        nullable: true
        expression: 'TRY_CAST(try_strptime(NULLIF(trim(src."CERT ISSUE DATE"),''''), ''%Y%m%d'') AS DATE)'
        comment: Certificate issue date
      - name: certification
        type: string
        nullable: true
        expression: 'trim(src."CERTIFICATION")'
        comment: Airworthiness classification + approved operations (packed code)
      - name: type_aircraft
        type: string
        nullable: true
        expression: 'trim(src."TYPE AIRCRAFT")'
        comment: Aircraft type code (denormalized; see faa_aircraft_reference.type_acft)
      - name: type_engine
        type: string
        nullable: true
        expression: 'trim(src."TYPE ENGINE")'
        comment: Engine type code (denormalized; see faa_aircraft_reference.type_eng)
      - name: status_code
        type: string
        nullable: true
        expression: 'trim(src."STATUS CODE")'
        comment: Registration status code (V=Valid, R=pending, ...)
      - name: mode_s_code
        type: string
        nullable: true
        expression: 'trim(src."MODE S CODE")'
        comment: Mode-S transponder code (octal)
      - name: fract_owner
        type: string
        nullable: true
        expression: 'trim(src."FRACT OWNER")'
        comment: Fractional ownership indicator (Y/blank)
      - name: airworthiness_date
        type: date
        nullable: true
        expression: 'TRY_CAST(try_strptime(NULLIF(trim(src."AIR WORTH DATE"),''''), ''%Y%m%d'') AS DATE)'
        comment: Date of original airworthiness certificate
      - name: other_names_1
        type: string
        nullable: true
        expression: 'trim(src."OTHER NAMES(1)")'
        comment: Additional registrant name 1
      - name: other_names_2
        type: string
        nullable: true
        expression: 'trim(src."OTHER NAMES(2)")'
        comment: Additional registrant name 2
      - name: other_names_3
        type: string
        nullable: true
        expression: 'trim(src."OTHER NAMES(3)")'
        comment: Additional registrant name 3
      - name: other_names_4
        type: string
        nullable: true
        expression: 'trim(src."OTHER NAMES(4)")'
        comment: Additional registrant name 4
      - name: other_names_5
        type: string
        nullable: true
        expression: 'trim(src."OTHER NAMES(5)")'
        comment: Additional registrant name 5
      - name: expiration_date
        type: date
        nullable: true
        expression: 'TRY_CAST(try_strptime(NULLIF(trim(src."EXPIRATION DATE"),''''), ''%Y%m%d'') AS DATE)'
        comment: Registration expiration date
      - name: unique_id
        type: string
        nullable: true
        expression: 'trim(src."UNIQUE ID")'
        comment: FAA stable unique aircraft id
      - name: kit_mfr
        type: string
        nullable: true
        expression: 'trim(src."KIT MFR")'
        comment: Kit manufacturer (amateur-built)
      - name: kit_model
        type: string
        nullable: true
        expression: 'trim(src."KIT MODEL")'
        comment: Kit model (amateur-built)
      - name: mode_s_code_hex
        type: string
        nullable: true
        expression: 'trim(src."MODE S CODE HEX")'
        comment: Mode-S / ICAO 24-bit address (hex; ADS-B flight-tracking join key)

    source:
      type: http
      url: "https://registry.faa.gov/database/ReleasableAircraft.zip"
      method: GET
      extractPattern: "MASTER.txt"
      response:
        format: csv
        hasHeader: true
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=faa_aircraft_master/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: faa_aircraft_master
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        incrementalTtlDays: 7
        overwritePartitions: true

  - name: faa_aircraft_reference
    # Freshness gate: same FAA registry bulk zip as faa_aircraft_master, periodic full
    # snapshot on a fixed static path. A Last-Modified probe skips the re-download and
    # re-materialize on unchanged runs (fails open).
    freshness:
