    dimensions:
      type:
        - faa_aircraft_reference

    columns:
      - name: code
        type: string
        nullable: false
        expression: 'trim(src."CODE")'
        comment: 7-char Aircraft Mfr/Model/Series code — PK
      - name: mfr
        type: string
        nullable: true
        expression: 'trim(src."MFR")'
        comment: Manufacturer name
      - name: model
        type: string
        nullable: true
        expression: 'trim(src."MODEL")'
        comment: Model / series name
      - name: type_acft
        type: string
        nullable: true
        expression: 'trim(src."TYPE-ACFT")'
        comment: Aircraft type code (4=Fixed wing single, 5=Fixed wing multi, 6=Rotorcraft, ...)
      - name: type_eng
        type: string
        nullable: true
        expression: 'trim(src."TYPE-ENG")'
        comment: Engine type code (1=Reciprocating, 4=Turbo-jet, 5=Turbo-fan, 10=Electric, ...)
      - name: ac_cat
        type: string
        nullable: true
        expression: 'trim(src."AC-CAT")'
        comment: Aircraft category code (1=Land, 2=Sea, 3=Amphibian)
      - name: build_cert_ind
        type: string
        nullable: true
        expression: 'trim(src."BUILD-CERT-IND")'
        comment: Builder certification (0=Type Certificated, 1=Not TC, 2=Light Sport)
      - name: no_eng
        type: integer
        nullable: true
        expression: 'TRY_CAST(NULLIF(trim(src."NO-ENG"),'''') AS INTEGER)'
        comment: Number of engines
      - name: no_seats
        type: integer
        nullable: true
        expression: 'TRY_CAST(NULLIF(trim(src."NO-SEATS"),'''') AS INTEGER)'
