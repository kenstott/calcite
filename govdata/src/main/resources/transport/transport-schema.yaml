  # ---------------------------------------------------------------------------
  # STB EP 724 RAIL SERVICE DATA — Class I weekly service performance (delta by year)
  # ---------------------------------------------------------------------------
  - name: rail_service_performance
    # STB filings are not revised after publication once posted, but the open year keeps
    # gaining ~52 new weekly rows as filings arrive, and the last weeks of December can post
    # after the calendar year rolls over (same shape as EIA's WPSR weekly stocks). lookbackPeriods: 2
    # re-fetches the open year plus the prior year to catch any such late weeks.
    lookbackPeriods: 2
    # Freshness gate: the Opendatasoft catalog API export has no meaningful Last-Modified/ETag
    # for a filtered (where=) query, so this hashes the response body post-fetch to skip the
    # materialize/commit when unchanged (fails open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=rail_service_performance/year=*/*.parquet"
    partitions: *standard_partitions
    dqRowLimit: 50000
    comment: >
      STB EP 724 Rail Service Data — weekly Class I railroad service-performance
      filings required under 49 CFR 1250 (BNSF, CN, CP, CPKC, CSXT, KCS, NS, UP).
      Long format: one row per (railroad, measure, sub_measure, report week) —
      average train speed (mph), terminal dwell time (hours), average cars on
      line, dwell time at origin for unit trains, trains held per day (by
      cause), cars in revenue service not moved in 48+ hours, grain car orders/
      loadings/past-due, coal unit train loadings actual vs. planned, and
      carloads originated/received by commodity category — each measure
      carries its own units/scale in measure_units/measure_scale, so ALWAYS
      filter on measure_name_analytics (mixing measures in an aggregate mixes
      incompatible units, e.g. mph with hours with car counts). sub_measure's
      meaning depends on the measure: train type, terminal name, region, or
      commodity. Delta by year; dataLag 0 (year == effective_year, essentially
      no publish lag). Source:
      opendata.stb.gov/api/v2/catalog/datasets/ep724-public-data.

    dimensions:
      type:
        - rail_service_performance
      year: *ep724_year_range

    columns:
      - name: railroad_mark
        type: string
        nullable: false
        comment: Class I railroad AAR reporting mark (BNSF, CN, CP, CPKC, CSXT, KCS, NS, UP) — PK component
      - name: railroad_name
        type: string
        nullable: true
        comment: Standardized railroad name
      - name: measure_name_analytics
        type: string
        nullable: false
        comment: >
          Standardized snake_case measure identifier — PK component. The ~21
          distinct measures carry incompatible units/scales (see measure_units/
          measure_scale on the same row); enumerate with SELECT DISTINCT
          measure_name_analytics, measure_name_full, measure_units.
      - name: measure_name_full
        type: string
        nullable: true
        comment: Human-readable measure name as filed (e.g. "Average Train Speed")
      - name: data_element_num
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."data_element_num" AS INTEGER)'
        comment: STB internal data element number for the measure
      - name: sub_measure
        type: string
        nullable: true
        comment: >
          Sub-classification as filed — PK component. Meaning depends on
          measure_name_analytics: train type (e.g. Grain, Intermodal) for
          speed / dwell-at-origin measures, terminal name for terminal dwell
          time, commodity for carloads, cause for train-holding measures.
      - name: sub_measure_analytics
        type: string
        nullable: true
        comment: Standardized/normalized version of sub_measure
      - name: fact_value_analytics
        type: double
        nullable: true
        expression: 'TRY_CAST(src."fact_value_analytics" AS DOUBLE)'
        comment: Standardized numeric value for the measure (NULL where the filed value was non-numeric, e.g. n/a)
      - name: measure_units
        type: string
        nullable: true
        comment: Unit of measure (e.g. mph, hours, cars)
      - name: measure_scale
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."measure_scale" AS INTEGER)'
        comment: Scale factor applied to fact_value_analytics
      - name: measure_confidentiality
        type: string
        nullable: true
        comment: Confidentiality designation (e.g. Public)
      - name: report_period_start_date
        type: date
        nullable: false
        expression: 'TRY_CAST(src."report_period_start_date" AS DATE)'
        comment: Start date of the weekly reporting period — PK component
      - name: report_period_end_date
        type: date
        nullable: true
        expression: 'TRY_CAST(src."report_period_end_date" AS DATE)'
        comment: End date of the weekly reporting period
      - name: report_year
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."report_year" AS INTEGER)'
        comment: STB filing year (report_year_analytics; a report week can span into an adjacent calendar year)
      - name: report_collection_frequency
        type: string
        nullable: true
        comment: Filing frequency (weekly)

    source:
      type: http
      # Opendatasoft (ODS Explore v2) catalog export API. where= filters to the iteration
      # year via report_year_analytics; delimiter=, requests comma-separated CSV (the API
      # defaults to semicolon). Fields with embedded commas (e.g. sub_measure_analytics
      # terminal names like "JACKSON, MS (CPKC)") are properly RFC4180-quoted by the server
      # (verified live), so no quoted:false override is needed here (contrast safety_complaints).
      url: "https://opendata.stb.gov/api/v2/catalog/datasets/ep724-public-data/exports/csv?where=report_year_analytics%3D%27{year}%27&delimiter=%2C"
      method: GET
      response:
        format: csv
        hasHeader: true
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=rail_service_performance/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: rail_service_performance
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

# ============================================================================
# CONSTRAINTS
# ============================================================================
# PKs identify one observation. Most FKs are inter-schema, pointing at geo
# dimension tables via state/county keys. The one intra-transport dimension is
# airports: the aviation traffic tables (airline_ontime, t100_segments) FK their
# origin/dest airport codes to airports.arpt_id. The road-safety and transit
# tables share only geo keys with the rest.
# ============================================================================

constraints:

  vehicle_recalls:
    primaryKey: [nhtsa_id]

  safety_complaints:
    primaryKey: [cmplid]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [state_of_incident]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  fatal_crashes:
    primaryKey: [year, st_case]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  airline_ontime:
    primaryKey: [flight_date, reporting_airline, flight_number, origin, dest, crs_dep_time]
    foreignKeys:
      - columns: [origin]
        targetTable: airports
        targetColumns: [arpt_id]
      - columns: [dest]
        targetTable: airports
        targetColumns: [arpt_id]
      - columns: [tail_number]
        targetTable: faa_aircraft_master
        targetColumns: [n_number]
      - columns: [origin_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [dest_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  airports:
    primaryKey: [arpt_id]
    foreignKeys:
      - columns: [state_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  transit_ridership:
    primaryKey: [agency_mode_tos_date]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  t100_segments:
    # service_class is part of the grain: T-100 publishes separate rows per
    # service class (scheduled passenger vs. cargo, etc.) for the same
    # carrier/route/aircraft/month, so it must be in the key to stay unique.
    primaryKey: [year, month, carrier, origin, dest, aircraft_type, service_class]
    foreignKeys:
      - columns: [origin]
        targetTable: airports
        targetColumns: [arpt_id]
      - columns: [dest]
        targetTable: airports
        targetColumns: [arpt_id]
      - columns: [origin_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [dest_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  vehicle_registrations:
    primaryKey: [year, state_fips]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]

  pavement_roughness:
    primaryKey: [year, state_fips, area_type, road_class]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]

  usace_locks:
    primaryKey: [lock_id]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  fmcsa_carriers:
    primaryKey: [dot_number]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  faa_aircraft_master:
    primaryKey: [n_number]
    unique:
      - [unique_id]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [mfr_mdl_code]
        targetTable: faa_aircraft_reference
        targetColumns: [code]
      - columns: [eng_mfr_mdl]
        targetTable: faa_engine_reference
        targetColumns: [code]

  faa_aircraft_reference:
    primaryKey: [code]

  faa_engine_reference:
    primaryKey: [code]

  ntsb_aviation_accidents:
    primaryKey: [event_id, aircraft_key]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [airport_id]
        targetTable: airports
        targetColumns: [arpt_id]
      - columns: [aircraft_n_number]
        targetTable: faa_aircraft_master
        targetColumns: [n_number]

  cfs_shipments:
    primaryKey: [shipmt_id]
    foreignKeys:
      - columns: [orig_state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [dest_state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      # Not enforced/checked for "NN-NN" collapsed-range values (no single ref row by design —
      # see the sctg_code column comment); DQ's T8 join-coverage check accounts for this.
      - columns: [sctg_code]
        targetTable: cfs_sctg_ref
        targetColumns: [sctg_code]
      - columns: [mode_code]
        targetTable: cfs_mode_ref
        targetColumns: [mode_code]

  cfs_sctg_ref:
    primaryKey: [sctg_code]

  cfs_mode_ref:
    primaryKey: [mode_code]

  bts_port_teu:
    primaryKey: [type, port_code, report_date]

  bridges:
    primaryKey: [year, state_code, structure_number]
    foreignKeys:
      - columns: [state_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]

  rail_service_performance:
    primaryKey: [railroad_mark, measure_name_analytics, sub_measure, report_period_start_date]

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: airline_ontime_by_carrier_month
    comment: >
      Monthly on-time summary by reporting carrier (nationwide, not by route):
      flight counts, average arrival delay, cancellation rate, and the share of
      departures delayed 15+ minutes (pct_dep_delayed_15). The headline
      punctuality rollup over airline_ontime.
    sql: >
      SELECT
        o.year,
        o.month,
        o.reporting_airline,
        COUNT(*)                                      AS flights,
        AVG(o.arr_delay)                              AS avg_arr_delay,
        SUM(o.cancelled)                              AS cancellations,
        SUM(o.cancelled) / CAST(COUNT(*) AS DOUBLE)   AS cancellation_rate,
        AVG(o.dep_del15)                              AS pct_dep_delayed_15
      FROM airline_ontime o
      GROUP BY o.year, o.month, o.reporting_airline

  - name: fatal_crashes_by_state_year
    comment: >
      Fatal crashes, total fatalities, and pedestrians involved by state and
      year — the core FARS rollup over fatal_crashes, joinable to geo.states
      and census population for per-capita rates.
    sql: >
      SELECT
        f.year,
        f.state_fips,
        f.state_name,
        COUNT(*)             AS crashes,
        SUM(f.fatalities)    AS fatalities,
        SUM(f.pedestrians)   AS pedestrians_involved
      FROM fatal_crashes f
      GROUP BY f.year, f.state_fips, f.state_name

  - name: transit_ridership_by_agency_year
    comment: >
      Annual transit ridership by agency, mode, and state: unlinked passenger
      trips and vehicle revenue miles, summed from the monthly
      transit_ridership series.
    sql: >
      SELECT
        CAST(EXTRACT(YEAR FROM t.ride_date) AS INTEGER) AS year,
        t.ntd_id,
        t.agency,
        t.mode_name,
        t.state_abbr,
        SUM(t.upt)   AS unlinked_passenger_trips,
        SUM(t.vrm)   AS vehicle_revenue_miles
      FROM transit_ridership t
      GROUP BY 1, t.ntd_id, t.agency, t.mode_name, t.state_abbr

  - name: bts_freight_flows
    comment: >
      Commodity Flow Survey freight flows — the origin-state x destination-state x
      SCTG commodity x mode estimate, aggregated from the cfs_shipments Public Use
      File by the tabulation weight (WGT_FACTOR). value_million = USD millions,
      tons_thousands = thousands of short tons (weight_lb / 2000), ton_miles_million
      = millions of ton-miles (tons x routed miles). These are sample-weighted
      estimates and approximate — not identical to — the official published CFS
      tables. Every other CFS cross-tab (by NAICS, by distance band, ...) is a
      sibling view over cfs_shipments; add as needed.
    sql: >
      SELECT
        s.survey_year,
        s.orig_state_fips                                             AS origin_state_fips,
        s.dest_state_fips,
        s.sctg_code,
        s.mode_code,
        SUM(s.shipmt_value * s.wgt_factor) / 1e6                      AS value_million,
        SUM(s.shipmt_weight_lb * s.wgt_factor) / 2000.0 / 1000.0      AS tons_thousands,
        SUM(s.shipmt_weight_lb * s.wgt_factor * s.dist_routed_miles) / 2000.0 / 1e6
                                                                      AS ton_miles_million,
        COUNT(*)                                                      AS sample_shipments
      FROM cfs_shipments s
      GROUP BY s.survey_year, s.orig_state_fips, s.dest_state_fips, s.sctg_code, s.mode_code

  - name: faa_aircraft_registry
    comment: >
      Friendly denormalized view of the FAA aircraft registry: faa_aircraft_master
      joined to faa_aircraft_reference (manufacturer / model / category / seats)
      and faa_engine_reference (engine make / model / horsepower / thrust), with
      the registrant-type, aircraft-type, engine-type, category and status codes
      decoded. n_number is surfaced as the full tail number (N-prefixed). Raw
      per-file detail (addresses, Mode-S codes, dates, kit build, other names)
      stays on faa_aircraft_master; other cross-tabs are sibling views.
    sql: >
      SELECT
        m.n_number,
        m.unique_id,
        m.serial_number,
        m.mfr_mdl_code,
        r.mfr                                                        AS manufacturer,
        r.model                                                      AS model,
        CASE r.ac_cat WHEN '1' THEN 'Land' WHEN '2' THEN 'Sea' WHEN '3' THEN 'Amphibian' END AS aircraft_category,
        CASE COALESCE(r.type_acft, m.type_aircraft)
          WHEN '1' THEN 'Glider' WHEN '2' THEN 'Balloon' WHEN '3' THEN 'Blimp/Dirigible'
          WHEN '4' THEN 'Fixed wing single engine' WHEN '5' THEN 'Fixed wing multi engine'
          WHEN '6' THEN 'Rotorcraft' WHEN '7' THEN 'Weight-shift-control'
          WHEN '8' THEN 'Powered Parachute' WHEN '9' THEN 'Gyroplane'
          WHEN 'H' THEN 'Hybrid Lift' WHEN 'O' THEN 'Other' END      AS aircraft_type,
        CASE COALESCE(r.type_eng, m.type_engine)
          WHEN '0' THEN 'None' WHEN '1' THEN 'Reciprocating' WHEN '2' THEN 'Turbo-prop'
          WHEN '3' THEN 'Turbo-shaft' WHEN '4' THEN 'Turbo-jet' WHEN '5' THEN 'Turbo-fan'
          WHEN '6' THEN 'Ramjet' WHEN '7' THEN '2 Cycle' WHEN '8' THEN '4 Cycle'
          WHEN '9' THEN 'Unknown' WHEN '10' THEN 'Electric' WHEN '11' THEN 'Rotary' END AS engine_type,
        r.no_eng                                                     AS num_engines,
        r.no_seats                                                   AS num_seats,
        r.ac_weight                                                  AS weight_class,
        e.mfr                                                        AS engine_manufacturer,
        e.model                                                      AS engine_model,
        e.horsepower                                                 AS engine_horsepower,
        e.thrust                                                     AS engine_thrust,
        m.year_mfr                                                   AS year_manufactured,
        m.registrant_name,
        CASE m.type_registrant
          WHEN '1' THEN 'Individual' WHEN '2' THEN 'Partnership' WHEN '3' THEN 'Corporation'
          WHEN '4' THEN 'Co-Owned' WHEN '5' THEN 'Government' WHEN '7' THEN 'LLC'
          WHEN '8' THEN 'Non-Citizen Corporation' WHEN '9' THEN 'Non-Citizen Co-Owned' END AS registrant_type,
        m.city,
        m.state_abbr,
        m.zip_code,
        m.county_code,
        m.country,
        CASE m.status_code
          WHEN 'V' THEN 'Valid Registration' WHEN 'R' THEN 'Registration pending'
          WHEN 'A' THEN 'Triennial form not returned' WHEN 'D' THEN 'Expired Dealer'
          WHEN 'E' THEN 'Revoked by enforcement' WHEN 'W' THEN 'Certificate ineffective'
          WHEN 'Z' THEN 'Permanent Reserved' ELSE m.status_code END  AS status,
        m.mode_s_code_hex,
        m.fract_owner,
        m.cert_issue_date,
        m.airworthiness_date,
        m.expiration_date
      FROM faa_aircraft_master m
      LEFT JOIN faa_aircraft_reference r ON m.mfr_mdl_code = r.code
      LEFT JOIN faa_engine_reference e ON m.eng_mfr_mdl = e.code
