        comment: PHMSA report number (PK) — an operator may file multiple commodity rows per year, so this is the unique key, not operator_id + report_year
      - name: operator_id
        type: string
        nullable: true
        expression: 'src."OPERATOR_ID"'
        comment: PHMSA operator identifier — join key to phmsa_gas_transmission_incidents.operator_id
      - name: operator_name
        type: string
        nullable: true
        expression: 'src."PARTA2NAMEOFCOMP"'
      - name: operator_state_abbr
        type: string
        nullable: true
        expression: 'src."PARTA4STATE"'
        comment: 2-letter USPS state code of the operator's address
      - name: commodity
        type: string
        nullable: true
        expression: 'src."PARTA5COMMODITY"'
      - name: hca_miles_onshore
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTBHCAONSHORE" AS DOUBLE)'
        comment: Miles in High Consequence Areas, onshore (Part B)
      - name: hca_miles_offshore
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTBHCAOFFSHORE" AS DOUBLE)'
      - name: hca_miles_total
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTBHCATOTAL" AS DOUBLE)'
      - name: total_transmission_miles
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTDTTOTAL" AS DOUBLE)'
        comment: Transmission-only pipeline miles (Part D), excludes gathering lines
      - name: total_gathering_miles
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTDGTOTAL" AS DOUBLE)'
        comment: Gathering-only pipeline miles (Part D), excludes transmission lines
      - name: total_miles
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTDTOTALMILES" AS DOUBLE)'
        comment: Total regulated pipeline miles operated, transmission + gathering combined (Part D) — the per-mile safety-rate denominator
      - name: report_submission_type
        type: string
        nullable: true
        expression: 'src."REPORT_SUBMISSION_TYPE"'
        comment: "e.g. INITIAL, AMENDED — later amended reports for the same (report_year, operator) supersede earlier ones; not deduplicated here"

    source:
      type: http
      url: "https://data.transportation.gov/api/views/aemm-7pyq/files/367958b0-451a-42fe-ac8f-9ee75eecc5e1"
      method: GET
      # Matches every "... Part A to D.csv" entry across all years in the zip and merges
      # them into one CSV stream (shared identical 154-column header across 2017-2024).
      extractPattern: "*Part A to D.csv"
      response:
        format: csv
        hasHeader: true
      # Same comma-only padding line defect as phmsa_hazardous_liquid_mileage —
      # confirmed live (1-16 blank rows per year, 2017-2024). Requires OPERATOR_ID to be
      # non-empty to drop them rather than materializing all-NULL rows.
      rowFilter:
        column: OPERATOR_ID
        pattern: '.+'
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
