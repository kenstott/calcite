  # ---------------------------------------------------------------------------
  # BTS PORT TEU — Monthly container throughput, Top-10 US ports (static, Jan 2019-Oct 2022)
  # ---------------------------------------------------------------------------
  - name: bts_port_teu
      # Socrata serves a version-based ETag and a Last-Modified on a HEAD (verified live), so
      # the dataset's own version is the change signal. A hash gate would have to download the
      # whole response every run to compute one, since the hash is taken from the body.
    freshness:
      type: etag
    pattern: "type=bts_port_teu/*.parquet"
    partitions: *static_partitions
    comment: >
      Monthly container throughput (TEUs) for the Top-10 U.S. container ports, from BTS's Port
      Performance Freight Statistics Program (Socrata rd72-aq8r, "Monthly TEU Data"). Melted from
      the source's one-row-per-month/one-column-per-port layout into one row per (port, month).
      This is the best freely-ingestible port-level container-volume series found — the
      industry-standard NRF/Hackett Global Port Tracker has no free bulk-downloadable time
      series, only point figures in press releases (confirmed independently by two arms in
      Defect Register D-109). NOT a currently-updated series: the source dataset itself stops at
      October 2022 (46 months from Jan 2019) and has not been refreshed since — verified live
      27 Aug 2026. Real historical data for that window, not a live/current-era proxy; a
      national customs-value proxy (econ.trade_imports) remains the only current-era option.

    dimensions:
      type:
        - bts_port_teu

    columns:
      - name: report_date
        type: date
        nullable: false
        comment: First of month
      - name: port_code
        type: string
        nullable: false
        comment: Source column name for this port (e.g. "los_angeles_ca")
      - name: port_name
        type: string
        nullable: true
        comment: Human-readable port name
      - name: teu
        type: double
        nullable: true
        comment: Twenty-foot equivalent units handled that month

    source:
      type: http
      url: "https://data.bts.gov/resource/rd72-aq8r.json?$limit=100"
      method: GET
      response:
        format: json   # BtsPortTeuTransformer melts the wide JSON response into long rows
      rawCache:
        enabled: true
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.transport.BtsPortTeuTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=bts_port_teu/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: bts_port_teu
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # NBI BRIDGES — FHWA National Bridge Inventory (delta by year, delimited zip)
  # ---------------------------------------------------------------------------
  - name: bridges
    # Freshness gate: FHWA bulk zip per year on a fixed static path. A Last-Modified
    # probe skips the re-download and re-materialize on unchanged runs (fails open).
    freshness:
      type: last_modified
    pattern: "type=bridges/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2013
      maxYear: 2025
      distinctYears: 13
      contiguous: true
      rowCount: 9494201
      checkedAt: "2026-09-05T14:50:06Z"
    partitions: *standard_partitions
    # Single-fetch bulk table (one national zip per year, dimensions: [type, year] only)
    # — see the govdata-dq-patterns single-fetch-bulk caveat: dqRowLimit takes the first
    # N rows of the one stream (rows are grouped by STATE_CODE_001 ascending), not a
    # representative cross-section. Acceptable for a smoke test; prod ignores the cap.
    dqRowLimit: 20000
    comment: >
      FHWA National Bridge Inventory — one row per bridge on public roads, per annual
      data-year snapshot. Deck/superstructure/substructure condition ratings (0-9, N),
      FHWA's own precomputed bridge_condition (Good/Fair/Poor) and lowest_rating summary
      fields, location, year built/reconstructed, traffic, and improvement-cost fields
      (bridge/roadway/total, plus year_of_imp) for federal-spending comparisons. The
      "delimited" national file uses a single-quote text qualifier that this table does
      not strip (isQuoted only supports RFC4180 double-quote parsing) — a handful of
      free-text columns (e.g. features_desc, facility_carried) carry literal leading/
      trailing single quotes; harmless for the numeric/coded columns this table curates.
      decimal_latitude/decimal_longitude are computed from the source's packed
      DDMMSS.ss / DDDMMSS.ss fields (Items 16/17) using length-relative substring
      extraction (minutes/seconds anchored to the end of the string, degrees to
      whatever remains at the front) rather than fixed character positions — the
      upstream CSV staging strips a leading zero from purely-numeric columns (e.g.
      Item 17 "087341348" arrives as "87341348"), which silently shifts a fixed-position
      split and was caught live producing -873.68 instead of -87.57 for an Alabama
      bridge; county_code is zero-padded back to 3 digits for the same reason. The raw
      LAT_016/LONG_017 fields are not carried through.
      Source: fhwa.dot.gov/bridge/nbi/{year}allstatesallrecsdel.zip (see
      fhwa.dot.gov/bridge/nbi/ascii.cfm).

    dimensions:
      type:
        - bridges
      year: *nbi_year_range

    columns:
      - name: state_code
        type: string
        nullable: true
        expression: 'lpad(CAST(TRY_CAST(src."STATE_CODE_001" AS INTEGER) AS VARCHAR), 2, ''0'')'
        comment: 2-digit NBI/FIPS state code (FK to geo.state_ref)
      - name: structure_number
        type: string
        nullable: false
        expression: 'src."STRUCTURE_NUMBER_008"'
        comment: Structure number, unique within state — PK component
      - name: county_code
        type: string
        nullable: true
        expression: 'lpad(CAST(TRY_CAST(src."COUNTY_CODE_003" AS INTEGER) AS VARCHAR), 3, ''0'')'
        comment: 3-digit county code component (FK component to geo.counties via state_code+county_code)
      - name: facility_carried
        type: string
        nullable: true
        expression: 'src."FACILITY_CARRIED_007"'
      - name: location
        type: string
        nullable: true
        expression: 'src."LOCATION_009"'
      - name: features_desc
        type: string
        nullable: true
        expression: 'src."FEATURES_DESC_006A"'
        comment: Feature intersected (waterway, road, railroad, etc.)
      - name: decimal_latitude
        type: double
        nullable: true
        expression: >-
          TRY_CAST(SUBSTRING(TRIM(src."LAT_016"), 1, LENGTH(TRIM(src."LAT_016")) - 6) AS DOUBLE)
          + TRY_CAST(SUBSTRING(TRIM(src."LAT_016"), LENGTH(TRIM(src."LAT_016")) - 5, 2) AS DOUBLE) / 60.0
          + TRY_CAST(SUBSTRING(TRIM(src."LAT_016"), LENGTH(TRIM(src."LAT_016")) - 3, 4) AS DOUBLE) / 100.0 / 3600.0
        comment: >-
          Decoded from packed NBI Item 16 (DDMMSS.ss). Minutes/seconds are taken from the
          right end of the string rather than a fixed offset: the upstream CSV staging
          strips a leading zero from purely-numeric columns (confirmed live — Item 17
          "087341348" arrives as "87341348"), which a fixed-position SUBSTRING misreads
          as a shifted degrees/minutes/seconds split. Length-relative extraction gives the
          same correct value whether or not the leading zero survived.
      - name: decimal_longitude
        type: double
        nullable: true
        expression: >-
          -1.0 * (TRY_CAST(SUBSTRING(TRIM(src."LONG_017"), 1, LENGTH(TRIM(src."LONG_017")) - 6) AS DOUBLE)
          + TRY_CAST(SUBSTRING(TRIM(src."LONG_017"), LENGTH(TRIM(src."LONG_017")) - 5, 2) AS DOUBLE) / 60.0
          + TRY_CAST(SUBSTRING(TRIM(src."LONG_017"), LENGTH(TRIM(src."LONG_017")) - 3, 4) AS DOUBLE) / 100.0 / 3600.0)
        comment: >-
          Decoded from packed NBI Item 17 (DDDMMSS.ss); negated (US bridges are West).
          Length-relative extraction — see decimal_latitude's comment; longitude degrees
          is normally 3 digits (leading zero for <100°) and is exactly where the upstream
          leading-zero stripping was caught: a fixed SUBSTRING(1,3) silently read 4 digits
          of degrees once the zero was gone, producing e.g. -873.68 instead of -87.57 for
          an Alabama bridge.
      - name: year_built
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."YEAR_BUILT_027" AS INTEGER)'
      - name: year_reconstructed
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."YEAR_RECONSTRUCTED_106" AS INTEGER)'
      - name: traffic_lanes_on
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."TRAFFIC_LANES_ON_028A" AS INTEGER)'
      - name: avg_daily_traffic
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."ADT_029" AS INTEGER)'
      - name: year_adt
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."YEAR_ADT_030" AS INTEGER)'
      - name: deck_condition
        type: string
        nullable: true
        expression: 'src."DECK_COND_058"'
        comment: NBI condition code 0-9 (9=excellent) or N (not applicable)
      - name: superstructure_condition
        type: string
        nullable: true
        expression: 'src."SUPERSTRUCTURE_COND_059"'
      - name: substructure_condition
        type: string
        nullable: true
        expression: 'src."SUBSTRUCTURE_COND_060"'
      - name: culvert_condition
        type: string
        nullable: true
        expression: 'src."CULVERT_COND_062"'
      - name: structural_eval
        type: string
        nullable: true
        expression: 'src."STRUCTURAL_EVAL_067"'
      - name: bridge_condition
        type: string
        nullable: true
        expression: 'src."BRIDGE_CONDITION"'
        comment: FHWA-precomputed summary — G(ood)/F(air)/P(oor)
      - name: lowest_rating
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."LOWEST_RATING" AS INTEGER)'
      - name: deck_area_sqm
        type: double
        nullable: true
        expression: 'TRY_CAST(src."DECK_AREA" AS DOUBLE)'
      - name: structure_length_m
        type: double
        nullable: true
        expression: 'TRY_CAST(src."STRUCTURE_LEN_MT_049" AS DOUBLE)'
      - name: main_unit_spans
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."MAIN_UNIT_SPANS_045" AS INTEGER)'
      - name: date_of_inspection
        type: string
        nullable: true
        expression: 'src."DATE_OF_INSPECT_090"'
        comment: MMYYYY per the NBI coding guide
      - name: inspect_freq_months
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."INSPECT_FREQ_MONTHS_091" AS INTEGER)'
      - name: bridge_imp_cost_thousands
        type: double
        nullable: true
        expression: 'TRY_CAST(src."BRIDGE_IMP_COST_094" AS DOUBLE)'
      - name: roadway_imp_cost_thousands
        type: double
        nullable: true
        expression: 'TRY_CAST(src."ROADWAY_IMP_COST_095" AS DOUBLE)'
      - name: total_imp_cost_thousands
        type: double
        nullable: true
        expression: 'TRY_CAST(src."TOTAL_IMP_COST_096" AS DOUBLE)'
      - name: year_of_imp
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."YEAR_OF_IMP_097" AS INTEGER)'
      - name: owner
        type: string
        nullable: true
        expression: 'src."OWNER_022"'
      - name: functional_class
        type: string
        nullable: true
        expression: 'src."FUNCTIONAL_CLASS_026"'
      - name: highway_system
        type: string
        nullable: true
        expression: 'src."HIGHWAY_SYSTEM_104"'
      - name: scour_critical
        type: string
        nullable: true
        expression: 'src."SCOUR_CRITICAL_113"'
        comment: Scour vulnerability rating code (safety-critical for waterway crossings)

    source:
      type: http
      url: "https://www.fhwa.dot.gov/bridge/nbi/{effective_year}allstatesallrecsdel.zip"
      method: GET
      # Single entry per zip (e.g. 2024AllRecordsDelimitedAllStates.txt).
      extractPattern: "*.txt"
      response:
        format: csv
        hasHeader: true
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=bridges/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: bridges
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # PHMSA HAZARDOUS LIQUID PIPELINE INCIDENTS — DOT open-data bulk file (snapshot)
  # ---------------------------------------------------------------------------
  - name: phmsa_hazardous_liquid_incidents
    # Freshness gate: PHMSA republishes this one whole-history file as incidents are
    # filed/corrected, no meaningful Last-Modified. Hashes the response body post-fetch
    # to skip the materialize/commit when unchanged.
    freshness:
      type: hash
    pattern: "type=phmsa_hazardous_liquid_incidents/*.parquet"
    comment: >
      PHMSA hazardous liquid pipeline accident reports (Form PHMSA F 7000-1), one row
      per accident, January 2010-present. phmsa.dot.gov itself 403s automated fetches;
      this pulls the identical bulk file from data.transportation.gov's open-data
      catalog instead — the catalog entry (resource 27nc-rsge) is a Socrata "href"
      pointer, not a queryable Socrata table, so the fetch targets its file attachment
      directly rather than the Socrata row API. Curated to a subset of the source's
      ~650 columns (safety outcome, cost, cause, and identity fields — not the full
      forensic investigation detail). Confirmed live: this snapshot is already
      deduplicated to one row per REPORT_NUMBER (no repeated SUPPLEMENTAL_NUMBER
      revisions), unlike the multi-supplemental versioning PHMSA's other endpoints can
      carry. For per-mile safety-rate normalization, join to
      phmsa_hazardous_liquid_mileage on operator_id + report_year. Only the 2010-present
      era is loaded; PHMSA also publishes three earlier eras (1986-2001, 2004-2009,
      pre-1986) under an incompatible pre-2010 form revision, not ingested here.

    dimensions:
      type:
        - phmsa_hazardous_liquid_incidents

    columns:
      - name: report_number
        type: string
        nullable: false
        expression: 'src."REPORT_NUMBER"'
        comment: PHMSA report number (PK)
      - name: report_received_date
        type: string
        nullable: true
        expression: 'src."REPORT_RECEIVED_DATE"'
      - name: activity_year
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."IYEAR" AS INTEGER)'
        comment: Year of the incident (IYEAR)
      - name: report_type
        type: string
        nullable: true
        expression: 'src."REPORT_TYPE"'
      - name: operator_id
        type: string
        nullable: true
        expression: 'src."OPERATOR_ID"'
        comment: PHMSA operator identifier — join key to phmsa_hazardous_liquid_mileage.operator_id
      - name: operator_name
        type: string
        nullable: true
        expression: 'src."NAME"'
      - name: operator_state_abbr
        type: string
        nullable: true
        expression: 'src."OPERATOR_STATE_ABBREVIATION"'
        comment: 2-letter USPS state code of the operator's address (not necessarily the incident location)
      - name: local_datetime
        type: string
        nullable: true
        expression: 'src."LOCAL_DATETIME"'
        comment: Local date/time the incident occurred
      - name: location_latitude
        type: double
        nullable: true
        expression: 'TRY_CAST(src."LOCATION_LATITUDE" AS DOUBLE)'
      - name: location_longitude
        type: double
        nullable: true
        expression: 'TRY_CAST(src."LOCATION_LONGITUDE" AS DOUBLE)'
      - name: onshore_state_abbr
        type: string
        nullable: true
        expression: 'src."ONSHORE_STATE_ABBREVIATION"'
        comment: 2-letter USPS state code of the incident location (onshore incidents only)
      - name: onshore_county_name
        type: string
        nullable: true
        expression: 'src."ONSHORE_COUNTY_NAME"'
      - name: on_off_shore
        type: string
        nullable: true
        expression: 'src."ON_OFF_SHORE"'
      - name: commodity_released_type
        type: string
        nullable: true
        expression: 'src."COMMODITY_RELEASED_TYPE"'
      - name: system_part_involved
        type: string
        nullable: true
        expression: 'src."SYSTEM_PART_INVOLVED"'
      - name: unintentional_release_bbls
        type: double
        nullable: true
        expression: 'TRY_CAST(src."UNINTENTIONAL_RELEASE_BBLS" AS DOUBLE)'
      - name: intentional_release_bbls
        type: double
        nullable: true
        expression: 'TRY_CAST(src."INTENTIONAL_RELEASE_BBLS" AS DOUBLE)'
      - name: recovered_bbls
        type: double
        nullable: true
        expression: 'TRY_CAST(src."RECOVERED_BBLS" AS DOUBLE)'
      - name: fatalities_total
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."FATAL" AS INTEGER)'
        comment: Total fatalities (PHMSA's own precomputed sum across employee/contractor/emergency-responder/general-public)
      - name: injuries_total
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."INJURE" AS INTEGER)'
        comment: Total injuries (PHMSA's own precomputed sum across employee/contractor/emergency-responder/general-public)
      - name: ignite_ind
        type: string
        nullable: true
        expression: 'src."IGNITE_IND"'
      - name: explode_ind
        type: string
        nullable: true
        expression: 'src."EXPLODE_IND"'
      - name: cause
        type: string
        nullable: true
        expression: 'src."CAUSE"'
        comment: PHMSA root-cause category (e.g. CORROSION, MATERIAL/WELD/EQUIP FAILURE, INCORRECT OPERATION, NATURAL FORCE DAMAGE, EXCAVATION DAMAGE, OTHER OUTSIDE FORCE DAMAGE, ALL OTHER CAUSES)
      - name: cause_details
        type: string
        nullable: true
        expression: 'src."CAUSE_DETAILS"'
      - name: est_cost_oper_paid
        type: double
        nullable: true
        expression: 'TRY_CAST(src."EST_COST_OPER_PAID" AS DOUBLE)'
        comment: Estimated cost of operator-paid public/private property damage (USD)
      - name: est_cost_prop_damage
        type: double
        nullable: true
        expression: 'TRY_CAST(src."EST_COST_PROP_DAMAGE" AS DOUBLE)'
      - name: est_cost_emergency
        type: double
        nullable: true
        expression: 'TRY_CAST(src."EST_COST_EMERGENCY" AS DOUBLE)'
      - name: est_cost_environmental
        type: double
        nullable: true
        expression: 'TRY_CAST(src."EST_COST_ENVIRONMENTAL" AS DOUBLE)'
      - name: est_cost_other
        type: double
        nullable: true
        expression: 'TRY_CAST(src."EST_COST_OTHER" AS DOUBLE)'
      - name: pipe_facility_type
        type: string
        nullable: true
        expression: 'src."PIPE_FACILITY_TYPE"'

    source:
      type: http
      url: "https://data.transportation.gov/api/views/27nc-rsge/files/1d547e17-2be1-4a32-9958-a1d5a946ade9"
      method: GET
      # This dataset's Socrata catalog entry is an "href" pointer (external file), not a
      # queryable table — the URL above is the actual bulk-file attachment endpoint,
      # confirmed stable (fixed assetId), not the Socrata row API.
      extractPattern: "*.txt"
      response:
        format: csv
        hasHeader: true
        delimiter: "\t"
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=phmsa_hazardous_liquid_incidents/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: phmsa_hazardous_liquid_incidents
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # PHMSA HAZARDOUS LIQUID PIPELINE MILEAGE — DOT open-data bulk file (snapshot)
  # ---------------------------------------------------------------------------
  - name: phmsa_hazardous_liquid_mileage
    freshness:
      type: hash
    pattern: "type=phmsa_hazardous_liquid_mileage/*.parquet"
    comment: >
      PHMSA hazardous liquid pipeline operators' annual report (Form PHMSA F 7000-1.1),
      Part A (operator identity) through Part E (pipe-age distribution) fields, one row
      per (report_year, operator, commodity) — the per-mile normalization denominator
      for phmsa_hazardous_liquid_incidents (join on operator_id + report_year). Same
      data.transportation.gov bulk-file route as the incidents table (catalog resource
      aemm-7pyq, an "href" pointer; this fetches its file attachment directly). The
      source ZIP splits each year's annual report into ~11 "Part" CSVs (Part A-E, F-G,
      H, I, ... R); only the Part A-E file is ingested here, since it alone carries
      total_miles (Part D) and mileage-by-installation-decade (Part E) — the fields this
      warehouse needs. Confirmed identical column layout across 2017-2024 (the years the
      source publishes as separate Part-CSVs; extractPattern merges all matching entries
      into one table). 2010-2016 exist only as whole-workbook XLSX files with a
      differently-shaped layout and are not ingested here — a follow-up sourcing task,
      not attempted in this pass.

    dimensions:
      type:
        - phmsa_hazardous_liquid_mileage

    columns:
      - name: report_year
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."REPORT_YEAR" AS INTEGER)'
      - name: report_number
        type: string
        nullable: true
        expression: 'src."REPORT_NUMBER"'
      - name: operator_id
        type: string
        nullable: true
        expression: 'src."OPERATOR_ID"'
        comment: PHMSA operator identifier — join key to phmsa_hazardous_liquid_incidents.operator_id
      - name: operator_name
        type: string
        nullable: true
        expression: 'src."PARTA2NAMEOFCOMP"'
      - name: operator_state_abbr
        type: string
        nullable: true
        expression: 'src."PARTA4STATE"'
        comment: 2-letter USPS state code of the operator's address
      - name: commodity
        type: string
        nullable: true
        expression: 'src."PARTA5COMMODITY"'
      - name: hca_miles_onshore
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTBHCAONSHORE" AS DOUBLE)'
        comment: Miles in High Consequence Areas, onshore (Part B)
      - name: hca_miles_offshore
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTBHCAOFFSHORE" AS DOUBLE)'
      - name: hca_miles_total
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTBHCATOTAL" AS DOUBLE)'
      - name: total_miles
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTDTOTALMILES" AS DOUBLE)'
        comment: Total regulated pipeline miles operated (Part D) — the per-mile safety-rate denominator
      - name: total_miles_onshore
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTDONTOTAL" AS DOUBLE)'
      - name: total_miles_offshore
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTDOFFTOTAL" AS DOUBLE)'
      - name: miles_installed_pre_1940
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTEPRE40TOTAL" AS DOUBLE)'
      - name: miles_installed_2010s
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTE2010TOTAL" AS DOUBLE)'
      - name: miles_installed_2020s
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTE2020TOTAL" AS DOUBLE)'
      - name: miles_installation_year_unknown
        type: double
        nullable: true
        expression: 'TRY_CAST(src."PARTEUNKNTOTAL" AS DOUBLE)'
      - name: report_submission_type
        type: string
        nullable: true
        expression: 'src."REPORT_SUBMISSION_TYPE"'
        comment: "e.g. INITIAL, AMENDED — later amended reports for the same (report_year, operator) supersede earlier ones; not deduplicated here"

    source:
      type: http
      url: "https://data.transportation.gov/api/views/aemm-7pyq/files/c44b6747-7e3a-45a5-9108-14d1a7a863a1"
      method: GET
      # Matches every "... Part A to E.csv" entry across all years in the zip and merges
      # them into one CSV stream (shared identical header across 2017-2024).
      extractPattern: "*Part A to E.csv"
      response:
        format: csv
        hasHeader: true
      # The 2020-2024 source files carry scattered comma-only padding lines (94-103 per
      # year, confirmed live) — not truly empty (so the parser's blank-line skip doesn't
      # catch them), just every field blank. Requires OPERATOR_ID to be non-empty to
      # drop them rather than materializing them as all-NULL rows.
      rowFilter:
        column: OPERATOR_ID
        pattern: '.+'
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=phmsa_hazardous_liquid_mileage/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: phmsa_hazardous_liquid_mileage
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # PHMSA GAS DISTRIBUTION PIPELINE INCIDENTS — DOT open-data bulk file (snapshot)
  # ---------------------------------------------------------------------------
  - name: phmsa_gas_distribution_incidents
    freshness:
      type: hash
    pattern: "type=phmsa_gas_distribution_incidents/*.parquet"
    comment: >
      PHMSA gas distribution pipeline incident reports (Form PHMSA F 7100.1), one row
      per incident, January 2010-present. Same data.transportation.gov open-data catalog
      route as phmsa_hazardous_liquid_incidents (catalog resource 27nc-rsge, the same
      multi-commodity "href" pointer entry; this fetches the Gas Distribution file
      attachment instead of the Hazardous Liquid one). Confirmed live: 1,550 rows, one
      per REPORT_NUMBER, no comma-padding rows (unlike the annual-report CSVs). Gas
      incidents report release volumes in thousand standard cubic feet (mcf) per Form
      field A7/A8, not barrels — unintentional_release_mcf/intentional_release_mcf are
      not comparable to phmsa_hazardous_liquid_incidents' _bbls columns. No offshore
      concept for local distribution systems (location_state_abbr/location_county_name
      only, unlike the onshore/offshore split gas transmission and hazardous liquid
      carry). Only the 2010-present era is loaded; PHMSA also publishes three earlier
      eras (1984-2004, 2004-2009 [sic, overlapping label on the source catalog], and
      1970-mid1984) under incompatible earlier form revisions, not ingested here.

    dimensions:
      type:
        - phmsa_gas_distribution_incidents

    columns:
      - name: report_number
        type: string
        nullable: false
        expression: 'src."REPORT_NUMBER"'
        comment: PHMSA report number (PK)
      - name: report_received_date
        type: string
        nullable: true
        expression: 'src."REPORT_RECEIVED_DATE"'
      - name: activity_year
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."IYEAR" AS INTEGER)'
        comment: Year of the incident (IYEAR)
      - name: report_type
        type: string
        nullable: true
        expression: 'src."REPORT_TYPE"'
      - name: operator_id
        type: string
        nullable: true
        expression: 'src."OPERATOR_ID"'
        comment: PHMSA operator identifier — join key to phmsa_gas_distribution_mileage.operator_id
      - name: operator_name
        type: string
        nullable: true
        expression: 'src."NAME"'
      - name: operator_state_abbr
        type: string
        nullable: true
        expression: 'src."OPERATOR_STATE_ABBREVIATION"'
        comment: 2-letter USPS state code of the operator's address (not necessarily the incident location)
      - name: local_datetime
