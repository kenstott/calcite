      per (report_year, operator, commodity) — the per-mile normalization denominator
      for phmsa_gas_distribution_incidents (join on operator_id + report_year). Same
      data.transportation.gov bulk-file route as phmsa_hazardous_liquid_mileage
      (catalog resource aemm-7pyq, the same multi-commodity "href" pointer; this fetches
      the Gas Distribution file attachment). Unlike the hazardous-liquid annual report,
      this source publishes one flat CSV per year (not split into lettered Parts), but
      the column set still drifts slightly year to year (278 cols in 2017-2022, 274 in
      2023, 300 in 2024 — all differences are trailing excavation-damage-detail columns
      not used here); the ETL's zip-merge aligns columns by name across files with
      differing headers, not position, so this is safe. Confirmed live: the 2020-2024
      files carry comma-only padding lines (81-145 per year) that parse into all-NULL
      rows without a rowFilter, same defect class as phmsa_hazardous_liquid_mileage. An
      operator can file more than one commodity row per year (Natural Gas, Propane Gas,
      Landfill Gas, Synthetic Gas, Hydrogen Gas), so report_number — not
      operator_id + report_year — is the unique key. total_services (individual
      customer service-line count) has no analog in the hazardous-liquid table; gas
      distribution systems are sized by service count as well as main mileage. Only
      2017-2024 is loaded; 2010-2016 exist only as whole-workbook XLSX files with a
      differently-shaped layout, same caveat as phmsa_hazardous_liquid_mileage, not
      ingested here.

    dimensions:
      type:
        - phmsa_gas_distribution_mileage

    columns:
