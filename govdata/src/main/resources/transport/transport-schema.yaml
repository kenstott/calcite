  # ---------------------------------------------------------------------------
  # NTSB AVIATION ACCIDENTS — avall.zip / avall.mdb (snapshot, Jackcess MDB read)
  # ---------------------------------------------------------------------------
  - name: ntsb_aviation_accidents
    # Freshness gate: NTSB bulk zip on a fixed static path. A Last-Modified probe skips
    # the re-download and re-materialize on unchanged runs (fails open).
    freshness:
      type: last_modified
    pattern: "type=ntsb_aviation_accidents/*.parquet"
    partitions: *static_partitions
    comment: >
      NTSB aviation accident & incident database — one row per aircraft involved
      in an event, with injury severity and fatal/serious/minor injury counts,
      aircraft damage level, FAR operating part, phase-of-flight code,
      probable-cause narrative, and event lat/lon. NTSB's own avall.zip is
      documented as spanning 1982-present, but the actual MIN(event_year) in this
      table should be checked directly (`SELECT MIN(event_year), MAX(event_year),
      COUNT(*) FROM ...` — there is no observedCoverage block here since this
      table has no year= partition to anchor one) rather than assumed from the
      source's nominal range. The download (avall.zip, ~95MB) is a single Microsoft Access database
      (avall.mdb, ~553MB) read in-JVM with Jackcess by NtsbAviationTransformer:
      the `aircraft` table (grain ev_id + Aircraft_Key) is streamed and joined
      to `events` (ev_id) and the `narratives.narr_cause` probable-cause text.
      The MDB has no county column, so only state_fips is derived (from USPS
      ev_state). Snapshot: the whole MDB is re-ingested and the partition
      overwritten each run. event_year is a column (not a partition) since one
      file carries all years; aircraft_n_number joins to
      faa_aircraft_master.n_number. Source: data.ntsb.gov/avdata/avall.zip.

    dimensions:
      type:
        - ntsb_aviation_accidents

    columns:
      - name: event_id
        type: string
        nullable: false
        comment: NTSB event id (ev_id) — PK component
      - name: aircraft_key
        type: integer
        nullable: false
        comment: Aircraft sequence within the event (Aircraft_Key) — PK component
      - name: event_year
        type: integer
        nullable: true
        comment: Year of the event
      - name: event_date
        type: date
        nullable: true
        comment: Date of the accident/incident
      - name: event_type
        type: string
        nullable: true
        comment: Accident / Incident (decoded from ev_type)
      - name: aircraft_n_number
        type: string
        nullable: true
        comment: Aircraft tail number, canonical N-prefixed (regis_no; FK to faa_aircraft_master.n_number)
      - name: aircraft_make
        type: string
        nullable: true
        comment: Aircraft manufacturer (acft_make)
      - name: aircraft_model
        type: string
        nullable: true
        comment: Aircraft model (acft_model)
      - name: aircraft_category
        type: string
        nullable: true
        comment: Aircraft category code (acft_category; e.g. AIR, HELI)
      - name: far_part
        type: string
        nullable: true
        comment: FAR operating part (091, 121, 135, ...) — operation type
      - name: carrier_name
        type: string
        nullable: true
        comment: Operator/carrier name (oper_name)
      - name: city
        type: string
        nullable: true
        comment: Event city (ev_city)
      - name: state_abbr
        type: string
        nullable: true
        comment: Event state (USPS abbr; FK component to geo.state_ref)
      - <<: *state_fips_column
      - name: country
        type: string
        nullable: true
        comment: Event country code (ev_country)
      - name: airport_id
        type: string
        nullable: true
        comment: Nearest airport id (ev_nr_apt_id; null for en-route)
      - name: airport_name
        type: string
        nullable: true
        comment: Nearest airport name (apt_name)
      - name: injury_severity
        type: string
        nullable: true
        comment: Highest injury level (Fatal / Serious / Minor / None; decoded)
      - name: fatal_injuries
        type: integer
        nullable: true
        comment: Total fatalities (inj_tot_f)
      - name: serious_injuries
        type: integer
        nullable: true
        comment: Total serious injuries (inj_tot_s)
      - name: minor_injuries
        type: integer
        nullable: true
        comment: Total minor injuries (inj_tot_m)
      - name: aircraft_damage
        type: string
        nullable: true
        comment: Aircraft damage (Destroyed / Substantial / Minor / None; decoded)
      - name: phase_flt_code
        type: integer
        nullable: true
        comment: NTSB phase-of-flight code (phase_flt_spec; raw code, not decoded)
      - name: latitude
        type: double
        nullable: true
        comment: Event latitude (dec_latitude, WGS84)
      - name: longitude
        type: double
        nullable: true
        comment: Event longitude (dec_longitude, WGS84)
      - name: probable_cause
        type: string
        nullable: true
        comment: NTSB probable-cause narrative (narr_cause, truncated to 4000 chars)

    source:
      type: http
      # NTSB migrated off the direct /avdata/avall.zip path (now 404) to a
      # FileDirectory download endpoint; fileID is the URL-encoded Windows path
      # C:\avdata\avall.zip. Verified 200 (application/octet-stream, ~95MB).
      url: "https://data.ntsb.gov/avdata/FileDirectory/DownloadFile?fileID=C%3A%5Cavdata%5Cavall.zip"
      method: GET
      # StreamingResponseTransformer opens the URL itself (95MB zip -> 553MB MDB);
      # the framework does not pre-fetch, so rawCache does not apply.
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.transport.NtsbAviationTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=ntsb_aviation_accidents/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: ntsb_aviation_accidents
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        incrementalTtlDays: 7
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # CFS SHIPMENTS — Commodity Flow Survey Public Use File (snapshot, bulk CSV)
  # ---------------------------------------------------------------------------
  - name: cfs_shipments
    # Freshness gate: Socrata dataset ETag. Must be at the table level, not nested under
    # source: — EtlPipelineConfig.fromMap only reads freshness: from the table's own map,
    # so a copy nested under source: is silently never parsed.
    freshness:
      type: etag
    pattern: "type=cfs_shipments/*.parquet"
    partitions: *static_partitions
    comment: >
      Census/BTS Commodity Flow Survey 2017 Public Use File (PUF) — one row per
      sampled shipment (~5.98M), the shipment-level microdata behind every CFS
      cross-tab. Origin/destination state + CFS area, SCTG commodity, mode,
      shipper NAICS, value ($), weight (lb), great-circle + routed distance
      (miles), and WGT_FACTOR (the tabulation weight: SUM(measure * wgt_factor)
      estimates the population total). All published cross-tabs (origin x dest x
      commodity x mode, by-NAICS, by-distance, ...) are SQL views over this one
      table (never Java) — e.g. the bts_freight_flows view. Aggregates are
      sample-weighted estimates and approximate the official CFS tables. Bulk CSV
      export of BTS Socrata y9wr-xk52; snapshot, partition overwritten each run.
      Source: data.bts.gov/api/views/y9wr-xk52/rows.csv.
    dqRowLimit: 200000

    dimensions:
      type:
        - cfs_shipments

    columns:
      - name: shipmt_id
        type: string
        nullable: false
        expression: 'src."SHIPMT_ID"'
        comment: Shipment identifier — PK
      - name: survey_year
        type: integer
        nullable: false
        expression: '2017'
        comment: CFS survey year (this PUF file is 2017)
      - name: orig_state_fips
        type: string
        nullable: true
        expression: 'CASE WHEN src."ORIG_STATE" IS NULL OR src."ORIG_STATE"='''' THEN NULL ELSE lpad(src."ORIG_STATE", 2, ''0'') END'
        comment: Origin state FIPS (FK to geo.state_ref)
      - name: orig_cfs_area
        type: string
        nullable: true
        expression: 'src."ORIG_CFS_AREA"'
        comment: Origin CFS area code (state-MA)
      - name: dest_state_fips
        type: string
        nullable: true
        expression: 'CASE WHEN src."DEST_STATE" IS NULL OR src."DEST_STATE"='''' THEN NULL ELSE lpad(src."DEST_STATE", 2, ''0'') END'
        comment: Destination state FIPS (FK to geo.state_ref)
      - name: dest_cfs_area
        type: string
        nullable: true
        expression: 'src."DEST_CFS_AREA"'
        comment: Destination CFS area code (state-MA)
      - name: naics
        type: string
        nullable: true
        expression: 'src."NAICS"'
        comment: Shipper NAICS code
      - name: quarter
        type: integer
        nullable: true
        expression: 'TRY_CAST(src."QUARTER" AS INTEGER)'
        comment: Quarter of shipment (1-4)
      - name: sctg_code
        type: string
        nullable: true
        # lpad (not a bare passthrough): the raw SCTG column mixes unpadded single-digit codes
        # ("0".."9") with already-2-digit codes and "NN-NN" collapsed-group ranges — lpad only
        # pads shorter strings, so 2-digit and 5-char range values pass through unchanged. This
        # is what makes a plain code join to cfs_sctg_ref.sctg_code work for every non-suppressed
        # single value (FK comment below).
        expression: 'CASE WHEN src."SCTG" IS NULL OR src."SCTG"='''' THEN NULL ELSE lpad(src."SCTG", 2, ''0'') END'
        comment: SCTG commodity code, zero-padded to 2 digits (FK to cfs_sctg_ref.sctg_code for single non-suppressed codes; a "NN-NN" value is a confidentiality-collapsed range with no single ref row)
      - name: mode_code
        type: string
        nullable: true
        # Same lpad rationale as sctg_code — raw MODE mixes unpadded 1-digit codes with the
        # already-2/3-digit codes (e.g. "101"); lpad leaves the latter untouched.
        expression: 'CASE WHEN src."MODE" IS NULL OR src."MODE"='''' THEN NULL ELSE lpad(src."MODE", 2, ''0'') END'
        comment: CFS transport mode code, zero-padded to 2+ digits (raw; some recoded for confidentiality; FK to cfs_mode_ref.mode_code)
      - name: shipmt_value
        type: double
        nullable: true
        expression: 'TRY_CAST(src."SHIPMT_VALUE" AS DOUBLE)'
        comment: Shipment value (USD)
      - name: shipmt_weight_lb
        type: double
        nullable: true
        expression: 'TRY_CAST(src."SHIPMT_WGHT" AS DOUBLE)'
        comment: Shipment weight (pounds)
      - name: dist_gc_miles
        type: double
        nullable: true
        expression: 'TRY_CAST(src."SHIPMT_DIST_GC" AS DOUBLE)'
        comment: Great-circle distance origin->destination (miles)
      - name: dist_routed_miles
        type: double
        nullable: true
        expression: 'TRY_CAST(src."SHIPMT_DIST_ROUTED" AS DOUBLE)'
        comment: Routed distance origin->destination (miles)
      - name: temp_controlled
        type: string
        nullable: true
        expression: 'src."TEMP_CNTL_YN"'
        comment: Temperature-controlled shipment (true/false)
      - name: export_yn
        type: string
        nullable: true
        expression: 'src."EXPORT_YN"'
        comment: Export shipment (true/false)
      - name: export_country
        type: string
        nullable: true
        expression: 'src."EXPORT_CNTRY"'
        comment: Export final destination country indicator
      - name: hazmat
        type: string
        nullable: true
        expression: 'src."HAZMAT"'
        comment: Hazardous material code (N = not hazmat)
      - name: wgt_factor
        type: double
        nullable: true
        expression: 'TRY_CAST(src."WGT_FACTOR" AS DOUBLE)'
        comment: Shipment tabulation weighting factor (multiply measures by this for population estimates)

    source:
      type: http
      # Socrata bulk CSV export = the whole 5.98M-row PUF in one unpaginated
      # request (preferred over paging). Headers are UPPERCASE source names.
      url: "https://data.bts.gov/api/views/y9wr-xk52/rows.csv?accessType=DOWNLOAD"
      method: GET
      response:
        format: csv
        hasHeader: true
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      format: iceberg
      output:
        pattern: "type=cfs_shipments/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: cfs_shipments
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        incrementalTtlDays: 30
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # CFS SCTG / MODE REFERENCE — code lists from the CFS PUF Data Users Guide (static)
  # ---------------------------------------------------------------------------
  - name: cfs_sctg_ref
      # Gates on Last-Modified, which the host serves on a HEAD (verified live; no ETag offered).
      # A hash gate has to download the whole body to compute a digest of it; this is one HEAD.
    freshness:
      type: last_modified
    pattern: "type=cfs_sctg_ref/*.parquet"
    partitions: *static_partitions
    comment: >
      SCTG (Standard Classification of Transported Goods) code list — Appendix A-3 of the
      2017 CFS PUF Data Users Guide, the cfs_shipments.sctg_code lookup. Census/BTS publish
      this only as a PDF table (no CSV/XLSX distribution), parsed here via CfsSctgRefTransformer.
      43 rows: the 41 detailed 2-digit codes, "43" (mixed freight), and "00" (suppressed).
      sctg_group is populated only on the first code of a confidentiality-collapsed range (e.g.
      "01" carries group "01-05"); cfs_shipments.sctg_code itself can also independently hold
      the collapsed "NN-NN" range value directly, which has no matching single row here — that
      is expected, not a join defect (see the sctg_code column comment on cfs_shipments).
      2017-vintage, one-time reference data; Census has not revised this appendix since.

    dimensions:
      type:
        - cfs_sctg_ref

    columns:
      - name: sctg_code
        type: string
        nullable: false
        comment: 2-digit SCTG code (PK; "00" = suppressed, "43" = mixed freight)
      - name: description
        type: string
        nullable: false
        comment: Official SCTG commodity description
      - name: sctg_group
        type: string
        nullable: true
        comment: Confidentiality-collapsed SCTG group range this code heads (e.g. "01-05"), only where the appendix gives one

    source:
      type: http
      url: "https://www2.census.gov/programs-surveys/cfs/datasets/2017/cfs_2017_puf_users_guide.pdf"
      method: GET
      response:
        format: TEXT   # CfsSctgRefTransformer re-downloads the PDF and emits JSON rows
      rawCache:
        enabled: true
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.transport.CfsSctgRefTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=cfs_sctg_ref/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/transport"
        tableName: cfs_sctg_ref
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        overwritePartitions: true

