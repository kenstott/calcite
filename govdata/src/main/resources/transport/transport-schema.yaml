    # shared batch timestamp -- these are genuine per-year revisions rather than an archive
    # migration. 4 covers that window, and the Last-Modified gate makes each reopened year one HEAD.
    lookbackPeriods: 4
    # Freshness gate: FHWA bulk xlsx per year on a fixed static path. A Last-Modified
