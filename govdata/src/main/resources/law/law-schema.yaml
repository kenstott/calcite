      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_actions
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_COSPONSORS — cosponsors per bill
  # ---------------------------------------------------------------------------
  - name: bill_cosponsors
    pattern: "type=bill_cosponsors/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Cosponsors of every bill in `bills`, one row per (bill, cosponsor), from the same
      GovInfo Bill Status XML. Join to `bills` on (congress, bill_type, bill_number) and to
      officials.members on `bioguide_id`. `is_original_cosponsor` is true for members who
      signed on at introduction; `withdrawn_date` is set when a cosponsor later withdrew.
      Bills with no cosponsors have no rows here.
      A member who withdrew and later re-signed appears twice, with different
      `sponsorship_date`; a few identical repeats also exist upstream (2 in the 108th-119th).

    dimensions:
      type:
        - bill_cosponsors
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: bioguide_id
        type: string
        nullable: false
        comment: Bioguide ID of the cosponsor; joins to officials.members
      - name: full_name
        type: string
        nullable: true
        comment: Cosponsor display name with party and state
      - name: party
        type: string
        nullable: true
        comment: Party code (R, D, I)
      - name: state
        type: string
        nullable: true
        comment: Two-letter state code
      - name: district
        type: string
        nullable: true
        comment: House district number; NULL for senators
      - name: sponsorship_date
        type: string
        nullable: true
        comment: Date the member became a cosponsor (YYYY-MM-DD)
      - name: is_original_cosponsor
        type: boolean
        nullable: true
        comment: True if the member cosponsored at introduction
      - name: withdrawn_date
        type: string
        nullable: true
        comment: Date the member withdrew as cosponsor; NULL if still a cosponsor

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
