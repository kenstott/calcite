  # ---------------------------------------------------------------------------
  # SCOTUS_REPORTS_CASES — every case in the bound United States Reports, one row per case
  # ---------------------------------------------------------------------------
  # Source: GovInfo United States Reports collection (GPO), volumes 2-583 (terms 1781-2017).
  # One row per case granule: its MODS record for the citation and the Supreme Court Database's
  # curated outcome fields, and its PDF for the docket numbers and the opinion text.
  # ScotusReportsProvider fetches a term at a time (the year dimension is the term) and
  # streams cases one by one.
  - name: scotus_reports_cases
    pattern: "type=scotus_reports_cases/year=*/*.parquet"
    partitions: *scotus_year_partitions
    dataset_type: delta
    comment: >
      Every case decided by the U.S. Supreme Court and printed in the bound United States
      Reports on GovInfo: volumes 2 through 583, Court terms 1781 through 2017, about 30,800
      cases. One row per case, partitioned by `year`, the term in which the volume's
      cases were decided (the first year of GovInfo's courtTerm; the earliest reporters span
      several years and count under their first). Terms from 2018 are in scotus_slip_opinions;
      scotus_cases combines the two. Outcome columns (`disposition`, `party_winning`, `votes_majority`,
      `votes_minority`, `chief_justice`, `opinion_writer`, `case_origin`, `cert_reason`,
      `scdb_issue_areas` and the rest of GovInfo's curated fields) come from GovInfo's MODS
      record, which takes them from the Supreme Court Database, and are present for volumes
      through 582 only; volume 583 (term 2017) has none, so `disposition` is derived from the
      opinion text and `disposition_source` says which. `disposition` uses one vocabulary
      either way: Affirmed (includes modified), Reversed, Reversed and remanded, Vacated and
      remanded, Affirmed and reversed (or vacated) in part [and remanded], Dismissed as
      improvidently granted. Text-derived values agree with the curated ones for about 96%
      of cases; the exceptions are how a remand is coded. `docket_numbers` are the Court's
      docket numbers read from the opinion (a consolidated case lists every docket whose
      number the text gives), not the SCDB-format `govinfo_docket_id`. `opinion_text` is the
      full text of the opinion PDF as extracted, in which the "fi" ligature loses its "i"
      (e.g. "affrmed", "fnal"). Original-jurisdiction cases have no disposition.

    dimensions:
      type:
        - scotus_reports_cases
      year: *scotus_reports_term_range

    columns:
      - name: volume
        type: integer
        nullable: false
        comment: United States Reports volume number (e.g. 583 in 583 U.S. 17)
      - name: granule_id
        type: string
        nullable: false
        comment: GovInfo granule ID of the case, e.g. USREPORTS-583-17; joins to the case's govinfo.gov page and API records
      - name: case_title
        type: string
        nullable: false
        comment: Case name with citation and year as GovInfo prints it, e.g. Hamer v. Neighborhood Housing Services of Chicago, 583 U.S. 17 (2017)
      - name: us_citation
        type: string
        nullable: false
        comment: Official citation, e.g. 583 U.S. 17
      - name: full_citation
        type: string
        nullable: true
        comment: Citation with the decision year, e.g. 583 U.S. 17 (2017)
      - name: first_page
        type: integer
        nullable: false
        comment: Page of the volume on which the case begins
      - name: sequence_number
        type: integer
        nullable: true
        comment: GovInfo's order of the case within the volume
      - name: court_term
        type: string
        nullable: true
        comment: GovInfo's courtTerm for the case as MODS gives it (the year the term began); null where the MODS record carries none, which is volume 583
      - name: decision_year
        type: integer
        nullable: false
        comment: Year of decision as GovInfo dates it; for volume 583 this is the year only, since GovInfo gives no day or month there
      - name: decision_date
        type: string
        nullable: true
        comment: Date of decision (YYYY-MM-DD); null when GovInfo gives only the year
      - name: argument_date
        type: string
        nullable: true
        comment: Date the case was argued (YYYY-MM-DD); null for cases decided without argument and where the MODS record carries none
      - name: docket_numbers
        type: array<string>
        nullable: true
        comment: The Court's docket numbers, lead docket first, normalised with a hyphen (23-583; 24A910 for an application; 137-Orig for an original case). A consolidated case lists every docket the opinion's footnote numbers; empty where the opinion text carries none
      - name: govinfo_docket_id
        type: string
        nullable: true
        comment: Supreme Court Database docket ID as GovInfo carries it (e.g. 2000-031-01); an SCDB identifier, not the Court's docket number, and absent for volume 583
      - name: disposition
        type: string
        nullable: true
        comment: What the Court did with the judgment below, in one vocabulary — Affirmed (includes modified), Reversed, Reversed and remanded, Vacated, Vacated and remanded, Affirmed and reversed (or vacated) in part [and remanded], Petition denied or appeal dismissed, Dismissed as improvidently granted; null when none was recorded or derivable, as for original-jurisdiction cases
      - name: disposition_source
        type: string
        nullable: true
        comment: govinfo_mods when disposition is GovInfo's curated Supreme Court Database value; opinion_text when it was derived from the opinion. Null when disposition is null
      - name: party_winning
        type: string
        nullable: true
        comment: Whether the petitioning party received a favorable disposition (Petitioning party received a favorable disposition, or No favorable disposition for petitioning party apparent); curated, so null for volume 583 and any case without an outcome
      - name: decision_type
        type: string
        nullable: true
        comment: Kind of decision, e.g. Opinion of the court (orally argued), Per curiam (no oral argument), Equally divided vote
      - name: jurisdiction
        type: string
        nullable: true
        comment: How the case reached the Court, e.g. Cert, Appeal, Original
      - name: case_origin
        type: string
        nullable: true
        comment: Court in which the case originated, e.g. Michigan Eastern U.S. District Court
      - name: case_source
        type: string
        nullable: true
        comment: Court whose decision was reviewed, e.g. U.S. Court of Appeals, Sixth Circuit
      - name: cert_reason
        type: string
        nullable: true
        comment: Reason the Court took the case, e.g. Federal court conflict
      - name: chief_justice
        type: string
        nullable: true
        comment: Chief Justice at the time, as a full name (e.g. William H. Rehnquist)
      - name: opinion_writer
        type: string
        nullable: true
        comment: Justice who wrote the majority opinion, as a full name; null for some per curiam and unsigned decisions
      - name: opinion_assigner
        type: string
        nullable: true
        comment: Justice who assigned the majority opinion
      - name: votes_majority
        type: integer
        nullable: true
        comment: Number of justices in the majority
      - name: votes_minority
        type: integer
        nullable: true
        comment: Number of justices in the minority
      - name: authority_decision
        type: string
        nullable: true
        comment: Basis of the decision, e.g. Statutory construction, Constitutional interpretation
      - name: unconstitutionality
        type: string
        nullable: true
        comment: Whether the Court declared a law unconstitutional, e.g. No declaration of unconstitutionality
      - name: petitioner_type
        type: string
        nullable: true
        comment: Category of the petitioner, e.g. Manufacturer, State, Federal government
      - name: respondent_type
        type: string
        nullable: true
        comment: Category of the respondent
      - name: lc_topics
        type: array<string>
        nullable: true
        comment: Subject topics assigned by the Library of Congress Law Library; present on fewer than half of cases
      - name: scdb_issue_areas
        type: array<string>
        nullable: true
        comment: "Issue areas from the Supreme Court Database (e.g. Patents and Copyrights: Copyright)"
      - name: law_types
        type: array<string>
        nullable: true
        comment: Type of law at issue, from the Supreme Court Database
      - name: legal_provisions
        type: array<string>
        nullable: true
        comment: Legal provisions at issue, from the Supreme Court Database
      - name: page_count
        type: integer
        nullable: false
        comment: Pages in the case's PDF
      - name: pdf_url
        type: string
        nullable: false
        comment: GovInfo URL of the case PDF the opinion text was read from
      - name: opinion_text
        type: string
        nullable: true
        comment: "Full text of the case as extracted from the PDF — syllabus, opinion of the Court, concurrences and dissents. The \"fi\" ligature loses its \"i\" in the source encoding (\"affrmed\", \"fnal\"). Text blob"

    backfill_period: annual

    source:
      type: http
      url: "https://api.govinfo.gov/collections/USREPORTS"
      method: GET
      headers:
        X-Api-Key: "${API_DATA_GOV}"
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.ScotusReportsProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=scotus_reports_cases/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: scotus_reports_cases
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # LOBBYING_FILINGS — LD-1 registrations and LD-2 quarterly reports
  # ---------------------------------------------------------------------------
  - name: lobbying_filings
    pattern: "type=lobbying_filings/year=*/quarter=*/*.parquet"
    dataset_type: delta
    backfill_period: quarterly
    # No lookbackPeriods: the engine always reopens the most recent completed period on every run.
    # That is the current quarter while it is open, and on the first run of a new quarter it is the
    # quarter that just closed (the current one is not yet complete), so the closing read of the
    # previous quarter's last-day filings happens without further configuration. Older quarters are
    # immutable and stay complete.
    partitions: *lobbying_window_partitions
    comment: >
      Every lobbying filing made under the Lobbying Disclosure Act, one row per filing: LD-1
      registrations (a lobbyist or firm registering to lobby for a client) and LD-2
      quarterly activity reports, with their amendments and terminations. `filing_type` says
      which (decoded in lobbying_filing_types: RR = Registration, Q1 = 1st Quarter Report,
      and so on). The registrant is the lobbying firm or organization; the client is who it
      lobbies for (often the same when an organization lobbies for itself). `income` is what
      a lobbying firm reports receiving from the client and `expenses` is what an
      organization reports spending on in-house lobbying; each is set on only some filings,
      as reported (rounded by the filer). `filing_year`/`filing_period` is the reporting
      period the filing covers. What was lobbied on is in lobbying_activities and the people
      involved in lobbying_activity_lobbyists. Registrant contact names and telephone
      numbers and the name of whoever posted a filing are deliberately not carried.
      Partitioned by `year` and `quarter`: the calendar quarter in which the filing was
      POSTED (Eastern time), not the period it reports on. A filing keeps its posting date,
      so a past partition never changes, and an amendment is a new filing in a later
      partition. The current quarter is re-read on each daily run. Source: LDA.gov (Senate
      Office of Public Records). The Senate Office of Public Records cannot vouch for the
      data or analyses derived from these data after they have been retrieved from LDA.gov.

    dimensions:
      type:
        - lobbying_filings
      year: *lobbying_year_range
      quarter: *lobbying_quarter

    columns:
      - <<: *partition_year
      - <<: *partition_quarter
      - name: filing_uuid
        type: string
        nullable: false
        comment: >
          LDA.gov's unique ID for the filing; joins every lobbying_* filing table
      - name: filing_type
        type: string
        nullable: true
        comment: >
          Filing type code, e.g. RR (registration), Q1-Q4 (quarterly reports), and
          amendment/termination variants; decoded in lobbying_filing_types
      - name: filing_type_name
        type: string
        nullable: true
        comment: >
          Filing type in words, e.g. Registration, 1st Quarter Report
      - name: filing_year
        type: integer
        nullable: true
        comment: >
          Calendar year of the period the filing covers
      - name: filing_period
        type: string
        nullable: true
        comment: >
          Period the filing covers: first_quarter, second_quarter, third_quarter or
          fourth_quarter (mid_year and year_end appear on contribution reports only)
      - name: filing_document_url
        type: string
        nullable: true
        comment: >
          LDA.gov page of the filing itself
      - name: income
        type: double
        nullable: true
        comment: >
          Income the registrant reports from the client for the period; set on some LD-2
          filings
      - name: expenses
        type: double
        nullable: true
        comment: >
          Expenses an organization reports for its own in-house lobbying; set on some LD-2
          filings
      - name: expenses_method
        type: string
        nullable: true
        comment: >
          Expense-reporting method code: a, b or c
      - name: expenses_method_name
        type: string
        nullable: true
        comment: >
          Expense-reporting method in words, e.g. Method A - Reporting amounts using LDA
          definitions only
      - name: dt_posted
        type: string
        nullable: true
        comment: >
          When the filing was posted (ISO-8601 with Eastern-time offset); decides the
          year/quarter partition
      - name: termination_date
        type: string
        nullable: true
        comment: >
          Date the registration terminated (YYYY-MM-DD); set on termination filings
      - name: registrant_id
        type: long
        nullable: true
        comment: >
          Registrant ID; joins to lobbying_registrants
      - name: registrant_name
        type: string
        nullable: true
        comment: >
          Registrant (lobbying firm or self-filing organization) name
      - name: registrant_house_id
        type: integer
        nullable: true
        comment: >
          The registrant's ID in the House Lobbying Disclosure system, when it has one
      - name: registrant_description
        type: string
        nullable: true
        comment: >
          Registrant's own description of its business
      - name: registrant_address_1
        type: string
        nullable: true
        comment: >
          Registrant street address on this filing (a business address)
      - name: registrant_address_2
        type: string
        nullable: true
        comment: >
          Registrant address line 2
      - name: registrant_city
        type: string
        nullable: true
        comment: >
          Registrant city on this filing
      - name: registrant_state
        type: string
        nullable: true
        comment: >
          Registrant state on this filing
      - name: registrant_zip
        type: string
        nullable: true
        comment: >
          Registrant ZIP on this filing
      - name: registrant_country
        type: string
        nullable: true
        comment: >
          Registrant country on this filing, as published
      - name: registrant_ppb_country
        type: string
        nullable: true
        comment: >
          Registrant principal-place-of-business country when it differs from the address
      - name: registrant_different_address
        type: boolean
        nullable: true
        comment: >
          True when the registrant's principal place of business differs from its address
      - name: client_id
        type: long
        nullable: true
        comment: >
          Client ID; joins to lobbying_clients
      - name: client_name
        type: string
        nullable: true
        comment: >
          Client name
      - name: client_general_description
        type: string
        nullable: true
        comment: >
          Client's line of business, e.g. Health benefit plan company
      - name: client_state
        type: string
        nullable: true
        comment: >
          Client state code
      - name: client_country
        type: string
        nullable: true
        comment: >
          Client country code
      - name: client_ppb_state
        type: string
        nullable: true
        comment: >
          Client principal-place-of-business state code
      - name: client_ppb_country
        type: string
        nullable: true
        comment: >
          Client principal-place-of-business country code
      - name: client_government_entity
        type: boolean
        nullable: true
        comment: >
          True when the client is itself a government entity
      - name: client_self_select
        type: boolean
        nullable: true
        comment: >
          True when the client is the registrant (an organization lobbying for itself)
      - name: client_effective_date
        type: string
        nullable: true
        comment: >
          Date the client relationship took effect (YYYY-MM-DD)
      - name: activity_count
        type: integer
        nullable: true
        comment: >
          Number of lobbying activities on the filing (rows in lobbying_activities)
      - name: foreign_entity_count
        type: integer
        nullable: true
        comment: >
          Number of foreign entities disclosed (rows in lobbying_foreign_entities)
      - name: affiliated_organization_count
        type: integer
        nullable: true
        comment: >
          Number of affiliated organizations disclosed (rows in
          lobbying_affiliated_organizations)
      - name: conviction_disclosure_count
        type: integer
        nullable: true
        comment: >
          Number of lobbyist convictions disclosed (rows in lobbying_conviction_disclosures)

    source:
      type: http
      url: "https://lda.gov/api/v1/filings/"
      method: GET
      headers:
        Authorization: "Token ${LDA_API_KEY}"
      parameters:
        page_size: "25"
        ordering: "dt_posted"
        dq_record_limit: "1000"
      response:
        format: json
      # 2 requests/second is the keyed limit of 120/minute; a 429 is retried after the
      # server's own Retry-After.
      rateLimit:
        requestsPerSecond: 2
        retryOn: [429, 500, 503]
        maxRetries: 6

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.LdaApiProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=lobbying_filings/year=*/quarter=*/"
      partition:
        columns: [type, year, quarter]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        batchPartitionColumns: [year, quarter]
        incrementalKeys: [year, quarter]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # LOBBYING_ACTIVITIES — issues lobbied on
  # ---------------------------------------------------------------------------
  - name: lobbying_activities
    pattern: "type=lobbying_activities/year=*/quarter=*/*.parquet"
    dataset_type: delta
    backfill_period: quarterly
    # No lookbackPeriods: the engine always reopens the most recent completed period on every run.
    # That is the current quarter while it is open, and on the first run of a new quarter it is the
    # quarter that just closed (the current one is not yet complete), so the closing read of the
    # previous quarter's last-day filings happens without further configuration. Older quarters are
    # immutable and stay complete.
    partitions: *lobbying_window_partitions
    comment: >
      What each filing says was lobbied on, one row per lobbying activity within a filing
      (usually one to a handful, one per general issue area). `general_issue_code` is one of
      the 79 issue areas in lobbying_issue_codes (e.g. DEF = Defense, HCR = Health Issues).
      `description` is the filer's free-text statement of the specific issues, and is where
      particular bills, regulations and programs are named (for example "H.R. 1" or "FY26
      defense appropriations") — there is no structured bill identifier, so matching to the
      bill_* tables means reading that text. `activity_seq` numbers the activities within
      the filing from 1 in the order the API lists them. Join to lobbying_filings on
      filing_uuid. Partitioned by `year` and `quarter`: the calendar quarter in which the
      filing was POSTED (Eastern time), not the period it reports on. A filing keeps its
      posting date, so a past partition never changes, and an amendment is a new filing in a
      later partition. The current quarter is re-read on each daily run. Source: LDA.gov
      (Senate Office of Public Records). The Senate Office of Public Records cannot vouch
      for the data or analyses derived from these data after they have been retrieved from
      LDA.gov.

    dimensions:
      type:
        - lobbying_activities
      year: *lobbying_year_range
      quarter: *lobbying_quarter

    columns:
      - <<: *partition_year
      - <<: *partition_quarter
      - name: filing_uuid
        type: string
        nullable: false
        comment: >
          LDA.gov's unique ID for the filing; joins every lobbying_* filing table
      - name: activity_seq
        type: integer
        nullable: false
        comment: >
          Position of the activity within its filing, from 1
      - name: general_issue_code
        type: string
        nullable: true
        comment: >
          General issue area code; decoded in lobbying_issue_codes
      - name: general_issue_name
        type: string
        nullable: true
        comment: >
          General issue area in words, e.g. Defense, Budget/Appropriations
      - name: description
        type: string
        nullable: true
        comment: >
          Filer's free-text statement of the specific lobbying issues; names bills and
          programs
      - name: foreign_entity_issues
        type: string
        nullable: true
        comment: >
          Issues lobbied on that concern a foreign entity, when stated
      - name: lobbyist_count
        type: integer
        nullable: true
        comment: >
          Number of lobbyists listed on the activity
      - name: government_entity_count
        type: integer
        nullable: true
        comment: >
          Number of government entities contacted on the activity

    source:
      type: http
      url: "https://lda.gov/api/v1/filings/"
      method: GET
      headers:
        Authorization: "Token ${LDA_API_KEY}"
      parameters:
        page_size: "25"
        ordering: "dt_posted"
        dq_record_limit: "1000"
      response:
        format: json
      # 2 requests/second is the keyed limit of 120/minute; a 429 is retried after the
      # server's own Retry-After.
      rateLimit:
        requestsPerSecond: 2
        retryOn: [429, 500, 503]
        maxRetries: 6

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.LdaApiProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=lobbying_activities/year=*/quarter=*/"
      partition:
        columns: [type, year, quarter]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        batchPartitionColumns: [year, quarter]
        incrementalKeys: [year, quarter]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # LOBBYING_ACTIVITY_LOBBYISTS — who lobbied on each activity
  # ---------------------------------------------------------------------------
  - name: lobbying_activity_lobbyists
    pattern: "type=lobbying_activity_lobbyists/year=*/quarter=*/*.parquet"
    dataset_type: delta
    backfill_period: quarterly
    # No lookbackPeriods: the engine always reopens the most recent completed period on every run.
    # That is the current quarter while it is open, and on the first run of a new quarter it is the
    # quarter that just closed (the current one is not yet complete), so the closing read of the
    # previous quarter's last-day filings happens without further configuration. Older quarters are
    # immutable and stay complete.
    partitions: *lobbying_window_partitions
    comment: >
      The individual lobbyists named on each lobbying activity, one row per (activity,
      lobbyist). `covered_position` is any covered executive or legislative branch position
      the lobbyist held in the previous 20 years, as the filer wrote it (e.g. "Principal",
      "National President"); `is_new` is true when the lobbyist was added on this filing.
      `lobbyist_id` joins to the lobbyists registry. Join to lobbying_activities on
      (filing_uuid, activity_seq). Partitioned by `year` and `quarter`: the calendar quarter
      in which the filing was POSTED (Eastern time), not the period it reports on. A filing
      keeps its posting date, so a past partition never changes, and an amendment is a new
      filing in a later partition. The current quarter is re-read on each daily run. Source:
      LDA.gov (Senate Office of Public Records). The Senate Office of Public Records cannot
      vouch for the data or analyses derived from these data after they have been retrieved
      from LDA.gov.

    dimensions:
      type:
        - lobbying_activity_lobbyists
      year: *lobbying_year_range
      quarter: *lobbying_quarter

    columns:
      - <<: *partition_year
      - <<: *partition_quarter
      - name: filing_uuid
        type: string
        nullable: false
        comment: >
          LDA.gov's unique ID for the filing; joins every lobbying_* filing table
      - name: activity_seq
        type: integer
        nullable: false
        comment: >
          Position of the activity within its filing, from 1
      - name: lobbyist_id
        type: long
        nullable: true
        comment: >
          Lobbyist ID; the same person keeps one ID across filings
      - name: lobbyist_prefix
        type: string
        nullable: true
        comment: >
          Name prefix as published, e.g. MR., MS., HON.
      - name: lobbyist_first_name
        type: string
        nullable: true
        comment: >
          First name
      - name: lobbyist_nickname
        type: string
        nullable: true
        comment: >
          Nickname when given
      - name: lobbyist_middle_name
        type: string
        nullable: true
        comment: >
          Middle name or initial
      - name: lobbyist_last_name
        type: string
        nullable: true
        comment: >
          Last name
      - name: lobbyist_suffix
        type: string
        nullable: true
        comment: >
          Name suffix as published, e.g. JR., III
      - name: covered_position
        type: string
        nullable: true
        comment: >
          Covered government position held in the past, as the filer wrote it; NULL when
          none
      - name: is_new
        type: boolean
        nullable: true
        comment: >
          True when the lobbyist is new to this filing

    source:
      type: http
      url: "https://lda.gov/api/v1/filings/"
      method: GET
      headers:
        Authorization: "Token ${LDA_API_KEY}"
      parameters:
        page_size: "25"
        ordering: "dt_posted"
        dq_record_limit: "1000"
      response:
        format: json
      # 2 requests/second is the keyed limit of 120/minute; a 429 is retried after the
      # server's own Retry-After.
      rateLimit:
        requestsPerSecond: 2
        retryOn: [429, 500, 503]
        maxRetries: 6

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.LdaApiProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=lobbying_activity_lobbyists/year=*/quarter=*/"
      partition:
        columns: [type, year, quarter]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        batchPartitionColumns: [year, quarter]
        incrementalKeys: [year, quarter]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # LOBBYING_ACTIVITY_GOVERNMENT_ENTITIES — who was lobbied
  # ---------------------------------------------------------------------------
  - name: lobbying_activity_government_entities
    pattern: "type=lobbying_activity_government_entities/year=*/quarter=*/*.parquet"
    dataset_type: delta
    backfill_period: quarterly
    # No lookbackPeriods: the engine always reopens the most recent completed period on every run.
    # That is the current quarter while it is open, and on the first run of a new quarter it is the
    # quarter that just closed (the current one is not yet complete), so the closing read of the
    # previous quarter's last-day filings happens without further configuration. Older quarters are
    # immutable and stay complete.
    partitions: *lobbying_window_partitions
    comment: >
      The federal bodies each lobbying activity contacted, one row per (activity, government
      entity): House of Representatives, Senate, and executive agencies such as "Army, Dept
      of (Other)". `government_entity_id` decodes in lobbying_government_entity_codes. Join
      to lobbying_activities on (filing_uuid, activity_seq). Partitioned by `year` and
      `quarter`: the calendar quarter in which the filing was POSTED (Eastern time), not the
      period it reports on. A filing keeps its posting date, so a past partition never
      changes, and an amendment is a new filing in a later partition. The current quarter is
      re-read on each daily run. Source: LDA.gov (Senate Office of Public Records). The
      Senate Office of Public Records cannot vouch for the data or analyses derived from
      these data after they have been retrieved from LDA.gov.

    dimensions:
      type:
        - lobbying_activity_government_entities
      year: *lobbying_year_range
      quarter: *lobbying_quarter

    columns:
      - <<: *partition_year
      - <<: *partition_quarter
      - name: filing_uuid
        type: string
        nullable: false
        comment: >
          LDA.gov's unique ID for the filing; joins every lobbying_* filing table
      - name: activity_seq
        type: integer
        nullable: false
        comment: >
          Position of the activity within its filing, from 1
