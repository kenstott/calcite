  # ---------------------------------------------------------------------------
  # SCOTUS_SLIP_OPINIONS — opinions of the Court from supremecourt.gov, terms 2017 onward
  # ---------------------------------------------------------------------------
  # Source: supremecourt.gov "Opinions of the Court" listing per term, and the PDFs it links.
  # ScotusSlipOpinionsProvider reads a term at a time. Recent terms link one PDF per opinion;
  # terms 2017-2019 link into a preliminary-print or bound-volume PDF at a page, which is
  # downloaded once and cut into cases.
  - name: scotus_slip_opinions
    pattern: "type=scotus_slip_opinions/year=*/*.parquet"
    partitions: *scotus_year_partitions
    dataset_type: delta
    comment: >
      Every opinion of the U.S. Supreme Court in the "Opinions of the Court" listing on
      supremecourt.gov, Court terms 2017 to the current term: the cases the bound volumes in
      scotus_reports_cases do not cover (term 2017's opinions before March 21, 2018 are in
      volume 583 there). One row per case, partitioned by `year`, the term (October of `year`
      to the following summer). `holding_summary` is the Court's own one-line statement of the
      holding from the listing. `docket_numbers` are read from the opinion (a consolidated
      case lists every docket its footnote numbers; `listing_docket` is the one the listing
      gives). `disposition` is derived from the opinion's syllabus, so `disposition_source` is
      always opinion_text; it uses the vocabulary of scotus_reports_cases (Affirmed (includes
      modified), Reversed, Reversed and remanded, Vacated and remanded, Affirmed and reversed
      (or vacated) in part [and remanded], Dismissed as improvidently granted) and can also be
      Reversed in part and remanded or Reversed in part, vacated in part, and remanded where the
      Court affirmed no part, or Application granted / Application denied for an order on an
      emergency application (a docket such as 24A884). It is null for an original-jurisdiction
      decree. `us_citation` is null while the listing shows only a volume and print part
      (609/2) and has no page yet. `opinion_text` is the full text as extracted from the PDF,
      in which the "fi" ligature loses its "i" (e.g. "affrmed", "fnal"). `author_initials` is
      PC for a per curiam and otherwise the justice's initials as the listing prints them.

    dimensions:
      type:
        - scotus_slip_opinions
      year: *scotus_slip_term_range

    columns:
      - name: release
        type: string
        nullable: false
        comment: The opinion's release number within the term (e.g. 67), or a label such as D1 for a decree in an original-jurisdiction case
      - name: decision_date
        type: string
        nullable: false
        comment: Date of decision (YYYY-MM-DD)
      - name: listing_docket
        type: string
        nullable: false
        comment: Docket number as the listing prints it (23-583; 24A884 for an application; 141, Orig. for an original case)
      - name: docket_numbers
        type: array<string>
        nullable: true
        comment: The Court's docket numbers read from the opinion, lead docket first, normalised with a hyphen (23-583; 24A910; 137-Orig). A consolidated case lists every docket the opinion's footnote numbers; empty where the text carries none
      - name: case_name
        type: string
        nullable: false
        comment: Case name as the listing prints it, e.g. Goldey v. Fields
      - name: holding_summary
        type: string
        nullable: true
        comment: The Court's own one-line statement of the holding, from the listing; null where the listing gives none
      - name: author_initials
        type: string
        nullable: false
        comment: PC for a per curiam, otherwise the initials of the justice who wrote the opinion (e.g. NG, KJ, B) as the listing prints them; D for a decree
      - name: volume
        type: integer
        nullable: true
        comment: United States Reports volume, from the listing's citation; null when the listing gives none
      - name: first_page
        type: integer
        nullable: true
        comment: Page on which the case begins in the United States Reports; null until the page is assigned (the listing then shows only volume and print part, e.g. 609/2)
      - name: us_citation
        type: string
        nullable: true
        comment: Official citation, e.g. 606 U.S. 942; null while no page is assigned
      - name: disposition
        type: string
        nullable: true
        comment: What the Court did with the judgment below, derived from the opinion's syllabus, in the vocabulary of scotus_reports_cases plus Reversed in part and remanded, Reversed in part vacated in part and remanded, Application granted and Application denied; null for an original-jurisdiction decree and where no syllabus disposition line is found
      - name: disposition_source
        type: string
        nullable: true
        comment: opinion_text whenever disposition is set (there is no curated outcome for these terms); null when disposition is null
      - name: decision_type
        type: string
        nullable: true
        comment: Equally divided vote when the Court affirmed by an equally divided vote; null otherwise
      - name: pdf_url
        type: string
        nullable: false
        comment: supremecourt.gov URL of the PDF the opinion text was read from; for terms whose opinions share a volume PDF it is the volume's file and pdf_page locates the case
      - name: pdf_page
        type: integer
        nullable: true
        comment: Page of pdf_url on which the case begins when the PDF is a volume holding many cases; null for a per-opinion PDF
      - name: page_count
        type: integer
        nullable: false
        comment: Pages of the case in the PDF
      - name: opinion_text
        type: string
        nullable: true
        comment: "Full text of the case as extracted from the PDF — syllabus, opinion of the Court, concurrences and dissents. The \"fi\" ligature loses its \"i\" in the source encoding (\"affrmed\", \"fnal\"). Text blob"

    backfill_period: annual

    source:
      type: http
      url: "https://www.supremecourt.gov/opinions/slipopinion/{year}"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.ScotusSlipOpinionsProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=scotus_slip_opinions/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: scotus_slip_opinions
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # SCOTUS_DOCKETS — one row per docket of a decided case, from supremecourt.gov
  # ---------------------------------------------------------------------------
  # Source: the Court's docket pages (search.aspx?filename=/docket/docketfiles/html/public/...),
  # for the docket numbers in each term's "Opinions of the Court" listing. Decided cases only:
  # petitions the Court did not take are not fetched. ScotusDocketsProvider and
  # ScotusDocketEntriesProvider read the same pages through ScotusDocketFetcher.
  - name: scotus_dockets
    pattern: "type=scotus_dockets/year=*/*.parquet"
    partitions: *scotus_year_partitions
    dataset_type: delta
    comment: >
      The Supreme Court docket of each case it decided in Court terms 2017 to the current term
      (the same cases as scotus_slip_opinions): one row per docket, partitioned by `year`, the
      term the case was decided in. Header fields are the docket's own — title, when it was
      docketed, the court below and its case numbers and decision date, any application it is
      linked with, and the Questions Presented. `granted_date`, `argued_date` and
      `judgment_issued_date` are the dates of the docket entries "Petition GRANTED", "Argued." and
      "Judgment Issued." and are null where the docket has none (a summary reversal is not argued;
      a docket in which the Court's own entry is misspelt has no judgment date). `entry_count` and
      `document_count` count the docket's entries and the filings linked from them; the entries
      are in scotus_docket_entries. Join to scotus_slip_opinions on `docket_number` =
      `listing_docket`. Not included: dockets of cases decided before term 2017 (the docket
      pages before 2016 use an older layout that is not read), original-jurisdiction cases (their
      page address cannot be derived from the listing), and, for a consolidated case, the
      companion dockets — only the lead docket the listing names is fetched. No petitions the
      Court declined to hear are here.

    dimensions:
      type:
        - scotus_dockets
      year: *scotus_slip_term_range

    columns:
      - name: docket_number
        type: string
        nullable: false
        comment: The Court's docket number (23-583; an application is 24A910)
      - name: title
        type: string
        nullable: false
        comment: Caption as the docket prints it, e.g. Amina Bouarfa, Petitioner v. Alejandro Mayorkas, Secretary of Homeland Security, et al.
      - name: docketed
        type: string
        nullable: false
        comment: Date the case was docketed (YYYY-MM-DD)
      - name: linked_with
        type: string
        nullable: true
        comment: Application docket number or numbers linked to this case (e.g. an extension of time, 23A348), comma-separated; null when none
      - name: lower_court
        type: string
        nullable: true
        comment: Court whose decision was reviewed, e.g. United States Court of Appeals for the Eleventh Circuit; null for a case with no court below
      - name: lower_court_case_numbers
        type: string
        nullable: true
        comment: The lower court's case number or numbers as the docket prints them, without the parentheses (22-12429)
      - name: lower_court_decision_date
        type: string
        nullable: true
        comment: Date the lower court decided (YYYY-MM-DD)
      - name: lower_court_decision_note
        type: string
        nullable: true
        comment: Annotation the docket prints after the lower-court decision date, e.g. Rule 12.4 (the petition was filed under Supreme Court Rule 12.4); null when there is none
      - name: discretionary_court_decision_date
        type: string
        nullable: true
        comment: Date a state court of discretionary review decided (YYYY-MM-DD), for a case that came from a state court that could decline review; lower_court_decision_date is the earlier decision below it
      - name: rehearing_denied
        type: string
        nullable: true
        comment: Date rehearing was denied (YYYY-MM-DD), when the docket records one
      - name: questions_presented_url
        type: string
        nullable: true
        comment: URL of the Questions Presented PDF; null when the Court did not take the case up for full review
      - name: granted_date
        type: string
        nullable: true
        comment: Date of the docket entry "Petition GRANTED" (YYYY-MM-DD); null when there is none
      - name: argued_date
        type: string
        nullable: true
        comment: Date of the docket entry "Argued." (YYYY-MM-DD); null for a case decided without argument
      - name: judgment_issued_date
        type: string
        nullable: true
        comment: Date of the docket entry "Judgment Issued." (YYYY-MM-DD); null when none has issued
      - name: entry_count
        type: integer
        nullable: false
        comment: Number of entries in the docket's proceedings and orders (rows in scotus_docket_entries)
      - name: document_count
        type: integer
        nullable: false
        comment: Number of filings linked from the docket's entries

    backfill_period: annual

    source:
      type: http
      url: "https://www.supremecourt.gov/opinions/slipopinion/{year}"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.ScotusDocketsProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=scotus_dockets/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: scotus_dockets
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # SCOTUS_DOCKET_ENTRIES — one row per entry in each docket's proceedings and orders
  # ---------------------------------------------------------------------------
  - name: scotus_docket_entries
    pattern: "type=scotus_docket_entries/year=*/*.parquet"
    partitions: *scotus_year_partitions
    dataset_type: delta
    comment: >
      Every entry in the "Proceedings and Orders" of the dockets in scotus_dockets, one row per
      entry in the order the docket lists them (`sequence` from 1), partitioned by `year`, the term
      the case was decided in. Extensions of time, briefs including those of amici, the
      distribution of the petition for conference, the grant, the argument and the judgment all
      appear here as the Court's own text in `entry_text`, with the filings linked from the entry
      in `document_labels` and `document_urls` (parallel lists). Join to scotus_dockets on
      `docket_number`. Same coverage as scotus_dockets: decided cases from term 2017, lead docket of
      a consolidated case, no original-jurisdiction cases.

    dimensions:
      type:
        - scotus_docket_entries
      year: *scotus_slip_term_range

    columns:
      - name: docket_number
        type: string
        nullable: false
        comment: The Court's docket number the entry belongs to; joins to scotus_dockets
      - name: sequence
        type: integer
        nullable: false
        comment: Position of the entry in the docket, from 1, in the order the docket lists them
      - name: entry_date
        type: string
        nullable: false
        comment: Date of the entry (YYYY-MM-DD)
      - name: entry_text
        type: string
        nullable: false
        comment: The entry's text as the Court prints it, e.g. Petition GRANTED. or Brief of respondent ... in opposition filed.
      - name: document_labels
        type: array<string>
        nullable: true
        comment: Labels of the filings linked from the entry (Petition, Main Document, Appendix); parallel to document_urls; null when the entry links none
      - name: document_urls
        type: array<string>
        nullable: true
        comment: URLs of the filings linked from the entry; parallel to document_labels; null when the entry links none

    backfill_period: annual

    source:
      type: http
      url: "https://www.supremecourt.gov/opinions/slipopinion/{year}"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.ScotusDocketEntriesProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=scotus_docket_entries/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: scotus_docket_entries
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: scotus_cases
    comment: >
      Every decided U.S. Supreme Court case from the bound United States Reports and from
      supremecourt.gov, in one table with one row per case: the rows of scotus_reports_cases
      (Court terms 1781 through 2017, volumes 2-583) and of scotus_slip_opinions (terms 2017
      onward). The two sources do not overlap — the term 2017 opinions before March 21, 2018 are
      in volume 583 and the rest are slip opinions. `source` says which table a row is from
      (govinfo_reports or supremecourt_slip) and so which columns are populated: the curated
      outcome columns (`party_winning`, `chief_justice`, `opinion_writer`, votes, `case_origin`,
      `case_source`, `cert_reason`, `jurisdiction`) are present for govinfo_reports rows through
      volume 582 only, and `holding_summary` and `author_initials` only for supremecourt_slip
      rows. `term` is the Court term (the year its October term began). `case_name` is the name
      without its citation. `disposition` uses one vocabulary in both sources, and
      `disposition_source` says whether it is GovInfo's curated value or was derived from the
      opinion text. `docket_numbers` are the Court's docket numbers read from the opinion.
      `decision_date` is null for a volume 583 case, where GovInfo dates only the year;
      `decision_year` is always present.
    sql: >
      SELECT 'govinfo_reports' AS source, r.year AS term, r.us_citation, r.volume, r.first_page,
        CASE WHEN r.full_citation IS NOT NULL AND r.case_title LIKE '%, ' || r.full_citation
             THEN SUBSTRING(r.case_title FROM 1
                            FOR CHAR_LENGTH(r.case_title) - CHAR_LENGTH(r.full_citation) - 2)
             ELSE r.case_title END AS case_name,
        r.decision_date, r.decision_year, r.docket_numbers, r.disposition,
        r.disposition_source, r.decision_type, r.party_winning, r.chief_justice,
        r.opinion_writer, r.votes_majority, r.votes_minority, r.jurisdiction, r.case_origin,
        r.case_source, r.cert_reason, CAST(NULL AS VARCHAR) AS holding_summary,
        CAST(NULL AS VARCHAR) AS author_initials, r.pdf_url, r.opinion_text
      FROM scotus_reports_cases r
      UNION ALL
      SELECT 'supremecourt_slip' AS source, s.year AS term, s.us_citation, s.volume, s.first_page,
        s.case_name, s.decision_date, CAST(SUBSTRING(s.decision_date FROM 1 FOR 4) AS INTEGER),
        s.docket_numbers, s.disposition, s.disposition_source, s.decision_type,
        CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR),
        CAST(NULL AS INTEGER), CAST(NULL AS INTEGER), CAST(NULL AS VARCHAR),
        CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR),
        s.holding_summary, s.author_initials, s.pdf_url, s.opinion_text
      FROM scotus_slip_opinions s
