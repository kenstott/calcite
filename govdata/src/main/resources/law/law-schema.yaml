      reports on. A filing keeps its posting date, so a past partition never changes, and an
      amendment is a new filing in a later partition. The current quarter is re-read on each
      daily run. Source: LDA.gov (Senate Office of Public Records). The Senate Office of
      Public Records cannot vouch for the data or analyses derived from these data after
      they have been retrieved from LDA.gov.

    dimensions:
      type:
        - lobbying_contribution_pacs
      year: *lobbying_year_range
      quarter: *lobbying_quarter

    columns:
      - <<: *partition_year
      - <<: *partition_quarter
      - name: filing_uuid
        type: string
        nullable: false
        comment: >
          LDA.gov's unique ID for the filing; joins every lobbying_* filing table
      - name: pac_seq
        type: integer
        nullable: false
        comment: >
          Position of the PAC within its report, from 1
      - name: pac_name
        type: string
        nullable: true
        comment: >
          PAC name, e.g. Kidney Care Council PAC

    source:
      type: http
      url: "https://lda.gov/api/v1/contributions/"
      method: GET
      headers:
        Authorization: "Token ${LDA_API_KEY}"
      parameters:
        page_size: "25"
        ordering: "dt_posted"
        dq_record_limit: "1000"
      response:
        format: json
      # 2 requests/second is the keyed limit of 120/minute; a 429 is retried after the
      # server's own Retry-After.
      rateLimit:
        requestsPerSecond: 2
        retryOn: [429, 500, 503]
        maxRetries: 6

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.LdaApiProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=lobbying_contribution_pacs/year=*/quarter=*/"
      partition:
        columns: [type, year, quarter]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        batchPartitionColumns: [year, quarter]
        incrementalKeys: [year, quarter]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

