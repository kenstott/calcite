      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_cosponsors/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_cosponsors
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_COMMITTEES — committees and subcommittees a bill was referred to
  # ---------------------------------------------------------------------------
  - name: bill_committees
    pattern: "type=bill_committees/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Committees and subcommittees a bill was referred to, one row per committee or
      subcommittee, from the same GovInfo Bill Status XML. Join to `bills` on (congress,
      bill_type, bill_number). `committee_system_code` is the Congress.gov committee code
      (e.g. hsju00 = House Judiciary). A subcommittee row (e.g. hsvr10) has
      `parent_committee_system_code` set to its full committee's code and NULL `chamber` and
      `committee_type`, which the source records only on the full committee. `committee_type`
      is Standing, Select, Special or Other. What each committee did with the bill (referred, markup,
      reported, hearings) is in bill_committee_activities.

    dimensions:
      type:
        - bill_committees
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: committee_system_code
        type: string
        nullable: false
        comment: Congress.gov committee code, e.g. hsju00 (House Judiciary)
      - name: committee_name
        type: string
        nullable: true
        comment: Committee or subcommittee name, e.g. "Judiciary Committee"
      - name: chamber
        type: string
        nullable: true
        comment: House, Senate or Joint; NULL on subcommittee rows
      - name: committee_type
        type: string
        nullable: true
        comment: Standing, Select, Special or Other; NULL on subcommittee rows
      - name: parent_committee_system_code
        type: string
        nullable: true
        comment: Full committee code when this row is a subcommittee; NULL on full-committee rows

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_committees/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_committees
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_COMMITTEE_ACTIVITIES — what each committee did with a bill
  # ---------------------------------------------------------------------------
  - name: bill_committee_activities
    pattern: "type=bill_committee_activities/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Every recorded committee activity on a bill, one row per (committee or subcommittee,
      activity), from the same GovInfo Bill Status XML. Join to bill_committees on
      (congress, bill_type, bill_number, committee_system_code). `activity_name` values
      include Referred To, Markup By, Reported By, Hearings By (full committee), Discharged
      From, Reported Original Measure and Bills of Interest - Exchange of Letters, spelled as
      the source publishes them — capitalization is not consistent (Referred To / Referred to).
      `activity_date` is a UTC timestamp. The source occasionally repeats an identical
      activity, so the rows have no unique key.

    dimensions:
      type:
        - bill_committee_activities
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: committee_system_code
        type: string
        nullable: false
        comment: Committee or subcommittee code; joins to bill_committees
      - name: activity_name
        type: string
        nullable: true
        comment: Activity as published, e.g. "Referred To", "Markup By", "Reported By"
      - name: activity_date
        type: string
        nullable: true
        comment: >
          UTC timestamp of the activity (YYYY-MM-DDTHH:MM:SSZ); NULL for a few
          activities

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_committee_activities/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_committee_activities
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_SUBJECTS — CRS legislative subject terms
  # ---------------------------------------------------------------------------
  - name: bill_subjects
    pattern: "type=bill_subjects/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Congressional Research Service legislative subject terms assigned to a bill, one row
      per (bill, subject), from the same GovInfo Bill Status XML — e.g. "Abortion",
      "Accounting and auditing". A bill can carry hundreds (H.R. 1 in the 119th has 239). The
      single broader policy area is `bills.policy_area`, not repeated here. Subjects are
