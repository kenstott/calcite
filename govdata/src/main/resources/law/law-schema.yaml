  # ---------------------------------------------------------------------------
  # BILL_RECORDED_VOTES — roll-call votes on bills and amendments
  # ---------------------------------------------------------------------------
  - name: bill_recorded_votes
    pattern: "type=bill_recorded_votes/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Roll-call votes recorded against a bill or one of its amendments, one row per vote, from
      the same GovInfo Bill Status XML. `url` is the House Clerk or Senate roll-call XML that
      holds the member-by-member result. A vote on an amendment has `amendment_type` and
      `amendment_number` set; a vote on the bill itself has them NULL. `action_date` and
      `action_text` are those of the bill or amendment action that recorded the vote (for
      example "Passed/agreed to in House: On passage Passed by the Yeas and Nays: 220 - 213").
      `full_action_name` (e.g. "Passage of a Measure") appears only on votes listed directly
      on the bill in a few older files, which then have NULL action fields.
      One roll call can be cited by several actions on the same bill, so there is one row
      per citation and no unique key.

    dimensions:
      type:
        - bill_recorded_votes
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
