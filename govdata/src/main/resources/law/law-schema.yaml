  # ---------------------------------------------------------------------------
  - name: lobbying_contribution_reports
    pattern: "type=lobbying_contribution_reports/year=*/quarter=*/*.parquet"
    dataset_type: delta
    backfill_period: quarterly
    # No lookbackPeriods: the engine always reopens the most recent completed period on every run.
    # That is the current quarter while it is open, and on the first run of a new quarter it is the
    # quarter that just closed (the current one is not yet complete), so the closing read of the
    # previous quarter's last-day filings happens without further configuration. Older quarters are
    # immutable and stay complete.
    partitions: *lobbying_window_partitions
    comment: >
      Semiannual reports of political contributions filed by registrants and by individual
      lobbyists (form LD-203), one row per report: the Mid-Year Report (period Jan 1 - Jun
      30, `filing_period` mid_year) and the Year-End Report (Jul 1 - Dec 31, year_end).
      `filer_type` is `lobbyist` when an individual files (the lobbyist_* columns are then
      set) or `organization` when a registrant files (they are NULL). `no_contributions` is
      true when the filer certifies it made none. The individual contributions are in
      lobbying_contribution_items and any PACs the filer controls in
      lobbying_contribution_pacs. The report's own address is not carried — for an
      individual it is a home address — only the filer's state and country. Partitioned by
      `year` and `quarter`: the calendar quarter in which the filing was POSTED (Eastern
      time), not the period it reports on. A filing keeps its posting date, so a past
      partition never changes, and an amendment is a new filing in a later partition. The
      current quarter is re-read on each daily run. Source: LDA.gov (Senate Office of Public
      Records). The Senate Office of Public Records cannot vouch for the data or analyses
      derived from these data after they have been retrieved from LDA.gov.

    dimensions:
      type:
        - lobbying_contribution_reports
      year: *lobbying_year_range
      quarter: *lobbying_quarter

    columns:
      - <<: *partition_year
      - <<: *partition_quarter
      - name: filing_uuid
        type: string
        nullable: false
        comment: >
          LDA.gov's unique ID for the filing; joins every lobbying_* filing table
      - name: filing_type
        type: string
        nullable: true
        comment: >
          Report type code, e.g. MM (mid-year), YY (year-end), and amendment variants;
          decoded in lobbying_filing_types
      - name: filing_type_name
        type: string
        nullable: true
        comment: >
          Report type in words, e.g. Mid-Year Report
      - name: filing_year
        type: integer
        nullable: true
        comment: >
          Calendar year of the period the report covers
      - name: filing_period
        type: string
        nullable: true
        comment: >
          mid_year or year_end
      - name: filing_document_url
        type: string
        nullable: true
        comment: >
          LDA.gov page of the report itself
      - name: filer_type
        type: string
        nullable: true
        comment: >
          lobbyist (an individual) or organization (a registrant)
      - name: dt_posted
        type: string
        nullable: true
        comment: >
          When the report was posted (ISO-8601 with Eastern-time offset); decides the
          year/quarter partition
      - name: comments
        type: string
        nullable: true
        comment: >
          Filer's free-text comments on the report
      - name: filer_state
        type: string
        nullable: true
        comment: >
          State of the filer's address
      - name: filer_country
        type: string
        nullable: true
        comment: >
          Country of the filer's address
      - name: registrant_id
        type: long
        nullable: true
        comment: >
          Registrant ID; joins to lobbying_registrants
      - name: registrant_name
        type: string
        nullable: true
        comment: >
          Registrant name
      - name: registrant_house_id
        type: integer
        nullable: true
        comment: >
          The registrant's ID in the House Lobbying Disclosure system, when it has one
      - name: registrant_description
        type: string
        nullable: true
        comment: >
          Registrant's own description of its business
      - name: lobbyist_id
        type: long
        nullable: true
        comment: >
          Filing lobbyist (NULL for an organization filer) ID; the same person keeps one ID
          across filings
      - name: lobbyist_prefix
        type: string
        nullable: true
        comment: >
          Name prefix as published, e.g. MR., MS., HON.
      - name: lobbyist_first_name
        type: string
        nullable: true
        comment: >
          First name
      - name: lobbyist_nickname
        type: string
        nullable: true
        comment: >
          Nickname when given
      - name: lobbyist_middle_name
        type: string
        nullable: true
        comment: >
          Middle name or initial
      - name: lobbyist_last_name
        type: string
        nullable: true
        comment: >
          Last name
      - name: lobbyist_suffix
        type: string
        nullable: true
        comment: >
          Name suffix as published, e.g. JR., III
      - name: no_contributions
        type: boolean
        nullable: true
        comment: >
          True when the filer reports no contributions
      - name: item_count
        type: integer
        nullable: true
        comment: >
          Number of contribution items (rows in lobbying_contribution_items)
      - name: pac_count
        type: integer
        nullable: true
        comment: >
          Number of PACs listed (rows in lobbying_contribution_pacs)

    source:
      type: http
      url: "https://lda.gov/api/v1/contributions/"
      method: GET
      headers:
        Authorization: "Token ${LDA_API_KEY}"
      parameters:
        page_size: "25"
        ordering: "dt_posted"
        dq_record_limit: "1000"
      response:
        format: json
      # 2 requests/second is the keyed limit of 120/minute; a 429 is retried after the
      # server's own Retry-After.
      rateLimit:
        requestsPerSecond: 2
        retryOn: [429, 500, 503]
        maxRetries: 6

