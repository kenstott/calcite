        type: string
        nullable: true
        comment: SAMDT or HAMDT when the vote was on an amendment; NULL for a vote on the bill
      - name: amendment_number
        type: integer
        nullable: true
        comment: Amendment number when the vote was on an amendment; NULL otherwise
      - name: action_date
        type: string
        nullable: true
        comment: Date of the action that recorded the vote (YYYY-MM-DD); NULL for legacy bill-level votes
      - name: action_text
        type: string
        nullable: true
        comment: Text of the action that recorded the vote; NULL for legacy bill-level votes
      - name: vote_chamber
        type: string
        nullable: true
        comment: House or Senate
      - name: vote_congress
        type: integer
        nullable: true
        comment: Congress the vote was taken in
      - name: session_number
        type: integer
        nullable: true
        comment: Session of that Congress (1 or 2)
      - name: roll_number
        type: integer
        nullable: true
        comment: Roll-call number within the chamber and session
      - name: vote_date
        type: string
        nullable: true
        comment: UTC timestamp of the vote
      - name: url
        type: string
        nullable: true
        comment: House Clerk or Senate roll-call XML with the individual votes
      - name: full_action_name
        type: string
        nullable: true
        comment: Name of the vote (e.g. "Passage of a Measure"); only on legacy bill-level votes

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
