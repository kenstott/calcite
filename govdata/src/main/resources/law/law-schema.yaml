      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: subject_name
        type: string
        nullable: false
        comment: CRS legislative subject term
      - name: update_date
        type: string
        nullable: true
        comment: When the term was last updated on Congress.gov (UTC timestamp)

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_subjects/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_subjects
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_TEXT_VERSIONS — published text of a bill, by version and format
  # ---------------------------------------------------------------------------
  - name: bill_text_versions
    pattern: "type=bill_text_versions/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Every published text version of a bill, one row per (version, format), from the same
      GovInfo Bill Status XML; the `url` points at the text on govinfo.gov. `version_type`
      follows the bill through Congress using GPO's stage names — Introduced in House/Senate,
      Referred in Senate, Reported in House, Reported to Senate, Placed on Calendar Senate,
      Engrossed in House/Senate, Engrossed Amendment House/Senate, Considered and Passed
      House/Senate, Agreed to House/Senate, Enrolled Bill, Public Law, and older stage names
      such as Additional Sponsors House and Committee Discharged Senate. `format_type` is set only for the "United States Legislative Markup" (USLM)
      file; the plain XML row has NULL `format_type`. A version whose text is not yet
      published has one row with NULL `url`, and some versions (e.g. Enrolled Bill) have NULL
      `version_date`.
      The source occasionally lists an identical version twice.

    dimensions:
      type:
        - bill_text_versions
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: version_type
        type: string
        nullable: true
        comment: Stage of the bill this text belongs to, e.g. "Introduced in House"
      - name: version_date
        type: string
        nullable: true
        comment: UTC timestamp of the version; NULL when the source gives none
      - name: format_type
        type: string
        nullable: true
        comment: >
          "United States Legislative Markup" for the USLM file; NULL for the plain XML
      - name: url
        type: string
        nullable: true
        comment: govinfo.gov URL of the text; NULL when no format is published yet

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_text_versions/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_text_versions
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_RELATED_BILLS — bills linked to this bill
  # ---------------------------------------------------------------------------
  - name: bill_related_bills
    pattern: "type=bill_related_bills/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Bills the Congressional Research Service, the House or GPO link to a bill, one row per
      (bill, related bill, relationship), from the same GovInfo Bill Status XML.
      `relationship_type` is one of Related bill, Identical bill, Companion bill, Cross-Congress
      related bill, Contained in public law, Public law contains the text, Procedurally related
      (also spelled Procedurally-related in older files), Related document, Text similarities,
      PrimaryCompanionBillBecameLaw, SecondaryCompanionBillBecameLaw; `identified_by` says who
      made the link (CRS, House, Senate, U.S. Government Publishing Office). `related_bill_type` uses
      the same lowercase slugs as `bill_type` (hr, s, hres, ...), so (related_congress,
      related_bill_type, related_bill_number) joins straight back to `bills`. The
      `related_latest_action_*` columns are the related bill's latest action as of this
      bill's last update and can lag `bills` for that bill.
      The source occasionally repeats an identical relationship, so the rows have no unique
      key.

    dimensions:
      type:
        - bill_related_bills
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: related_congress
        type: integer
        nullable: true
        comment: Congress of the related bill (differs for a Cross-Congress relationship)
      - name: related_bill_type
        type: string
        nullable: true
        comment: Bill type slug of the related bill (hr, s, hres, ...); joins to bills.bill_type
      - name: related_bill_number
        type: integer
        nullable: true
        comment: Bill number of the related bill
      - name: related_title
        type: string
        nullable: true
        comment: Title of the related bill
      - name: related_latest_action_date
        type: string
        nullable: true
        comment: Related bill latest action date (YYYY-MM-DD)
      - name: related_latest_action_time
        type: string
        nullable: true
        comment: Related bill latest action time when recorded; usually NULL
      - name: related_latest_action_text
        type: string
        nullable: true
        comment: Related bill latest action text
      - name: relationship_type
        type: string
        nullable: true
        comment: How the bills are related, e.g. "Identical bill", "Related bill"
      - name: identified_by
        type: string
        nullable: true
        comment: >
          Who identified the relationship: CRS, House, Senate, or U.S. Government
          Publishing Office

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_related_bills/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_related_bills
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_AMENDMENTS — amendments offered to a bill
  # ---------------------------------------------------------------------------
  - name: bill_amendments
    pattern: "type=bill_amendments/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Amendments offered to a bill, one row per amendment, from the same GovInfo Bill Status
      XML. `amendment_type` is SAMDT (Senate) or HAMDT (House); `amendment_number` is unique
      within (congress, amendment_type). Sponsor columns hold a member's bioguide ID and name;
      when a committee sponsored the amendment (e.g. the Rules Committee) only `sponsor_name`
      is set. `amended_amendment_*` is set when the amendment amends another amendment.
      `purpose` and `description` are usually NULL. `action_count` and `cosponsor_count` count
      the amendment's own actions and cosponsors, which are the rows of
      bill_amendment_actions and bill_amendment_cosponsors; roll-call votes on amendment
      actions are in bill_recorded_votes.

    dimensions:
      type:
        - bill_amendments
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: amendment_type
        type: string
        nullable: false
        comment: SAMDT (Senate amendment) or HAMDT (House amendment)
      - name: amendment_number
        type: integer
        nullable: false
        comment: Amendment number within the Congress and amendment type
      - name: chamber
        type: string
        nullable: true
        comment: Senate or House of Representatives
      - name: sponsor_bioguide_id
        type: string
        nullable: true
        comment: Bioguide ID of the first listed sponsor; NULL for a committee sponsor
      - name: sponsor_full_name
        type: string
        nullable: true
        comment: Sponsor display name with party and state
      - name: sponsor_name
        type: string
        nullable: true
        comment: Sponsor name when a committee sponsored (e.g. "Rules Committee"); NULL for members
      - name: sponsor_party
        type: string
        nullable: true
        comment: Sponsor party code
      - name: sponsor_state
        type: string
        nullable: true
        comment: Sponsor two-letter state code
      - name: sponsor_district
        type: string
        nullable: true
        comment: Sponsor House district; NULL for senators and committees
      - name: description
        type: string
        nullable: true
        comment: Amendment description text; usually NULL
      - name: purpose
        type: string
        nullable: true
        comment: Statement of purpose, e.g. "To apply the prohibition ..."; usually NULL
      - name: submitted_date
        type: string
        nullable: true
        comment: UTC timestamp the amendment was submitted
      - name: proposed_date
        type: string
        nullable: true
        comment: UTC timestamp the amendment was proposed; usually NULL
      - name: latest_action_date
        type: string
        nullable: true
        comment: Date of the amendment's latest action; NULL when none recorded
      - name: latest_action_text
        type: string
        nullable: true
        comment: Text of the amendment's latest action; NULL when none recorded
      - name: update_date
        type: string
        nullable: true
        comment: Last update timestamp on Congress.gov
      - name: amended_amendment_type
        type: string
        nullable: true
        comment: Type of the amendment this one amends; NULL unless it amends an amendment
      - name: amended_amendment_number
        type: integer
        nullable: true
        comment: Number of the amendment this one amends; NULL unless it amends an amendment
      - name: action_count
        type: integer
        nullable: false
        comment: Number of actions recorded on this amendment
      - name: cosponsor_count
        type: integer
        nullable: false
        comment: Number of cosponsors listed on this amendment
      - name: on_behalf_of_bioguide_id
        type: string
        nullable: true
        comment: >
          Bioguide ID of the member the amendment was offered on behalf of; NULL if not
          on behalf of anyone
      - name: on_behalf_of_full_name
        type: string
        nullable: true
        comment: Name of the member the amendment was offered on behalf of
      - name: on_behalf_of_type
        type: string
        nullable: true
        comment: >
          Relationship: "Submitted on behalf of" or "Proposed on behalf of"
      - name: latest_action_time
        type: string
        nullable: true
        comment: Time of the latest action when recorded; usually NULL
      - name: amendments_to_amendment_count
        type: integer
        nullable: true
        comment: Number of amendments offered to this amendment; NULL when none are listed

    source:
      type: http
      url: "https://www.govinfo.gov/bulkdata/BILLSTATUS/{congress}/{bill_type}/BILLSTATUS-{congress}-{bill_type}.zip"
      method: GET
      response:
        format: json

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.law.CongressBillStatusProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=bill_amendments/congress=*/bill_type=*/"
      partition:
        columns: [type, congress, bill_type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/law"
        tableName: bill_amendments
        batchPartitionColumns: [congress, bill_type]
        incrementalKeys: [congress, bill_type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # BILL_AMENDMENT_ACTIONS — action history of each amendment
  # ---------------------------------------------------------------------------
  - name: bill_amendment_actions
    pattern: "type=bill_amendment_actions/congress=*/bill_type=*/*.parquet"
    partitions: *bill_partitions
    comment: >
      Every recorded action on every amendment in `bill_amendments`, one row per action, from
      the same GovInfo Bill Status XML (introduction, submission, agreed to, not agreed to,
      withdrawn, ...). Join to `bill_amendments` on (congress, bill_type, bill_number,
      amendment_type, amendment_number). There is no sequence number: the source does not list
      amendment actions in date order. Roll-call votes on amendment actions are in
      bill_recorded_votes. `action_type` values seen: Floor, Committee, IntroReferral,
      ResolvingDifferences, NotUsed.

    dimensions:
      type:
        - bill_amendment_actions
      congress: *congress_range
      bill_type: *bill_types
      refresh_month: *bill_refresh_month

    columns:
      - <<: *partition_congress
      - <<: *partition_bill_type
      - name: bill_number
        type: integer
        nullable: false
        comment: Bill number within its Congress and bill type
      - name: amendment_type
        type: string
        nullable: false
        comment: SAMDT or HAMDT; with amendment_number identifies the amendment
      - name: amendment_number
        type: integer
        nullable: false
        comment: Amendment number within the Congress and amendment type
      - name: action_date
        type: string
        nullable: true
        comment: Date of the action (YYYY-MM-DD)
      - name: action_time
        type: string
        nullable: true
        comment: >
          Time of day when the source records one (HH:MM:SS), otherwise NULL
      - name: text
        type: string
        nullable: true
        comment: Action text as recorded; NULL for some actions
      - name: action_type
        type: string
        nullable: true
        comment: Source coarse action category (Floor, Committee, IntroReferral, ...)
