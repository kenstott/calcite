  # ---------------------------------------------------------------------------
  # EIA FOSSIL FUEL PRODUCTION - Crude oil and natural gas production
  # ---------------------------------------------------------------------------
  - name: eia_fossil_fuel_production
    # 36 periods = 3 YEARS of monthly data. EIA-914 re-estimates the two prior months every month,
    # and the annual PSA (Aug) restates up to 10 prior years of oil production, the NGA (Oct) two
    # prior years of gas. EIA considers a state final "prior to two calendar years back", so 2
    # years sat exactly on that boundary with no margin; 3 covers it.
    # https://www.eia.gov/petroleum/production/pdf/eia914revisionpolicy.pdf
    lookbackPeriods: 36
    freshness:
      type: hash
    pattern: "type=eia_fossil/year=*/month=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2006
      maxYear: 2026
      distinctYears: 20
      contiguous: false
      years: [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2026]
      rowCount: 20496
      checkedAt: "2026-09-05T14:46:44Z"
    partitions: *standard_partitions_monthly
    comment: >
      EIA API v2 petroleum crude oil production by state and month. The transformer
      also fetches the EIA natural gas production summary endpoint internally and unions
      both series into the output, so each partition contains both crude oil and natural
      gas rows distinguished by the fuel_type column. One row per EIA area + fuel type +
      process + year-month. Cross-references geo.states via state_abbr.

    dimensions:
      type:
        - eia_fossil
      year: *eia_fossil_years
      month: *eia_months

    columns:
      - name: production_year
        type: integer
        nullable: false
        comment: Calendar year of production
      - name: production_month
        type: integer
        nullable: false
        comment: Calendar month (1-12) of production
      - name: eia_area_code
        type: string
        nullable: true
        comment: EIA area/region code (may be state abbreviation or PADD code)
      - <<: *state_abbr_column
      - name: fuel_type
        type: string
        nullable: false
        comment: Fuel type ('crude_oil' or 'natural_gas')
      - name: process_code
        type: string
        nullable: true
        comment: EIA process code identifying the production activity
      - name: process_name
        type: string
        nullable: true
        comment: Process description
      - name: production_volume
        type: double
        nullable: true
        comment: Production volume in units specified by production_unit
      - name: production_unit
        type: string
        nullable: true
        comment: Unit of measure (e.g., 'Thousand Barrels', 'Million Cubic Feet')
      - name: series_id
        type: string
        nullable: true
        comment: >
          EIA API v2 series identifier. Composite key built by EIA from the endpoint's facets —
          for crude oil production it encodes area plus process (e.g. the state's crude oil
          production series); the human-readable label is in series_description on the same row,
