      - name: date_last_confirmed
        type: date
        nullable: true
        comment: Date AFDC last confirmed this record
      - name: expected_date
        type: date
        nullable: true
        comment: Expected opening date, for planned stations
      - name: updated_at
        type: timestamp
        nullable: true
        comment: AFDC's last-updated timestamp for this record
      - name: ev_connector_types
        type: string
        nullable: true
        comment: Comma-separated connector types available (e.g. 'CHADEMO,J1772,J1772COMBO')
      - name: ev_dc_fast_num
        type: integer
        nullable: true
