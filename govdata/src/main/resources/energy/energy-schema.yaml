  - name: eia_crude_oil_production
    # 36 periods = 3 YEARS of monthly data. EIA-914 re-estimates the two prior months every month,
    # and the annual PSA (Aug) restates up to 10 prior years of oil production. EIA considers a
    # state final "prior to two calendar years back", so 2 years sat exactly on that boundary
    # with no margin; 3 covers it.
    # https://www.eia.gov/petroleum/production/pdf/eia914revisionpolicy.pdf
    lookbackPeriods: 36
    freshness:
      type: hash
    pattern: "type=eia_crude/year=*/month=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2006
      maxYear: 2026
      distinctYears: 21
      contiguous: true
      rowCount: 20640
      checkedAt: "2026-09-25T01:58:49Z"
    partitions: *standard_partitions_monthly
    comment: >
      EIA API v2 petroleum crude oil production by state and month. Source is the single
      endpoint petroleum/crd/crpdn; fuel_type values are 'Crude Oil' or 'ANS Crude Oil'
      (Alaska North Slope). For natural gas production data, see eia_natural_gas_production
      table (separate endpoint, different units). One row per EIA area + process + year-month.
      Cross-references geo.states via state_abbr.

    dimensions:
      type:
        - eia_crude
      year: *eia_fossil_years
      month: *eia_months

    columns:
      - name: production_year
        type: integer
        nullable: false
        comment: Calendar year of production
      - name: production_month
        type: integer
        nullable: false
        comment: Calendar month (1-12) of production
      - name: eia_area_code
        type: string
        nullable: true
        comment: EIA area/region code (may be state abbreviation or PADD code)
      - <<: *state_abbr_column
      - name: fuel_type
        type: string
        nullable: false
        comment: Fuel type — 'Crude Oil' or 'ANS Crude Oil' (Alaska North Slope). For natural gas, see eia_natural_gas_production.
      - name: process_code
        type: string
        nullable: true
        comment: EIA process code identifying the production activity
      - name: process_name
        type: string
        nullable: true
        comment: Process description
      - name: production_volume
        type: double
        nullable: true
        comment: Production volume in units specified by production_unit
      - name: production_unit
        type: string
        nullable: true
        comment: >
          Unit of measure — one of exactly two short codes: MBBL (thousand barrels) or
          MBBL/D (thousand barrels per day). The spelled-out forms in series_description
          ("Thousand Barrels", "Thousand Barrels per Day") never appear here and are not
          valid filter values (D-270) — filtering on the long form silently returns a
          near-empty result instead of an error.
      - name: series_id
        type: string
        nullable: true
        comment: >
          EIA API v2 series identifier. Composite key built by EIA from the endpoint's facets:
          area plus process (e.g. the state's crude oil field production series). The
          human-readable label is in series_description on the same row, and the decoded parts
          are in eia_area_code, state_abbr, and process_code. This table is long-format: one row
          per (series_id, year, month). Enumerate with SELECT DISTINCT series_id, series_description.
      - name: series_description
        type: string
        nullable: true
        comment: Full series description

    backfill_period: annual

    source:
      type: http
      url: "https://api.eia.gov/v2/petroleum/crd/crpdn/data?frequency=monthly&start={period_start}&end={period_end}&data[]=value"
