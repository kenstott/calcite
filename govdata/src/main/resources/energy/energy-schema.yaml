  # ---------------------------------------------------------------------------
  # EIA CAPACITY CHANGES - EIA-860M Monthly Generator Capacity Changes
  # ---------------------------------------------------------------------------
  - name: eia_capacity_changes
    # The archived december_generator{year}.xlsx is an immutable point-in-time snapshot --
    # EIA-860M corrections land in SUBSEQUENT months' files, a different URL, never by editing
    # this one. 1 exists only so the ~Feb publication of the prior December file is not locked
    # out by the period-completion gate. https://www.eia.gov/electricity/data/eia860m/
    lookbackPeriods: 1
    freshness:
      type: hash
    pattern: "type=eia_capacity/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2015
      maxYear: 2025
      distinctYears: 11
      contiguous: true
      rowCount: 345484
      checkedAt: "2026-09-25T01:58:48Z"
    partitions: *standard_partitions
    comment: >
      EIA Form 860M generator inventory, one annual snapshot per snapshot_year.
      Captures planned additions and planned retirements with capacity (nameplate, summer,
      winter, energy storage). Transformer parses the XLSX directly.
      Cross-references geo.states via state_abbr; joins eia_power_plants via plant_id.
      GRAIN — READ BEFORE AGGREGATING: this is a CUMULATIVE SNAPSHOT, not a change log.
      One row per generator per snapshot_year, so a single addition or retirement event
      REAPPEARS in every later snapshot it survives into — measured live, additions with
      change_year 2020-2024 appear in 1 to 6 distinct snapshot_years each. The row count
      therefore grows every year by construction (25,986 in 2016 to 38,359 in 2025) without
      any new events.
      SUMming nameplate_capacity_mw across snapshot_year multiplies every event by the number
      of snapshots it appears in: for change_type='Addition' and change_year 2020-2024 that
      is 746,721 MW across 18,688 rows, against 5,236 real generator-years — roughly 3.6x
      EIA's own published additions of ~40 GW/yr.
      To total real capacity change, first reduce to one row per (plant_id, generator_id,
      change_year) — e.g. pick the newest snapshot_year per generator with QUALIFY
      ROW_NUMBER() OVER (PARTITION BY plant_id, generator_id, change_year
      ORDER BY snapshot_year DESC) = 1 — and only then aggregate.
      snapshot_month is NULL on every row: only the December file is ingested, so the column
      carries no information and must not be used to disambiguate snapshots.

    dimensions:
      type:
        - eia_capacity
      year: *eia_capacity_years

    columns:
      - name: plant_id
        type: integer
        nullable: false
        comment: EIA plant identifier
      - name: generator_id
        type: string
        nullable: false
        comment: Generator identifier within the plant
      - name: snapshot_year
        type: integer
        nullable: false
        comment: Year of the monthly snapshot file
      - name: snapshot_month
        type: integer
        nullable: false
        comment: Month of the monthly snapshot file (12 for December)
      - name: change_type
        type: string
        nullable: false
        comment: Type of capacity change (e.g., 'Planned Addition', 'Planned Retirement', 'New Unit')
      - name: change_year
        type: integer
        nullable: true
        comment: Year the change is expected to take effect
      - name: change_month
        type: integer
        nullable: true
        comment: Month the change is expected to take effect
      - name: plant_name
        type: string
        nullable: true
        comment: Plant name
      - name: entity_id
        type: integer
        nullable: true
        comment: EIA entity (utility/owner) identifier
      - name: entity_name
        type: string
        nullable: true
        comment: Entity name
      - <<: *state_abbr_column
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: balancing_authority_code
        type: string
        nullable: true
        comment: Balancing authority code
      - name: sector
        type: string
        nullable: true
        comment: Sector description
      - name: technology
        type: string
        nullable: true
        comment: Generation technology
      - name: energy_source_code
        type: string
        nullable: true
        comment: Primary energy source code
      - name: prime_mover_code
        type: string
        nullable: true
        comment: Prime mover code
      - name: nameplate_capacity_mw
        type: double
        nullable: true
        comment: Nameplate capacity in MW
      - name: net_summer_capacity_mw
        type: double
        nullable: true
        comment: Net summer capacity in MW
      - name: net_winter_capacity_mw
        type: double
        nullable: true
        comment: Net winter capacity in MW
      - name: nameplate_energy_capacity_mwh
        type: double
        nullable: true
        comment: Nameplate energy capacity in MWh (for storage units)

    source:
      type: http
      url: "https://www.eia.gov/electricity/data/eia860m/archive/xls/december_generator{effective_year}.xlsx"
      method: GET
      parallel: 1   # bulk-XLSX: rebuilds a POI workbook per fetch — keep sequential (see eia_power_plants)
      response:
        format: TEXT
      rawCache: *raw_cache_enabled

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.energy.Eia860MCapacityChangesTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=eia_capacity/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        <<: *iceberg_common
        tableName: eia_capacity_changes
        runMaintenance: true
        snapshotRetentionDays: 7
        batchPartitionColumns: [year]
        incrementalKeys: [year]

  # ---------------------------------------------------------------------------
  # PJM BASE RESIDUAL AUCTION (BRA) CAPACITY CLEARING PRICES
  # ---------------------------------------------------------------------------
  - name: pjm_capacity_auction_prices
    freshness:
      type: hash
    pattern: "type=pjm_bra/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      PJM Base Residual Auction (BRA) capacity clearing prices by LDA (Locational
      Deliverability Area / pricing zone) and delivery year, sourced from PJM's public
      per-delivery-year auction-results workbook (pjm.com/markets-and-operations/rpm.aspx
      — no PJM Data Miner API key required). One row per LDA per delivery year: 'RTO' is
      the system-wide unconstrained zone; other LDAs (e.g. 'EMAAC', 'COMED', 'DPLSOUTH')
      layer a locational_price_adder on top when that zone is import-constrained. This is
      the actual capacity-procurement price mechanism behind PJM-region wholesale
      capacity costs — e.g. the RTO resource_clearing_price rose from $28.92/MW-day
      (2024/2025) to $269.92 (2025/2026) to $329.17 (2026/2027), a documented driver of
      PJM-region retail cost pressure. Currently covers only the Base Residual Auction
      (see auction_type); PJM's Incremental Auctions (1st/2nd/3rd IA) and other ISOs/RTOs
      (MISO, ERCOT, CAISO, NYISO, SPP) publish similar structured auction results and are
      a natural follow-on, not yet ingested (kenstott/govdata-ops#330).

    dimensions:
      type:
        - pjm_bra
      year: *pjm_bra_years

    columns:
      - name: delivery_year
        type: integer
        nullable: false
        comment: >
          Delivery year — the start of the one-year capacity delivery period (e.g. 2024
          for the "2024/2025" delivery year).
      - name: lda
        type: string
        nullable: false
        comment: >
          Locational Deliverability Area / pricing zone code (e.g. 'RTO' for the
          system-wide unconstrained zone, 'EMAAC', 'COMED', 'DPLSOUTH'). The set of LDAs
          reported varies by delivery year as PJM adds, splits, or retires constrained
          areas — do not assume a fixed zone list across years.
      - name: system_marginal_price
        type: double
        nullable: true
        comment: >
          System Marginal Price — the clearing price for Capacity Performance Resources
          in the unconstrained area of RTO, in $/MW-day. Identical across every LDA row
          for a given delivery_year; the zone-specific price is resource_clearing_price.
      - name: locational_price_adder
        type: double
        nullable: true
        comment: >
          Locational Price Adder for this LDA relative to its immediate higher-level LDA,
          in $/MW-day. Zero for an unconstrained zone.
      - name: resource_clearing_price
        type: double
        nullable: true
        comment: >
          Resource Clearing Price = system_marginal_price + locational_price_adder, in
          $/MW-day — the actual capacity price paid to cleared resources in this LDA.
      - name: auction_type
        type: string
        nullable: false
        comment: >
          Auction type; currently always 'Base Residual Auction' (BRA) — PJM's primary,
          delivery-year-ahead capacity auction. Constant until Incremental Auctions are
          added (see table comment), so excluded from the all-same-value DQ check.

    source:
      type: http
      url: "https://www.pjm.com/-/media/DotCom/markets-ops/rpm/rpm-auction-info/{effective_year}-{effective_year}/{effective_year}-{effective_year}-base-residual-auction-results.xlsx"
      method: GET
      # Bulk-XLSX pipeline: PjmCapacityAuctionTransformer rebuilds the real two-year-folder
      # URL itself and re-downloads (the URL above is a throwaway fetch the framework
      # issues before the transformer runs — see eia_power_plants for the same pattern).
      parallel: 1
      response:
        format: TEXT
      rawCache: *raw_cache_enabled

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.energy.PjmCapacityAuctionTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=pjm_bra/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        <<: *iceberg_common
        tableName: pjm_capacity_auction_prices
        runMaintenance: true
        snapshotRetentionDays: 7
        batchPartitionColumns: [year]
        incrementalKeys: [year]

