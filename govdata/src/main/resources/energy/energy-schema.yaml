  # ---------------------------------------------------------------------------
  # EIA REFINERY OPERATIONS - Monthly refinery input and capacity data
  # ---------------------------------------------------------------------------
  - name: eia_refinery_operations
    # 24 periods = 2 YEARS of monthly data. Petroleum Supply Monthly: revisions affect the current
    # year and up to two prior years, finalized by the PSA each August; PSA values reflect all PSM
    # resubmissions. https://www.eia.gov/petroleum/supply/monthly/pdf/psmnotes.pdf
    lookbackPeriods: 24
    freshness:
      type: hash
    pattern: "type=eia_refinery/year=*/month=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2006
      maxYear: 2026
      distinctYears: 20
      contiguous: false
      years: [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2026]
      rowCount: 303065
      checkedAt: "2026-09-05T14:46:48Z"
    partitions: *standard_partitions_monthly
    comment: >
      EIA API v2 petroleum refinery process data in tall format. One row per EIA area +
      series (process_code) + year-month. Key series include crude inputs to distillation
      (CRDISS), operable distillation capacity (CAPACITY), and utilization rate (UTIL).
      Additional series cover catalytic cracking, coking, reforming, and other secondary
      processes. Pivoting into wide format is done via the refinery_utilization_summary view.
      One row per area + series_id + report year-month.

    dimensions:
      type:
        - eia_refinery
      year: *eia_refinery_years
      month: *eia_months

    columns:
      - name: report_year
        type: integer
        nullable: false
        comment: Calendar year
      - name: report_month
        type: integer
        nullable: false
        comment: Calendar month (1-12)
      - name: eia_area_code
        type: string
        nullable: true
        comment: EIA area code (e.g., PADD code or 'USA')
      - name: padd
        type: string
        nullable: true
        comment: PADD district description or 'National'
      - name: series_id
        type: string
        nullable: true
        comment: >
          EIA API v2 series identifier. Encodes area plus refinery process; the process is also
          available decoded in process_code with its label in metric_name. Key process codes
          include CRDISS crude inputs to distillation and operable distillation capacity measures.
          This table is tall format: one row per (eia_area_code, series_id, year-month), so ALWAYS
          filter on series_id or process_code — units differ per process (see the units column) and
          national totals coexist with PADD districts. Enumerate with
          SELECT DISTINCT series_id, process_code, metric_name.
      - name: process_code
        type: string
        nullable: true
        comment: EIA refinery process code
      - name: metric_name
        type: string
        nullable: true
        comment: Metric description (e.g., 'Crude Oil Input to Atmospheric Crude Oil Distillation Units')
      - name: units
        type: string
        nullable: true
        comment: Units of measure (e.g., 'Thousand Barrels per Day')
      - name: value
        type: double
        nullable: true
        comment: Metric value

    backfill_period: annual

    source:
      type: http
      url: "https://api.eia.gov/v2/petroleum/pnp/refp/data?frequency=monthly&start={period_start}&end={period_end}&data[]=value"
      method: GET
      parameters:
        api_key: "${ENERGY_EIA_API_KEY:}"
        length: "5000"
      response:
        format: json
        dataPath: "$.response.data"
        pagination:
          type: OFFSET
          totalPath: "$.response.total"
          pageSize: 5000
          limitParam: "length"
          offsetParam: "offset"
      rateLimit: *eia_rate_limit
      rawCache: *raw_cache_enabled

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.energy.EiaRefineryOperationsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=eia_refinery/year=*/month=*/"
      partition:
        columns: [type, year, month]
        valueSource:
          year: effective_year
          month: report_month
      iceberg:
        <<: *iceberg_common
        tableName: eia_refinery_operations
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7
        batchPartitionColumns: [year, month]
        incrementalKeys: [year, month]

  # ---------------------------------------------------------------------------
  # MSHA COAL MINES - MSHA MinesProdYearly coal production data
  # ---------------------------------------------------------------------------
  - name: eia_coal_mines
    # MSHA MinesProdYearly (Form 7000-2 quarterly filings rolled to calendar year) -- NOT an EIA
    # source, despite the table name. Republished weekly as a complete file replacement. A vintage
    # diff of the retained raw cache (2026-06-12 vs 2026-08-28) shows the in-progress year churning
    # heavily and the prior year still absorbing late/amended filings (7 keys edited), with every
    # earlier year back to 2009 byte-identical -- so the current + prior data year is the whole
    # revision surface. MSHA publishes no finality policy, so this rests on that measurement.
    # https://arlweb.msha.gov/opengovernmentdata/ogimsha.asp
    lookbackPeriods: 2
      # Gates on the resource's own ETag, which the host serves on a HEAD (verified live). A hash
      # gate has to download the whole body to compute a digest of it; this is one HEAD.
    freshness:
      type: etag
    pattern: "type=msha_coal/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2007
      maxYear: 2025
      distinctYears: 19
      contiguous: true
      rowCount: 42474
      checkedAt: "2026-09-05T14:46:49Z"
    partitions: *standard_partitions
    comment: >
      MSHA MinesProdYearly coal mine production data (pipe-delimited CSV ZIP). The
      transformer downloads MinesProdYearly.zip and Mines.zip, performs an inner join on
      mine_id, filters to coal mines (COAL_METAL_IND = 'C'), and returns one row per
      mine + subunit + year. Includes mine demographics, operator/controller identity,
      geographic location (lat/lon, county, state), mine type and status, production
      volume in short tons, employee count, annual hours, labor productivity, and
      average seam height (underground mines). The transformer filters by the requested
