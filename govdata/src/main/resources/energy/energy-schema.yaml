  # ---------------------------------------------------------------------------
  # EIA POWER PLANTS - EIA-860 Annual Electric Generator Report
  # ---------------------------------------------------------------------------
  - name: eia_power_plants
    # EIA-860 goes early-release (June) then final (Sept) in year+1. With dataLag: 3 the fetch is
    # already post-final, so the second period exists to catch a late-posted or corrected archive,
    # not a revision. https://www.eia.gov/electricity/data/eia860/
    lookbackPeriods: 2
    freshness:
      type: hash
    pattern: "type=eia_plant/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2012
      maxYear: 2023
      distinctYears: 12
      contiguous: true
      rowCount: 314042
      checkedAt: "2026-09-25T01:58:47Z"
    partitions: *standard_partitions
    comment: >
      EIA Form 860 annual electric generator inventory. One row per generator (plant +
      generator ID + year), sourced from BOTH the archive's "Operable" sheet and its
      "Retired and Canceled" sheet (2011 onward; earlier archives carry only an
      operable-equivalent). A generator therefore has a row in a given report_year's
      archive whether it was running that year or had already stopped — filter
      operating_status IN ('RE','CN') to isolate the latter, and read retirement_year for
      when it actually happened, as distinct from planned_retirement_year (a forecast made
      while still operating). Includes plant and utility identifiers, geographic location
      (state, county, city, lat/lon), NERC region, balancing authority, technology, prime
      mover, energy sources, capacity (nameplate, summer, winter, minimum load), ownership
      type, and energy storage flag. Transformer downloads and parses the annual ZIP
      archive from EIA. Cross-references geo.states via state_abbr; joins
      eia_utility_annual via utility_id.

    dimensions:
      type:
        - eia_plant
      year: *eia_plant_years

    columns:
      - name: plant_id
        type: integer
        nullable: false
        comment: EIA plant identifier
      - name: generator_id
        type: string
        nullable: false
        comment: Generator identifier within the plant
      - name: report_year
        type: integer
        nullable: false
        comment: Report year
      - name: plant_name
        type: string
        nullable: true
        comment: Plant name
      - name: utility_id
        type: integer
        nullable: true
        comment: EIA utility identifier (links to eia_utility_annual)
      - name: utility_name
        type: string
        nullable: true
        comment: Utility company name
      - <<: *state_abbr_column
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: county_fips
        type: string
        nullable: true
        comment: 5-digit county FIPS code
      - name: city
        type: string
        nullable: true
        comment: City or town name
      - name: latitude
        type: double
        nullable: true
        comment: Plant latitude
      - name: longitude
        type: double
        nullable: true
        comment: Plant longitude
      - name: nerc_region
        type: string
        nullable: true
        comment: NERC reliability region
      - name: balancing_authority_code
        type: string
        nullable: true
        comment: Balancing authority code
      - name: balancing_authority_name
        type: string
        nullable: true
        comment: Balancing authority name
      - name: primary_purpose_naics
        type: integer
        nullable: true
        comment: Primary purpose NAICS code
      - name: regulatory_status
        type: string
        nullable: true
        comment: Regulatory status (e.g., Regulated, Nonutility)
      - name: sector_code
        type: integer
        nullable: true
        comment: EIA sector code
      - name: sector
        type: string
        nullable: true
        comment: Sector description
      - name: technology
        type: string
        nullable: true
        comment: Generation technology (e.g., 'Conventional Steam Coal', 'Onshore Wind Turbine')
      - name: prime_mover
        type: string
        nullable: true
        comment: Prime mover code (e.g., 'ST', 'GT', 'IC', 'WT', 'PV')
      - name: energy_source_1
        type: string
        nullable: true
        comment: Primary energy source code
      - name: energy_source_2
        type: string
        nullable: true
        comment: Secondary energy source code
      - name: energy_source_3
        type: string
        nullable: true
        comment: Tertiary energy source code
      - name: nameplate_capacity_mw
        type: double
        nullable: true
        comment: Nameplate (installed) capacity in MW
      - name: net_summer_capacity_mw
        type: double
        nullable: true
        comment: Net summer capacity in MW
      - name: net_winter_capacity_mw
        type: double
        nullable: true
        comment: Net winter capacity in MW
      - name: minimum_load_mw
        type: double
        nullable: true
        comment: Minimum load in MW
      - name: ownership_code
        type: string
        nullable: true
        comment: Ownership type code
      - name: operating_status
        type: string
        nullable: true
        comment: >
          Operating status code — OP (operating), SB (standby/backup), OA (out of service,
          expected back), OS (out of service, not expected back), P/L/T/U/V (various
          under-construction / permitting stages), RE (retired) or CN (cancelled or
          postponed). RE and CN only appear on a row sourced from the "Retired and
          Canceled" sheet (see retirement_year) — a generator that stopped operating
          simply has no row on the "Operable" sheet in that year's archive rather than
          switching this code, so its last "Operable" row's status stays whatever it was
          the year before it disappeared.
      - name: operating_month
        type: integer
        nullable: true
        comment: Month generator began commercial operation
      - name: operating_year
        type: integer
        nullable: true
        comment: Year generator began commercial operation
      - name: planned_retirement_month
        type: integer
        nullable: true
        comment: >
          Planned retirement month, as reported by a still-operating generator on the
          "Operable" sheet — a forecast, not an actual retirement. Once a generator has
          actually retired this is no longer populated for it; see retirement_month.
      - name: planned_retirement_year
        type: integer
        nullable: true
        comment: >
          Planned retirement year — see planned_retirement_month. Not populated once a
          generator has actually retired; see retirement_year.
      - name: retirement_month
        type: integer
        nullable: true
        comment: >
          Actual retirement month, from EIA-860's "Retired and Canceled" sheet — only
          populated on a row whose operating_status is RE or CN. NULL on every "Operable"
          sheet row, including one whose planned_retirement_year suggests retirement is
          coming: this field records that a generator DID retire, not that it is expected
          to.
      - name: retirement_year
        type: integer
        nullable: true
        comment: >
          Actual retirement year — see retirement_month. To find when a generator retired,
          filter operating_status IN ('RE','CN') and read this column, not
          planned_retirement_year.
      - name: energy_storage_flag
        type: boolean
        nullable: true
        comment: Whether generator includes energy storage capability

    source:
      type: http
      url: "https://www.eia.gov/electricity/data/eia860/archive/xls/eia860{effective_year}.zip"
      method: GET
      # Bulk-XLSX pipeline: the transformer rebuilds two full POI workbooks
      # (~24k-row sheets, ~10-20x file size in heap) per fetch. Pin to one fetch
      # at a time so concurrent year-batches can't multiply that footprint and OOM
      # (observed at the 3g historical default). caps below the global thread count.
      parallel: 1
      response:
        format: TEXT
      rawCache: *raw_cache_enabled

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.energy.Eia860PowerPlantsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=eia_plant/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        <<: *iceberg_common
        tableName: eia_power_plants
        runMaintenance: true
        snapshotRetentionDays: 7
        batchPartitionColumns: [year]
        incrementalKeys: [year]

  # ---------------------------------------------------------------------------
  # GAS PIPELINES — EIA interstate/intrastate natural gas pipeline network (static reference)
  # ---------------------------------------------------------------------------
  - name: gas_pipelines
    pattern: "type=gas_pipelines/*.parquet"
    partitions: *static_partitions
    comment: >
      U.S. natural gas transmission pipeline network — one row per pipeline segment
      (~32,900 segments nationwide), sourced from EIA and mirrored as a public ArcGIS
      FeatureServer under Esri's Federal_User_Community org (the layer's own listing:
      "checked monthly for updates"; EIA's own Energy Atlas hosting for this layer is
      not currently available — verified live, not the PA Department of Health's
      Pennsylvania-only re-clip of the same underlying EIA data found during initial
      research, which this table does NOT use). Confirmed nationwide via a spot-check
      of returned segments across Illinois, Minnesota, Arizona, Utah, Nevada, and
      Colorado — not just the Marcellus-region subset the PA mirror is limited to.
      geometry_wkt carries each segment's own WGS84 line geometry (LINESTRING or, for
      a small number of segments, MULTILINESTRING); length_m is EIA's own projected
      segment length in meters, not a WGS84-degree approximation. No county field is
      present at the source — join geometry_wkt against geo.counties (DuckDB
      ST_Intersects) for county-grain rollups, following the same spatial-join pattern
      as lands.county_federal_fee_land_share; see energy.county_gas_pipeline_presence
      for a pre-built rollup. pipeline_type is Interstate or Intrastate (EIA/PHMSA
      classification); status is "Operating" for every row in the live source despite
      the field's stated Active/Inactive/Abandoned vocabulary — a real constant, not a
      transform bug. A small fraction of segments (~0.2%, confirmed live) carry no
      geometry at all; geometry_wkt is null for those rather than the row being
      dropped, so segment_id stays a complete FID census.

    dimensions:
      type:
        - gas_pipelines

    columns:
      - name: segment_id
        type: integer
        nullable: false
        comment: EIA/Esri pipeline segment feature ID (FID)
      - name: pipeline_type
        type: string
        nullable: true
        comment: "Interstate or Intrastate (EIA/PHMSA classification)"
      - name: operator
        type: string
        nullable: true
        comment: Pipeline operating company
      - name: status
        type: string
        nullable: true
        comment: "Operational status — 'Operating' for every row in the live source"
      - name: length_m
        type: double
        nullable: true
        comment: Segment length in meters (EIA's own projected measurement, not WGS84-degree)
      - name: geometry_wkt
        type: string
        nullable: true
        comment: "Segment line geometry as WGS84 WKT (LINESTRING/MULTILINESTRING); null for the small fraction of source rows with no geometry"

    # The service returns both an ETag and a Last-Modified header (confirmed live); ETag probed
    # first per the project's own precedent (lands.national_forests). Content changes rarely
    # (monthly-checked source, largely static network), so this table is a non-period reference
    # table like national_forests/nps_units, re-fetched in full on each change rather than
    # incrementally.
    freshness:
      type: etag
    source:
      type: http
      url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/Natural_Gas_Interstate_and_Intrastate_Pipelines_1/FeatureServer/0/query?where=1%3D1&outFields=FID%2CTYPEPIPE%2COperator%2CStatus%2CShape__Length&returnGeometry=true&outSR=4326&orderByFields=FID&f=json"
      method: GET
      response:
        format: json
        # No countPath: the ArcGIS query response carries no total-count field. HttpSource
        # falls back to partial-page detection (page size < pageSize ends pagination), which is
        # exact here since the server never returns a short non-final page (maxRecordCount=2000,
        # confirmed live at ~33k total rows / ~17 pages).
        pagination:
          type: OFFSET
          pageSize: 2000
          limitParam: "resultRecordCount"
          offsetParam: "resultOffset"
      rateLimit:
        requestsPerSecond: 2.0
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.energy.GasPipelineTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=gas_pipelines/"
      partition:
        columns: [type]
      iceberg:
        <<: *iceberg_common
        tableName: gas_pipelines
        runMaintenance: true
        snapshotRetentionDays: 7
        # Must stay >= 2, matching lands.national_forests: a single-file static-reference
        # partition satisfies compactionMinFiles: 1 on every run, rewriting under a fresh
        # compacted_<uuid> name each pass — new snapshot, orphaned superseded file, and a
        # filename that defeats the R2 sync's size+modtime skip so the same rows re-upload
        # every time.
        compactionMinFiles: 5
        compactionTargetFileSizeBytes: 67108864
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # INTERCONNECTION_QUEUE - LBNL "Queued Up" project-level interconnection requests
  # ---------------------------------------------------------------------------
  - name: interconnection_queue
    pattern: "type=interconnection_queue/*.parquet"
    partitions: *static_partitions
    comment: >
      Grid interconnection queue: one row per generation or storage project that has
      requested connection to the U.S. transmission grid, from Lawrence Berkeley National
      Laboratory's "Queued Up" dataset (Rand et al., 2026 edition, requests from 2000
      through the end of 2025, CC BY 4.0), which LBNL compiles from the queue files of 7
      ISO/RTOs and 50 non-ISO balancing areas (~98% of installed U.S. generating capacity;
      Alaska and Hawaii not covered; transmission-connected generation and storage only, no
      load interconnection or distribution-connected projects). ~38,200 rows: ~8,500 active,
      ~4,800 operational, ~24,200 withdrawn, ~670 suspended (q_status). Answers "how much new
      generation or storage is waiting to connect in this county, and of what type" — the
      forward-looking supply-side half of siting questions; county_interconnection_queue is
      the per-county rollup. county_fips is the project's FIRST listed county only (the
      source states multi-county requests keep just the first); the ~1,770 rows
      (~5%) whose source FIPS is blank have a null county_fips, and 22 rows sit outside the
      U.S. (state MX/ON/MB). mw_1/mw_2/mw_3 are
      the rated MW of resource type_1/type_2/type_3; a hybrid such as Solar+Battery has both
      mw_1 and mw_2, so total project MW is their sum, and LBNL's own published totals
      additionally include imputed storage MW that this file omits (active requests sum to
      ~1,865 GW here against ~2,061 GW in the report; the 8,513 active rows here are ~3% more
      than the report's 8,244, whose basis the file does not identify). 16 rows carry a
      negative mw_1 (-4 to -75 MW) in LBNL's own workbook and are kept as published, so
      SUM(mw) over a set that includes them is very slightly understated. q_id is unique only
      together with entity, and not even then for 135 pairs, so source_row (the row's
      position in the source sheet) is the only row identifier; a few q_id values were
      converted to dates or numbers by Excel in the source. Dates: q_date request entered
      queue, prop_date proposed online, on_date became operational, wd_date withdrawn,
      ia_date interconnection agreement signed. as_of_year is the edition's cut-off year.
      county holds the name as the queue wrote it and occasionally a town rather than the
      county (40 of 2,634 FIPS have more than one spelling); county_fips is authoritative.
      Snapshot table: the source is replaced wholesale each edition, not appended.
      SOURCE DURABILITY: emp.lbl.gov and eta.lbl.gov sit behind a Cloudflare managed
      challenge that no non-browser client passes (verified 2026-09-25: HTTP 403,
      cf-mitigated: challenge), so the workbook is read from the copy redistributed under
      CC BY 4.0 in the Zenodo deposit 10.5281/zenodo.22287832 (files are immutable per
      record). That deposit is a third party's replication package, pinned to the 2026
      edition; a new Queued Up edition needs source.url pointed at a newer deposit.
      Joins to geo.counties via county_fips and to geo.states via state (= state_abbr).

    dimensions:
      type:
        - interconnection_queue

    columns:
      - name: source_row
        type: integer
        nullable: false
        comment: Row number of the project in the source workbook's queue sheet (row identifier; q_id is not unique)
      - name: q_id
        type: string
        nullable: true
        comment: Queue position/ID assigned by the transmission provider; unique only with entity, and 'not assigned' on some rows
      - name: entity
        type: string
        nullable: true
        comment: Transmission provider that runs the queue (an ISO/RTO or a utility)
      - name: q_status
        type: string
        nullable: true
        comment: "Queue status: active, operational, withdrawn, suspended (or unknown)"
      - name: q_date
        type: date
        nullable: true
        comment: Date the request entered the queue
      - name: prop_date
        type: date
        nullable: true
        comment: Proposed online date from the application (revised during the process)
      - name: on_date
        type: date
        nullable: true
        comment: Date the project became operational, where it did
      - name: wd_date
        type: date
        nullable: true
        comment: Date the request was withdrawn from the queue, where it was
      - name: ia_date
        type: date
        nullable: true
        comment: Date the interconnection agreement was signed, where one was
      - name: ia_phase_raw
        type: string
        nullable: true
        comment: Study phase exactly as the transmission provider reports it (not standardized)
      - name: ia_phase_clean
        type: string
        nullable: true
        comment: "Standardized study phase (IA Executed, System Impact Study, Feasibility Study, Facility Study, Cluster Study, IA Pending, Construction, Not Started, Suspended, Withdrawn, In Progress); 'IA Executed' is imputed for operational projects"
      - name: county
        type: string
        nullable: true
        comment: County name of the project's first listed county
      - name: state
        type: string
        nullable: true
        comment: 2-letter state abbreviation (FK to geo.states.state_abbr); a few rows are MX/ON/MB, outside the U.S.
      - name: county_fips
        type: string
        nullable: true
        comment: 5-digit county FIPS of the first listed county (FK to geo.counties.county_fips); null where the queue lists no county or the project is outside the U.S.
      - name: poi_name
        type: string
        nullable: true
        comment: Point of interconnection name — a substation or transmission-line tap
      - name: region
        type: string
        nullable: true
        comment: "Standardized region: CAISO, ERCOT, ISO-NE, MISO, NYISO, PJM, SPP, or West / Southeast (non-ISO)"
      - name: project_name
        type: string
        nullable: true
        comment: Project name (absent for most requests)
      - name: utility
        type: string
        nullable: true
        comment: Utility name (same as entity in non-ISO/RTO balancing areas)
      - name: developer
        type: string
        nullable: true
        comment: Project developer, not standardized (absent for most requests)
      - name: cluster
        type: string
        nullable: true
        comment: Queue cluster the request belongs to, where the queue uses clusters
      - name: service
        type: string
        nullable: true
        comment: "Interconnection service type: NRIS, ERIS, NRIS/ERIS, or Other"
      - name: project_type
        type: string
        nullable: true
        comment: "Request type: Generation, Surplus, Upgrade, or Replacement"
      - name: type_1
        type: string
        nullable: true
        comment: "Primary resource type (Solar, Wind, Battery, Gas, Hydro, Coal, Offshore Wind, Nuclear, Geothermal, Diesel, Oil, Hydrogen, Other Storage, Other)"
      - name: type_2
        type: string
        nullable: true
        comment: Second resource type; populated only for hybrid/co-located projects
      - name: type_3
        type: string
        nullable: true
        comment: Third resource type; populated only for hybrid/co-located projects
      - name: type_clean
        type: string
        nullable: true
        comment: Standardized combined resource type, e.g. Solar, Battery, Solar+Battery
      - name: mw_1
        type: double
        nullable: true
        comment: Rated capacity in MW of type_1
      - name: mw_2
        type: double
        nullable: true
        comment: Rated capacity in MW of type_2 (hybrid projects only; LBNL's imputed storage MW omitted)
      - name: mw_3
        type: double
        nullable: true
        comment: Rated capacity in MW of type_3 (hybrid projects only)
      - name: q_year
        type: integer
        nullable: true
        comment: Year the request entered the queue (derived from q_date; null where q_date is missing)
      - name: prop_year
        type: integer
        nullable: true
        comment: Proposed online year (derived from prop_date)
      - name: as_of_year
        type: integer
        nullable: false
