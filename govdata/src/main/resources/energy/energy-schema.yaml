constraints:

  eia_electricity_generation:
    # state_abbr is null for every division and for the national row, so it alone can't
    # distinguish rows within either group (verified live: 12 real, distinct census divisions —
    # "Pacific", "New England", "Puerto Rico", etc. — collapsed to one key without this).
    # state_description carries the real per-division/national label and is always populated.
    primaryKey: [geo_level, state_abbr, state_description, energy_source_code, sector_code, generation_year, generation_month]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_electricity_prices:
    primaryKey: [state_abbr, sector_code, price_year, price_month]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_utility_annual:
    primaryKey: [utility_id, report_year]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_service_territory:
    primaryKey: [utility_id, report_year, state_abbr, county_name]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [utility_id]
        targetTable: eia_utility_annual
        targetColumns: [utility_id]

  eia_power_plants:
    primaryKey: [plant_id, generator_id, report_year]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]
      - columns: [utility_id]
        targetTable: eia_utility_annual
        targetColumns: [utility_id]

  gas_pipelines:
    primaryKey: [segment_id]

  eia_capacity_changes:
    primaryKey: [plant_id, generator_id, snapshot_year, snapshot_month, change_type]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [plant_id]
        targetTable: eia_power_plants
        targetColumns: [plant_id]

  eia_crude_oil_production:
    primaryKey: [eia_area_code, fuel_type, process_code, production_year, production_month]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_natural_gas_production:
    primaryKey: [eia_area_code, process_code, production_year, production_month]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_state_energy_consumption:
    primaryKey: [state_abbr, msn, consumption_year]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_natural_gas_storage:
    primaryKey: [eia_region_code, storage_type_code, report_date]

  eia_petroleum_stocks:
    primaryKey: [eia_area_code, product_code, process_code, report_date]

  eia_natural_gas_price:
    primaryKey: [series_id, report_date]

  eia_crude_oil_imports:
    primaryKey: [importer_name, origin_country_code, refinery_site_id, rpt_period]
    foreignKeys:
      - columns: [refinery_state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_refinery_operations:
    primaryKey: [eia_area_code, series_id, report_year, report_month]

  eia_coal_mines:
    primaryKey: [mine_id, subunit_code, report_year]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [county_fips]
        targetSchema: geo
        targetTable: counties
        targetColumns: [county_fips]

  ev_charging_stations:
    primaryKey: [id]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: geo
        targetTable: state_ref
        targetColumns: [state_abbr]

  eia_drilling_activity:
    primaryKey: [series_id, period]

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: county_gas_pipeline_presence
    comment: >
      Per-county natural gas pipeline presence, spatially joining gas_pipelines'
      segment-level line geometry (geometry_wkt) against geo.counties' own boundary
      geometry (its `geometry` column, latest TIGER vintage year) with DuckDB spatial
      (`&&` bounding-box prefilter, then ST_Intersects/ST_Intersection/ST_Length over
      WGS84 WKT — both sources use SRID 4326, no reprojection needed), following the
      same pattern as lands.county_federal_fee_land_share. Unlike that view, no
      per-row state filter is applied before the spatial predicate: gas_pipelines
      carries no state column to prefilter on, and the `&&` bounding-box operator
      (evaluated before the more expensive ST_Intersects) keeps the ~3,144 x ~32,900
      cross product tractable without one. pipeline_length_miles is not a raw
      degree-based length (DuckDB ST_Length has no CRS awareness, so a WGS84-degree
      length is not a distance) — instead, for each intersecting segment, the fraction
      of the segment's own line length that falls within the county
      (ST_Length(ST_Intersection(...)) / ST_Length(full segment), both in the same
      degree units, so the CRS-unaware-ness cancels out in the ratio) is applied to
      that segment's real EIA-published length_m (meters, projected, not
      degree-based) before converting to miles. A segment crossing multiple counties
      is prorated across each and sums back to (approximately) its own total length
      nationally, rather than counting its full length in every county it touches.
      pipeline_segment_count / interstate_segment_count / intrastate_segment_count
      count distinct segment_id (a segment that re-enters the same county's boundary
      more than once, e.g. along a winding line, is still counted once). Both input
      geometries are simplified/generalized (TIGER counties to their own Census
      generalization; pipeline segments are EIA/Esri's own digitized routes, not
      survey-grade), so treat pipeline_length_miles as a close estimate rather than a
      pipeline-operator's as-built figure — consistent with
      county_federal_fee_land_share's own accuracy caveat. LEFT JOIN so every county
      appears, including a 0 count/length when no pipeline segment intersects it.
    sql: >
      WITH latest_counties AS (
        SELECT
          c.county_fips,
          c.state_fips,
          c.county_name,
          ST_GeomFromText(c.geometry) AS geom
        FROM "geo"."counties" c
        WHERE c.year = (SELECT MAX(year) FROM "geo"."counties")
          AND c.geometry IS NOT NULL
      ),
      pipeline_geom AS (
        SELECT
          segment_id,
          pipeline_type,
          length_m,
          ST_GeomFromText(geometry_wkt) AS geom
        FROM gas_pipelines
        WHERE geometry_wkt IS NOT NULL
      ),
      matches AS (
        SELECT
          c.county_fips,
          c.state_fips,
          c.county_name,
          p.segment_id,
          p.pipeline_type,
          p.length_m,
          ST_Length(p.geom)                                  AS full_length_deg,
          ST_Length(ST_Intersection(c.geom, p.geom))          AS overlap_length_deg
        FROM latest_counties c
        LEFT JOIN pipeline_geom p
          ON c.geom && p.geom
         AND ST_Intersects(c.geom, p.geom)
      )
      SELECT
        county_fips,
        state_fips,
        county_name,
        COUNT(DISTINCT segment_id)                            AS pipeline_segment_count,
        COUNT(DISTINCT CASE WHEN pipeline_type = 'Interstate' THEN segment_id END)
                                                                AS interstate_segment_count,
        COUNT(DISTINCT CASE WHEN pipeline_type = 'Intrastate' THEN segment_id END)
                                                                AS intrastate_segment_count,
        ROUND(
          COALESCE(SUM(
            CASE WHEN full_length_deg > 0
              THEN length_m * LEAST(overlap_length_deg / full_length_deg, 1.0)
              ELSE 0
            END
          ), 0) / 1609.344,
          2
        )                                                      AS pipeline_length_miles
      FROM matches
      GROUP BY county_fips, state_fips, county_name

  - name: county_interconnection_queue
    comment: >
      Per-county rollup of interconnection_queue: how many generation/storage projects, and how
      many MW, are waiting to connect (active), have connected (operational), or dropped out
      (withdrawn) in each county, with the active MW split by resource family. Counties with
      no queue project do not appear (an absent county means no request in the LBNL sample,
      not a measured zero). Capacity is mw_1 + mw_2 + mw_3 per project, so a hybrid's storage
      component is counted once under its own resource type; upgrade/replacement/surplus
      requests are included as the source lists them (project_type is not filtered). Counts
      each project under its FIRST listed county only, matching interconnection_queue, and
      omits rows with no county_fips. county_name is the most frequent county name among a
      FIPS's rows (the source's name field occasionally holds a town instead — 40 of 2,634
      counties have more than one spelling; county_fips is authoritative, join geo.counties
      for canonical names). Active capacity omits LBNL's imputed storage MW (see
      interconnection_queue). as_of_year is the Queued Up edition's cut-off year.
    sql: >
      SELECT
        county_fips,
        MAX(state)                                                            AS state,
        MODE(county)                                                          AS county_name,
        MAX(as_of_year)                                                       AS as_of_year,
        COUNT(CASE WHEN q_status = 'active' THEN 1 END)                       AS active_projects,
        ROUND(SUM(CASE WHEN q_status = 'active'
          THEN COALESCE(mw_1, 0) + COALESCE(mw_2, 0) + COALESCE(mw_3, 0) END), 1)
                                                                              AS active_mw,
        ROUND(SUM(CASE WHEN q_status = 'active' AND type_1 = 'Solar'
          THEN mw_1 END), 1)                                                  AS active_solar_mw,
        ROUND(SUM(CASE WHEN q_status = 'active' AND type_1 IN ('Wind', 'Offshore Wind')
          THEN mw_1 END), 1)                                                  AS active_wind_mw,
        ROUND(SUM(CASE WHEN q_status = 'active' AND type_1 = 'Gas'
          THEN mw_1 END), 1)                                                  AS active_gas_mw,
        ROUND(SUM(CASE WHEN q_status = 'active' AND type_1 IN ('Battery', 'Other Storage')
          THEN mw_1 END)
          + SUM(CASE WHEN q_status = 'active' AND type_2 IN ('Battery', 'Other Storage')
          THEN mw_2 END), 1)                                                  AS active_storage_mw,
        COUNT(CASE WHEN q_status = 'operational' THEN 1 END)                  AS operational_projects,
        ROUND(SUM(CASE WHEN q_status = 'operational'
          THEN COALESCE(mw_1, 0) + COALESCE(mw_2, 0) + COALESCE(mw_3, 0) END), 1)
                                                                              AS operational_mw,
        COUNT(CASE WHEN q_status = 'withdrawn' THEN 1 END)                    AS withdrawn_projects
      FROM interconnection_queue
      WHERE county_fips IS NOT NULL
      GROUP BY county_fips

  - name: state_energy_mix
    comment: >
      Annual renewable and fossil fuel generation mix by state. Reads
      eia_electricity_generation's own EIA-published rollup rows (energy_source_code
      ALL/FOS/REN/NUC at geo_level='state', sector_code='99' — "All Sectors") rather
      than re-summing individual fuel codes, since several of EIA's own leaf-looking
      codes are themselves nested rollups (e.g. COL is BIT+SUB+LIG) and summing them
      alongside their children double-counts. other_gen is a residual
      (total - fossil - renewable - nuclear) so the four categories always sum exactly
      to the total, rather than relying on EIA's own OTH code, which does not capture
      every non-fossil/non-renewable/non-nuclear source (e.g. pumped storage).
      other_gen can be slightly negative: EIA's own FOS/REN/NUC rollups do not always sum
      exactly to ALL, so treat it as a small balancing term rather than a clean physical
      category. Measured live across production, 69 of 255 complete state-years carry a
      negative residual, and its magnitude never exceeds 1.2% of that state-year's total
      in either direction — renewable_pct and fossil_pct are unaffected.
      eia_electricity_generation is MONTHLY and publishes no annual sentinel row, so every
      measure here is the sum of that state-year's monthly rollup rows. months_covered
      reports how many distinct months went into the sum: a year in progress, or one the
      source has only partly published, totals fewer than 12 months and is not comparable
      to a full year — filter on months_covered = 12 for year-over-year work.
      One row per state + year. State name comes from eia_electricity_generation's own
      state_description column (no join to geo.states, and no FIPS code is included).
    sql: >
      SELECT
        state_abbr,
        MAX(state_description)                                            AS state_name,
        generation_year,
        COUNT(DISTINCT generation_month)                                  AS months_covered,
        SUM(CASE WHEN energy_source_code = 'ALL' THEN generation_thousand_mwh END)
                                                                            AS total_gen_thousand_mwh,
        SUM(CASE WHEN energy_source_code = 'REN' THEN generation_thousand_mwh END)
                                                                            AS renewable_gen_thousand_mwh,
        COALESCE(SUM(CASE WHEN energy_source_code = 'NUC' THEN generation_thousand_mwh END), 0)
                                                                            AS nuclear_gen_thousand_mwh,
        SUM(CASE WHEN energy_source_code = 'FOS' THEN generation_thousand_mwh END)
                                                                            AS fossil_gen_thousand_mwh,
        SUM(CASE WHEN energy_source_code = 'ALL' THEN generation_thousand_mwh END)
          - SUM(CASE WHEN energy_source_code = 'FOS' THEN generation_thousand_mwh END)
          - SUM(CASE WHEN energy_source_code = 'REN' THEN generation_thousand_mwh END)
          - COALESCE(SUM(CASE WHEN energy_source_code = 'NUC' THEN generation_thousand_mwh END), 0)
                                                                            AS other_gen_thousand_mwh,
        CASE
          WHEN SUM(CASE WHEN energy_source_code = 'ALL' THEN generation_thousand_mwh END) > 0
          THEN 100.0 * SUM(CASE WHEN energy_source_code = 'REN' THEN generation_thousand_mwh END)
               / SUM(CASE WHEN energy_source_code = 'ALL' THEN generation_thousand_mwh END)
          ELSE NULL
        END                                                                AS renewable_pct,
        CASE
          WHEN SUM(CASE WHEN energy_source_code = 'ALL' THEN generation_thousand_mwh END) > 0
          THEN 100.0 * SUM(CASE WHEN energy_source_code = 'FOS' THEN generation_thousand_mwh END)
               / SUM(CASE WHEN energy_source_code = 'ALL' THEN generation_thousand_mwh END)
          ELSE NULL
        END                                                                AS fossil_pct
      FROM eia_electricity_generation
      WHERE geo_level = 'state' AND sector_code = '99'
      GROUP BY state_abbr, generation_year

  - name: eia_fossil_fuel_production
    comment: >
      Combined view of crude oil and natural gas production by state and month.
      Unions eia_crude_oil_production (barrels) and eia_natural_gas_production
      (cubic feet). production_unit distinguishes measurement units — units are
      NOT convertible between fuels. Use fuel_type to filter or group. For
      single-fuel queries, prefer the base tables directly for better performance.
    sql: >
      SELECT
        production_year,
        production_month,
        eia_area_code,
        state_abbr,
        fuel_type,
        process_code,
        process_name,
        production_volume,
        production_unit,
        series_id,
        series_description
      FROM eia_crude_oil_production
      UNION ALL
      SELECT
        production_year,
        production_month,
        eia_area_code,
        state_abbr,
        'Natural Gas' AS fuel_type,
        process_code,
        process_name,
        production_volume,
        production_unit,
        series_id,
        series_description
      FROM eia_natural_gas_production

  - name: utility_scorecard
    comment: >
      Utility-level performance scorecard joining EIA-861 annual survey data with
      aggregated operating capacity from EIA-860 power plants. One row per utility +
      report year. Shows entity type, state, customer counts, total sales, total revenue,
      and sum of net summer capacity across all operating generators owned by the utility.
    sql: >
      SELECT
        u.utility_id,
        u.report_year,
        u.utility_name,
        u.entity_type,
        u.state_abbr,
        u.nerc_region,
        u.customers_total,
        u.sales_total_mwh,
        u.revenue_total_thousand,
        u.summer_peak_demand_mw,
        u.winter_peak_demand_mw,
        COALESCE(p.operating_capacity_mw, 0.0)                            AS operating_capacity_mw,
        COALESCE(p.generator_count, 0)                                     AS generator_count
      FROM eia_utility_annual u
      LEFT JOIN (
        SELECT
          utility_id,
          report_year,
          SUM(net_summer_capacity_mw)                                      AS operating_capacity_mw,
          COUNT(*)                                                          AS generator_count
        FROM eia_power_plants
        WHERE operating_status IN ('OP','SB','OS','RE')
        GROUP BY utility_id, report_year
      ) p ON u.utility_id = p.utility_id AND u.report_year = p.report_year

  # --------------------------------------------------------------------------
  # Inter-domain views (require geo schema)
  # --------------------------------------------------------------------------

  - name: eia_electricity_demand_by_county
    comment: >
      County-grain electricity demand apportioned from EIA-861 utility-level sales
      (eia_utility_annual) using the EIA-861 Service_Territory utility-to-county
      crosswalk (eia_service_territory). EIA-861 does not publish a per-county
      customer count or sales split within a utility's service territory, so each
      utility's customer counts, sales, and revenue are divided evenly across the N
      counties in its service-territory list for that year — a naive equal-split
      apportionment, not a per-county measurement. A utility with a single-county
      territory gets an exact (unsplit) figure for that county; a multi-county
      utility blurs real variation across its territory (a large city and a rural
      county served by the same utility get identical apportioned demand). Where
      more than one utility serves the same county, sum this view's rows for that
      county to get a total. county_fips is a best-effort join to the latest TIGER
      vintage of geo.counties (prefix match on EIA's un-suffixed county name against
      geo's 'X County'/'X Parish'/etc. name) and is null where no vintage match is
      found — treat it as an enrichment, not a guaranteed key.
      Requires the geo schema present in the same Calcite model.
    sql: >
      WITH latest_counties AS (
        SELECT county_fips, state_fips, county_name
        FROM geo.counties
        WHERE year = (SELECT MAX(year) FROM geo.counties)
      ),
      territory_counts AS (
        SELECT report_year, utility_id, COUNT(*) AS county_count
        FROM energy.eia_service_territory
        GROUP BY report_year, utility_id
      )
      SELECT
        st.report_year,
        st.utility_id,
        u.utility_name,
        st.state_abbr,
        st.county_name,
        gc.county_fips                                                      AS county_fips,
        tc.county_count,
        u.customers_total / CAST(tc.county_count AS DOUBLE)                 AS customers_total,
        u.sales_residential_mwh / tc.county_count                           AS sales_residential_mwh,
        u.sales_commercial_mwh / tc.county_count                            AS sales_commercial_mwh,
        u.sales_industrial_mwh / tc.county_count                            AS sales_industrial_mwh,
        u.sales_transportation_mwh / tc.county_count                        AS sales_transportation_mwh,
        u.sales_total_mwh / tc.county_count                                 AS sales_total_mwh,
        u.revenue_total_thousand / tc.county_count                          AS revenue_total_thousand
      FROM energy.eia_service_territory st
      JOIN territory_counts tc
        ON tc.report_year = st.report_year AND tc.utility_id = st.utility_id
      JOIN energy.eia_utility_annual u
        ON u.report_year = st.report_year AND u.utility_id = st.utility_id
      LEFT JOIN geo.state_ref sr
        ON sr.state_abbr = st.state_abbr
      LEFT JOIN latest_counties gc
        ON gc.state_fips = sr.state_fips
        AND UPPER(gc.county_name) LIKE UPPER(st.county_name) || '%'

  - name: capacity_pipeline
    comment: >
      Capacity additions and retirements from EIA-860M annual snapshots, aggregated by
      state, change year, technology, fuel category and change type. One row per state +
      change_year + change_month + technology + fuel_category + change_type.
      DEDUPLICATION: eia_capacity_changes is a cumulative snapshot in which a single event
      reappears in every later snapshot_year it survives into (see that table's comment), so
      this view first reduces to the newest snapshot per (plant_id, generator_id, change_year,
      change_type) before aggregating. Without that step the totals overstate by roughly 4x —
      measured live, the pre-deduplication figure for this view's own filter was 3,773,160 MW
      across 72,779 rows against 918,476 MW across 14,575 real events.
      NOT FORWARD-LOOKING, despite the view's name: no row in eia_capacity_changes carries a
      change_year beyond the current year, and the 'Planned Addition' and 'Cancellation'
      rows — the ones that would carry a pipeline date — have change_year NULL on every row,
      so they aggregate into a single NULL bucket rather than a future year. 'Retirement'
      rows are historical (1896-2023). Treat this as a record of capacity change, not a
      pipeline of announced projects, until the planned-date mapping is fixed.
      The source's change_type vocabulary is exactly: Addition (259,980 rows, 1891-2025),
      Retirement (58,060, 1896-2023), Planned Addition (14,719, year NULL) and Cancellation
      (12,725, year NULL). This view covers 'Planned Addition' and 'Retirement'; historical
      'Addition' is deliberately excluded, which is why it is not a total-capacity view.
    sql: >
      SELECT
        c.state_abbr,
        c.change_year,
        c.change_month,
        c.technology,
        c.energy_source_code,
        CASE
          WHEN c.energy_source_code IN ('SUN','DPV','WND','WAT','GEO','WAS','OBG','OBS','OBL','MLG')
            THEN 'Renewable'
          WHEN c.energy_source_code IN ('NUC')
            THEN 'Nuclear'
          WHEN c.energy_source_code IN ('COL','BIT','SUB','LIG','WC','SC')
            THEN 'Coal'
          WHEN c.energy_source_code IN ('NG','LFG','OG','BFG','SNG')
            THEN 'Natural Gas'
          WHEN c.energy_source_code IN ('DFO','RFO','KER','JF','PG')
            THEN 'Petroleum'
          WHEN c.energy_source_code IN ('MWH','CEP')
            THEN 'Storage'
          ELSE 'Other'
        END                                                                AS fuel_category,
        c.change_type,
        COUNT(*)                                                           AS unit_count,
        SUM(c.nameplate_capacity_mw)                                       AS total_nameplate_mw,
        SUM(c.net_summer_capacity_mw)                                      AS total_summer_mw
      FROM (
        SELECT * FROM eia_capacity_changes
        WHERE change_type IN ('Planned Addition', 'Retirement')
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY plant_id, generator_id, change_year, change_type
          ORDER BY snapshot_year DESC) = 1
      ) c
      GROUP BY
        c.state_abbr, c.change_year, c.change_month,
        c.technology, c.energy_source_code,
        CASE
          WHEN c.energy_source_code IN ('SUN','DPV','WND','WAT','GEO','WAS','OBG','OBS','OBL','MLG')
            THEN 'Renewable'
          WHEN c.energy_source_code IN ('NUC')
            THEN 'Nuclear'
          WHEN c.energy_source_code IN ('COL','BIT','SUB','LIG','WC','SC')
            THEN 'Coal'
          WHEN c.energy_source_code IN ('NG','LFG','OG','BFG','SNG')
            THEN 'Natural Gas'
          WHEN c.energy_source_code IN ('DFO','RFO','KER','JF','PG')
            THEN 'Petroleum'
          WHEN c.energy_source_code IN ('MWH','CEP')
            THEN 'Storage'
          ELSE 'Other'
        END,
        c.change_type

  - name: weekly_gas_storage_signal
    comment: >
      Weekly natural gas working gas storage levels (storage_type_code = 'SWO') with
      year-over-year comparison. Uses LAG window function to compute the prior year
      same-week volume for YoY delta and percent change calculation. One row per
      region + report date. Useful as a market signal for gas price forecasting.
    sql: >
      SELECT
        s.report_date,
        s.storage_year,
        s.storage_week,
        s.eia_region_code,
        s.region,
        s.volume_bcf                                                       AS working_gas_bcf,
        LAG(s.volume_bcf, 52) OVER (
          PARTITION BY s.eia_region_code
          ORDER BY s.report_date
        )                                                                  AS prior_year_bcf,
        s.volume_bcf - LAG(s.volume_bcf, 52) OVER (
          PARTITION BY s.eia_region_code
          ORDER BY s.report_date
        )                                                                  AS yoy_change_bcf,
        CASE
          WHEN LAG(s.volume_bcf, 52) OVER (
            PARTITION BY s.eia_region_code
            ORDER BY s.report_date
          ) > 0
          THEN 100.0 * (s.volume_bcf - LAG(s.volume_bcf, 52) OVER (
            PARTITION BY s.eia_region_code
            ORDER BY s.report_date
          )) / LAG(s.volume_bcf, 52) OVER (
            PARTITION BY s.eia_region_code
            ORDER BY s.report_date
          )
          ELSE NULL
        END                                                                AS yoy_change_pct
      FROM eia_natural_gas_storage s
      WHERE s.storage_type_code = 'SWO'

  - name: state_energy_burden
    comment: >
      State-level energy burden estimate joining annual residential electricity prices
      with state energy consumption. Computes an implied annual residential electricity
      bill estimate from average price and total residential electricity sales divided
      by customer count. One row per state + year. State name comes from
      eia_electricity_prices' own state_description column (no join to geo.states).
    sql: >
      SELECT
        p.state_abbr,
        MAX(p.state_description)                                           AS state_name,
        p.price_year                                                       AS report_year,
        p.avg_price_cents_kwh                                              AS residential_price_cents_kwh,
        p.sales_million_kwh                                                AS residential_sales_million_kwh,
        p.customers                                                        AS residential_customers,
        CASE
          WHEN p.customers > 0
          THEN (p.sales_million_kwh * 1000000.0 / p.customers) * (p.avg_price_cents_kwh / 100.0)
          ELSE NULL
        END                                                                AS implied_annual_bill_dollars,
        c.consumption_bbtu                                                 AS total_energy_consumption_bbtu,
        c.expenditure_million                                              AS total_energy_expenditure_million
      FROM eia_electricity_prices p
      LEFT JOIN eia_state_energy_consumption c
        ON p.state_abbr = c.state_abbr
        AND p.price_year = c.consumption_year
        AND c.msn = 'TETCB'
      WHERE p.sector_code = 'RES'
        AND p.price_month IS NULL
      GROUP BY p.state_abbr, p.price_year, p.avg_price_cents_kwh,
               p.sales_million_kwh, p.customers, c.consumption_bbtu, c.expenditure_million

  - name: refinery_utilization_summary
    comment: >
      Refinery utilization summary pivoted from tall eia_refinery_operations data.
      Uses CASE expressions on process_code/series_id to pivot key series into named
      columns: crude_input_kbd, operable_capacity_kbd, utilization_rate_pct (all taken
      directly from the source series), catalytic_cracking_kbd, coking_kbd, and
      reforming_kbd, plus a locally computed computed_utilization_pct (crude_input_kbd /
      operable_capacity_kbd). One row per EIA area + PADD + report year + report month.
    sql: >
      SELECT
        r.eia_area_code,
        r.padd,
        r.report_year,
        r.report_month,
        MAX(CASE
          WHEN r.process_code = 'CRDISS' OR r.series_id LIKE '%CRDISS%'
          THEN r.value ELSE NULL
        END)                                                               AS crude_input_kbd,
        MAX(CASE
          WHEN r.process_code = 'CAPACITY' OR r.series_id LIKE '%OPEFWRD%'
          THEN r.value ELSE NULL
        END)                                                               AS operable_capacity_kbd,
        MAX(CASE
          WHEN r.process_code = 'UTILIZATION' OR r.series_id LIKE '%UTILP%'
          THEN r.value ELSE NULL
        END)                                                               AS utilization_rate_pct,
        MAX(CASE
          WHEN r.process_code = 'CATCRACK' OR r.series_id LIKE '%CATCRD%'
          THEN r.value ELSE NULL
        END)                                                               AS catalytic_cracking_kbd,
        MAX(CASE
          WHEN r.process_code = 'COKING' OR r.series_id LIKE '%COKCRD%'
          THEN r.value ELSE NULL
        END)                                                               AS coking_kbd,
        MAX(CASE
          WHEN r.process_code = 'REFORMING' OR r.series_id LIKE '%REFCRD%'
          THEN r.value ELSE NULL
        END)                                                               AS reforming_kbd,
        CASE
          WHEN MAX(CASE
            WHEN r.process_code = 'CAPACITY' OR r.series_id LIKE '%OPEFWRD%'
            THEN r.value ELSE NULL END) > 0
          THEN 100.0 * MAX(CASE
            WHEN r.process_code = 'CRDISS' OR r.series_id LIKE '%CRDISS%'
            THEN r.value ELSE NULL END)
            / MAX(CASE
            WHEN r.process_code = 'CAPACITY' OR r.series_id LIKE '%OPEFWRD%'
            THEN r.value ELSE NULL END)
          ELSE NULL
        END                                                                AS computed_utilization_pct
      FROM eia_refinery_operations r
      GROUP BY r.eia_area_code, r.padd, r.report_year, r.report_month
