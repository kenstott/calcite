      output:
        pattern: "type=eia_crude/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        <<: *iceberg_common
        tableName: eia_crude_oil_production
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7
