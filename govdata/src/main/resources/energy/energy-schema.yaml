        nullable: true
        comment: Mine operator company name
      - <<: *state_abbr_column
      - name: county_fips
        type: string
        nullable: true
        comment: 5-digit county FIPS code
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: latitude
        type: double
        nullable: true
        comment: Mine latitude
      - name: longitude
        type: double
        nullable: true
        comment: Mine longitude
      - name: mine_type
        type: string
        nullable: true
        comment: Mine type (e.g., 'Surface', 'Underground')
      - name: subunit_code
