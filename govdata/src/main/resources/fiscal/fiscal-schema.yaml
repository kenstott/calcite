  # ---------------------------------------------------------------------------
  # IRS SOI INDIVIDUAL INCOME BY COUNTY — {YY}incyallagi.csv (delta by year)
  # ---------------------------------------------------------------------------
  - name: soi_income_by_county
    # Freshness gate: IRS SOI bulk CSV on a fixed static path. A Last-Modified probe
    # skips the re-download and re-materialize on unchanged runs (fails open).
    freshness:
      type: last_modified
    pattern: "type=soi_income_by_county/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2016
      maxYear: 2023
      distinctYears: 8
      contiguous: true
      rowCount: 204353
      checkedAt: "2026-09-05T14:47:30Z"
    partitions: *standard_partitions
    comment: >
      IRS SOI individual income tax statistics at county grain x AGI size class x
      tax year (coarser than ZIP, longer history). Joins directly to geo.counties
      via county_fips. Amounts in $1000s. county_fips ending in 000 (COUNTYFIPS
      = 000) is the state total (kept; exclude in views that sum counties).
      Source: irs.gov/pub/irs-soi/{YY}incyallagi.csv.
    dqRowLimit: 30000

    dimensions:
      type:
        - soi_income_by_county
      year: *soi_county_year_range

    columns:
      - <<: *state_fips_column
        expression: 'LPAD(CAST(src."STATEFIPS" AS VARCHAR), 2, ''0'')'
      - <<: *state_abbr_column
        expression: 'src."STATE"'
      - <<: *county_fips_column
        expression: 'LPAD(CAST(src."STATEFIPS" AS VARCHAR), 2, ''0'') || LPAD(CAST(src."COUNTYFIPS" AS VARCHAR), 3, ''0'')'
        nullable: false
      - name: county_name
        type: string
        nullable: true
        expression: 'src."COUNTYNAME"'
        comment: County name (000 rows carry the state name)
      - name: agi_bracket
        type: string
        nullable: false
        expression: 'CAST(src."agi_stub" AS VARCHAR)'
        comment: SOI AGI size class (agi_stub 1-6)
      - name: num_returns
        type: long
        nullable: true
        expression: 'TRY_CAST(src."N1" AS BIGINT)'
        comment: Number of returns (N1)
      - name: num_individuals
        type: long
        nullable: true
        expression: 'TRY_CAST(src."N2" AS BIGINT)'
        comment: Number of individuals / exemptions (N2)
      - name: adjusted_gross_income
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A00100" AS DOUBLE)'
        comment: Adjusted gross income, $1000s (A00100)
      - name: total_income_amount
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A02650" AS DOUBLE)'
        comment: Total income, $1000s (A02650)
      - name: salaries_wages
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A00200" AS DOUBLE)'
        comment: Salaries and wages amount, $1000s (A00200)
      - name: business_net_income
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A00900" AS DOUBLE)'
        comment: Business/professional net income, $1000s (A00900)
      - name: net_capital_gain
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A01000" AS DOUBLE)'
        comment: Net capital gain amount, $1000s (A01000)
      - name: taxable_income
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A04800" AS DOUBLE)'
        comment: Taxable income, $1000s (A04800)
      - name: total_income_tax
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A06500" AS DOUBLE)'
        comment: Total income tax, $1000s (A06500)
      - name: total_tax_liability
        type: double
        nullable: true
        expression: 'TRY_CAST(src."A10300" AS DOUBLE)'
        comment: Total tax liability, $1000s (A10300)


      # --- The rest of the published file ------------------------------------------
      # Every remaining column IRS publishes in incyallagi.csv, under its own name and as
      # published. One entry per published field, so the table is the file rather than a
      # slice of it.
      #
      # The columns above are the same thing for the fields that need shaping -- notably
      # county_fips, which geo's FK convention requires as 5 digits and the file supplies
      # as a 3-digit COUNTYFIPS beside STATEFIPS. Each replaces its raw field rather than
      # sitting beside it.

      - name: mars1
        type: long
        nullable: true
        expression: 'TRY_CAST(src."mars1" AS BIGINT)'
        comment: IRS SOI field mars1, as published
      - name: mars2
        type: long
        nullable: true
        expression: 'TRY_CAST(src."MARS2" AS BIGINT)'
        comment: IRS SOI field MARS2, as published
      - name: mars4
        type: long
        nullable: true
        expression: 'TRY_CAST(src."MARS4" AS BIGINT)'
        comment: IRS SOI field MARS4, as published
      - name: elf
        type: long
        nullable: true
        expression: 'TRY_CAST(src."ELF" AS BIGINT)'
        comment: IRS SOI field ELF, as published
      - name: cprep
        type: long
