      - name: sba_guaranteed
        type: double
        nullable: true
        comment: SBA-guaranteed portion (USD)
      - name: approval_date
        type: string
        nullable: true
        comment: Approval date
      - name: year
        type: integer
        nullable: true
        comment: Approval fiscal year (ApprovalFY)
      - name: delivery_method
        type: string
        nullable: true
        comment: SBA delivery/processing method (ProcessingMethod)
      - name: naics_code
        type: string
        nullable: true
        comment: Borrower NAICS industry code
      - name: naics_description
        type: string
        nullable: true
        comment: NAICS industry description
      - name: project_county
        type: string
        nullable: true
        comment: Project county name
      - name: project_state
        type: string
        nullable: true
        comment: Project state (USPS abbr)
      - name: business_type
        type: string
        nullable: true
        comment: Business type (corporation / individual / partnership)
      - name: loan_status
        type: string
        nullable: true
        comment: Loan status (approved / paid in full / charged off / ...)
      - name: jobs_supported
        type: integer
        nullable: true
        comment: Reported jobs supported
      - name: lender_name
        type: string
        nullable: true
        comment: Approving lender (bank for 7(a); third-party lender for 504)

    source:
      type: http
