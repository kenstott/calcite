  # ---------------------------------------------------------------------------
  # SSA OASDI/SSI BENEFITS BY COUNTY — statcomps XLSX via Wayback (delta by year)
  # ---------------------------------------------------------------------------
  - name: ssa_benefits_by_geography
    # Freshness gate: landing/index page. A Last-Modified probe skips the re-download
    # and re-materialize on unchanged runs (fails open — a null token just re-fetches).
    freshness:
      type: last_modified
    pattern: "type=ssa_benefits_by_geography/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      SSA OASDI and SSI beneficiary counts and total benefit dollars by county x
      program x benefit type x year — the largest federal mandatory-spending
      stream, geo-keyed and comparable per county against soi_income_by_county and
      usaspending_by_state. SSA publishes only multi-sheet XLSX reports on a
      WAF-protected host that 403s non-browser clients, so the provider fetches the
      Wayback-archived workbook (oasdi_sc / ssi_sc) and parses the per-state county
      tables (Table 4 counts + Table 5 dollars for OASDI; Table 3 for SSI). The
      ANSI Code column carries the county FIPS directly. beneficiary_type is a
      mutually-exclusive published category (OASDI leaves sum to 'total'). Amounts
      are the December total monthly benefits, in whole USD; avg_monthly is per
      beneficiary. SSI per-category dollars are not published (only the total).
    dqRowLimit: 50000

    dimensions:
      type:
        - ssa_benefits_by_geography
      year: *ssa_year_range

    columns:
      - <<: *state_fips_column
        nullable: false
      - name: state_name
        type: string
        nullable: true
        comment: State name (from the workbook tab)
      - <<: *county_fips_column
        nullable: false
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: program
        type: string
        nullable: false
        comment: OASDI (Old-Age/Survivors/Disability) or SSI
      - name: beneficiary_type
        type: string
        nullable: false
        comment: >
          Published category — OASDI: total, retired_workers, retired_spouses,
          retired_children, survivors_widows_parents, survivors_children,
          disabled_workers, disabled_spouses, disabled_children (leaves sum to
          total); SSI: total, aged, blind_and_disabled
      - name: num_beneficiaries
        type: long
        nullable: true
        comment: Number of beneficiaries in current-payment status (December)
      - name: total_benefits_usd
        type: double
        nullable: true
        comment: Total December monthly benefits, USD (null for SSI non-total types)
      - name: avg_monthly_benefit_usd
        type: double
        nullable: true
        comment: Average monthly benefit per beneficiary, USD (derived)

    source:
      type: http
      # Nominal source; the provider fetches the Wayback-archived workbook per year.
      url: "https://www.ssa.gov/policy/docs/statcomps/oasdi_sc/"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.SsaBenefitsProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=ssa_benefits_by_geography/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: ssa_benefits_by_geography
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # SSA BENEFITS (ACS-DERIVED) — Census ACS county estimates (delta by year)
  # ---------------------------------------------------------------------------
  - name: ssa_benefits_by_geography_acs
    # Freshness gate: Census ACS5 REST API has no meaningful Last-Modified, so this
    # hashes the response body post-fetch to skip the materialize/commit when unchanged
    # (fails open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=ssa_benefits_by_geography_acs/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      County-level Social Security and SSI recipiency and dollars DERIVED from the
      Census ACS 5-year estimates — a fully open-API, WAF-free complement to the
      Wayback-sourced ssa_benefits_by_geography (which alone carries the SSA
      administrative beneficiary-type/program detail). One row per county x ACS
      vintage. These are SURVEY ESTIMATES on a HOUSEHOLD basis (not SSA
      administrative person counts): they cannot split OASI vs DI or beneficiary
      type, but give the geographic distribution of Social Security / SSI receipt
      and aggregate dollars with no archive.org dependency. Aggregate-dollar
      figures are survey-reported and run below SSA administrative totals. Source:
      api.census.gov/data/{year}/acs/acs5 (B19055/B19056/B19065/B19066).

    dimensions:
      type:
        - ssa_benefits_by_geography_acs
      year: *acs_year_range

    columns:
      - name: state_fips
        type: string
        nullable: false
        expression: 'src."state"'
        comment: 2-digit state FIPS (FK to geo.state_ref)
      - name: county_fips
        type: string
        nullable: false
        expression: 'src."state" || src."county"'
        comment: 5-digit county FIPS (FK to geo.counties)
      - name: county_name
        type: string
        nullable: true
        expression: 'src."NAME"'
        comment: County name (ACS NAME field)
      - name: total_households
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19055_001E" AS BIGINT)'
        comment: Total households (ACS B19055_001E)
      - name: households_with_social_security
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19055_002E" AS BIGINT)'
        comment: Households with Social Security income (ACS B19055_002E)
      - name: households_with_ssi
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19056_002E" AS BIGINT)'
        comment: Households with Supplemental Security Income (ACS B19056_002E)
      - name: aggregate_social_security_usd
        type: double
        nullable: true
        expression: 'TRY_CAST(src."B19065_001E" AS DOUBLE)'
        comment: Aggregate Social Security income, USD (ACS B19065_001E)
      - name: aggregate_ssi_usd
        type: double
        nullable: true
        expression: 'TRY_CAST(src."B19066_001E" AS DOUBLE)'
        comment: Aggregate Supplemental Security Income, USD (ACS B19066_001E)

    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B19055_001E,B19055_002E,B19056_002E,B19065_001E,B19066_001E&for=county:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=ssa_benefits_by_geography_acs/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: ssa_benefits_by_geography_acs
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # SNAP BENEFITS BY GEOGRAPHY — USDA FNA state monthly participation & cost
  # ---------------------------------------------------------------------------
  # Implemented by SnapBenefitsProvider.java, verified live 2026-08-24 against the
  # real download (26,349 rows, FY1989-2026, all 56 geographies resolved, zero
  # unresolved FIPS — see the class javadoc for full parsing notes). Key facts:
  #
  #   URL: https://www.fna.usda.gov/sites/default/files/resource-files/snap-zip-fy69tocurrent-8.zip
  #   (linked from the "National and/or State Level Monthly and/or Annual Data" row
  #   on https://www.fna.usda.gov/pd/supplemental-nutrition-assistance-program-snap)
  #
  #   - fna.usda.gov silently hangs (no 403, 0 bytes, holds the connection) on GET
  #     with a UA not prefixed 'Mozilla/5.0' — see [[usda-fna-akamai-browser-ua-required]].
  #     FiscalHttp's shared UA already satisfies this; no override needed.
  #   - The zip contains one workbook per fiscal year, FY1989-present (pre-FY89 is
  #     a separate national-only file, not loaded here): FY89-FY19 as legacy .xls
  #     (BIFF), FY20-present as .xlsx (OOXML) — POI's WorkbookFactory handles both.
  #   - Each workbook has (in the vintages inspected) 8 sheets: 7 FNS regional
  #     offices (NERO, MARO, SERO, MWRO, SWRO, MPRO, WRO — some vintages carry a
  #     trailing space in the sheet name) plus 'US Summary' (skipped — national
  #     rollup, not a state). States are NOT one-per-sheet; each sheet stacks its
  #     states as blocks: a row with just the state name, then 12 monthly data
  #     rows ('Oct 2023' .. 'Sep 2024'), then a 'Total' row (FY average/sum,
  #     emitted with month=NULL), then a blank separator row before the next
  #     state. The FNS regional-office grouping is not the Census region — not
  #     exposed as area_code/region; parsed per-block by state name only.
  #   - 56 geographies total: 50 states + DC + Guam + Puerto Rico + Virgin Islands
  #     + American Samoa + Commonwealth of Northern Mariana Islands. The source has
  #     no FIPS/abbreviation column anywhere — only the English state name as the
  #     block header — resolved via a hardcoded name->FIPS map (the mirror image
  #     of econ's state_wages FIPS->name map).
  #   - Column layout is NOT stable across vintages: FY89-FY19 (.xls) order is
  #     Household, Persons, Cost-Per-Household, Cost-Per-Person, Cost; FY20+
  #     (.xlsx) order is Household, Persons, Cost, Cost-Per-Household,
  #     Cost-Per-Person. Selected by file extension, not by re-reading headers per
  #     workbook (only these 2 layouts were observed across FY89-FY26).
  #   - Not-yet-reported months in the current FY are the literal string '--' in
  #     every numeric cell, not blank/null — parsed to SQL NULL.
  - name: snap_benefits_by_geography
    # Freshness gate: landing/index page, same pattern as ssa_benefits_by_geography —
    # a Last-Modified probe skips re-download/re-materialize on unchanged runs.
    freshness:
      type: last_modified
    pattern: "type=snap_benefits_by_geography/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      SNAP (Supplemental Nutrition Assistance Program) persons/households participating
      and total/average monthly benefits, by state x year x month — the nutrition-
      assistance counterpart to ssa_benefits_by_geography's income-benefits data, both
      geo-keyed and comparable against usaspending_by_state. USDA FNA publishes one zip
      covering FY1989-present (one workbook per fiscal year inside), not a per-year URL,
      so this table has no year fetch dimension — the provider parses the full history
      from one download and materialize partitions by the year column found in each row,
      same as fiscal's other single-workbook bulk sources. Excludes P-EBT (Pandemic EBT)
      figures, which USDA reports separately.

    dimensions:
      type:
        - snap_benefits_by_geography

    columns:
      - <<: *state_fips_column
        nullable: false
      - <<: *state_abbr_column
      - name: state_name
        type: string
        nullable: true
        comment: State name, exactly as the workbook's block-header row spells it
      - name: year
        type: integer
        nullable: false
        comment: Federal fiscal year (Oct-Sep)
      - name: month
        type: integer
        nullable: true
        comment: Calendar month (1-12); null for the per-state fiscal-year Total row
      - name: persons_participating
        type: long
        nullable: true
        comment: Average monthly persons receiving SNAP benefits
      - name: households_participating
        type: long
        nullable: true
        comment: Average monthly households receiving SNAP benefits
      - name: total_benefits_usd
        type: double
        nullable: true
        comment: Total SNAP benefits issued, USD
      - name: avg_monthly_benefit_per_person_usd
        type: double
        nullable: true
        comment: Average monthly benefit per person, USD
      - name: avg_monthly_benefit_per_household_usd
        type: double
        nullable: true
        comment: Average monthly benefit per household, USD

    source:
      type: http
      # Nominal source — like ssa_benefits_by_geography's SsaBenefitsProvider, the
      # actual zip/xls/xlsx fetch and parse happens entirely in the custom
      # dataProvider below; there is no generic response.format for a zip of
      # mixed-vintage Excel workbooks with per-state block layouts.
      url: "https://www.fna.usda.gov/sites/default/files/resource-files/snap-zip-fy69tocurrent-8.zip"
      method: GET
      headers:
        # fna.usda.gov hangs (no 403, just 0 bytes) on a non-browser UA for GET —
        # see [[usda-fna-akamai-browser-ua-required]]. Must be a real browser UA.
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.SnapBenefitsProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=snap_benefits_by_geography/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: snap_benefits_by_geography
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # CENSUS GOVS-FINANCE INDIVIDUAL UNIT FILE — Individual_Unit_File.zip (snapshot per year)
  # ---------------------------------------------------------------------------
  - name: govt_finance_by_unit
    # Freshness gate: Census landing/index page. A Last-Modified probe skips the
    # re-download and re-materialize on unchanged runs (fails open — a null token just
    # re-fetches).
    freshness:
      type: last_modified
    pattern: "type=govt_finance_by_unit/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2012
      maxYear: 2024
      distinctYears: 13
      contiguous: true
      rowCount: 10936565
      checkedAt: "2026-08-28T06:49:34Z"
    partitions: *standard_partitions
    comment: >
      State & local government finance from Census's annual "Individual Unit
      File" — one row per government unit x finance item code x year (long/tall
      layout: amount_thousands is the single fact, item_code the dimension). The
      landing page (census.gov/data/datasets/{year}/econ/local/public-use-datasets.html)
      is fetched by the framework; GovtFinanceTransformer discovers and downloads
      the actual ZIP link (filename is neither year-templatable nor stable —
      confirmed live: 2023_Individual_Unit_Files.zip vs
      2021_Individual_Unit_File.zip, singular/plural and casing both vary), then
      parses the 32-char fixed-width data file inside it. item_code follows the
      Census government finance classification manual (2006_classification_manual.pdf);
      notable codes for capital-vs-operating comparisons: E12/F12 (elementary-
      secondary education current operations / construction), E36/F36 (hospitals
      current operations / construction), E61/F61 (parks & recreation current
      operations / construction). gov_type_code: 0=state, 1=county, 2=city,
      3=township, 4=special district, 5=independent school district
      (3rd digit of the source ID field). unit_id is that government's unique
      identifier within (state_fips, gov_type_code, county_fips) — not globally
      unique alone. county_fips is the county OR county-type area the unit is
      located in; for state-level rows (gov_type_code=0) this is not a valid
      geo.counties FIPS. amount_thousands is in THOUSANDS of dollars and may be
      negative (debt retirements, etc.). Source (per year):
      census.gov/data/datasets/{year}/econ/local/public-use-datasets.html.
    dqRowLimit: 100000

    dimensions:
      type:
        - govt_finance_by_unit
      year: *govfin_year_range

    columns:
      - <<: *state_fips_column
        nullable: false
      - name: gov_type_code
        type: string
        nullable: false
        comment: 3rd digit of source ID (0=state,1=county,2=city,3=township,4=special district,5=school district)
      - name: gov_type_name
        type: string
        nullable: true
        comment: Decoded gov_type_code label
      - <<: *county_fips_column
        nullable: false
        comment: >
          County or county-type area FIPS the unit is located in (source ID
          positions 4-6). NOT a valid geo.counties key for state-level rows
          (gov_type_code=0); see the FK comment below.
      - name: unit_id
        type: string
        nullable: false
        comment: Government unit identifier (source ID positions 7-12), unique within (state_fips, gov_type_code, county_fips)
      - name: item_code
        type: string
        nullable: false
        comment: Finance item code (Census government finance classification manual), e.g. E12/F12 education, E36/F36 hospitals, E61/F61 parks & recreation
      - name: amount_thousands
        type: long
        nullable: true
        comment: Amount for this item code, in thousands of dollars (may be negative)
      - name: imputation_flag
        type: string
        nullable: true
        comment: Imputation type / item data flag (source position 32)

    source:
      type: http
      url: "https://www.census.gov/data/datasets/{year}/econ/local/public-use-datasets.html"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
