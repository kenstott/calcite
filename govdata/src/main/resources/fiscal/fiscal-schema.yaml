  # ---------------------------------------------------------------------------
  # CENSUS GOVS-FINANCE INDIVIDUAL UNIT FILE — Individual_Unit_File.zip (snapshot per year)
  # ---------------------------------------------------------------------------
  - name: govt_finance_by_unit
    # Freshness gate: Census landing/index page. A Last-Modified probe skips the
    # re-download and re-materialize on unchanged runs (fails open — a null token just
    # re-fetches).
    freshness:
      type: last_modified
    pattern: "type=govt_finance_by_unit/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2012
      maxYear: 2024
      distinctYears: 13
      contiguous: true
      rowCount: 10936568
      checkedAt: "2026-09-05T14:47:39Z"
    partitions: *standard_partitions
    comment: >
      State & local government finance from Census's annual "Individual Unit
      File" — one row per government unit x finance item code x year (long/tall
      layout: amount_thousands is the single fact, item_code the dimension). The
      landing page (census.gov/data/datasets/{year}/econ/local/public-use-datasets.html)
      is read by GovtFinanceProvider, which discovers and streams the actual
      ZIP link (filename is neither year-templatable nor stable — confirmed
      live: 2023_Individual_Unit_Files.zip vs 2021_Individual_Unit_File.zip,
      singular/plural and casing both vary), then streams the fixed-width data
      file inside it (records are 32 chars for 2017+ and 34 for 2012-2016,
      whose ID field is two characters wider). item_code follows the
      Census government finance classification manual (2006_classification_manual.pdf);
      notable codes for capital-vs-operating comparisons: E12/F12 (elementary-
      secondary education current operations / construction), E36/F36 (hospitals
      current operations / construction), E61/F61 (parks & recreation current
      operations / construction). There is no single item code for "Total
      Taxes" — T01 is Property Tax specifically (the classification manual's
      largest single tax category, not an aggregate); a total-taxes figure for
      a unit or state requires summing every T-prefixed row (T01, T09-T16,
      T19-T29, T40, T41, T50, T51, T53, T99) grouped by (state_fips, year), or
      by (state_fips, gov_type_code, year) for a level breakdown — summing T01
      alone understates total tax revenue by an amount that depends entirely
      on how heavily that state's governments rely on property tax versus
      sales/income/other taxes. gov_type_code: 0=state, 1=county, 2=city,
      3=township, 4=special district, 5=independent school district
      (3rd digit of the source ID field). unit_id is that government's unique
      identifier within (state_fips, gov_type_code, county_fips) — not globally
      unique alone. county_fips is the county OR county-type area the unit is
      located in; for state-level rows (gov_type_code=0) this is not a valid
      geo.counties FIPS. amount_thousands is in THOUSANDS of dollars and may be
      negative (debt retirements, etc.). This is a stratified sample survey of
      government units (large governments fully enumerated, smaller ones
      sampled) even in Census-of-Governments years (2012/2017/2022) — a raw
      per-state sum over the units present in this table is not guaranteed to
      equal that state's true total, and for at least some small states this
      file's own item-code totals (verified against Census's own bundled
      state-level crosstab file, e.g. NNstatetypepu.txt) are implausible
      against independently published state totals; treat any state-level
      dollar aggregate from this table as needing cross-validation against an
      external published figure before use. Source (per year):
      census.gov/data/datasets/{year}/econ/local/public-use-datasets.html.
    dqRowLimit: 100000

    dimensions:
      type:
        - govt_finance_by_unit
      year: *govfin_year_range

    columns:
      - <<: *state_fips_column
        nullable: false
      - name: gov_type_code
        type: string
        nullable: false
        comment: 3rd digit of source ID (0=state,1=county,2=city,3=township,4=special district,5=school district)
      - name: gov_type_name
        type: string
        nullable: true
        comment: Decoded gov_type_code label
      - <<: *county_fips_column
        nullable: false
        comment: >
          County or county-type area FIPS the unit is located in (source ID
          positions 4-6). NOT a valid geo.counties key for state-level rows
          (gov_type_code=0); see the FK comment below.
      - name: unit_id
        type: string
        nullable: false
        comment: Government unit identifier (source ID positions 7-12), unique within (state_fips, gov_type_code, county_fips)
      - name: item_code
        type: string
        nullable: false
        comment: Finance item code (Census government finance classification manual), e.g. E12/F12 education, E36/F36 hospitals, E61/F61 parks & recreation
      - name: amount_thousands
        type: long
        nullable: true
        comment: Amount for this item code, in thousands of dollars (may be negative)
      - name: imputation_flag
        type: string
        nullable: true
        comment: Imputation type / item data flag (source position 32)

    source:
      type: http
      url: "https://www.census.gov/data/datasets/{year}/econ/local/public-use-datasets.html"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.GovtFinanceProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=govt_finance_by_unit/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: govt_finance_by_unit
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # CENSUS STC STATE CORPORATE INCOME TAX COLLECTIONS — govsstatetax timeseries
  # API, ITEM_CODE=T41 only (delta by year, one fetch per state per year)
  # ---------------------------------------------------------------------------
  - name: state_corporate_income_tax_collections
    pattern: "type=state_corporate_income_tax_collections/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Census Bureau Annual Survey of State Government Tax Collections (STC),
      ITEM_CODE=T41 ("Corporation Net Income Taxes") only — do not confuse
      with T40 (individual income tax; confirmed live, CA 2024 T40 =
      $123.1B vs T41 = $41.4B). One row per state x tax year, 50 states + DC
      (no territories — confirmed live: for=state:72 (Puerto Rico) returns no
      data). collections_thousands is in THOUSANDS of dollars and is NULL
      (not zero) for a state with no general corporate net income tax that
      year — confirmed live for 2024: Texas, Nevada, Washington, and Wyoming
      are NULL; South Dakota has no broad corporate income tax but its
      financial-institution franchise tax IS captured under T41 and returns a
      real value ($60.7M for 2024), so "NULL" means "no T41-classified tax,"
      not "no state tax revenue at all." Source (per state per year):
      api.census.gov/data/timeseries/govsstatetax — this endpoint's
      for=state:* wildcard is unsupported (confirmed live: every combination
      of ITEM_CODE filter, get= field list, and for=state:* returned HTTP 204
      with no body across the published 2016-2025 range), so each state is
      fetched with an explicit FIPS code. GOVTYPE and AGG_DESC are requested
      in the URL but not materialized as columns: both are constant for this
      item code (GOVTYPE=002 state government, AGG_DESC=STC017) and the API
      silently 204s the whole query if either is dropped from get= alongside
      an ITEM_CODE filter (confirmed live) — they stay in the URL as required
      request parameters only.

    dimensions:
      type:
        - state_corporate_income_tax_collections
      year: *state_corp_tax_year_range
      state_fips: *all_state_fips

    columns:
      - <<: *state_fips_column
        expression: 'LPAD(CAST(src."state" AS VARCHAR), 2, ''0'')'
        nullable: false
      - name: state_name
        type: string
        nullable: true
        expression: 'src."NAME"'
        comment: State name, as published (Census STC NAME field)
      - name: geo_id
        type: string
        nullable: true
        expression: 'src."GEO_ID"'
        comment: Census geography identifier, e.g. 0400000US06 for California
      - name: collections_thousands
        type: long
        nullable: true
        expression: 'TRY_CAST(src."AMOUNT" AS BIGINT)'
        comment: >
          Corporation net income tax (ITEM_CODE=T41) collections for the
          fiscal year, in THOUSANDS of dollars (Census STC AMOUNT field,
          label "Amount ($1,000)"). NULL for a state with no T41-classified
          tax that year (see table comment), not a missing observation.

    source:
      type: http
      url: "https://api.census.gov/data/timeseries/govsstatetax?get=NAME,AMOUNT,GEO_ID,GOVTYPE,AGG_DESC&time={effective_year}&ITEM_CODE=T41&for=state:{state_fips}&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
        # Census returns a 2D array - CensusResponseTransformer handles conversion
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=state_corporate_income_tax_collections/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: state_corporate_income_tax_collections
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # DOL WHD STATE MINIMUM WAGE HISTORY — single-page snapshot, multi-year output
  # ---------------------------------------------------------------------------
  - name: state_minimum_wage_history
    # Freshness gate: DOL landing/index page. A Last-Modified probe skips the
    # re-download and re-materialize on unchanged runs (fails open — a null token just
    # re-fetches).
    freshness:
      type: last_modified
    pattern: "type=state_minimum_wage_history/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1968
      maxYear: 2024
      distinctYears: 39
      contiguous: false
      years: [1968, 1970, 1972, 1976, 1979, 1980, 1981, 1988, 1991, 1992, 1994, 1996, 1997, 1998, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
      rowCount: 2145
      checkedAt: "2026-09-05T14:47:40Z"
    partitions: *standard_partitions
    dataset_type: snapshot
    comment: >
      DOL Wage and Hour Division's published "Changes in Basic Minimum Wages in
      Non-Farm Employment Under State Law" table (selected years, 1968 to
      present) — one row per jurisdiction x published year. The single page
      (dol.gov/agencies/whd/state/minimum-wage/history) holds six HTML tables
      spanning disjoint "selected years" (1968-1981, 1988-1998, then every year
      2000-present); years NOT shown on the page (e.g. 1969, 1973-1975,
      1982-1987) are simply absent from this table, not a gap in ETL coverage.
      55 jurisdictions per year: "Federal (FLSA)" (jurisdiction_type=FEDERAL),
      the 50 states (STATE), District of Columbia (DISTRICT), and Guam/Puerto
      Rico/U.S. Virgin Islands (TERRITORY — not in geo.state_ref, so
      state_fips is null for these three and for the FEDERAL row).
      raw_wage_text preserves DOL's own cell text verbatim, including its
      inconsistencies ("N.A." vs "NA", inconsistent "$" prefixing, a stray
      source typo like "4..65(g,,j)") — wage_amount (a clean hourly USD
      figure) is populated ONLY for the unambiguous single-value case
      (value_type=SINGLE); ranges (value_type=RANGE, e.g. a tipped-vs-standard
      spread), dual-track values (value_type=DUAL_TRACK, e.g. the pre-1978
      multi-track FLSA system or a state's two-tier law), "..." (NOT_APPLICABLE
      — no separate jurisdiction law that year), "N.A."/"NA" (NOT_AVAILABLE),
      and anything else unparseable (OTHER, e.g. a non-hourly "/day" or "/wk"
      rate) are left null in wage_amount by design, never guessed — see
      raw_wage_text for the ground truth in every case. increased_from_prior_column
      reflects DOL's own bolding convention (its key states: "wage rates in bold
      indicate an increase over the previous year's rate" — the previous YEAR
      SHOWN, which is not always the previous calendar year before 2000).
      footnote_codes carries the raw trailing footnote marker(s) from inside a
      SINGLE cell's "[ ]"/"( )" (DOL's own lettered key on the source page
      defines them; not reproduced here since the definitions are not per-row
      data). dol.gov 403s every direct fetch from this build environment (a
      domain-wide Akamai edge block, confirmed even at the site root) — the
      same failure mode already solved in this schema for
      ssa_benefits_by_geography, so StateMinWageTransformer follows that
      precedent and fetches the page via the Wayback Machine
      (FiscalHttp.fetchViaWayback) rather than dol.gov directly; source.url
      below is the nominal/documentary URL, not what is actually requested.
      DOL updates this page roughly annually (a new year column appended each
      January); dataset_type=snapshot re-fetches and replaces the whole table
      on every run since the fetch is a single small page.

    dimensions:
      type:
        - state_minimum_wage_history

    columns:
      - <<: *partition_year
        nullable: false
      - name: jurisdiction_name
        type: string
        nullable: false
        comment: >
          Raw jurisdiction label as published: "Federal (FLSA)", a state name,
          "District of Columbia", "Guam", "Puerto Rico", or "U.S. Virgin Islands"
      - name: jurisdiction_type
        type: string
        nullable: false
        comment: FEDERAL | STATE | DISTRICT | TERRITORY
      - <<: *state_fips_column
        comment: >
          2-digit Census state FIPS (FK to geo.state_ref); populated only for
          jurisdiction_type STATE/DISTRICT — null for FEDERAL and TERRITORY
          rows (Guam/Puerto Rico/U.S. Virgin Islands are not in geo.state_ref)
      - name: raw_wage_text
        type: string
        nullable: false
        comment: Exact published cell text for this jurisdiction x year, verbatim (see table comment)
      - name: wage_amount
        type: double
        nullable: true
        comment: >
          Parsed hourly wage in USD; populated ONLY when value_type=SINGLE —
          null for RANGE/DUAL_TRACK/NOT_APPLICABLE/NOT_AVAILABLE/OTHER (never
          a guessed or truncated number — see raw_wage_text)
      - name: value_type
        type: string
        nullable: false
        comment: SINGLE | RANGE | DUAL_TRACK | NOT_APPLICABLE | NOT_AVAILABLE | OTHER — classification of raw_wage_text
      - name: increased_from_prior_column
        type: boolean
        nullable: false
        comment: True when DOL bolded this cell (its own "increase over the previous year's rate" indicator)
      - name: footnote_codes
        type: string
        nullable: true
        comment: >
          Raw footnote code(s) from inside a SINGLE cell's trailing "[ ]"/"( )",
          verbatim (comma-separated when multiple); null otherwise. See DOL's
          published Key section for definitions (not reproduced here)

    source:
      type: http
      # Nominal/documentary source; StateMinWageTransformer fetches the page via
      # the Wayback Machine instead (see FiscalHttp.fetchViaWayback) because
      # dol.gov 403s direct fetches from this build environment.
      url: "https://www.dol.gov/agencies/whd/state/minimum-wage/history"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.StateMinWageTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=state_minimum_wage_history/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: state_minimum_wage_history
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

# ============================================================================
# CONSTRAINTS
# ============================================================================
# PKs identify one observation. Most FKs are inter-schema, pointing at geo
# dimension tables via state/county keys; exempt_org_990 keys to
# exempt_org_master on EIN (the nonprofit entity spine).
# ============================================================================

constraints:

  soi_income_by_zip:
    # state_fips is REQUIRED in the key: zipcode=00000 is a per-state total row, so
    # (year, zip_code, agi_bracket) repeats once per state without state_fips. Cross-
    # state ZIPs are likewise disambiguated by their state.
    primaryKey: [year, state_fips, zip_code, agi_bracket]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  soi_income_by_county:
    primaryKey: [year, county_fips, agi_bracket]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  county_migration_flows:
    primaryKey: [year, origin_county_fips, dest_county_fips]
    foreignKeys:
      - columns: [origin_county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
      - columns: [dest_county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  exempt_org_master:
    primaryKey: [ein]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  exempt_org_990:
    primaryKey: [year, object_id]
    foreignKeys:
      - columns: [ein]
        targetTable: exempt_org_master
        targetColumns: [ein]

  usaspending_by_agency:
    primaryKey: [year, agency_name]

  usaspending_by_state:
    primaryKey: [year, state_abbr]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  usaspending_by_county:
    primaryKey: [year, county_fips]
    foreignKeys:
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  usaspending_by_district:
    primaryKey: [year, cd_fips]
    foreignKeys:
      - columns: [cd_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: congressional_districts
        targetColumns: [cd_fips]

  usaspending_recipients_by_district:
    primaryKey: [year, cd_fips, rank]
    foreignKeys:
      - columns: [cd_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: congressional_districts
        targetColumns: [cd_fips]

  # state_abbr, not state_fips: USAspending's geo_layer=state shape_code is the
  # USPS state abbreviation (same as usaspending_by_state/usaspending_by_district),
  # not a FIPS code -- matches the established convention for this endpoint.
  entitlement_spending_by_state:
    primaryKey: [year, state_abbr, program]
    foreignKeys:
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  sba_loan_approvals:
    foreignKeys:
      - columns: [borrower_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
      - columns: [project_state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  ssa_benefits_by_geography:
    primaryKey: [year, program, county_fips, beneficiary_type]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  snap_benefits_by_geography:
    primaryKey: [year, month, state_fips]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]

  ssa_benefits_by_geography_acs:
    primaryKey: [year, county_fips]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  govt_finance_by_unit:
    primaryKey: [year, state_fips, gov_type_code, county_fips, unit_id, item_code]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      # No FK on county_fips: valid only for county-level units (gov_type_code=1);
      # state-level rows carry a non-county placeholder there, so a blanket FK
      # would misrepresent the contract for 5 of the 6 gov_type_code values.

  state_corporate_income_tax_collections:
    primaryKey: [year, state_fips]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]

  state_minimum_wage_history:
    primaryKey: [year, jurisdiction_name]
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      # state_fips is null for jurisdiction_type FEDERAL/TERRITORY (Guam/Puerto
      # Rico/U.S. Virgin Islands are not in geo.state_ref); the FK only applies
      # to the STATE/DISTRICT rows where it is populated.

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: soi_income_by_county_year
    comment: >
      County-level revenue rollup: return counts, individual/exemption counts,
      adjusted gross income, and total income tax by county and tax year, summed
      across the six SOI AGI brackets (excludes the county_fips '...000'
      state-total rows carried in the source soi_income_by_county table).
    sql: >
      SELECT
        c.year,
        c.state_fips,
        c.county_fips,
        c.county_name,
        SUM(c.num_returns)            AS num_returns,
        SUM(c.num_individuals)        AS num_individuals,
        SUM(c.adjusted_gross_income)  AS adjusted_gross_income,
        SUM(c.total_income_tax)       AS total_income_tax
      FROM soi_income_by_county c
      WHERE c.county_fips NOT LIKE '%000'
      GROUP BY c.year, c.state_fips, c.county_fips, c.county_name

  - name: federal_spending_vs_income_tax_by_state_year
    comment: >
      Places each usaspending_by_state row (state, fiscal year, obligated_amount)
      beside its same-state, same-year SOI total-income-tax figure summed from
      the soi_income_by_county state-total ('...000') rows. federal_obligations_usd is TOTAL
      USAspending obligations across ALL agencies and programs combined — it is NOT broken out
      by awarding agency, CFDA/program, or budget function, so agency-specific federal spending
      (e.g. Department of Education, defense) cannot be isolated from this table.
      soi_income_tax_thousands is IRS SOI INDIVIDUAL INCOME TAX ONLY — it excludes
      payroll/FICA, corporate, and excise tax paid by the state's residents and
      businesses (no state-level payroll/FICA or excise tax table exists anywhere
      in this warehouse yet; state_corporate_income_tax_collections carries
      corporate income tax but is not yet part of this join). This view is NOT a
      federal balance-of-payments (total taxes paid vs. total spending received)
      comparison — subtracting soi_income_tax_thousands from
      federal_obligations_usd computes spending against one tax type only, not
      spending against total federal receipts, and will overstate every state's
      apparent net position.
    sql: >
      SELECT
        s.year,
        s.state_abbr,
        s.state_name,
        s.obligated_amount           AS federal_obligations_usd,
        r.total_income_tax_thousands AS soi_income_tax_thousands
      FROM usaspending_by_state s
      LEFT JOIN (
        SELECT
          c.year,
          c.state_abbr,
          SUM(c.total_income_tax) AS total_income_tax_thousands
        FROM soi_income_by_county c
        WHERE c.county_fips LIKE '%000'
        GROUP BY c.year, c.state_abbr
      ) r
        ON r.year = s.year AND r.state_abbr = s.state_abbr

  - name: nonprofit_financials
    comment: >
      One row per Form 990 filing: exempt_org_990's total_revenue, total_expenses,
      total_assets, return_type (990/990-EZ/990-PF), and tax_year, left-joined to
      exempt_org_master's org_name (fallback to the filing's own name), state_abbr,
      ntee_code, and subsection_code on EIN — the nonprofit sector view.
    sql: >
      SELECT
        f.year,
        f.ein,
        COALESCE(m.org_name, f.org_name) AS org_name,
        m.state_abbr,
        m.ntee_code,
        m.subsection_code,
        f.return_type,
        f.tax_year,
        f.total_revenue,
        f.total_expenses,
        f.total_assets
      FROM exempt_org_990 f
      LEFT JOIN exempt_org_master m
        ON m.ein = f.ein

  - name: state_social_infrastructure_index
    comment: >
      Social Infrastructure Investment Index (SIII), per state per year, on a
      0-100 scale: 100 * (0.30*pct_capex + 0.20*pct_opex + 0.15*pct_beds +
      0.15*pct_pupil_teacher_inv + 0.10*pct_library + 0.10*pct_access_inv),
      where each pct_* is that metric's PERCENT_RANK() among the 50 states + DC
      for that year (0=lowest, 1=highest) — a relative ranking, not an absolute
      scale, so a state's score can move year over year purely from other
      states' movement even if its own raw metric is flat. Weights favor the
      two direct government fiscal-investment flows (capex+opex, 50% combined)
      over capacity/access proxies (50% combined), consistent with this being
      a FISCAL-policy index first.

      Components (all per-capita against census.acs_population, geography=state):
        - capex/opex: fiscal.govt_finance_by_unit, item codes F12/F36/F61
          (elementary-secondary/hospital/parks construction = capital outlay)
          and E12/E36/E61 (same three functions, current operations = opex).
          Summed across ALL gov_type_code (state+county+city+township+special
          district+school district) within the state — this is a whole-state
          total, not one government level.
        - beds: health.cms_pos_facilities, provider_category_code='01'
          (hospitals only) bed_count summed per state. KNOWN LIMITATION: this
          source is a CURRENT-QUARTER SNAPSHOT with no year dimension — the
          same beds-per-capita figure is broadcast across every year of the
          view rather than reflecting that year's actual bed count. Treat
          pct_beds as "current hospital capacity relative to other states,"
          not a historical trend.
        - pupil_teacher_inv: inverted (1 - percent_rank) SUM(enrollment) /
          SUM(teachers_total_fte) from edu.ccd_districts — inverted because a
          LOWER pupil-teacher ratio is the better outcome.
        - library: edu.library_outlets total square_feet per state per year.
        - access_inv: inverted (1 - percent_rank) average of
          (no_internet_households / total_households) from census.acs_internet
          and (no_vehicle_households / total_households) from
          census.acs_vehicle_access — inverted because a LOWER no-access rate
          is the better outcome. Both ACS components only exist from their
          respective minYear forward (acs_internet: 2019+); years before that
          get a NULL access_gap_pct and therefore NULL pct_access_inv, which
          COALESCEs out of the weighted sum (see raw_score below) rather than
          zeroing the state's score.

      NULL-COMPONENT HANDLING: components missing for a given state/year
      (COALESCE to NULL, not 0) are dropped from the weighted average, and the
      denominator is renormalized to the weights of the components that ARE
      present — a state missing only access data is scored on capex/opex/beds/
      pupil_teacher alone (renormalized to sum to 100), not penalized to a
      near-zero score by treating the missing metric as a 0.
    sql: >
      WITH years AS (
        SELECT DISTINCT year FROM govt_finance_by_unit
      ),
      govfin AS (
        SELECT
          state_fips,
          year,
          SUM(CASE WHEN item_code IN ('F12', 'F36', 'F61') THEN amount_thousands ELSE 0 END) AS capex_thousands,
          SUM(CASE WHEN item_code IN ('E12', 'E36', 'E61') THEN amount_thousands ELSE 0 END) AS opex_thousands
        FROM govt_finance_by_unit
        GROUP BY state_fips, year
      ),
      beds AS (
        SELECT state_fips, SUM(bed_count) AS hospital_beds
        FROM "health"."cms_pos_facilities"
        WHERE provider_category_code = '01'
        GROUP BY state_fips
      ),
      pupil_teacher AS (
        SELECT
          LPAD(CAST(fips AS VARCHAR), 2, '0') AS state_fips,
          year,
          SUM(enrollment)          AS total_enrollment,
          SUM(teachers_total_fte)  AS total_teachers_fte
        FROM "edu"."ccd_districts"
        GROUP BY LPAD(CAST(fips AS VARCHAR), 2, '0'), year
      ),
      libraries AS (
        SELECT
          sr.state_fips,
          lo.year,
          SUM(lo.square_feet) AS total_library_sqft
        FROM "edu"."library_outlets" lo
        JOIN "geo"."state_ref" sr ON sr.state_abbr = lo.state
        GROUP BY sr.state_fips, lo.year
      ),
      access AS (
        SELECT
          i.state AS state_fips,
          i.year,
          SUM(i.total_households)     AS total_households,
          SUM(i.no_internet)          AS no_internet_households,
          SUM(v.no_vehicle_households) AS no_vehicle_households
        FROM "census"."acs_internet" i
        LEFT JOIN "census"."acs_vehicle_access" v
          ON v.state = i.state AND v.year = i.year AND v.geography = 'state'
        WHERE i.geography = 'state'
        GROUP BY i.state, i.year
      ),
      population AS (
        SELECT state AS state_fips, year, total_population
        FROM "census"."acs_population"
        WHERE geography = 'state'
      ),
      base AS (
        SELECT
          sr.state_fips,
          sr.state_name,
          y.year,
          p.total_population,
          gf.capex_thousands,
          gf.opex_thousands,
          gf.capex_thousands * 1000.0 / NULLIF(p.total_population, 0) AS capex_per_capita,
          gf.opex_thousands * 1000.0 / NULLIF(p.total_population, 0)  AS opex_per_capita,
          b.hospital_beds,
          b.hospital_beds * 100000.0 / NULLIF(p.total_population, 0)  AS beds_per_100k,
          pt.total_enrollment,
          pt.total_teachers_fte,
          pt.total_enrollment / NULLIF(pt.total_teachers_fte, 0)      AS pupil_teacher_ratio,
          lib.total_library_sqft,
          lib.total_library_sqft / NULLIF(p.total_population, 0)      AS library_sqft_per_capita,
          a.total_households,
          a.no_internet_households,
          a.no_vehicle_households,
          (
            (a.no_internet_households / NULLIF(a.total_households, 0))
            + (a.no_vehicle_households / NULLIF(a.total_households, 0))
          ) / 2.0 * 100.0                                             AS access_gap_pct
        FROM "geo"."state_ref" sr
        CROSS JOIN years y
        LEFT JOIN govfin gf ON gf.state_fips = sr.state_fips AND gf.year = y.year
        LEFT JOIN beds b ON b.state_fips = sr.state_fips
        LEFT JOIN pupil_teacher pt ON pt.state_fips = sr.state_fips AND pt.year = y.year
        LEFT JOIN libraries lib ON lib.state_fips = sr.state_fips AND lib.year = y.year
        LEFT JOIN access a ON a.state_fips = sr.state_fips AND a.year = y.year
        LEFT JOIN population p ON p.state_fips = sr.state_fips AND p.year = y.year
      ),
      ranked AS (
        SELECT
          *,
          CASE WHEN capex_per_capita IS NOT NULL
            THEN PERCENT_RANK() OVER (PARTITION BY year ORDER BY capex_per_capita) END AS pct_capex,
          CASE WHEN opex_per_capita IS NOT NULL
            THEN PERCENT_RANK() OVER (PARTITION BY year ORDER BY opex_per_capita) END AS pct_opex,
          CASE WHEN beds_per_100k IS NOT NULL
            THEN PERCENT_RANK() OVER (PARTITION BY year ORDER BY beds_per_100k) END AS pct_beds,
          CASE WHEN pupil_teacher_ratio IS NOT NULL
            THEN 1.0 - PERCENT_RANK() OVER (PARTITION BY year ORDER BY pupil_teacher_ratio) END AS pct_pupil_teacher_inv,
          CASE WHEN library_sqft_per_capita IS NOT NULL
            THEN PERCENT_RANK() OVER (PARTITION BY year ORDER BY library_sqft_per_capita) END AS pct_library,
          CASE WHEN access_gap_pct IS NOT NULL
            THEN 1.0 - PERCENT_RANK() OVER (PARTITION BY year ORDER BY access_gap_pct) END AS pct_access_inv
        FROM base
      )
      SELECT
        state_fips,
        state_name,
        year,
        total_population,
        capex_per_capita,
        opex_per_capita,
        beds_per_100k,
        pupil_teacher_ratio,
        library_sqft_per_capita,
        access_gap_pct,
        pct_capex, pct_opex, pct_beds, pct_pupil_teacher_inv, pct_library, pct_access_inv,
        100.0 * (
          COALESCE(0.30 * pct_capex, 0) + COALESCE(0.20 * pct_opex, 0)
          + COALESCE(0.15 * pct_beds, 0) + COALESCE(0.15 * pct_pupil_teacher_inv, 0)
          + COALESCE(0.10 * pct_library, 0) + COALESCE(0.10 * pct_access_inv, 0)
        ) / NULLIF(
          (CASE WHEN pct_capex IS NOT NULL THEN 0.30 ELSE 0 END)
          + (CASE WHEN pct_opex IS NOT NULL THEN 0.20 ELSE 0 END)
          + (CASE WHEN pct_beds IS NOT NULL THEN 0.15 ELSE 0 END)
          + (CASE WHEN pct_pupil_teacher_inv IS NOT NULL THEN 0.15 ELSE 0 END)
          + (CASE WHEN pct_library IS NOT NULL THEN 0.10 ELSE 0 END)
          + (CASE WHEN pct_access_inv IS NOT NULL THEN 0.10 ELSE 0 END), 0
        ) AS siii
      FROM ranked
