      for the same reasons as usaspending_by_state/usaspending_by_county — see those
      tables' comments for the nationwide evidence. cd_fips matches
      geo.congressional_districts.cd_fips exactly (state FIPS + district number), no
      crosswalk needed. Does NOT carry a recipient/contractor-name dimension — USAspending's
      award-level search (spending_by_award, already used by
      UsaSpendingAwardSearchProvider for the broadband_*_awards tables) is paginated
      per-award rather than pre-aggregated, so a full recipient-concentration table
      across all 442 districts is a materially heavier build, deliberately left as a
      separate follow-up rather than folded into this one. For per-capita, join
      census.acs_population rather than a stored figure here. Joins to
      geo.congressional_districts via cd_fips. Source:
      api.usaspending.gov/api/v2/search/spending_by_geography/.

    dimensions:
      type:
        - usaspending_by_district
      year: *usaspending_year_range

    columns:
      - name: cd_fips
        type: string
        nullable: false
        comment: 4-digit congressional district code (state FIPS + district number), matches geo.congressional_districts.cd_fips
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-letter USPS state abbreviation, decoded from USAspending's display_name
      - name: district_number
        type: string
        nullable: true
        comment: >
          District number as text (e.g. "04"); "00" means an at-large single-district
          state, "98" means a non-voting delegate district (DC, Puerto Rico, Guam,
          U.S. Virgin Islands, American Samoa, Northern Mariana Islands)
      - name: cd_name
        type: string
        nullable: true
        comment: USAspending's own district label, e.g. "PA-04"
      - name: obligated_amount
        type: double
        nullable: true
        comment: Aggregated obligations for the fiscal year (USD), all award types
      - name: obligated_amount_excl_loans
        type: double
        nullable: true
        comment: >
          Aggregated obligations for the fiscal year (USD), excluding loan award types
          '07' (direct loans) and '08' (guaranteed/insured loans). Loans report face
          value at the lender/servicer's place of performance rather than the
          borrower's, which inflates obligated_amount for districts with large loan
          servicers; this figure is a truer measure of spending actually landing
          in the district.
      - name: obligated_amount_excl_loans_excl_cms_admin
        type: double
        nullable: true
        comment: >
          obligated_amount_excl_loans further excluding CMS (Centers for Medicare and
          Medicaid Services) funded awards — matches usaspending_by_state/
          usaspending_by_county's column of the same name; see those tables' comments
          for the nationwide evidence. CMS-funded awards report place of performance at
          the Medicare Administrative Contractor's location, not the beneficiary's,
          which concentrates Medicare claims spending into whichever district hosts a
          MAC contractor's office.

    source:
      type: http
      url: "https://api.usaspending.gov/api/v2/search/spending_by_geography/"
      method: POST
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      # The provider POSTs through this cache, keyed per request (endpoint + label +
      # body), so each of the batch's queries is issued once and a changed body re-keys.
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.UsaSpendingDistrictProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=usaspending_by_district/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: usaspending_by_district
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # USASPENDING RECIPIENTS BY DISTRICT — /api/v2/search/spending_by_category/
  # recipient/, filtered per (fiscal year, congressional district) via
  # place_of_performance_locations
  # ---------------------------------------------------------------------------
  - name: usaspending_recipients_by_district
    # Freshness gate: USAspending REST API has no meaningful Last-Modified, so this
    # hashes the response body post-fetch to skip the materialize/commit when unchanged
    # (fails open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=usaspending_recipients_by_district/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Top 100 recipients by obligated dollar amount for each place-of-performance
      congressional district x fiscal year — the recipient/contractor-name
      counterpart to usaspending_by_district, deferred from that table's build as
      "materially heavier" until a cheaper mechanism was confirmed live: USAspending's
      spending_by_category/recipient endpoint accepts a place_of_performance_locations
      filter shaped {country, state, district_current} and returns a server-side
      pre-aggregated, pre-ranked (descending by amount) recipient list in a single
      unpaginated call per district/year -- no per-award pagination needed, unlike
      UsaSpendingAwardSearchProvider's mechanism for the broadband_*_awards tables.
      SCOPE: exactly the top 100 recipients per district per year, matching the API's
      own page-size ceiling (limit=100 is the max; 500 is rejected as "above max
      '100'") -- not an attempt at every recipient in a district. A district with
      concentrated spending is fully captured; one with many small, dispersed
      recipients below the 100th rank is not. An aggregate "MULTIPLE RECIPIENTS" row
      (null recipient_id/uei/duns) appears in most districts for sub-reporting-
      threshold transactions USAspending itself buckets together, and is kept as a
      real ranked row. recipient_duns is the endpoint's "code" field (9-digit legacy
      DUNS-shaped identifier); recipient_uei is USAspending's own UEI when known;
      recipient_id is USAspending's internal recipient hash (present even when
      DUNS/UEI are not, except for the MULTIPLE RECIPIENTS aggregate). cd_fips matches
      geo.congressional_districts.cd_fips exactly, decoded the same way as
      usaspending_by_district. YEAR SCOPE: defaults to the 2 most recent complete
      fiscal years (usaspending_recipient_district_year_range), narrower than
      usaspending_by_district's 2018-present default -- this table makes one API call
      per (year, district) versus that table's 3 calls per year total, so a full
      2018-present backfill is ~442x heavier; GOVDATA_START_YEAR overrides for a wider
      backfill when wanted. Joins to geo.congressional_districts via cd_fips. Source:
      api.usaspending.gov/api/v2/search/spending_by_category/recipient/ (plus one
      spending_by_geography call per year to enumerate current districts, matching
      usaspending_by_district's own district list rather than a hard-coded one).

    dimensions:
      type:
        - usaspending_recipients_by_district
      year: *usaspending_recipient_district_year_range

    columns:
      - name: cd_fips
        type: string
        nullable: false
        comment: 4-digit congressional district code (state FIPS + district number), matches geo.congressional_districts.cd_fips
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-letter USPS state abbreviation, decoded from USAspending's display_name
      - name: district_number
        type: string
        nullable: true
        comment: >
          District number as text (e.g. "04"); "00" means an at-large single-district
          state, "98" means a non-voting delegate district (DC, Puerto Rico, Guam,
          U.S. Virgin Islands, American Samoa, Northern Mariana Islands)
      - name: rank
        type: integer
        nullable: false
        comment: Position (1-100) in USAspending's own descending-by-amount recipient ranking for this district/year
      - name: recipient_name
        type: string
        nullable: true
        comment: >
          Recipient/contractor name as reported by USAspending; "MULTIPLE RECIPIENTS"
          is USAspending's own aggregate bucket for sub-reporting-threshold transactions
      - name: recipient_id
        type: string
        nullable: true
        comment: USAspending's internal recipient hash identifier (e.g. "edc402f7-...-C"); null for the MULTIPLE RECIPIENTS aggregate
      - name: recipient_uei
        type: string
        nullable: true
        comment: SAM.gov Unique Entity Identifier (12-character alphanumeric), when known
      - name: recipient_duns
        type: string
        nullable: true
        comment: Legacy 9-digit DUNS-shaped identifier (USAspending's "code" field), when known
      - name: obligated_amount
        type: double
        nullable: true
        comment: Aggregated obligations for this recipient in this district/fiscal year (USD), all award types

    source:
      type: http
      url: "https://api.usaspending.gov/api/v2/search/spending_by_category/recipient/"
      method: POST
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      # The provider POSTs through this cache, keyed per request (endpoint + label +
      # body), so each district/year call is issued once and a changed body re-keys.
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.UsaSpendingDistrictRecipientsProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=usaspending_recipients_by_district/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: usaspending_recipients_by_district
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # ENTITLEMENT SPENDING BY STATE — /api/v2/search/spending_by_geography/,
  # filtered per fiscal year to specific entitlement-program CFDA/assistance-
  # listing numbers (delta by FY)
  # ---------------------------------------------------------------------------
  - name: entitlement_spending_by_state
    # Freshness gate: USAspending REST API has no meaningful Last-Modified, so this
    # hashes the response body post-fetch to skip the materialize/commit when unchanged
    # (fails open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=entitlement_spending_by_state/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Social Security and Medicare spending by place-of-performance state x fiscal
      year, isolated by CFDA/assistance-listing number rather than derived from
      usaspending_by_state's award-type totals — the entitlement-program
      counterpart to that table and to ssa_benefits_by_geography (which carries
      SSA's own county-grain administrative beneficiary/program detail but lags
      further due to its Wayback-archive dependency). One row per state x program
      x fiscal year: social_security_retirement (CFDA 96.002, SSA Old-Age and
      Survivors Insurance), medicare_hospital_insurance (CFDA 93.773, Medicare
      Part A), medicare_supplementary_medical_insurance (CFDA 93.774, Medicare
      Part B) — one POST per program per fiscal year against
      filters.program_numbers, same endpoint and geo_layer=state scope as
      usaspending_by_state. Social Security's per-state totals reflect the
      beneficiary's actual state. The two Medicare programs inherit the same
      place-of-performance distortion documented on usaspending_by_state's
      obligated_amount_excl_loans_excl_cms_admin column: CMS-funded awards report
      place of performance at the Medicare Administrative Contractor's location,
      not the beneficiary's, so states hosting a MAC (e.g. ND/Noridian, MN, IN,
      KY, PA, SC, CT) show implausibly large totals relative to population —
      confirmed live at FY2025 scale for both Medicare programs here. Not an
      import defect; use ssa_benefits_by_geography or a per-capita/population
      -normalized read for a beneficiary-state view of Medicare spending. Joins
      to geo.state_ref via state_abbr. Source:
      api.usaspending.gov/api/v2/search/spending_by_geography/.

    dimensions:
      type:
        - entitlement_spending_by_state
      year: *usaspending_year_range

    columns:
      - <<: *state_abbr_column
        nullable: false
      - name: state_name
        type: string
        nullable: true
        comment: State name
      - name: program
        type: string
        nullable: false
        comment: >
          social_security_retirement (CFDA 96.002), medicare_hospital_insurance
          (CFDA 93.773), or medicare_supplementary_medical_insurance (CFDA 93.774)
      - name: cfda_number
        type: string
        nullable: false
        comment: CFDA / assistance-listing number the row's program_numbers filter used
      - name: obligated_amount
        type: double
        nullable: true
        comment: >
          Aggregated obligations for the fiscal year (USD) for this program,
          place of performance. See table comment for the Medicare
          Administrative Contractor place-of-performance caveat.

    source:
      type: http
      url: "https://api.usaspending.gov/api/v2/search/spending_by_geography/"
      method: POST
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      # The provider POSTs through this cache, keyed per request (endpoint + CFDA
      # number + body), so each program's query per fiscal year is issued once.
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.UsaSpendingEntitlementProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=entitlement_spending_by_state/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: entitlement_spending_by_state
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # SBA 7(a) & 504 LOAN APPROVALS — data.sba.gov DKAN CSV (snapshot per program)
  # ---------------------------------------------------------------------------
  - name: sba_loan_approvals
    # Freshness gate: landing-page scrape, same shape as ag.ers_farm_income. A
    # Last-Modified probe skips the re-download and re-materialize on unchanged runs
    # (fails open — a null token just re-fetches).
    freshness:
      type: last_modified
    pattern: "type=sba_loan_approvals/program=*/*.parquet"
    partitions: *program_partitions
    comment: >
      Small Business Administration 7(a) and 504 loan approvals (FOIA public data),
      one row per approved loan — federal credit activity by borrower geography,
      industry, lender, and approval fiscal year. Fanned out by program; each
      program is split across several year-range CSVs on the source site (year
      is a data column, not a partition), all streamed and concatenated by
      SbaLoansProvider. Reissued quarterly, so the whole program partition is
      overwritten each run. Joins to geo.state_ref via borrower_state and to
      ref by borrower name/EIN. Source: data.sba.gov 7(a)-504 FOIA.
    dqRowLimit: 100000

    dimensions:
      type:
        - sba_loan_approvals
      program: *sba_programs

    columns:
      - name: borrower_name
        type: string
        nullable: true
        comment: Borrower business name (join to ref entity bridge)
      - name: borrower_city
        type: string
        nullable: true
        comment: Borrower city
      - name: borrower_state
        type: string
        nullable: true
        comment: Borrower state (USPS abbr; FK to geo.state_ref)
      - name: borrower_zip
