        retryOn: [429, 500, 503]
        maxRetries: 3
      # The provider reads the discovered file through this cache, keyed on that file's own
      # URL. The landing page it is discovered from is not cached: freezing that would pin
      # the table to whichever release was current on the first run.
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.SbaLoansProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=sba_loan_approvals/program=*/"
      partition:
        columns: [type, program]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: sba_loan_approvals
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [program]
        incrementalKeys: [program]
        overwritePartitions: true

  # ---------------------------------------------------------------------------
  # BROADBAND RECONNECT AWARDS — USAspending spending_by_award (CFDA 10.752, snapshot)
  # ---------------------------------------------------------------------------
  - name: broadband_reconnect_awards
    # Freshness gate: USAspending REST API has no meaningful Last-Modified, so this
    # hashes the response body post-fetch to skip the materialize/commit when unchanged
    # (fails open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=broadband_reconnect_awards/*.parquet"
    partitions: *static_partitions
    comment: >
      USDA ReConnect (CFDA 10.752) award-level broadband infrastructure grants and
      loan-grant combinations — one row per award, with recipient, dollar amount,
      performance period, and recipient location (county-grain via county_fips).
      A full crawl each run (not year-partitioned): the award-search endpoint has
      no reliable date-filter parameter that matches how award records are dated
      (obligation vs. performance-start vary by award), and the whole result set
      is small enough (low hundreds of awards) that a full refresh is cheap.
      Closes the ReConnect third of the "federal broadband award geography"
      sourcing gap — BEAD is the sibling broadband_bead_state_allocations table
      (state-grain only); RDOF/CAF-II are FCC/USAC-administered, not CFDA awards,
      so they aren't reachable through this endpoint at all (CAF-II location data
      is instead sourced from USAC's own open-data platform, see
      broadband_caf_deployment_locations). Source:
      api.usaspending.gov/api/v2/search/spending_by_award/ (program_numbers
      filter, award types 02/03/04/05 — grants only, no contracts/loans in this
      program).

    dimensions:
