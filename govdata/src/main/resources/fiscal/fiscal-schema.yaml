        comment: IRS SOI field agi_stub, as published
      - name: n1
        type: long
        nullable: true
        expression: 'TRY_CAST(src."N1" AS BIGINT)'
        comment: IRS SOI field N1, as published
      - name: mars1
        type: long
        nullable: true
        expression: 'TRY_CAST(src."mars1" AS BIGINT)'
        comment: IRS SOI field mars1, as published
      - name: mars2
        type: long
        nullable: true
