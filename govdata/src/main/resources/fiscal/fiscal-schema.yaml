  # ---------------------------------------------------------------------------
  # USASPENDING BY STATE — /api/v2/search/spending_by_geography/ (delta by FY)
  # ---------------------------------------------------------------------------
  - name: usaspending_by_state
    # Freshness gate: USAspending REST API has no meaningful Last-Modified, so this
    # hashes the response body post-fetch to skip the materialize/commit when unchanged
    # (fails open on a missing prior token).
    freshness:
      type: hash
    pattern: "type=usaspending_by_state/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Federal spending summarized by place-of-performance state x fiscal year — the
      spatial counterpart to the SOI revenue tables and one level up from the
      county-grain usaspending_by_county. Carries obligated_amount (all award types)
      alongside obligated_amount_excl_loans, which drops award types '07'/'08' (loans):
      loans report face value at the lender/servicer's place of performance rather than
      the borrower's, which inflates place-of-performance totals for states with large
      loan servicers. For per-capita, join census.acs_population rather than a stored
      figure here. From USAspending spending_by_geography (geo_layer=state, all award
      types, FY expressed as Oct-Sep). Joins to geo.state_ref via state_abbr. Source:
      api.usaspending.gov/api/v2/search/spending_by_geography/.

    dimensions:
      type:
        - usaspending_by_state
      year: *usaspending_year_range

    columns:
      - <<: *state_abbr_column
        nullable: false
      - name: state_name
        type: string
        nullable: true
        comment: State name
      - name: obligated_amount
        type: double
        nullable: true
        comment: Aggregated obligations for the fiscal year (USD), all award types
      - name: obligated_amount_excl_loans
        type: double
        nullable: true
        comment: >
          Aggregated obligations for the fiscal year (USD), excluding loan award types
          '07' (direct loans) and '08' (guaranteed/insured loans). Loans report face
          value at the lender/servicer's place of performance rather than the
          borrower's, which inflates obligated_amount for states with large loan
          servicers; this figure is a truer measure of spending actually landing
          in the state.
      - name: obligated_amount_excl_loans_excl_cms_admin
        type: double
        nullable: true
        comment: >
          obligated_amount_excl_loans further excluding CMS (Centers for Medicare and
          Medicaid Services) funded awards. CMS-funded awards report place of
          performance at the Medicare Administrative Contractor's location, not the
          beneficiary's — e.g. Noridian Healthcare Solutions (Fargo, ND) processes
          Medicare fee-for-service claims nationwide, but every claim geocodes to ND.
          Confirmed nationwide, not an ND-specific anomaly (other MAC-hosting states
          show the same effect at FY2023 scale, e.g. Minnesota $165.8B and Indiana
          $133.4B in CMS-funded place-of-performance alone, both exceeding California's
          total obligated_amount despite a fraction of the population). This is the
          truest measure of spending actually landing in the state for states with a
          large Medicare Administrative Contractor presence.

    source:
      type: http
      url: "https://api.usaspending.gov/api/v2/search/spending_by_geography/"
      method: POST
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.UsaSpendingStateProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=usaspending_by_state/year=*/"
      partition:
        columns: [type, year]
        valueSource:
          year: effective_year
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: usaspending_by_state
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        batchPartitionColumns: [year]
        incrementalKeys: [year]
        overwritePartitions: true

