  # ---------------------------------------------------------------------------
  - name: broadband_high_cost_disbursements
    pattern: "type=broadband_high_cost_disbursements/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Federal Universal Service Fund high-cost-program disbursements at
      Eligible Telecommunication Carrier (ETC) x month grain, from USAC's own
      open-data platform (opendata.usac.org, dataset w6qn-gx72). Covers every
      current-generation high-cost program's dollar flows to individual
      carriers by month: RDOF, CAF-II (annual + Auction 903), ACAM/ACAM-II,
      CAF-BLS (Broadband Loop Support), the Alaska Plan, RBE (Rural
      Broadband Experiments), and legacy programs (HCL, HCM, ICLS, IAS,
      Mobility I, LSS, SNA) still paying out on prior obligations. Together
      with fiscal.broadband_caf_deployment_locations (CAF-II served
      addresses), fiscal.broadband_reconnect_awards (USDA ReConnect), and
      fiscal.broadband_bead_state_allocations (NTIA BEAD) this is the fourth
      broadband-program table &mdash; carrier/state grain, not the
      county/tract grain the "federal broadband award geography" gap
      originally asked for (RDOF has no address-level source publicly
      available today; winners are still mid-buildout under a 10-year plan).
      Joins to sibling broadband tables by study_area_code. Source:
      opendata.usac.org/resource/w6qn-gx72.json.

