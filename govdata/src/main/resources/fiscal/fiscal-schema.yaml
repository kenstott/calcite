  # ---------------------------------------------------------------------------
  # BROADBAND CAF DEPLOYMENT LOCATIONS — USAC opendata Socrata (delta by filing year)
  # ---------------------------------------------------------------------------
  - name: broadband_caf_deployment_locations
    pattern: "type=broadband_caf_deployment_locations/year=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      FCC Connect America Fund Phase II (CAF-II) subsidized broadband buildout —
      one row per deployed location (near-address grain: lat/long, street
      address, and 15-digit census_block, whose first 5 digits are the county
      FIPS), filed annually by the carrier as it completes buildout milestones.
      Sourced from USAC's own open-data platform (opendata.usac.org, dataset
      r59r-rpip — the same underlying "CAF Map" data usaspending itself can't
      reach, since CAF-II is an FCC/USAC Universal Service Fund disbursement,
      not a CFDA federal-assistance award), filtered to fund_type IN ('CAF II',
      'CAF II Auc') — this dataset also carries ACAM/ACAM II/CAF-BLS/RBE/AK
      Plan rows for other high-cost programs, out of scope here. RDOF rows do
      not yet appear in this feed (RDOF winners are still mid-buildout under a
      10-year plan; only carrier-level disbursement/location-count totals exist
      for RDOF today, not individual addresses) — closes the CAF-II third of
      the "federal broadband award geography" sourcing gap, not RDOF. ~4.8M
      rows across 2015-2025 (2016-2021 the heaviest reporting years). Joins to
      geo.counties by taking the first 5 digits of census_block.

    dimensions:
      type:
        - broadband_caf_deployment_locations
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2015}"
        minYear: 2015
        end: "${GOVDATA_END_YEAR:${GOVDATA_CURRENT_YEAR}}"
        dataLag: 0

    columns:
      - name: fund_type
        type: string
        nullable: true
        expression: 'src."fund_type"'
        comment: "'CAF II' (annual model-based support) or 'CAF II Auc' (Auction 903 support)"
      - name: study_area_code
        type: string
        nullable: true
        expression: 'src."study_area_code"'
        comment: Carrier's FCC study area code (operating territory identifier)
      - name: holding_company
        type: string
        nullable: true
        expression: 'src."holding_company"'
        comment: Parent holding company
      - name: carrier
        type: string
        nullable: true
        expression: 'src."carrier"'
        comment: Reporting carrier/operating company name
      - name: latitude
        type: double
        nullable: true
        expression: 'TRY_CAST(src."latitude" AS DOUBLE)'
        comment: Deployed location latitude
      - name: longitude
        type: double
        nullable: true
        expression: 'TRY_CAST(src."longitude" AS DOUBLE)'
        comment: Deployed location longitude
      - name: deployment_address
        type: string
        nullable: true
        expression: 'src."deployment_address"'
        comment: Street address of the deployed location
      - name: deployment_city
        type: string
        nullable: true
        expression: 'src."deployment_city"'
      - <<: *state_abbr_column
        name: deployment_state
        expression: 'src."deployment_state"'
      - name: deployment_zip_code
        type: string
        nullable: true
        expression: 'src."deployment_zip_code"'
      - name: deployment_date
        type: string
        nullable: true
        expression: 'src."deployment_date"'
        comment: Date the location was reported as built out (may be a filing-period marker, not a literal construction date)
      - name: census_block
        type: string
        nullable: true
        expression: 'src."census_block"'
        comment: 15-digit Census block GEOID; first 5 digits are the county FIPS (FK to geo.counties)
      - name: locations_deployed
        type: integer
        nullable: true
