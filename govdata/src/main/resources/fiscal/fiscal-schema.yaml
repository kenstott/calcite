        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.fiscal.UsaSpendingAwardSearchProvider"

    materialize:
      format: iceberg
      output:
        pattern: "type=broadband_reconnect_awards/"
      partition:
        columns: [type]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/fiscal"
        tableName: broadband_reconnect_awards
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 67108864
        compactionMinFiles: 3
        overwritePartitions: true

