# ============================================================================
# ACS 1-YEAR ESTIMATES
# More current data for areas with 65,000+ population
# ============================================================================

  # ---------------------------------------------------------------------------
  # ACS 1-YEAR POPULATION - Current year population estimates
  # ---------------------------------------------------------------------------
  - name: acs1_population
    pattern: "type=acs1/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      ACS 1-Year population estimates (total, male, female population, median
      age), state level only (areas with 65,000+ population — no county
      breakout). More current than the 5-year table but based on a smaller
      annual sample, so estimates carry wider margins of error.

    dimensions:
      type:
        - acs1
      year: *acs1_year_range
      geography:
        - state

    columns:
      - *name_column
      - *state_column
      - name: total_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B01001_001E" AS BIGINT)'
        comment: Total population
      - name: total_population_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B01001_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B01001_001M" AS BIGINT) END'
        comment: 90% CI margin of error for total_population (Census variable B01001_001M; negative sentinels normalized to null)
      - name: male_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B01001_002E" AS BIGINT)'
        comment: Male population
      - name: male_population_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B01001_002M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B01001_002M" AS BIGINT) END'
        comment: 90% CI margin of error for male_population (Census variable B01001_002M; negative sentinels normalized to null)
      - name: female_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B01001_026E" AS BIGINT)'
        comment: Female population
      - name: female_population_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B01001_026M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B01001_026M" AS BIGINT) END'
        comment: 90% CI margin of error for female_population (Census variable B01001_026M; negative sentinels normalized to null)
      - name: median_age
        type: double
        nullable: true
        expression: 'TRY_CAST(src."B01002_001E" AS DOUBLE)'
        comment: Median age

      - name: median_age_moe
        type: double
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B01002_001M" AS DOUBLE) < 0 THEN NULL ELSE TRY_CAST(src."B01002_001M" AS DOUBLE) END'
        comment: 90% CI margin of error for median_age (Census variable B01002_001M; negative sentinels normalized to null)
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs1?get=NAME,B01001_001E,B01001_001M,B01001_002E,B01001_002M,B01001_026E,B01001_026M,B01002_001E,B01002_001M&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs1/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs1_population
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS 1-YEAR INCOME - Current year income statistics
  # ---------------------------------------------------------------------------
  - name: acs1_income
    pattern: "type=acs1/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Household median income and per capita income from the ACS 1-Year survey,
