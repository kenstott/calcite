# ============================================================================
# ECONOMIC CENSUS
# Comprehensive business statistics (every 5 years)
# ============================================================================

  # ---------------------------------------------------------------------------
  # ECONOMIC CENSUS BASIC - Core business statistics
  # ---------------------------------------------------------------------------
  - name: economic_census
    pattern: "type=ecn/year=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER
    comment: >
      Economic Census provides comprehensive business statistics including
      establishments, employment, payroll, and sales by industry.
      Uses dimension resolver to handle NAICS version differences:
      - 2017: Uses NAICS2017 variable
      - 2022: Uses NAICS2022 variable
      Partitioned by year only (not geography) to reduce file count.

    dimensions:
      type:
        - ecn
      # QUINQUENNIAL stepped cadence: emits census (vintage) years 2017, 2022, 2027, ...
      # The `year` axis IS the vintage — the year users query and the table partitions on.
      # dataLag: 0 so effective_year == year == vintage (no publish-lag shift); a census edition
      # not yet published (e.g. 2027 before ~2030) fast-fails HTTP 404, handled by skipOn:[404]
      # on the source. (Previously dataLag:3 stored the 2022 census under year=2019.)
      year:
        type: yearRange
        start: 2017            # cadence anchor (feed-began): quinquennial step 2017/2022/2027
        minYear: "${GOVDATA_START_YEAR:2010}"   # global demarcation clamp (daily → current year)
        step: 5
        end: "${GOVDATA_END_YEAR:current}"
        dataLag: 0             # vintage-axis: partition year = census year, not census year - lag
        descending: true
      geography: *all_geographies
      # Dynamic NAICS variable resolved based on year - uses hooks.dimensionResolver
      naics_var:
        type: custom

    columns:
      - *name_column
      - *state_column
      - *county_column
      - name: naics_code
        type: string
        nullable: true
        expression: 'COALESCE(src."NAICS2017", src."NAICS2022")'
        comment: NAICS industry code (version depends on census year)
      - name: establishments
        type: long
        nullable: true
        expression: 'TRY_CAST(src."ESTAB" AS BIGINT)'
        comment: Number of establishments
      - name: employees
        type: long
        nullable: true
        expression: 'TRY_CAST(src."EMP" AS BIGINT)'
        comment: Number of employees
      - name: payroll
        type: long
        nullable: true
        expression: 'TRY_CAST(src."PAYANN" AS BIGINT)'
        comment: Annual payroll ($1,000)
      - name: sales
        type: long
        nullable: true
        expression: 'TRY_CAST(src."RCPTOT" AS BIGINT)'
        comment: Total sales/receipts ($1,000)

    source:
      type: http
      url: "https://api.census.gov/data/{year}/ecnbasic?get=NAME,{naics_var},ESTAB,EMP,PAYANN,RCPTOT&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        skipOn: [404]          # a not-yet-published census edition (e.g. 2027 before ~2030) 404s; skip, don't fail
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      dimensionResolver: "org.apache.calcite.adapter.govdata.census.CensusEconomicDimensionResolver"

    materialize:
      format: iceberg
      output:
        pattern: "type=ecn/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: economic_census
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

