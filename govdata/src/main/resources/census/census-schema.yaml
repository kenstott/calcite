# ============================================================================
# NONEMPLOYER STATISTICS
# Self-employed businesses without paid employees
# ============================================================================

  # ---------------------------------------------------------------------------
  # NONEMPLOYER STATISTICS - Self-employed business counts
  # ---------------------------------------------------------------------------
  - name: nonemployer_statistics
    pattern: "type=nonemp/year=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER
    comment: >
      Nonemployer Statistics establishment counts and total receipts by NAICS industry, for
      businesses with no paid employees (self-employed/unincorporated), at state and county
      levels. Physically partitioned by year only (not geography) to reduce file count.

    dimensions:
      type:
        - nonemp
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2010}"
        end: "${GOVDATA_END_YEAR:current}"
        dataLag: 3
        descending: true
      geography: *all_geographies
      # The NAICS request variable is renamed with each Census NAICS vintage, so a single
      # hard-coded name only retrieves a five-year slice. NonemployerNaicsDimensionResolver
      # picks NAICS2007/2012/2017/2022 by data reference year (year - dataLag); dataLag here
      # MUST match the year dimension's dataLag above.
      naics_var:
        type: custom
        dataLag: 3

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      - name: naics_code
        type: string
        nullable: true
        expression: 'src."NAICS"'
        comment: NAICS industry code (canonical header; source variable is the vintage-specific NAICS20xx, normalized by CensusResponseTransformer)
      - name: establishments
        type: long
        nullable: true
        expression: 'TRY_CAST(src."NESTAB" AS BIGINT)'
        comment: Number of nonemployer establishments
      - name: receipts
        type: long
        nullable: true
        expression: 'TRY_CAST(src."NRCPTOT" AS BIGINT)'
        comment: Total receipts ($1,000)

    source:
      type: http
      # Uses NESTAB and NRCPTOT (N prefix for nonemployer)
      url: "https://api.census.gov/data/{effective_year}/nonemp?get=NAME,{naics_var},NESTAB,NRCPTOT&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      dimensionResolver: "org.apache.calcite.adapter.govdata.census.NonemployerNaicsDimensionResolver"

    materialize:
      format: iceberg
      output:
        pattern: "type=nonemp/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: nonemployer_statistics
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

# ============================================================================
# BUILDING PERMITS SURVEY
# New residential construction permits
# ============================================================================

  # ---------------------------------------------------------------------------
  # BUILDING PERMITS - Residential construction activity
  # ---------------------------------------------------------------------------
  - name: building_permits
    pattern: "type=bps/period_code=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: period_code
          type: VARCHAR
    comment: >
      Building Permits Survey tracks new privately-owned residential
      construction permits by state. Uses December cumulative (YTD) totals.
      Data from https://www2.census.gov/econ/bps/State/
      URL format is stYYMMy.txt where YYMM is year-month code (e.g., 2212 = Dec 2022).
      Partition 'period_code' stores the raw YYMM code for URL compatibility only — it is
      NOT a year (e.g. 2012 is Dec 2020, not 2012) and must never be filtered as one. Use the
      derived survey_year / survey_month columns (parsed from survey_date) for year/month
      filtering.

    dimensions:
      type:
        - bps
      # Custom dimension resolver generates YYMM codes dynamically.
      # BuildingPermitsDimensionResolver iterates PUBLISH years [start..current] (the global
      # demarcation), converts each to its data year (effective = publish - dataLag), and emits
      # the final YYMM code consumed directly by the URL. No literal floor: BPS data runs back to
      # 1992, so the global start (default 2010) is the only floor.
      period_code:
        type: custom
        start: "${GOVDATA_START_YEAR:2010}"
        dataLag: 1

    # Columns match Census Building Permits Survey fixed-width text file format
    # Data parsed from https://www2.census.gov/econ/bps/State/stYYMMy.txt
    columns:
      - name: survey_date
        type: string
        nullable: true
        comment: Survey date in YYYYMM format
      - name: state_fips
        type: string
        nullable: true
        comment: State FIPS code (2-digit)
      - name: state_name
        type: string
        nullable: true
        comment: State name
      - name: single_family_units
        type: string
        nullable: true
        comment: Single-family housing units authorized
      - name: single_family_value_thousands
        type: string
        nullable: true
        comment: Value of single-family permits ($1000)
      - name: duplex_units
        type: string
        nullable: true
        comment: Duplex housing units authorized
      - name: duplex_value_thousands
        type: string
        nullable: true
        comment: Value of duplex permits ($1000)
      - name: three_four_unit_units
        type: string
        nullable: true
        comment: 3-4 unit housing units authorized
      - name: three_four_unit_value_thousands
        type: string
        nullable: true
        comment: Value of 3-4 unit permits ($1000)
      - name: five_plus_unit_units
        type: string
        nullable: true
        comment: 5+ unit housing units authorized
      - name: five_plus_unit_value_thousands
        type: string
        nullable: true
        comment: Value of 5+ unit permits ($1000)
      - name: survey_year
        type: INTEGER
        nullable: true
        comment: Calendar year parsed from survey_date (YYYYMM); the real time filter target
      - name: survey_month
        type: INTEGER
        nullable: true
        comment: Calendar month (1-12) parsed from survey_date (YYYYMM)

    hooks:
      dimensionResolver: "org.apache.calcite.adapter.govdata.census.BuildingPermitsDimensionResolver"
      responseTransformer: "org.apache.calcite.adapter.govdata.census.BuildingPermitsResponseTransformer"

    source:
      type: http
      url: "https://www2.census.gov/econ/bps/State/st{period_code}y.txt"
      response:
        format: csv
        hasHeader: false
        columnNames: "survey_date,state_fips,column2,column3,state_name,column5,single_family_units,single_family_value_thousands,column8,duplex_units,duplex_value_thousands,column11,three_four_unit_units,three_four_unit_value_thousands,column14,five_plus_unit_units,five_plus_unit_value_thousands,column17,column18,column19,column20,column21,column22,column23,column24,column25,column26,column27,column28"
      rawCache:
        enabled: true
      # Filter to only include data rows (6-digit survey_date in first column)
      rowFilter:
        column: survey_date
        pattern: '^\d{6}$'

    materialize:
      format: iceberg
      output:
        pattern: "type=bps/period_code=*/"
      partition:
        columns: [type, period_code]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: building_permits
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

# ============================================================================
# QUARTERLY WORKFORCE INDICATORS (QWI)
# Employment dynamics by demographics
# ============================================================================

  # ---------------------------------------------------------------------------
  # QWI EMPLOYMENT - Quarterly employment by sex and age
  # ---------------------------------------------------------------------------
  - name: qwi_employment
    freshness:
      type: hash
    pattern: "type=qwi/time=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: time
          type: VARCHAR
    comment: >
      Quarterly Workforce Indicators (QWI) beginning-of-quarter employment, stable
      employment, hires, separations, and average monthly earnings of stable workers, at
      state level by quarter (YYYY-QN). No age, sex, or industry breakdown in this table.

    dimensions:
      type:
        - qwi
      # QWI API uses time parameter in format "YYYY-QN"
      time:
        - '2022-Q1'
        - '2022-Q2'
        - '2022-Q3'
        - '2022-Q4'
        - '2023-Q1'
        - '2023-Q2'
        - '2023-Q3'
        - '2023-Q4'
        - '2024-Q1'
        - '2024-Q2'
        - '2024-Q3'
        - '2024-Q4'
      # QWI doesn't support wildcard - need explicit state FIPS codes
      state: *all_state_fips

    columns:
      - *state_column
      - name: quarter
        type: string
        nullable: true
        expression: 'src."time"'
        comment: Quarter in YYYY-QN format
      - name: employment
        type: long
        nullable: true
        expression: 'TRY_CAST(src."Emp" AS BIGINT)'
        comment: Beginning-of-quarter employment
      - name: stable_employment
        type: long
        nullable: true
        expression: 'TRY_CAST(src."EmpS" AS BIGINT)'
        comment: Stable employment (employed full quarter)
      - name: hires
        type: long
        nullable: true
        expression: 'TRY_CAST(src."HirA" AS BIGINT)'
        comment: All hires
      - name: separations
        type: long
        nullable: true
        expression: 'TRY_CAST(src."Sep" AS BIGINT)'
        comment: All separations
      - name: earnings
        type: long
        nullable: true
        expression: 'TRY_CAST(src."EarnS" AS BIGINT)'
        comment: Average monthly earnings of stable workers

    source:
      type: http
      url: "https://api.census.gov/data/timeseries/qwi/sa?get=Emp,EmpS,HirA,Sep,EarnS&for=state:{state}&time={time}&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=qwi/time=*/"
      partition:
        columns: [type, time]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: qwi_employment
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        overwritePartitions: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

