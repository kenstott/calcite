  # ---------------------------------------------------------------------------
  - name: acs_nativity_by_education
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Joint nativity-by-education counts for the population 25 years and over,
      from the ACS 5-Year survey table B06009 (Place of Birth by Educational
      Attainment in the United States), state level only (no county breakout).
      Unlike acs_nativity (population by nativity only) and acs_education
      (population by attainment only), this table carries the actual joint
      counts — e.g. foreign_born_bachelors_or_higher is the real number of
      foreign-born adults with a bachelor's degree or higher, not an estimate
      derived by assuming independence across the two separate tables.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography:
        - state

    columns:
      - *name_column
      - *state_column
      - name: pop_25_plus
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_001E" AS BIGINT)'
        comment: Total population 25 years and over
      - name: pop_25_plus_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_001M" AS BIGINT) END'
        comment: 90% CI margin of error for pop_25_plus (Census variable B06009_001M; negative sentinels normalized to null)
      - name: foreign_born_pop_25_plus
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_025E" AS BIGINT)'
        comment: Foreign-born population 25 years and over
      - name: foreign_born_pop_25_plus_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_025M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_025M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born_pop_25_plus (Census variable B06009_025M; negative sentinels normalized to null)
      - name: foreign_born_less_than_hs
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_026E" AS BIGINT)'
        comment: Foreign born, less than high school graduate
      - name: foreign_born_less_than_hs_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_026M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_026M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born_less_than_hs (Census variable B06009_026M; negative sentinels normalized to null)
      - name: foreign_born_hs_graduate
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_027E" AS BIGINT)'
        comment: Foreign born, high school graduate (includes equivalency)
      - name: foreign_born_hs_graduate_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_027M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_027M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born_hs_graduate (Census variable B06009_027M; negative sentinels normalized to null)
      - name: foreign_born_some_college
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_028E" AS BIGINT)'
        comment: Foreign born, some college or associate's degree
      - name: foreign_born_some_college_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_028M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_028M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born_some_college (Census variable B06009_028M; negative sentinels normalized to null)
      - name: foreign_born_bachelors
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_029E" AS BIGINT)'
        comment: Foreign born, bachelor's degree
      - name: foreign_born_bachelors_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_029M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_029M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born_bachelors (Census variable B06009_029M; negative sentinels normalized to null)
      - name: foreign_born_graduate_degree
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_030E" AS BIGINT)'
        comment: Foreign born, graduate or professional degree
      - name: foreign_born_graduate_degree_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B06009_030M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B06009_030M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born_graduate_degree (Census variable B06009_030M; negative sentinels normalized to null)
      - name: foreign_born_bachelors_or_higher
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_029E" AS BIGINT) + TRY_CAST(src."B06009_030E" AS BIGINT)'
        comment: Foreign born with a bachelor's degree or higher (029E + 030E)
      - name: native_bachelors_or_higher
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B06009_011E" AS BIGINT) + TRY_CAST(src."B06009_012E" AS BIGINT) + TRY_CAST(src."B06009_017E" AS BIGINT) + TRY_CAST(src."B06009_018E" AS BIGINT) + TRY_CAST(src."B06009_023E" AS BIGINT) + TRY_CAST(src."B06009_024E" AS BIGINT)'
        comment: >
          Native-born with a bachelor's degree or higher — sums the bachelor's
          (011E/017E/023E) and graduate-or-professional (012E/018E/024E) cells
          across B06009's three native-birthplace categories (born in state of
          residence, born in another US state, native born outside the US).

    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B06009_001E,B06009_001M,B06009_011E,B06009_012E,B06009_017E,B06009_018E,B06009_023E,B06009_024E,B06009_025E,B06009_025M,B06009_026E,B06009_026M,B06009_027E,B06009_027M,B06009_028E,B06009_028M,B06009_029E,B06009_029M,B06009_030E,B06009_030M&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_nativity_by_education
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS INCOME BY NATIVITY - Median household income by nativity of householder (S0501)
  # ---------------------------------------------------------------------------
  - name: acs_income_by_nativity
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Median household income and household counts by nativity of the
      householder (total, native, foreign born, foreign born naturalized
      citizen, foreign born not a citizen), from the ACS 5-Year subject table
      S0501 (Selected Characteristics of the Native and Foreign-Born
      Populations), state level only (no county breakout). S0501 classifies
      households by the nativity of the population column; row 089
      (households_*) is the households-count denominator and row 101
      (median_household_income_*) the dollar estimate, for each of the 5
      nativity columns S0501 defines (C01 total, C02 native, C03 foreign born,
      C04 foreign born naturalized citizen, C05 foreign born not a citizen).
      Fetched from the acs5/subject endpoint (a different Census API dataset
      path than the acs5 detailed-table endpoint the other acs_* tables in
      this schema use).

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography:
        - state

    columns:
      - *name_column
      - *state_column
      - name: households_total
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C01_089E" AS BIGINT)'
        comment: Total households
      - name: households_native
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C02_089E" AS BIGINT)'
        comment: Households classified under the native population
      - name: households_foreign_born
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C03_089E" AS BIGINT)'
        comment: Households classified under the foreign-born population
      - name: households_naturalized
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C04_089E" AS BIGINT)'
        comment: Households classified under the foreign-born, naturalized-citizen population
      - name: households_noncitizen
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C05_089E" AS BIGINT)'
        comment: Households classified under the foreign-born, not-a-citizen population
      - name: median_household_income_total
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C01_101E" AS BIGINT)'
        comment: Median household income, all households (dollars)
      - name: median_household_income_native
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C02_101E" AS BIGINT)'
        comment: Median household income, native population (dollars)
      - name: median_household_income_foreign_born
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C03_101E" AS BIGINT)'
        comment: Median household income, foreign-born population (dollars)
      - name: median_household_income_naturalized
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C04_101E" AS BIGINT)'
        comment: Median household income, foreign-born naturalized-citizen population (dollars)
      - name: median_household_income_noncitizen
        type: long
        nullable: true
        expression: 'TRY_CAST(src."S0501_C05_101E" AS BIGINT)'
        comment: Median household income, foreign-born not-a-citizen population (dollars)

    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5/subject?get=NAME,S0501_C01_089E,S0501_C02_089E,S0501_C03_089E,S0501_C04_089E,S0501_C05_089E,S0501_C01_101E,S0501_C02_101E,S0501_C03_101E,S0501_C04_101E,S0501_C05_101E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_income_by_nativity
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

# ============================================================================
# CPS VOTING AND REGISTRATION SUPPLEMENT
# Census Bureau Current Population Survey biennial voting supplement — a
# different survey vehicle than the ACS tables above, with person-level
# microdata requiring weighted aggregation (see hooks.responseTransformer).
# ============================================================================

  # ---------------------------------------------------------------------------
  # CPS VOTING SUPPLEMENT - Reported voting/registration rates by state
  # ---------------------------------------------------------------------------
  - name: cps_voting_supplement
    pattern: "type=cps/year=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - *partition_type
        - *partition_year
    comment: >
      State-level reported voting and registration rates for the citizen
      voting-age population, from the Census Bureau's Current Population
      Survey (CPS) Voting and Registration Supplement — a biennial November
      survey module (even years only: congressional and presidential election
      years), not part of the ACS and not on the acs5 endpoint. The CPS API
      (api.census.gov/data/{year}/cps/voting/nov) returns person-level survey
      microdata (one row per respondent, with person weight PWSSWGT), not a
      pre-tabulated table, so this table is a weighted state-level aggregation
      of that microdata computed by CpsVotingSupplementTransformer:
      voted_rate_pct / registered_rate_pct are the population-weighted share
      of respondents answering "Yes" to PES1 (did you vote?) / PES2
      (registered to vote?), among respondents who gave a Yes/No answer
      (excluding "Not in Universe", "Refused", "Don't Know").
      population_reported_voted / population_reported_registered are the
      weighted denominators (the estimated citizen voting-age population that
      answered the question); sample_size_voted / sample_size_registered are
      the unweighted respondent counts backing each estimate, for
      margin-of-error context. Available biennially from 1996 (the earliest
      api.census.gov vintage for this dataset with PES1/PES2 variable coding
      stable through the most recent cycle — the November 1994 file predates
      api.census.gov and used different variable codes, PES3/PES4, for the
      same two questions, so 1994 is not in this table).

      CAUTION for turnout-gap or turnout-rate comparisons across states: this
      table is SELF-REPORTED turnout among the citizen voting-age population,
      known to systematically OVER-REPORT relative to actual counted votes
      (social-desirability bias) — it is NOT voting-eligible population (VEP),
      the standard denominator the turnout literature actually uses (Cantoni
      & Pons; McDonald/US Elections Project). For any question comparing
      turnout RATES between groups of states (e.g. by a policy like voter-ID
      requirements), prefer pairing real certified vote totals (e.g.
      officials.presidential_election_results or an equivalent FEC/certified-
      results table) with a VEP-style population denominator instead of this
      table's self-reported rate — this table alone will overstate turnout by
      roughly 10 points and can misstate a gap's size even when the direction
      is right.

    dimensions:
      type:
        - cps
      year:
        type: yearRange
        cadenceStart: 1996
        cadenceLength: 2
        start: "${GOVDATA_START_YEAR:1996}"
        minYear: 1996           # earliest api.census.gov vintage; also sidesteps the 1994
                                 # file's PES3/PES4 variable-name mismatch (see comment above)
        dataLag: 0               # vintage-axis: partition year = survey year, not survey
                                 # year - lag (same convention as decennial_years above). A
                                 # not-yet-published cycle (e.g. 2026 before ~early 2027) 404s,
                                 # handled by rateLimit.skipOn below.

    columns:
      - name: state
        type: string
        nullable: true
        expression: 'src."state"'
        comment: State FIPS code (2 digits), from the Census API for=state:* geography clause
      - name: sample_size_voted
        type: long
        nullable: true
        expression: 'TRY_CAST(src."sample_size_voted" AS BIGINT)'
        comment: Unweighted respondent count answering the vote question (PES1) Yes or No
      - name: population_reported_voted
        type: double
        nullable: true
        expression: 'TRY_CAST(src."population_reported_voted" AS DOUBLE)'
        comment: Weighted citizen voting-age population answering the vote question Yes or No
      - name: population_voted
        type: double
        nullable: true
        expression: 'TRY_CAST(src."population_voted" AS DOUBLE)'
        comment: Weighted population reporting they voted (PES1 = Yes)
      - name: voted_rate_pct
        type: double
        nullable: true
        expression: 'TRY_CAST(src."voted_rate_pct" AS DOUBLE)'
        comment: Reported voting rate — 100 * population_voted / population_reported_voted
      - name: sample_size_registered
        type: long
        nullable: true
        expression: 'TRY_CAST(src."sample_size_registered" AS BIGINT)'
        comment: Unweighted respondent count answering the registration question (PES2) Yes or No
      - name: population_reported_registered
        type: double
        nullable: true
        expression: 'TRY_CAST(src."population_reported_registered" AS DOUBLE)'
        comment: Weighted citizen voting-age population answering the registration question Yes or No
      - name: population_registered
        type: double
        nullable: true
        expression: 'TRY_CAST(src."population_registered" AS DOUBLE)'
        comment: Weighted population reporting they are registered (PES2 = Yes)
      - name: registered_rate_pct
        type: double
        nullable: true
        expression: 'TRY_CAST(src."registered_rate_pct" AS DOUBLE)'
        comment: Reported registration rate — 100 * population_registered / population_reported_registered

    source:
      type: http
      url: "https://api.census.gov/data/{year}/cps/voting/nov?get=PES1,PES2,PWSSWGT&for=state:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        skipOn: [404]          # a not-yet-published cycle (e.g. 2026 before ~early 2027) 404s; skip, don't fail
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.census.CpsVotingSupplementTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=cps/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: cps_voting_supplement
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5


# ============================================================================
# SQL VIEWS
# ============================================================================
# Analytical views for aggregated Census data queries.
# These views reference the partitioned tables above.
# ============================================================================

tables:
  # ---------------------------------------------------------------------------
  # POPULATION_SUMMARY - State-level population trends
  # ---------------------------------------------------------------------------
  - name: population_summary
    type: view
    comment: >
      State-level population summary showing total, male, and female population
      by year. Aggregates data from acs_population table.
    sql: >
      SELECT
        state,
        geo_name,
        "year",
        total_population,
        male_population,
        female_population,
        ROUND(100.0 * male_population / NULLIF(total_population, 0), 2) AS male_pct,
        ROUND(100.0 * female_population / NULLIF(total_population, 0), 2) AS female_pct
      FROM acs_population
      WHERE geography = 'state'

  # ---------------------------------------------------------------------------
  # INCOME_SUMMARY - State-level income metrics
  # ---------------------------------------------------------------------------
  - name: income_summary
    type: view
    comment: >
      State-level median household income and per capita income by year, from
      the ACS 5-Year acs_income table — about 2 years behind the current year.
      For a more current, single-year state estimate query acs1_income
      directly (no equivalent view exists for it yet).
    sql: >
      SELECT
        state,
        geo_name,
        "year",
        median_household_income,
        per_capita_income
      FROM acs_income
      WHERE geography = 'state'

  # ---------------------------------------------------------------------------
  # POVERTY_RATE - Poverty rate calculations
  # ---------------------------------------------------------------------------
  - name: poverty_rate
    type: view
    comment: >
      State-level poverty rates calculated from poverty universe and below poverty
      level counts. Shows percentage of population below poverty level.
    sql: >
      SELECT
        state,
        geo_name,
        "year",
        poverty_universe,
        below_poverty,
        ROUND(100.0 * below_poverty / NULLIF(poverty_universe, 0), 2) AS poverty_rate_pct
      FROM acs_poverty
      WHERE geography = 'state'

  # ---------------------------------------------------------------------------
  # EDUCATION_ATTAINMENT - Educational achievement metrics
  # ---------------------------------------------------------------------------
  - name: education_attainment
    type: view
    comment: >
      State-level educational attainment showing population with high school diploma,
      bachelor's degree, master's degree, and doctorate. Includes percentages.
    sql: >
      SELECT
        state,
        geo_name,
        "year",
        pop_25_plus,
        hs_graduate,
        bachelors,
        masters,
        doctorate,
        ROUND(100.0 * hs_graduate / NULLIF(pop_25_plus, 0), 2) AS hs_rate_pct,
        ROUND(100.0 * bachelors / NULLIF(pop_25_plus, 0), 2) AS bachelors_rate_pct,
        ROUND(100.0 * (masters + doctorate) / NULLIF(pop_25_plus, 0), 2) AS advanced_degree_pct
      FROM acs_education
      WHERE geography = 'state'

  # ---------------------------------------------------------------------------
  # UNEMPLOYMENT_RATE - Unemployment calculations
  # ---------------------------------------------------------------------------
  - name: unemployment_rate
    type: view
    comment: >
      State-level unemployment rates calculated from labor force and unemployed
      population. Shows labor force participation and unemployment percentages.
    sql: >
      SELECT
        state,
        geo_name,
        "year",
        labor_force,
        employed,
        unemployed,
        not_in_labor_force,
        ROUND(100.0 * unemployed / NULLIF(labor_force, 0), 2) AS unemployment_rate_pct,
        ROUND(100.0 * labor_force / NULLIF(labor_force + not_in_labor_force, 0), 2) AS labor_force_participation_pct
      FROM acs_employment
      WHERE geography = 'state'

  # ---------------------------------------------------------------------------
  # COUNTY_VULNERABILITY_PROFILE - CDC/ATSDR SVI-style county vulnerability
  # ---------------------------------------------------------------------------
  - name: county_vulnerability_profile
    type: view
    comment: >
      County-year social vulnerability profile combining ACS poverty rate
      (acs_poverty), senior/under-5 population share (acs_age), disability
      rate (acs_disability), and Spanish-limited-English-proficiency rate
      (acs_language) — the socioeconomic, household, and language themes of
      the CDC/ATSDR Social Vulnerability Index. limited_english_pct covers
      Spanish speakers with limited English proficiency only; acs_language
      has no combined-language limited-English-proficiency total. Enriched
      with a cross-schema join to disasters.disaster_declarations for
      lifetime (not year-matched) declaration and Individual-Assistance
      counts per county, since FEMA declarations are point-in-time events
      that don't line up with the ACS 5-year survey vintage. One row per
      county per ACS 5-year vintage.
    sql: >
      SELECT
        p.year,
        p.state,
        p.county_fips,
        p.geo_name,
        p.poverty_universe,
        p.below_poverty,
        ROUND(100.0 * p.below_poverty / NULLIF(p.poverty_universe, 0), 2) AS poverty_rate_pct,
        a.under_5_years,
        a.age_65_and_over,
        ROUND(100.0 * (a.under_5_years + a.age_65_and_over)
          / NULLIF(a.under_5_years + a.age_5_to_17 + a.age_18_to_64 + a.age_65_and_over, 0), 2) AS pct_age_dependent,
        d.total_population AS disability_universe,
        d.with_disability,
        ROUND(100.0 * d.with_disability / NULLIF(d.total_population, 0), 2) AS disability_rate_pct,
        l.population_5_plus,
        l.spanish_limited_english,
        ROUND(100.0 * l.spanish_limited_english / NULLIF(l.population_5_plus, 0), 2) AS limited_english_pct,
        COALESCE(fd.disaster_count, 0) AS lifetime_disaster_declarations,
        COALESCE(fd.ia_declarations, 0) AS lifetime_ia_declarations
      FROM acs_poverty p
      JOIN acs_age a
        ON p.county_fips = a.county_fips AND p.year = a.year AND a.geography = 'county'
      JOIN acs_disability d
        ON p.county_fips = d.county_fips AND p.year = d.year AND d.geography = 'county'
      JOIN acs_language l
        ON p.county_fips = l.county_fips AND p.year = l.year AND l.geography = 'county'
      LEFT JOIN (
        SELECT
          county_fips,
          COUNT(DISTINCT disaster_number) AS disaster_count,
          SUM(CASE WHEN ia_program_declared THEN 1 ELSE 0 END) AS ia_declarations
        FROM "disasters"."disaster_declarations"
        GROUP BY county_fips
      ) fd ON p.county_fips = fd.county_fips
      WHERE p.geography = 'county'

# ============================================================================
# CONSTRAINTS
# ============================================================================
# Foreign key relationships to GEO schema for geographic joins
# ============================================================================

constraints:
  # ACS 5-Year Tables
  acs_population:
    primaryKey: [year, geography, state, county]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: Links census state data to geographic boundaries and state metadata
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Links census county data to geographic boundaries (when geography=county)

  acs_income:
    primaryKey: [year, geography, state, county]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  acs_housing:
    primaryKey: [year, geography, state, county]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  acs_education:
    primaryKey: [year, geography, state, county]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]

  acs_employment:
    primaryKey: [year, geography, state, county]
    foreignKeys:
      - columns: [state]
