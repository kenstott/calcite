# ============================================================================
# U.S. Census Bureau Data Schema
# ============================================================================
# Data Sources:
#   - American Community Survey (ACS) 5-year estimates
#   - Decennial Census (2010, 2020)
#   - Population Estimates Program (PEP)
#
# Features:
#   - Hive-style partitioning for efficient querying
#   - Rate-limited API integration
#   - Iceberg materialization support
# ============================================================================

schemaName: "${SCHEMA_NAME:census}"
dataLagYears: 1
materializeDirectory: "${GOVDATA_PARQUET_DIR}"

comment: >
  U.S. Census Bureau demographic and population data including American Community Survey (ACS)
  estimates, decennial census results, and population estimates. Provides comprehensive demographic
  profiles, household characteristics, income distributions, educational attainment, housing
  statistics, and migration patterns at national, state, and county levels.

# ============================================================================
# HOOKS CONFIGURATION
# ============================================================================
# Response transformer for Census API's 2D array format
# ============================================================================

hooks:
  responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

# ============================================================================
# COLUMN TEMPLATES
# ============================================================================
# Reusable column definitions using YAML anchors
# ============================================================================

column_templates:

  # --- Geographic Identifier Columns ---

  geoid_column: &geoid_column
    name: geoid
    type: string
    nullable: true
    comment: Geographic identifier (FIPS code)

  name_column: &name_column
    name: geo_name
    type: string
    nullable: true
    expression: 'src."NAME"'
    comment: Geographic area name

  state_column: &state_column
    name: state
    type: string
    nullable: true
    comment: State FIPS code (2 digits)

  county_column: &county_column
    name: county
    type: string
    nullable: true
    comment: County FIPS code (3 digits, within state)

  county_fips_column: &county_fips_column
    name: county_fips
    type: string
    nullable: true
    expression: 'CASE WHEN LENGTH(COALESCE(src."county", '''')) > 0 THEN TRY_CAST(src."state" || src."county" AS VARCHAR) ELSE NULL END'
    comment: 5-digit county FIPS code (state + county) for joining to geo.counties

  # --- Partition Column Definitions ---

  partition_type: &partition_type
    name: type
    type: VARCHAR

  partition_year: &partition_year
    name: year
    type: INTEGER

  partition_geography: &partition_geography
    name: geography
    type: VARCHAR

  # --- Standard Partition Set ---

  standard_partitions: &standard_partitions
    style: hive
    columnDefinitions:
      - *partition_type
      - *partition_year
      - *partition_geography

# ============================================================================
# DIMENSION VALUES
# ============================================================================
# Reusable dimension value lists
# ============================================================================

dimension_values:

  # --- Year Range for ACS 5-year (starts 2009) ---
  # ACS 5-year estimates only available from 2009 onwards (Census API limitation)
  # Pre-2009 data does not exist - API returns errors for earlier years
  # dataLag: 2 because ACS 5-year data for year Y is released in December of Y+2
  # releaseMonth: 12 because release happens in December; before Dec, subtract one more year
  # Example in March 2026: effectiveEnd = min(2026-2, 2026) = 2024, then month 3 < 12 → 2023
  acs_year_range: &acs_year_range
    type: yearRange
    start: "${GOVDATA_START_YEAR:2010}"
    minYear: 2011          # 2010 5-year is 404 on the current api.census.gov/data/{year}/acs/acs5
                           # path for every ACS table (older 2010 vintage lived at a different path),
                           # so floor the shared 5-year anchor at 2011. Per-table minYear overrides
                           # below raise this further where a variable was added after 2011.
    dataLag: 2
    releaseMonth: 12

  # --- Year Range for ACS 1-year (starts 2006) ---
  # ACS 1-year estimates available from 2006 onwards (only for areas with 65,000+ population)
  # dataLag: 1 because ACS 1-year data for year Y is released in September of Y+1
  # releaseMonth: 9 because release happens in September
  # Example in March 2026: effectiveEnd = min(2026-1, 2026) = 2025, then month 3 < 9 → 2024
  acs1_year_range: &acs1_year_range
    type: yearRange
    start: "${GOVDATA_START_YEAR:2010}"
    # 2005, not 2006 (Defect Register B2-3): verified live against acs1_income/acs1_population,
    # rows run 2005-2024 (2020 absent -- ACS 1-Year wasn't fielded that year, a real gap, not
    # a bug). minYear is the informational floor below the 2010 default start, and per B2-3's
    # own note this should be the value any declared-coverage reporting derives its lower bound
    # from, rather than a hand-maintained figure that can drift from what's actually loaded.
    minYear: 2005
    dataLag: 1
    releaseMonth: 9

  # --- Year Range for Decennial Census (every 10 years from 2000) ---
  # Stepped cadence anchored at 2000: emits census (vintage) years 2000, 2010, 2020, ...
  # The `year` axis IS the vintage — what users query and what the tables partition on.
  # dataLag: 0 so effective_year == year == vintage (no publish-lag shift); a census not yet
  # published (e.g. 2030 before ~2032) fast-fails HTTP 404, handled by skipOn:[404] on each
  # decennial source. (Previously dataLag:2 stored the 2020 census under year=2018.)
  decennial_years: &decennial_years
    type: yearRange
    start: 2000            # cadence anchor (feed-began): aligns the decennial step at 2000/2010/2020
    minYear: "${GOVDATA_START_YEAR:2010}"   # global demarcation clamp (daily → current year)
    step: 10
    dataLag: 0             # vintage-axis: partition year = census year, not census year - lag

  # --- Geography Levels ---
  state_geography: &state_geography
    - state

  county_geography: &county_geography
    - county

  all_geographies: &all_geographies
    - state
    - county

  # All 50 states + DC FIPS codes (01-56, excluding 03, 07, 14, 43, 52)
  # Used by QWI and other Census API tables that require explicit state FIPS
  all_state_fips: &all_state_fips
    - '01'  # Alabama
    - '02'  # Alaska
    - '04'  # Arizona
    - '05'  # Arkansas
    - '06'  # California
    - '08'  # Colorado
    - '09'  # Connecticut
    - '10'  # Delaware
    - '11'  # District of Columbia
    - '12'  # Florida
    - '13'  # Georgia
    - '15'  # Hawaii
    - '16'  # Idaho
    - '17'  # Illinois
    - '18'  # Indiana
    - '19'  # Iowa
    - '20'  # Kansas
    - '21'  # Kentucky
    - '22'  # Louisiana
    - '23'  # Maine
    - '24'  # Maryland
    - '25'  # Massachusetts
    - '26'  # Michigan
    - '27'  # Minnesota
    - '28'  # Mississippi
    - '29'  # Missouri
    - '30'  # Montana
    - '31'  # Nebraska
    - '32'  # Nevada
    - '33'  # New Hampshire
    - '34'  # New Jersey
    - '35'  # New Mexico
    - '36'  # New York
    - '37'  # North Carolina
    - '38'  # North Dakota
    - '39'  # Ohio
    - '40'  # Oklahoma
    - '41'  # Oregon
    - '42'  # Pennsylvania
    - '44'  # Rhode Island
    - '45'  # South Carolina
    - '46'  # South Dakota
    - '47'  # Tennessee
    - '48'  # Texas
    - '49'  # Utah
    - '50'  # Vermont
    - '51'  # Virginia
    - '53'  # Washington
    - '54'  # West Virginia
    - '55'  # Wisconsin
    - '56'  # Wyoming

# ============================================================================
# MATERIALIZATION OPTIONS
# ============================================================================
# Default materialization settings for all tables
# ============================================================================

materializationDefaults:
  format: iceberg
  options:
    warehousePath: "${GOVDATA_PARQUET_DIR}/census"
    icebergTableName: "${TABLE_NAME}"
    catalogType: hadoop
    runCompaction: true
    compactionTargetFileSizeBytes: 134217728
    compactionMinFiles: 5
    # Iceberg-specific options
    partitionBy:
      - type
      - year
      - geography
    # Self-healing for empty results (requery after 7 days)
    emptyResultTtlDays: 7
    # Error retry after 1 day
    errorTtlDays: 1

# ============================================================================
# PARTITIONED TABLES
# ============================================================================

partitionedTables:

  # ---------------------------------------------------------------------------
  # ACS POPULATION - Total population and demographics
  # ---------------------------------------------------------------------------
  - name: acs_population
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      American Community Survey population demographics including total population,
      age, sex, race, and ethnicity. Provides population counts at state and county levels.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: Column expressions use conceptual names that are
      # normalized by CensusVariableNormalizer from API-specific variable codes
      # (e.g., B01001_001E for ACS, P1_001N for Decennial 2020)
      - name: total_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."total_population" AS BIGINT)'
        comment: Total population
      - name: male_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."male_population" AS BIGINT)'
        comment: Male population
      - name: female_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."female_population" AS BIGINT)'
        comment: Female population

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B01001_001E,B01001_002E,B01001_026E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
        # Census returns 2D array - CensusResponseTransformer handles conversion
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    # Custom hooks for Census response transformation and schema evolution
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "acs"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_population
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS INCOME - Household income statistics
  # ---------------------------------------------------------------------------
  - name: acs_income
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Household median income and per capita income from the ACS 5-Year survey,
      at state and county levels. A smoothed 5-year period estimate, published
      about 2 years behind the current year. For a more current but state-only,
      single-year estimate (wider margin of error) see acs1_income.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: Uses canonical name from CensusVariableNormalizer
      - name: median_household_income
        type: long
        nullable: true
        expression: 'TRY_CAST(src."median_household_income" AS BIGINT)'
        comment: Median household income in the past 12 months
      - name: per_capita_income
        type: long
        nullable: true
        expression: 'TRY_CAST(src."per_capita_income" AS BIGINT)'
        comment: Per capita income in the past 12 months

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B19013_001E,B19301_001E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    # Custom hooks for Census response transformation and schema evolution
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "acs"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_income
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS HOUSING - Housing unit statistics
  # ---------------------------------------------------------------------------
  - name: acs_housing
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Housing unit counts, occupancy status (occupied/vacant), median home value, and
      median gross rent from the ACS 5-Year survey, at state and county levels.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: Uses canonical names from CensusVariableNormalizer
      - name: total_housing_units
        type: long
        nullable: true
        expression: 'TRY_CAST(src."total_housing_units" AS BIGINT)'
        comment: Total housing units
      - name: occupied_units
        type: long
        nullable: true
        expression: 'TRY_CAST(src."occupied_housing_units" AS BIGINT)'
        comment: Occupied housing units
      - name: vacant_units
        type: long
        nullable: true
        expression: 'TRY_CAST(src."vacant_housing_units" AS BIGINT)'
        comment: Vacant housing units
      - name: median_home_value
        type: long
        nullable: true
        expression: 'TRY_CAST(src."median_home_value" AS BIGINT)'
        comment: Median value of owner-occupied housing units
      - name: median_rent
        type: long
        nullable: true
        expression: 'TRY_CAST(src."median_gross_rent" AS BIGINT)'
        comment: Median gross rent

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B25001_001E,B25002_002E,B25002_003E,B25077_001E,B25064_001E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    # Custom hooks for Census response transformation and schema evolution
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "acs"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_housing
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS EDUCATION - Educational attainment
  # ---------------------------------------------------------------------------
  - name: acs_education
    pattern: "type=acs/year=*/geography=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2012
      maxYear: 2023
      distinctYears: 12
      contiguous: true
      rowCount: 39272
      checkedAt: "2026-08-26T11:20:30Z"
    partitions: *standard_partitions
    comment: >
      Educational attainment counts for population 25 and over from the ACS 5-Year survey,
      at state and county levels — population 25+, high school diploma, bachelor's degree,
      master's degree, and doctorate. See the education_attainment view for derived rate
      percentages.

    dimensions:
      type:
        - acs
      # B15003 (educational attainment) was added to ACS5 in 2012; earlier years return
      # 400 "unknown variable 'B15003_001E'" (fatal — no skipOn here). minYear floors at 2012
      # (feed-began for this variable) while start follows the global demarcation. Same
      # dataLag/releaseMonth as the anchor.
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2014          # B15003 (educational attainment) undefined in ACS 5-year before 2014
        dataLag: 2             # (2012/2013 still error "unknown variable B15003_001E"; first complete 2014)
        releaseMonth: 12
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: Uses canonical names from CensusVariableNormalizer
      - name: pop_25_plus
        type: long
        nullable: true
        expression: 'TRY_CAST(src."population_25_and_over" AS BIGINT)'
        comment: Total population 25 years and over
      - name: hs_graduate
        type: long
        nullable: true
        expression: 'TRY_CAST(src."high_school_graduate" AS BIGINT)'
        comment: Regular high school diploma (excludes GED/equivalency)
      - name: bachelors
        type: long
        nullable: true
        expression: 'TRY_CAST(src."bachelor_degree" AS BIGINT)'
        comment: Bachelor's degree only (excludes higher degrees)
      - name: masters
        type: long
        nullable: true
        expression: 'TRY_CAST(src."masters_degree" AS BIGINT)'
        comment: Master's degree
      - name: doctorate
        type: long
        nullable: true
        expression: 'TRY_CAST(src."doctorate_degree" AS BIGINT)'
        comment: Doctorate degree

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B15003_001E,B15003_017E,B15003_022E,B15003_023E,B15003_025E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    # Custom hooks for Census response transformation and schema evolution
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "acs"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_education
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS EMPLOYMENT - Employment and labor force statistics
  # ---------------------------------------------------------------------------
  - name: acs_employment
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Labor force status counts (civilian labor force, employed, unemployed, not in labor
      force) from the ACS 5-Year survey, at state and county levels. Raw counts only — see
      the unemployment_rate view for derived unemployment and labor-force-participation
      percentages.

    dimensions:
      type:
        - acs
      year:
        <<: *acs_year_range
        minYear: 2013  # B23025 (employment status) undefined in ACS 5-year before 2013
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: Uses canonical names from CensusVariableNormalizer
      - name: labor_force
        type: long
        nullable: true
        expression: 'TRY_CAST(src."labor_force_participation" AS BIGINT)'
        comment: Civilian labor force (population 16 years and over)
      - name: employed
        type: long
        nullable: true
        expression: 'TRY_CAST(src."employed_population" AS BIGINT)'
        comment: Employed (civilian labor force)
      - name: unemployed
        type: long
        nullable: true
        expression: 'TRY_CAST(src."unemployed_population" AS BIGINT)'
        comment: Unemployed (civilian labor force)
      - name: not_in_labor_force
        type: long
        nullable: true
        expression: 'TRY_CAST(src."not_in_labor_force" AS BIGINT)'
        comment: Not in labor force

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B23025_002E,B23025_004E,B23025_005E,B23025_007E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    # Custom hooks for Census response transformation and schema evolution
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "acs"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_employment
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # ACS POVERTY - Poverty statistics
  # ---------------------------------------------------------------------------
  - name: acs_poverty
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Poverty universe (population for whom poverty status is determined) and count below
      poverty level from the ACS 5-Year survey, at state and county levels. Raw counts only,
      with no demographic breakdown — see the poverty_rate view for the derived poverty
      percentage.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: Uses canonical names from CensusVariableNormalizer
      - name: poverty_universe
        type: long
        nullable: true
        expression: 'TRY_CAST(src."total_population_poverty_determined" AS BIGINT)'
        comment: Population for whom poverty status is determined (excludes institutionalized, military, unrelated children under 15)
      - name: below_poverty
        type: long
        nullable: true
        expression: 'TRY_CAST(src."below_poverty_level" AS BIGINT)'
        comment: Income below poverty level in past 12 months

    # HTTP Source configuration for EtlPipeline
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B17001_001E,B17001_002E&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    # Custom hooks for Census response transformation and schema evolution
    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "acs"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_poverty
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ---------------------------------------------------------------------------
  # DECENNIAL POPULATION - Unified table for 2000, 2010, 2020
  # ---------------------------------------------------------------------------
  # Single table with conformed schema across all census years.
  # Uses CensusDecennialDimensionResolver to provide year-specific:
  #   - dataset: sf1 (2000/2010) vs pl (2020)
  #   - variables: P001001,... (2000/2010) vs P1_001N,... (2020)
  # CensusVariableNormalizer maps all variants to canonical column names.
  # ---------------------------------------------------------------------------
  - name: decennial_population
    pattern: "type=decennial/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Decennial Census total population plus White/Black/Asian-alone race counts, at state
      and county levels, for census years 2000, 2010, and 2020 (every 10 years). Unified
      schema across all years with columns normalized to canonical names regardless of
      year-specific API variable codes (P001001 vs P1_001N, etc.).

    dimensions:
      type:
        - decennial
      year: *decennial_years
      dataset:
        type: custom
      variables:
        type: custom
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      # Schema Evolution: CensusVariableNormalizer maps year-specific variables
      # (P001001/P1_001N) to canonical names (total_population)
      - name: total_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."total_population" AS BIGINT)'
        comment: Total population
      - name: white_alone
        type: long
        nullable: true
        expression: 'TRY_CAST(src."white_alone" AS BIGINT)'
        comment: Population identifying as White alone
      - name: black_alone
        type: long
        nullable: true
        expression: 'TRY_CAST(src."black_african_american_alone" AS BIGINT)'
        comment: Population identifying as Black or African American alone
      - name: asian_alone
        type: long
        nullable: true
        expression: 'TRY_CAST(src."asian_alone" AS BIGINT)'
        comment: Population identifying as Asian alone

    source:
      type: http
      # URL uses resolved {dataset} and {variables} based on year
      url: "https://api.census.gov/data/{year}/dec/{dataset}?get=NAME,{variables}&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        skipOn: [404]          # a not-yet-published decennial (e.g. 2030 before ~2032) 404s; skip, don't fail
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      variableNormalizer: "org.apache.calcite.adapter.file.etl.MappingFileVariableNormalizer"
      variableNormalizerConfig:
        mappingFile: "census/census-variable-mappings.json"
        defaultType: "decennial"
      dimensionResolver: "org.apache.calcite.adapter.govdata.census.CensusDecennialDimensionResolver"

    materialize:
      format: iceberg
      output:
        pattern: "type=decennial/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: decennial_population
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

