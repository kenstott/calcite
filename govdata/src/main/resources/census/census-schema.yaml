        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B25007_003M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B25007_003M" AS BIGINT) END'
        comment: 90% CI margin of error for owner_15_to_24 (Census variable B25007_003M; negative sentinels normalized to null)
      - name: owner_25_to_34
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B25007_004E" AS BIGINT)'
        comment: Owner-occupied units where householder is 25 to 34 years
      - name: owner_25_to_34_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B25007_004M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B25007_004M" AS BIGINT) END'
        comment: 90% CI margin of error for owner_25_to_34 (Census variable B25007_004M; negative sentinels normalized to null)
      - name: owner_35_to_44
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B25007_005E" AS BIGINT)'
        comment: Owner-occupied units where householder is 35 to 44 years
      - name: owner_35_to_44_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B25007_005M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B25007_005M" AS BIGINT) END'
        comment: 90% CI margin of error for owner_35_to_44 (Census variable B25007_005M; negative sentinels normalized to null)
      - name: owner_45_to_54
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B25007_006E" AS BIGINT)'
        comment: Owner-occupied units where householder is 45 to 54 years
      - name: owner_45_to_54_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B25007_006M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B25007_006M" AS BIGINT) END'
