      - name: median_household_income
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19013_001E" AS BIGINT)'
        comment: Median household income
      - name: median_household_income_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B19013_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B19013_001M" AS BIGINT) END'
        comment: 90% CI margin of error for median_household_income (Census variable B19013_001M; negative sentinels normalized to null)
      - name: per_capita_income
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19301_001E" AS BIGINT)'
