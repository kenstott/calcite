  # ---------------------------------------------------------------------------
  # ACS NATIVITY - Nativity and citizenship status
  # ---------------------------------------------------------------------------
  - name: acs_nativity
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Population counts by nativity and citizenship (native born, foreign born, naturalized
      citizen, not a citizen), from the ACS 5-Year survey, at state and county levels.
      native_born and foreign_born are both derived sums (B05001 has no single variable for
      either concept): native_born = born_in_us + born_in_pr_island_areas +
      born_abroad_american_parents (002+003+004), foreign_born = naturalized_citizen +
      not_a_citizen (005+006). The three native_born components are also exposed as their own
      columns — born_in_pr_island_areas in particular is analytically live on its own (most of
      Florida's Puerto Rico-born population), not just a summand. The full row identity is
      native_born + foreign_born = total_population, and at the component level
      born_in_us + born_in_pr_island_areas + born_abroad_american_parents + naturalized_citizen +
      not_a_citizen = total_population; both are DQ-asserted.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      - name: total_population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_001E" AS BIGINT)'
        comment: Total population
      - name: total_population_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_001M" AS BIGINT) END'
        comment: 90% CI margin of error for total_population (Census variable B05001_001M; negative sentinels normalized to null)
      - name: native_born
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_002E" AS BIGINT) + TRY_CAST(src."B05001_003E" AS BIGINT) + TRY_CAST(src."B05001_004E" AS BIGINT)'
        comment: Native born (born in the US, plus Puerto Rico/island areas, plus abroad of American parents — sum of its three real components rather than a residual)
      - name: native_born_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_002M" AS BIGINT) < 0 OR TRY_CAST(src."B05001_003M" AS BIGINT) < 0 OR TRY_CAST(src."B05001_004M" AS BIGINT) < 0 THEN NULL ELSE CAST(ROUND(SQRT(POWER(TRY_CAST(src."B05001_002M" AS DOUBLE), 2) + POWER(TRY_CAST(src."B05001_003M" AS DOUBLE), 2) + POWER(TRY_CAST(src."B05001_004M" AS DOUBLE), 2))) AS BIGINT) END'
        comment: 90% CI margin of error for native_born, aggregated per Census MOE-of-a-sum convention (sqrt of sum of squared component MOEs — B05001_002M/003M/004M; negative sentinels on any component normalize the whole value to null)
      - name: born_in_us
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_002E" AS BIGINT)'
        comment: Born in the United States (Census variable B05001_002E) — the largest component of native_born, exposed directly rather than only summed
      - name: born_in_us_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_002M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_002M" AS BIGINT) END'
        comment: 90% CI margin of error for born_in_us (Census variable B05001_002M; negative sentinels normalized to null)
      - name: born_in_pr_island_areas
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_003E" AS BIGINT)'
        comment: Born in Puerto Rico or a US island area (Census variable B05001_003E) — analytically live on its own, not just a native_born component
      - name: born_in_pr_island_areas_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_003M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_003M" AS BIGINT) END'
        comment: 90% CI margin of error for born_in_pr_island_areas (Census variable B05001_003M; negative sentinels normalized to null)
      - name: born_abroad_american_parents
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_004E" AS BIGINT)'
        comment: Born abroad of American parent(s) (Census variable B05001_004E)
      - name: born_abroad_american_parents_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_004M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_004M" AS BIGINT) END'
        comment: 90% CI margin of error for born_abroad_american_parents (Census variable B05001_004M; negative sentinels normalized to null)
      - name: foreign_born
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_005E" AS BIGINT) + TRY_CAST(src."B05001_006E" AS BIGINT)'
        comment: Foreign born (naturalized citizens plus non-citizens; there is no single Census variable for this concept)
      - name: foreign_born_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_006M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_006M" AS BIGINT) END'
        comment: 90% CI margin of error for foreign_born (Census variable B05001_006M; negative sentinels normalized to null)
      - name: naturalized_citizen
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_005E" AS BIGINT)'
        comment: Naturalized US citizen
      - name: naturalized_citizen_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_005M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_005M" AS BIGINT) END'
        comment: 90% CI margin of error for naturalized_citizen (Census variable B05001_005M; negative sentinels normalized to null)
      - name: not_a_citizen
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B05001_006E" AS BIGINT)'
        comment: Not a US citizen

      - name: not_a_citizen_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B05001_006M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B05001_006M" AS BIGINT) END'
        comment: 90% CI margin of error for not_a_citizen (Census variable B05001_006M; negative sentinels normalized to null)
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs5?get=NAME,B05001_001E,B05001_001M,B05001_002E,B05001_002M,B05001_003E,B05001_003M,B05001_004E,B05001_004M,B05001_005E,B05001_005M,B05001_006E,B05001_006M&for={geography}:*&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=acs/year=*/geography=*/"
      partition:
        columns: [type, year, geography]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: acs_nativity
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

