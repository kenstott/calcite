      - name: per_capita_income_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B19301_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B19301_001M" AS BIGINT) END'
        comment: 90% CI margin of error for per_capita_income (Census variable B19301_001M; negative sentinels normalized to null)
    source:
      type: http
      url: "https://api.census.gov/data/{effective_year}/acs/acs1?get=NAME,B19013_001E,B19013_001M,B19301_001E,B19301_001M&for={geography}:*&key={env:CENSUS_API_KEY}"
