        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B25007_002M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B25007_002M" AS BIGINT) END'
        comment: 90% CI margin of error for owner_occupied (Census variable B25007_002M; negative sentinels normalized to null)
      - name: owner_15_to_24
