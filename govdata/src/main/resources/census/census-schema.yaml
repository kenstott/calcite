  - name: acs_income_distribution
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Household counts by ACS income bracket (under $10k through $200k+) plus
      total households and the Gini index of income inequality, from the ACS
      5-Year survey at state and county levels.

    dimensions:
      type:
        - acs
      year:
        <<: *acs_year_range
        minYear: 2012  # B19083 (Gini index) undefined in ACS 5-year before 2012
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      - name: total_households
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19001_001E" AS BIGINT)'
        comment: Total households
      - name: total_households_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B19001_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B19001_001M" AS BIGINT) END'
        comment: 90% CI margin of error for total_households (Census variable B19001_001M; negative sentinels normalized to null)
      - name: income_under_10k
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B19001_002E" AS BIGINT)'
        comment: Households with income under $10,000
      - name: income_under_10k_moe
