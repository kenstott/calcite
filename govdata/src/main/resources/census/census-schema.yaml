  # ---------------------------------------------------------------------------
  # ACS HOUSING TENURE BY AGE OF HOUSEHOLDER - Owner/renter counts by age band
  # ---------------------------------------------------------------------------
  - name: acs_housing_tenure_by_age
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Occupied housing unit counts split by tenure (owner-occupied vs renter-occupied)
      and age of householder, from ACS 5-year table B25007 ("Tenure by Age of
      Householder"), at state and county levels. Age bands match B25007's published
      structure: 15-24, 25-34, 35-44, 45-54, 55-59, 60-64, 65-74, 75-84, 85+ (nine
      bands, identical for owners and renters). Lets a generation-cohort ownership
      analysis be computed directly in-engine — same age band, same vintage — rather
      than relying on third-party CPS reprocessing. A true generation-matched
      historical series still requires stitching multiple ACS vintages across the
      cohort's aging trajectory; this table exposes the single-vintage building
      block.

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography: *all_geographies

    columns:
      - *name_column
      - *state_column
      - *county_column
