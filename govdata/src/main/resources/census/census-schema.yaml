# ============================================================================
# POPULATION ESTIMATES PROGRAM (PEP)
# Annual population estimates between decennial censuses
# ============================================================================

  # ---------------------------------------------------------------------------
  # PEP POPULATION - Annual population estimates by state/county
  # ---------------------------------------------------------------------------
  - name: pep_population
    pattern: "type=pep/year=*/geography=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2019
      maxYear: 2023
      distinctYears: 4
      contiguous: false
      years: [2019, 2021, 2022, 2023]
      rowCount: 13094
      checkedAt: "2026-08-26T11:20:29Z"
    partitions: *standard_partitions
    comment: >
      Population Estimates Program (PEP) annual population estimate, at state and county
      levels, for the years between decennial censuses. Data years <= 2020 come from the
      pep/population dataset (which also includes a population density column for those
      years); data years >= 2021 come from the shared latest pep/charv vintage (population
      only). The vintage column identifies which of the two source datasets produced each
      row, so the two never double-claim a data year. KNOWN GAP: year 2020 itself is absent
      from production despite being within the pep/population vintage's range — see
      observedCoverage below (contiguous: false) before assuming a query over 2019-2021 has
      every year.

    dimensions:
      type:
        - pep
      year:
        type: yearRange
        # Floor is a literal 2022 (NOT ${GOVDATA_START_YEAR}): with dataLag=3 this yields data
        # years 2019-2023 — the only range the PEP API serves cleanly (charv vintage 2023 covers
        # 2021-2023; pep/population for 2019-2020). Pre-2019 vintages use different variable
        # names and are intentionally excluded. Bump the floor when CURRENT_VINTAGE advances in
        # the resolver.
        start: 2022
        end: "${GOVDATA_END_YEAR:current}"
        dataLag: 3
        descending: true
      geography: *all_geographies
      # Dynamic dimensions resolved per data year by CensusPepDimensionResolver. dataLag here
      # MUST match the year dimension's dataLag above — the resolver reads it to derive the data year.
      endpoint:
        type: custom
        dataLag: 3
      variables:
        type: custom
        dataLag: 3
      vintage:
        type: custom
        dataLag: 3
      year_filter:
        type: custom
        dataLag: 3

    columns:
      - *name_column
      - *state_column
      - *county_column
      - *county_fips_column
      - name: population
        type: long
        nullable: true
        expression: 'TRY_CAST(src."POP" AS BIGINT)'
        comment: Total population estimate
      - name: density
        type: double
        nullable: true
        expression: 'TRY_CAST(src."DENSITY" AS DOUBLE)'
        comment: Population density (only for pep/population data years, i.e. <= 2020)
      - name: vintage
        type: string
        nullable: true
        expression: '{vintage}'
        comment: >
          PEP data vintage used to fetch this row: either the data year itself
          (pep/population, data years <= 2020) or the shared latest published
          vintage (pep/charv, data years >= 2021). Distinguishes the two source
          datasets so a data year is never ambiguous between them.

    source:
      type: http
      url: "https://api.census.gov/data/{vintage}/{endpoint}?get=NAME,{variables}&for={geography}:*{year_filter}&key={env:CENSUS_API_KEY}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.geo.CensusResponseTransformer"
      dimensionResolver: "org.apache.calcite.adapter.govdata.census.CensusPepDimensionResolver"

    materialize:
      format: iceberg
      output:
        pattern: "type=pep/year=*/geography=*/"
      partition:
        columns: [type, year, geography, vintage]
      iceberg:
        warehousePath: "${GOVDATA_PARQUET_DIR}/census"
        tableName: pep_population
        runMaintenance: true
        snapshotRetentionDays: 7
        catalogType: hadoop
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5
        overwritePartitions: true

