  # ---------------------------------------------------------------------------
  # ACS EARNINGS BY EDUCATION - Median earnings by sex and educational attainment (B20004)
  # ---------------------------------------------------------------------------
  - name: acs_earnings_by_education
    pattern: "type=acs/year=*/geography=*/*.parquet"
    partitions: *standard_partitions
    comment: >
      Median earnings in the past 12 months by sex and educational attainment, for
      the population 25 years and over, from the ACS 5-Year survey table B20004,
      state level only (no county breakout — the table is fetched with
      for=state:*, unlike most other acs_* tables in this schema which also carry
      a county grain). Reports total, male, and female median earnings (dollars)
      at 6 attainment levels: less than high school, high school graduate
      (includes equivalency), some college or associate's degree, bachelor's
      degree, and graduate or professional degree. Complements acs_education
      (population counts by attainment, no earnings) and acs_income (household
      income, not tied to the householder's own educational attainment).

    dimensions:
      type:
        - acs
      year: *acs_year_range
      geography:
        - state

    columns:
      - *name_column
      - *state_column
      - name: median_earnings_total
        type: long
        nullable: true
        expression: 'TRY_CAST(src."B20004_001E" AS BIGINT)'
        comment: Median earnings, total population 25+ with earnings
      - name: median_earnings_total_moe
        type: bigint
        nullable: true
        expression: 'CASE WHEN TRY_CAST(src."B20004_001M" AS BIGINT) < 0 THEN NULL ELSE TRY_CAST(src."B20004_001M" AS BIGINT) END'
        comment: 90% CI margin of error for median_earnings_total (Census variable B20004_001M; negative sentinels normalized to null)
      - name: median_earnings_less_than_hs
