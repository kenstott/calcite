# CONSTRAINTS
# ============================================================================

constraints:

  candidates:
    primaryKey: [type, year, candidate_id]
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: Links candidate state to geographic state data
      - columns: [cd_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: congressional_districts
        targetColumns: [cd_fips]
        comment: Links House candidates to congressional district geography via enriched cd_fips (state_fips + zero-padded district)
      - columns: [principal_committee_id]
        targetTable: committees
        targetColumns: [committee_id]
        comment: Links candidate to principal campaign committee (CAND_PCC)
      - columns: [zip]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
