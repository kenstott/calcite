      record. filer_id is the join key to ca_contributions.committee_id and
      ca_expenditures.committee_id. Source: Cal-Access full-database export,
      FILERNAME_CD.TSV member. Not a strict 1-row-per-filer table — a filer with a name or
      status change over time carries multiple rows (xref_filer_id + effective_date vary).
      A small number of source rows (<0.01%) have a NULL xref_filer_id/filer_id — a known
      Cal-Access export data-quality gap, not a transform defect.

