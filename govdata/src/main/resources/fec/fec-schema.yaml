        type: string
        nullable: true
        comment: Filer name suffix
        source: NAMS
      - name: address1
        type: string
        nullable: true
        comment: Address line 1
        source: ADR1
      - name: address2
        type: string
        nullable: true
        comment: Address line 2
        source: ADR2
      - name: city
        type: string
        nullable: true
        comment: >
          City — Cal-Access occasionally concatenates "CITY, ST ZIP" into this field rather
          than populating state/zip separately (observed live in sampled rows); carried as-is.
        source: CITY
      - name: state
        type: string
        nullable: true
        comment: State
        source: ST
      - name: zip
        type: string
        nullable: true
        comment: ZIP code
        source: ZIP4
      - name: phone
        type: string
        nullable: true
        comment: Phone number
        source: PHON
      - name: fax
        type: string
        nullable: true
        comment: Fax number
        source: FAX
      - name: email
        type: string
        nullable: true
        comment: Email address
        source: EMAIL

    source:
      type: http
      url: "https://campaignfinance.cdn.sos.ca.gov/dbwebexport.zip"
      method: GET
      extractPattern: "*/FILERNAME_CD.TSV"
      response:
        format: csv
        delimiter: "\t"
        quoted: false
        hasHeader: true
        pagination:
          type: CSV_STREAM
          pageSize: 2000
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=ca_filers/"
      partition:
        columns: [type]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
        emptyResultTtlMillis: 86400000
      iceberg:
        catalogType: hadoop
        overwritePartitions: true
        batchPartitionColumns: [type]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

