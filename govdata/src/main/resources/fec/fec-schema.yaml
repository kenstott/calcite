# ============================================================================
# Federal Election Commission (FEC) Campaign Finance Schema
# ============================================================================
# Comprehensive campaign finance data from FEC bulk downloads:
#   - Candidates (cn): All federal candidates
#   - Committees (cm): All political committees (PACs, party, campaign)
#   - Candidate-Committee Linkages (ccl): Which committees support which candidates
#   - Individual Contributions (indiv): Itemized individual contributions
#   - Committee-to-Candidate (pas2): Contributions from committees to candidates
#   - Inter-Committee Transactions (oth): Transfers between committees
#   - Operating Expenditures (oppexp): Committee operating expenditures
#   - Independent Expenditures (independent_expenditure): IE spending
#   - Electioneering Communications (ElectioneeringComm): Broadcast ads
#   - Communication Costs (CommunicationCosts): Internal communications
#   - Candidate Summaries (candidate_summary): Aggregated financial totals
#   - Committee Summaries (committee_summary): Aggregated financial totals
#
# FEC Bulk Download Format:
#   - Core files: pipe-delimited (|), NO header rows, inside ZIP archives
#   - Summary/IE files: CSV with headers
#   - URL pattern: https://www.fec.gov/files/bulk-downloads/{YEAR}/{file}.zip
#   - Election cycles: even-numbered years (1980-2030)
#   - Header definitions: https://www.fec.gov/campaign-finance-data/
#
# Cross-Schema References:
#   - geo: state FIPS, congressional districts
#   - sec/ref: corporate PAC linkage via committee treasurer/connected org
# ============================================================================

schemaName: "${SCHEMA_NAME:fec}"
workerTimeoutMinutes: 480
materializeDirectory: "${GOVDATA_PARQUET_DIR}"

comment: >
  Federal Election Commission campaign finance data. Contains candidate and
  committee registrations, itemized contributions, expenditures, and inter-committee
  transfers. Covers all federal elections (President, Senate, House) with data
  from 1980 to present. Bulk downloads are pipe-delimited files with no headers.

# ============================================================================
# DIMENSION TEMPLATES
# ============================================================================
# FEC uses even-numbered election cycle years (not yearRange which generates
# consecutive years). Define as explicit YAML list for proper expansion.

dimension_templates:

  fec_year_dimension: &fec_year_dimension
    type: yearRange
    start: 2010
    cadenceStart: 2010
    cadenceLength: 2
    # A literal, not "${GOVDATA_START_YEAR:...}" - minYear is a floor describing what the
    # source has, not the run's own window (that's `start`, above). Binding it to the same
    # run-window variable meant any process that exported GOVDATA_START_YEAR above 2010 for
    # an unrelated reason silently raised this clamp too (DimensionIterator.resolveRange only
    # ever raises `start` to meet minYear, never lowers it) - permanently excluding whatever
    # years fell below it from that run, with no tracker row and no error. 1980 is the real
    # floor for every table that shares this anchor (fec.gov bulk-downloads indiv80.zip etc.
    # confirmed live 2026-09-10); it's a safe minimum for the 3 tables whose own files only
    # start at 2010 (independent_expenditures, electioneering_communications,
    # communication_costs) since minYear only ever raises `start`, never lowers it below what
    # a table's own `start`/`cadenceStart` already requests.
    minYear: 1980

# ============================================================================
# BULK DOWNLOADS
# ============================================================================

bulkDownloads:

  # Candidates master file — all federal candidates
  fec_candidates:
    cachePattern: "fec/type=fec_bulk/year={year}/cn{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/cn{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

  # Committees master file — all political committees
  fec_committees:
    cachePattern: "fec/type=fec_bulk/year={year}/cm{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/cm{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

  # Candidate-Committee linkages
  fec_linkages:
    cachePattern: "fec/type=fec_bulk/year={year}/ccl{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/ccl{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

  # Individual contributions (largest file, ~1-2GB per cycle)
  fec_individual:
    cachePattern: "fec/type=fec_bulk/year={year}/indiv{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/indiv{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

  # Committee-to-candidate contributions
  fec_pas2:
    cachePattern: "fec/type=fec_bulk/year={year}/pas2{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/pas2{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

  # Inter-committee transactions (other)
  fec_oth:
    cachePattern: "fec/type=fec_bulk/year={year}/oth{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/oth{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

  # Operating expenditures
  fec_oppexp:
    cachePattern: "fec/type=fec_bulk/year={year}/oppexp{yearSuffix}.zip"
    url: "https://www.fec.gov/files/bulk-downloads/{year}/oppexp{yearSuffix}.zip"
    dimensions:
      year:
        <<: *fec_year_dimension

# ============================================================================
# COLUMN TEMPLATES
# ============================================================================

column_templates:

  # --- Cal-Access shared columns (RCPT/EXPN carry the same denormalized race columns) ---
  # Individual per-column anchors, not a grouped-list anchor: ColumnConfig.fromList (file/etl)
  # only accepts Map items from a table's columns: list and silently skips anything else, so
  # `- *someListAnchor` (a list nested inside the columns list) would silently drop every column
  # in the group with no error. Matches the single-column-anchor convention already used above
  # (candidate_id_column, etc.) rather than inventing a group-splice pattern SnakeYAML doesn't
  # actually support for sequences.

  ca_filing_id_column: &ca_filing_id_column
    name: filing_id
    type: long
    nullable: false
    comment: Cal-Access filing ID (PK component; joins across all CA tables)
    source: FILING_ID

  ca_amend_id_column: &ca_amend_id_column
    name: amend_id
    type: integer
    nullable: false
    comment: Amendment sequence (0 = original filing)
    source: AMEND_ID

  ca_line_item_column: &ca_line_item_column
    name: line_item
    type: integer
    nullable: false
    comment: Line item number within the filing's schedule
    source: LINE_ITEM

  ca_rec_type_column: &ca_rec_type_column
    name: rec_type
    type: string
    nullable: true
    comment: Record type — constant per file (RCPT in RCPT_CD, EXPN in EXPN_CD, S496 in S496_CD)
    source: REC_TYPE

  ca_form_type_column: &ca_form_type_column
    name: form_type
    type: string
    nullable: true
    comment: Schedule/form code (A=contributions, E=expenditures, F496=late IE, ...)
    source: FORM_TYPE

  ca_transaction_id_column: &ca_transaction_id_column
    name: transaction_id
    type: string
    nullable: true
    comment: Filer-assigned transaction ID
    source: TRAN_ID

  ca_entity_type_column: &ca_entity_type_column
    name: entity_type
    type: string
    nullable: true
    comment: >
      Entity code (IND=individual, COM=committee, OTH=other, PTY=party,
      SCC=small contributor committee). Always NULL on ca_independent_expenditures —
      S496_CD has no ENTITY_CD column in the source.
    source: ENTITY_CD

  ca_treasurer_name_last_column: &ca_treasurer_name_last_column
    name: treasurer_name_last
    type: string
    nullable: true
    comment: Committee treasurer last name
    source: TRES_NAML

  ca_treasurer_name_first_column: &ca_treasurer_name_first_column
    name: treasurer_name_first
    type: string
    nullable: true
    comment: Committee treasurer first name
    source: TRES_NAMF

  ca_treasurer_name_title_column: &ca_treasurer_name_title_column
    name: treasurer_name_title
    type: string
    nullable: true
    comment: Committee treasurer name title
    source: TRES_NAMT

  ca_treasurer_name_suffix_column: &ca_treasurer_name_suffix_column
    name: treasurer_name_suffix
    type: string
    nullable: true
    comment: Committee treasurer name suffix
    source: TRES_NAMS

  ca_treasurer_city_column: &ca_treasurer_city_column
    name: treasurer_city
    type: string
    nullable: true
    comment: Treasurer address city
    source: TRES_CITY

  ca_treasurer_state_column: &ca_treasurer_state_column
    name: treasurer_state
    type: string
    nullable: true
    comment: Treasurer address state
    source: TRES_ST

  ca_treasurer_zip_column: &ca_treasurer_zip_column
    name: treasurer_zip
    type: string
    nullable: true
    comment: Treasurer address ZIP
    source: TRES_ZIP4

  ca_candidate_name_last_column: &ca_candidate_name_last_column
    name: candidate_name_last
    type: string
    nullable: true
    comment: Candidate last name (denormalized race context for this item)
    source: CAND_NAML

  ca_candidate_name_first_column: &ca_candidate_name_first_column
    name: candidate_name_first
    type: string
    nullable: true
    comment: Candidate first name
    source: CAND_NAMF

  ca_candidate_name_title_column: &ca_candidate_name_title_column
    name: candidate_name_title
    type: string
    nullable: true
    comment: Candidate name title
    source: CAND_NAMT

  ca_candidate_name_suffix_column: &ca_candidate_name_suffix_column
    name: candidate_name_suffix
    type: string
    nullable: true
    comment: Candidate name suffix
    source: CAND_NAMS

  ca_office_code_column: &ca_office_code_column
    name: office_code
    type: string
    nullable: true
    comment: Office sought code (e.g. ASM=Assembly, SEN=Senate, GOV=Governor)
    source: OFFICE_CD

  ca_office_description_column: &ca_office_description_column
    name: office_description
    type: string
    nullable: true
    comment: Office sought description (e.g. STATE ASSEMBLY, STATE SENATE)
    source: OFFIC_DSCR

  ca_jurisdiction_code_column: &ca_jurisdiction_code_column
    name: jurisdiction_code
    type: string
    nullable: true
    comment: Jurisdiction code (ST=statewide, ASM/SEN district, local)
    source: JURIS_CD

  ca_jurisdiction_description_column: &ca_jurisdiction_description_column
    name: jurisdiction_description
    type: string
    nullable: true
    comment: Jurisdiction description
    source: JURIS_DSCR

  ca_district_number_column: &ca_district_number_column
    name: district_number
    type: string
    nullable: true
    comment: Legislative district number (for Assembly/Senate races)
    source: DIST_NO

  ca_office_seat_holder_code_column: &ca_office_seat_holder_code_column
    name: office_seat_holder_code
    type: string
    nullable: true
    comment: Office sought/held indicator
    source: OFF_S_H_CD

  ca_ballot_measure_name_column: &ca_ballot_measure_name_column
    name: ballot_measure_name
    type: string
    nullable: true
    comment: Ballot measure name (for ballot-measure committees)
    source: BAL_NAME

  ca_ballot_measure_number_column: &ca_ballot_measure_number_column
    name: ballot_measure_number
    type: string
    nullable: true
    comment: Ballot measure number
    source: BAL_NUM

  ca_ballot_measure_jurisdiction_column: &ca_ballot_measure_jurisdiction_column
    name: ballot_measure_jurisdiction
    type: string
    nullable: true
    comment: Ballot measure jurisdiction
    source: BAL_JURIS

  ca_support_oppose_column: &ca_support_oppose_column
    name: support_oppose
    type: string
    nullable: true
    comment: Support/oppose indicator (S=support, O=oppose) for candidate/measure items
    source: SUP_OPP_CD

  ca_memo_code_column: &ca_memo_code_column
    name: memo_code
    type: string
    nullable: true
    comment: Memo code (item is informational, not counted in totals)
    source: MEMO_CODE

  ca_memo_refno_column: &ca_memo_refno_column
    name: memo_refno
    type: string
    nullable: true
    comment: Memo reference number (links memo item to parent transaction)
    source: MEMO_REFNO

  ca_back_reference_transaction_id_column: &ca_back_reference_transaction_id_column
    name: back_reference_transaction_id
    type: string
    nullable: true
    comment: Back-reference transaction ID (amendment linkage)
    source: BAKREF_TID

  ca_xref_schedule_column: &ca_xref_schedule_column
    name: xref_schedule
    type: string
    nullable: true
    comment: Cross-reference schedule name
    source: XREF_SCHNM

  ca_xref_match_column: &ca_xref_match_column
    name: xref_match
    type: string
    nullable: true
    comment: Cross-reference match indicator
    source: XREF_MATCH

  # --- Candidate Columns ---

  candidate_id_column: &candidate_id_column
    name: candidate_id
    type: string
    nullable: false
    comment: FEC candidate ID (e.g., H0AL01234, S0AK00567, P80000722)
    source: CAND_ID

  candidate_name_column: &candidate_name_column
    name: candidate_name
    type: string
    nullable: true
    comment: Candidate name (LAST, FIRST MIDDLE)
    source: CAND_NAME

  candidate_party_column: &candidate_party_column
    name: party
    type: string
    nullable: true
    comment: Party affiliation (DEM, REP, LIB, GRN, IND, etc.)
    source: CAND_PTY_AFFILIATION

  candidate_office_column: &candidate_office_column
    name: office
    type: string
    nullable: true
    comment: Office sought (H=House, S=Senate, P=President)
    source: CAND_OFFICE

  candidate_state_column: &candidate_state_column
    name: state
    type: string
    nullable: true
    comment: Two-letter state abbreviation (US postal code)
    source: CAND_OFFICE_ST

  candidate_district_column: &candidate_district_column
    name: district
    type: string
    nullable: true
    comment: Congressional district number (00 for at-large/Senate/President)
    source: CAND_OFFICE_DISTRICT

  election_year_column: &election_year_column
    name: election_year
    type: integer
    nullable: true
    comment: Election year (even-numbered)
    source: CAND_ELECTION_YR

  # --- Committee Columns ---

  committee_id_column: &committee_id_column
    name: committee_id
    type: string
    nullable: false
    comment: FEC committee ID (e.g., C00000042)
    source: CMTE_ID

  committee_name_column: &committee_name_column
    name: committee_name
    type: string
    nullable: true
    comment: Committee name
    source: CMTE_NM

  committee_type_column: &committee_type_column
    name: committee_type
    type: string
    nullable: true
    comment: >
      Committee type code: H=House, S=Senate, P=Presidential, D=Delegate,
      U=Single-candidate independent, V=PAC with non-contribution account,
      W=PAC with non-contribution account (nonqualified), X=Party nonqualified,
      Y=Party qualified, Z=National party nonfederal, N=PAC nonqualified,
      Q=PAC qualified, I=Independent expenditure filer (person), C=Communication cost filer,
      E=Independent expenditure filer (not a committee), O=Super PAC
    source: CMTE_TP

  # --- Transaction Columns ---

  transaction_date_column: &transaction_date_column
    name: transaction_date
    type: date
    nullable: true
    comment: Transaction date
    source: TRANSACTION_DT
    dateFormat: MMDDYYYY_OR_SLASH

  amount_column: &amount_column
    name: amount
    type: double
    nullable: true
    comment: Transaction amount in USD (negative for refunds)
    source: TRANSACTION_AMT

  # --- Filing Columns ---

  fec_election_year_column: &fec_election_year_column
    name: fec_election_year
    type: integer
    nullable: true
    comment: FEC election year for this record
    source: FEC_ELECTION_YR

  filing_id_column: &filing_id_column
    name: filing_id
    type: long
    nullable: true
    comment: FEC filing ID number
    source: FILE_NUM

  amendment_indicator_column: &amendment_indicator_column
    name: amendment_indicator
    type: string
    nullable: true
    comment: Amendment indicator (N=new, A=amendment, T=termination)
    source: AMNDT_IND

# ============================================================================
# PARTITIONED TABLES
# ============================================================================

partitionedTables:

  # ==========================================================================
  # CANDIDATES — Federal candidate registrations
  # ==========================================================================
  - name: candidates
    pattern: "type=candidates/year={year}/candidates.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2026
      distinctYears: 9
      contiguous: false
      years: [2010, 2012, 2014, 2016, 2018, 2020, 2022, 2024, 2026]
      rowCount: 65750
      checkedAt: "2026-09-16T22:01:48Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER

    comment: >
      All federal candidates registered with the FEC. Includes candidate ID,
      name, party, office sought, state, district, incumbent/challenger status,
      and principal campaign committee. One record per candidate per election cycle.
      Source: cn{YY}.zip bulk download (pipe-delimited, no header).

    columns:
      - *candidate_id_column
      - *candidate_name_column
      - name: party
        type: string
        nullable: true
        comment: Party affiliation code (DEM, REP, LIB, GRN, IND, etc.)
        source: CAND_PTY_AFFILIATION
      - *candidate_office_column
      - *candidate_state_column
      - *candidate_district_column
      - name: cd_fips
        type: string
        nullable: true
        comment: >
          Enriched 4-digit congressional-district FIPS (state_fips + zero-padded district) —
          FK to geo.congressional_districts.cd_fips. Computed at materialization for House
          candidates only (office=H); NULL for Senate/President/unmapped jurisdictions.
          Mirrors the candidate_district_profile view join logic.
        expression: |
          CASE WHEN UPPER(TRIM(CAST(src."CAND_OFFICE" AS VARCHAR))) = 'H'
               THEN (CASE UPPER(TRIM(CAST(src."CAND_OFFICE_ST" AS VARCHAR)))
                       WHEN 'AL' THEN '01' WHEN 'AK' THEN '02' WHEN 'AZ' THEN '04' WHEN 'AR' THEN '05'
                       WHEN 'CA' THEN '06' WHEN 'CO' THEN '08' WHEN 'CT' THEN '09' WHEN 'DE' THEN '10'
                       WHEN 'DC' THEN '11' WHEN 'FL' THEN '12' WHEN 'GA' THEN '13' WHEN 'HI' THEN '15'
                       WHEN 'ID' THEN '16' WHEN 'IL' THEN '17' WHEN 'IN' THEN '18' WHEN 'IA' THEN '19'
                       WHEN 'KS' THEN '20' WHEN 'KY' THEN '21' WHEN 'LA' THEN '22' WHEN 'ME' THEN '23'
                       WHEN 'MD' THEN '24' WHEN 'MA' THEN '25' WHEN 'MI' THEN '26' WHEN 'MN' THEN '27'
                       WHEN 'MS' THEN '28' WHEN 'MO' THEN '29' WHEN 'MT' THEN '30' WHEN 'NE' THEN '31'
                       WHEN 'NV' THEN '32' WHEN 'NH' THEN '33' WHEN 'NJ' THEN '34' WHEN 'NM' THEN '35'
                       WHEN 'NY' THEN '36' WHEN 'NC' THEN '37' WHEN 'ND' THEN '38' WHEN 'OH' THEN '39'
                       WHEN 'OK' THEN '40' WHEN 'OR' THEN '41' WHEN 'PA' THEN '42' WHEN 'RI' THEN '44'
                       WHEN 'SC' THEN '45' WHEN 'SD' THEN '46' WHEN 'TN' THEN '47' WHEN 'TX' THEN '48'
                       WHEN 'UT' THEN '49' WHEN 'VT' THEN '50' WHEN 'VA' THEN '51' WHEN 'WA' THEN '53'
                       WHEN 'WV' THEN '54' WHEN 'WI' THEN '55' WHEN 'WY' THEN '56'
                       WHEN 'AS' THEN '60' WHEN 'GU' THEN '66' WHEN 'MP' THEN '69' WHEN 'PR' THEN '72'
                       WHEN 'VI' THEN '78' ELSE NULL END)
                    || LPAD(CAST(TRY_CAST(src."CAND_OFFICE_DISTRICT" AS INTEGER) AS VARCHAR), 2, '0')
               ELSE NULL END
      - name: incumbent_challenger
        type: string
        nullable: true
        comment: Incumbent/challenger/open status (I, C, O)
        source: CAND_ICI
      - name: candidate_status
        type: string
        nullable: true
        comment: Candidate status (C=statutory candidate, F=statutory candidate for future, N=not yet, P=statutory candidate in prior)
        source: CAND_STATUS
      - name: principal_committee_id
        type: string
        nullable: true
        comment: Principal campaign committee ID
        source: CAND_PCC
      - name: street1
        type: string
        nullable: true
        comment: Mailing address street line 1
        source: CAND_ST1
      - name: street2
        type: string
        nullable: true
        comment: Mailing address street line 2
        source: CAND_ST2
      - name: city
        type: string
        nullable: true
        comment: Mailing address city
        source: CAND_CITY
      - name: state_address
        type: string
        nullable: true
        comment: Mailing address state
        source: CAND_ST
      - name: zip
        type: string
        nullable: true
        comment: Mailing address ZIP code
        source: CAND_ZIP
      - *election_year_column

    download:
      bulkDownload: fec_candidates

    source:
      type: http
      url: "https://www.fec.gov/files/bulk-downloads/{year}/cn{yearSuffix}.zip"
      method: GET
      extractPattern: "*.txt"
      response:
        format: csv
        delimiter: "|"
        # FEC bulk files have no real quoting convention — "|" is the only field separator, and
        # a literal " (e.g. a nickname like SMITH, JOHN "JACK" in NAME/CAND_NAME) is legitimate
        # data, not a quote wrapper. Without this, HttpSource's default RFC4180 quote-toggle
        # desyncs field boundaries for every column after the first field with an odd count of
        # literal quotes — corrupting downstream columns with a stray leading/trailing quote.
        quoted: false
        hasHeader: false
        columnNames: "CAND_ID|CAND_NAME|CAND_PTY_AFFILIATION|CAND_ELECTION_YR|CAND_OFFICE_ST|CAND_OFFICE|CAND_OFFICE_DISTRICT|CAND_ICI|CAND_STATUS|CAND_PCC|CAND_ST1|CAND_ST2|CAND_CITY|CAND_ST|CAND_ZIP"
      rateLimit:
        requestsPerSecond: 2.0
        maxRetries: 3
      rawCache:
        enabled: true

    dimensions:
      type:
        - candidates
      year:
        <<: *fec_year_dimension

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type, year]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
        emptyResultTtlMillis: 86400000
      iceberg:
        catalogType: hadoop
        overwritePartitions: true
        batchPartitionColumns: [type, year]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ==========================================================================
  # COMMITTEES — Political committee registrations
  # ==========================================================================
  - name: committees
    pattern: "type=committees/year={year}/committees.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2026
      distinctYears: 9
      contiguous: false
      years: [2010, 2012, 2014, 2016, 2018, 2020, 2022, 2024, 2026]
      rowCount: 156863
      checkedAt: "2026-09-16T22:01:49Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: INTEGER

    comment: >
      All political committees registered with the FEC. Includes PACs, party
      committees, campaign committees, and Super PACs. Contains committee type,
      designation, connected organization, treasurer, and filing frequency.
      Source: cm{YY}.zip bulk download (pipe-delimited, no header).

      To reach a committee's connected organization FROM another schema rather than by
      name, join ref.canonical_org_entity on fec_committee_id = committee_id — that table
      carries one foreign key per source, so the org's LEI/SEC CIK and its committee_id
      sit in the same row and the join is exact. Matching connected_org_name as text finds
      the wrong entities and misses orgs filing under a differently-worded name.

    columns:
      - *committee_id_column
      - *committee_name_column
      - name: treasurer_name
        type: string
        nullable: true
        comment: Committee treasurer name
        source: TRES_NM
      - name: street1
        type: string
        nullable: true
        comment: Committee street address line 1
        source: CMTE_ST1
      - name: street2
        type: string
        nullable: true
        comment: Committee street address line 2
        source: CMTE_ST2
      - name: city
        type: string
        nullable: true
        comment: Committee city
        source: CMTE_CITY
      - name: state
        type: string
        nullable: true
        comment: Committee state (two-letter postal)
        source: CMTE_ST
      - name: zip
        type: string
