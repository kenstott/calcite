# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: active_candidates
    comment: >
      Federal candidates flagged as certified active (candidate_status = 'C') in
      fec.candidates. Not filtered to a single cycle — rows span every loaded
      election year, distinguished by the year column. Single-schema view using
      only fec tables.
    sql: >
      SELECT
        candidate_id,
        candidate_name,
        party,
        office,
        state,
        district,
        incumbent_challenger,
        election_year,
        year
      FROM candidates
      WHERE candidate_status = 'C'

  - name: candidate_district_profile
    comment: >
      Enriches FEC candidates with geographic state and congressional district data.
      House candidates (office=H) are matched to their TIGER district boundary via
      state_fips + zero-padded district number. Senate/presidential rows get state
      geography only (no CD match).
    sql: >
      SELECT
        c.candidate_id,
        c.candidate_name,
        c.office,
        c.state,
        c.district,
        c.party,
        c.incumbent_challenger,
        c.year,
        gs.state_name,
        gs.state_fips,
        cd.cd_fips,
        cd.cd_name
      FROM candidates c
      LEFT JOIN "geo"."states" gs ON c.state = gs.state_abbr
      LEFT JOIN "geo"."congressional_districts" cd
        ON c.office = 'H'
        AND gs.state_fips = cd.state_fips
        AND cd.cd_fips = CONCAT(gs.state_fips, LPAD(c.district, 2, '0'))
