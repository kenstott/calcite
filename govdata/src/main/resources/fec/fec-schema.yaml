  # ==========================================================================
  # CA_CONTRIBUTIONS — California Cal-Access itemized contributions (RCPT_CD)
  # ==========================================================================
  # State-level counterpart to individual_contributions/committee_contributions: California's
  # full campaign-finance database export (dbwebexport.zip), CDN-fronted, keyless, refreshed
  # daily. One row per contribution line item across all CA state candidate, party, and
  # ballot-measure committees since 2000. Cross-Schema note: filer/committee IDs (CMTE_ID,
  # treasurer/candidate names) are Cal-Access's own filer_id space — distinct from FEC's
  # candidate_id/committee_id, so no FK to the federal tables above.
  - name: ca_contributions
    # Freshness gate: campaignfinance.cdn.sos.ca.gov returns a real ETag on the zip (confirmed
    # live 2026-09-14, CloudFront+S3) — skips the ~1.6GB re-download when unchanged.
    freshness:
      type: etag
    pattern: "type=ca_contributions/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR

    comment: >
      Itemized contributions received by California state candidates, parties, and
      ballot-measure committees (Cal-Access Form 401/460/465 Schedule A/C/I), including
      intermediary/conduit and loan-interest detail. One row per contribution line item;
      PK is (filing_id, amend_id, line_item, form_type) — an intermediary contribution
      files a companion record (form_type I) alongside its underlying contribution
      (form_type A) sharing the same filing_id/amend_id/line_item, so form_type is
      required to disambiguate. rec_type is 'RCPT' for the vast majority of rows but a
      real minority (~0.006%) are 'E530' — Form 497 24-hour/10-day late contribution
      reports, co-mingled into the same TSV by the source. Source: Cal-Access
      full-database export, RCPT_CD.TSV member. Covers 2000-present. A small number of
      source rows (<0.001%) have a NULL filing_id/amend_id/line_item — a known
      Cal-Access export data-quality gap,
      not a transform defect.

    dimensions:
      type:
        - ca_contributions

    columns:
      - *ca_filing_id_column
      - *ca_amend_id_column
      - *ca_line_item_column
      - *ca_rec_type_column
      - *ca_form_type_column
      - *ca_transaction_id_column
      - *ca_entity_type_column
      - name: contributor_name_last
        type: string
        nullable: true
        comment: Contributor last/entity name
        source: CTRIB_NAML
      - name: contributor_name_first
        type: string
        nullable: true
        comment: Contributor first name
        source: CTRIB_NAMF
      - name: contributor_name_title
        type: string
        nullable: true
        comment: Contributor name title
        source: CTRIB_NAMT
      - name: contributor_name_suffix
        type: string
        nullable: true
        comment: Contributor name suffix
        source: CTRIB_NAMS
      - name: contributor_city
        type: string
        nullable: true
        comment: Contributor address city
        source: CTRIB_CITY
      - name: contributor_state
        type: string
        nullable: true
        comment: Contributor address state
        source: CTRIB_ST
      - name: contributor_zip
        type: string
        nullable: true
        comment: Contributor address ZIP
        source: CTRIB_ZIP4
      - name: contributor_employer
        type: string
        nullable: true
        comment: Contributor employer
        source: CTRIB_EMP
      - name: contributor_occupation
        type: string
        nullable: true
        comment: Contributor occupation
        source: CTRIB_OCC
      - name: contributor_self_employed
        type: string
        nullable: true
        comment: Self-employed indicator
        source: CTRIB_SELF
      - name: transaction_type
        type: string
        nullable: true
        comment: Transaction type code
        source: TRAN_TYPE
      - name: receipt_date
        type: date
        nullable: true
        comment: Date the contribution was received
        source: RCPT_DATE
        dateFormat: SLASH_DATETIME_AMPM
      - name: date_thru
        type: date
        nullable: true
        comment: Period-covered end date (for periodic/in-kind items)
        source: DATE_THRU
        dateFormat: SLASH_DATETIME_AMPM
      - name: amount
        type: double
        nullable: true
        comment: Contribution amount
        source: AMOUNT
      - name: cumulative_ytd
        type: double
        nullable: true
        comment: Cumulative year-to-date amount from this contributor
        source: CUM_YTD
      - name: cumulative_other
        type: double
        nullable: true
        comment: Cumulative other-period amount
        source: CUM_OTH
      - name: contribution_description
        type: string
        nullable: true
        comment: Free-text description (e.g. in-kind contribution detail)
        source: CTRIB_DSCR
      - name: committee_id
        type: string
        nullable: true
        comment: Cal-Access filer ID of the receiving committee (join to ca_filers.filer_id)
        source: CMTE_ID
      - *ca_treasurer_name_last_column
      - *ca_treasurer_name_first_column
      - *ca_treasurer_name_title_column
      - *ca_treasurer_name_suffix_column
      - *ca_treasurer_city_column
      - *ca_treasurer_state_column
      - *ca_treasurer_zip_column
      - name: intermediary_name_last
        type: string
        nullable: true
        comment: Intermediary/conduit last name (Form 401/460 Schedule I)
        source: INTR_NAML
      - name: intermediary_name_first
        type: string
        nullable: true
        comment: Intermediary first name
        source: INTR_NAMF
      - name: intermediary_name_title
        type: string
        nullable: true
        comment: Intermediary name title
        source: INTR_NAMT
      - name: intermediary_name_suffix
        type: string
        nullable: true
        comment: Intermediary name suffix
        source: INTR_NAMS
      - name: intermediary_city
        type: string
        nullable: true
        comment: Intermediary address city
        source: INTR_CITY
      - name: intermediary_state
        type: string
        nullable: true
        comment: Intermediary address state
        source: INTR_ST
      - name: intermediary_zip
        type: string
        nullable: true
        comment: Intermediary address ZIP
        source: INTR_ZIP4
      - name: intermediary_employer
        type: string
        nullable: true
        comment: Intermediary employer
        source: INTR_EMP
      - name: intermediary_occupation
        type: string
        nullable: true
        comment: Intermediary occupation
        source: INTR_OCC
      - name: intermediary_self_employed
        type: string
        nullable: true
        comment: Intermediary self-employed indicator
        source: INTR_SELF
      - *ca_candidate_name_last_column
      - *ca_candidate_name_first_column
      - *ca_candidate_name_title_column
      - *ca_candidate_name_suffix_column
      - *ca_office_code_column
      - *ca_office_description_column
      - *ca_jurisdiction_code_column
      - *ca_jurisdiction_description_column
      - *ca_district_number_column
      - *ca_office_seat_holder_code_column
      - *ca_ballot_measure_name_column
      - *ca_ballot_measure_number_column
      - *ca_ballot_measure_jurisdiction_column
      - *ca_support_oppose_column
      - *ca_memo_code_column
      - *ca_memo_refno_column
      - *ca_back_reference_transaction_id_column
      - *ca_xref_schedule_column
      - *ca_xref_match_column
      - name: interest_rate
        type: double
        nullable: true
        comment: Loan interest rate (loan-shaped contributions only)
        source: INT_RATE
      - name: intermediary_committee_id
        type: string
        nullable: true
        comment: Intermediary's own Cal-Access filer ID, when the intermediary is a committee
        source: INTR_CMTEID

    source:
      type: http
      url: "https://campaignfinance.cdn.sos.ca.gov/dbwebexport.zip"
      method: GET
      extractPattern: "*/RCPT_CD.TSV"
      response:
        format: csv
        delimiter: "\t"
        # Cal-Access TSVs have no real quoting convention (SQL Server bulk TSV export); a
        # literal " in a contributor/employer name is legitimate data, not a quote wrapper.
        # Same reasoning as the FEC pipe-delimited files above.
        quoted: false
        hasHeader: true
        pagination:
          type: CSV_STREAM
          pageSize: 2000
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=ca_contributions/"
      partition:
        columns: [type]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
        emptyResultTtlMillis: 86400000
      iceberg:
        catalogType: hadoop
        overwritePartitions: true
        batchPartitionColumns: [type]
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

