      response:
        format: csv
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      # CSV sources use rowTransformers (one CSV row -> zero or more output rows), not
      # responseTransformer (whole-response reshape) — matches the environment schema's
      # EpaAirDataAnnualTransformer pattern for its CSV tables. Verified against a live
      # download (2026-08-01).
      rowTransformers:
        - type: class
          class: "org.apache.calcite.adapter.govdata.officials.FederalJudgesTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=federal_judges/"
      partition:
        columns: [type]
      iceberg:
