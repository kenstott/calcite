        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/officials"
        tableName: federal_judges
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # COMMITTEES — House/Senate/Joint committees + subcommittees (unitedstates/congress-legislators)
  # ---------------------------------------------------------------------------
  - name: committees
    dataset_type: snapshot
    freshness:
      type: etag
    pattern: "type=committees/*.parquet"
    partitions: *type_partition
    comment: >
      House, Senate, and Joint standing/select committees and their subcommittees, from
      the unitedstates/congress-legislators project's committees-current.yaml — a
      CC0-licensed, near-continuously-updated mirror of official House/Senate committee
      pages. The one community-aggregator source in this schema: verified live that the
      Congress.gov API's /v3/committee endpoint carries no jurisdiction text and no
      member roster (see the schema header). One row per full committee and one row per
      subcommittee, linked via parent_committee_id; committee_id is the join key into
      committee_membership.

    dimensions:
      type:
        - committees

    columns:
      - name: committee_id
        type: string
        nullable: false
        comment: >
          thomas_id (full committee) or parent thomas_id + subcommittee thomas_id
          (subcommittee, e.g. HSAG + 15 = HSAG15) — PK, and the join key into
          committee_membership.
      - name: chamber
        type: string
        nullable: true
        comment: house, senate, or joint
      - name: name
        type: string
        nullable: true
      - name: parent_committee_id
        type: string
        nullable: true
        comment: NULL for a full committee; the parent's committee_id for a subcommittee
      - name: is_subcommittee
        type: boolean
        nullable: true
      - name: url
        type: string
        nullable: true
      - name: minority_url
        type: string
        nullable: true
      - name: jurisdiction
        type: string
        nullable: true
        comment: Legislative jurisdiction, free text (populated for most House committees; sparse elsewhere)
      - name: jurisdiction_source
        type: string
        nullable: true
      - name: address
        type: string
        nullable: true
      - name: phone
        type: string
        nullable: true
      - name: rss_url
        type: string
        nullable: true

    source:
      type: http
      url: "https://raw.githubusercontent.com/unitedstates/congress-legislators/main/committees-current.yaml"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.officials.CongressCommitteesTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=committees/"
      partition:
        columns: [type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/officials"
        tableName: committees
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # COMMITTEE_MEMBERSHIP — current committee/subcommittee rosters (unitedstates/congress-legislators)
  # ---------------------------------------------------------------------------
  - name: committee_membership
    dataset_type: snapshot
    freshness:
      type: etag
    pattern: "type=committee_membership/*.parquet"
    partitions: *type_partition
    comment: >
      Current committee/subcommittee rosters, from the unitedstates/congress-legislators
      project's committee-membership-current.yaml. One row per (committee, member)
      assignment for the sitting Congress. committee_id joins to
      committees.committee_id; bioguide_id joins to members.bioguide_id — this file has
      no congress number of its own (it is always the current roster), so join against
      the member's most recent congress rather than a specific one (see
      current_members).

    dimensions:
      type:
        - committee_membership

    columns:
      - name: committee_id
        type: string
        nullable: false
      - name: bioguide_id
        type: string
        nullable: true
      - name: member_name
        type: string
        nullable: true
      - name: party
        type: string
        nullable: true
        comment: majority or minority
      - name: rank
        type: integer
        nullable: true
        comment: Seniority rank within the committee for this party (1 = chair/ranking member)
      - name: title
        type: string
        nullable: true
        comment: e.g. Chairman, Ranking Member; null for other members

    source:
      type: http
      url: "https://raw.githubusercontent.com/unitedstates/congress-legislators/main/committee-membership-current.yaml"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.officials.CongressCommitteeMembershipTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=committee_membership/"
      partition:
        columns: [type]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/officials"
        tableName: committee_membership
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # ELECTORAL_COLLEGE_VOTES — presidential/VP electoral votes by state, per election
  # ---------------------------------------------------------------------------
  - name: electoral_college_votes
    pattern: "type=electoral_college_votes/year=*/*.parquet"
    partitions: *year_partition
    comment: >
      Electoral College vote allocation by state, for President and Vice President,
      from the National Archives (NARA) official per-election results page
      (archives.gov/electoral-college/{year}) — the government's own record of the
      Electoral College outcome, not a poll or projection. One row per
      (year, state, office, candidate). Verified stable across 200 years of live
      pages (1824, 1876, 1960, 1980, 2000, 2020, 2024): each page has a state-by-state
      table whose "For President"/"For Vice-President" header groups carry a colspan
      equal to however many candidates received at least one elector that year —
      parsed dynamically, not a fixed column count. `candidate_party` is populated only
      for the winner and the top losing candidate (the only two NARA names on the
      page's own summary block); other candidates' party is null — NARA's per-election
      page does not state it for anyone else, including write-in/faithless-elector
      recipients. Coverage defaults to 1976-2024 (presidential_year_range) — see that
      dimension's comment for why 1789 isn't the floor. Cross-references geo.state_ref
      via state_name (same caveat as members: DC has 3 electoral votes since the 23rd
      Amendment but is not itself a state, so 3-elector DC rows will not resolve
      against a strict state_ref join in years before 1961 if the range is widened).

    dimensions:
      type:
        - electoral_college_votes
      year: *presidential_year_range

    columns:
      - <<: *partition_year
      - name: state_name
        type: string
        nullable: false
        comment: Full state name as published by NARA (e.g. "California"); join key into geo.state_ref.state_name
      - name: state_electoral_votes
        type: integer
        nullable: true
        comment: Total electoral votes allocated to this state for this election
      - name: office
        type: string
        nullable: false
        comment: PRESIDENT or VICE_PRESIDENT
      - name: candidate_name
        type: string
        nullable: false
        comment: Candidate name as published by NARA (format varies by era, e.g. "Kamala D. Harris")
      - name: candidate_home_state
        type: string
        nullable: true
        comment: Candidate's home state as published ("... of California"); null when NARA's text doesn't follow that pattern
      - name: candidate_party
        type: string
        nullable: true
        comment: >
          Party abbreviation, populated ONLY for the page's designated winner and main
          opponent (the only two candidates NARA's summary block names with a party) —
          null for every other candidate on the page, including anyone who received
          faithless-elector or write-in votes.
      - name: electoral_votes_won
        type: integer
        nullable: true
        comment: Electoral votes this candidate won in this state ("-" in the source becomes 0, not null)

    source:
      type: http
      url: "https://www.archives.gov/electoral-college/{year}"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
        skipOn: [404]  # non-election years have no page — expected gap, not a failure
      rawCache:
        enabled: true

    hooks:
      # Implemented and verified against live pages spanning 1824-2024 (2026-08-02).
      responseTransformer: "org.apache.calcite.adapter.govdata.officials.ElectoralCollegeTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=electoral_college_votes/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/officials"
        tableName: electoral_college_votes
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

  # ---------------------------------------------------------------------------
  # PRESIDENTIAL_ELECTION_RESULTS — popular vote by state, per election (FEC)
  # ---------------------------------------------------------------------------
  - name: presidential_election_results
    pattern: "type=presidential_election_results/year=*/*.parquet"
    partitions: *year_partition
    comment: >
      Popular vote totals by state and candidate for the presidential general
      election, from the FEC's official post-election results workbook
      (fec.gov, "{year} Presidential General Election Results", published as XLSX).
      Richer than electoral_college_votes for the years it covers — actual vote
      counts, not just elector allocation — but coverage is NOT full-history: FEC
      only publishes this specific XLSX format for recent cycles (confirmed: 2024;
      unconfirmed further back — the source page lists only PDF, not XLSX, for
      cycles further back at the time this table was built, 2026-08-02). No
      predictable per-year URL exists (each year's file lives behind an opaque
      numeric document ID), so this transformer discovers the URL per year by
      scraping FEC's static results-and-voting-information listing page rather than
      templating a URL directly — a year with no matching link on that page yields
      zero rows for this table, not an error; check the ETL log for
      "no results link found" to distinguish "not published this way" from a real
      failure. One row per (year, state, candidate). Cross-references geo.state_ref
      via state_name.

    dimensions:
      type:
        - presidential_election_results
      year: *presidential_year_range

    columns:
      - <<: *partition_year
      - name: state_name
        type: string
        nullable: false
        comment: Full state name (converted from the source's 2-letter postal code); join key into geo.state_ref.state_name
      - name: state_electoral_votes
        type: integer
        nullable: true
        comment: Total electoral votes allocated to this state (also carried on electoral_college_votes)
      - name: candidate_name
        type: string
        nullable: false
        comment: Candidate surname/label as published in the workbook's column header (format varies by year)
      - name: popular_votes
        type: long
        nullable: true
        comment: Popular votes received by this candidate in this state
      - name: state_total_votes
        type: long
        nullable: true
        comment: Total votes cast for President in this state, all candidates + write-ins

    source:
      type: http
      url: "https://www.fec.gov/introduction-campaign-finance/election-results-and-voting-information/"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 2.0
        retryOn: [429, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      # Implemented and verified against the live 2024 workbook (2026-08-02). Years
      # without a discoverable XLSX link yield zero rows, not an error — see comment.
      responseTransformer: "org.apache.calcite.adapter.govdata.officials.PresidentialResultsTransformer"

    materialize:
      format: iceberg
      output:
        pattern: "type=presidential_election_results/year=*/"
      partition:
        columns: [type, year]
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        warehousePath: "${GOVDATA_PARQUET_DIR}/officials"
        tableName: presidential_election_results
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 7

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:
  members:
    primaryKey: [bioguide_id, congress]
    foreignKeys:
      - columns: [state_name]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_name]
        comment: >
          Links member's represented state to the conformed state-identity dimension
          (NOT geo.states — that table is year-vintaged and explicitly not a valid FK
          target; state_ref is the canonical join point). Non-enforcing: state_ref
          covers 50 states + DC only, so rows for non-voting territorial delegates
          (Puerto Rico, Guam, American Samoa, U.S. Virgin Islands, Northern Mariana
          Islands) will not resolve — that is expected, not a data error.
    # No intra-schema FK to nominations/federal_judges: this table carries no column
    # (bioguide_id or otherwise) that either of those tables also carries, so there is
    # no reliable join key with the current MVP column set — not an oversight.
  nominations:
    # citation alone is NOT globally unique: PN numbering restarts each Congress, so
    # e.g. "PN1" can exist once per Congress in this table's 117-119 range. Caught
    # 2026-08-02 reviewing constraints — congress must be part of the key.
    primaryKey: [congress, citation]
    # No FK to members/geo: this table carries no bioguide_id, state, or FIPS column
    # (nominee-level detail — including nominee state — needs an N+1 call per
    # nomination and was cut for MVP scope, see the nominations table comment). Adding
    # a state column later would make a geo.state_ref FK possible the same way as members.
  federal_judges:
    primaryKey: [jid]
    # No FK to geo: court_name/court_type are free text (e.g. "U.S. District Court for
    # the District of Maryland") with no structured state/FIPS column to key on. No FK
    # to members/nominations either: appointing_president_N is a free-text name, not an
    # ID — matching it to a member or nominee would be name-matching, not a real key
    # relationship, and isn't attempted here.
  committees:
    primaryKey: [committee_id]
  committee_membership:
    # Non-enforcing: bioguide_id targets one component of members' composite
    # [bioguide_id, congress] key, since this file carries no congress number of its
    # own (see the table comment) — documentary, matching state_name's FK below.
    primaryKey: [committee_id, bioguide_id]
    foreignKeys:
      - columns: [committee_id]
        targetTable: committees
        targetColumns: [committee_id]
      - columns: [bioguide_id]
        targetTable: members
        targetColumns: [bioguide_id]
  electoral_college_votes:
    primaryKey: [year, state_name, office, candidate_name]
    foreignKeys:
      - columns: [state_name]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_name]
        comment: Non-enforcing beyond 50 states + DC, same caveat as members.state_name
    # No FK to members: no shared ID (a president/VP is never a bioguide_id-bearing
    # member of Congress in this table's data, even for the rare case of a sitting
    # legislator on a ticket — NARA publishes name text only, not a Congress.gov ID).
  presidential_election_results:
    primaryKey: [year, state_name, candidate_name]
    foreignKeys:
      - columns: [state_name]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_name]
        comment: Non-enforcing beyond 50 states + DC, same caveat as members.state_name
    # No FK to electoral_college_votes: the two tables share (year, state_name) but not
    # a matching candidate-name spelling/format guarantee (different source, different
    # publisher) — join on (year, state_name) at query time rather than declaring a
    # candidate-level FK this data doesn't actually guarantee.

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: current_members
    comment: >
      Members Congress.gov's per-member detail endpoint reports as currently
      holding office (members.current_member = true, populated by
      CongressMemberCurrentEnricher's N+1 detail call — see that column's
      comment). Restricted to the latest congress present in `members`
      (bounded by GOVDATA_START_CONGRESS/GOVDATA_END_CONGRESS — not
      necessarily the literal current Congress if those knobs haven't been
      bumped for a new session) so a member's row from an older congress they
      also served doesn't duplicate their current one.

      `voting_member` is a structural derivation, not a Congress.gov field:
      the House's 6 territorial/DC seats (American Samoa, DC, Guam, N.
      Mariana Islands, Puerto Rico's Resident Commissioner, Virgin Islands)
      are non-voting delegate seats, and no territory or DC has Senate
      representation at all — so `state_name` being one of the 50 states is
      both necessary and sufficient for floor voting rights, for House and
      Senate rows alike. The 6-name exclusion list is fixed by the
      Constitution/statute, not annually vintaged data, so it is inlined here
      rather than sourced from geo (whose state_ref is a 50-states+DC list
      that would still need this same non-DC-state test, and members'
      territorial state_names don't resolve against it at all — see the
      members table comment).
    sql: >
      SELECT *,
        state_name NOT IN (
          'American Samoa', 'District of Columbia', 'Guam',
          'Northern Mariana Islands', 'Puerto Rico', 'Virgin Islands'
        ) AS voting_member
      FROM members
      WHERE current_member = TRUE
        AND congress = (SELECT MAX(congress) FROM members)

  - name: state_political_index
    comment: >
      Composite Political Index (CPI) per state PER CONGRESS: 0.50*I_Pres +
      0.30*I_Senate + 0.20*I_House, on a -100 (max Republican) to +100 (max
      Democratic) scale. One row per (congress, state) — a full historical time
      series, not just the latest congress. `congress`/`congress_start_year`
      identify which congress each row describes; join congress_start_year to
      any other schema's `year` for a same-period comparison (House/Senate
      composition is constant across both years of a congress, so a caller
      wanting an exact calendar year should pick whichever congress covers it,
      not assume a 1:1 congress-to-year mapping).

      Converted from a single "current only" snapshot to this per-congress
      series 2026-08-23: the prior version hardcoded
      `congress = (SELECT MAX(congress) FROM members)` for House/Senate and
      always used the two most recent presidential cycles globally. Both
      members (full historical congress coverage) and electoral_college_votes
      (1976-2024) already carried everything needed for a real series — the
      only change is computing every congress's index using the data available
      AS OF that congress's start year, instead of collapsing to "now". The
      presidential component for congress N is resolved via
      congress_start_year = 1787 + 2*congress (inverse of
      OfficialsSchemaFactory.deriveCongressRange's N = (year-1789)/2 + 1),
      then taking the two most recent electoral_college_votes years <= that
      start year — the same 2-cycle blend as before, just anchored per-congress
      instead of to today.

      DEVIATION FROM THE ORIGINAL SPEC (deliberate, decided 2026-08-02): I_Pres was
      specified as a two-party POPULAR vote share margin, blended 2:1 across the two
      most recent presidential cycles. presidential_election_results only has 2024
      (FEC hasn't published this XLSX format further back yet) and carries no party
      column, so that could not be computed for two cycles today. Substituted a
      two-party ELECTORAL vote share margin from electoral_college_votes instead —
      it has full 1976-2024 history AND a real candidate_party column, so both cycles
      resolve with no fuzzy join. This is a different statistic (EV share, not
      popular-vote share) — do not treat i_pres as a popular-vote number.

      Known caveats, not silently absorbed:
      (1) candidate_party on electoral_college_votes is populated only for the page's
      winner/main-opponent — reliable as 'D'/'R' in modern two-party-dominant
      elections, but a state whose top-2 was NOT the two major parties would be
      excluded from the margin calc for that year, not misattributed.
      (2) party_name on members reflects Congress.gov's literal reported affiliation,
      NOT caucus alignment — an independent who caucuses with a party (e.g. a
      Sanders/King-style seat) is counted as neither s_d nor s_r, understating that
      state's I_Senate versus its practical governing-coalition lean.
      (3) i_pres degrades gracefully to M_t alone (via COALESCE) for a state with only
      one presidential cycle on record instead of two — verified against a synthetic
      single-cycle case, not just the two-cycle case.
      (4) H_D/H_R (and S_D/S_R) denominators are exactly as the original formula
      specified — vacant seats and non-D/R members are excluded from the denominator
      entirely, not counted as a third bucket.
      (5) I_Senate's /2 denominator assumes exactly 2 senators per state per congress;
      a mid-congress death/resignation plus appointed/special-election replacement
      (both rows present in members for that congress, e.g. California's 118th:
      Feinstein died in office, Butler was appointed to finish her term, alongside
      the two full-term senators) inflates s_d+s_r past 2 for that congress, which
      can push cpi/i_senate past the documented +-100 scale. Real turnover, not a
      bug — a single "current" snapshot could land on either side of a mid-congress
      swap and never surface this; a full series makes every such congress visible.
    sql: >
      WITH congresses AS (
        SELECT DISTINCT congress, 1787 + 2 * congress AS congress_start_year
        FROM members
      ),
      house AS (
        SELECT
          congress, state_name,
          SUM(CASE WHEN party_name = 'Democratic' THEN 1 ELSE 0 END) AS h_d,
          SUM(CASE WHEN party_name = 'Republican' THEN 1 ELSE 0 END) AS h_r
        FROM members
        WHERE district IS NOT NULL
        GROUP BY congress, state_name
      ),
      senate AS (
        SELECT
          congress, state_name,
          SUM(CASE WHEN party_name = 'Democratic' THEN 1 ELSE 0 END) AS s_d,
          SUM(CASE WHEN party_name = 'Republican' THEN 1 ELSE 0 END) AS s_r
        FROM members
        WHERE district IS NULL
        GROUP BY congress, state_name
      ),
      pres_margin AS (
        SELECT
          state_name, year,
          100.0 * (SUM(CASE WHEN candidate_party = 'D' THEN electoral_votes_won ELSE 0 END)
                  - SUM(CASE WHEN candidate_party = 'R' THEN electoral_votes_won ELSE 0 END))
            / NULLIF(SUM(CASE WHEN candidate_party = 'D' THEN electoral_votes_won ELSE 0 END)
                    + SUM(CASE WHEN candidate_party = 'R' THEN electoral_votes_won ELSE 0 END), 0) AS margin
        FROM electoral_college_votes
        WHERE office = 'PRESIDENT' AND candidate_party IN ('D', 'R')
        GROUP BY state_name, year
      ),
      pres_ranked AS (
        SELECT
          c.congress, m.state_name, m.year, m.margin,
          RANK() OVER (PARTITION BY c.congress, m.state_name ORDER BY m.year DESC) AS yr_rank
        FROM congresses c
        JOIN pres_margin m ON m.year <= c.congress_start_year
      ),
      pres AS (
        SELECT
          congress, state_name,
          (2 * MAX(CASE WHEN yr_rank = 1 THEN margin END)
            + COALESCE(MAX(CASE WHEN yr_rank = 2 THEN margin END),
                       MAX(CASE WHEN yr_rank = 1 THEN margin END))) / 3.0 AS i_pres,
          MAX(CASE WHEN yr_rank = 1 THEN margin END) AS margin_t,
          MAX(CASE WHEN yr_rank = 2 THEN margin END) AS margin_t1,
          MAX(CASE WHEN yr_rank = 1 THEN year END)   AS year_t,
          MAX(CASE WHEN yr_rank = 2 THEN year END)   AS year_t1
        FROM pres_ranked
        WHERE yr_rank <= 2
        GROUP BY congress, state_name
      )
      SELECT
        h.congress,
        c.congress_start_year,
        h.state_name,
        0.50 * p.i_pres
          + 0.30 * (100.0 * (s.s_d - s.s_r) / 2)
          + 0.20 * (100.0 * (h.h_d - h.h_r) / NULLIF(h.h_d + h.h_r, 0))          AS cpi,
        p.i_pres,
        (100.0 * (s.s_d - s.s_r) / 2)                                            AS i_senate,
        (100.0 * (h.h_d - h.h_r) / NULLIF(h.h_d + h.h_r, 0))                     AS i_house,
        s.s_d, s.s_r, h.h_d, h.h_r,
        p.margin_t, p.margin_t1, p.year_t, p.year_t1,
        CASE
          WHEN 0.50 * p.i_pres + 0.30 * (100.0 * (s.s_d - s.s_r) / 2) + 0.20 * (100.0 * (h.h_d - h.h_r) / NULLIF(h.h_d + h.h_r, 0)) >= 50.0 THEN 'Solid Democratic'
          WHEN 0.50 * p.i_pres + 0.30 * (100.0 * (s.s_d - s.s_r) / 2) + 0.20 * (100.0 * (h.h_d - h.h_r) / NULLIF(h.h_d + h.h_r, 0)) >= 15.0 THEN 'Lean Democratic'
          WHEN 0.50 * p.i_pres + 0.30 * (100.0 * (s.s_d - s.s_r) / 2) + 0.20 * (100.0 * (h.h_d - h.h_r) / NULLIF(h.h_d + h.h_r, 0)) > -15.0 THEN 'Competitive / Battleground'
          WHEN 0.50 * p.i_pres + 0.30 * (100.0 * (s.s_d - s.s_r) / 2) + 0.20 * (100.0 * (h.h_d - h.h_r) / NULLIF(h.h_d + h.h_r, 0)) > -50.0 THEN 'Lean Republican'
          ELSE 'Solid Republican'
        END                                                                      AS political_lean
      FROM house h
      JOIN senate s ON s.state_name = h.state_name AND s.congress = h.congress
      JOIN pres p ON p.state_name = h.state_name AND p.congress = h.congress
      JOIN congresses c ON c.congress = h.congress
