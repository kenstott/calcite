# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:
  members:
    primaryKey: [bioguide_id, congress]
    foreignKeys:
      - columns: [state_name]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_name]
        comment: >
          Links member's represented state to the conformed state-identity dimension
          (NOT geo.states — that table is year-vintaged and explicitly not a valid FK
          target; state_ref is the canonical join point). Non-enforcing: state_ref
          covers 50 states + DC only, so rows for non-voting territorial delegates
          (Puerto Rico, Guam, American Samoa, U.S. Virgin Islands, Northern Mariana
          Islands) will not resolve — that is expected, not a data error.
    # No intra-schema FK to nominations/federal_judges: this table carries no column
    # (bioguide_id or otherwise) that either of those tables also carries, so there is
    # no reliable join key with the current MVP column set — not an oversight.
  nominations:
    # citation alone is NOT globally unique: PN numbering restarts each Congress, so
    # e.g. "PN1" can exist once per Congress in this table's 117-119 range. Caught
    # 2026-08-02 reviewing constraints — congress must be part of the key.
    primaryKey: [congress, citation]
    # No FK to members/geo: this table carries no bioguide_id, state, or FIPS column
    # (nominee-level detail — including nominee state — needs an N+1 call per
    # nomination and was cut for MVP scope, see the nominations table comment). Adding
    # a state column later would make a geo.state_ref FK possible the same way as members.
  federal_judges:
    primaryKey: [jid]
    # No FK to geo: court_name/court_type are free text (e.g. "U.S. District Court for
    # the District of Maryland") with no structured state/FIPS column to key on. No FK
    # to members/nominations either: appointing_president_N is a free-text name, not an
    # ID — matching it to a member or nominee would be name-matching, not a real key
    # relationship, and isn't attempted here.
