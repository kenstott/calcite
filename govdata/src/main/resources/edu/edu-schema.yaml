    source:
      type: http
      url: "https://nces.ed.gov/ipeds/datacenter/data/F{fiscal_yy1}{fiscal_yy2}_{form_type}.zip"
      method: GET
      # ZIP contains base file and _rv (revised) file. Prefer _rv; fall back to base.
      extractPattern: "f{fiscal_yy1}{fiscal_yy2}_{form_type_lower}_rv.csv"
      extractPatternFallback: "f{fiscal_yy1}{fiscal_yy2}_{form_type_lower}.csv"
      response:
        format: csv
        # X-prefixed columns are imputation flags — transformer must skip them.
        # Column coding differs per form_type; transformer maps all three to canonical names:
        #   F1A: F1B01=tuition_net, F1C011=instruction, F1H01/02=endowment_beg/end
        #   F2:  F2B01=tuition_net, F2C01=instruction, F2H01/02=endowment_beg/end
        #   F3:  F3B01=tuition_net, F3C01=instruction, F3G01/02=endowment_beg/end
      rateLimit:
        requestsPerSecond: 0.5
        maxRetries: 3
        retryOn: [500, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.edu.IpedsFinancialsResponseTransformer"
      dimensionResolver: "org.apache.calcite.adapter.govdata.edu.IpedsFinancialsDimensionResolver"

    dimensions:
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2015
        # IPEDS finance (F{yy1}{yy2}_{form}.zip) publishes ~3 years in arrears (probed 2026-07:
        # latest available is F2223 = FY2022-23 / eff_year 2023; F2324 → HTTP 404). Lag 3.
        # NOTE: fiscal_yy1/yy2 are custom-resolved by IpedsFinancialsDimensionResolver — verify
        # empirically that it derives them from the lagged (effective) year after this change.
        dataLag: 3
      fiscal_yy1:
        type: custom
        dataLag: 3   # IpedsFinancialsDimensionResolver derives F{yy1}{yy2} from (year - dataLag)
      fiscal_yy2:
        type: custom
        dataLag: 3
      form_type:
        - F1A
        - F2
        - F3

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year, form_type]
        valueSource:
          year: effective_year   # store under the vintage year (year - dataLag), not the publish year
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

