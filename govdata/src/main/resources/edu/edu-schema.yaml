        type: range
        # Uses the standard GOVDATA_START_YEAR/END_YEAR directly, same as every other
        # year-addressed schema — no dedicated override var, to avoid a second knob that could
        # silently diverge from the range everything else is scoped to.
        start: "${GOVDATA_START_YEAR:2014}"
        end: "${GOVDATA_END_YEAR:2024}"

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "year=*/"
      partition:
        columns: [year]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # F-33 DISTRICT FINANCE — Census Bureau Annual Survey of School System
  # Finances, individual-unit file. One row per LEA per fiscal year.
  # ~14,000 LEAs per year; real dollar revenue/expenditure figures (the only
  # district-dollar table in this schema; ccd_districts and district_naep_spending
  # carry staffing/enrollment/poverty proxies only).
  # ==========================================================================
  - name: f33_district_finance
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2008
      maxYear: 2024
      distinctYears: 17
      contiguous: true
      rowCount: 243892
      checkedAt: "2026-11-25T05:03:35Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    comment: >
      Census Bureau Annual Survey of School System Finances ("F-33"),
      individual-unit file — one row per public school district (LEA) per
      fiscal year. Source: the Census Bureau's published elsec{yy}t.txt
      comma-delimited file, one per fiscal year (14,088 LEAs in the verified
      FY2023 file). leaid (source column NCESID) is the Census Bureau's own
      copy of the NCES LEA ID and joins directly to ccd_districts.leaid and
      geo.school_districts.sd_lea. Unlike ccd_districts (a staffing/enrollment
      directory with no dollar figures at all), this table carries the actual
      survey dollar aggregates: total_revenue_thousand, total_expenditure_thousand,
      and current_expenditure_thousand are reported in thousands of dollars
      (the source's own convention, not converted here — see each column's
      comment); per_pupil_current_expenditure, per_pupil_instruction_expenditure,
      and per_pupil_support_services_expenditure are the source's own per-pupil
      dollar figures (PPCSTOT/PPITOTAL/PPSTOTAL), computed by the Census Bureau
      from fall membership, not derived here. A two-year data lag applies
      (dataLag: 2 below) — the Census Bureau's most recently published fiscal
      year is real time minus roughly two years (verified live 2026-08-21: the
      FY2024 file was the latest published, FY2025 was not yet available).
      Verified live against the FY2023 file: NCESID is unique per row (0
      duplicates) and always 7 digits; none of TOTALREV/TOTALEXP/TCURSPND/
      PPCSTOT/ENROLL carried a negative value in that file, so (unlike CCD)
      this table does not null out negative sentinel codes — none were
      observed, but this has only been checked for FY2023/FY2024.
      Per-pupil caution: the file includes tiny and non-operating units (county
      special-school operators, education service districts, units with an
      ENROLL of 1-15) whose source per-pupil figures run into the millions of
      dollars. An unweighted AVG of per_pupil_current_expenditure across all rows
      is dominated by them; use a median, weight by enrollment
      (SUM(current_expenditure_thousand)*1000/SUM(enrollment)), or filter on
      enrollment and unit_type/school_level first.

    columns:
      - name: leaid
        type: string
        nullable: false
        comment: >
          NCES LEA ID (7-digit string), from source column NCESID — PK
          component. FK to ccd_districts.leaid and geo.school_districts.sd_lea.
      - name: year
        type: int
        nullable: false
        comment: >
          Fiscal year of the survey (the yearRange dimension's effective_year,
          after dataLag=2 is applied) — PK component. Matches ccd_districts.year.
      - name: pid6
        type: string
        nullable: true
        comment: >
          Census Bureau 6-digit processing identifier for the school system,
          source column PID6 (as of FY2023 this replaced the older IDCENSUS
          identifier as the Census Bureau's primary key for the unit).
      - name: unit_type
        type: string
        nullable: true
        comment: Census government unit type code, source column UNIT_TYPE (raw code)
      - name: state_fips
        type: string
        nullable: true
        comment: >
          2-digit state FIPS code — FK to geo.state_ref.state_fips. From source column FIPST for
          FY2022 and later; earlier files publish a narrower header with no FIPST at all, so it
          is taken from the leading two digits of CONUM (a county FIPS is the state FIPS plus a
          3-digit county code). Null for the handful of multi-county educational cooperatives
          whose CONUM is the "M" not-applicable marker, and for those years PID6, UNIT_TYPE and
          SCHLEV are null too — those columns do not exist in the pre-FY2022 file.
      - name: county_fips
        type: string
        nullable: true
        comment: 5-digit county FIPS (state+county), source column CONUM — FK to geo.counties.county_fips
      - name: district_name
        type: string
        nullable: true
        comment: School system name, source column NAME
      - name: cbsa
        type: string
        nullable: true
        comment: Core-Based Statistical Area code, source column CBSA
      - name: school_level
        type: string
        nullable: true
        comment: School level code, source column SCHLEV (raw code)
      - name: enrollment
        type: long
        nullable: true
        comment: Fall membership (student enrollment) used to compute the per-pupil columns, source column ENROLL
      - name: total_revenue_thousand
        type: double
        nullable: true
        comment: Total elementary-secondary revenue, in thousands of dollars, source column TOTALREV
      - name: federal_revenue_thousand
        type: double
        nullable: true
        comment: Total revenue from federal sources, in thousands of dollars, source column TFEDREV
      - name: state_revenue_thousand
        type: double
        nullable: true
        comment: Total revenue from state sources, in thousands of dollars, source column TSTREV
      - name: local_revenue_thousand
        type: double
        nullable: true
        comment: Total revenue from local sources, in thousands of dollars, source column TLOCREV
      - name: total_expenditure_thousand
        type: double
        nullable: true
        comment: Total elementary-secondary expenditure, in thousands of dollars, source column TOTALEXP
      - name: current_expenditure_thousand
        type: double
        nullable: true
        comment: >
          Total current spending (operating expenditure — excludes capital
          outlay and debt service), in thousands of dollars, source column TCURSPND
      - name: instruction_expenditure_thousand
        type: double
        nullable: true
        comment: Current spending for instruction, in thousands of dollars, source column TCURINST
      - name: support_services_expenditure_thousand
        type: double
        nullable: true
        comment: Current spending for support services, in thousands of dollars, source column TCURSSVC
      - name: total_salaries_wages_thousand
        type: double
        nullable: true
        comment: >
          Total salaries and wages (F-33 object code Z32) across all functions, in thousands of
          dollars, source column TSALWAGE. Payroll share of operating spending =
          (total_salaries_wages_thousand + employee_benefits_thousand) / current_expenditure_thousand.
          Rows for years loaded before this column existed are null until reprocessed.
      - name: employee_benefits_thousand
        type: double
        nullable: true
        comment: >
          Total employee benefit payments (F-33 object code Z34) across all functions, in thousands
          of dollars, source column TEMPBENE. Same null-until-reprocessed caveat as
          total_salaries_wages_thousand.
      - name: instruction_salaries_thousand
        type: double
        nullable: true
        comment: Salaries and wages paid for instruction (F-33 E13), in thousands of dollars, source column TCURISAL
      - name: instruction_employee_benefits_thousand
        type: double
        nullable: true
        comment: Employee benefits paid for instruction (F-33 J13), in thousands of dollars, source column TCURIBEN
      - name: capital_outlay_expenditure_thousand
        type: double
        nullable: true
        comment: Total capital outlay expenditure, in thousands of dollars, source column TCAPOUT
      - name: interest_on_debt_thousand
        type: double
        nullable: true
        comment: Interest on school system indebtedness, in thousands of dollars, source column TINTRST
      - name: long_term_debt_outstanding_thousand
        type: double
        nullable: true
        comment: Long-term debt outstanding at end of the fiscal year, in thousands of dollars, source column DEBTOUT
      - name: per_pupil_current_expenditure
        type: double
        nullable: true
        comment: >
          Per-pupil total current spending, in whole dollars — the source's
          own derived per-pupil figure (source column PPCSTOT), not computed here.
      - name: per_pupil_instruction_expenditure
        type: double
        nullable: true
        comment: Per-pupil current spending for instruction, in whole dollars, source column PPITOTAL
      - name: per_pupil_support_services_expenditure
        type: double
        nullable: true
        comment: Per-pupil current spending for support services, in whole dollars, source column PPSTOTAL
      - name: per_pupil_salaries_wages
        type: double
        nullable: true
        comment: Per-pupil salaries and wages, in whole dollars — the source's own figure (PPSALWG), not computed here
      - name: per_pupil_employee_benefits
        type: double
        nullable: true
        comment: Per-pupil employee benefits, in whole dollars — the source's own figure (PPEMPBEN), not computed here

    source:
      type: http
      # Nominal source; F33DistrictFinanceProvider builds the real per-fiscal-year URL
      # (https://www2.census.gov/programs-surveys/school-finances/tables/{year}/
      # secondary-education-finance/elsec{yy}t.txt, {yy} = last 2 digits of {year}) from
      # effective_year and downloads/parses the comma-delimited individual-unit file directly —
      # the framework's plain {year} URL substitution cannot also produce the 2-digit filename
      # segment, so a dataProvider is used instead of a URL-templated source + responseTransformer.
      url: "https://www2.census.gov/programs-surveys/school-finances/tables/"
      method: GET
      response:
        format: text
      rateLimit:
        requestsPerSecond: 0.5
        retryOn: [429, 500, 503]
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.edu.F33DistrictFinanceProvider"

    dimensions:
      year:
        type: yearRange
        # dataLag: 2 matches this survey's ~2-year publication lag — the Census Bureau's
        # latest published fiscal-year file is typically real time minus roughly two years
        # (verified live 2026-08-21: FY2024 was the latest, FY2025 not yet available). start
        # defaults to 2013 so the effective floor after dataLag lands on FY2011, matching the
        # active window the schema advertises as declared coverage and the loaded range
        # (2011..2024). Per-year re-visits are governed by the freshness gate — no
        # lookbackPeriods is set, so already-fresh years are skipped on subsequent runs.
        # minYear: 2000 caps a low operator override at the pattern's own verified floor
        # (elsec{yy}t.txt resolves back to FY2000; earlier is unverified).
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2000
        dataLag: 2

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "year=*/"
      partition:
        columns: [year]
        valueSource:
          year: effective_year
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

