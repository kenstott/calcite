          type: INTEGER
          storedDigits: 4

    comment: >
      English learner (EL) enrollment by school district (LEA) — U.S. Department of Education
      Office for Civil Rights, Civil Rights Data Collection (CRDC), one row per LEA per collection
      (year = school year's start: 2020 = 2020-21, 2021 = 2021-22; about 17,700 LEAs each). The
      CRDC publishes no LEA-level EL file, so each figure is the sum of the LEA's school rows in the
      school-level Enrollment file, grouped by LEAID. el_enrollment is the English learner count,
      split by sex (el_male, el_female, el_nonbinary) and by race (el_hispanic through
      el_two_or_more), with el_program_enrollment the EL students in a language instruction
      program and total_enrollment the all-student denominator. This is the district-level EL count
      that ccd_districts.english_language_learners no longer carries (that Urban Institute field is
      null from 2022). leaid joins ccd_districts.leaid and f33_district_finance.leaid. The CRDC's
      negative non-reported codes are dropped, so sums cover only the schools that reported:
      schools_reporting_el against schools shows the coverage, and a district where no school
      reported has null counts. A CRDC collection is a census of public schools in a single school
      year, not an annual series: the next collection is added when published (2023-24 is not yet).
      Verified 2026-11-15: Texas 2021-22 has 8,924 school rows in 1,203 LEAs summing to 1,107,116 EL
      students. Source: one zip per collection at
