# ============================================================================
# Education Schema — K-12 and Higher Education institutional data
# K-12 sources: Urban Institute Education Data Portal (educationdata.urban.org)
#   No API key required; covers CCD, CRDC, NAEP
# Higher ed: Urban Institute API (IPEDS) + College Scorecard API (key required)
#   API_DATA_GOV — free at api.data.gov/signup
# ============================================================================

schemaName: "edu"
networkOutageWaitMinutes: "${NETWORK_OUTAGE_WAIT_MINUTES:25}"
materializeDirectory: "${GOVDATA_PARQUET_DIR}"

comment: >
  Institutional education data for K-12 districts, schools, and higher education.
  K-12 tables cover NCES Common Core of Data (CCD), Civil Rights Data Collection
  (CRDC), and NAEP assessments. Higher-ed tables cover IPEDS directory, completions,
  financials, and College Scorecard outcomes. All sourced via the Urban Institute
  Education Data Portal API (free, unauthenticated) except College Scorecard
  (free API key required). Complements census.acs_education (population attainment)
  — this schema describes the institutions themselves.

# Compaction settings shared by every table below, merged in via `<<: *compaction_defaults`. A table may
# override any key by restating it after the merge (YAML merge-key semantics). Kept as an anchor
# rather than repeated per table so the schema's compaction policy is stated in exactly one place.
compaction_defaults: &compaction_defaults
  runCompaction: true
  compactionTargetFileSizeBytes: 134217728  # 128MB
  compactionMinFiles: 5

partitionedTables:

  # ==========================================================================
  # CCD DISTRICTS — NCES Local Education Agency directory, annual
  # Urban Institute API: school-districts/ccd/directory/{year}/
  # ~18,000 LEAs per year; 1986–present
  # ==========================================================================
  - name: ccd_districts
    releaseWindow:
      months: [7, 8]        # NCES posts CCD preliminary July, revised August
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2013
      maxYear: 2024
      distinctYears: 12
      contiguous: true
      rowCount: 232288
      checkedAt: "2026-11-25T05:03:10Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    comment: >
      NCES Common Core of Data — Local Education Agency (district) directory.
      One row per LEA per school year (year = end year; 2022 = 2021-22).
      Primary join target for ccd_schools (leaid) and geo.school_districts (sd_lea = leaid).
      Staff FTE fields (teachers, counselors, psychologists) enable resource equity analysis.
      Several numeric fields (number_of_schools, enrollment, spec_ed_students,
      english_language_learners, teachers_total_fte, guidance_counselors_total_fte,
      librarian_specialists_fte, staff_total_fte — see each column's own comment) carry
      raw NCES CCD sentinel codes instead of a real count on some rows: -1 = Missing and
      -2 = Not Applicable are NCES's own official codes (numeric fields, all CCD surveys
      since 2002-03); -9 = does not meet NCES data quality standards is also an official
      code, observed here on english_language_learners. These are meaningful metadata, not
      corrupted data, so this raw table keeps them as-is — but any view aggregating these
      fields (SUM/AVG/ratio) MUST exclude negative values first (value < 0), or the
      sentinel codes get silently summed in as if they were real counts.

    columns:
      - name: leaid
        type: string
        nullable: false
        comment: NCES LEA ID (7-digit string) — PK component
      - name: year
        type: int
        nullable: false
        comment: School year end year (e.g. 2022 = 2021-22) — PK component
      - name: lea_name
        type: string
        nullable: true
        comment: District name
      - name: fips
        type: int
        nullable: true
        comment: State FIPS code (integer 1-56) — FK to geo.state_ref.state_fips
      - name: state_abbr
        type: string
        nullable: true
        comment: 2-letter state abbreviation from state_location field
      - name: county_code
        type: string
        nullable: true
        comment: County FIPS, zero-padded to 5 chars by the transformer (e.g. '06037') — FK to geo.counties.county_fips
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: urban_centric_locale
        type: int
        nullable: true
        comment: NCES locale code (11=city large, 12=city mid, 13=city small, 21=suburb large, 31=town fringe, 41=rural fringe)
      - name: cbsa
        type: int
        nullable: true
        comment: Core-Based Statistical Area code
      - name: latitude
        type: double
        nullable: true
        comment: LEA mailing address latitude
      - name: longitude
        type: double
        nullable: true
        comment: LEA mailing address longitude
      - name: agency_type
        type: int
        nullable: true
        comment: 1=local, 2=supervisory union component, 3=state agency, 4=federal, 7=independent charter
      - name: agency_level
        type: int
        nullable: true
        comment: 1=elementary, 2=secondary, 3=K-12, 4=other
      - name: agency_charter_indicator
        type: int
        nullable: true
        comment: 1=charter LEA, 0=not charter
      - name: lowest_grade_offered
        type: int
        nullable: true
        comment: Lowest grade offered (-1=PK, 0=K, 1-12)
      - name: highest_grade_offered
        type: int
        nullable: true
        comment: Highest grade offered
      - name: number_of_schools
        type: int
        nullable: true
        comment: Number of operational schools in LEA. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: enrollment
        type: int
        nullable: true
        comment: Total student enrollment (may be null for some administrative LEAs). May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: spec_ed_students
        type: int
        nullable: true
        comment: Students receiving special education services. Null for every LEA from year 2022 onward (the Urban Institute CCD directory API no longer publishes the field); populated 2013-2021. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: english_language_learners
        type: int
        nullable: true
        comment: English language learner students. Null for every LEA from year 2022 onward (the Urban Institute CCD directory API no longer publishes the field). May carry a negative NCES CCD sentinel code (see table comment, incl. -9) instead of a real count.
      - name: teachers_total_fte
        type: double
        nullable: true
        comment: Total FTE classroom teachers across all grade levels. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: guidance_counselors_total_fte
        type: double
        nullable: true
        comment: Total FTE guidance counselors. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: school_counselors_fte
        type: double
        nullable: true
        comment: FTE school counselors
      - name: school_psychologists_fte
        type: double
        nullable: true
        comment: FTE school psychologists
      - name: librarian_specialists_fte
        type: double
        nullable: true
        comment: FTE librarian/media specialists. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: staff_total_fte
        type: double
        nullable: true
        comment: Total FTE all staff categories. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: state_leg_district_lower
        type: string
        nullable: true
        comment: State lower legislative district
      - name: state_leg_district_upper
        type: string
        nullable: true
        comment: State upper legislative district
      - name: congress_district_id
        type: int
        nullable: true
        comment: Congressional district ID

    source:
      type: http
      url: "https://educationdata.urban.org/api/v1/school-districts/ccd/directory/{effective_year}/"
      method: GET
      response:
        format: json
        dataPath: "results"
        pagination:
          type: PAGE
          pageSize: 10000
          pageParam: "page"
      rateLimit:
        requestsPerSecond: 2.0
        maxRetries: 2
        retryOn: [429, 500, 503]
      rawCache:
        enabled: true
      incremental:
        yearParam: "year"
        yearRange:
          start: "${GOVDATA_START_YEAR:2010}"

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.edu.CcdDistrictsResponseTransformer"

    dimensions:
      year:
        type: yearRange
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2015
        dataLag: 2

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year]
        valueSource:
          year: effective_year
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # CCD SCHOOLS — NCES individual school directory, annual
  # Urban Institute API: schools/ccd/directory/{year}/
  # ~100,000 schools per year; 1986–present
  # ==========================================================================
  - name: ccd_schools
    # Single all-years bulk CSV split by responsePartitioning → there is NO year *dimension*,
    # so the assumed "per-year period completion" never marks anything complete and every resume
    # re-downloaded + rewrote the full ~1M rows. Gate on the source ETag instead: a cheap HTTP
    # HEAD that skips the whole download when the Urban Institute file is unchanged (republished
    # ~annually). Not freshness:hash — that materializes the per-year dataset in memory (OOM);
    # the ETag is computed server-side and never touches the data. cf. econ/world_indicators.
    freshness:
      type: etag
    releaseWindow:
      months: [7, 8]        # NCES posts CCD preliminary July, revised August
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2024
      distinctYears: 15
      contiguous: true
      rowCount: 1537589
      checkedAt: "2026-11-25T05:03:12Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    comment: >
      NCES Common Core of Data — individual school directory.
      One row per school per year. Joins to ccd_districts via leaid.
      free_or_reduced_price_lunch enables poverty proxy at the school level.
      Biennial CRDC data joins via ncessch = crdc_schools.ncessch.
      Numeric fields (enrollment, teachers_fte, free_lunch, reduced_price_lunch,
      free_or_reduced_price_lunch, direct_certification — see each column's own comment)
      carry raw NCES CCD sentinel codes instead of a real count on some rows: -1 = Missing
      and -2 = Not Applicable are NCES's own official codes (numeric fields, all CCD
      surveys since 2002-03); a further -3 is consistently present across all six fields
      above but its exact NCES definition could not be confirmed against NCES/Urban
      Institute documentation as of 2026-08-02 (checked live; do not assume it means the
      same thing as -3 on unrelated datasets, e.g. IMLS's Public Libraries Survey — that's
      a different codebook). These are meaningful metadata, not corrupted data, so this raw
      table keeps them as-is — but any view aggregating these fields (SUM/AVG/ratio) MUST
      exclude negative values first (value < 0), or the sentinel codes get silently summed
      in as if they were real counts.

    columns:
      - name: ncessch
        type: string
        nullable: false
        comment: NCES school ID (12-digit string) — PK component
      - name: leaid
        type: string
        nullable: false
        comment: Parent LEA ID (7-digit) — FK to ccd_districts.leaid
      - name: year
        type: int
        nullable: false
        comment: School year end year — PK component
      - name: school_name
        type: string
        nullable: true
        comment: School name
      - name: fips
        type: int
        nullable: true
        comment: State FIPS (integer) — FK to geo.state_ref.state_fips
      - name: county_code
        type: string
        nullable: true
        comment: County FIPS, zero-padded to 5 chars by the transformer (e.g. '06037') — FK to geo.counties.county_fips
      - name: latitude
        type: double
        nullable: true
        comment: School latitude
      - name: longitude
        type: double
        nullable: true
        comment: School longitude
      - name: urban_centric_locale
        type: int
        nullable: true
        comment: NCES locale code
      - name: cbsa
        type: string
        nullable: true
        comment: CBSA code (string in API)
      - name: school_level
        type: int
        nullable: true
        comment: 1=elementary, 2=middle, 3=high, 4=other combined
      - name: school_type
        type: int
        nullable: true
        comment: 1=regular, 2=special ed, 3=vocational, 4=alternative
      - name: school_status
        type: int
        nullable: true
        comment: 1=open, 2=closed, 3=new, 4=added, 5=changed agency, 6=reopened, 8=future
      - name: lowest_grade_offered
        type: int
        nullable: true
        comment: Lowest grade (-1=PK, 0=K, 1-12)
      - name: highest_grade_offered
        type: int
        nullable: true
        comment: Highest grade offered
      - name: charter
        type: int
        nullable: true
        comment: Charter school indicator (1=yes, 0=no)
      - name: magnet
        type: int
        nullable: true
        comment: Magnet school indicator (1=yes, 0=no)
      - name: virtual
        type: int
        nullable: true
        comment: Virtual school indicator (1=yes, 0=no, 2=supplemental)
      - name: shared_time
        type: int
        nullable: true
        comment: Shared-time school (students also attend another school)
      - name: title_i_status
        type: int
        nullable: true
        comment: Title I status code (5=schoolwide, 6=targeted assistance, 7=eligible not participating)
      - name: title_i_eligible
        type: int
        nullable: true
        comment: Title I eligible (1=yes, 0=no)
      - name: title_i_schoolwide
        type: int
        nullable: true
        comment: Schoolwide Title I program (1=yes, 0=no)
      - name: teachers_fte
        type: double
        nullable: true
        comment: FTE classroom teachers. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: enrollment
        type: int
        nullable: true
        comment: Total student enrollment. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: free_lunch
        type: int
        nullable: true
        comment: Students approved for free lunch (NSLP). May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: reduced_price_lunch
        type: int
        nullable: true
        comment: Students approved for reduced-price lunch. May carry a negative NCES CCD sentinel code (see table comment) instead of a real count.
      - name: free_or_reduced_price_lunch
        type: int
        nullable: true
        comment: >
          Combined free+reduced lunch count; divide by enrollment for poverty proxy. May carry
          a negative NCES CCD sentinel code (see table comment) instead of a real count —
          exclude value < 0 before using in any ratio. SOURCE BEHAVIOR: states that have moved
          their schools to the Community Eligibility Provision stop collecting FRPL
          applications altogether, and CCD then publishes NOTHING in this field for every
          school in the state while still publishing direct_certification. Observed live
          against production: no such state before 2016, then a state set that changes each
          year — 2016 {DE,DC,MA,TN}, 2021 peaks at 10, 2022 {DE,DC,MA,MT,TN,WV},
          2024 {AZ,DE,DC,MA,TN,WV,GU}. A NULL here for a whole state-year is therefore the
          source's own answer, not a gap in ingestion, and it is not repairable by a
          reprocess. direct_certification is the only poverty signal CCD carries for those
          state-years — see that column for why the two are not interchangeable.
      - name: direct_certification
        type: int
        nullable: true
        comment: >
          Students directly certified for free meals via SNAP/TANF data matching, without a
          household application. May carry a negative NCES CCD sentinel code (see table
          comment) instead of a real count. NOT INTERCHANGEABLE WITH
          free_or_reduced_price_lunch: direct certification captures only the categorically
          eligible subset, so it runs well below FRPL wherever both are reported — measured
          live across production, the ratio of summed direct_certification to summed
          free_or_reduced_price_lunch on schools reporting both is 0.57-0.69 in every year
          2016-2024. Substituting it for FRPL (a COALESCE, say) understates poverty by
          roughly a third and silently changes what the number means, so derive a separate
          rate from it rather than folding it into an FRPL rate.
      - name: lunch_program
        type: int
        nullable: true
        comment: Lunch program type code
      - name: bureau_indian_education
        type: int
        nullable: true
        comment: Bureau of Indian Education school indicator
      - name: congress_district_id
        type: int
        nullable: true
        comment: Congressional district
      - name: state_leg_district_lower
        type: string
        nullable: true
        comment: State lower legislative district
      - name: state_leg_district_upper
        type: string
        nullable: true
        comment: State upper legislative district

    source:
      type: http
      url: "https://educationdata.urban.org/csv/ccd/schools_ccd_directory.csv"
      method: GET
      response:
        format: csv
        pagination:
          type: NONE
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 2
        retryOn: [500, 503]
      rawCache:
        enabled: true
      responsePartitioning:
        fields:
          year: "year"
        yearFilter:
          # Default floor 2010 (Urban Institute directory data runs back to the 1980s, so no
          # feed-began cap). Fixed literal, NOT ${GOVDATA_START_YEAR}: the daily/historical
          # demarcation for this freshness:etag-gated bulk table is handled by freshness, and a
          # dynamic value would resolve to the current year in the daily pool and discard newly
          # published (lagged) rows on an etag-triggered reprocess.
          field: "year"
          start: 2010

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.edu.CcdSchoolsResponseTransformer"

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # NAEP SCORES — Nation's Report Card state-level assessment results
  # Source: api.nationsreportcard.gov — unauthenticated; biennial
  # Note: hostname may not resolve from all networks; ETL should handle gracefully
  # ==========================================================================
  - name: naep_scores
    releaseWindow:
      months: [1, 2, 3]     # NAEP results published January–March
      yearParity: odd        # Biennial odd-year cycles (2019, 2021, 2023…)
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2013
      maxYear: 2024
      distinctYears: 6
      contiguous: false
      years: [2013, 2015, 2017, 2019, 2022, 2024]
      rowCount: 1248
      checkedAt: "2026-11-25T05:03:13Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    comment: >
      NAEP (National Assessment of Educational Progress) state-level mean scale scores for
      grade 4 and grade 8 math/reading. One row per jurisdiction × year × subject × grade ×
      variable_type × subgroup_name; jurisdiction=0 is the national aggregate, otherwise state
      FIPS (joins to ccd_districts.fips or geo.state_ref.state_fips). Administered in odd years
      2013-2019, then 2022 and 2024 (COVID-19 postponed the 2021 cycle) — not a strict biennial
      cadence. Proficiency-level (below_basic/basic/proficient/advanced) breakdowns are in the
      separate naep_achievement_levels table, joinable via the full key.

    columns:
      - name: jurisdiction
        type: int
        nullable: false
        comment: State FIPS code (0 = national aggregate) — PK component
      - name: jurisdiction_name
        type: string
        nullable: true
        comment: State name or "National"
      - name: year
        type: int
        nullable: false
        comment: Assessment year — PK component
      - name: subject
        type: string
        nullable: false
        comment: MAT=mathematics, RED=reading — PK component
      - name: grade
        type: int
        nullable: false
        comment: 4 or 8 — PK component
      - name: variable_type
        type: string
        nullable: false
        comment: Disaggregation type (TOTAL, Race/Ethnicity, Gender, NAEP Eligibility) — PK component
      - name: subgroup_name
        type: string
        nullable: false
        comment: Subgroup label (All students, Male, White, Black, etc.) — PK component
      - name: avg_score
        type: double
        nullable: true
        comment: Average NAEP scale score
      - name: is_displayable
        type: int
        nullable: true
        comment: 1 if statistically displayable (sufficient sample size)

    source:
      type: http
      url: "https://www.nationsreportcard.gov/Dataservice/GetAdhocData.aspx?type=data&subject=MAT&grade={grade}&subscale=MRPCM&variable=TOTAL&jurisdiction=NP,AL,AK,AZ,AR,CA,CO,CT,DE,DC,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY&stattype=MN:MN&Year={year}"
      method: GET
      urlRules:
        - url: "https://www.nationsreportcard.gov/Dataservice/GetAdhocData.aspx?type=data&subject=MAT&grade={grade}&subscale=MRPCM&variable=TOTAL&jurisdiction=NP,AL,AK,AZ,AR,CA,CO,CT,DE,DC,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY&stattype=MN:MN&Year={year}"
          variableMatch:
            subscale: MRPCM
        - url: "https://www.nationsreportcard.gov/Dataservice/GetAdhocData.aspx?type=data&subject=RED&grade={grade}&subscale=RRPCM&variable=TOTAL&jurisdiction=NP,AL,AK,AZ,AR,CA,CO,CT,DE,DC,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY&stattype=MN:MN&Year={year}"
          variableMatch:
            subscale: RRPCM
      response:
        format: json
        dataPath: "result"
        pagination:
          type: NONE
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
        retryOn: [429, 500, 503]
        skipOn: [400]          # non-assessment years (e.g. 2021, 2023 — no main NAEP) return 400; skip rather than fail the pipeline
      rawCache:
        enabled: true
      incremental:
        yearParam: "year"
        yearRange:
          start: "${GOVDATA_START_YEAR:2010}"

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.edu.NaepScoresResponseTransformer"

    dimensions:
      year:
        type: yearRange       # was 'year_range' (underscore) — UNHANDLED, so minYear/maxYear were silently ignored. NAEP non-assessment/odd/future years fast-fail HTTP 400 (handled by skipOn:[400]); only administered years (2022, 2024, …) return data.
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2013
        maxYear: 2024         # latest administered NAEP assessment (2024); bump when a newer cycle publishes. (NaepYearsDimensionResolver was unusable: GetAdhocData.aspx has no type=Years endpoint — returns 400.)
        excludeYears: [2014, 2016, 2018, 2020, 2021, 2023]  # no NAEP main (grade 4/8 RED/MAT) assessment: biennial odd 2013-2019, then even 2022/2024 (2020/2021 COVID gap). Don't request them; skipOn:[400] remains a safety net for future gaps.
      grade:
        - "4"
        - "8"
      subscale:
        - MRPCM
        - RRPCM

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # NAEP ACHIEVEMENT LEVELS — proficiency distribution from ALD stattype calls
  # Source: api.nationsreportcard.gov GetAdhocData, stattype=ALD:BA/BC/PR/AD
  # Same key structure as naep_scores; one row per key × level (4 levels each)
  # Joins to naep_scores via (jurisdiction, year, subject, grade, variable_type, subgroup_name)
  # ==========================================================================
  - name: naep_achievement_levels
    releaseWindow:
      months: [1, 2, 3]
      yearParity: odd
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2013
      maxYear: 2024
      distinctYears: 6
      contiguous: false
      years: [2013, 2015, 2017, 2019, 2022, 2024]
      rowCount: 3744
      checkedAt: "2026-11-25T05:03:15Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    comment: >
      NAEP proficiency level distributions sourced from GetAdhocData ALD stattype calls.
      One row per state × year × subject × grade × subgroup × level.
      level values: below_basic, basic, proficient, advanced.
      pct is the percentage of students at that level for the given key.
      Joins to naep_scores via (jurisdiction, year, subject, grade, variable_type, subgroup_name).

    columns:
      - name: jurisdiction
        type: int
