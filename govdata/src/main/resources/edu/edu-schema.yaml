  # ==========================================================================
  # CRDC SCHOOLS — Civil Rights Data Collection, biennial equity metrics
  # Urban Institute API: schools/crdc/{topic}/{year}/
  # Available years: 2013, 2015, 2017, 2019, 2021 (biennial; 2021 is latest as of 2026)
  # Sub-endpoints: directory, chronic-absenteeism, offenses, teachers-staff
  # ==========================================================================
  - name: crdc_schools
    releaseWindow:
      months: [10, 11, 12]  # CRDC even-year surveys published ~18 months later (Oct–Dec)
      yearParity: odd        # Publication year is odd (e.g., 2020-21 survey → released late 2022/2023)
    pattern: "year={year}/crdc_topic={crdc_topic}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2013
      maxYear: 2022
      distinctYears: 6
      contiguous: false
      years: [2013, 2015, 2017, 2020, 2021, 2022]
      rowCount: 18159226
      checkedAt: "2026-11-25T05:03:18Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4
        - name: crdc_topic
          type: VARCHAR

    # DQ sample cap (GOVDATA_DQ mode): ~100k schools per (year × crdc_topic). Each (year,topic)
    # is a separate fetch-unit, so the cap samples every topic in every year — preserving the
    # per-topic column coverage the all-null check depends on — while bounding materialization.
    # Cache-safe — JSON pages are cached in full during fetch before the iterator caps rows.
    dqRowLimit: 5000

    comment: >
      CRDC school-level civil-rights/equity data consolidated from four Urban Institute
      sub-endpoints, selected via the crdc_topic dimension: directory (charter/magnet/
      alternative-school flags), chronic-absenteeism (chronically-absent student counts by
      race/sex/disability/LEP subgroup), offenses (firearm, homicide, rape, and assault
      incident counts), and teachers-staff (FTE teachers/certified-vs-uncertified/counselors/
      psychologists/nurses/security/law-enforcement). Each row belongs to exactly one
      crdc_topic, so most columns are null outside their topic's rows. Joins to ccd_schools
      via ncessch (crdc_id equals ncessch for schools in the NCES universe; null ncessch
      means a non-NCES private/charter school with only a crdc_id). Collected by the
      Dept of Education Office for Civil Rights on an irregular, roughly-biennial
      schedule — not a strict 2-year interval, and not every topic shares the same
      loaded years: see observedCoverage below for the table-wide year set, but
      per-topic availability varies within it (e.g. offenses has no 2013 data even
      though teachers-staff does; year 2022 currently carries only
      chronic-absenteeism, not teachers-staff/offenses). CRDC's own known survey years
      are 2011, 2013, 2015, 2017, and the 2020-21 cycle (which lands here as two
      separate years, 2020 and 2021, not consolidated into one) — 2011 is a known CRDC
      survey year with no rows currently loaded in this table.

    columns:
      - name: crdc_id
        type: string
        nullable: true
        comment: >
          Best available PK component for CRDC records; more properly an AK (alternate key).
          Equals ncessch for schools in the NCES universe. Chronic-absenteeism pre-2022 data
          may be null (transformer backfills from ncessch). For schools outside NCES
          (private/charter), crdc_id is the only identifier; ncessch will be null instead.
      - name: ncessch
        type: string
        nullable: true
        comment: NCES school ID — FK to ccd_schools.ncessch; null for ~1,800 non-NCES schools
      - name: leaid
        type: string
        nullable: true
        comment: LEA ID — FK to ccd_districts.leaid
      - name: fips
        type: int
        nullable: true
        comment: State FIPS
      - name: year
        type: int
        nullable: false
        comment: Survey year (2011, 2013, 2015, 2017) — PK component
      - name: crdc_topic
        type: string
        nullable: false
        comment: "Sub-endpoint dimension: directory, chronic-absenteeism, offenses, teachers-staff — PK component"
      # --- directory sub-endpoint ---
      - name: charter_crdc
        type: int
        nullable: true
        comment: Charter school per CRDC report (may differ from CCD value)
      - name: magnet_crdc
        type: int
        nullable: true
        comment: Magnet school per CRDC
      - name: alt_school
        type: int
        nullable: true
        comment: Alternative school indicator
      - name: primarily_serve_students_w_dis
        type: int
        nullable: true
        comment: School primarily serves students with disabilities
      # --- chronic-absenteeism sub-endpoint ---
      - name: race
        type: string
        nullable: true
        comment: Race/ethnicity disaggregation (HI=Hispanic, BL=Black, WH=White, etc.; MF=all)
      - name: sex
        type: string
        nullable: true
        comment: Sex disaggregation (M=male, F=female, MF=both)
      - name: disability
        type: string
        nullable: true
        comment: Disability status disaggregation (WD=with disability, WOD=without, TOT=total)
      - name: lep
        type: string
        nullable: true
        comment: Limited English proficiency disaggregation
      - name: students_chronically_absent
        type: int
        nullable: true
        comment: Count of chronically absent students (>10% days missed) for this subgroup
      # --- offenses sub-endpoint ---
      - name: firearm_incident_ind
        type: int
        nullable: true
        comment: Any firearm incident reported (0/1)
      - name: homicide_ind
        type: double
        nullable: true
        comment: Homicide incident indicator
      - name: rape_incidents
        type: double
        nullable: true
        comment: Number of rape allegations
      - name: sexual_battery_incidents
        type: double
        nullable: true
        comment: Number of sexual battery incidents
      - name: attack_w_weapon_incidents
        type: double
        nullable: true
        comment: Attacks with a weapon (non-firearm)
      - name: attack_no_weapon_incidents
        type: double
        nullable: true
        comment: Attacks without a weapon
      - name: possession_firearm_incidents
        type: double
