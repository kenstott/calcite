        nullable: true
        comment: FTE school psychologists
      - name: social_workers_fte
        type: double
        nullable: true
        comment: FTE school social workers
      - name: nurses_fte
        type: double
        nullable: true
        comment: FTE nurses
      - name: security_guard_fte
        type: double
        nullable: true
        comment: FTE security guards
      - name: law_enforcement_fte
        type: double
        nullable: true
        comment: FTE sworn law enforcement officers

    source:
      type: http
      url: "https://educationdata.urban.org/api/v1/schools/crdc/directory/{year}/"
      method: GET
      response:
        format: json
        dataPath: "results"
        pagination:
          type: PAGE
          pageSize: 10000
          pageParam: "page"
      urlRules:
        - url: "https://educationdata.urban.org/api/v1/schools/crdc/chronic-absenteeism/{year}/"
          variableMatch:
            crdc_topic: chronic-absenteeism
        - url: "https://educationdata.urban.org/api/v1/schools/crdc/offenses/{year}/"
          variableMatch:
            crdc_topic: offenses
        - url: "https://educationdata.urban.org/api/v1/schools/crdc/teachers-staff/{year}/"
          variableMatch:
            crdc_topic: teachers-staff
      rateLimit:
        requestsPerSecond: 2.0
        maxRetries: 2
        retryOn: [429, 500, 503]
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.edu.CrdcSchoolsResponseTransformer"

    dimensions:
      year:
        type: yearRange       # was 'year_range' (underscore) — UNHANDLED by the resolver, so minYear was silently ignored and the dim fell back to raw startYear..endYear, fetching non-existent future years
        start: "${GOVDATA_START_YEAR:2010}"
        minYear: 2013
        maxYear: 2022         # latest CRDC collection (2020-21 cycle, published as year 2022); bump when a newer cycle publishes. Without this the Urban API HANGS (Read timed out, ~6min/topic) on non-existent 2023-2026.
      crdc_topic:
        - directory
        - chronic-absenteeism
        - offenses
        - teachers-staff

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year, crdc_topic]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # IPEDS INSTITUTIONS — NCES HD survey, annual
  # Urban Institute API: college-university/ipeds/directory/{year}/
  # ~6,700 active institutions per year; 1986–present
  # Confirmed working: 6,440 records for year=2020
  # Tuition/fees are in a SEPARATE endpoint: academic-year-tuition/{year}/
  # ==========================================================================
  - name: ipeds_institutions
    # Single all-years bulk CSV split by responsePartitioning → NO year *dimension*, so the
    # assumed per-year period completion never marks and every resume re-downloaded + rewrote the
    # full dataset. Gate on the source ETag (cheap HTTP HEAD; skips the download when the Urban
    # Institute file is unchanged). Not freshness:hash — that materializes the per-year dataset
    # (memory risk as it grows); the ETag is server-side and never touches the data.
    freshness:
      type: etag
    releaseWindow:
      months: [11]          # IPEDS Fall Data Collection releases November
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2010
      maxYear: 2025
      distinctYears: 16
      contiguous: true
      rowCount: 1058875
      checkedAt: "2026-11-25T05:03:18Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    comment: >
      NCES IPEDS Institutional Characteristics (HD survey) directory.
      One row per institution per year. Joins to geo.counties via county_fips
      (pad integer to 5-char string). Enrollment is NOT here (IPEDS EF survey).
      Tuition/fees are NOT here — see ipeds_tuition table (academic-year-tuition endpoint).
      college_scorecard joins via unitid = college_scorecard.id.
      ipeds_completions and ipeds_financials join via unitid.

      To reach an institution's cross-schema identity FROM another schema rather than by
      name, join ref.canonical_org_entity on ipeds_unitid = unitid — that table carries
      one foreign key per source, so the institution's LEI/SEC CIK and its unitid sit in
      the same row and the join is exact. Matching inst_name as text finds the wrong
      entities and misses institutions filing under a differently-worded name.

    columns:
      - name: unitid
        type: int
        nullable: false
        comment: IPEDS unit ID (integer) — PK component
      - name: opeid
        type: string
        nullable: true
        comment: OPE ID 8-digit — parent key for college_scorecard.ope8_id (that child declares the FK)
      - name: year
        type: int
        nullable: false
        comment: Survey year — PK component
      - name: inst_name
        type: string
        nullable: true
        comment: Institution name (INSTNM in bulk CSV)
      - name: inst_alias
        type: string
        nullable: true
        comment: Institution alias or common name
      - name: address
        type: string
        nullable: true
        comment: Street address
      - name: city
        type: string
        nullable: true
        comment: City
      - name: state_abbr
        type: string
        nullable: true
        comment: State abbreviation — FK to geo.state_ref.state_abbr
      - name: zip
        type: string
        nullable: true
        comment: ZIP code
      - name: fips
        type: int
        nullable: true
        comment: State FIPS (integer) — FK to geo.state_ref.state_fips
      - name: county_fips
        type: int
        nullable: true
        comment: County FIPS integer (COUNTYCD in bulk); source for county_fips_str
      - name: county_fips_str
        type: string
        nullable: true
        comment: County FIPS zero-padded to 5 chars (e.g. '06037') — FK to geo.counties.county_fips
      - name: county_name
        type: string
        nullable: true
        comment: County name
      - name: longitude
        type: double
        nullable: true
        comment: Longitude (LONGITUD in bulk CSV)
      - name: latitude
        type: double
        nullable: true
        comment: Latitude
      - name: sector
        type: int
        nullable: true
        comment: 0=admin, 1=public 4yr, 2=private nonprofit 4yr, 3=private for-profit 4yr, 4=public 2yr, 5=private nonprofit 2yr, 6=private for-profit 2yr, 7=public <2yr, 8=private nonprofit <2yr, 9=private for-profit <2yr
      - name: inst_control
        type: int
        nullable: true
        comment: 1=public, 2=private nonprofit, 3=private for-profit
      - name: institution_level
        type: int
        nullable: true
        comment: 1=4yr or higher, 2=2-4yr, 3=<2yr
      - name: hbcu
        type: int
        nullable: true
        comment: Historically Black College or University (1=yes, 0=no)
      - name: hospital
        type: int
        nullable: true
        comment: Institution has hospital (1=yes, 0=no)
      - name: medical_degree
        type: int
        nullable: true
        comment: Medical degree offered (1=yes, 0=no)
      - name: tribal_college
        type: int
        nullable: true
        comment: Tribal college or university (1=yes, 0=no)
      - name: land_grant
        type: int
        nullable: true
        comment: Land-grant institution (1=yes, 0=no)
      - name: inst_size
        type: int
        nullable: true
        comment: 1=<1000 students, 2=1000-4999, 3=5000-9999, 4=10000-19999, 5=20000+
      - name: degree_granting
        type: int
        nullable: true
        comment: Degree-granting institution (1=yes, 0=no)
      - name: title_iv_indicator
        type: int
        nullable: true
        comment: Title IV federal financial aid eligible
      - name: offering_undergrad
        type: int
        nullable: true
        comment: Undergraduate programs offered (1=yes)
      - name: offering_grad
        type: int
        nullable: true
        comment: Graduate programs offered (1=yes)
      - name: cc_basic_2021
        type: int
        nullable: true
        comment: Carnegie Classification basic 2021 (integer code; see carnegie.edu for legend)
      - name: cbsa
        type: int
        nullable: true
        comment: CBSA code
      - name: cbsa_type
        type: int
        nullable: true
        comment: 1=metropolitan, 2=micropolitan
      - name: url_school
        type: string
        nullable: true
        comment: Institution website URL

    source:
      type: http
      url: "https://educationdata.urban.org/csv/ipeds/colleges_ipeds_directory.csv"
      method: GET
      response:
        format: csv
        pagination:
          type: NONE
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 2
        retryOn: [500, 503]
      rawCache:
        enabled: true
      responsePartitioning:
        fields:
          year: "year"
        yearFilter:
          # Default floor 2010 (Urban Institute directory data runs back to the 1980s, so no
          # feed-began cap). Fixed literal, NOT ${GOVDATA_START_YEAR}: the daily/historical
          # demarcation for this freshness:etag-gated bulk table is handled by freshness, and a
          # dynamic value would resolve to the current year in the daily pool and discard newly
          # published (lagged) rows on an etag-triggered reprocess.
          field: "year"
          start: 2010

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.edu.IpedsInstitutionsResponseTransformer"

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year]
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true

  # ==========================================================================
  # IPEDS COMPLETIONS — NCES C survey, degrees awarded by field of study
  # Urban Institute API: college-university/ipeds/completions-cip-2/{year}/
  # ~4.2M rows/year (fully disaggregated: institution × CIP × award level × major × race × sex)
  # Confirmed working: 4,159,980 records for year=2022
  # ==========================================================================
  - name: ipeds_completions
    releaseWindow:
      months: [11]          # IPEDS Fall Data Collection releases November
    pattern: "year={year}"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2007
      maxYear: 2024
      distinctYears: 18
      contiguous: true
      rowCount: 5114193
      checkedAt: "2026-11-25T05:03:21Z"
    partitions:
      style: hive
      columnDefinitions:
        - name: year
          type: INTEGER
          storedDigits: 4

    # DQ sample cap (GOVDATA_DQ mode): completions is ~4.2M rows/year fully disaggregated.
    # Each year is a separate ZIP fetch-unit, so the cap samples every year while bounding
    # the 4.2M → N Iceberg writes (the slow part). Cache-safe — the ZIP body is cached in
    # full during fetch (before the iterator), so prod (no GOVDATA_DQ) still loads everything.
    dqRowLimit: 5000

    comment: >
      NCES IPEDS Completions survey (C_A bulk CSV) — degrees/certificates awarded. One row
      per (unitid, year, cipcode, majornum, award_level). Race/ethnicity and sex counts are
      wide columns (ctotalt, caiant, casiat, cbkaat, chispt, cnhpit, cwhitt, c2mort, cunknt,
      cnralt and per-sex _m/_w variants). cipcode is the full 6-digit dotted string
      (e.g. "52.0101"). Source: nces.ed.gov/ipeds/datacenter/data/C{effective_year}_A.zip.
