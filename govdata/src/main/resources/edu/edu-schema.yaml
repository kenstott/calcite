        dataLag: 3   # IpedsFinancialsDimensionResolver derives the file-name pair from (year - dataLag)
      fiscal_yy2:
        type: custom
        dataLag: 3

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [year]
        valueSource:
          year: effective_year
      options:
        compression: snappy
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        runMaintenance: true
        snapshotRetentionDays: 7
        runCompaction: true


# ============================================================================
# Views
# ============================================================================

views:

  - name: district_resources
    comment: >
      District-level pupil_teacher_ratio (enrollment / teachers_total_fte) and
      district_frpl_rate, a free/reduced-price-lunch poverty proxy computed by summing
      free_or_reduced_price_lunch and enrollment from ccd_schools per (leaid, year) and
      joining to ccd_districts. One row per district per year. ccd_districts.enrollment
      and teachers_total_fte and ccd_schools.free_or_reduced_price_lunch/enrollment all
      carry negative NCES CCD sentinel codes on some rows (see those tables' comments) —
      this view excludes them (value < 0 treated as null) before computing
      pupil_teacher_ratio and before summing into district_frpl_count/frpl_rate, so a
      sentinel code is never silently counted as a real value.
      frpl_rate is NULL for a whole district in any year its state runs the Community
      Eligibility Provision: CEP schools take no FRPL applications, so CCD publishes nothing
      in free_or_reduced_price_lunch statewide and carries direct_certification instead. That
      state set grows and shifts from 2016 on (2022: DE, DC, MA, MT, TN, WV; 2024: AZ, DE, DC,
      MA, TN, WV, GU). direct_cert_rate is provided for those districts but is a DIFFERENT
      measure, not a fallback — it counts only the categorically eligible subset and runs at
      0.57-0.69 of FRPL wherever both are reported, so the two must not be pooled into one
      poverty control. Use one or the other and say which.
    sql: >
      SELECT
        d.leaid,
        d.year,
        d.lea_name,
        d.fips,
        d.state_abbr,
        d.county_code,
        d.urban_centric_locale,
        CASE WHEN d.enrollment >= 0 THEN d.enrollment END                       AS enrollment,
        d.number_of_schools,
        CASE WHEN d.teachers_total_fte >= 0 THEN d.teachers_total_fte END       AS teachers_total_fte,
        d.guidance_counselors_total_fte,
        d.school_psychologists_fte,
        CASE WHEN d.enrollment >= 0 AND d.teachers_total_fte >= 0
             THEN d.enrollment / NULLIF(d.teachers_total_fte, 0) END            AS pupil_teacher_ratio,
        s.free_or_reduced_price_lunch                                          AS district_frpl_count,
        s.free_or_reduced_price_lunch * 1.0 / NULLIF(s.enrollment, 0)          AS frpl_rate,
        s.direct_certification                                                 AS district_direct_cert_count,
        s.direct_certification * 1.0 / NULLIF(s.enrollment, 0)                 AS direct_cert_rate
      FROM ccd_districts d
      LEFT JOIN (
        SELECT leaid, year,
               SUM(CASE WHEN free_or_reduced_price_lunch >= 0 THEN free_or_reduced_price_lunch END) AS free_or_reduced_price_lunch,
               SUM(CASE WHEN direct_certification >= 0 THEN direct_certification END)               AS direct_certification,
               SUM(CASE WHEN enrollment >= 0 THEN enrollment END)                                   AS enrollment
        FROM ccd_schools
        GROUP BY leaid, year
      ) s ON d.leaid = s.leaid AND d.year = s.year

  - name: naep_state_trends
    comment: >
      NAEP aggregate trends for all-student subgroup by state, subject, and grade.
      Filters to variable_type=TOTAL to avoid double-counting disaggregations.
      One row per state × year × subject × grade. subject holds the raw NAEP code:
      MAT=mathematics, RED=reading.
    sql: >
      SELECT
        n.jurisdiction,
        n.jurisdiction_name,
        n.year,
        n.subject,
        n.grade,
        n.avg_score
      FROM naep_scores n
      WHERE n.variable_type = 'TOTAL'
        AND n.subgroup_name = 'All students'

  - name: school_equity_profile
    comment: >
      School-level equity view joining ccd_schools (enrollment, free_or_reduced_price_lunch
      poverty proxy) with two crdc_schools sub-endpoint topics: teachers-staff (counselor,
      psychologist, certified/uncertified teacher FTE) and offenses (firearm and rape
      incident counts). CRDC year is mapped to the closest CRDC survey year at or below the
      school year, among the years crdc_schools actually carries for these two topics —
      2013, 2015, 2017, 2020, 2021 (verified live 2026-08-26; crdc_schools also has a
      2011-labeled partition with 0 rows and a 2022 partition that carries only the
      chronic-absenteeism topic, neither of which teachers-staff/offenses can ever match, so
      neither is a mapping target). School years after 2021 map to the 2021 survey (the
      latest available) rather than going unmatched. offenses has no 2013 data (teachers-staff
      does), so offenses columns are null for school years mapped to 2013 even though
      teachers-staff columns are populated for that year.
      One row per school per year; CRDC columns are null where no match exists.
      s.enrollment and s.free_or_reduced_price_lunch carry negative NCES CCD sentinel
      codes on some rows (see ccd_schools' comment) — excluded (value < 0 treated as
      null) here before exposing them and before computing frpl_rate.
      frpl_rate is NULL for a whole school in any year its state runs the Community
      Eligibility Provision: CEP schools take no FRPL applications, so CCD publishes nothing
      in free_or_reduced_price_lunch statewide and carries direct_certification instead. That
      state set grows and shifts from 2016 on (2022: DE, DC, MA, MT, TN, WV; 2024: AZ, DE, DC,
      MA, TN, WV, GU). direct_cert_rate is provided for those schools but is a DIFFERENT
      measure, not a fallback — it counts only the categorically eligible subset and runs at
      0.57-0.69 of FRPL wherever both are reported, so the two must not be pooled into one
      poverty control. Use one or the other and say which.
    sql: >
      SELECT
        s.ncessch,
        s.school_name,
        s.leaid,
        s.year,
        CASE WHEN s.enrollment >= 0 THEN s.enrollment END                             AS enrollment,
        CASE WHEN s.free_or_reduced_price_lunch >= 0 THEN s.free_or_reduced_price_lunch END AS free_or_reduced_price_lunch,
        CASE WHEN s.free_or_reduced_price_lunch >= 0 AND s.enrollment >= 0
             THEN s.free_or_reduced_price_lunch * 1.0 / NULLIF(s.enrollment, 0) END    AS frpl_rate,
        CASE WHEN s.direct_certification >= 0 THEN s.direct_certification END          AS direct_certification,
        CASE WHEN s.direct_certification >= 0 AND s.enrollment >= 0
             THEN s.direct_certification * 1.0 / NULLIF(s.enrollment, 0) END           AS direct_cert_rate,
        s.charter,
        s.school_level,
        ts.counselors_fte,
        ts.psychologists_fte,
        ts.teachers_certified_fte,
        ts.teachers_uncertified_fte,
        o.firearm_incident_ind,
        o.rape_incidents,
        o.possession_firearm_incidents
      FROM ccd_schools s
      LEFT JOIN crdc_schools ts
        ON s.ncessch = ts.ncessch
        AND ts.crdc_topic = 'teachers-staff'
        AND ts.year = (
          CASE WHEN s.year >= 2021 THEN 2021
               WHEN s.year >= 2020 THEN 2020
               WHEN s.year >= 2017 THEN 2017
               WHEN s.year >= 2015 THEN 2015
               WHEN s.year >= 2013 THEN 2013
               ELSE 2013 END
        )
      LEFT JOIN crdc_schools o
        ON s.ncessch = o.ncessch
        AND o.crdc_topic = 'offenses'
        AND o.year = ts.year

  - name: institution_outcomes
    comment: >
      Higher education institution outcomes: ipeds_institutions directory joined to
      college_scorecard earnings/debt/completion outcomes, plus both in-state and
      out-of-state full-time undergraduate tuition from ipeds_tuition (level_of_study=1).
      One row per institution per year, covering all institution levels (4yr, 2-4yr, <2yr).
    sql: >
      SELECT
        i.unitid,
        i.inst_name,
        i.city,
        i.state_abbr,
        i.county_fips,
        i.year,
        i.sector,
        i.inst_control,
        i.institution_level,
        i.hbcu,
        i.tribal_college,
        i.inst_size,
        t.tuition_fees_ft AS tuition_in_state,
        t_out.tuition_fees_ft AS tuition_out_state,
        sc.pell_grant_rate,
        sc.completion_rate_4yr,
        sc.completion_rate_2yr,
        sc.median_debt_completers,
        sc.median_debt_noncompleters,
        sc.mean_earnings_10yr,
        sc.median_earnings_8yr,
        sc.median_family_income,
        sc.default_rate_3yr,
        sc.avg_net_price_public,
        sc.avg_net_price_private
      FROM ipeds_institutions i
      LEFT JOIN ipeds_tuition t
        ON i.unitid = t.unitid AND i.year = t.year
        AND t.level_of_study = 1 AND t.tuition_type = 2
      LEFT JOIN ipeds_tuition t_out
        ON i.unitid = t_out.unitid AND i.year = t_out.year
        AND t_out.level_of_study = 1 AND t_out.tuition_type = 3
      LEFT JOIN college_scorecard sc
        ON i.unitid = sc.id AND i.year = sc.year

  - name: field_of_study_roi
    comment: >
      Program-level return on investment: college_scorecard_programs earnings by CIP code
      and credential level (including ipeds_awards, a completions count sourced from the
      Scorecard API itself) joined to ipeds_institutions for institution name, state, and
      sector context. Enables ranking fields of study by median earnings at 1yr, 4yr, and
      5yr after completion, including Pell vs. non-Pell earnings gaps.
    sql: >
      SELECT
        p.unit_id,
        p.year,
        p.cip_code,
        p.cip_title,
        p.credential_level,
        p.credential_title,
        p.ipeds_awards,
        p.median_earnings_1yr,
        p.median_earnings_4yr,
        p.median_earnings_5yr,
        p.pell_median_earnings_1yr,
        p.nonpell_median_earnings_1yr,
        i.inst_name,
        i.state_abbr,
        i.sector
      FROM edu.college_scorecard_programs p
      LEFT JOIN edu.ipeds_institutions i
        ON p.unit_id = i.unitid AND p.year = i.year

  - name: district_charter_profile
    comment: >
      District-level summary of school types and equity metrics aggregated from
      ccd_schools: counts of charter, magnet, virtual, Title I schoolwide/eligible, and
      open schools, plus charter_share (charter fraction of schools) and
      district_frpl_rate (free/reduced-price-lunch share of aggregated school
      enrollment). Joins to ccd_districts for district name, FIPS, and district-level
      enrollment/teacher FTE context. One row per district per year via an inner join
      — districts with no matching ccd_schools rows are excluded. s.enrollment and
      s.free_or_reduced_price_lunch carry negative NCES CCD sentinel codes on some rows
      (see ccd_schools' comment) — excluded (value < 0 treated as null) before summing
      into school_enrollment_sum and district_frpl_rate.
      district_frpl_rate is NULL for a whole district in any year its state runs the
      Community Eligibility Provision — CEP schools take no FRPL applications, so CCD
      publishes nothing in free_or_reduced_price_lunch statewide (2022: DE, DC, MA, MT, TN,
      WV; 2024: AZ, DE, DC, MA, TN, WV, GU). district_direct_cert_rate covers those districts
      but is a DIFFERENT measure, not a fallback: it counts only the categorically eligible
      subset, running at 0.57-0.69 of FRPL wherever both are reported, so pooling the two into
      one poverty control understates poverty by roughly a third.
    sql: >
      SELECT
        d.leaid,
        d.year,
        d.lea_name,
        d.fips,
        d.state_abbr,
        d.enrollment                                                        AS district_enrollment,
        d.number_of_schools,
        d.teachers_total_fte,
        SUM(CASE WHEN s.charter = 1 THEN 1 ELSE 0 END)                     AS charter_school_count,
        SUM(CASE WHEN s.magnet = 1 THEN 1 ELSE 0 END)                      AS magnet_school_count,
        SUM(CASE WHEN s.virtual = 1 THEN 1 ELSE 0 END)                     AS virtual_school_count,
        SUM(CASE WHEN s.title_i_schoolwide = 1 THEN 1 ELSE 0 END)          AS title_i_schoolwide_count,
        SUM(CASE WHEN s.title_i_eligible = 1 THEN 1 ELSE 0 END)            AS title_i_eligible_count,
        SUM(CASE WHEN s.school_status = 1 THEN 1 ELSE 0 END)               AS open_school_count,
        SUM(CASE WHEN s.enrollment >= 0 THEN s.enrollment END)              AS school_enrollment_sum,
        SUM(CASE WHEN s.free_or_reduced_price_lunch >= 0 THEN s.free_or_reduced_price_lunch END) * 1.0
          / NULLIF(SUM(CASE WHEN s.enrollment >= 0 THEN s.enrollment END), 0) AS district_frpl_rate,
        SUM(CASE WHEN s.direct_certification >= 0 THEN s.direct_certification END) * 1.0
          / NULLIF(SUM(CASE WHEN s.enrollment >= 0 THEN s.enrollment END), 0) AS district_direct_cert_rate,
        SUM(CASE WHEN s.charter = 1 THEN 1 ELSE 0 END) * 1.0
          / NULLIF(COUNT(*), 0)                                             AS charter_share
      FROM ccd_districts d
      JOIN ccd_schools s
        ON d.leaid = s.leaid AND d.year = s.year
      GROUP BY
        d.leaid, d.year, d.lea_name, d.fips, d.state_abbr,
        d.enrollment, d.number_of_schools, d.teachers_total_fte

  - name: institution_completions_summary
    comment: >
      Institution-level completions totals by award level per year.
      Collapses ipeds_completions (wide format) to one row per institution per
      year by summing ctotalt — the grand total of awards across all races and
      both sexes — for majornum=1 (first-major) rows. Joins to ipeds_institutions
      for institutional context.
      award_level codes: 1/2=Certificate (<1yr/1-2yr), 3=Associate, 5=Bachelor,
      7=Master, 17/18/19=Doctoral. completions_total is the grand sum across all
      award levels, not just those broken out individually.
    sql: >
      SELECT
        i.unitid,
        i.inst_name,
        i.year,
        i.state_abbr,
        i.sector,
        i.inst_control,
        i.hbcu,
        i.tribal_college,
        SUM(CASE WHEN c.award_level = 3
            THEN c.ctotalt ELSE 0 END)                                      AS associate_total,
        SUM(CASE WHEN c.award_level = 5
            THEN c.ctotalt ELSE 0 END)                                      AS bachelor_total,
        SUM(CASE WHEN c.award_level = 7
            THEN c.ctotalt ELSE 0 END)                                      AS masters_total,
        SUM(CASE WHEN c.award_level IN (17, 18, 19)
            THEN c.ctotalt ELSE 0 END)                                      AS doctoral_total,
        SUM(CASE WHEN c.award_level IN (1, 2)
            THEN c.ctotalt ELSE 0 END)                                      AS certificate_total,
        SUM(c.ctotalt)                                                      AS completions_total
      FROM edu.ipeds_institutions i
      LEFT JOIN edu.ipeds_completions c
        ON i.unitid = c.unitid AND i.year = c.year
        AND c.majornum = 1
      GROUP BY
        i.unitid, i.inst_name, i.year, i.state_abbr, i.sector,
        i.inst_control, i.hbcu, i.tribal_college

  - name: ipeds_financial_efficiency
    comment: >
      Institution-level financial efficiency ratios from ipeds_financials joined to
      ipeds_institutions: tuition_dependency_ratio (net tuition / total current revenue;
      >0.70 signals heavy tuition reliance), salary_share_of_expenses (total salaries /
      total current expenses), and institutional_discount_rate (total student aid /
      gross tuition and fees). form_type (F1A=GASB public, F2/F3=FASB private) is
      preserved so institution types can be filtered or compared. One row per
      institution per fiscal year.
    sql: >
      SELECT
        f.unitid,
        f.year,
        f.form_type,
        f.is_provisional,
        i.inst_name,
        i.state_abbr,
        i.sector,
        i.inst_control,
        i.hbcu,
        f.rev_tuition_fees_net,
        f.rev_total_current,
        f.exp_instruc_total,
        f.endowment_end,
        f.net_position_end,
        f.rev_tuition_fees_net / NULLIF(f.rev_total_current, 0)            AS tuition_dependency_ratio,
        f.exp_total_salaries / NULLIF(f.exp_total_current, 0)              AS salary_share_of_expenses,
        f.sch_total_student_aid / NULLIF(f.rev_tuition_fees_gross, 0)      AS institutional_discount_rate
      FROM ipeds_financials f
      LEFT JOIN ipeds_institutions i
        ON f.unitid = i.unitid AND f.year = i.year

  - name: district_naep_spending
    comment: >
      State-level correlation view: naep_scores (filtered to variable_type=TOTAL,
      subgroup_name='All students') joined to ccd_districts/ccd_schools data aggregated
      to the state level — total_enrollment (sum), avg_pupil_teacher_ratio (average of
      each district's enrollment/teachers_total_fte), avg_frpl_rate (state free/reduced
      lunch share), and district_count. Enables correlating per-pupil staffing and
      poverty resources with NAEP outcomes. DESPITE THE NAME, this view carries NO dollar or
      per-pupil expenditure figures — "spending" here is proxied only by staffing
      (avg_pupil_teacher_ratio) and poverty (avg_frpl_rate). For per-pupil dollars use
      f33_district_finance (Census F-33 district revenue/expenditure, joins on leaid).
      One row per jurisdiction × year × subject ×
      grade; jurisdiction=0 (national aggregate) will not match any state's district data.
      d2.enrollment, d2.teachers_total_fte, and ccd_schools.free_or_reduced_price_lunch
      all carry negative NCES CCD sentinel codes on some rows (see those tables'
      comments) — excluded (value < 0 treated as null) before computing
      total_enrollment, avg_pupil_teacher_ratio, and avg_frpl_rate, so a sentinel code
      is never silently counted as a real value.
      avg_frpl_rate is NULL for a whole jurisdiction in any year where CCD published no
      FRPL count for that state at all, which is what CCD does for states running the
      Community Eligibility Provision: those schools take no FRPL applications, so the
      field is empty statewide and direct_certification carries the poverty signal
      instead. That set grows and shifts from 2016 on (2022: DE, DC, MA, MT, TN, WV;
      2024: AZ, DE, DC, MA, TN, WV, GU) — see ccd_schools.free_or_reduced_price_lunch.
      avg_direct_cert_rate is provided for exactly those jurisdictions, but it is a
      DIFFERENT measure, not a fallback: it counts only the categorically eligible
      subset and runs at 0.57-0.69 of FRPL wherever both are reported, so a regression
      must not pool the two columns into one poverty control. Use one or the other and
      say which.
    sql: >
      SELECT
        n.jurisdiction,
        n.jurisdiction_name,
        n.year,
        n.subject,
        n.grade,
        n.avg_score,
        d.total_enrollment,
        d.avg_pupil_teacher_ratio,
        d.avg_frpl_rate,
        d.avg_direct_cert_rate,
        d.district_count
      FROM naep_scores n
      LEFT JOIN (
        SELECT
          d2.fips,
          d2.year,
          SUM(CASE WHEN d2.enrollment >= 0 THEN d2.enrollment END)          AS total_enrollment,
          AVG(CASE WHEN d2.enrollment >= 0 AND d2.teachers_total_fte >= 0
                   THEN d2.enrollment / NULLIF(d2.teachers_total_fte, 0) END) AS avg_pupil_teacher_ratio,
          COUNT(*)                                                      AS district_count,
          SUM(school_frpl.frpl_count) * 1.0
            / NULLIF(SUM(CASE WHEN d2.enrollment >= 0 THEN d2.enrollment END), 0) AS avg_frpl_rate,
          SUM(school_frpl.direct_cert_count) * 1.0
            / NULLIF(SUM(CASE WHEN d2.enrollment >= 0 THEN d2.enrollment END), 0) AS avg_direct_cert_rate
        FROM edu.ccd_districts d2
        LEFT JOIN (
          SELECT leaid, year,
                 SUM(CASE WHEN free_or_reduced_price_lunch >= 0 THEN free_or_reduced_price_lunch END) AS frpl_count,
                 SUM(CASE WHEN direct_certification >= 0 THEN direct_certification END)               AS direct_cert_count
          FROM edu.ccd_schools GROUP BY leaid, year
        ) school_frpl ON d2.leaid = school_frpl.leaid AND d2.year = school_frpl.year
        GROUP BY d2.fips, d2.year
      ) d ON n.jurisdiction = d.fips AND n.year = d.year
      WHERE n.variable_type = 'TOTAL' AND n.subgroup_name = 'All students'

  # --------------------------------------------------------------------------
  # Inter-domain views (require geo schema)
  # --------------------------------------------------------------------------

  - name: institution_county_context
    comment: >
      IPEDS institutions enriched with county name and state FIPS from geo.counties,
      joined via county_fips_str (zero-padded 5-digit FIPS computed by transformer) to
      geo.counties.county_fips. No year filter is applied on either side, so if
      geo.counties holds multiple years for a county, the join fans out to one row per
      (institution, geo.counties year) rather than staying one row per institution per
      year. Requires the geo schema present in the same Calcite model.
    sql: >
      SELECT
        i.unitid,
        i.inst_name,
        i.year,
        i.state_abbr,
        i.fips,
        i.county_fips,
        i.county_fips_str,
        i.county_name                                                       AS ipeds_county_name,
        c.county_name                                                       AS geo_county_name,
        c.state_fips                                                        AS geo_state_fips,
        i.city,
        i.latitude,
        i.longitude,
        i.sector,
        i.inst_control,
        i.inst_size,
        i.hbcu,
        i.tribal_college,
        i.degree_granting
      FROM edu.ipeds_institutions i
      LEFT JOIN geo.counties c
        ON i.county_fips_str = c.county_fips

  - name: state_naep_geography
    comment: >
      NAEP state-level assessment scores joined to geo.state_ref for state name
      and geographic context. Filters to all-student total rows to avoid
      double-counting disaggregations. jurisdiction=0 (national aggregate)
      will not join to geo.state_ref and is retained with null geo fields.
      Requires geo schema present in the same Calcite model.
    sql: >
      SELECT
        n.jurisdiction,
        n.jurisdiction_name,
        s.state_name                                                        AS geo_state_name,
        s.state_abbr                                                        AS geo_state_abbr,
        n.year,
        n.subject,
        n.grade,
        n.avg_score,
        n.is_displayable
      FROM naep_scores n
      LEFT JOIN geo.state_ref s
        ON n.jurisdiction = s.state_fips
      WHERE n.variable_type = 'TOTAL'
        AND n.subgroup_name = 'All students'

  - name: naep_proficiency_summary
    comment: >
      NAEP mean scores with proficiency level distributions in a single pivot row.
      Joins naep_scores to naep_achievement_levels via the full natural key.
      Filters to all-student TOTAL subgroup. One row per state × year × subject × grade.
      pct_* columns are null when achievement level data has not been ingested.
    sql: >
      SELECT
        n.jurisdiction,
        n.jurisdiction_name,
        n.year,
        n.subject,
        n.grade,
        n.avg_score,
        MAX(CASE WHEN a.level = 'below_basic'  THEN a.pct END)              AS pct_below_basic,
        MAX(CASE WHEN a.level = 'basic'         THEN a.pct END)              AS pct_basic,
        MAX(CASE WHEN a.level = 'proficient'    THEN a.pct END)              AS pct_proficient,
        MAX(CASE WHEN a.level = 'advanced'      THEN a.pct END)              AS pct_advanced
      FROM naep_scores n
      LEFT JOIN naep_achievement_levels a
        ON  a.jurisdiction  = n.jurisdiction
        AND a.year          = n.year
        AND a.subject       = n.subject
        AND a.grade         = n.grade
        AND a.variable_type = n.variable_type
        AND a.subgroup_name = n.subgroup_name
      WHERE n.variable_type = 'TOTAL'
        AND n.subgroup_name = 'All students'
      GROUP BY
        n.jurisdiction, n.jurisdiction_name, n.year, n.subject, n.grade, n.avg_score

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:

  ccd_districts:
    primaryKey: [year, leaid]
    foreignKeys:
      - columns: [fips]
        targetSchema: "geo"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: Links district state to geographic state record
      - columns: [county_code]
        targetSchema: "geo"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Links district county to geo.counties; county_code is zero-padded to 5-char FIPS by the transformer
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  ccd_schools:
    primaryKey: [year, ncessch]
    foreignKeys:
      - columns: [leaid, year]
        targetTable: ccd_districts
        targetColumns: [leaid, year]
        comment: Links school to parent LEA district record
      - columns: [fips]
        targetSchema: "geo"
        targetTable: state_ref
        targetColumns: [state_fips]
