  - name: fsa_commodity_payments
    # Freshness gate: same landing-page-scrape shape as ers_farm_income above. A
    # Last-Modified probe skips the re-download and re-materialize on unchanged runs
    # (fails open — a null token just re-fetches).
    freshness:
      type: last_modified
    pattern: "type=fsa_commodity_payments/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 2004
      maxYear: 2025
      distinctYears: 21
      contiguous: false
      years: [2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      rowCount: 942472
      checkedAt: "2026-09-04T22:35:16Z"
    partitions: *nass_partitions
    comment: >
      USDA FSA program and conservation payments aggregated by county, program,
      and program year (ARC-CO, PLC, CRP, LFP, ERP, DMC, etc.). payments is the
      summed disbursement (USD); farms is a distinct-payee count (proxy — FSA
      files carry no farm/operation id). No commodity dimension exists (program
      is the finest grain). year is the disbursement (vintage) year; program_year
