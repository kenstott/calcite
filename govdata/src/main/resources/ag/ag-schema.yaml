  # ---------------------------------------------------------------------------
  # PESTICIDE_USE_BY_COUNTY — USGS NAWQA county-level agricultural pesticide use
  # ---------------------------------------------------------------------------
  # Live-verified 2026-08-02 against water.usgs.gov/nawqa/pnsp/usage/maps/county-level/:
  # not one bulk file per year on a predictable URL. 1992-2012 final estimates are
  # direct per-year .txt files; 2013-17 final (ver 2.0) is ONE combined multi-year
  # .txt; preliminary years since (2018, 2019 confirmed live) are each reachable only
  # via a doi.org link to a ScienceBase item whose id is not derivable from the year.
  # USGS's stated plan is a consolidated final 2018-22 release "in 2026", then resumed
  # annual preliminary releases. UsgsPesticideCountyUseProvider re-scrapes the landing
  # page every run (scoped to the "County-level"/"Preliminary county-level" sections,
  # excluding the state-level-by-crop-group series and the superseded "Archived data"
  # section), so newly published years are picked up with no code change. No year
  # dimension: one fetch per run, partitioned by each row's own year column (same
  # reason as ers_farm_income — a multi-vintage source with no single per-year URL).
  - name: pesticide_use_by_county
    # Freshness gate: USGS republishes this county-level map/data page periodically. A
    # Last-Modified probe skips the re-download and re-materialize on unchanged runs
    # (fails open — a null token just re-fetches).
    freshness:
      type: last_modified
    pattern: "type=pesticide_use_by_county/year=*/*.parquet"
    observedCoverage:  # auto-generated by update-coverage-metadata.sh — do not hand-edit
      minYear: 1992
      maxYear: 2019
      distinctYears: 28
      contiguous: true
      rowCount: 9562214
      checkedAt: "2026-09-04T22:35:19Z"
    partitions: *nass_partitions
    comment: >
      USGS NAWQA Pesticide National Synthesis Project estimated annual agricultural
      pesticide use by county, active-ingredient compound, and year — low and high
      estimate methods (epest_low_kg / epest_high_kg, kilograms applied) for the
      conterminous United States, reflecting two different assumptions used when
      Crop Reporting District-level survey data was incomplete. Compiled from every
      county-level release the source currently publishes: final annual files for
      1992-2012, the 2013-17 (ver 2.0) consolidated final release, and single-year
      preliminary releases thereafter. Excludes seed-treatment pesticide application
      beginning in 2015 (the survey provider discontinued those estimates) and
      excludes the separate state-level-by-crop-group series (different grain, not
      in this table). Joins to geo.counties via the derived county_fips column and
      to geo.states via state_fips_code.

    dimensions:
      type:
        - pesticide_use_by_county

    columns:
      - name: year
        type: int
        source: year
        nullable: false
        comment: Data year (partition column), from the source file's own YEAR field
      - name: compound
        type: string
        source: compound
        nullable: true
        comment: Pesticide active-ingredient compound name
      - name: state_fips_code
        type: string
        source: state_fips_code
        nullable: true
        comment: 2-digit state FIPS code (FK to geo.states.state_fips)
      - name: county_fips_code
        type: string
        source: county_fips_code
        nullable: true
        comment: 3-digit county FIPS code within state
      - name: county_fips
        type: string
        source: county_fips
        nullable: true
        comment: 5-digit county FIPS (state+county, derived) — FK to geo.counties.county_fips
      - name: epest_low_kg
        type: double
        source: epest_low_kg
        nullable: true
        comment: Low estimate of agricultural pesticide use (kilograms applied) for the compound/county/year
      - name: epest_high_kg
        type: double
        source: epest_high_kg
        nullable: true
        comment: High estimate of agricultural pesticide use (kilograms applied) for the compound/county/year

    source:
      type: http
      url: "https://water.usgs.gov/nawqa/pnsp/usage/maps/county-level/"
      method: GET
      headers:
        User-Agent: "Mozilla/5.0 (compatible; govdata-etl/1.0)"
      response:
        format: json  # ignored: UsgsPesticideCountyUseProvider discovers and streams the files itself

      # The provider reads each discovered file through this cache, keyed on that file's own
      # URL. The listing it discovers them from is not cached, so a new file is still seen.
      rawCache:
        enabled: true
    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.ag.UsgsPesticideCountyUseProvider"

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=pesticide_use_by_county/year=*/"
      partition:
        columns: [type, year]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        # Cumulative full-archive source re-fetched every run (like ers_farm_income):
        # REPLACE each year partition rather than append, so re-runs don't duplicate rows.
        <<: *nass_iceberg
        overwritePartitions: true

  # ==========================================================================
  # INTERNATIONAL / UN FEED — FAO FAOSTAT
  # ==========================================================================
  # Country-level production/land/food-balance, keyed to ref.countries via M49
  # (ISO 3166-1 numeric) — the only ag table keyed to ref.countries rather than
  # the geo FIPS spine. See docs/data-plans/ag.md. Streamed by FaostatTransformer.
  # Domain codes + bulk column names PENDING LIVE VERIFICATION.
  - name: faostat_production
    # Freshness gate: FAO republishes each domain's bulk zip on its own schedule (not
    # daily). A Last-Modified probe is per-domain (EtlPipeline's per-unit freshness gate
    # applies automatically to this templated {domain} fetch) — skips the re-download and
    # re-materialize for domains unchanged since the last successful run (fails open).
    freshness:
      type: last_modified
    pattern: "type=faostat/domain=*/*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: domain
          type: VARCHAR
    comment: >
      UN FAO FAOSTAT production, land use, and food-balance statistics per area
      (country) x item x element x year. Tall — the international analog of the USDA
      NASS/ERS tables. country_code is the UN M49 / ISO 3166-1 numeric code (FK to
      ref.countries.iso_numeric); FAO regional/economic-group areas are flagged
      is_aggregate. Fan out one normalized bulk file per FAOSTAT domain; year is
      emitted per row and the partition is replaced wholesale on re-run.
    dimensions:
      type:
        - faostat
      domain:
        type: json_catalog
        source: "/faostat/faostat-domains.json"
        path: "domains[*].code"
    columns:
      - name: country_code
        type: string
        nullable: true
        comment: UN M49 / ISO 3166-1 numeric, unpadded (FK to ref.countries.iso_numeric)
      - name: area_name
        type: string
        nullable: true
        comment: FAO area name
      - name: item_code
        type: string
        nullable: true
        comment: FAO item code (commodity / land class / balance line)
      - name: item_name
        type: string
        nullable: true
        comment: Item name (Wheat, Cattle, Arable land, ...)
      - name: element_code
        type: string
        nullable: true
        comment: FAO element code (statistic type)
      - name: element_name
        type: string
        nullable: true
        comment: Element (Production, Area harvested, Yield, Import quantity, ...)
      - name: year
        type: integer
        nullable: false
        comment: Data year (partition column; from FAO Year)
      - name: value
        type: double
        nullable: true
        comment: Numeric value (null when FAO suppressed / not available)
      - name: unit
        type: string
        nullable: true
        comment: Unit (tonnes, ha, hg/ha, 1000 head, ...)
      - name: flag
        type: string
        nullable: true
        comment: FAOSTAT observation flag (E=estimate, I=imputed, M=missing, ...)
      - name: is_aggregate
        type: boolean
        nullable: true
        comment: True for FAO regional/economic-group areas (Area Code >= 5000)
    source:
      type: http
      url: "https://bulks-faostat.fao.org/production/{domain}_All_Data_(Normalized).zip"
      method: GET
      headers:
        User-Agent: "Mozilla/5.0 (compatible; govdata-etl/1.0)"
      response:
        format: json
      rateLimit:
        requestsPerSecond: 1.0
        retryOn: [429, 503]
        maxRetries: 3

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.ag.FaostatTransformer"

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: "type=faostat/domain=*/"
      partition:
        columns: [type, domain]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *nass_iceberg
        overwritePartitions: true
        # Fetch/partition unit is the domain (one bulk zip = all years); override the
        # anchor's year-keyed batching/incremental so a batch maps to one whole domain
        # partition (year-keyed batching would replace-partition per year → clobber).
        batchPartitionColumns: [domain]
        incrementalKeys: [domain]

# ============================================================================
# CONSTRAINTS
# ============================================================================
# The ag tables each mirror a distinct USDA source and share no parent/child
# dimension, so there are no intra-schema foreign keys. All cross-table linkage
# is via the shared geo spatial keys (state/county FIPS), declared as inter-schema
# FKs below. Joins to econ.fred_indicators (commodity prices) and the future
# disasters schema are semantic (commodity name, not a shared key) and are not
# declared as constraints.

constraints:

  # FAOSTAT international production (int'l feed). Tall grain: one row per domain x
  # country x item x element x year. country_code is UN M49 -> ref.countries.iso_numeric.
  faostat_production:
    primaryKey: [type, year, domain, country_code, item_code, element_code]
    foreignKeys:
      - columns: [country_code]
        targetSchema: "${REF_SCHEMA_NAME:ref}"
        targetTable: countries
        targetColumns: [iso_numeric]
        comment: >
          Area M49 / ISO 3166-1 numeric (unpadded) links to ref.countries. Metadata
          only; FAO regional/economic-group areas (is_aggregate=true) do not resolve.

  nass_crop_production:
    # Uniqueness = program source x geography x full data-item (short_desc) x
    # domain category x reference period x year.
    primaryKey:
      - type
      - year
      - source_desc
      - agg_level_desc
      - state_fips_code
      - county_code
      - short_desc
      - domaincat_desc
      - reference_period_desc
    foreignKeys:
      - columns: [state_fips_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: NASS state FIPS to geo.states
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Derived 5-digit county FIPS to geo.counties (county-level rows only)

  rma_crop_insurance:
    # One row per state x county x crop x plan x coverage category x delivery type
    # x coverage level, per commodity year.
    primaryKey:
      - year
      - state_fips
      - county_fips
      - commodity_code
      - insurance_plan_code
      - coverage_category
      - delivery_type
      - coverage_level
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: RMA state FIPS to geo.states
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Derived 5-digit county FIPS to geo.counties
      - columns: [state_abbr]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]

  ers_farm_income:
    # PK is (year, artificial_key) — ERS artificial_key already encodes state+variable
    # and is unique per year. Natural alternate key (year, state,
    # variable_description_total) is not declared: the constraints format supports
    # only primaryKey + foreignKeys.
    primaryKey:
      - type
      - year
      - artificial_key
    foreignKeys:
      - columns: [state]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_abbr]
        comment: ERS state USPS abbreviation to geo.states (excludes the 'US' national total)

  fsa_commodity_payments:
    # One aggregated row per disbursement year x program year x county x program.
    primaryKey:
      - type
      - year
      - program_year
      - county_fips
      - program_code
    foreignKeys:
      - columns: [state_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: FSA state FIPS to geo.states
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: 5-digit county FIPS to geo.counties

  nass_livestock_inventory:
    primaryKey:
      - type
      - year
      - source_desc
      - agg_level_desc
      - state_fips_code
      - county_code
      - short_desc
      - domaincat_desc
      - reference_period_desc
    foreignKeys:
      - columns: [state_fips_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: NASS state FIPS to geo.states
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Derived 5-digit county FIPS to geo.counties (county-level rows only)

  pesticide_use_by_county:
    # One row per compound x county x year.
    primaryKey:
      - type
      - year
      - compound
      - state_fips_code
      - county_fips_code
    foreignKeys:
      - columns: [state_fips_code]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: state_ref
        targetColumns: [state_fips]
        comment: USGS state FIPS to geo.states
      - columns: [county_fips]
        targetSchema: "${GEO_SCHEMA_NAME:geo}"
        targetTable: counties
        targetColumns: [county_fips]
        comment: Derived 5-digit county FIPS to geo.counties

# ============================================================================
# VIEWS
# ============================================================================

views:

  # --- International / UN feed view -----------------------------------------
  # Reads faostat_production; resolves once that table is populated.
  - name: faostat_production_enriched
    comment: >
      FAOSTAT rows enriched with country identity from ref.countries (ISO alpha-3,
      name, M49 region). Country areas only (FAO regional/economic-group aggregates
      filtered out). The international complement to the U.S. NASS/ERS tables —
      country-level production, land use, and food balances.
    sql: >
      SELECT
        f.domain,
        f.year,
        f.country_code AS m49_code,
        c.iso_alpha3,
        c.country_name,
        c.region,
        f.item_code,
        f.item_name,
        f.element_code,
        f.element_name,
        f.value,
        f.unit,
        f.flag
      FROM faostat_production f
      LEFT JOIN "ref"."countries" c ON f.country_code = c.iso_numeric
      WHERE f.is_aggregate = FALSE
