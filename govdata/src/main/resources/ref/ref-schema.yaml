# ============================================================================
# Reference Data Schema (REF)
# ============================================================================
# Cross-referencing tables that link financial identifiers across systems:
#   - GLEIF entities (LEI -> legal entity mapping)
#   - GLEIF CIK mapping (LEI <-> SEC CIK bridge)
#   - GLEIF relationships (LEI -> LEI parent/child consolidation and fund edges)
#   - OpenFIGI instruments (ticker -> FIGI mapping)
#
# This is a standalone reference schema with no dependencies.
#
# GLEIF History Model:
#   GLEIF publishes a daily "golden copy" — a full point-in-time snapshot of
#   all ~3.2M LEI records. There are no historical archives; each day's file
#   replaces the previous. Delta files (intra-day, last-day, last-week,
#   last-month) are available for incremental updates but only cover changes
#   relative to the current golden copy, not historical state reconstruction.
#
#   Strategy: Download the full golden copy CSV (~450MB ZIP) on each ETL run.
#   The worker script discovers the latest URL from the GLEIF golden copy API.
#   For incremental updates, a future enhancement could use delta files.
# ============================================================================

schemaName: "${SCHEMA_NAME:ref}"
materializeDirectory: "${GOVDATA_PARQUET_DIR}"

comment: >
  Reference and cross-referencing tables for financial entity identification.
  Links SEC CIK identifiers to GLEIF LEI codes and OpenFIGI instrument
  identifiers. Enables cross-system entity resolution for financial data analysis.

# ============================================================================
# BULK DOWNLOADS
# ============================================================================
# Large data files shared across multiple tables to optimize download
# ============================================================================

bulkDownloads:

  # GLEIF Golden Copy — full LEI registry (~450MB ZIP, ~3.2M records)
  # Stable permalink — GLEIF API issues a 302 redirect to the current dated file.
  # Updated 3x/day (02:00, 10:00, 18:00 UTC). No authentication required.
  # The CSV ZIP is downloaded once and shared by gleif_entities and gleif_cik_mapping.
  gleif_golden_copy:
    cachePattern: "type=gleif_bulk/gleif-lei2-golden-copy.csv.zip"
    url: "https://goldencopy.gleif.org/api/v2/golden-copies/publishes/lei2/latest.csv"
    dimensions: {}
    comment: >
      GLEIF LEI-CDF 3.1 golden copy CSV download (~450MB compressed, 3.2M records).
      Contains all LEI records worldwide. Shared by gleif_entities and gleif_cik_mapping.

  # GLEIF Relationship Records (RR) golden copy — Level 2 "who owns whom" (~23MB ZIP, ~483k rows)
  # Separate publish from lei2: LEI-CDF carries no parent/child fields at all, the parent edges
  # live only here. Same stable permalink form (302 → the current dated file), same 3x/day cadence.
  gleif_rr_golden_copy:
    cachePattern: "type=gleif_bulk/gleif-rr-golden-copy.csv.zip"
    url: "https://goldencopy.gleif.org/api/v2/golden-copies/publishes/rr/latest.csv"
    dimensions: {}
    comment: >
      GLEIF RR-CDF 2.1 golden copy CSV download (~23MB compressed, ~483k relationship
      records). One row per directed LEI-to-LEI relationship. Used by gleif_relationships.

column_templates:

  # --- LEI Common Columns ---

  lei_column: &lei_column
    name: lei
    type: string
    nullable: false
    comment: Legal Entity Identifier (20-character alphanumeric)
    source: LEI

  legal_name_column: &legal_name_column
    name: legal_name
    type: string
    nullable: true
    comment: Legal name of the entity
    source: Entity.LegalName

  entity_status_column: &entity_status_column
    name: entity_status
    type: string
    nullable: true
    comment: Entity status (ACTIVE, INACTIVE, etc.)
    source: Entity.EntityStatus

  # --- FIGI Common Columns ---

  figi_column: &figi_column
    name: figi
    type: string
    nullable: false
    comment: Financial Instrument Global Identifier (12-character)

  ticker_column: &ticker_column
    name: ticker
    type: string
    nullable: true
    comment: Trading ticker symbol

# ============================================================================
# DIMENSION VALUES
# ============================================================================

dimension_values:

  ref_year_range: &ref_year_range
    type: yearRange
    start: "${GOVDATA_START_YEAR:2010}"
    end: current
    dataLag: 0

# ============================================================================
# PARTITIONED TABLES
# ============================================================================

# Compaction settings shared by every table below, merged in via `<<: *compaction_defaults`. A table may
# override any key by restating it after the merge (YAML merge-key semantics). Kept as an anchor
# rather than repeated per table so the schema's compaction policy is stated in exactly one place.
compaction_defaults: &compaction_defaults
  runCompaction: true
  compactionTargetFileSizeBytes: 134217728  # 128MB
  compactionMinFiles: 5

partitionedTables:

  # ==========================================================================
  # GLEIF ENTITIES — Full LEI registry from bulk CSV download
  # ==========================================================================
  - name: gleif_entities
    # Full point-in-time GLEIF golden copy that ALREADY carries a per-record updated_at
    # (last_update = Registration.LastUpdateDate). computed_delta keeps only the rows whose
    # last_update advanced past the stored high-water mark and APPENDS them (materialize
    # overwritePartitions: false below), so each publish adds just the changed LEIs instead of
    # rewriting all ~3.2M rows — and last_update becomes the queryable history axis (group by it
    # for point-in-time / trend queries; "current" = latest last_update per lei). No synthesized
    # column: the source's own last_update is both the change key and the time axis.
    dataset_type: computed_delta
    freshness:
      type: last_modified   # pre-download gate: skip the ~450MB pull entirely when the golden copy file is unchanged
    pattern: "type=gleif_entities.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR

    comment: >
      GLEIF Legal Entity Identifier (LEI) records from the Global LEI Foundation
      golden copy CSV — entity registration details, jurisdiction, legal form,
      HQ/registered addresses, and registration authority links. The
      registration_authority_entity_id field contains the SEC CIK number for
      entities registered with RA000602 (SEC). Append-only changelog: one row
      per LEI per publish in which it changed, with last_update as the history
      axis; use the current_gleif_entities view for the latest row per LEI.
      Source: GLEIF Golden Copy (goldencopy.gleif.org).

    columns:
      - *lei_column
      - *legal_name_column
      - name: legal_name_language
        type: string
        nullable: true
        comment: Language of the legal name (ISO 639-1)
        source: Entity.LegalName.xmllang
      - name: jurisdiction
        type: string
        nullable: true
        comment: Jurisdiction of legal formation (ISO 3166-2, e.g., US-DE)
        source: Entity.LegalJurisdiction
      - *entity_status_column
      - name: entity_legal_form
        type: string
        nullable: true
        comment: Entity legal form code (ELF code)
        source: Entity.LegalForm.EntityLegalFormCode
      - name: registration_authority_id
        type: string
        nullable: true
        comment: Registration authority identifier (e.g., RA000602 for SEC)
        source: Entity.RegistrationAuthority.RegistrationAuthorityID
      - name: registration_authority_entity_id
        type: string
        nullable: true
        comment: Entity ID at the registration authority (CIK for SEC registrants)
        source: Entity.RegistrationAuthority.RegistrationAuthorityEntityID
      - name: headquarters_country
        type: string
        nullable: true
        comment: Country of headquarters (ISO 3166-1 alpha-2)
        source: Entity.HeadquartersAddress.Country
      - name: headquarters_city
        type: string
        nullable: true
        comment: City of headquarters
        source: Entity.HeadquartersAddress.City
      - name: registered_country
        type: string
        nullable: true
        comment: Country of legal registration (ISO 3166-1 alpha-2)
        source: Entity.LegalAddress.Country
      - name: registered_city
        type: string
        nullable: true
        comment: City of legal registration
        source: Entity.LegalAddress.City
      - name: registration_date
        type: string
        nullable: true
        comment: Initial LEI registration date (ISO 8601)
        source: Registration.InitialRegistrationDate
      - name: last_update
        type: string
        nullable: true
        comment: Last update date of the LEI record (ISO 8601)
        source: Registration.LastUpdateDate
      - name: next_renewal
        type: string
        nullable: true
        comment: Next renewal date for the LEI (ISO 8601)
        source: Registration.NextRenewalDate

    download:
      bulkDownload: gleif_golden_copy

    source:
      type: http
      url: "https://goldencopy.gleif.org/api/v2/golden-copies/publishes/lei2/latest.csv"
      method: GET
      extractPattern: "*.csv"
      # computed_delta change key: only rows whose last_update exceeds the stored high-water mark
      # are kept and appended. last_update is the source's own Registration.LastUpdateDate.
      incremental:
        dateField: last_update
      response:
        format: csv
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    dimensions:
      type:
        - gleif_entities

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        batchPartitionColumns: [type]
        overwritePartitions: false   # APPEND the computed_delta rows; replace-partition would drop all prior LEI history
        runMaintenance: true
        snapshotRetentionDays: 1
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ==========================================================================
  # GLEIF CIK MAPPING — LEI <-> SEC CIK bridge table
  # ==========================================================================
  - name: gleif_cik_mapping
    freshness:
      type: last_modified
    pattern: "type=gleif_cik_mapping.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR

    comment: >
      Bridge table mapping GLEIF LEI codes to SEC CIK numbers (lei, cik,
      legal_name, entity_status). Derived from the GLEIF golden copy CSV
      filtered where registration_authority_id = 'RA000602' (SEC). Current
      snapshot only, overwritten each run — unlike gleif_entities, which keeps
      an append-only change history. Provides fast LEI <-> CIK lookups without
      scanning the full GLEIF dataset.

    columns:
      - *lei_column
      - name: cik
        type: string
        nullable: false
        comment: SEC Central Index Key (CIK) number
        source: Entity.RegistrationAuthority.RegistrationAuthorityEntityID
      - *legal_name_column
      - *entity_status_column

    download:
      bulkDownload: gleif_golden_copy

    source:
      type: http
      url: "https://goldencopy.gleif.org/api/v2/golden-copies/publishes/lei2/latest.csv"
      method: GET
      extractPattern: "*.csv"
      rowFilter:
        column: Entity.RegistrationAuthority.RegistrationAuthorityID
        pattern: "^RA000602$"
      response:
        format: csv
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    dimensions:
      type:
        - gleif_cik_mapping

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        batchPartitionColumns: [type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ==========================================================================
  # GLEIF RELATIONSHIPS — LEI-to-LEI parent/child edges (RR golden copy)
  # ==========================================================================
  - name: gleif_relationships
    # Same history model as gleif_entities: a full point-in-time golden copy that already carries
    # a per-record updated_at, so computed_delta appends only the edges whose LastUpdateDate
    # advanced past the stored high-water mark and registration_last_update becomes the history
    # axis. Ownership changes are exactly what you want a changelog of — "when did X become a
    # subsidiary of Y" is answerable from the appended rows, not from any single snapshot.
    # Columns are 1:1 with the RR CSV, renamed but not reshaped: all five Period / Qualifier /
    # Quantifier slots are carried as published, so a slot GLEIF starts populating lands in the
    # table instead of being silently dropped by a selection rule frozen at ingest time. The
    # collapsing happens in the current_gleif_parents view.
    dataset_type: computed_delta
    freshness:
      type: last_modified   # pre-download gate: skip the pull entirely when the RR file is unchanged
    pattern: "type=gleif_relationships.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR

    comment: >
      GLEIF Level 2 relationship records — the LEI-to-LEI edges that LEI-CDF (gleif_entities)
      does not carry. One row per directed relationship. Both endpoints are always LEIs, so the
      table self-joins to gleif_entities on either side and, through gleif_cik_mapping, resolves
      to SEC CIKs. relationship_type values (2026-07-31 publish, 482,849 rows):
      IS_DIRECTLY_CONSOLIDATED_BY (126,021) and IS_ULTIMATELY_CONSOLIDATED_BY (132,196) are the
      two levels of the ownership hierarchy; IS_FUND-MANAGED_BY (148,576), IS_SUBFUND_OF (72,731),
      IS_FEEDER_TO (1,386) are fund structures; IS_INTERNATIONAL_BRANCH_OF (1,939) is branch
      registration. In every type start_node_id is the subordinate entity and end_node_id is the
      superior one — but only consolidation means ownership. A fund commonly carries a manager AND
      an umbrella (59,419 entities; the two are different entities in 60,266 of 60,370 cases): two
      distinct relations, not two parents.
      GLEIF flattens the ownership chain to two attested levels and never publishes the
      intermediate one, so IS_ULTIMATELY_CONSOLIDATED_BY is largely derivable — walking the direct
      chain reaches the declared ultimate for 113,860 of the 118,627 entities that report both. It
      is kept because it is REPORTED, not computed: 13,569 entities declare an ultimate with no
      direct edge to walk from, and 4,765 chains break at an intermediate holding company that has
      no LEI. Dropping it loses those ~18k attestations.
      Only entities that report a relationship to GLEIF appear here — an absent edge means "not
      reported", which the REPEX (reporting exception) publish explains and this table does not
      carry. Source: GLEIF Golden Copy RR (goldencopy.gleif.org).

    columns:
      - name: start_node_id
        type: string
        nullable: false
        source: Relationship.StartNode.NodeID
        comment: LEI of the subordinate entity in the relationship (start_node_id_type is LEI on all 482,849 rows)
      - name: start_node_id_type
        type: string
        nullable: true
        source: Relationship.StartNode.NodeIDType
        comment: Node identifier scheme; LEI throughout the current publish
      - name: end_node_id
        type: string
        nullable: false
        source: Relationship.EndNode.NodeID
        comment: LEI of the superior entity in the relationship
      - name: end_node_id_type
        type: string
        nullable: true
        source: Relationship.EndNode.NodeIDType
        comment: Node identifier scheme; LEI throughout the current publish
      - name: relationship_type
        type: string
        nullable: false
        source: Relationship.RelationshipType
        comment: IS_DIRECTLY_CONSOLIDATED_BY, IS_ULTIMATELY_CONSOLIDATED_BY, IS_FUND-MANAGED_BY, IS_SUBFUND_OF, IS_FEEDER_TO, IS_INTERNATIONAL_BRANCH_OF
      - name: relationship_status
        type: string
        nullable: true
        source: Relationship.RelationshipStatus
        comment: ACTIVE or INACTIVE
      # Period slots are NOT positional: a RELATIONSHIP_PERIOD lands in slot 1, 2 or 3 depending on how
      # many accounting/filing periods the record also carries. Select on period_N_type, never on N.
      # Slots 4-5 are empty in the current publish; the RR-CDF allows them, so they are carried.
      - name: period_1_start_date
        type: string
        nullable: true
        source: Relationship.Period.1.startDate
      - name: period_1_end_date
        type: string
        nullable: true
        source: Relationship.Period.1.endDate
      - name: period_1_type
        type: string
        nullable: true
        source: Relationship.Period.1.periodType
      - name: period_2_start_date
        type: string
        nullable: true
        source: Relationship.Period.2.startDate
      - name: period_2_end_date
        type: string
        nullable: true
        source: Relationship.Period.2.endDate
      - name: period_2_type
        type: string
        nullable: true
        source: Relationship.Period.2.periodType
      - name: period_3_start_date
        type: string
        nullable: true
        source: Relationship.Period.3.startDate
      - name: period_3_end_date
        type: string
        nullable: true
        source: Relationship.Period.3.endDate
      - name: period_3_type
        type: string
        nullable: true
        source: Relationship.Period.3.periodType
      - name: period_4_start_date
        type: string
        nullable: true
        source: Relationship.Period.4.startDate
      - name: period_4_end_date
        type: string
        nullable: true
        source: Relationship.Period.4.endDate
      - name: period_4_type
        type: string
        nullable: true
        source: Relationship.Period.4.periodType
      - name: period_5_start_date
        type: string
        nullable: true
        source: Relationship.Period.5.startDate
      - name: period_5_end_date
        type: string
        nullable: true
        source: Relationship.Period.5.endDate
      - name: period_5_type
        type: string
        nullable: true
        source: Relationship.Period.5.periodType
      # ACCOUNTING_STANDARD is the only dimension GLEIF currently publishes; slots 2-5 are near-empty.
      - name: qualifier_1_dimension
        type: string
        nullable: true
        source: Relationship.Qualifiers.1.QualifierDimension
      - name: qualifier_1_category
        type: string
        nullable: true
        source: Relationship.Qualifiers.1.QualifierCategory
      - name: qualifier_2_dimension
        type: string
        nullable: true
        source: Relationship.Qualifiers.2.QualifierDimension
      - name: qualifier_2_category
        type: string
        nullable: true
        source: Relationship.Qualifiers.2.QualifierCategory
      - name: qualifier_3_dimension
        type: string
        nullable: true
        source: Relationship.Qualifiers.3.QualifierDimension
      - name: qualifier_3_category
        type: string
        nullable: true
        source: Relationship.Qualifiers.3.QualifierCategory
      - name: qualifier_4_dimension
        type: string
        nullable: true
        source: Relationship.Qualifiers.4.QualifierDimension
      - name: qualifier_4_category
        type: string
        nullable: true
        source: Relationship.Qualifiers.4.QualifierCategory
      - name: qualifier_5_dimension
        type: string
        nullable: true
        source: Relationship.Qualifiers.5.QualifierDimension
      - name: qualifier_5_category
        type: string
        nullable: true
        source: Relationship.Qualifiers.5.QualifierCategory
      # Only slot 1 is populated today, always ACCOUNTING_CONSOLIDATION. Amounts stay strings: 19,232 of
      # 51,652 are published with no units and some exceed 100 — cast and filter in the query, not here.
      - name: quantifier_1_method
        type: string
        nullable: true
        source: Relationship.Quantifiers.1.MeasurementMethod
      - name: quantifier_1_amount
        type: string
        nullable: true
        source: Relationship.Quantifiers.1.QuantifierAmount
      - name: quantifier_1_units
        type: string
        nullable: true
        source: Relationship.Quantifiers.1.QuantifierUnits
      - name: quantifier_2_method
        type: string
        nullable: true
        source: Relationship.Quantifiers.2.MeasurementMethod
      - name: quantifier_2_amount
        type: string
        nullable: true
        source: Relationship.Quantifiers.2.QuantifierAmount
      - name: quantifier_2_units
        type: string
        nullable: true
        source: Relationship.Quantifiers.2.QuantifierUnits
      - name: quantifier_3_method
        type: string
        nullable: true
        source: Relationship.Quantifiers.3.MeasurementMethod
      - name: quantifier_3_amount
        type: string
        nullable: true
        source: Relationship.Quantifiers.3.QuantifierAmount
      - name: quantifier_3_units
        type: string
        nullable: true
        source: Relationship.Quantifiers.3.QuantifierUnits
      - name: quantifier_4_method
        type: string
        nullable: true
        source: Relationship.Quantifiers.4.MeasurementMethod
      - name: quantifier_4_amount
        type: string
        nullable: true
        source: Relationship.Quantifiers.4.QuantifierAmount
      - name: quantifier_4_units
        type: string
        nullable: true
        source: Relationship.Quantifiers.4.QuantifierUnits
      - name: quantifier_5_method
        type: string
        nullable: true
        source: Relationship.Quantifiers.5.MeasurementMethod
      - name: quantifier_5_amount
        type: string
        nullable: true
        source: Relationship.Quantifiers.5.QuantifierAmount
      - name: quantifier_5_units
        type: string
        nullable: true
        source: Relationship.Quantifiers.5.QuantifierUnits
      # --- Registration block: the lifecycle of the relationship RECORD, not of either entity ---
      - name: registration_initial_date
        type: string
        nullable: true
        source: Registration.InitialRegistrationDate
      - name: registration_last_update
        type: string
        nullable: true
        source: Registration.LastUpdateDate
        comment: Last update of the relationship record (ISO 8601) — the computed_delta change key
      - name: registration_status
        type: string
        nullable: true
        source: Registration.RegistrationStatus
        comment: PUBLISHED, LAPSED, PENDING_ARCHIVAL or PENDING_TRANSFER — lifecycle of the relationship record itself
      - name: registration_next_renewal
        type: string
        nullable: true
        source: Registration.NextRenewalDate
      - name: registration_managing_lou
        type: string
        nullable: true
        source: Registration.ManagingLOU
        comment: LEI of the Local Operating Unit maintaining the record
      - name: registration_validation_sources
        type: string
        nullable: true
        source: Registration.ValidationSources
        comment: FULLY_CORROBORATED, PARTIALLY_CORROBORATED or ENTITY_SUPPLIED_ONLY
      - name: registration_validation_documents
        type: string
        nullable: true
        source: Registration.ValidationDocuments
      - name: registration_validation_reference
        type: string
        nullable: true
        source: Registration.ValidationReference

    download:
      bulkDownload: gleif_rr_golden_copy

    source:
      type: http
      url: "https://goldencopy.gleif.org/api/v2/golden-copies/publishes/rr/latest.csv"
      method: GET
      extractPattern: "*.csv"
      incremental:
        # computed_delta change key: only rows whose registration_last_update exceeds the stored
        # high-water mark are kept and appended.
        dateField: registration_last_update
      response:
        format: csv
      rateLimit:
        requestsPerSecond: 1.0
        maxRetries: 3
      rawCache:
        enabled: true

    dimensions:
      type:
        - gleif_relationships

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        batchPartitionColumns: [type]
        overwritePartitions: false   # APPEND the computed_delta rows; ownership history is the point
        runMaintenance: true
        snapshotRetentionDays: 1
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ==========================================================================
  # SEC COMPANY TICKERS — Active US exchange-listed SEC filers
  # ==========================================================================
  - name: sec_company_tickers
    pattern: "type=sec_company_tickers.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR

    comment: >
      SEC EDGAR company ticker mapping: cik, ticker, title (registered company
      name), and as_of (the UTC ingest date). ~10,000 active US exchange-listed
      companies, sourced from the SEC EDGAR company_tickers.json file (updated
      daily). Each run stamps a fresh as_of snapshot, so grouping by as_of
      recovers ticker/name history over time. Feeds the ticker dimension for
      figi_instruments — enables the full chain LEI → CIK → ticker → FIGI within
      the ref schema with no dependency on other schemas.
      Source: https://www.sec.gov/files/company_tickers.json

    columns:
      - name: cik
        type: string
        nullable: false
        comment: SEC Central Index Key (plain numeric string, matches gleif_cik_mapping.cik)
      - name: ticker
        type: string
        nullable: false
        comment: Exchange ticker symbol
      - name: title
        type: string
        nullable: true
        comment: Company name as registered with SEC
      # Point-in-time source with NO per-record updated_at: a computed column stamps the ingest
      # date (UTC today) so every snapshot carries its own history axis (group by as_of).
      # CURRENT_DATE is evaluated by DuckDB in the materialize SELECT and by the Java fallback
      # evaluator (IcebergMaterializationWriter.evaluateExpression date-function support).
      - name: as_of
        type: date
        nullable: false
        expression: 'CURRENT_DATE'
        comment: Ingest date this snapshot was materialized (UTC today; group by for history)

    source:
      type: http
      url: "https://www.sec.gov/files/company_tickers.json"
      method: GET
      headers:
        User-Agent: "govdata-etl kennethstott@gmail.com"
      response:
        format: json
      rateLimit:
        requestsPerSecond: 0.2
        maxRetries: 3
      rawCache:
        enabled: true

    hooks:
      responseTransformer: "org.apache.calcite.adapter.govdata.ref.SecCompanyTickersTransformer"

    dimensions:
      type:
        - sec_company_tickers
      month: ["${GOVDATA_CURRENT_MONTH:12}"]

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type, as_of]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        batchPartitionColumns: [type, as_of]
        # as_of is a partition key, so replace-partitions is scoped to today's snapshot: a re-run
        # the same day replaces only as_of=today (idempotent), while prior days' partitions are
        # preserved — the table accumulates a per-day history keyed by as_of.
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ==========================================================================
  # FIGI INSTRUMENTS — OpenFIGI instrument identifiers
  # ==========================================================================
  - name: figi_instruments
    freshness:
      type: hash
    pattern: "type=figi_instruments.parquet"
    partitions:
