        - fiscal_year

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        batchPartitionColumns: [type]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1

  # ==========================================================================
  # HOLIDAYS — multi-country public holidays (Nager.Date, ~110 countries)
  # ==========================================================================
  - name: holidays
    pattern: "type=holidays/year=*.parquet"
    partitions:
      style: hive
      columnDefinitions:
        - name: type
          type: VARCHAR
        - name: year
          type: VARCHAR

    comment: >
      Public holidays for every country supported by the Nager.Date API (~110),
      one row per (country, holiday) per year. Joins to ref.calendar via
      holiday_date (ISO YYYY-MM-DD) and to ref.countries via country_code (ISO
      3166-1 alpha-2). Generated by HolidaysDataProvider, which pulls
      /api/v3/AvailableCountries then /api/v3/PublicHolidays/{year}/{country}.
      Source: date.nager.at (free, no API key).

    columns:
      - name: country_code
        type: string
        nullable: false
        comment: ISO 3166-1 alpha-2 country code (FK to countries.iso_alpha2)
      - name: country_name
        type: string
        nullable: true
        comment: English country name (Nager AvailableCountries)
      - name: holiday_date
        type: string
        nullable: false
        comment: Holiday date ISO YYYY-MM-DD (FK to calendar.iso_date)
      - name: holiday_name
        type: string
        nullable: false
        comment: Holiday name in English
      - name: local_name
        type: string
        nullable: true
        comment: Holiday name in the local language
      - name: is_global
        type: boolean
        nullable: true
        comment: True when the holiday applies nationwide (not subdivision-scoped)
      - name: is_fixed
        type: boolean
        nullable: true
        comment: True when the holiday falls on the same calendar date every year
      - name: counties
        type: string
        nullable: true
        comment: Comma-separated ISO-3166-2 subdivisions when the holiday is regional (else null)
      - name: launch_year
        type: integer
        nullable: true
        comment: Year the holiday was first observed, when known
      - name: holiday_types
        type: string
        nullable: true
        comment: Comma-separated Nager holiday types (Public, Bank, Optional, ...)

    source:
      type: http
      url: "https://date.nager.at/api/v3/PublicHolidays/{year}/{countryCode}"
      method: GET
      response:
        format: json
      rateLimit:
        requestsPerSecond: 5.0
        maxRetries: 3
      rawCache:
        enabled: false

    hooks:
      dataProvider: "org.apache.calcite.adapter.govdata.ref.HolidaysDataProvider"

    dimensions:
      type:
        - holidays
      year: *ref_year_range

    materialize:
      enabled: true
      format: iceberg
      output:
        pattern: ""
      partition:
        columns: [type, year]
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        batchPartitionColumns: [type, year]
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1
        runCompaction: true
        compactionTargetFileSizeBytes: 134217728
        compactionMinFiles: 5

  # ==========================================================================
  # ENTITY_ORG_BRIDGE — cross-schema org name resolution, tall audit log
  # ==========================================================================
  # No source: block — this table is populated entirely by EntityBridgeListener
  # (org.apache.calcite.adapter.govdata.ref.EntityBridgeListener), wired below via
  # hooks.tableLifecycleListener. It fires once (on this table's afterTable) and writes
  # all four entity-resolution tables in a single pass. See entity-resolution-plan.md
  # (repo root) for the full source registry and matching algorithm this implements.
  - name: entity_org_bridge
    comment: >
      Tall audit/match log: one row per (source_schema, source_table, source_column,
      source_key) org-name mention, carrying its best-match LEI (via GLEIF fuzzy/exact
      match) or SEC CIK (via EIN exact match against sec.filing_metadata.irs_number).
      Rebuilt in full every run by EntityBridgeListener from the org-type source
      registry (fec, patents, sec, health, environment, energy, transport, fiscal).
      Absence of a row below match_score 0.85 is a clean "no confident match" signal,
      not a data gap. Primary consumers should generally query canonical_org_entity
      instead; use this table when the full audit trail or per-source detail matters.

    columns:
      - name: source_schema
        type: string
        nullable: false
        comment: Owning AskAmerica schema, e.g. 'fec', 'patents', 'sec'
      - name: source_table
        type: string
        nullable: false
        comment: Source table name, e.g. 'committees', 'patent_assignees'
      - name: source_column
        type: string
        nullable: false
        comment: Name column matched, e.g. 'connected_org_name'; disambiguates same-table dual-role columns (eia_coal_mines controller_name vs operator_name)
      - name: source_key
        type: string
        nullable: false
        comment: Registry key_column value; the normalized name itself for unstructured (name-only) sources
      - name: source_name_raw
        type: string
        nullable: true
        comment: Original source name, for audit
      - name: source_name_normalized
        type: string
        nullable: true
        comment: Normalized name (lowercase, punctuation/legal-suffix stripped), for debugging match misses
      - name: lei
        type: string
        nullable: true
        comment: GLEIF Legal Entity Identifier, populated for GLEIF-path matches
      - name: sec_cik
        type: string
        nullable: true
        comment: SEC CIK, populated for EIN-path matches via sec.filing_metadata.irs_number
      - name: gleif_legal_name
        type: string
        nullable: true
        comment: Denormalized from ref.gleif_entities, avoids a join for the common case
      - name: match_method
        type: string
        nullable: false
        comment: exact_ein | exact_normalized | fuzzy
      - name: match_confidence
        type: string
        nullable: false
        comment: high | low (fuzzy only; exact is always implicitly high)
      - name: match_score
        type: double
        nullable: false
        comment: 1.0 for exact; raw jaro_winkler_similarity for fuzzy
      - name: match_run_id
        type: string
        nullable: false
        comment: ISO timestamp of the build run, so bridge quality is diffable across reruns

    hooks:
      # enabled: true is REQUIRED here, not optional — SchemaConfig.fromMap's source-less-table
      # pre-filter (SchemaConfig.java:262-275) checks this raw map key directly, with no
      # default-true fallback, before EtlPipelineConfig/HooksConfig parsing ever runs. Without it
      # this table is silently dropped from SchemaLifecycleProcessor's table list entirely — no
      # error, no log line — and tableLifecycleListener never fires. Confirmed live: omitting this
      # key excluded entity_org_bridge from a real 17-table processing run (18 declared, 17 seen).
      enabled: true
      tableLifecycleListener: "org.apache.calcite.adapter.govdata.ref.EntityBridgeListener"

    materialize:
      enabled: true
      format: iceberg
      # targetTableId is set explicitly: the config.getName()-fallback that normally
      # supplies it lives in EtlPipeline (EtlPipeline.java:685-699), which only runs for
      # tables with a source: block. This table has none — EntityBridgeListener writes it
      # directly via MaterializationWriterFactory, so the fallback path never executes.
      targetTableId: entity_org_bridge
      output:
        pattern: ""
      partition:
        columns: []
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1

  # ==========================================================================
  # ENTITY_PERSON_BRIDGE — cross-schema individual name resolution, tall pairwise log
  # ==========================================================================
  # No source: block — populated by EntityBridgeListener alongside entity_org_bridge
  # (same run, same listener instance). See entity-resolution-plan.md.
  - name: entity_person_bridge
    comment: >
      Tall N-way pairwise person-match log across person-type sources (fec.candidates,
      sec.insider_transactions individual-type rows, health.cms_open_payments,
      transport.faa_aircraft_registry individual-type registrants). One row per matched
      pair of source entities; only holds rows where a match was found — most people
      known to one source are never in another, so a "no match" majority is expected
      and not written. A person appearing in 3+ sources yields multiple pairwise rows
      rather than one N-ary row. Rebuilt in full every run.

    columns:
      - name: source_a_schema
        type: string
        nullable: false
        comment: First side of the match — owning schema
      - name: source_a_table
        type: string
        nullable: false
        comment: First side of the match — source table
      - name: source_a_key
        type: string
        nullable: false
        comment: First side of the match — registry key_column value
      - name: source_a_name_raw
        type: string
        nullable: true
        comment: First side of the match — original raw name
      - name: source_b_schema
        type: string
        nullable: false
        comment: Second side of the match — owning schema
      - name: source_b_table
        type: string
        nullable: false
        comment: Second side of the match — source table
      - name: source_b_key
        type: string
        nullable: false
        comment: Second side of the match — registry key_column value
      - name: source_b_name_raw
        type: string
        nullable: true
        comment: Second side of the match — original raw name
      - name: match_method
        type: string
        nullable: false
        comment: exact_normalized | fuzzy_first_name
      - name: match_confidence
        type: string
        nullable: false
        comment: high | low — low is never silently promoted
      - name: match_score
        type: double
        nullable: false
        comment: First-name jaro_winkler_similarity for fuzzy rows; 1.0 for exact
      - name: match_run_id
        type: string
        nullable: false
        comment: ISO timestamp, diffable across reruns

    hooks:
      enabled: true

    materialize:
      enabled: true
      format: iceberg
      targetTableId: entity_person_bridge
      output:
        pattern: ""
      partition:
        columns: []
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1

