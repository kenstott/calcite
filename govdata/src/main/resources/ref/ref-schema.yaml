  # ==========================================================================
  # VECTORIZED_CHUNKS — cross-schema semantic-search text index (row-concat mode)
  # ==========================================================================
  # See semantic-search-plan.md "Promoting vectorized_chunks" / "Storage shape". This is
  # a NEW table, not yet the sec.vectorized_chunks promotion described there -- that move
  # (renaming/relocating SEC's existing 6.4M-row document-chunk table here, and updating
  # the ~24 files that reference it) is separate, higher-risk work requiring its own
  # go-ahead. This table currently holds only row-concat-mode content (entity-grain
  # dimension tables from the v1 registry, e.g. ref.naics); source_type will grow
  # document-blob values (patent_claim, ntsb_probable_cause, etc.) and cik/accession_number
  # columns once SEC's content actually migrates in.
  #
  # No source: block -- like canonical_org_entity/canonical_person_entity above, this is
  # populated by an external writer (a row-concat materializer), not standard ETL fetch.
  - name: vectorized_chunks
    comment: >
      Cross-schema semantic-search text index. One row per chunk of an included source
      row's concatenated string columns (source_type: row_concat) or, for document-blob
      sources once added, one row per document-chunker chunk. Generalized key
      (source_schema, source_table, stringified_fk, sequence) works for any source with
      zero schema change; the wide per-source FK columns below are convenience only.
      Codes (the actual search vectors) live separately in the Hive-partitioned
      vectorized_chunk_codes dataset, keyed by the same chunk_id — see
      file/.../similarity/SemanticSearch.java.

    columns:
      - name: chunk_id
        type: string
        nullable: false
        comment: >
          Stored convenience unique string, not a PK component -- '<source_schema>:
          <source_table>:<stringified_fk>:<sequence>'. The join key back from
          vectorized_chunk_codes (see SemanticSearch.java); the real PK is the
          4-tuple below.
      - name: source_schema
        type: string
        nullable: false
        comment: Owning schema of the source row, e.g. 'ref', 'patents', 'fec'
      - name: source_table
        type: string
        nullable: false
        comment: Source table name within source_schema
      - name: stringified_fk
        type: string
        nullable: false
        comment: >
          The source row's own primary key, stringified (handles composite/non-string
          PKs uniformly). The generic cross-schema fallback identifier -- works for a
          28th source added tomorrow with no schema change.
      - name: sequence
        type: integer
        nullable: false
        comment: Order within this source row's chunks (0 for a row-concat text that fit in one chunk)
      - name: source_type
        type: string
        nullable: false
        comment: "'row_concat' for the naive per-row chunker; document-blob sources add their own values, e.g. 'nist_control_description', 'cis_control_description', 'owasp_entry_overview' (see ChunkOrganizer.java)"
      - name: chunk_text
        type: string
        nullable: false
        comment: "The chunk's text -- for row_concat, the delimited 'col: value | col: value' concatenation"
      - name: enriched_text
        type: string
        nullable: true
        comment: Normalized/context-tagged text for embedding; mirrors chunk_text for row_concat (no TextNormalizer pass) unless that's shown to help retrieval
      - name: section
        type: string
        nullable: true
        comment: Document-structure column, populated only for document-blob sources; null for row_concat
      - name: subsection
        type: string
        nullable: true
        comment: Document-structure column, populated only for document-blob sources; null for row_concat
      - name: section_path
        type: string
        nullable: true
        comment: Document-structure column, populated only for document-blob sources; null for row_concat
      - name: paragraph_continuation
        type: boolean
        nullable: true
        comment: Document-structure column, populated only for document-blob sources; null for row_concat
      - name: speaker_name
        type: string
        nullable: true
        comment: Document-structure column (earnings-call sources); null for row_concat
      - name: speaker_role
        type: string
        nullable: true
        comment: Document-structure column (earnings-call sources); null for row_concat
      - name: exhibit_number
        type: string
        nullable: true
        comment: Document-structure column (SEC exhibit sources); null for row_concat
      - name: financial_concepts
        type: string
        nullable: true
        comment: Document-structure column (SEC/XBRL sources); null for row_concat
      - name: paragraph_number
        type: integer
        nullable: true
        comment: Document-structure column, populated only for document-blob sources; null for row_concat
      # Wide per-source FK columns: one nullable column per included source table,
      # matching that table's own PK shape, populated only on rows from that table.
      # Mechanically generated per source at build time, not exhaustively hand-curated --
      # only the sources actually onboarded so far get a column.
      - name: ref_naics_code
        type: string
        nullable: true
        comment: Populated when source_schema/source_table = 'ref'/'naics'; FK to ref.naics.naics_code
      - name: fedregister_document_number
        type: string
        nullable: true
        comment: >
          Populated when source_schema/source_table = 'fedregister'/'fr_documents'; FK to
          fedregister.fr_documents.document_number. Cross-schema source, same generalized
          key mechanism as the ref-local ones above.

    hooks:
      # enabled: true is REQUIRED here, not optional -- see entity_org_bridge above for why
      # (SchemaConfig.fromMap's source-less-table pre-filter checks this raw map key
      # directly; omitting it silently drops this table from processing entirely).
      enabled: true
      tableLifecycleListener: "org.apache.calcite.adapter.govdata.ref.ChunkOrganizer"

    # Deliberately UNPARTITIONED, not partitioned by source_schema as originally designed.
    # This table has no source: block, so its Iceberg schema is deferred-inferred from
    # whichever partition flushes first (IcebergMaterializationWriter.ensureTableCreated,
    # FILE-186) -- inference does NOT union columns across partitions. With
    # partition.columns: [source_schema], the first-flushing source_schema's row shape
    # (e.g. plain row-concat rows with no paragraph_continuation) silently fixed the whole
    # table's schema forever; every other source_schema's columns not in that first shape
    # were dropped on write with no error. Verified live: fedregister_document_number and
    # paragraph_continuation were both silently missing from the materialized table.
    # canonical_org_entity/canonical_person_entity (also deferred-schema, also carrying
    # columns that vary by source) hit the same shape-varies-per-row problem and are
    # unpartitioned for exactly this reason -- matching that precedent here fixes it, since
    # ChunkOrganizer always writes the complete current picture in one writeBatch call
    # anyway (overwritePartitions: true on an empty partition list = full-table replace
    # each run, same semantics those tables already rely on).
    materialize:
      enabled: true
      format: iceberg
      targetTableId: vectorized_chunks
      output:
        pattern: ""
      partition:
        columns: []
      options:
        compression: snappy
        batchSize: 50000
        stagingMode: local
      iceberg:
        <<: *compaction_defaults
        catalogType: hadoop
        overwritePartitions: true
        runMaintenance: true
        snapshotRetentionDays: 1

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:

  entity_org_bridge:
    primaryKey: [source_schema, source_table, source_column, source_key]
    comment: Single best match per source entity, so downstream joins stay unambiguous.
    foreignKeys:
      - columns: [lei]
        targetTable: gleif_entities
        targetColumns: [lei]
        comment: GLEIF-path matches (nullable — many bridge rows have no LEI match)
      - columns: [sec_cik]
        targetSchema: "${SEC_SCHEMA_NAME:sec}"
        targetTable: filings
        targetColumns: [cik]
        comment: EIN-path matches (nullable — most bridge rows have no EIN match)

  entity_person_bridge:
    primaryKey: [source_a_schema, source_a_table, source_a_key, source_b_schema, source_b_table, source_b_key]

  canonical_org_entity:
    primaryKey: [canonical_entity_id]
    foreignKeys:
      - columns: [lei]
        targetTable: gleif_entities
        targetColumns: [lei]

  canonical_person_entity:
    primaryKey: [canonical_entity_id]

  naics:
    primaryKey: [naics_code]
    comment: NAICS code is the canonical FK target for naics_code across schemas.

  naics_vintage:
    primaryKey: [vintage, naics_code]
    comment: One code per edition; (vintage, naics_code) is unique. Period-correct lookup table.

  naics_vintage_map:
    primaryKey: [data_year]
    comment: Data-year to NAICS edition; naics_vintage matches ref.naics_vintage.vintage.

  sic:
    primaryKey: [sic_code]
    comment: 4-digit SIC code; FK target for sec.filing_metadata.sic_code.

  currencies:
    primaryKey: [currency_code]
    comment: ISO 4217 code; FK target for ref.countries.currency_code.

  calendar:
    primaryKey: [type, date_key]
    unique:
      # Every full-date representation is unique per day, so each is a valid FK
      # target for date columns stored in that form across schemas.
      - [date_key]
      - [iso_date]
      - [basic_iso]
      - [iso_ordinal]
      - [iso_week_date]
      - [epoch_day]
    foreignKeys:
      - columns: [fiscal_year]
        targetTable: fiscal_year
        targetColumns: [fiscal_year]
        comment: US federal fiscal year the day belongs to

  fiscal_year:
    primaryKey: [type, fiscal_year]
    unique:
      # fiscal_year is globally unique; declared so calendar.fiscal_year can FK it.
      - [fiscal_year]
    comment: US federal fiscal-year dimension; FK target for fiscal_year across schemas.

  holidays:
    primaryKey: [type, year, country_code, holiday_date, holiday_name]
    foreignKeys:
      - columns: [country_code]
        targetTable: countries
        targetColumns: [iso_alpha2]
        comment: ISO 3166-1 alpha-2 country of the holiday
      - columns: [holiday_date]
        targetTable: calendar
        targetColumns: [iso_date]
        comment: Holiday date joins the ref.calendar spine

  countries:
    primaryKey: [type, census_cty_code]
    unique:
      # ISO alpha-3 is a globally unique country identifier; declared unique so it
      # is a valid FK target (e.g. health.who_gho_indicators.country_code).
      - [iso_alpha3]
      # ISO alpha-2 is likewise globally unique; declared so the inbound alpha-2 FKs
      # render as real edges (gleif_entities HQ/registered country, ref.holidays).
      - [iso_alpha2]
    foreignKeys:
      - columns: [currency_code]
        targetTable: currencies
        targetColumns: [currency_code]
        comment: ISO 4217 currency of the country (null/aggregate rows excluded by nullability)

  gleif_entities:
    primaryKey: [type, lei]
    foreignKeys:
      - columns: [registration_authority_entity_id]
        targetSchema: "${SEC_SCHEMA_NAME:sec}"
        targetTable: filings
        targetColumns: [cik]
        comment: Links GLEIF entities registered with SEC (RA000602) to SEC filings
      - columns: [headquarters_country]
        targetTable: countries
        targetColumns: [iso_alpha2]
        comment: Links HQ country (ISO 3166-1 alpha-2) to country reference
      - columns: [registered_country]
        targetTable: countries
        targetColumns: [iso_alpha2]
        comment: Links legal-registration country (ISO 3166-1 alpha-2) to country reference

  gleif_cik_mapping:
    primaryKey: [type, lei]
    foreignKeys:
      - columns: [lei]
        targetTable: gleif_entities
        targetColumns: [lei]
        comment: Links CIK-LEI bridge record to full GLEIF entity record
      - columns: [cik]
        targetSchema: "${SEC_SCHEMA_NAME:sec}"
        targetTable: filings
        targetColumns: [cik]

  gleif_relationships:
    # registration_last_update is part of the key because the table is an append-only changelog: a
    # given (start node, type) edge appears once per publish in which it was restated. Within a
    # single publish (start_node_id, relationship_type) is unique — verified on the 2026-07-31
    # golden copy: 482,849 rows, zero duplicate (start_node_id, relationship_type) pairs.
    primaryKey: [type, start_node_id, relationship_type, registration_last_update]
    foreignKeys:
      - columns: [start_node_id]
        targetTable: gleif_entities
        targetColumns: [lei]
        comment: The subordinate end of the edge — subsidiary, sub-fund, branch or feeder
      - columns: [end_node_id]
        targetTable: gleif_entities
        targetColumns: [lei]
        comment: The superior end of the edge — consolidating parent, fund manager or umbrella
      - columns: [registration_managing_lou]
        targetTable: gleif_entities
        targetColumns: [lei]
        comment: LOUs are themselves LEI-registered; links the record's maintainer to its entity

  sec_company_tickers:
    # A cik is NOT unique within an as_of on its own -- a company with multiple share
    # classes/ticker symbols (e.g. Alphabet: GOOGL/GOOG/GOOGM/GOOGN, all cik 1652044) gets
    # one row per ticker. Verified live: (type, as_of, cik) alone collides on 2,409 of
    # 10,415 rows; (type, as_of, cik, ticker) is fully unique. Found via a real PK
    # violation surfaced by ChunkOrganizer's stringified_fk derivation, which follows
    # this declaration mechanically.
    primaryKey: [type, as_of, cik, ticker]

  figi_instruments:
    primaryKey: [type, figi]

  vectorized_chunks:
    primaryKey: [source_schema, source_table, stringified_fk, sequence]
    foreignKeys:
      - columns: [ref_naics_code]
        targetTable: naics
        targetColumns: [naics_code]
        comment: Populated when source_schema/source_table = 'ref'/'naics'
      - columns: [fedregister_document_number]
        targetSchema: "${FEDREGISTER_SCHEMA_NAME:fedregister}"
        targetTable: fr_documents
        targetColumns: [document_number]
        comment: Populated when source_schema/source_table = 'fedregister'/'fr_documents'

# ============================================================================
# VIEWS
# ============================================================================

views:

  - name: ticker_instrument_map
    comment: >
      Connects OpenFIGI instruments to SEC filers via shared ticker symbol.
      One row per ticker+figi combination — enables instrument-to-company resolution
      and cross-referencing FIGI, CIK, and company name for equity analysis.
      Self-contained within the ref schema; no dependency on other schemas.
    sql: >
      SELECT
        fi.ticker,
        fi.figi,
        fi.name          AS instrument_name,
        fi.exchange_code,
        fi.market_sector,
        fi.security_type,
        sct.cik,
        sct.title        AS company_name
      FROM figi_instruments fi
      LEFT JOIN sec_company_tickers sct ON fi.ticker = sct.ticker
      WHERE fi.ticker IS NOT NULL

  - name: current_naics
    comment: >
      Current NAICS edition — the latest vintage in naics_vintage. Tracks the newest loaded
      edition automatically (ref.naics remains the materialized current-edition FK spine; use
      this view when working from the vintage table). See naics_vintage_map for period-correct
      (non-current) edition selection.
    sql: >
      SELECT vintage, naics_code, naics_title, level
      FROM naics_vintage
      WHERE vintage = (SELECT MAX(vintage) FROM naics_vintage)

  - name: current_gleif_entities
    comment: >
      Current-state GLEIF entities: the latest row per LEI (max last_update) from the
      append-only gleif_entities changelog. Use for "as-now" lookups; query gleif_entities
      directly (group by last_update) for point-in-time / history.
    sql: >
      SELECT e.*
      FROM gleif_entities e
      JOIN (
        SELECT lei, MAX(last_update) AS max_last_update
        FROM gleif_entities
        GROUP BY lei
      ) latest ON e.lei = latest.lei AND e.last_update = latest.max_last_update

  - name: current_gleif_relationships
    comment: >
      Current-state GLEIF relationships: the latest row per (start_node_id, relationship_type)
      from the append-only gleif_relationships changelog, raw source columns unchanged. Use for
      "as-now" walks; query gleif_relationships directly (group by registration_last_update) to
      see when an edge changed.
    sql: >
      SELECT r.*
      FROM gleif_relationships r
      JOIN (
        SELECT start_node_id, relationship_type,
               MAX(registration_last_update) AS max_last_update
        FROM gleif_relationships
        GROUP BY start_node_id, relationship_type
      ) latest ON r.start_node_id = latest.start_node_id
              AND r.relationship_type = latest.relationship_type
              AND r.registration_last_update = latest.max_last_update

  - name: current_gleif_parents
    comment: >
      The convenience shape over the raw relationship rows — this is where the repeating Period /
      Qualifier / Quantifier slots are collapsed, deliberately in SQL rather than baked into the
      stored table, so the selection rules can change without a re-ingest. Restricted to the two
      ownership types (fund, branch and feeder edges excluded), to ACTIVE relationships whose
      record is still PUBLISHED, with legal name and jurisdiction resolved on both ends. One row
      per (child, IS_DIRECTLY_CONSOLIDATED_BY | IS_ULTIMATELY_CONSOLIDATED_BY) — an entity can
      appear twice, once for its immediate parent and once for the top of its group. Join
      child_lei or parent_lei to gleif_cik_mapping to reach SEC filers.
    sql: >
      SELECT r.start_node_id AS child_lei, ce.legal_name AS child_legal_name,
             ce.jurisdiction AS child_jurisdiction, r.relationship_type,
             r.end_node_id AS parent_lei, pe.legal_name AS parent_legal_name,
             pe.jurisdiction AS parent_jurisdiction,
             CASE WHEN r.period_1_type = 'RELATIONSHIP_PERIOD' THEN r.period_1_start_date
                  WHEN r.period_2_type = 'RELATIONSHIP_PERIOD' THEN r.period_2_start_date
                  WHEN r.period_3_type = 'RELATIONSHIP_PERIOD' THEN r.period_3_start_date
                  WHEN r.period_4_type = 'RELATIONSHIP_PERIOD' THEN r.period_4_start_date
                  WHEN r.period_5_type = 'RELATIONSHIP_PERIOD' THEN r.period_5_start_date
             END AS relationship_start_date,
             CASE WHEN r.period_1_type = 'ACCOUNTING_PERIOD' THEN r.period_1_end_date
                  WHEN r.period_2_type = 'ACCOUNTING_PERIOD' THEN r.period_2_end_date
                  WHEN r.period_3_type = 'ACCOUNTING_PERIOD' THEN r.period_3_end_date
                  WHEN r.period_4_type = 'ACCOUNTING_PERIOD' THEN r.period_4_end_date
                  WHEN r.period_5_type = 'ACCOUNTING_PERIOD' THEN r.period_5_end_date
             END AS accounting_period_end_date,
             CASE WHEN r.qualifier_1_dimension = 'ACCOUNTING_STANDARD' THEN r.qualifier_1_category
                  WHEN r.qualifier_2_dimension = 'ACCOUNTING_STANDARD' THEN r.qualifier_2_category
                  WHEN r.qualifier_3_dimension = 'ACCOUNTING_STANDARD' THEN r.qualifier_3_category
                  WHEN r.qualifier_4_dimension = 'ACCOUNTING_STANDARD' THEN r.qualifier_4_category
                  WHEN r.qualifier_5_dimension = 'ACCOUNTING_STANDARD' THEN r.qualifier_5_category
             END AS accounting_standard,
             CASE WHEN r.quantifier_1_units = 'PERCENTAGE'
                  THEN CAST(r.quantifier_1_amount AS DOUBLE) END AS ownership_percentage
      FROM gleif_relationships r
      JOIN (
        SELECT start_node_id, relationship_type,
               MAX(registration_last_update) AS max_last_update
        FROM gleif_relationships
        GROUP BY start_node_id, relationship_type
      ) lr ON r.start_node_id = lr.start_node_id
          AND r.relationship_type = lr.relationship_type
          AND r.registration_last_update = lr.max_last_update
      LEFT JOIN (
        SELECT e.lei, e.legal_name, e.jurisdiction
        FROM gleif_entities e
        JOIN (
          SELECT lei, MAX(last_update) AS max_last_update FROM gleif_entities GROUP BY lei
        ) le ON e.lei = le.lei AND e.last_update = le.max_last_update
      ) ce ON r.start_node_id = ce.lei
      LEFT JOIN (
        SELECT e.lei, e.legal_name, e.jurisdiction
        FROM gleif_entities e
        JOIN (
          SELECT lei, MAX(last_update) AS max_last_update FROM gleif_entities GROUP BY lei
        ) le ON e.lei = le.lei AND e.last_update = le.max_last_update
      ) pe ON r.end_node_id = pe.lei
      WHERE r.relationship_type IN ('IS_DIRECTLY_CONSOLIDATED_BY', 'IS_ULTIMATELY_CONSOLIDATED_BY')
        AND r.relationship_status = 'ACTIVE'
        AND r.registration_status = 'PUBLISHED'
